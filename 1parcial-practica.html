  return partes.map((p,i) => {
    if(i % 2 === 1) return "<pre><code>"+esc(p.replace(/\n$/,""))+"</code></pre>";
    return p.split(/\n{2,}/).map(x => x.trim()).filter(Boolean).map(x => "<p>"+inline(x).replace(/\n/g,"<br>")+"</p>").join("");
  }).join("");
}
function mezclar(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const LETRAS = ["A","B","C","D"];
function cuando(dias){
  if(dias <= 0) return "vuelve hoy";
  if(dias === 1) return "vuelve mañana";
  return "vuelve en " + dias + " días";
}
const pill = b => `<span class="pill" style="--col:var(--c${b});--tc:var(--t${b})">${NOMBRE_CAJA[b]}</span>`;

/* ---------- conteos ---------- */
function conteoCajas(filtro){
  const c = [0,0,0,0,0,0];
  for(const p of DATOS.preguntas){ if(filtro != null && p.t !== filtro) continue; c[ficha(p.id).b]++; }
  return c;
}
function pendientesHoy(filtro){
  const ahora = Date.now(); let n = 0;
  for(const p of DATOS.preguntas){
    if(filtro != null && p.t !== filtro) continue;
    const f = ficha(p.id); if(f.b > 0 && f.due <= ahora) n++;
  }
  return n;
}
function dominio(t){
  const c = conteoCajas(t); const total = c.reduce((a,b)=>a+b,0);
  let peso = 0; for(let b=1;b<=5;b++) peso += c[b]*b/5;
  return {c, total, pct: Math.round(100*peso/total)};
}

/* ---------- portada ---------- */
function inicio(){
  sesion = null; detenerReloj();
  const c = conteoCajas(null), max = Math.max(...c, 1);
  const hoy = pendientesHoy(null), nuevas = c[0];
  const rotulos = ["Nuevas","1","2","3","4","5"];
  const lema = hoy > 0 ? `Tenés ${hoy} ${hoy === 1 ? "pregunta" : "preguntas"} para repasar hoy.`
             : nuevas === DATOS.preguntas.length ? `${DATOS.preguntas.length} preguntas de las clases, en ${DATOS.temas.length} temas. Empezá por una ronda.`
             : nuevas > 0 ? `Nada pendiente para hoy. Sumá preguntas nuevas.` : `Viste todo el banco. Podés adelantar repasos.`;
  $("#app").innerHTML = `
  <header class="hero">
    <div class="hero-in">
      <h1>Fichero de Programación Web</h1>
      <p>${lema}</p>
      <div class="hero-acciones">
        <button class="btn primario" id="b-practicar">Practicar ${TAM_SESION} preguntas</button>
        <button class="btn" id="b-simulacro">Simulacro de examen</button>
      </div>
      <p class="hero-nota">El simulacro tiene ${DATOS.temas.length*POR_TEMA_SIMULACRO} preguntas, 2 por tema, y dura ${MIN_SIMULACRO} minutos.</p>
    </div>
  </header>

  <section class="bloque" aria-labelledby="t-fichero">
    <div class="bloque-cab"><h2 id="t-fichero">Tu fichero</h2><span>${DATOS.preguntas.length - nuevas} de ${DATOS.preguntas.length} vistas</span></div>
    <div class="cajas" aria-hidden="true">
      ${c.map((n,i)=>`<div class="caja"><span class="num">${n}</span><div class="col" style="--col:var(--c${i});height:${n ? Math.max(4, 70*Math.sqrt(n/max)) : 0}%"></div></div>`).join("")}
    </div>
    <div class="rotulos" aria-hidden="true">${rotulos.map(r=>`<span>${r === "Nuevas" ? r : "Caja " + r}</span>`).join("")}</div>
    <p class="oculto">${c.map((n,i)=>`${NOMBRE_CAJA[i]}: ${n}.`).join(" ")}</p>
    <p class="leyenda">Si acertás con seguridad, la pregunta sube de caja y tarda más en volver. Si acertás dudando, se queda donde está. Si te equivocás o adivinás, vuelve a la caja 1.</p>
  </section>

  <section class="bloque" aria-labelledby="t-temas">
    <div class="bloque-cab"><h2 id="t-temas">Temas</h2><span>Tocá uno para practicarlo</span></div>
    <div class="temas">
    ${DATOS.temas.map((t,i)=>{
      const d = dominio(i);
      const seg = d.c.map((n,b)=> b===0 || n===0 ? "" : `<i style="width:${100*n/d.total}%;background:var(--c${b})"></i>`).join("");
      return `<button class="tema" data-t="${i}"><span class="tnombre">${inline(t)}</span><span class="tpct">${d.pct}%</span><span class="barra" aria-hidden="true">${seg}</span></button>`;
    }).join("")}
    </div>
  </section>

  <footer class="pie">
    <span>Tu progreso se guarda solo en este navegador.</span>
    <button class="enlace" id="b-borrar">Borrar mi progreso</button>
  </footer>`;
  $("#b-practicar").onclick = () => empezarPractica(null);
  $("#b-simulacro").onclick = empezarSimulacro;
  document.querySelectorAll(".tema").forEach(b => b.onclick = () => empezarPractica(+b.dataset.t));
  $("#b-borrar").onclick = () => {
    if(confirm("¿Borrar todo tu progreso? Todas las preguntas vuelven a ser nuevas.")){ est = {v:1,q:{}}; guardar(); inicio(); }
  };
  window.scrollTo(0,0);
}

/* ---------- práctica ---------- */
let sesion = null;

function elegirPreguntas(filtro){
  const ahora = Date.now();
  const pool = DATOS.preguntas.filter(p => filtro == null || p.t === filtro);
  const orden = (a,b) => ficha(a.id).b - ficha(b.id).b || ficha(a.id).due - ficha(b.id).due;
  let elegidas = pool.filter(p => { const f = ficha(p.id); return f.b > 0 && f.due <= ahora; }).sort(orden).slice(0, TAM_SESION);
  if(elegidas.length < TAM_SESION)
    elegidas = elegidas.concat(mezclar(pool.filter(p => ficha(p.id).b === 0)).slice(0, TAM_SESION - elegidas.length));
  if(elegidas.length < TAM_SESION){
    const usadas = new Set(elegidas.map(p => p.id));
    elegidas = elegidas.concat(pool.filter(p => !usadas.has(p.id)).sort(orden).slice(0, TAM_SESION - elegidas.length));
  }
  return mezclar(elegidas);
}

function empezarPractica(filtro){
  sesion = {modo:"practica", filtro, lista:elegirPreguntas(filtro), i:0, resultados:[], elegida:null, fase:"elegir", orden:null};
  mostrarPregunta();
}

function barraSesion(izq, der, pct){
  return `<div class="barra-sesion">${izq}<div class="avance" aria-hidden="true"><i style="width:${pct}%"></i></div>${der}</div>`;
}

function mostrarPregunta(){
  const s = sesion, p = s.lista[s.i];
  s.elegida = null; s.fase = "elegir";
  s.orden = mezclar(p.o.map((_,k)=>k));
  const f = ficha(p.id);
  $("#app").innerHTML = `
  ${barraSesion(`<button class="cerrar" id="b-salir" aria-label="Terminar la ronda">✕</button>`, `<span class="contador">${s.i+1}/${s.lista.length}</span>`, 100*s.i/s.lista.length)}
  <article class="tarjeta">
    <div class="meta"><span class="tema-nombre">${inline(DATOS.temas[p.t])}</span>${pill(f.b)}</div>
    <div class="enunciado">${bloque(p.q)}</div>
    <div class="opciones" role="group" aria-label="Opciones">
      ${s.orden.map((k,pos)=>`<button class="op" data-k="${k}" aria-pressed="false"><span class="letra">${LETRAS[pos]}</span><span>${inline(p.o[k])}</span></button>`).join("")}
    </div>
    <div class="confianza oculto" id="confianza">
      <p>¿Qué tan seguro estás?</p>
      <div class="conf-btns">
        <button data-c="seguro"><b>Seguro</b><span>Lo sé</span></button>
        <button data-c="dudo"><b>Dudo</b><span>Creo que sí</span></button>
        <button data-c="adivine"><b>Adiviné</b><span>Ni idea</span></button>
      </div>
    </div>
    <div id="feedback"></div>
  </article>
  <p class="teclas">Teclado: 1, 2 o 3 para elegir; después 1, 2 o 3 para la seguridad; Enter para seguir.</p>`;
  $("#b-salir").onclick = terminarPractica;
  document.querySelectorAll(".op").forEach(b => b.onclick = () => elegir(+b.dataset.k));
  document.querySelectorAll(".conf-btns button").forEach(b => b.onclick = () => confirmar(b.dataset.c));
  window.scrollTo(0,0);
}

function elegir(k){
  const s = sesion; if(!s || s.fase === "hecho") return;
  s.elegida = k; s.fase = "confianza";
  document.querySelectorAll(".op").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.k === k)));
  const conf = $("#confianza"); conf.classList.remove("oculto");
  const r = conf.getBoundingClientRect && conf.getBoundingClientRect();
  if(r && r.bottom > window.innerHeight) conf.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function confirmar(conf){
  const s = sesion; if(!s || s.fase !== "confianza") return;
  const p = s.lista[s.i], f = Object.assign({}, ficha(p.id));
  const acierto = s.elegida === p.c;
  const antes = f.b;
  if(acierto && conf === "seguro") f.b = Math.min(5, Math.max(f.b,1) + 1);
  else if(acierto && conf === "dudo") f.b = Math.max(f.b, 1);
  else f.b = 1;
  f.due = Date.now() + INTERVALO_DIAS[f.b]*DIA;
  f.vistas++; acierto ? f.ok++ : f.mal++;
  est.q[p.id] = f; guardar();
  s.resultados.push({id:p.id, elegida:s.elegida, acierto, conf, antes, despues:f.b});
  s.fase = "hecho";

  document.querySelectorAll(".op").forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if(k === p.c) b.classList.add("es-bien");
    else if(k === s.elegida) b.classList.add("es-mal");
    else b.classList.add("atenuada");
  });
  $("#confianza").classList.add("oculto");

  let nota = "";
  if(acierto && conf === "dudo") nota = "<p>Como dudaste, la pregunta se queda en su caja hasta que la respondas con seguridad.</p>";
  else if(acierto && conf === "adivine") nota = "<p>Acertaste adivinando. Una respuesta adivinada no cuenta como sabida.</p>";
  else if(!acierto && conf === "seguro") nota = `<p class="aviso">Estabas seguro y era otra: es el error que más conviene repasar.</p>`;
  const correcta = acierto ? "" : `<p class="correcta">La respuesta es: ${inline(p.o[p.c])}</p>`;
  const expl = p.e ? `<p>${inline(p.e)}</p>` : "";
  const mov = f.b !== antes ? `${pill(antes)}<span aria-hidden="true">→</span>${pill(f.b)}` : pill(f.b);
  const ultima = s.i === s.lista.length - 1;
  $("#feedback").innerHTML = `
    <div class="veredicto ${acierto ? "bien" : "mal"}">
      <div class="veredicto-cab"><span class="ico" aria-hidden="true">${acierto ? "✓" : "✕"}</span><strong>${acierto ? "Correcto" : "Incorrecto"}</strong></div>
      ${correcta}${expl}${nota}
      <div class="movimiento">${mov}<span>${cuando(INTERVALO_DIAS[f.b])}</span></div>
    </div>
    <button class="btn primario siguiente" id="b-sig">${ultima ? "Ver resumen" : "Siguiente pregunta"}</button>`;
  $("#b-sig").onclick = siguiente;
  $("#b-sig").focus({preventScroll:true});
}

function siguiente(){
  const s = sesion; if(!s || s.fase !== "hecho") return;
  if(s.i < s.lista.length - 1){ s.i++; mostrarPregunta(); }
  else terminarPractica();
}

function itemError(p, elegida){
  return `<li><div class="q">${bloque(p.q)}</div>
    <p class="r tuya">Tu respuesta: ${elegida === undefined ? "sin responder" : inline(p.o[elegida])}</p>
    <p class="r ok">Correcta: ${inline(p.o[p.c])}</p>
    ${p.e ? `<p class="r exp">${inline(p.e)}</p>` : ""}</li>`;
}

function terminarPractica(){
  const s = sesion; if(!s) return inicio();
  const r = s.resultados;
  if(r.length === 0) return inicio();
  const ok = r.filter(x => x.acierto).length;
  const seguros = r.filter(x => !x.acierto && x.conf === "seguro").length;
  const avanzaron = r.filter(x => x.despues > Math.max(x.antes, 1)).length;
  const errores = r.filter(x => !x.acierto);
  const filtro = s.filtro;
  sesion = null;
  $("#app").innerHTML = `
  <section class="resumen">
    <div class="resumen-hero">
      <h2>Ronda terminada</h2>
      <p class="cifra">${ok}<small> de ${r.length} correctas</small></p>
      <p>${avanzaron === 1 ? "1 pregunta subió" : avanzaron + " preguntas subieron"} de caja.${seguros ? ` En ${seguros === 1 ? "1 respuesta" : seguros + " respuestas"} estabas seguro y te equivocaste.` : ""}</p>
    </div>
    ${errores.length ? `<h3>Para repasar</h3><ul class="lista-errores">${errores.map(x => itemError(PREG.get(x.id), x.elegida)).join("")}</ul>` : `<h3>Sin errores en esta ronda</h3>`}
    <div class="acciones">
      <button class="btn primario" id="b-otra">Otra ronda</button>
      <button class="btn" id="b-inicio">Volver al fichero</button>
    </div>
  </section>`;
  $("#b-otra").onclick = () => empezarPractica(filtro);
  $("#b-inicio").onclick = inicio;
  window.scrollTo(0,0);
}

/* ---------- simulacro ---------- */
let reloj = null;
function detenerReloj(){ if(reloj){ clearInterval(reloj); reloj = null; } }
const fmt = ms => { const t = Math.ceil(ms/1000); return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); };

function empezarSimulacro(){
  let lista = [];
  DATOS.temas.forEach((_,t) => { lista = lista.concat(mezclar(DATOS.preguntas.filter(p => p.t === t)).slice(0, POR_TEMA_SIMULACRO)); });
  lista = mezclar(lista);
  sesion = {modo:"simulacro", lista, i:0, resp:{}, ordenes:lista.map(p => mezclar(p.o.map((_,k)=>k))), fin: Date.now() + MIN_SIMULACRO*60000};
  detenerReloj();
  reloj = setInterval(tic, 1000);
  mostrarSimulacro();
}
function tic(){
  const s = sesion; if(!s || s.modo !== "simulacro") return detenerReloj();
  const resta = Math.max(0, s.fin - Date.now());
  const el = $("#reloj");
  if(el){ el.textContent = fmt(resta); el.classList.toggle("poco", resta < 5*60000); }
  if(resta === 0) entregar();
}

function mostrarSimulacro(){
  const s = sesion, p = s.lista[s.i], orden = s.ordenes[s.i];
  const respondidas = Object.keys(s.resp).length;
  const ultima = s.i === s.lista.length-1;
  $("#app").innerHTML = `
  ${barraSesion(`<button class="cerrar" id="b-salir" aria-label="Abandonar el simulacro">✕</button>`, `<span class="reloj" id="reloj">${fmt(s.fin - Date.now())}</span>`, 100*respondidas/s.lista.length)}
  <article class="tarjeta">
    <div class="meta"><span class="tema-nombre">Pregunta ${s.i+1} de ${s.lista.length}</span><span class="pill" id="n-resp" style="--col:var(--sutil);--tc:var(--secundario)">${respondidas} respondidas</span></div>
    <div class="enunciado">${bloque(p.q)}</div>
    <div class="opciones" role="group" aria-label="Opciones">
      ${orden.map((k,pos)=>`<button class="op" data-k="${k}" aria-pressed="${s.resp[p.id]===k}"><span class="letra">${LETRAS[pos]}</span><span>${inline(p.o[k])}</span></button>`).join("")}
    </div>
    <div class="nav-sim">
      <button class="btn" id="b-ant" ${s.i===0?"disabled":""}>Anterior</button>
      <button class="btn primario" id="b-sig">${ultima?"Entregar":"Siguiente"}</button>
    </div>
    <div class="puntos" aria-label="Ir a una pregunta">
      ${s.lista.map((q,j)=>`<button data-j="${j}" class="${s.resp[q.id]!==undefined?"resp":""} ${j===s.i?"actual":""}" aria-label="Pregunta ${j+1}">${j+1}</button>`).join("")}
    </div>
  </article>
  <p class="teclas">Teclado: 1, 2 o 3 para elegir; flechas para moverte.</p>`;
  tic();
  $("#b-salir").onclick = () => { if(confirm("¿Abandonar el simulacro? No se guarda nada.")) inicio(); };
  document.querySelectorAll(".op").forEach(b => b.onclick = () => {
    s.resp[p.id] = +b.dataset.k;
    document.querySelectorAll(".op").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const punto = document.querySelector(`.puntos button[data-j="${s.i}"]`); if(punto) punto.classList.add("resp");
    const n = Object.keys(s.resp).length;
    $("#n-resp").textContent = n + " respondidas";
    document.querySelector(".avance i").style.width = (100*n/s.lista.length) + "%";
  });
  $("#b-ant").onclick = () => { if(s.i>0){ s.i--; mostrarSimulacro(); } };
  $("#b-sig").onclick = () => {
    if(s.i < s.lista.length-1){ s.i++; mostrarSimulacro(); }
    else {
      const faltan = s.lista.length - Object.keys(s.resp).length;
      if(faltan === 0 || confirm(`Te faltan ${faltan} preguntas. ¿Entregar igual?`)) entregar();
    }
  };
  document.querySelectorAll(".puntos button").forEach(b => b.onclick = () => { s.i = +b.dataset.j; mostrarSimulacro(); });
  window.scrollTo(0,0);
}

function entregar(){
  const s = sesion; if(!s || s.modo !== "simulacro") return;
  detenerReloj();
  const porTema = DATOS.temas.map(() => ({ok:0, n:0}));
  const errores = [];
  let ok = 0;
  for(const p of s.lista){
    const r = s.resp[p.id], acierto = r === p.c;
    porTema[p.t].n++;
    if(acierto){ ok++; porTema[p.t].ok++; }
    else {
      errores.push({p, r});
      const f = Object.assign({}, ficha(p.id));
      f.b = 1; f.due = Date.now(); f.vistas++; f.mal++;
      est.q[p.id] = f;
    }
  }
  guardar();
  const n = s.lista.length, pct = Math.round(100*ok/n);
  sesion = null;
  $("#app").innerHTML = `
  <section class="resumen">
    <div class="resumen-hero">
      <h2>Resultado del simulacro</h2>
      <p class="cifra">${pct}%<small> ${ok} de ${n} correctas</small></p>
      <p>Las preguntas que erraste o dejaste en blanco pasaron a la caja 1.</p>
    </div>
    <h3>Por tema</h3>
    <table class="tabla-temas">
      ${DATOS.temas.map((t,i)=>`<tr class="${porTema[i].ok < porTema[i].n ? "flojo" : ""}"><td>${inline(t)}</td><td>${porTema[i].ok} de ${porTema[i].n}</td></tr>`).join("")}
    </table>
    ${errores.length ? `<h3>Para repasar</h3><ul class="lista-errores">${errores.map(({p,r}) => itemError(p, r)).join("")}</ul>` : ""}
    <div class="acciones">
      <button class="btn primario" id="b-rep">Repasar lo que erraste</button>
      <button class="btn" id="b-inicio">Volver al fichero</button>
    </div>
  </section>`;
  $("#b-rep").onclick = () => empezarPractica(null);
  $("#b-inicio").onclick = inicio;
  window.scrollTo(0,0);
}

/* ---------- teclado ---------- */
document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey || !sesion) return;
  const s = sesion, n = parseInt(e.key, 10);
  if(s.modo === "practica"){
    if(s.fase === "elegir" && n >= 1 && n <= s.orden.length){ elegir(s.orden[n-1]); e.preventDefault(); }
    else if(s.fase === "confianza" && n >= 1 && n <= 3){ confirmar(["seguro","dudo","adivine"][n-1]); e.preventDefault(); }
    else if(s.fase === "hecho" && e.key === "Enter" && document.activeElement?.id !== "b-sig"){ siguiente(); e.preventDefault(); }
  } else if(s.modo === "simulacro"){
    const ops = document.querySelectorAll(".op");
    if(n >= 1 && n <= ops.length){ ops[n-1].click(); e.preventDefault(); }
    else if(e.key === "ArrowRight" && s.i < s.lista.length-1){ s.i++; mostrarSimulacro(); }
    else if(e.key === "ArrowLeft" && s.i > 0){ s.i--; mostrarSimulacro(); }
  }
});

inicio();
</script>
