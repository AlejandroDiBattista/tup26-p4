:root{
  --fondo:#FFFFFF; --superficie:#FFFFFF; --tinta:#0F1420; --secundario:#3F4757; --borde:#E3E6EC; --sutil:#F4F6F9;
  --marca:#FFD60A; --marca-tinta:#0F1420; --foco:#2F66F0;
  --bien:#0E9F57; --bien-fondo:#E6F7EE; --mal:#E0353B; --mal-fondo:#FDECEC;
  --c0:#DDE1E8; --c1:#C2D5FF; --c2:#8FB3FF; --c3:#5B8CFF; --c4:#2F66F0; --c5:#163FB5;
  --t0:#3F4757; --t1:#0F2A6B; --t2:#0F2A6B; --t3:#FFFFFF; --t4:#FFFFFF; --t5:#FFFFFF;
  --texto:"Figtree", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --titulo:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --codigo:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#0C0F15; --superficie:#151A23; --tinta:#F2F4F8; --secundario:#B3BBC9; --borde:#262D3A; --sutil:#1B212C;
    --foco:#7FA3FF; --bien:#3FD18A; --bien-fondo:#10301F; --mal:#FF6B6F; --mal-fondo:#3A1719;
    --c0:#2A3140; --c1:#1E3563; --c2:#23478F; --c3:#2F66F0; --c4:#5B8CFF; --c5:#A9C4FF;
    --t0:#B3BBC9; --t1:#C2D5FF; --t2:#DDE8FF; --t3:#FFFFFF; --t4:#0C0F15; --t5:#0C0F15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fondo:#0C0F15; --superficie:#151A23; --tinta:#F2F4F8; --secundario:#B3BBC9; --borde:#262D3A; --sutil:#1B212C;
  --foco:#7FA3FF; --bien:#3FD18A; --bien-fondo:#10301F; --mal:#FF6B6F; --mal-fondo:#3A1719;
  --c0:#2A3140; --c1:#1E3563; --c2:#23478F; --c3:#2F66F0; --c4:#5B8CFF; --c5:#A9C4FF;
  --t0:#B3BBC9; --t1:#C2D5FF; --t2:#DDE8FF; --t3:#FFFFFF; --t4:#0C0F15; --t5:#0C0F15;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--texto);font-size:1.0625rem;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
main{max-width:46rem;margin:0 auto;padding:0 1.25rem 4rem}
h1,h2,h3{font-family:var(--titulo);line-height:1.05;margin:0}
button{font:inherit;color:inherit}
code{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;font-family:var(--codigo);font-size:.86em;background:var(--sutil);border:1px solid var(--borde);padding:.05em .34em;border-radius:5px;overflow-wrap:anywhere}
pre{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;font-family:var(--codigo);font-size:.9rem;line-height:1.6;background:#0F1420;color:#E8ECF3;border-radius:10px;padding:.9rem 1.1rem;overflow-x:auto;margin:.9rem 0}
pre code{background:none;border:none;padding:0;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.oculto{display:none!important}
.secundario{color:var(--secundario)}

/* ---------- Portada ---------- */
.hero{background:var(--marca);color:var(--marca-tinta);margin:0 calc(50% - 50vw);padding:2.6rem calc(50vw - 50% + 1.25rem) 2.2rem}
.hero-in{max-width:46rem}
.hero h1{font-size:clamp(2.4rem,8vw,3.6rem);font-weight:800;letter-spacing:-.035em;max-width:14ch}
.hero p{margin:.7rem 0 0;font-size:1.1rem;font-weight:500;max-width:36ch}
.hero-acciones{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;border:2px solid var(--tinta);background:transparent;color:var(--tinta);border-radius:999px;padding:.8rem 1.35rem;font-weight:700;font-size:1rem;cursor:pointer;min-height:3.2rem;text-align:center;transition:transform .12s ease, background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primario{background:var(--tinta);color:var(--fondo)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hero .btn{border-color:var(--marca-tinta);color:var(--marca-tinta)}
.hero .btn.primario{background:var(--marca-tinta);color:var(--marca)}
.hero .hero-nota{margin-top:.9rem;font-size:.9rem;font-weight:500;opacity:.8}
.enlace{background:none;border:none;padding:.25rem 0;color:var(--secundario);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.93rem}
.enlace:hover{color:var(--tinta)}

.bloque{margin-top:2.6rem}
.bloque-cab{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:1rem}
.bloque h2{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.bloque-cab span{color:var(--secundario);font-size:.95rem}

/* Fichero: columnas por caja */
.cajas{display:grid;grid-template-columns:repeat(6,1fr);gap:.6rem;align-items:end;height:9rem}
.caja{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0}
.caja .num{font-family:var(--titulo);font-weight:800;font-size:1.35rem;text-align:center;margin-bottom:.3rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.caja .col{background:var(--col);border-radius:8px 8px 3px 3px;min-height:6px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.rotulos{display:grid;grid-template-columns:repeat(6,1fr);gap:.6rem;margin-top:.55rem;border-top:2px solid var(--tinta);padding-top:.5rem}
.rotulos span{text-align:center;font-size:.85rem;font-weight:600;color:var(--secundario)}
.leyenda{margin:1rem 0 0;color:var(--secundario);font-size:.95rem;line-height:1.5;max-width:60ch}

/* Temas */
.temas{border-top:1px solid var(--borde)}
.tema{display:grid;grid-template-columns:1fr auto;gap:.45rem 1rem;align-items:center;width:100%;background:none;border:none;border-bottom:1px solid var(--borde);padding:.9rem .25rem;cursor:pointer;text-align:left;transition:background .15s}
.tema:hover{background:var(--sutil)}
.tnombre{font-weight:600;font-size:1rem}
.tpct{font-family:var(--titulo);font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05rem}
.barra{grid-column:1/-1;height:8px;border-radius:4px;background:var(--c0);overflow:hidden;display:flex;gap:2px}
.barra i{display:block;height:100%}
.pie{margin-top:2.2rem;font-size:.92rem;color:var(--secundario);display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;align-items:center}

/* ---------- Sesión ---------- */
.barra-sesion{position:sticky;top:0;z-index:5;background:var(--fondo);display:flex;align-items:center;gap:1rem;padding:1rem 0 .9rem;margin-bottom:.6rem;top:env(safe-area-inset-top,0px)}
.avance{flex:1;height:10px;border-radius:5px;background:var(--sutil);border:1px solid var(--borde);overflow:hidden}
.avance i{display:block;height:100%;background:var(--marca);transition:width .35s ease}
.contador{font-family:var(--titulo);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.cerrar{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--borde);background:var(--superficie);cursor:pointer;display:grid;place-items:center;font-size:1.1rem;line-height:1;flex:none}
.cerrar:hover{border-color:var(--tinta)}

.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:18px;padding:1.4rem 1.35rem 1.5rem;box-shadow:0 1px 2px rgba(15,20,32,.04),0 12px 32px -20px rgba(15,20,32,.25)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:1rem}
.meta .tema-nombre{font-size:.9rem;font-weight:600;color:var(--secundario)}
.pill{display:inline-flex;align-items:center;font-size:.8rem;font-weight:700;padding:.22rem .65rem;border-radius:999px;background:var(--col);color:var(--tc);white-space:nowrap}
.enunciado{font-family:var(--titulo);font-size:1.4rem;font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:0 0 1.2rem}
.enunciado p{margin:0 0 .5rem}
.enunciado code{font-size:.8em}
.enunciado pre code{font-size:inherit}
.enunciado pre{font-family:var(--codigo);font-size:.9rem;font-weight:400;letter-spacing:0;line-height:1.6}
.opciones{display:grid;gap:.6rem}
.op{display:grid;grid-template-columns:2.1rem 1fr;gap:.8rem;align-items:center;text-align:left;background:var(--superficie);border:2px solid var(--borde);border-radius:14px;padding:.8rem .95rem;cursor:pointer;min-height:3.4rem;transition:border-color .15s,background .15s,transform .12s}
.op:hover:not(:disabled){border-color:var(--tinta)}
.op .letra{width:2.1rem;height:2.1rem;border-radius:10px;background:var(--sutil);display:grid;place-items:center;font-family:var(--titulo);font-weight:800;font-size:.95rem}
.op[aria-pressed="true"]{border-color:var(--tinta);background:color-mix(in srgb,var(--marca) 14%,var(--superficie))}
.op[aria-pressed="true"] .letra{background:var(--marca);color:var(--marca-tinta)}
.op.es-bien{border-color:var(--bien);background:var(--bien-fondo)}
.op.es-bien .letra{background:var(--bien);color:#fff}
.op.es-mal{border-color:var(--mal);background:var(--mal-fondo)}
.op.es-mal .letra{background:var(--mal);color:#fff}
.op:disabled{cursor:default}
.op.atenuada{opacity:.5}

.confianza{margin-top:1.4rem;animation:entrar .2s ease both}
.confianza>p{margin:0 0 .6rem;font-family:var(--titulo);font-weight:800;font-size:1.1rem}
.conf-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.conf-btns button{border:2px solid var(--tinta);background:var(--superficie);border-radius:14px;padding:.7rem .4rem .65rem;cursor:pointer;display:grid;gap:.1rem;justify-items:center;transition:background .15s,color .15s}
.conf-btns button b{font-size:1.02rem}
.conf-btns button span{font-size:.82rem;color:var(--secundario)}
.conf-btns button:hover{background:var(--tinta);color:var(--fondo)}
.conf-btns button:hover span{color:inherit;opacity:.8}

.veredicto{margin-top:1.4rem;border-radius:14px;padding:1.1rem 1.15rem;animation:entrar .25s ease both}
.veredicto.bien{background:var(--bien-fondo)}
.veredicto.mal{background:var(--mal-fondo)}
.veredicto-cab{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.veredicto-cab .ico{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem;flex:none}
.veredicto.bien .ico{background:var(--bien)} .veredicto.mal .ico{background:var(--mal)}
.veredicto-cab strong{font-family:var(--titulo);font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.veredicto.bien strong{color:var(--bien)} .veredicto.mal strong{color:var(--mal)}
.veredicto p{margin:0 0 .55rem}
.veredicto .correcta{font-weight:700}
.veredicto .aviso{font-weight:700;color:var(--mal)}
.movimiento{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;font-size:.92rem;color:var(--secundario);margin-top:.8rem;padding-top:.75rem;border-top:1px solid color-mix(in srgb,var(--tinta) 12%,transparent)}
.siguiente{margin-top:1.2rem;width:100%}
.teclas{margin-top:1.1rem;font-size:.83rem;color:var(--secundario);text-align:center}
@media (hover:none){.teclas{display:none}}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Simulacro */
.reloj{font-family:var(--titulo);font-weight:800;font-variant-numeric:tabular-nums;background:var(--marca);color:var(--marca-tinta);border-radius:999px;padding:.3rem .8rem}
.reloj.poco{background:var(--mal);color:#fff}
.nav-sim{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.3rem}
.puntos{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.1rem,1fr));gap:5px;margin-top:1.3rem}
.puntos button{height:2.1rem;border-radius:8px;border:1.5px solid var(--borde);background:var(--superficie);font-family:var(--titulo);font-size:.8rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.puntos button.resp{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.puntos button.actual{outline:3px solid var(--marca);outline-offset:1px}

/* Resumen */
.resumen{padding-top:1.5rem}
.resumen-hero{background:var(--marca);color:var(--marca-tinta);border-radius:20px;padding:1.6rem 1.5rem 1.5rem}
.resumen-hero h2{font-size:1.35rem;font-weight:800}
.cifra{font-family:var(--titulo);font-size:clamp(3.8rem,15vw,5.5rem);font-weight:800;line-height:.95;margin:.6rem 0 .5rem;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cifra small{font-size:.3em;font-weight:700;letter-spacing:-.01em}
.resumen-hero p{margin:0;font-weight:500}
.resumen h3{font-size:1.3rem;font-weight:800;margin:2.2rem 0 .9rem;letter-spacing:-.01em}
.lista-errores{margin:0;padding:0;list-style:none;display:grid;gap:.8rem}
.lista-errores li{background:var(--superficie);border:1px solid var(--borde);border-left:5px solid var(--mal);border-radius:12px;padding:1rem 1.15rem}
.lista-errores .q{margin:0 0 .6rem;font-weight:700}
.lista-errores .q p{margin:0 0 .35rem}
.lista-errores .q pre{font-weight:400}
.lista-errores .r{margin:.2rem 0 0;font-size:.95rem}
.lista-errores .r.tuya{color:var(--mal);font-weight:600}
.lista-errores .r.ok{color:var(--bien);font-weight:700}
.lista-errores .r.exp{color:var(--secundario);margin-top:.55rem}
.tabla-temas{width:100%;border-collapse:collapse;font-size:.97rem}
.tabla-temas td{padding:.6rem .25rem;border-bottom:1px solid var(--borde)}
.tabla-temas td:last-child{text-align:right;font-family:var(--titulo);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabla-temas tr.flojo td:last-child{color:var(--mal)}
.resumen .acciones{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2rem}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:460px){
  main{padding:0 1rem 3.5rem}
  .hero{padding:2rem calc(50vw - 50% + 1rem) 1.8rem}
  .hero-acciones .btn{width:100%}
  .cajas,.rotulos{gap:.35rem}
  .caja .num{font-size:1.1rem}
  .rotulos span{font-size:.75rem}
  .tarjeta{padding:1.15rem 1rem 1.25rem;border-radius:16px}
  .enunciado{font-size:1.22rem}
  .conf-btns button span{display:none}
  .resumen .acciones .btn{width:100%}
}
</style>
</head>

<script>
const DATOS = {"temas":["Variables, alcance y expresiones","El tipo `boolean`","Los tipos `number` y `bigint`","El tipo `string` y Unicode","`undefined`, `null` y la ausencia de datos","Conversión y coerción de tipos","El tipo `symbol` y los protocolos de JavaScript","Arrays y matrices","Objetos, propiedades y referencias","`Map`, `Set` y colecciones especializadas","Estructuras de control","Errores y excepciones","Funciones","Programación funcional y pipelines de datos","Recursividad y árboles binarios","Programación Asincrónica","Gestión de archivos con Node.js","Desarrollo web: del documento a una aplicación del clima","Arrow.js: del contador al inventario","Cómo consumir una API REST"],"preguntas":[{"id":1,"t":0,"q":"¿Qué nombre de variable describe mejor la cantidad de días que faltan para un vencimiento?","o":["diasHastaVencimiento","fechaDeVencimiento","diasTranscurridosDelPlazo"],"c":0,"e":"Un buen nombre dice qué contiene la variable: una cantidad de días hasta un momento concreto. `fechaDeVencimiento` sugiere una fecha, no una cantidad, y `diasTranscurridosDelPlazo` cuenta en el sentido contrario."},{"id":2,"t":0,"q":"Después de ejecutar `let total;`, ¿qué valor tiene `total`?","o":["null","ReferenceError","undefined"],"c":2,"e":"`let` sin inicializador deja la variable en `undefined`. No vale `null` ni `0`, que habría que asignar a mano, y tampoco da ReferenceError, porque la línea de la declaración ya se ejecutó."},{"id":3,"t":0,"q":"¿Qué hace la sentencia `const iva = 0.21;`?","o":["Declara iva sin valor","Declara e inicializa iva","Reasigna una constante anterior"],"c":1,"e":"`const iva = 0.21;` hace dos cosas en una sentencia: declara el nombre y le da su valor inicial. Una constante siempre debe inicializarse en la misma línea en que se declara."},{"id":4,"t":0,"q":"Una variable acumula un total que cambia en cada paso de un cálculo. ¿Con qué palabra conviene declararla?","o":["const","class","let"],"c":2,"e":"Un acumulador cambia de valor en cada paso, así que necesita `let`. `const` impide reasignar la variable, y `class` declara una clase, no una variable."},{"id":5,"t":0,"q":"Después de `const pedido = { estado: \"nuevo\" };`, ¿qué operación está permitida?","o":["Reasignar `pedido` a un objeto nuevo","Modificar `pedido.estado`, porque const fija solo la variable","Nada: el objeto queda inmutable"],"c":1,"e":"`const` impide reasignar la variable `pedido`, pero no congela el objeto al que apunta. Por eso se pueden cambiar sus propiedades. Para impedirlo haría falta `Object.freeze`."},{"id":6,"t":0,"q":"Una variable se declara con `var` dentro de un `if`, y ese `if` está dentro de una función. ¿Hasta dónde llega el alcance de la variable?","o":["A toda la función","Solo al bloque if","Al módulo que contiene la función"],"c":0,"e":"`var` tiene alcance de función: ignora las llaves del `if` y queda visible en toda la función que lo contiene, pero no fuera de ella."},{"id":7,"t":0,"q":"¿Qué formas de declarar variables quedan limitadas al bloque de llaves de un `if`?","o":["let y const","var y let","var, let y const"],"c":0,"e":"`let` y `const` tienen alcance de bloque: solo existen entre las llaves donde se declaran. `var` ignora esas llaves."},{"id":8,"t":0,"q":"Fuera de un bloque existe una variable `estado` con el valor `\"global\"`. Dentro del bloque se declara `const estado = \"local\"`. ¿Qué valor tiene `estado` dentro del bloque?","o":["El estado global","undefined","El estado local"],"c":2,"e":"Dentro del bloque, la declaración local sombrea a la exterior con el mismo nombre. Se lee `\"local\"`; al salir del bloque vuelve a verse la variable global."},{"id":9,"t":0,"q":"Dentro de un bloque, se lee una variable antes de la línea `const` que la declara. ¿Qué ocurre?","o":["Se obtiene undefined","Se produce ReferenceError","Se obtiene su valor futuro"],"c":1,"e":"Entre el inicio del bloque y la línea de la declaración, una variable `let` o `const` está en la zona muerta temporal. Leerla ahí lanza ReferenceError en lugar de devolver `undefined`."},{"id":10,"t":0,"q":"¿Qué muestra en la consola este código?\n\n```js\nconsole.log(total);\nvar total = 100;\n```","o":["undefined","100","ReferenceError"],"c":0,"e":"La declaración con `var` se eleva al inicio del alcance, pero la asignación no. Cuando se ejecuta `console.log`, la variable existe y vale `undefined`. Con `let` o `const` sí habría ReferenceError."},{"id":11,"t":0,"q":"Una función exterior declara una variable local y devuelve una función interior que usa esa variable. ¿Qué pasa con la variable cuando la función exterior termina?","o":["El dato se libera al terminar la primera función","La función devuelta recibe una copia congelada del dato","La función devuelta sigue accediendo a esa variable local"],"c":2,"e":"Eso es una clausura: la función devuelta conserva acceso a las variables del alcance donde se creó, aunque la función exterior ya haya terminado. La variable no se libera mientras alguien pueda usarla."},{"id":12,"t":0,"q":"¿Cuál de estos fragmentos es una expresión, es decir, produce un valor?","o":["`if (edad >= 18) {}`","`edad >= 18`","`const edad = 18;`"],"c":1,"e":"Una expresión produce un valor: `edad >= 18` da `true` o `false`. `if` y `const` son sentencias: ejecutan una acción pero no producen un valor que se pueda usar."},{"id":13,"t":0,"q":"Después de ejecutar `let n = 5; const previo = n++;`, ¿cuánto valen `previo` y `n`?","o":["previo vale 5 y n vale 6","previo vale 6 y n vale 6","previo vale 5 y n vale 5"],"c":0,"e":"`n++` es un postincremento: primero devuelve el valor actual (5) y después suma 1. Por eso `previo` vale 5 y `n` queda en 6. Con `++n` ambos valdrían 6."},{"id":14,"t":1,"q":"¿Cuáles son los únicos valores del tipo boolean?","o":["1 y 0","truthy y falsy","true y false"],"c":2,"e":"El tipo boolean tiene exactamente dos valores: `true` y `false`. \"Truthy\" y \"falsy\" describen cómo se comportan otros valores en una condición, no son valores booleanos."},{"id":15,"t":1,"q":"¿Puede un string no vacío usarse directamente como condición en un `if`?","o":["No, se exige un booleano literal","Sí, se interpreta como truthy","Sí, pero se interpreta como false"],"c":1,"e":"Una condición acepta cualquier valor y lo interpreta como truthy o falsy. Todo string no vacío es truthy, incluso `\"false\"` o `\"0\"`."},{"id":16,"t":1,"q":"¿Cuál de estos valores es falsy?","o":["`\" \"`","`\"false\"`","`NaN`"],"c":2,"e":"Los valores falsy son `false`, `0`, `-0`, `0n`, `\"\"`, `null`, `undefined` y `NaN`. Un string con un espacio no está vacío, así que es truthy, igual que `\"false\"`."},{"id":17,"t":1,"q":"¿Qué devuelve `Boolean({})`?","o":["false","true","undefined"],"c":1,"e":"Todo objeto es truthy, aunque esté vacío. `Boolean({})` devuelve `true`. Para saber si un objeto no tiene propiedades hay que mirar, por ejemplo, `Object.keys(obj).length`."},{"id":18,"t":1,"q":"¿Qué devuelve `Boolean(\"false\")`?","o":["true, porque el string no está vacío","false, porque el texto dice false","Lanza TypeError, porque no es un booleano válido"],"c":0,"e":"`Boolean` no lee el contenido del texto: solo mira si el string está vacío. `\"false\"` tiene 5 caracteres, así que es truthy y da `true`."},{"id":19,"t":1,"q":"¿Qué expresión convierte `valor` a booleano de la forma más explícita y clara?","o":["`valor == true`","`Boolean(valor)`","`new Boolean(valor)`"],"c":1,"e":"`Boolean(valor)` expresa la intención sin ambigüedad. `valor == true` compara con coerción numérica y falla con muchos valores truthy, y `new Boolean(valor)` crea un objeto, que siempre es truthy."},{"id":20,"t":1,"q":"¿Qué devuelve `!0`?","o":["false","0","true"],"c":2,"e":"`!` convierte el valor a booleano y lo invierte. `0` es falsy, así que `!0` da `true`."},{"id":21,"t":1,"q":"¿Qué devuelve `\"\" && ejecutar()`?","o":["El string vacío sin llamar a ejecutar","El resultado de ejecutar","El booleano false después de llamar a ejecutar"],"c":0,"e":"`&&` devuelve el primer operando falsy sin evaluar el resto. `\"\"` es falsy, así que la expresión devuelve `\"\"` y `ejecutar()` nunca se llama. Esto se conoce como cortocircuito."},{"id":22,"t":1,"q":"¿Qué devuelve `\"Ana\" && 20`?","o":["\"Ana\"","20","true"],"c":1,"e":"`&&` no devuelve un booleano sino uno de sus operandos. Si el primero es truthy, devuelve el segundo. `\"Ana\"` es truthy, así que el resultado es `20`."},{"id":23,"t":1,"q":"¿Qué devuelve `0 || false || null`?","o":["false","true","null"],"c":2,"e":"`||` devuelve el primer operando truthy. Si no hay ninguno, devuelve el último. Aquí todos son falsy, así que devuelve `null`."},{"id":24,"t":1,"q":"¿Qué devuelve `0 ?? 1`?","o":["0","1","null"],"c":0,"e":"`??` solo reemplaza `null` y `undefined`. `0` es un valor válido para `??`, así que se conserva. Con `||` el resultado habría sido `1`."},{"id":25,"t":1,"q":"¿Qué devuelve `5 === \"5\"`?","o":["false","true","undefined"],"c":0,"e":"`===` compara sin convertir tipos. Un number y un string nunca son estrictamente iguales. Con `==` la comparación daría `true`."},{"id":26,"t":1,"q":"¿Qué expresión comprueba correctamente si `valor` es `NaN`?","o":["`valor === NaN`","`typeof valor === \"NaN\"`","`Number.isNaN(valor)`"],"c":2,"e":"`NaN` es el único valor que no es igual a sí mismo, así que `valor === NaN` siempre da `false`. `typeof NaN` es `\"number\"`. `Number.isNaN` es la forma fiable de detectarlo."},{"id":27,"t":1,"q":"¿Qué expresión equivale a `!(a && b)`?","o":["`!a && !b`","`!a || !b`","`a || b`"],"c":1,"e":"Es una ley de De Morgan: negar un AND equivale a hacer OR de las negaciones. `!(a && b)` es verdadero cuando al menos uno de los dos es falso."},{"id":28,"t":1,"q":"¿Cómo evalúa JavaScript la expresión `esAdmin || esEditor && estaActivo`?","o":["`(esAdmin || esEditor) && estaActivo`","`esAdmin || (esEditor && estaActivo)`","`!(esAdmin || esEditor) && estaActivo`"],"c":1,"e":"`&&` tiene más precedencia que `||`, así que se evalúa primero, como la multiplicación antes que la suma. Si se quiere otro orden, hay que poner paréntesis."},{"id":29,"t":2,"q":"¿Qué tipo representa tanto 42 como 3.5 en JavaScript?","o":["number","bigint","integer"],"c":0,"e":"JavaScript tiene un único tipo `number` para enteros y decimales. No existe un tipo `integer`, y `bigint` es otro tipo, para enteros arbitrariamente grandes con sufijo `n`."},{"id":30,"t":2,"q":"¿Qué valor decimal representa `0b101010`?","o":["101010","52","42"],"c":2,"e":"El prefijo `0b` indica binario. `101010` en base 2 es 32 + 8 + 2 = 42."},{"id":31,"t":2,"q":"¿Qué valor tiene `46_000_000`?","o":["46000","SyntaxError","46000000"],"c":2,"e":"El guion bajo es un separador numérico: solo mejora la lectura y no cambia el valor. `46_000_000` es 46000000 y no produce ningún error."},{"id":32,"t":2,"q":"¿Qué devuelve `-5 % 3` en JavaScript?","o":["-2","1","NaN"],"c":0,"e":"En JavaScript, `%` es el resto de la división y toma el signo del dividendo. `-5 % 3` da `-2`. El módulo matemático daría 1, pero `%` no es un módulo."},{"id":33,"t":2,"q":"¿Qué resultado da `1 / 0` en JavaScript?","o":["Una excepción de división","Infinity","NaN"],"c":1,"e":"Con number, dividir un valor positivo por cero da `Infinity`, sin excepción. Solo con bigint la división por cero lanza RangeError."},{"id":34,"t":2,"q":"¿Qué produce `0 / 0`?","o":["Infinity","NaN","0"],"c":1,"e":"`0 / 0` no tiene un resultado definido, así que da `NaN`. Un positivo dividido por cero, en cambio, da `Infinity`."},{"id":35,"t":2,"q":"¿Por qué `Number.isNaN(\"hola\")` es más confiable que `isNaN(\"hola\")` para detectar `NaN`?","o":["Convierte el string a número antes de comprobar","Devuelve true para cualquier string no numérico","No convierte el string a número antes de comprobar si es NaN"],"c":2,"e":"La función global `isNaN` primero convierte a número: `\"hola\"` se vuelve `NaN` y da `true`. `Number.isNaN` no convierte, así que solo da `true` si el valor ya es `NaN`."},{"id":36,"t":2,"q":"¿Qué devuelve `Object.is(0, -0)`?","o":["false","true","TypeError"],"c":0,"e":"`0 === -0` es `true`, pero `Object.is` distingue ambos ceros y devuelve `false`. También es la única comparación en que `NaN` es igual a `NaN`."},{"id":37,"t":2,"q":"¿Por qué `0.1 + 0.2` puede no ser exactamente 0.3?","o":["Number guarda los decimales con solo dos cifras","El motor redondea el resultado a 16 decimales","Muchos decimales no tienen representación exacta en binario"],"c":2,"e":"Los números se guardan en binario. Valores como 0,1 o 0,2 no tienen una representación binaria finita, igual que 1/3 en decimal, y se guardan aproximados. La suma arrastra ese error."},{"id":38,"t":2,"q":"¿Qué comprueba `Number.isSafeInteger(valor)`?","o":["Que es un número finito y no NaN","Que es un entero representable sin pérdida","Que el valor entra en un entero de 32 bits"],"c":1,"e":"Un number representa enteros exactos solo hasta 2^53 − 1. `Number.isSafeInteger` comprueba que el valor sea entero y esté dentro de ese rango, donde no hay pérdida de precisión."},{"id":39,"t":2,"q":"¿Qué devuelve `Number(\"42px\")`?","o":["NaN","42","\"42\""],"c":0,"e":"`Number` exige que todo el texto sea un número válido. `\"42px\"` contiene letras, así que el resultado es `NaN`."},{"id":40,"t":2,"q":"¿Qué devuelve `parseInt(\"42px\", 10)`?","o":["NaN","42","0"],"c":1,"e":"`parseInt` lee dígitos desde el principio y se detiene en el primer carácter que no entiende. Devuelve `42` e ignora `\"px\"`."},{"id":41,"t":2,"q":"¿Qué valores dan `Math.floor(-3.2)` y `Math.trunc(-3.2)`?","o":["-3 y -4","-3 y -3","-4 y -3"],"c":2,"e":"`Math.floor` redondea hacia abajo (hacia menos infinito), así que −3,2 pasa a −4. `Math.trunc` quita los decimales (hacia cero), así que queda −3. Solo difieren con negativos."},{"id":42,"t":2,"q":"¿Qué tipo devuelve `(12.5).toFixed(2)`?","o":["string","number","bigint"],"c":0,"e":"`toFixed` devuelve un string formateado, no un number. `(12.5).toFixed(2)` es `\"12.50\"`. Para calcular con él habría que volver a convertirlo."},{"id":43,"t":2,"q":"¿Qué ocurre con `10n + 2`?","o":["Devuelve 12n","Devuelve 12 como number","Lanza TypeError"],"c":2,"e":"JavaScript no mezcla bigint y number en una operación aritmética: lanza TypeError. Hay que convertir uno de los dos explícitamente, por ejemplo `10n + 2n`."},{"id":44,"t":3,"q":"¿Qué comillas permiten insertar expresiones dentro de una cadena?","o":["Las comillas invertidas, con la forma ${expresión}","Las comillas simples y dobles","Las comillas dobles con ${}"],"c":0,"e":"Solo las plantillas literales, escritas con comillas invertidas, interpretan `${expresión}`. Con comillas simples o dobles, `${...}` es texto común."},{"id":45,"t":3,"q":"¿Qué representa `\\n` dentro de una cadena JavaScript?","o":["Una barra invertida seguida de una n","Un salto de línea","El final de la cadena"],"c":1,"e":"`\\n` es una secuencia de escape: dentro de la cadena representa un único carácter, el salto de línea, no una barra seguida de una n."},{"id":46,"t":3,"q":"Después de `const s = \"casa\"; s[0] = \"C\";`, ¿qué valor tiene `s`?","o":["\"Casa\"","\"casa\"","\"C\""],"c":1,"e":"Los strings son inmutables. Asignar a `s[0]` no tiene efecto (en modo estricto lanza TypeError) y `s` sigue siendo `\"casa\"`."},{"id":47,"t":3,"q":"Si se llama a `original.trim()` sin guardar el resultado, ¿qué pasa con el string `original`?","o":["Pierde los espacios en el mismo string","Cambia solo si tenía espacios en los extremos","No cambia; trim devuelve una cadena nueva sin los espacios"],"c":2,"e":"Ningún método de string modifica el original, porque los strings son inmutables. `trim` devuelve una cadena nueva; hay que guardarla, por ejemplo `texto = texto.trim()`."},{"id":48,"t":3,"q":"¿Qué devuelve `\"JavaScript\".at(-1)`?","o":["\"t\"","\"J\"","undefined"],"c":0,"e":"`at` acepta índices negativos que cuentan desde el final. `-1` es el último carácter, `\"t\"`."},{"id":49,"t":3,"q":"¿Qué devuelve `\"JavaScript\".slice(0, 4)`?","o":["\"JavaS\"","\"Java\"","\"Script\""],"c":1,"e":"`slice(0, 4)` toma desde el índice 0 hasta el 4 sin incluirlo, es decir, los caracteres 0, 1, 2 y 3: `\"Java\"`."},{"id":50,"t":3,"q":"¿Qué método de string responde directamente si una frase contiene un texto dado?","o":["split","startsWith","includes"],"c":2,"e":"`includes` responde exactamente esa pregunta y devuelve un booleano. `startsWith` solo mira el comienzo, y `split` divide la cadena."},{"id":51,"t":3,"q":"¿Qué devuelve `\"uno dos uno\".replaceAll(\"uno\", \"1\")`?","o":["\"1 dos 1\"","\"1 dos uno\"","\"uno dos 1\""],"c":0,"e":"`replaceAll` reemplaza todas las apariciones. `replace` con un string reemplaza solo la primera."},{"id":52,"t":3,"q":"¿Qué devuelve `\"a,b,c\".split(\",\")`?","o":["La cadena \"abc\"","Un array con una sola cadena \"a,b,c\"","Un array con \"a\", \"b\" y \"c\""],"c":2,"e":"`split` divide la cadena en cada separador y devuelve un array con los trozos: `[\"a\", \"b\", \"c\"]`."},{"id":53,"t":3,"q":"¿Qué expresión convierte `valor` en texto sin fallar aunque `valor` sea `null`?","o":["`valor.toString()`","`String(valor)`","`valor.join()`"],"c":1,"e":"`String(valor)` funciona con cualquier valor, incluidos `null` y `undefined`. `valor.toString()` lanza TypeError con `null`, porque `null` no tiene métodos."},{"id":54,"t":3,"q":"¿Qué valor tiene `\"😀\".length`?","o":["2 unidades UTF-16","1, porque es un solo carácter visible","4 puntos de código"],"c":0,"e":"`length` cuenta unidades de código UTF-16, no caracteres visibles. Los emoji están fuera del plano básico y ocupan 2 unidades (un par sustituto)."},{"id":55,"t":3,"q":"¿Qué produce `Array.from(\"A😀B\")`?","o":["[\"A\", dos mitades de emoji, \"B\"]","[\"A😀B\"]","[\"A\", \"😀\", \"B\"]"],"c":2,"e":"`Array.from` recorre un string por puntos de código, no por unidades UTF-16. Por eso el emoji queda entero en un solo elemento."},{"id":56,"t":3,"q":"¿Qué herramienta divide un texto en caracteres tal como los ve una persona (grafemas), incluidos los emoji compuestos?","o":["Array.from sobre la cadena","Intl.Segmenter","normalize con la forma NFC"],"c":1,"e":"`Intl.Segmenter` con granularidad `\"grapheme\"` divide el texto como lo percibe una persona, incluidos emoji compuestos y letras con acentos combinados. `Array.from` separa puntos de código, que no siempre coinciden con lo que se ve."},{"id":57,"t":3,"q":"Dos cadenas se ven iguales, pero están escritas con distintas secuencias Unicode, por ejemplo «é» como un solo carácter o como «e» más un acento. ¿Qué hay que hacer para poder compararlas?","o":["Normalizar ambas a NFC","Aplicar trim a una sola","Comparar sus longitudes UTF-16"],"c":0,"e":"Una misma letra acentuada puede escribirse como un solo punto de código o como letra más acento combinado. `normalize(\"NFC\")` lleva ambas a la misma forma y así se pueden comparar."},{"id":58,"t":3,"q":"¿Qué herramienta ordena alfabéticamente nombres en español respetando la ñ y los acentos?","o":["Intl.Collator configurado para es","El operador menor que sin configuración","Comparar la longitud de los strings"],"c":0,"e":"`Intl.Collator` ordena según las reglas del idioma, por ejemplo la ñ y los acentos del español. `<` compara códigos numéricos de caracteres y ordena mal esos casos."},{"id":59,"t":4,"q":"¿Qué valor tiene `pendiente` tras `let pendiente;`?","o":["null","`\"\"` (cadena vacía)","undefined"],"c":2,"e":"Una variable declarada con `let` y sin valor queda en `undefined`. `null` y `\"\"` son valores que hay que asignar explícitamente."},{"id":60,"t":4,"q":"¿Qué valor se asigna a propósito para indicar que un dato no existe o no tiene valor?","o":["undefined","null","NaN"],"c":1,"e":"`null` expresa una ausencia elegida a propósito por el programa. `undefined` suele indicar que algo nunca se asignó."},{"id":61,"t":4,"q":"¿Qué devuelve `typeof null`?","o":["\"null\"","\"undefined\"","\"object\""],"c":2,"e":"`typeof null` devuelve `\"object\"` por un error histórico de las primeras versiones de JavaScript que nunca se corrigió para no romper código existente. Para detectar `null` hay que usar `valor === null`."},{"id":62,"t":4,"q":"En un programa, `cantidad` puede valer 0 legítimamente. ¿Por qué `if (!cantidad)` no sirve para detectar que falta el dato?","o":["Porque también entra cuando cantidad vale 0, que es válido","Porque no entra cuando cantidad es undefined","Porque `!cantidad` lanza error si falta el dato"],"c":0,"e":"`!cantidad` es verdadero para cualquier valor falsy, y `0` es falsy. Si 0 es válido, la condición lo trata como si faltara. Conviene preguntar `cantidad == null` o usar `??`."},{"id":63,"t":4,"q":"¿Qué devuelve `false ?? true`?","o":["true","false","undefined"],"c":1,"e":"`??` solo reemplaza `null` y `undefined`. `false` es un valor presente, así que se conserva."},{"id":64,"t":4,"q":"Si `usuario` es null, ¿qué produce `usuario?.direccion?.ciudad`?","o":["null","undefined","TypeError"],"c":1,"e":"El encadenamiento opcional `?.` se detiene al encontrar `null` o `undefined` y devuelve `undefined`, sin lanzar error. Sin `?.`, leer `.direccion` de `null` lanzaría TypeError."},{"id":65,"t":4,"q":"Con `function f(x = 3) { return x; }`, ¿cuándo se aplica el 3?","o":["Cuando el argumento es null","Cuando el argumento es falsy","Cuando falta o es undefined"],"c":2,"e":"El valor predeterminado de un parámetro se aplica solo si el argumento falta o es `undefined`. `null`, `0` o `\"\"` son valores explícitos y se respetan."},{"id":66,"t":4,"q":"¿Qué diferencia hay entre los objetos `{}` y `{ valor: undefined }`?","o":["Solo el segundo tiene la propiedad valor como propia","Leer .valor da undefined solo en el primero","JSON.stringify los convierte en textos distintos"],"c":0,"e":"Leer `.valor` da `undefined` en ambos casos, así que la lectura no los distingue. `Object.hasOwn` sí: el segundo objeto tiene la propiedad, aunque su valor sea `undefined`."},{"id":67,"t":4,"q":"¿Qué diferencia hay entre `[1, , 3]` y `[1, undefined, 3]` en la posición 1?","o":["Solo el segundo tiene esa posición presente","Solo el primero tiene esa posición presente","Ambos tienen exactamente la misma estructura"],"c":0,"e":"`[1, , 3]` tiene un hueco: la posición 1 no existe. `[1, undefined, 3]` tiene esa posición con el valor `undefined`. Se nota con `1 in array`, que da `false` y `true` respectivamente."},{"id":68,"t":4,"q":"¿Qué devuelve `[10, 20].indexOf(50)` si no encuentra el valor?","o":["undefined","null","-1"],"c":2,"e":"`indexOf` devuelve el índice encontrado o `-1` si no está. Por eso se compara con `-1` o se usa `includes`."},{"id":69,"t":4,"q":"¿Qué ocurre con una propiedad cuyo valor es undefined al serializar un objeto con JSON.stringify?","o":["Se escribe como null","Se omite","Se escribe como \"undefined\""],"c":1,"e":"`JSON.stringify` omite las propiedades cuyo valor es `undefined`, porque JSON no tiene ese valor. `null`, en cambio, sí se conserva."},{"id":70,"t":4,"q":"Una función devuelve `null` en tres situaciones distintas: todavía no hay datos, la búsqueda no encontró nada o hubo un error. ¿Qué representación distingue claramente cada caso?","o":["Un objeto con una propiedad estado que nombre cada caso","Un booleano que indique si hubo resultado","Distinguir null de undefined para cada caso"],"c":0,"e":"Un solo valor como `null` no alcanza para distinguir varias situaciones. Un objeto con una propiedad `estado` (por ejemplo `\"pendiente\"`, `\"vacio\"` o `\"error\"`) nombra cada caso sin ambigüedad."},{"id":71,"t":4,"q":"¿Qué se gana al normalizar (limpiar y dar un formato único a) los datos externos apenas se reciben?","o":["La entrada deja de requerir validación posterior","Todo el programa usa datos con la misma forma","JSON.stringify conserva los campos undefined"],"c":1,"e":"Normalizar en la entrada deja los datos siempre con la misma forma: mismos tipos, mismos campos. El resto del código puede confiar en esa forma. Eso no reemplaza la validación: son pasos distintos."},{"id":72,"t":5,"q":"¿Qué expresión convierte `textoCantidad` a número de forma explícita?","o":["`textoCantidad * 1`","`textoCantidad.valueOf()`","`Number(textoCantidad)`"],"c":2,"e":"`Number(textoCantidad)` declara la conversión de forma explícita. `textoCantidad * 1` también convierte, pero de forma implícita (coerción), y `valueOf()` de un string devuelve el mismo string."},{"id":73,"t":5,"q":"¿Por qué `\"6\" - 1` produce 5?","o":["La resta solo opera con números y convierte el string a número","La resta concatena y luego convierte a número","JavaScript interpreta \"6\" como un literal numérico"],"c":0,"e":"La resta solo existe para números, así que JavaScript convierte `\"6\"` a 6 y calcula 6 − 1. Con `+` sería distinto: `\"6\" + 1` concatena y da `\"61\"`."},{"id":74,"t":5,"q":"¿En qué orden conviene procesar un dato que llega de afuera, como un formulario o un archivo?","o":["Convertir, usar y validar al mostrar el resultado","Normalizar, convertir y validar antes de usarlo","Validar el texto crudo y convertir al final"],"c":1,"e":"El orden seguro es normalizar (limpiar espacios, formato), convertir al tipo correcto y validar, todo antes de usar el dato. Validar al final deja pasar datos incorrectos al resto del programa."},{"id":75,"t":5,"q":"¿Qué devuelve `String(null)`?","o":["null","TypeError","\"null\""],"c":2,"e":"`String(null)` convierte `null` en el texto `\"null\"`. No lanza error, a diferencia de `null.toString()`."},{"id":76,"t":5,"q":"¿Qué devuelve `Number(\"\")` y por qué requiere cuidado en un campo obligatorio?","o":["0; podría aceptarse una omisión como si fuera un cero","NaN; la omisión se detecta sin más control","undefined; se distingue fácilmente de cero"],"c":0,"e":"`Number(\"\")` da `0`, no `NaN`. En un campo obligatorio, un campo vacío pasaría como un cero válido si no se verifica antes que el texto no esté vacío."},{"id":77,"t":5,"q":"¿Por qué `Number([])` devuelve 0?","o":["Number devuelve la longitud del array vacío","Se convierte primero en \"\" y luego en 0","Un array vacío es falsy y false vale 0"],"c":1,"e":"Para convertir un objeto a número, JavaScript primero lo pasa a primitivo. Un array vacío se convierte en `\"\"`, y `Number(\"\")` es 0. Además, `[]` es truthy, no falsy."},{"id":78,"t":5,"q":"Para el texto `\"42px\"`, ¿qué diferencia hay entre `Number` y `parseInt`?","o":["Ambos dan `42`","`Number` da `42` y `parseInt` da `NaN`","`Number` da `NaN` y `parseInt` da `42`"],"c":2,"e":"`Number` exige que todo el texto sea numérico y da `NaN` con `\"42px\"`. `parseInt` lee dígitos hasta el primer carácter inválido y da `42`."},{"id":79,"t":5,"q":"¿Por qué `Boolean(\"false\")` no sirve para interpretar esa palabra?","o":["Devuelve false, pero no reconoce \"FALSE\"","Devuelve true: la cadena no está vacía","Lanza TypeError al no ser un booleano"],"c":1,"e":"`Boolean` solo mira si el string está vacío. `\"false\"` no está vacío, así que da `true`. Para interpretar la palabra hay que compararla, por ejemplo `texto === \"true\"`."},{"id":80,"t":5,"q":"Un entero muy grande llega como texto, en la variable `texto`. ¿Cómo se convierte a bigint sin perder dígitos?","o":["`BigInt(texto)`","`BigInt(Number(texto))`","`BigInt(parseInt(texto))`"],"c":0,"e":"Un entero grande en texto puede superar la precisión de number. Pasar primero por `Number` o `parseInt` pierde dígitos antes de llegar a `BigInt`. `BigInt(texto)` convierte sin pérdida."},{"id":81,"t":5,"q":"¿Qué resultado produce `\"8\" * \"3\"`?","o":["\"83\"","NaN","24"],"c":2,"e":"`*` solo opera con números, así que convierte ambos strings: 8 × 3 = 24. Solo `+` concatena strings."},{"id":82,"t":5,"q":"¿Qué produce `1 + 2 + \"3\"`?","o":["\"33\"","\"123\"","6"],"c":0,"e":"Se evalúa de izquierda a derecha: `1 + 2` da 3 (número), y después `3 + \"3\"` concatena y da `\"33\"`."},{"id":83,"t":5,"q":"¿Por qué `\"20\" < \"3\"` puede ser true?","o":["Ambos se convierten a número antes de comparar","Se compara la longitud de las cadenas","Ambos son strings y se comparan carácter por carácter"],"c":2,"e":"Si ambos operandos son strings, `<` los compara carácter por carácter según su código. `\"2\"` es menor que `\"3\"`, así que `\"20\" < \"3\"` da `true` aunque 20 sea mayor que 3."},{"id":84,"t":5,"q":"¿Qué devuelve `0 === false`?","o":["true","false","undefined"],"c":1,"e":"`===` no convierte tipos. `0` es number y `false` es boolean, así que no son estrictamente iguales. Con `==` darían `true`."},{"id":85,"t":5,"q":"Cuando JavaScript necesita convertir un objeto a un valor primitivo, ¿qué método usa primero si el objeto lo define?","o":["Symbol.toPrimitive","Object.prototype.valueOf","toString"],"c":0,"e":"Si un objeto define `Symbol.toPrimitive`, JavaScript lo usa antes que `valueOf` y `toString` para convertirlo a primitivo."},{"id":86,"t":5,"q":"Un formulario acepta números con coma decimal, como `\"3,5\"`. ¿Qué hace falta además de llamar a `Number`?","o":["Reemplazar la coma por punto y nada más","Definir el formato aceptado y normalizarlo","Usar parseFloat, que ya acepta la coma"],"c":1,"e":"`Number` no acepta coma decimal: `Number(\"3,5\")` da `NaN` y `parseFloat(\"3,5\")` da 3. Hay que decidir qué formatos se aceptan, normalizarlos (por ejemplo, coma por punto) y validar el resultado."},{"id":87,"t":6,"q":"¿Qué devuelve `Symbol(\"id\") === Symbol(\"id\")`?","o":["true","undefined","false"],"c":2,"e":"Cada llamada a `Symbol()` crea un símbolo único, aunque tengan la misma descripción. Por eso nunca son iguales entre sí."},{"id":88,"t":6,"q":"En `Symbol(\"interno\")`, ¿para qué sirve el texto `\"interno\"`?","o":["Hace iguales los símbolos con ese texto","Convierte el símbolo en clave string","Ayuda a depurar; no define identidad"],"c":2,"e":"La descripción solo sirve para identificarlo al depurar, por ejemplo en la consola. No afecta la identidad: dos símbolos con la misma descripción siguen siendo distintos."},{"id":89,"t":6,"q":"Un objeto tiene la propiedad string `id` y otra bajo `Symbol(\"id\")`. ¿Qué relación guardan?","o":["La segunda sobrescribe la primera","Son claves distintas","Ambas se enumeran con el mismo nombre"],"c":1,"e":"Una clave string y una clave symbol nunca colisionan, aunque la descripción coincida con el texto. El objeto tiene dos propiedades distintas."},{"id":90,"t":6,"q":"¿Qué ocurre con una clave symbol al llamar Object.keys sobre un objeto?","o":["No aparece en el resultado","Aparece convertida a string","Se elimina del objeto"],"c":0,"e":"`Object.keys` devuelve solo claves string. Las claves symbol no aparecen, pero siguen en el objeto."},{"id":91,"t":6,"q":"¿Qué función devuelve las claves symbol propias de un objeto?","o":["Object.getOwnPropertyNames","Object.entries","Object.getOwnPropertySymbols"],"c":2,"e":"`Object.getOwnPropertySymbols` devuelve las claves symbol propias. `Object.getOwnPropertyNames` y `Object.entries` trabajan solo con claves string."},{"id":92,"t":6,"q":"¿Copia `{ ...obj }` las propiedades de `obj` cuya clave es un symbol?","o":["No, se omiten las claves symbol","Sí","Solo si la clave se creó con Symbol.for"],"c":1,"e":"El spread `{ ...obj }` copia todas las propiedades propias enumerables, incluidas las de clave symbol."},{"id":93,"t":6,"q":"¿Qué devuelve `Symbol.for(\"curso\") === Symbol.for(\"curso\")`?","o":["true","false","TypeError"],"c":0,"e":"`Symbol.for` usa un registro global: la primera llamada crea el símbolo y las siguientes con la misma clave devuelven el mismo. Por eso son iguales."},{"id":94,"t":6,"q":"¿Qué devuelve `Symbol.keyFor(s)` si `s` se creó con `Symbol()`, fuera del registro global?","o":["Su descripción","undefined","La cadena \"local\""],"c":1,"e":"`Symbol.keyFor` solo encuentra símbolos del registro global, creados con `Symbol.for`. Para un símbolo local creado con `Symbol()` devuelve `undefined`."},{"id":95,"t":6,"q":"¿Qué expresión convierte un symbol en texto sin lanzar error?","o":["String(simbolo)","\"id=\" + simbolo","Number(simbolo)"],"c":0,"e":"Un símbolo no se convierte a texto de forma implícita: `\"id=\" + simbolo` lanza TypeError. La conversión tiene que ser explícita con `String(simbolo)` o leyendo `simbolo.description`."},{"id":96,"t":6,"q":"¿Qué símbolo especial debe usar un objeto como nombre de un método para poder recorrerse con `for...of`?","o":["Symbol.hasInstance","Symbol.toStringTag","Symbol.iterator"],"c":2,"e":"`for...of` busca el método `Symbol.iterator` del objeto. Si existe, el objeto es iterable."},{"id":97,"t":6,"q":"El método `Symbol.iterator` de un objeto devuelve un iterador. ¿Qué método debe tener ese iterador?","o":["value, que devuelve el elemento actual","next, que devuelve value y done","done, que indica si quedan elementos"],"c":1,"e":"El iterador debe tener un método `next()` que devuelva objetos `{ value, done }`. `value` es el elemento actual y `done` indica si terminó."},{"id":98,"t":6,"q":"¿Qué símbolo especial busca `for await...of` para recorrer valores que llegan de forma asincrónica?","o":["Symbol.isConcatSpreadable","Symbol.species","Symbol.asyncIterator"],"c":2,"e":"`for await...of` busca primero `Symbol.asyncIterator`, cuyo `next()` devuelve promesas. Así puede consumir valores que llegan con espera."},{"id":99,"t":6,"q":"¿Qué tipo de valor debe devolver un método `Symbol.toPrimitive`?","o":["Un valor primitivo","El propio objeto","Un string con la descripción"],"c":0,"e":"`Symbol.toPrimitive` debe devolver un valor primitivo (string, number, etc.). Si devuelve un objeto, JavaScript lanza TypeError."},{"id":100,"t":6,"q":"Si un objeto define `Symbol.toStringTag`, ¿qué cambia?","o":["El nombre que muestra typeof","El texto de Object.prototype.toString","La clave con que lo guarda JSON.stringify"],"c":1,"e":"`Symbol.toStringTag` define el nombre que aparece en `Object.prototype.toString`, por ejemplo `\"[object MiClase]\"`. No cambia `typeof` ni la identidad del objeto."},{"id":101,"t":6,"q":"Un objeto tiene índices numéricos y `length`, como un array. ¿Qué símbolo hace que `concat` lo expanda elemento por elemento?","o":["Symbol.hasInstance","Symbol.keyFor","Symbol.isConcatSpreadable"],"c":2,"e":"`Symbol.isConcatSpreadable` en `true` hace que `concat` expanda el objeto como si fuera un array, usando sus índices y su `length`."},{"id":102,"t":7,"q":"¿Cuándo es un array la mejor estructura para guardar una colección?","o":["Cuando importan el orden y las posiciones","Cuando cada clave es un objeto arbitrario","Cuando los duplicados deben desaparecer"],"c":0,"e":"Un array es adecuado cuando importan el orden y la posición de cada elemento. Para claves arbitrarias conviene un Map, y para eliminar duplicados, un Set."},{"id":103,"t":7,"q":"¿Qué diferencia hay entre `Array.of(3)` y `Array(3)`?","o":["Array.of(3) es [3]; Array(3) tiene tres huecos","Ambos crean un array con tres huecos vacíos","El primero tiene tres huecos; el segundo contiene 3"],"c":0,"e":"Con un único número, `Array(3)` lo interpreta como longitud y crea un array de 3 huecos. `Array.of(3)` siempre usa sus argumentos como elementos, así que da `[3]`."},{"id":104,"t":7,"q":"¿Qué expresión comprueba de forma confiable si `x` es un array?","o":["`typeof x === \"array\"`","`x instanceof Object`","`Array.isArray(x)`"],"c":2,"e":"`typeof` devuelve `\"object\"` para arrays, y `instanceof Object` es verdadero para arrays y objetos por igual. `Array.isArray` es la forma fiable de distinguirlos."},{"id":105,"t":7,"q":"Con `const a = [\"rojo\", \"azul\"]`, ¿qué devuelve `a.at(-1)`?","o":["\"rojo\"","\"azul\"","undefined"],"c":1,"e":"`at(-1)` cuenta desde el final: devuelve el último elemento, `\"azul\"`."},{"id":106,"t":7,"q":"¿Qué ocurre al asignar `a.length = 1` a `a = [1, 2, 3]`?","o":["Se descartan los elementos 2 y 3 y la longitud pasa a 1","Los elementos 2 y 3 quedan ocultos pero existen","Lanza TypeError: length es de solo lectura"],"c":0,"e":"`length` se puede escribir. Asignar un valor menor recorta el array y elimina los elementos sobrantes para siempre."},{"id":107,"t":7,"q":"¿Qué devuelve `1 in [1, , 3]`?","o":["true","false","undefined"],"c":1,"e":"`in` pregunta si existe el índice, no si hay un valor. En `[1, , 3]` la posición 1 es un hueco: no existe, así que da `false`."},{"id":108,"t":7,"q":"¿Qué devuelve `[10, 20, 30, 40].slice(1, 3)`?","o":["[20, 30, 40]","[10, 20, 30]","[20, 30]"],"c":2,"e":"`slice(1, 3)` copia desde el índice 1 hasta el 3 sin incluirlo, es decir, los índices 1 y 2: `[20, 30]`."},{"id":109,"t":7,"q":"¿Qué devuelve `push` al agregar un elemento a un array?","o":["El elemento agregado","Una copia del array","La nueva longitud"],"c":2,"e":"`push` agrega al final, modifica el array y devuelve la nueva longitud, no el elemento ni una copia."},{"id":110,"t":7,"q":"¿Qué devuelve `splice` además de modificar el array original?","o":["Una copia del array original antes del cambio","Un array con los elementos eliminados","La nueva longitud del array"],"c":1,"e":"`splice` modifica el array original y devuelve un array con los elementos que eliminó (vacío si no eliminó ninguno)."},{"id":111,"t":7,"q":"¿Qué expresión devuelve `true` porque encuentra `NaN` dentro del array?","o":["`[NaN].includes(NaN)`","`[NaN].indexOf(NaN) >= 0`","`NaN === NaN`"],"c":0,"e":"`includes` usa la comparación SameValueZero, que considera `NaN` igual a `NaN`. `indexOf` usa `===`, y como `NaN !== NaN`, nunca lo encuentra."},{"id":112,"t":7,"q":"¿Qué devuelve `find` si ningún elemento cumple la condición?","o":["undefined","-1","Un array vacío"],"c":0,"e":"`find` devuelve el primer elemento que cumple la condición o `undefined` si ninguno la cumple. Quien devuelve `-1` es `findIndex`."},{"id":113,"t":7,"q":"¿Qué bucle recorre directamente los valores de un array?","o":["for...in","for...of","switch"],"c":1,"e":"`for...of` recorre los valores. `for...in` recorre nombres de propiedades (los índices como strings) y no se recomienda para arrays."},{"id":114,"t":7,"q":"¿Qué método produce un array nuevo con un resultado por elemento?","o":["forEach","pop","map"],"c":2,"e":"`map` llama a la función una vez por elemento y arma un array nuevo con los resultados. `forEach` no devuelve nada, y `pop` quita el último elemento."},{"id":115,"t":7,"q":"`filter` devuelve un array nuevo con algunos objetos del array original. ¿Qué relación tienen esos objetos con los del original?","o":["Son los mismos objetos: filter copia solo las referencias","Cada objeto se copia en forma superficial","Se copian solo los objetos modificados"],"c":0,"e":"`filter` crea un array nuevo, pero sus elementos son los mismos objetos del original. Modificar un objeto filtrado modifica también el original."},{"id":116,"t":7,"q":"¿Por qué conviene pasar un valor inicial a `reduce`?","o":["Hace que reduce recorra el array de derecha a izquierda","Fija el acumulador y cubre el array vacío","Evita que el callback reciba el índice"],"c":1,"e":"Sin valor inicial, `reduce` usa el primer elemento como acumulador y lanza TypeError si el array está vacío. Con valor inicial, el acumulador empieza con un tipo conocido y el array vacío devuelve ese valor."},{"id":117,"t":7,"q":"¿Qué devuelve `forEach`?","o":["Un array transformado","El último elemento","undefined"],"c":2,"e":"`forEach` siempre devuelve `undefined`. Sirve para efectos por elemento. Si se necesita un resultado, corresponde `map`, `filter` o `reduce`."},{"id":118,"t":7,"q":"¿Qué resultado produce el siguiente código?\n\n```js\nconst datos = [1, [2, [3]]];\ndatos.flat(2);\n```","o":["Un array plano con 1, 2 y 3","Un array con el 3 todavía anidado","Un array con el 1 y el 2 anidados"],"c":0,"e":"`flat(2)` aplana hasta dos niveles de anidamiento. `[1, [2, [3]]]` tiene dos niveles, así que queda `[1, 2, 3]`."},{"id":119,"t":7,"q":"¿Por qué `[2, 10, 1].sort()` no da necesariamente el orden numérico esperado?","o":["sort sin comparador ordena de mayor a menor","sort ordena según el orden de inserción original","Sin comparador, sort convierte a string y compara texto"],"c":2,"e":"Sin comparador, `sort` convierte los elementos a string y los ordena como texto. `\"10\"` va antes que `\"2\"` porque `\"1\"` es menor que `\"2\"`. Para números hay que usar `sort((a, b) => a - b)`."},{"id":120,"t":7,"q":"Después de `const copia = [...original]`, donde `original` contiene objetos, ¿qué comparten ambos arrays?","o":["El mismo array exterior, con otro nombre","Las referencias a los objetos internos","Nada: los objetos se copian también"],"c":1,"e":"El spread crea un array exterior nuevo, pero copia las referencias a los objetos, no los objetos. Es una copia superficial: ambos arrays comparten los mismos objetos internos."},{"id":121,"t":7,"q":"¿Qué problema tiene crear una matriz de 3 × 3 con `Array(3).fill(Array(3).fill(0))`?","o":["Las tres filas son el mismo array, así que cambiar una cambia todas","Las filas quedan con huecos en lugar de ceros","Solo la primera fila queda llena de ceros"],"c":0,"e":"`fill` coloca el mismo valor en todas las posiciones. Aquí ese valor es un único array, así que las tres filas son el mismo objeto: cambiar una celda cambia la columna entera."},{"id":122,"t":7,"q":"Para un array con los valores 10, 20, 30, 40 y 50, ¿qué devuelve `slice(-2)`?","o":["El array original reducido a 40 y 50","Un array nuevo con 40 y 50","Un array nuevo con 10 y 20"],"c":1,"e":"`slice(-2)` toma los dos últimos elementos y devuelve un array nuevo. El original no cambia."},{"id":123,"t":7,"q":"Para los valores 1, 2 y 3, ¿qué devuelven respectivamente `some(n => n > 2)` y `every(n => n > 2)`?","o":["true y true","false y false","true y false"],"c":2,"e":"`some` es `true` si al menos un elemento cumple (el 3). `every` es `true` solo si todos cumplen, y 1 y 2 no lo hacen."},{"id":124,"t":7,"q":"Tras ejecutar este código, ¿qué ocurre con `original` y `copia`?\n\n```js\nconst original = [3, 1, 2];\nconst copia = original.toSorted((a, b) => a - b);\n```","o":["Ambos quedan ordenados de menor a mayor","original no cambia; copia queda ordenada","original queda ordenado; copia no cambia"],"c":1,"e":"`toSorted` devuelve una copia ordenada y no toca el original. `sort` sí ordena el array en su lugar."},{"id":125,"t":7,"q":"¿Por qué `Array.from({ length: 3 }, () => Array(3).fill(0))` evita el problema de las filas compartidas?","o":["Todas las filas usan la misma referencia a un único array","Convierte la matriz en un objeto sin índices","La función crea un array nuevo para cada fila"],"c":2,"e":"`Array.from` llama a la función una vez por fila, y cada llamada crea un array nuevo. Así las filas son independientes."},{"id":126,"t":8,"q":"¿Qué estructura conviene para representar un alumno con campos fijos, como nombre y legajo?","o":["Un objeto","Un Set","Una cadena separada por comas"],"c":0,"e":"Un objeto agrupa campos con nombre. Un Set guarda valores sin nombre, y una cadena separada por comas obliga a interpretar posiciones."},{"id":127,"t":8,"q":"Si un objeto se crea con `{ 10: \"diez\" }`, ¿cómo aparece esa clave en `Object.keys`?","o":["Como el string \"10\"","Como el número 10","Como un symbol"],"c":0,"e":"Las claves de un objeto común siempre son strings (o symbols). La clave `10` se guarda como `\"10\"`."},{"id":128,"t":8,"q":"Con `const campo = \"precio\"`, ¿qué expresión lee la propiedad `precio` de `producto` usando la variable?","o":["`producto.campo`","`producto[\"campo\"]`","`producto[campo]`"],"c":2,"e":"Los corchetes evalúan la expresión: `producto[campo]` lee la clave `\"precio\"`. `producto.campo` y `producto[\"campo\"]` buscan literalmente una clave llamada `\"campo\"`."},{"id":129,"t":8,"q":"¿Qué efecto tiene `delete producto.stock`?","o":["La conserva con valor undefined","Quita la propiedad stock","La convierte en null"],"c":1,"e":"`delete` quita la propiedad del objeto. Después, `\"stock\" in producto` es `false`. Asignar `undefined`, en cambio, conserva la propiedad."},{"id":130,"t":8,"q":"¿Qué diferencia hay entre `Object.hasOwn(obj, \"x\")` y `\"x\" in obj`?","o":["in considera propiedades heredadas; hasOwn no","hasOwn considera heredadas; in no","Ambas revisan también las propiedades heredadas"],"c":0,"e":"`in` busca en el objeto y en toda su cadena de prototipos. `Object.hasOwn` mira solo las propiedades propias."},{"id":131,"t":8,"q":"`alumno.direccion` puede ser `null` o `undefined`. ¿Qué evita escribir `alumno.direccion?.ciudad`?","o":["Validar cualquier campo obligatorio","Leer ciudad cuando direccion es null o undefined","Que ciudad valga undefined si falta"],"c":1,"e":"Si `direccion` es `null` o `undefined`, `?.` corta la cadena y devuelve `undefined` en lugar de lanzar TypeError al intentar leer `ciudad`."},{"id":132,"t":8,"q":"Con `const nombre = \"Ana\"`, ¿qué crea `{ nombre }`?","o":["Un Set que contiene el string \"Ana\"","Un bloque de código que evalúa nombre","La propiedad nombre con valor \"Ana\""],"c":2,"e":"Es la forma abreviada de propiedad: `{ nombre }` equivale a `{ nombre: nombre }`. Crea la propiedad `nombre` con el valor de la variable, `\"Ana\"`."},{"id":133,"t":8,"q":"¿Por qué no conviene definir con una función flecha un método de objeto que usa `this`?","o":["No puede devolver valores","No tiene this propio","Su this es el objeto donde se define"],"c":1,"e":"Las funciones flecha no tienen `this` propio: usan el del alcance donde se escribieron. Como método de un objeto literal, su `this` no es el objeto."},{"id":134,"t":8,"q":"En un literal de objeto, ¿qué sintaxis usa el contenido de la variable `campo` como nombre de la clave?","o":["`{ campo: valor }`","`{ \"campo\": valor }`","`{ [campo]: valor }`"],"c":2,"e":"Los corchetes en un literal crean una clave calculada: `{ [campo]: valor }` usa el contenido de la variable como nombre. `{ campo: valor }` crea una clave llamada `\"campo\"`."},{"id":135,"t":8,"q":"¿Qué función devuelve pares [clave, valor] de propiedades propias enumerables?","o":["Object.entries","Object.getOwnPropertyNames","Object.hasOwn"],"c":0,"e":"`Object.entries` devuelve un array de pares `[clave, valor]`. `Object.values` devuelve solo los valores, y `Object.hasOwn` responde si existe una clave."},{"id":136,"t":8,"q":"¿Qué devuelve `({ x: 1 }) === ({ x: 1 })`?","o":["true, porque sus campos coinciden","undefined, porque no se comparan objetos","false, porque son objetos distintos"],"c":2,"e":"`===` compara referencias de objetos, no su contenido. Cada literal crea un objeto nuevo, así que son distintos aunque tengan los mismos campos."},{"id":137,"t":8,"q":"`a` es un objeto. Después de `const b = a; b.nombre = \"Ana\";`, ¿qué valor tiene `a.nombre`?","o":["El valor anterior, porque b es una copia","El nuevo valor, porque a y b son el mismo objeto","undefined, porque b tomó la propiedad"],"c":1,"e":"`const b = a` copia la referencia, no el objeto. `a` y `b` apuntan al mismo objeto, así que el cambio se ve desde las dos variables."},{"id":138,"t":8,"q":"`original` tiene una propiedad `usuario` que es un objeto. Después de `const copia = { ...original }`, ¿qué comparación da `true`?","o":["`copia.usuario === original.usuario`","`copia === original`","`copia.usuario === structuredClone(original.usuario)`"],"c":0,"e":"El spread copia un solo nivel. `copia.usuario` y `original.usuario` son el mismo objeto. `copia` y `original`, en cambio, son objetos distintos."},{"id":139,"t":8,"q":"`base` tiene la propiedad `tema: \"claro\"`. ¿Qué valor de `tema` tiene el objeto `{ ...base, tema: \"oscuro\" }`?","o":["\"claro\"","\"oscuro\"","undefined"],"c":1,"e":"En un literal, si una clave se repite gana la última. `tema: \"oscuro\"` aparece después del spread y sobrescribe el valor de `base`."},{"id":140,"t":8,"q":"¿Qué argumento modifica `Object.assign(destino, origen)`?","o":["origen","Ninguno: devuelve un objeto nuevo","destino"],"c":2,"e":"`Object.assign` copia las propiedades de `origen` en `destino`, lo modifica y devuelve ese mismo `destino`. `origen` no cambia."},{"id":141,"t":8,"q":"Al copiar un objeto que contiene otros objetos, ¿qué hace `structuredClone` que el spread `{ ...obj }` no hace?","o":["Puede crear objetos internos nuevos en lugar de compartirlos","Copia también las funciones de los objetos","Solo copia el primer nivel del objeto"],"c":0,"e":"`structuredClone` hace una copia profunda: crea objetos internos nuevos. El spread copia solo el primer nivel. `structuredClone` no puede copiar funciones y lanza un error si las encuentra."},{"id":142,"t":8,"q":"Con `const { nombre: nombreCompleto } = persona`, ¿qué variable local se crea?","o":["nombre","nombreCompleto","persona.nombreCompleto"],"c":1,"e":"En `{ nombre: nombreCompleto }`, `nombre` es la propiedad que se lee y `nombreCompleto` es la variable que se crea."},{"id":143,"t":8,"q":"¿Por qué `JSON.parse(JSON.stringify(obj))` no sirve para clonar cualquier objeto?","o":["Copia solo el primer nivel del objeto","Modifica el objeto original al serializarlo","Pierde undefined, funciones y fechas, y falla con ciclos"],"c":2,"e":"JSON no representa `undefined` ni funciones, que se pierden. Las fechas se convierten en strings, los símbolos desaparecen y los objetos con ciclos hacen fallar `stringify`."},{"id":144,"t":8,"q":"¿Qué añade `Reflect.ownKeys(obj)` frente a `Object.keys(obj)`?","o":["También claves symbol y propiedades no enumerables","Las claves heredadas del prototipo","Los valores junto con cada clave"],"c":0,"e":"`Reflect.ownKeys` devuelve todas las claves propias: strings y symbols, enumerables o no. `Object.keys` devuelve solo las claves string enumerables."},{"id":145,"t":8,"q":"Si se aplica `Object.freeze` a un objeto que contiene otro objeto, ¿qué cambio puede seguir siendo posible?","o":["Modificar el objeto interior, si no se congeló","Reasignar una propiedad directa con otro objeto","Agregar propiedades directas si no existían antes"],"c":0,"e":"`Object.freeze` es superficial: congela las propiedades directas del objeto, pero un objeto interior que no se congeló sigue siendo modificable."},{"id":146,"t":8,"q":"En `const { idioma = \"es\" } = configuracion`, ¿cuándo se usa `\"es\"`?","o":["Cuando idioma vale null o undefined","Cuando idioma es una cadena vacía","Cuando la propiedad falta o su valor es undefined"],"c":2,"e":"El valor predeterminado en la desestructuración se usa solo si la propiedad falta o vale `undefined`. `null` y `\"\"` se respetan."},{"id":147,"t":8,"q":"¿Qué hace `Object.fromEntries` con una colección de pares clave y valor?","o":["Devuelve un Map con esos pares","Construye un objeto con esos pares como propiedades","Devuelve un array de claves"],"c":1,"e":"`Object.fromEntries` hace lo inverso de `Object.entries`: recibe pares `[clave, valor]` y construye un objeto con ellos."},{"id":148,"t":9,"q":"¿Cuándo conviene usar un Map en lugar de un objeto común?","o":["Cuando se necesita convertir a JSON directo","Cuando importa el orden por posición numérica","Cuando las claves salen de los datos y pueden ser de cualquier tipo"],"c":2,"e":"Un Map conviene cuando las claves no se conocen de antemano, se agregan y quitan seguido o no son strings. Para campos fijos y conocidos, un objeto es más claro."},{"id":149,"t":9,"q":"¿Puede un objeto usarse como clave de Map sin convertirse en string?","o":["No, Map convierte la clave en string","Sí","Solo si tiene una propiedad id"],"c":1,"e":"Un Map acepta cualquier valor como clave, incluidos objetos, y los compara por referencia sin convertirlos a string."},{"id":150,"t":9,"q":"Un Map guarda el valor `undefined` en una clave. ¿Cómo se distingue esa clave de una que no existe?","o":["Con mapa.has(clave)","Con mapa.get(clave) === undefined","Comparando el tamaño con cero"],"c":0,"e":"`get` devuelve `undefined` tanto si la clave falta como si el valor guardado es `undefined`. `has` responde si la clave existe."},{"id":151,"t":9,"q":"¿En qué orden recorre pares un Map?","o":["En orden alfabético de claves","En orden de inserción","En orden numérico de valores"],"c":1,"e":"Un Map recuerda el orden en que se insertaron las claves y las recorre en ese orden."},{"id":152,"t":9,"q":"¿En qué orden recibe argumentos el callback de Map.forEach?","o":["clave, valor, mapa","índice, valor, mapa","valor, clave, mapa"],"c":2,"e":"El callback de `Map.forEach` recibe primero el valor y después la clave, igual que el `forEach` de arrays recibe primero el elemento y después el índice."},{"id":153,"t":9,"q":"Hay que buscar muchos alumnos por legajo dentro de un array. ¿Qué se gana al armar antes un Map con el legajo como clave?","o":["Busca por legajo directamente, sin recorrer el array cada vez","Ordena los alumnos por número de legajo","Evita que haya dos alumnos con el mismo nombre"],"c":0,"e":"Con un Map indexado por legajo, cada búsqueda es un acceso directo por clave. Buscar en el array obliga a recorrerlo cada vez."},{"id":154,"t":9,"q":"¿Qué tamaño tiene `new Set([\"js\", \"node\", \"js\"])`?","o":["3","1","2"],"c":2,"e":"Un Set no guarda duplicados. `\"js\"` aparece dos veces pero se guarda una vez: quedan `\"js\"` y `\"node\"`."},{"id":155,"t":9,"q":"¿Qué valor tiene `new Set([{ id: 1 }, { id: 1 }]).size`?","o":["1","2","0"],"c":1,"e":"Un Set compara objetos por referencia. Dos literales `{id: 1}` son objetos distintos, así que ambos se guardan."},{"id":156,"t":9,"q":"Si se agrega a un Set un valor que ya contiene, ¿qué pasa con ese valor?","o":["Queda en su lugar original","Se mueve al final del Set","Se agrega otra copia al final"],"c":0,"e":"Agregar un valor que ya está no tiene efecto: no se duplica ni cambia de lugar. Conserva la posición de su primera inserción."},{"id":157,"t":9,"q":"¿Qué contiene la intersección de dos conjuntos?","o":["Los valores de uno u otro conjunto","Solo valores presentes en ambos","Valores presentes en exactamente uno"],"c":1,"e":"La intersección contiene solo los valores presentes en ambos conjuntos. La unión tiene los de cualquiera, y la diferencia simétrica, los que están en uno solo."},{"id":158,"t":9,"q":"¿Qué estructura conviene si importan el orden de los elementos y también sus repeticiones?","o":["Set","WeakSet","Array"],"c":2,"e":"Un array conserva el orden y admite repetidos. Un Set y un WeakSet eliminan duplicados."},{"id":159,"t":9,"q":"Si los valores de un Map son objetos, ¿qué comparte `new Map(original)` con el Map original?","o":["Las referencias a esos objetos","El mismo Map, con otro nombre","Nada: los valores se clonan también"],"c":0,"e":"`new Map(original)` crea un Map nuevo, pero copia las referencias de los valores. Si son objetos, ambos Map comparten los mismos objetos."},{"id":160,"t":9,"q":"¿Qué diferencia principal tiene un WeakMap respecto de un Map?","o":["No impide que el recolector libere sus claves objeto","Permite iterar todas sus claves","Acepta claves primitivas y objetos"],"c":0,"e":"WeakMap no impide que sus claves objeto se liberen de la memoria cuando nadie más las usa. Por eso no se puede recorrer ni tiene `size`, y solo acepta objetos como clave."},{"id":161,"t":9,"q":"¿Para qué sirve WeakSet?","o":["Guardar valores primitivos sin duplicados","Marcar objetos sin impedir su liberación","Listar objetos en orden de inserción"],"c":1,"e":"WeakSet sirve para marcar objetos (por ejemplo, \"ya procesado\") sin impedir que se liberen de la memoria. No se puede recorrer y no acepta primitivos."},{"id":162,"t":9,"q":"¿Qué método de Set indica si un valor pertenece al conjunto?","o":["set.indexOf(valor)","set.get(valor)","set.has(valor)"],"c":2,"e":"`has` responde si el valor pertenece al Set. Los Set no tienen `indexOf` ni `get`."},{"id":163,"t":10,"q":"¿Qué hace más legible la condición de un `if` que expresa una regla importante?","o":["Un valor truthy sin comparar","Una condición con nombre que explique la regla","Una asignación dentro del if"],"c":1,"e":"Una condición con nombre, como `const esMayorDeEdad = edad >= 18`, explica la regla de negocio. Un valor truthy sin contexto obliga al lector a deducir la intención."},{"id":164,"t":10,"q":"Cada vez que se ejecuta `if (condición) { A } else { B }`, ¿qué está garantizado?","o":["Se ejecuta uno de los dos caminos","Se ejecutan A y B en orden","No se ejecuta ninguno aunque la condición sea válida"],"c":0,"e":"`if...else` garantiza que se ejecuta exactamente uno de los dos bloques: si la condición es truthy, A; si no, B."},{"id":165,"t":10,"q":"Una cadena de `if...else if` clasifica notas en dos grupos: 8 o más, y 6 o más. ¿Qué condición debe ir primero?","o":["La de 6 o más","Cualquiera, pues se evalúan ambas ramas","La de 8 o más"],"c":2,"e":"En una cadena de `if...else if` se ejecuta la primera rama que se cumple. Una nota de 9 también es \"6 o más\", así que la condición más exigente tiene que ir primero."},{"id":166,"t":10,"q":"Una función empieza con `if (!pedido) return;`. ¿Qué se logra con esa guarda?","o":["Hace que todas las condiciones sean globales","Obliga a usar switch","Deja el camino válido con menos anidamiento"],"c":2,"e":"Una guarda retorna temprano ante el caso inválido. El resto de la función puede suponer que el pedido existe y no necesita anidarse dentro de un `if`."},{"id":167,"t":10,"q":"¿Cuándo conviene anidar dos `if` en lugar de unir las condiciones con `&&`?","o":["Cuando una decisión solo tiene sentido dentro de la otra","Cuando ambas condiciones son independientes y triviales","Cuando hay que garantizar que se evalúen las dos condiciones"],"c":0,"e":"Si la segunda condición solo tiene sentido cuando se cumple la primera, anidarlas refleja esa dependencia. Si son independientes, una expresión combinada suele ser más clara."},{"id":168,"t":10,"q":"¿Qué equivale a `!(tieneSaldo && hayStock)`?","o":["`!tieneSaldo && !hayStock`","`!tieneSaldo || !hayStock`","`tieneSaldo || hayStock`"],"c":1,"e":"Es la ley de De Morgan: negar un AND equivale a hacer OR de las negaciones. No se puede comprar si falta saldo o si falta stock."},{"id":169,"t":10,"q":"¿Cómo compara `switch` el valor con cada `case`?","o":["Con igualdad flexible (==)","Con igualdad estricta","Con comparación estructural profunda"],"c":1,"e":"`switch` compara con `===`, sin conversión de tipos. `case 1` no coincide con `\"1\"`."},{"id":170,"t":10,"q":"¿En qué situación conviene usar `switch`?","o":["Clasificar intervalos numéricos solapados","Repetir hasta que cambie una condición","Elegir según códigos fijos de un estado"],"c":2,"e":"`switch` sirve para elegir entre valores discretos, como códigos de estado. Para intervalos numéricos queda más claro un `if...else if`, y para repetir, un bucle."},{"id":171,"t":10,"q":"¿Qué pasa en switch si un case no termina con break, return o throw?","o":["Sigue ejecutando el case siguiente hasta encontrar un corte","Sale del switch al final del case","Se produce SyntaxError al analizar el código"],"c":0,"e":"Sin `break`, `return` o `throw`, la ejecución sigue en el `case` siguiente sin evaluar su condición. Esto se llama fall-through."},{"id":172,"t":10,"q":"¿Para qué sirve encerrar entre llaves el código de cada `case` de un `switch`?","o":["Para que cada case tenga su propio alcance","Para que el break sea opcional en ese case","Para que case compare con igualdad flexible"],"c":0,"e":"Todos los `case` de un `switch` comparten un único alcance de bloque. Si dos declaran `const` con el mismo nombre, hay SyntaxError. Las llaves crean un alcance propio para cada `case`."},{"id":173,"t":10,"q":"`intentos` empieza en 0. ¿Qué le falta a `while (intentos < 3) { ejecutar(); }` para terminar?","o":["Un else que termine el bucle","Incrementar intentos en el cuerpo","Declarar intentos con const"],"c":1,"e":"La condición depende de `intentos`, pero nada lo cambia dentro del bucle: se repite para siempre. Falta algo como `intentos += 1` en el cuerpo."},{"id":174,"t":10,"q":"¿Qué bucle ejecuta el cuerpo al menos una vez antes de evaluar su condición?","o":["while","for clásico","do...while"],"c":2,"e":"`do...while` ejecuta el cuerpo primero y evalúa la condición al final, así que corre al menos una vez. `while` evalúa antes de entrar."},{"id":175,"t":10,"q":"¿En qué orden se ejecutan las partes de un `for` clásico?","o":["Inicio, condición, cuerpo, actualización, condición","Inicio, condición, actualización, cuerpo, condición","Inicio, cuerpo, condición, actualización, cuerpo"],"c":0,"e":"El `for` clásico inicializa una vez, evalúa la condición, ejecuta el cuerpo, actualiza y vuelve a evaluar la condición. Así hasta que sea falsa."},{"id":176,"t":10,"q":"¿Qué bucle recorre valores de un array o Set?","o":["for...in","switch","for...of"],"c":2,"e":"`for...of` recorre los valores de cualquier iterable, como arrays, Set, Map o strings."},{"id":177,"t":10,"q":"¿Qué recorre `for...in` sobre un objeto?","o":["Los valores de las propiedades propias","Claves enumerables, también las heredadas","Las claves propias, incluidas las symbol"],"c":1,"e":"`for...in` recorre los nombres de las propiedades enumerables del objeto, incluidas las heredadas del prototipo. No recorre claves symbol."},{"id":178,"t":10,"q":"¿Qué hace break dentro de un bucle?","o":["Salta solo a la vuelta siguiente","Reinicia el contador","Termina el bucle más cercano"],"c":2,"e":"`break` termina el bucle más cercano que lo contiene. La ejecución sigue después del bucle."},{"id":179,"t":10,"q":"¿Qué hace continue dentro de un bucle?","o":["Pasa a la vuelta siguiente","Termina el bucle más cercano","Sale de todos los bucles anidados"],"c":0,"e":"`continue` saltea el resto de la vuelta actual y pasa a la siguiente. El bucle no termina."},{"id":180,"t":10,"q":"¿Qué permite `break etiqueta` en bucles anidados?","o":["Salir del bucle interior, como un break común","Salir directamente del bucle que tiene esa etiqueta","Volver al comienzo del bucle exterior"],"c":1,"e":"Una etiqueta nombra un bucle. `break etiqueta` sale directamente de ese bucle, aunque haya otros anidados dentro."},{"id":181,"t":10,"q":"Un bucle recorre un array por índice y elimina elementos con `splice`. ¿Por qué puede saltearse elementos?","o":["El siguiente se corre al índice actual","splice deja un hueco en esa posición","splice reordena el resto del array"],"c":0,"e":"Al eliminar con `splice`, los elementos siguientes se corren una posición hacia atrás. Si el índice avanza igual, el elemento que ocupó el lugar del eliminado queda sin revisar."},{"id":182,"t":10,"q":"¿Cuándo conviene usar el operador ternario `condición ? a : b`?","o":["Al encadenar varias decisiones anidadas","Al ejecutar una acción sin valor de retorno","Al elegir un valor entre dos alternativas de forma breve"],"c":2,"e":"El ternario es una expresión: elige uno de dos valores en una línea. Anidado o usado para ejecutar acciones, se vuelve difícil de leer."},{"id":183,"t":11,"q":"Dentro de un bloque, `JSON.parse` lanza un error porque el texto no es JSON válido. ¿Qué pasa con la sentencia siguiente de ese bloque?","o":["Se ejecuta con el valor undefined","No se ejecuta: la excepción corta el bloque y se propaga","Se ejecuta y el error se registra en consola"],"c":1,"e":"Cuando una sentencia lanza, el resto del bloque no se ejecuta. La excepción se propaga hasta un `catch` o, si no lo hay, detiene el programa."},{"id":184,"t":11,"q":"Si una sentencia dentro de `try` lanza un error, ¿dónde continúa la ejecución?","o":["Al comienzo del try","Directo al finally","Al catch correspondiente"],"c":2,"e":"Cuando algo lanza dentro de `try`, el control salta de inmediato al `catch`. Después se ejecuta `finally`, si existe."},{"id":185,"t":11,"q":"¿Por qué se recomienda lanzar `new Error(mensaje)` y no una cadena?","o":["Permite capturarlo con catch","Incluye nombre, mensaje y pila","Hace que el error no detenga el programa"],"c":1,"e":"Un objeto `Error` incluye `name`, `message` y `stack` (la pila de llamadas), y puede llevar `cause`. Un string también se puede capturar, pero no trae esa información."},{"id":186,"t":11,"q":"Una función `dividir` no admite divisor cero y, si lo recibe, hace `throw new RangeError(...)`. ¿Qué expresa ese error?","o":["Que la entrada incumple el contrato de esa función","Que JavaScript lanza al dividir un number por cero","Que cero se convierte en null"],"c":0,"e":"`RangeError` indica que un valor está fuera de lo aceptado. JavaScript no lanza nada al dividir un number por cero: da `Infinity`. Si la función prohíbe el cero, es su contrato y debe lanzar ella."},{"id":187,"t":11,"q":"Una función busca un alumno, y que no exista es un resultado habitual. ¿Qué conviene que devuelva si no lo encuentra?","o":["Lanzar una excepción al no encontrarlo","Un objeto alumno con campos vacíos","Un resultado documentado como null"],"c":2,"e":"Si no encontrar es un resultado esperado, devolver `null` (documentado) es más claro que lanzar. Las excepciones son para situaciones que la función no puede resolver."},{"id":188,"t":11,"q":"¿Qué error lanza JavaScript cuando una operación recibe un valor de un tipo que no corresponde?","o":["TypeError","RangeError","URIError"],"c":0,"e":"TypeError aparece cuando una operación recibe un valor del tipo equivocado, por ejemplo al llamar a algo que no es una función."},{"id":189,"t":11,"q":"¿Qué error lanza `JSON.parse` si el texto está mal formado?","o":["ReferenceError","SyntaxError","AggregateError"],"c":1,"e":"`JSON.parse` lanza SyntaxError si el texto no es JSON válido."},{"id":190,"t":11,"q":"Una función de stock lanza un error que incluye las propiedades `disponible` y `requerido`. ¿Qué ventaja tiene eso?","o":["Hace innecesario el mensaje de error","Permite decidir con datos, no con el texto","Hace que el error no necesite capturarse"],"c":1,"e":"Con propiedades como `disponible` y `requerido`, quien captura el error puede decidir con datos. Extraer esos números del texto del mensaje es frágil."},{"id":191,"t":11,"q":"Se captura un error técnico y se lanza otro, más comprensible para la aplicación. ¿Qué propiedad del nuevo error guarda el error original?","o":["stackLength","responseText","cause"],"c":2,"e":"`cause` guarda el error original: `new Error(\"mensaje\", { cause: error })`. Así se traduce a un error de dominio sin perder el detalle técnico."},{"id":192,"t":11,"q":"¿Por qué conviene evitar un único `try` que envuelva el parseo, la validación, el guardado y la notificación?","o":["Se vuelve difíci
