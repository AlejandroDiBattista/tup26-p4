<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font: 16px sans-serif;
      background: white;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: auto;
    }

    h1 {
      margin: 0 0 24px;
    }

    input[type="search"] {
      box-sizing: border-box;
      width: 100%;
      max-width: 360px;
      margin: 0 0 24px;
      padding: 10px 14px;
      font: inherit;
      border: 1px solid #d9ded9;
      border-radius: 12px;
      background: white;
    }

    input[type="search"]:focus {
      outline: 2px solid #8aa58a;
      outline-offset: 1px;
    }

    .vacio {
      color: #6b736b;
    }

    .lista-alumnos {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 0;
      list-style: none;

      & > li {
        min-width: 0;
      }
    }

    .tarjeta {
      height: 100%;
      box-sizing: border-box;
      padding: 20px;
      border: 1px solid #d9ded9;
      border-radius: 8px;
      background: white;

      & header {
        padding-bottom: 12px;
        border-bottom: 1px solid #e7ebe7;
      }

      & h2 {
        margin: 0 0 8px;
        font-size: 1.15rem;
      }

      & p {
        margin: 8px 0 0;
      }

      .contacto {
        display: grid;
        gap: 8px;
        margin-top: 14px;
        font-style: normal;
      }

      & a {
        color: #315e48;
        overflow-wrap: anywhere;
      }

      & footer {
        margin-top: 14px;
        color: #59645d;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 900px) {
      .lista-alumnos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .lista-alumnos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }

    const alumnosGuardados = localStorage.getItem('agenda_alumnos')
    const datosAlumnos = alumnosGuardados ? JSON.parse(alumnosGuardados) : alumnosIniciales

    const estado = reactive({
      alumnos: datosAlumnos,
      busqueda: ''
    })

    watch(() => estado.alumnos, (nuevosAlumnos) => {
      localStorage.setItem('agenda_alumnos', JSON.stringify(nuevosAlumnos))
    })

    const normalizar = (texto) =>
      texto
        .toLowerCase()
        .normalize('NFD')
        .replace(/n\u0303/g, '\u0001')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\u0001/g, 'ñ')

    const filtrarAlumnos = () => {
      const terminos = normalizar(estado.busqueda).split(/\s+/).filter(Boolean)
      const alumnosFiltrados = !terminos.length
        ? [...estado.alumnos]
        : estado.alumnos.filter(a => {
          const completo = normalizar(`${a.nombre} ${a.apellido}`)
          return terminos.every(t => completo.includes(t))
        })

      const comparador = new Intl.Collator('es', { sensitivity: 'base' })
      return alumnosFiltrados.sort((a, b) =>
        comparador.compare(a.apellido, b.apellido) ||
        comparador.compare(a.nombre, b.nombre)
      )
    }

    const app = document.getElementById('app')
    html`
      <h1>Alumnos</h1>
      <input
        type="search"
        placeholder="Buscar alumno..."
        aria-label="Buscar alumno"
        autocomplete="off"
        value="${() => estado.busqueda}"
        @input="${(e) => { estado.busqueda = e.target.value }}"
      >
      <ul class="lista-alumnos">
        ${() => filtrarAlumnos().map(a => html`
          <li>
            <article class="tarjeta">
              <header>
                <h2>${a.apellido}, ${a.nombre}</h2>
                <p>Legajo: <strong>${a.legajo}</strong></p>
              </header>
              <div class="contacto">
                <p>Teléfono: ${a.telefono}</p>
                <p>GitHub: ${a.github}</p>
              </div>
              <footer>Comisión: ${a.comision}</footer>
            </article>
          </li>
        `)}
      </ul>
      ${() => filtrarAlumnos().length === 0
        ? html`<p class="vacio">No se encontraron alumnos.</p>`
        : ''}
    `(app)
  </script>
</body>

</html>
