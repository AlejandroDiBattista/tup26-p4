<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniCRM | Gestión de clientes</title>
    <!-- React permite construir la interfaz con componentes -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <!-- Babel permite escribir JSX directamente en HTML -->
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <style>
        :root {
            --blue: #2874df;
            --navy: #30496a;
            --border: #dce2e9;
            --text: #111827;
            --muted: #747e8d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--text);
            background: #f3f6f9;
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        /* estructura general */
        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            flex: 0 0 66px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            background: var(--navy);
        }

        .topbar h1 {
            color: #fff;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.8px;
        }

        .workspace {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(390px, 31%) minmax(0, 1fr);
            gap: 12px;
            padding: 11px 12px 16px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            background: #fff;
            border: 1px solid #dce3eb;
            border-radius: 11px;
        }

        /* botones */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 43px;
            padding: 10px 16px;
            color: #172033;
            background: #fff;
            border: 1px solid #d9dfe7;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn:hover {
            background: #f4f7fa;
        }

        .btn-primary {
            color: #fff;
            background: var(--blue);
            border-color: var(--blue);
        }

        .btn-primary:hover {
            background: #1f62c4;
        }

        .btn-danger {
            color: #b83d46;
            border-color: #e7b5b9;
            background: #fff;
        }

        .btn-danger:hover {
            background: #fdf1f2;
        }

        .icon-btn {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            color: #556070;
            background: #fff;
            border: 1px solid #dce1e7;
            border-radius: 8px;
            cursor: pointer;
        }

        .icon-btn:hover {
            background: #f4f7fa;
            border-color: #bfc8d4;
        }

        .delete-icon {
            color: #c0392b;
        }

        /* panel de clientes */
        .panel-heading {
            padding: 17px 20px 18px;
        }

        .heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .clients-panel h2 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -.6px;
        }

        .clients-panel .heading-row .btn {
            min-height: 44px;
            padding: 9px 16px;
        }

        .clients-panel .subtitle {
            display: none;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: #9aa2b1;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .search {
            width: 100%;
            height: 48px;
            padding: 12px 15px 12px 44px;
            border: 1px solid #d5dbe3;
            border-radius: 8px;
            font-size: 16px;
            color: var(--text);
            background: #fff;
        }

        .search::placeholder {
            color: #9aa2b1;
        }

        .search:focus,
        .activity-form-row input:focus,
        .form-field input:focus {
            outline: 2px solid #9cc2f5;
            border-color: var(--blue);
        }

        .client-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #bec3cb transparent;
        }

        .client-item {
            width: 100%;
            min-height: 85px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 13px 21px;
            border: 0;
            border-bottom: 1px solid #e8ebef;
            background: #fff;
            text-align: left;
            cursor: pointer;
        }

        .client-item:hover {
            background: #f4f8fd;
        }

        .client-item.selected,
        .client-item.selected:hover {
            background: #eef5ff;
        }

        .client-avatar {
            flex: 0 0 54px;
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #dceaff;
            color: #3569b8;
            font-size: 18px;
            font-weight: 600;
        }

        .client-item:nth-child(6n + 2) .client-avatar {
            background: #d8f5e5;
            color: #32805d;
        }

        .client-item:nth-child(6n + 3) .client-avatar {
            background: #e7e0ff;
            color: #6554ad;
        }

        .client-item:nth-child(6n + 4) .client-avatar {
            background: #ffe5c7;
            color: #a45b28;
        }

        .client-item:nth-child(6n + 5) .client-avatar {
            background: #fbdce8;
            color: #b04e76;
        }

        .client-item:nth-child(6n) .client-avatar {
            background: #d7f5f2;
            color: #277e79;
        }

        .client-name {
            margin-bottom: 4px;
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .client-email {
            color: #747e8d;
            font-size: 15px;
        }

        /* ficha del cliente */
        .detail-panel {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #bec3cb transparent;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin: 0 24px;
            padding: 24px 0 20px 0;
            border-bottom: 1px dashed #d5dbe3;
        }

        .client-main-info {
            flex: 1;
            min-width: 0;
        }

        .detail-title {
            margin-bottom: 24px;
            font-size: 36px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -.6px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
            column-gap: 32px;
            row-gap: 12px;
            align-items: start;
        }

        .contact-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 17px;
            color: #2c3545;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .contact-address {
            grid-column: 2;
            grid-row: 1 / span 2;
        }

        .contact-icon {
            flex: 0 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
            color: #7b8493;
        }

        .detail-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            flex-shrink: 0;
        }

        .client-id {
            color: #8c95a3;
            font-size: 17px;
        }

        .detail-actions .actions {
            display: flex;
            gap: 10px;
        }

        .detail-actions .btn {
            min-height: 44px;
            padding: 9px 16px;
        }

        .detail-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px;
        }

        .section-title {
            margin: 0 0 14px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.4px;
        }

        /* formulario de actividad */
        .activity-form {
            padding: 18px 20px 20px;
            border: 1px dashed #cfd6e0;
            border-radius: 10px;
            background: #fff;
        }

        .activity-form h3 {
            margin-bottom: 14px;
            font-size: 20px;
            font-weight: 700;
        }

        .activity-form-row {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(180px, 1fr) auto auto;
            align-items: center;
            gap: 12px;
        }

        .activity-form-row input {
            width: 100%;
            min-width: 0;
            height: 48px;
            padding: 10px 14px;
            border: 1px solid #d5dbe3;
            border-radius: 8px;
            background: #fff;
            color: #172033;
            font-size: 15px;
        }

        .activity-form-row input::placeholder {
            color: #a0a8b5;
        }

        .activity-form-row .btn {
            height: 48px;
        }

        /* listas de actividades */
        .activity-box {
            overflow: hidden;
            border: 1px solid #e1e5ea;
            border-radius: 9px;
            background: #fff;
        }

        .activity-list {
            max-height: 255px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #bec3cb transparent;
        }

        .activity {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr) auto;
            align-items: center;
            column-gap: 16px;
            min-height: 72px;
            padding: 12px 18px;
            border-bottom: 1px solid #eef1f5;
        }

        .activity:last-child {
            border-bottom: 0;
        }

        .activity-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            margin: 0;
            border: 2px solid #a0aab8;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        .activity-checkbox:hover {
            border-color: #2874df;
        }

        .activity-description {
            margin-bottom: 2px;
            font-size: 17px;
            font-weight: 600;
            color: #172033;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .activity-date {
            color: #777f8b;
            font-size: 14px;
        }

        .activity-date.overdue {
            color: #d12a2a;
        }

        .activity-actions {
            display: flex;
            gap: 8px;
        }

        .completed-box {
            background: #f2fbf7;
            border-color: #e1f2eb;
        }

        .completed-box .activity {
            grid-template-columns: 24px minmax(0, 1fr);
            min-height: 68px;
        }

        .completed-check {
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            color: #fff;
            background: #4ea885;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        /* formulario de cliente, mensajes y estados vacíos */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-field input {
            width: 100%;
            min-height: 45px;
            padding: 11px;
            border: 1px solid #d8dee7;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .eyebrow {
            color: var(--blue);
            font-size: 14px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--muted);
        }

        .message.error {
            margin: 14px 18px 0;
            padding: 12px 14px;
            color: #a33a40;
            background: #fdecec;
            border-radius: 8px;
        }

        .empty {
            padding: 20px;
            color: #7b8491;
            text-align: center;
        }

        .placeholder {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 30px;
            color: #7b8491;
            text-align: center;
        }

        .placeholder h2 {
            margin: 8px 0;
            color: var(--text);
        }

        .placeholder-icon {
            font-size: 44px;
        }

        /* responsive */
        @media (max-width: 1150px) {
            .workspace {
                grid-template-columns: minmax(300px, 34%) minmax(0, 1fr);
            }

            .detail-title {
                font-size: 30px;
                margin-bottom: 22px;
            }

            .contact-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .contact-address {
                grid-column: 1;
                grid-row: auto;
            }

            .activity-form-row {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            }
        }

        @media (max-width: 760px) {
            body {
                overflow: auto;
            }

            .app {
                height: auto;
                min-height: 100dvh;
            }

            .topbar {
                flex-basis: 60px;
                padding: 0 18px;
            }

            .topbar h1 {
                font-size: 29px;
            }

            .workspace {
                display: flex;
                flex-direction: column;
                padding: 10px;
            }

            .clients-panel {
                height: 350px;
                flex: 0 0 350px;
            }

            .client-item {
                min-height: 77px;
                padding: 10px 13px;
            }

            .client-avatar {
                flex-basis: 48px;
                width: 48px;
                height: 48px;
                font-size: 16px;
            }

            .client-name {
                font-size: 16px;
            }

            .client-email {
                font-size: 13px;
            }

            .detail-panel {
                min-height: 600px;
                overflow: visible;
            }

            .detail-header {
                flex-direction: column;
                padding: 20px 0;
            }

            .detail-title {
                font-size: 28px;
            }

            .detail-actions {
                width: 100%;
                align-items: flex-start;
            }

            .activity-form-row,
            .form-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .activity-form-row .btn {
                width: 100%;
            }

            .activity {
                grid-template-columns: 25px minmax(0, 1fr);
                gap: 8px 12px;
            }

            .activity-actions {
                grid-column: 2;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        // dirección base de API, implementada en Express
        const API = "/api";

        // formatear nombre completo sin dejar espacios innecesarios
        function nombreCompleto(cliente) {
            return `${cliente.nombre} ${cliente.apellido}`.trim();
        }

        // convertir fecha YYYY-MM-DD a formato local
        function mostrarFecha(fecha) {
            if (!fecha) return "Sin fecha";

            const partes = fecha.split("-");
            if (partes.length !== 3) return fecha;

            const fechaLocal = new Date(
                Number(partes[0]),
                Number(partes[1]) - 1,
                Number(partes[2])
            );

            return new Intl.DateTimeFormat("es-AR", {
                day: "numeric",
                month: "short",
                year: "numeric",
            })
                .format(fechaLocal)
                .replace(/\./g, "");
        }

        // componente principal: administrar los datos y la selección
        function MiniCRM() {
            const [clientes, setClientes] = useState([]);
            const [busqueda, setBusqueda] = useState("");
            const [clienteSeleccionado, setClienteSeleccionado] = useState(null);
            const [actividades, setActividades] = useState([]);
            const [cargando, setCargando] = useState(true);
            const [error, setError] = useState("");

            // indicar si se está creando, editando o viendo un cliente
            const [modoFormulario, setModoFormulario] = useState(null);
            const [guardando, setGuardando] = useState(false);

            // valores de los campos del formulario
            const [formCliente, setFormCliente] = useState({
                nombre: "",
                apellido: "",
                email: "",
                telefono: "",
                domicilio: "",
                localidad: "",
            });

            // controlar si estamos creando o editando una actividad
            const [modoActividad, setModoActividad] = useState("nuevo");
            const [actividadEditada, setActividadEditada] = useState(null);
            const [guardandoActividad, setGuardandoActividad] = useState(false);

            // datos que se escriben en el formulario de actividad
            const [formActividad, setFormActividad] = useState({
                descripcion: "",
                fechaCompromiso: "",
            });

            // abrir formulario vacío para registrar cliente nuevo
            function nuevoCliente() {
                setFormCliente({
                    nombre: "",
                    apellido: "",
                    email: "",
                    telefono: "",
                    domicilio: "",
                    localidad: "",
                });
                setError("");
                setModoFormulario("nuevo");
            }

            // copiar datos del cliente seleccionado al formulario de edición
            function editarCliente() {
                if (!clienteSeleccionado) return;

                setFormCliente({
                    nombre: clienteSeleccionado.nombre || "",
                    apellido: clienteSeleccionado.apellido || "",
                    email: clienteSeleccionado.email || "",
                    telefono: clienteSeleccionado.telefono || "",
                    domicilio: clienteSeleccionado.domicilio || "",
                    localidad: clienteSeleccionado.localidad || "",
                });

                setError("");
                setModoFormulario("editar");
            }

            // enviar los datos al endpoint de creación o actualización
            async function guardarCliente(evento) {
                evento.preventDefault();
                setGuardando(true);
                setError("");

                try {
                    const esNuevo = modoFormulario === "nuevo";
                    const url = esNuevo ? `${API}/clientes` : `${API}/clientes/${clienteSeleccionado.id}`;
                    const respuesta = await fetch(url, {
                        method: esNuevo ? "POST" : "PUT",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(formCliente),
                    });
                    const resultado = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(
                            resultado.error || "No se pudieron guardar los datos"
                        );
                    }

                    // volver a consultar la lista para mostrar los datos actualizados
                    const respuestaLista = await fetch(
                        `${API}/clientes?q=${encodeURIComponent(busqueda)}`
                    );

                    if (!respuestaLista.ok) {
                        throw new Error("El cliente se guardó, pero no se pudo actualizar la lista");
                    }

                    const listaActualizada = await respuestaLista.json();
                    setClientes(listaActualizada);

                    // seleccionar el cliente recién creado o actualizado
                    const idGuardado = esNuevo ? resultado.id : clienteSeleccionado.id;
                    const clienteActualizado = listaActualizada.find(
                        (cliente) => cliente.id === idGuardado
                    );

                    if (clienteActualizado) {
                        setClienteSeleccionado(clienteActualizado);
                    } else {
                        // si no coincide con el filtro de búsqueda, limpiar la selección
                        setClienteSeleccionado(null);
                    }

                    setModoFormulario(null);
                } catch (e) {
                    setError(e.message);
                } finally {
                    setGuardando(false);
                }
            }

            // pedir confirmación antes de borrar un cliente y sus actividades
            async function eliminarCliente() {
                if (!clienteSeleccionado) return;

                const confirmar = window.confirm(
                    `¿Seguro que querés eliminar a ${nombreCompleto(clienteSeleccionado)}? También se eliminarán sus actividades`
                );

                if (!confirmar) return;

                setError("");

                try {
                    const respuesta = await fetch(
                        `${API}/clientes/${clienteSeleccionado.id}`,
                        { method: "DELETE" }
                    );

                    const resultado = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(resultado.error || "No se pudo eliminar el cliente");
                    }

                    setClienteSeleccionado(null);
                    setActividades([]);

                    // actualizar lista después de eliminar
                    const respuestaLista = await fetch(
                        `${API}/clientes?q=${encodeURIComponent(busqueda)}`
                    );

                    if (!respuestaLista.ok) {
                        throw new Error("El cliente se eliminó, pero no se pudo actualizar la lista");
                    }

                    setClientes(await respuestaLista.json());
                } catch (e) {
                    setError(e.message);
                }
            }

            // abrir formulario para crear una actividad para el cliente elegido
            function nuevaActividad() {
                setFormActividad({
                    descripcion: "",
                    fechaCompromiso: "",
                });
                setActividadEditada(null);
                setModoActividad("nuevo");
                setError("");
            }

            // copiar los datos de una actividad pendiente para editarla
            function editarActividad(actividad) {
                if (actividad.fechaFinalizacion) return;

                setFormActividad({
                    descripcion: actividad.descripcion || "",
                    fechaCompromiso: actividad.fechaCompromiso || "",
                });
                setActividadEditada(actividad);
                setModoActividad("editar");
                setError("");
            }

            // guardar una actividad nueva o actualizar una pendiente
            async function guardarActividad(evento) {
                evento.preventDefault();

                if (!clienteSeleccionado) return;

                setGuardandoActividad(true);
                setError("");

                try {
                    const esNueva = modoActividad === "nuevo";
                    const url = esNueva ? `${API}/clientes/${clienteSeleccionado.id}/actividades` : `${API}/actividades/${actividadEditada.id}`;
                    const respuesta = await fetch(url, {
                        method: esNueva ? "POST" : "PUT",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(formActividad),
                    });

                    const resultado = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(
                            resultado.error || "No se pudo guardar la actividad"
                        );
                    }

                    // recargar las actividades para reflejar los cambios
                    const respuestaActividades = await fetch(
                        `${API}/clientes/${clienteSeleccionado.id}/actividades`
                    );

                    if (!respuestaActividades.ok) {
                        throw new Error("La actividad se guardó, pero no se pudo actualizar la lista");
                    }

                    setActividades(await respuestaActividades.json());

                    setFormActividad({
                        descripcion: "",
                        fechaCompromiso: "",
                    });

                    setModoActividad("nuevo");
                    setActividadEditada(null);
                } catch (e) {
                    setError(e.message);
                } finally {
                    setGuardandoActividad(false);
                }
            }

            // eliminar únicamente actividades que todavía están pendientes
            async function eliminarActividad(actividad) {
                if (actividad.fechaFinalizacion) return;

                const confirmar = window.confirm(
                    `¿Querés eliminar la actividad "${actividad.descripcion}"?`
                );

                if (!confirmar) return;

                setError("");

                try {
                    const respuesta = await fetch(
                        `${API}/actividades/${actividad.id}`,
                        { method: "DELETE" }
                    );

                    const resultado = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(resultado.error || "No se pudo eliminar la actividad");
                    }

                    setActividades((actuales) =>
                        actuales.filter((item) => item.id !== actividad.id)
                    );
                } catch (e) {
                    setError(e.message);
                }
            }

            // marca una actividad pendiente como completada
            async function completarActividad(actividad) {
                if (actividad.fechaFinalizacion) return;

                setError("");

                try {
                    const respuesta = await fetch(
                        `${API}/actividades/${actividad.id}/completar`,
                        { method: "PATCH" }
                    );

                    const resultado = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(resultado.error || "No se pudo completar la actividad");
                    }

                    // volver a consultar para obtener la fecha de finalización guardada
                    const respuestaActividades = await fetch(
                        `${API}/clientes/${clienteSeleccionado.id}/actividades`
                    );

                    if (!respuestaActividades.ok) {
                        throw new Error("La actividad se completó, pero no se pudo actualizar la lista");
                    }

                    setActividades(await respuestaActividades.json());
                } catch (e) {
                    setError(e.message);
                }
            }

            // cargar los clientes y repetir la búsqueda cuando cambia el texto
            useEffect(() => {
                let cancelado = false;

                async function cargarClientes() {
                    setCargando(true);
                    setError("");

                    try {
                        const respuesta = await fetch(
                            `${API}/clientes?q=${encodeURIComponent(busqueda)}`
                        );

                        if (!respuesta.ok) {
                            throw new Error("No se pudieron cargar los clientes");
                        }

                        const datos = await respuesta.json();

                        if (cancelado) return;

                        setClientes(datos);

                        // conservar cliente seleccionado si todavía aparece en los resultados de la búsqueda
                        setClienteSeleccionado((actual) => {
                            if (!actual) return null;
                            return datos.find((c) => c.id === actual.id) || null;
                        });
                    } catch (e) {
                        if (!cancelado) setError(e.message);
                    } finally {
                        if (!cancelado) setCargando(false);
                    }
                }

                // esperar un momento para no consultar por cada tecla mientras se está escribiendo
                const temporizador = setTimeout(cargarClientes, 250);

                return () => {
                    cancelado = true;
                    clearTimeout(temporizador);
                };
            }, [busqueda]);

            // consultar las actividades cuando se elige un cliente
            useEffect(() => {
                let cancelado = false;

                async function cargarActividades() {
                    if (!clienteSeleccionado) {
                        setActividades([]);
                        return;
                    }

                    try {
                        const respuesta = await fetch(
                            `${API}/clientes/${clienteSeleccionado.id}/actividades`
                        );

                        if (!respuesta.ok) {
                            throw new Error("No se pudieron cargar las actividades");
                        }

                        const datos = await respuesta.json();
                        if (!cancelado) setActividades(datos);
                    } catch (e) {
                        if (!cancelado) setError(e.message);
                    }
                }

                cargarActividades();

                return () => {
                    cancelado = true;
                };
            }, [clienteSeleccionado?.id]);

            // separar las actividades según fecha de finalización
            const pendientes = actividades.filter(
                (actividad) => !actividad.fechaFinalizacion
            );

            const completadas = actividades.filter(
                (actividad) => actividad.fechaFinalizacion
            );

            return (
                <div className="app">
                    <header className="topbar">
                        <div className="brand">
                            <h1>MiniCRM</h1>
                        </div>
                    </header>
                    <main className="workspace">
                        <aside className="panel clients-panel">
                            <div className="panel-heading">
                                <div className="heading-row">
                                    <h2>Clientes</h2>
                                    <button className="btn btn-primary" onClick={nuevoCliente}>
                                        + Agregar
                                    </button>
                                </div>
                                <div className="subtitle" style={{ marginBottom: 12 }}>
                                    {clientes.length} clientes encontrados
                                </div>
                                <div className="search-wrapper">
                                    <span className="search-icon">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                    </span>
                                    <input className="search" type="search" placeholder="Buscar por nombre, email, teléfono..." value={busqueda} onChange={(e) => setBusqueda(e.target.value)} aria-label="Buscar clientes" />
                                </div>
                            </div>
                            <div className="client-list">
                                {cargando && <p className="empty">Cargando clientes...</p>}

                                {!cargando && !error && clientes.length === 0 && (
                                    <p className="empty">
                                        No se encontraron clientes para esa búsqueda
                                    </p>
                                )}

                                {clientes.map((cliente) => (
                                    <button key={cliente.id}
                                        className={"client-item" + (clienteSeleccionado?.id === cliente.id ? " selected" : "")}
                                        onClick={() => {
                                            setClienteSeleccionado(cliente);
                                            setError("");
                                        }}
                                    >

                                        <div className="client-avatar" aria-hidden="true">
                                            {`${cliente.nombre?.[0] || ""}${cliente.apellido?.[0] || ""}`.toUpperCase()}
                                        </div>
                                        <div>
                                            <div className="client-name">
                                                {nombreCompleto(cliente)}
                                            </div>
                                            <div className="client-email">
                                                {cliente.email || "Sin correo electrónico"}
                                            </div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </aside>
                        <section className="panel detail-panel">
                            {error && <div className="message error">{error}</div>}

                            {modoFormulario ? (
                                <div className="detail-content">
                                    <div>
                                        <div className="eyebrow">
                                            {modoFormulario === "nuevo" ? "Nuevo registro" : "Modificar registro"}
                                        </div>
                                        <h2 className="detail-title">
                                            {modoFormulario === "nuevo" ? "Agregar cliente" : "Editar cliente"}
                                        </h2>
                                        <p className="subtitle">Los campos marcados con * son obligatorios</p>
                                    </div>
                                    <form onSubmit={guardarCliente}>
                                        <div className="form-grid">
                                            {[
                                                ["nombre", "Nombre *"],
                                                ["apellido", "Apellido *"],
                                                ["email", "Correo electrónico *"],
                                                ["telefono", "Teléfono"],
                                                ["domicilio", "Domicilio"],
                                                ["localidad", "Localidad"],
                                            ].map(([campo, etiqueta]) => (
                                                <div className="form-field" key={campo}>
                                                    <label htmlFor={`cliente-${campo}`}>{etiqueta}</label>
                                                    <input id={`cliente-${campo}`} type={campo === "email" ? "email" : "text"} required={["nombre", "apellido", "email"].includes(campo)} value={formCliente[campo]}
                                                        onChange={(evento) =>
                                                            setFormCliente((actual) => ({
                                                                ...actual,
                                                                [campo]: evento.target.value,
                                                            }))
                                                        }
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                        <div className="form-actions">
                                            <button className="btn btn-primary" type="submit" disabled={guardando}>
                                                {guardando ? "Guardando..." : "Guardar cliente"}
                                            </button>
                                            <button className="btn" type="button"
                                                onClick={() => {
                                                    setModoFormulario(null);
                                                    setError("");
                                                }}
                                            >
                                                Cancelar
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            ) : !clienteSeleccionado ? (
                                <div className="placeholder">
                                    <div>
                                        <div className="placeholder-icon">◎</div>
                                        <h2>Detalle del cliente</h2>
                                        <p>Seleccioná un cliente de la lista para ver sus datos y actividades</p>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    <header className="detail-header">
                                        <div className="client-main-info">
                                            <h2 className="detail-title">
                                                {nombreCompleto(clienteSeleccionado)}
                                            </h2>
                                            <div className="contact-grid">
                                                <div className="contact-item">
                                                    <span className="contact-icon" aria-hidden="true">
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                                    </span>
                                                    <span>
                                                        {clienteSeleccionado.email || "Sin correo electrónico"}
                                                    </span>
                                                </div>
                                                <div className="contact-item contact-address">
                                                    <span className="contact-icon" aria-hidden="true">
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" opacity="0.75"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" /></svg>
                                                    </span>
                                                    <div>
                                                        <div>{clienteSeleccionado.domicilio}</div>
                                                        <div>{clienteSeleccionado.localidad}</div>
                                                    </div>
                                                </div>
                                                <div className="contact-item">
                                                    <span className="contact-icon phone-icon" aria-hidden="true">
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                                    </span>
                                                    <span>
                                                        {clienteSeleccionado.telefono || "Sin teléfono"}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="detail-actions">
                                            <span className="client-id">
                                                #{clienteSeleccionado.id}
                                            </span>
                                            <div className="actions">
                                                <button type="button" className="btn" onClick={editarCliente}>
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                                                    Editar
                                                </button>
                                                <button type="button" className="btn btn-danger" onClick={eliminarCliente}>
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                    Eliminar
                                                </button>
                                            </div>
                                        </div>
                                    </header>
                                    <div className="detail-content">
                                        {/* formulario para agregar o editar una actividad */}
                                        {modoActividad && (
                                            <form className="activity-form" onSubmit={guardarActividad}>
                                                <h3>
                                                    {modoActividad === "nuevo" ? "Agregar actividad" : "Editar actividad"}
                                                </h3>
                                                <div className="activity-form-row">
                                                    <input id="actividad-descripcion" type="text" aria-label="Descripción de la actividad" placeholder="Descripción de la actividad" required value={formActividad.descripcion}
                                                        onChange={(evento) =>
                                                            setFormActividad((actual) => ({
                                                                ...actual,
                                                                descripcion: evento.target.value,
                                                            }))
                                                        }
                                                    />
                                                    <input id="actividad-fecha" type="date" aria-label="Fecha opcional" value={formActividad.fechaCompromiso}
                                                        onChange={(evento) =>
                                                            setFormActividad((actual) => ({
                                                                ...actual,
                                                                fechaCompromiso: evento.target.value,
                                                            }))
                                                        }
                                                    />
                                                    <button className="btn btn-primary" type="submit" disabled={guardandoActividad}>
                                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                                                        {guardandoActividad ? "Guardando..." : "Guardar"}
                                                    </button>
                                                    <button className="btn" type="button"
                                                        onClick={() => {
                                                            setFormActividad({
                                                                descripcion: "",
                                                                fechaCompromiso: "",
                                                            });

                                                            setModoActividad("nuevo");
                                                            setActividadEditada(null);
                                                            setError("");
                                                        }}
                                                    >
                                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                        Cancelar
                                                    </button>
                                                </div>
                                            </form>
                                        )}
                                        {/* compromisos pendientes */}
                                        <section className="activities-section">
                                            <div className="section-heading">
                                                <h3 className="section-title">Compromisos</h3>
                                                {!modoActividad && (
                                                    <button className="btn btn-primary add-activity-btn" onClick={nuevaActividad} type="button">
                                                        + Agregar
                                                    </button>
                                                )}
                                            </div>
                                            <div className="activity-box pending-box">
                                                <div className="activity-list">
                                                    {pendientes.length === 0 ? (
                                                        <p className="empty">No hay compromisos pendientes</p>
                                                    ) : (
                                                        pendientes.map((actividad) => {
                                                            const vencida = actividad.fechaCompromiso && actividad.fechaCompromiso < new Date().toLocaleDateString("en-CA");

                                                            return (
                                                                <div className="activity activity-pending" key={actividad.id}>
                                                                    <input className="activity-checkbox" type="checkbox" aria-label={`Completar ${actividad.descripcion}`}
                                                                        onChange={() =>
                                                                            completarActividad(actividad)
                                                                        }
                                                                    />
                                                                    <div className="activity-info">
                                                                        <div className="activity-description">
                                                                            {actividad.descripcion}
                                                                        </div>
                                                                        <div className={"activity-date" + (vencida ? " overdue" : "")}>
                                                                            {actividad.fechaCompromiso ? mostrarFecha(actividad.fechaCompromiso) + (vencida ? " · Vencido" : "") : "Sin fecha"}
                                                                        </div>
                                                                    </div>
                                                                    <div className="activity-actions">
                                                                        <button type="button" className="icon-btn" aria-label="Editar actividad" title="Editar"
                                                                            onClick={() =>
                                                                                editarActividad(actividad)
                                                                            }
                                                                        >
                                                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                                                                        </button>
                                                                        <button type="button" className="icon-btn delete-icon" aria-label="Eliminar actividad" title="Eliminar"
                                                                            onClick={() =>
                                                                                eliminarActividad(actividad)
                                                                            }
                                                                        >
                                                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })
                                                    )}
                                                </div>
                                            </div>
                                        </section>
                                        {/* actividades completadas */}
                                        <section className="activities-section">
                                            <h3 className="section-title">
                                                Actividades completadas
                                            </h3>
                                            <div className="activity-box completed-box">
                                                <div className="activity-list">
                                                    {completadas.length === 0 ? (
                                                        <p className="empty">Todavía no hay actividades completadas</p>
                                                    ) : (
                                                        completadas.map((actividad) => (
                                                            <div className="activity activity-completed" key={actividad.id}>
                                                                <span className="completed-check" aria-label="Completada">
                                                                    ✓
                                                                </span>
                                                                <div className="activity-info">
                                                                    <div className="activity-description">
                                                                        {actividad.descripcion}
                                                                    </div>
                                                                    <div className="activity-date">
                                                                        Completada el{" "}
                                                                        {mostrarFecha(actividad.fechaFinalizacion)}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        </section>
                                    </div>
                                </>
                            )}
                        </section>
                    </main>
                </div>
            );
        }

        // armar React dentro del elemento root del HTML
        ReactDOM.createRoot(document.getElementById("root")).render(<MiniCRM />);
    </script>
</body>

</html>
