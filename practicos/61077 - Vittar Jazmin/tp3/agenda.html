<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font: 16px sans-serif;
      background: #f5f6f4;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: auto;
    }

    main > input[type="search"] {
      display: block;
      box-sizing: border-box;
      width: 100%;
      max-width: 500px;
      margin: 0 auto 24px;
      padding: 12px 16px;
      border: 1px solid #d9ded9;
      border-radius: 10px;
      background: white;
      font: inherit;
      outline: none;
    }

    main > input[type="search"]:focus {
      border-color: #999;
    }

    h1 {
      margin: 0 0 24px;
    }

    ul {
      display: grid;
      grid-template-columns: repeat(3, 360px);
      justify-content: center;
      gap: 12px;
      padding: 0;
      list-style: none;
    }

    li {
      min-width: 0;
      padding: 20px;
      border: 1px solid #d9ded9;
      border-radius: 16px;
      background: white;
      text-align: center;
      cursor: pointer;
    }

    li:hover {
      box-shadow: 0 4px 12px rgb(0 0 0 / 8%);
    }

    li .encabezado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    li h2 {
      margin: 0;
      font-size: 20px;
    }

    li button {
      border: 0;
      background: transparent;
      font-size: 24px;
      cursor: pointer;
    }

    li address {
      margin-top: 20px;
      font-style: normal;
      text-align: left;
    }

    li address p {
      margin: 6px 0;
    }

    li .datos {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid #d9ded9;
    }

    @media (max-width: 1120px) {
      ul {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      ul {
        grid-template-columns: 1fr;
      }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0;
    }

    header button {
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    header button:hover {
      opacity: 0.85;
    }

    dialog {
      width: 400px;
      max-width: calc(100% - 40px);
      padding: 24px;
      border: 0;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgb(0 0 0 / 20%);
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 40%);
    }

    dialog form {
      display: grid;
      gap: 16px;
    }

    dialog h2 {
      margin: 0 0 8px;
    }

    dialog label {
      display: grid;
      gap: 6px;
    }

    dialog input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #d9ded9;
      border-radius: 8px;
      font: inherit;
    }

    dialog .acciones {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    dialog .acciones button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    dialog .acciones button[type="submit"] {
      background: #222;
      color: white;
    }

    dialog .acciones button[type="button"] {
      background: #eee;
    }

    dialog .acciones button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')

    const storage = 'agenda-alumnos'

    // Recuperar los alumnos guardados o usar datos iniciales del JSON
    const alumnosGuardados = localStorage.getItem(storage)

    // Estado reactivo de la ageda
    const state = reactive({
      alumnos: alumnosGuardados ? JSON.parse(alumnosGuardados) : alumnos,
      busqueda: '',       // guarda lo que escriba el usuario en el buscador
      alumnoEditando: null
    })

    // Guardar estado actual de alumnos en localStorage
    function guardarAlumnos() {
      localStorage.setItem(
        storage,
        JSON.stringify(state.alumnos)
      )
    }

    // Agregar un nuevo alumno a la agenda
    function agregarAlumno(event) {
      event.preventDefault()

      const formulario = event.target

      const nuevoAlumno = {
        id: Date.now(),
        apellido: formulario.apellido.value.trim(),
        nombre: formulario.nombre.value.trim(),
        legajo: formulario.legajo.value.trim(),
        comision: formulario.comision.value.trim(),
        telefono: formulario.telefono.value.trim(),
        github: formulario.github.value.trim(),
        favorito: false
      }

      state.alumnos.push(nuevoAlumno)
      guardarAlumnos()

      formulario.reset()
      document.getElementById('dialog-agregar').close()
    }

    // Abrir formulario de edición con datos del alumno
    function editarAlumno(alumno) {
      state.alumnoEditando = alumno

      const formulario = document.getElementById('form-editar')

      formulario.apellido.value = alumno.apellido
      formulario.nombre.value = alumno.nombre
      formulario.legajo.value = alumno.legajo
      formulario.comision.value = alumno.comision
      formulario.telefono.value = alumno.telefono
      formulario.github.value = alumno.github

      document.getElementById('dialog-editar').showModal()
    }

    // Guardar cambios del alumno editado
    function guardarEdicion(event) {
      event.preventDefault()

      const formulario = event.target
      const alumno = state.alumnoEditando

      alumno.apellido = formulario.apellido.value.trim()
      alumno.nombre = formulario.nombre.value.trim()
      alumno.legajo = formulario.legajo.value.trim()
      alumno.comision = formulario.comision.value.trim()
      alumno.telefono = formulario.telefono.value.trim()
      alumno.github = formulario.github.value.trim()

      guardarAlumnos()

      state.alumnoEditando = null
      formulario.reset()
      document.getElementById('dialog-editar').close()
    }

    // Eliminar alumno que se está editando
    function eliminarAlumno() {
      const alumno = state.alumnoEditando

      state.alumnos = state.alumnos.filter(a => a.id !== alumno.id)

      guardarAlumnos()

      state.alumnoEditando = null
      document.getElementById('dialog-editar').close()
    }

    // Guardar cambios cuando se modifica algún alumno
    watch(
      () => state.alumnos.map(a => ({
        id: a.id,
        favorito: a.favorito
      })),
      () => {
        guardarAlumnos()
      }
    )

    // Comparar sin distinguir mayúsculas, minúsculas ni acentos
    function normalizar(texto) {
      return texto
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
    }

    // Obtener alumnos que coincidan con la búsqueda, favoritos van primero
    function alumnosVisibles() {
      const busqueda = normalizar(state.busqueda)

      return state.alumnos
        .filter(a => {
          const nombre = normalizar(`${a.apellido} ${a.nombre}`)
          return nombre.includes(busqueda)
        })
        .sort((a, b) => {
          // favoritos aparecen primero
          if (a.favorito !== b.favorito) {
            return a.favorito ? -1 : 1
          }

          // ordenar por apellido y nombre
          const apellidoA = normalizar(a.apellido)
          const apellidoB = normalizar(b.apellido)

          const comparacionApellido = apellidoA.localeCompare(apellidoB)

          if (comparacionApellido !== 0) {
            return comparacionApellido
          }

          return normalizar(a.nombre).localeCompare(normalizar(b.nombre))
        })
    }

    html`
      <header>
        <h1>Agenda</h1>
        <button type="button" @click="${() => document.getElementById('dialog-agregar').showModal()}" >
          + Agregar
        </button>
      </header>
      <input type="search" placeholder="Buscar alumno..." aria-label="Buscar alumno" @input="${event => state.busqueda = event.target.value}" >
      <ul>
        ${() => alumnosVisibles().map(a => html`
          <li @click="${() => editarAlumno(a)}">
            <div class="encabezado">
              <h2>${a.apellido} ${a.nombre}</h2>
              <button type="button" aria-label="${a.favorito ? 'Quitar de favoritos' : 'Marcar como favorito'}" @click="${event => {
                event.stopPropagation()
                a.favorito = !a.favorito}}" >
                ${() => a.favorito ? '★' : '☆'}
              </button>
            </div>
            <address>
              <p>${a.telefono}</p>
              <p>@${a.github}</p>
            </address>
            <div class="datos">
              <span>${a.comision}</span>
              <span>${a.legajo}</span>
            </div>
          </li>
        `)}
      </ul>   
      <dialog id="dialog-agregar">
        <form @submit="${agregarAlumno}">
          <h2>Agregar alumno</h2>
          <label>
            Apellido
            <input name="apellido" required>
          </label>
          <label>
            Nombre
            <input name="nombre" required>
          </label>
          <label>
            Legajo
            <input name="legajo" required>
          </label>
          <label>
            Comisión
            <input name="comision" required>
          </label>
          <label>
            Teléfono
            <input name="telefono" required>
          </label>
          <label>
            GitHub
            <input name="github" required>
          </label>
          <div class="acciones">
            <button type="button" @click="${() => document.getElementById('dialog-agregar').close()}">
              Cancelar
            </button>
            <button type="submit">
              Agregar
            </button>
          </div>
        </form>
      </dialog>
      <dialog id="dialog-editar">
        <form id="form-editar" @submit="${guardarEdicion}">
          <h2>Editar alumno</h2>
          <label>
            Apellido
            <input name="apellido" required>
          </label>
          <label>
            Nombre
            <input name="nombre" required>
          </label>
          <label>
            Legajo
            <input name="legajo" required>
          </label>
          <label>
            Comisión
            <input name="comision" required>
          </label>
          <label>
            Teléfono
            <input name="telefono" required>
          </label>
          <label>
            GitHub
            <input name="github" required>
          </label>
          <div class="acciones">
            <button type="button" @click="${() => document.getElementById('dialog-editar').close()}">
              Cancelar
            </button>
            <button type="button" @click="${eliminarAlumno}">
              Eliminar
            </button>
            <button type="submit">
              Guardar
            </button>
          </div>
        </form>
      </dialog>
    `(app)
  </script>
</body>

</html>
