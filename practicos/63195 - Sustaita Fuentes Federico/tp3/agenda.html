<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { max-width: 1104px; margin: auto; }
    h1 { margin: 0 0 24px; }

    section { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

    article {
      padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: #fefef9;

      header { display: flex; justify-content: space-between; }
      h2 { margin: 0; font-size: 1rem; font-weight: 400; color: #5f6b62; }
      strong { font: bold 1.4rem Georgia, serif; color: #2c3b30; }
      address { margin: 16px 0; font-style: normal; }
      footer { padding-top: 10px; border-top: 1px solid #d9ded9; font-size: .8rem; color: #5f6b62; }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const norm = s => String(s ?? '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase()

    // Favoritos primero; luego apellido y nombre, sin distinguir mayúsculas ni acentos
    const ordenados = () => [...alumnos].sort((a, b) =>
      (Number(!!b.favorito) - Number(!!a.favorito)) ||
      norm(a.apellido).localeCompare(norm(b.apellido)) ||
      norm(a.nombre).localeCompare(norm(b.nombre)))

    const tarjeta = a => html`
      <article>
        <header>
          <h2><strong>${a.apellido}</strong> ${a.nombre}</h2>
          <span>${a.favorito ? '★' : '☆'}</span>
        </header>
        <address>
          <div>${a.telefono}</div>
          <div>${'@' + a.github}</div>
        </address>
        <footer>${a.comision} · ${a.legajo}</footer>
      </article>
    `.key(a.id)

    html`
      <header>
        <h1>Agenda</h1>
      </header>
      <section>
        ${ordenados().map(tarjeta)}
      </section>
    `(document.getElementById('app'))
  </script>
</body>
</html>
