<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f5f2;
      color: #1f2320;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
    }

    .lista-alumnos {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .tarjeta-alumno {
      padding: 20px;
      border: 1px solid #e2e5df;
      border-radius: 16px;
      background: #ffffff;
      box-sizing: border-box;
    }

    @media (max-width: 1000px) {
      .lista-alumnos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .lista-alumnos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import datosIniciales from './alumnos.json' with { type: 'json' }

    function obtenerAlumnosIniciales() {
      const guardados = localStorage.getItem('alumnos_agenda')
      if (guardados) {
        try {
          return JSON.parse(guardados)
        } catch (e) {
          return datosIniciales
        }
      }
      localStorage.setItem('alumnos_agenda', JSON.stringify(datosIniciales))
      return datosIniciales
    }

    const estado = reactive({
      alumnos: obtenerAlumnosIniciales(),
      busqueda: ''
    })

    function persistir() {
      localStorage.setItem('alumnos_agenda', JSON.stringify(estado.alumnos))
    }

    const app = document.getElementById('app')

    const plantilla = html`
      <header>
        <h1>Agenda</h1>
      </header>

      <section>
        <ul class="lista-alumnos">
          ${() => estado.alumnos.map(alumno => html`
            <li class="tarjeta-alumno" key="${alumno.id}">
              <strong>${alumno.apellido}</strong> ${alumno.nombre}
            </li>
          `)}
        </ul>
      </section>
    `

    plantilla(app)
  </script>
</body>
</html>
