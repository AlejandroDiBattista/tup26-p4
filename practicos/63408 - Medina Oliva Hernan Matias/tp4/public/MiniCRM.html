<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniCRM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#17202b;background:#f4f7fa}button,input{font:inherit}button{cursor:pointer;border:1px solid #d7dce1;border-radius:6px;background:#fff;padding:10px 14px;color:inherit}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #8abcf5;outline-offset:2px}.primary{background:#176ee1;border-color:#176ee1;color:white}.danger{color:#bd3035;border-color:#edbabc}.muted{color:#77808b}.top{height:66px;background:#2e4969;color:white;display:flex;align-items:center;padding:0 28px}.top h1{margin:0;font-size:34px}.layout{height:calc(100dvh - 66px);display:grid;grid-template-columns:minmax(260px,31%) 1fr;gap:12px;padding:12px}.panel{min-height:0;min-width:0;background:white;border:1px solid #dce3e9;border-radius:9px;overflow:hidden}.master{display:flex;flex-direction:column}.master-head{padding:18px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:28px;margin:0}h3{font-size:21px;margin:0 0 12px}input{width:100%;border:1px solid #d5d9de;border-radius:6px;padding:12px;background:#fff;min-width:0}.search{margin-top:20px}.client-list{overflow:auto;flex:1}.client{border:0;border-bottom:1px solid #edf0f3;border-radius:0;width:100%;display:flex;text-align:left;gap:18px;align-items:center;padding:18px 22px;background:white}.client.selected{background:#e4f0fe}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:bold}.client strong{display:block;font-size:18px;margin-bottom:6px}.client small{font-size:14px;color:#637080;overflow-wrap:anywhere}.detail{display:flex;flex-direction:column;padding:24px;gap:18px;overflow:auto}.profile{padding:0 8px 18px;border-bottom:1px solid #edf0f3}.profile h2{font-size:34px;overflow-wrap:anywhere}.actions{display:flex;gap:10px;justify-content:flex-end;margin:10px 0}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;overflow-wrap:anywhere}.contacts p{margin:0 0 14px;line-height:1.5}.subform{border:2px dashed #e0e4e8;border-radius:8px;padding:16px}.activity-form{display:flex;gap:10px;align-items:center}.activity-form input:first-child{flex:2}.activity-form input[type=date]{flex:1}.activity-form button{white-space:nowrap}.activity-sections{flex:1;min-height:180px;display:grid;grid-template-rows:1.3fr 1fr;gap:20px}.activity-section{min-height:0;display:flex;flex-direction:column}.activity-list{min-height:0;overflow:auto;border:1px solid #e1e6eb;border-radius:7px;flex:1}.completed{background:#f0faf6}.activity{padding:14px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #edf0f3}.activity:last-child{border:0}.activity .text{flex:1;min-width:0;overflow-wrap:anywhere}.activity small{display:block;margin-top:6px;color:#737d88}.activity small.overdue{color:#c03636}.check{width:23px;height:23px;padding:0;flex-shrink:0;font-size:17px}.done{color:white;background:#60ae8d;border-radius:3px;display:grid;place-items:center;width:23px;height:23px;flex-shrink:0}.icon{padding:8px 10px}.empty{padding:25px;color:#77808b;text-align:center}.welcome{margin:auto;text-align:center;max-width:350px;line-height:1.7}.client-form{display:grid;gap:16px;max-width:640px}.client-form label{display:grid;gap:7px}.notice{padding:12px 18px;background:#fff1ef;color:#9d2929;display:flex;align-items:center;justify-content:space-between;gap:15px}.notice button{padding:3px 8px}.loading{padding:10px;color:#637080}label.date-label{position:absolute;width:1px;height:1px;overflow:hidden}
@media(min-width:901px){.detail{overflow:hidden}.profile,.subform{flex-shrink:0}}
@media(max-width:1100px){.activity-form{flex-wrap:wrap}.activity-form input:first-child{flex-basis:55%}.activity-form button{padding:9px}.detail{padding:18px}.client{padding:16px 12px;gap:10px}.avatar{width:42px;height:42px}}
@media(max-width:650px){.top{height:54px;padding:0 16px}.top h1{font-size:27px}.layout{height:calc(100dvh - 54px);grid-template-columns:36% 1fr;padding:6px;gap:6px}.master-head{padding:10px}.heading{flex-wrap:wrap}h2{font-size:21px}.search{margin-top:12px;padding:9px;font-size:13px}.client{padding:12px 8px;gap:8px;align-items:flex-start}.avatar{width:30px;height:30px;font-size:11px}.client strong{font-size:14px}.client small{font-size:11px}.detail{padding:12px;gap:16px}.profile{padding:0 0 12px}.profile h2{font-size:25px}.contacts{grid-template-columns:1fr;gap:0;font-size:14px}.actions{flex-wrap:wrap}.actions button{padding:7px;font-size:13px}.subform{padding:10px}.activity-form input:first-child,.activity-form input[type=date]{flex-basis:100%}h3{font-size:18px}.activity-sections{min-height:440px}.activity{padding:10px;gap:8px;flex-wrap:wrap}.activity .text{flex-basis:65%}.activity small{font-size:12px}.icon{padding:6px}.master .primary{padding:8px;font-size:13px}}
</style></head><body><div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
async function api(url,method='GET',body){const res=await fetch('/api/clientes'+url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(!res.ok){const data=await res.json().catch(()=>({}));throw new Error(data.error||'No se pudo completar la solicitud.');}return res.status===204?null:res.json();}
const blank={nombre:'',email:'',telefono:'',direccion:''};
const colors=[['#d3eafa','#206697'],['#d9f3e4','#348260'],['#e5dcfa','#68459c'],['#ffebcb','#a96519'],['#fbdbe7','#aa3d65'],['#d4f4ef','#277e7d']];
const dateLabel=v=>new Date(v+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function App(){
 const [list,setList]=useState([]),[q,setQ]=useState(''),[selected,setSelected]=useState(null),[detail,setDetail]=useState(null),[mode,setMode]=useState('view'),[form,setForm]=useState(blank),[activity,setActivity]=useState({descripcion:'',fecha:''}),[editing,setEditing]=useState(null),[error,setError]=useState(''),[busy,setBusy]=useState(false),[loading,setLoading]=useState(false);
 const searchSeq=useRef(0),detailSeq=useRef(0),descRef=useRef(null);
 async function refreshList(){const seq=++searchSeq.current;const data=await api('?q='+encodeURIComponent(q));if(seq===searchSeq.current)setList(data);}
 useEffect(()=>{const seq=++searchSeq.current;const timer=setTimeout(()=>{api('?q='+encodeURIComponent(q)).then(data=>{if(seq===searchSeq.current)setList(data);}).catch(e=>{if(seq===searchSeq.current)setError(e.message);});},180);return()=>{clearTimeout(timer);};},[q]);
 useEffect(()=>{const seq=++detailSeq.current;if(selected===null){setDetail(null);return;}setLoading(true);setDetail(null);api('/'+selected).then(data=>{if(seq===detailSeq.current)setDetail(data);}).catch(e=>{if(seq===detailSeq.current)setError(e.message);}).finally(()=>{if(seq===detailSeq.current)setLoading(false);});},[selected]);
 function resetActivity(){setActivity({descripcion:'',fecha:''});setEditing(null);}
 function select(id){if(busy)return;setSelected(id);setMode('view');resetActivity();setError('');}
 async function run(fn){if(busy)return;setBusy(true);setError('');try{await fn();}catch(e){setError(e.message);}finally{setBusy(false);}}
 async function reload(){setDetail(await api('/'+selected));}
 function newClient(){setMode('new');setForm({...blank});resetActivity();setError('');}
 function saveClient(e){e.preventDefault();run(async()=>{const c=await api(mode==='new'?'':'/'+selected,mode==='new'?'POST':'PUT',form);setMode('view');if(c.id===selected)setDetail(await api('/'+selected));else setSelected(c.id);await refreshList();});}
 function saveActivity(e){e.preventDefault();run(async()=>{await api('/'+selected+'/actividades'+(editing?'/'+editing:''),editing?'PUT':'POST',activity);resetActivity();await reload();});}
 function deleteClient(){if(!confirm('¿Eliminar este cliente y todas sus actividades?'))return;run(async()=>{await api('/'+selected,'DELETE');setSelected(null);setDetail(null);resetActivity();await refreshList();});}
 function deleteActivity(a){if(!confirm('¿Eliminar esta actividad pendiente?'))return;run(async()=>{await api('/'+selected+'/actividades/'+a.id,'DELETE');if(editing===a.id)resetActivity();await reload();});}
 function complete(a){run(async()=>{await api('/'+selected+'/actividades/'+a.id+'/completar','PATCH');if(editing===a.id)resetActivity();await reload();});}
 function activityRow(a){return <div className="activity" key={a.id}>{a.completada?<span className="done" aria-label="Completada">✓</span>:<button className="check" disabled={busy} title="Completar actividad" aria-label={'Completar '+a.descripcion} onClick={()=>complete(a)}> </button>}<div className="text">{a.descripcion}<small className={!a.completada&&a.fecha&&a.fecha<today()?'overdue':''}>{a.completada?'Completada el '+new Date(a.completadaEn).toLocaleDateString('es-AR'):a.fecha?dateLabel(a.fecha)+(a.fecha<today()?' · Vencido':''):'Sin fecha'}</small></div>{!a.completada&&<><button className="icon" disabled={busy} aria-label={'Editar '+a.descripcion} onClick={()=>{setActivity({descripcion:a.descripcion,fecha:a.fecha||''});setEditing(a.id);descRef.current?.focus();}}>✎</button><button className="icon danger" disabled={busy} aria-label={'Eliminar '+a.descripcion} onClick={()=>deleteActivity(a)}>♜</button></>}</div>;}
 return <><header className="top"><h1>MiniCRM</h1></header><main className="layout"><aside className="panel master"><div className="master-head"><div className="heading"><h2>Clientes</h2><button className="primary" disabled={busy} onClick={newClient}>＋ Agregar</button></div><input className="search" aria-label="Buscar clientes por cualquier campo" placeholder="Buscar por cualquier campo…" value={q} onChange={e=>setQ(e.target.value)}/></div><nav className="client-list" aria-label="Clientes">{list.map(c=>{const color=colors[c.id%colors.length];return <button className={'client'+(c.id===selected?' selected':'')} key={c.id} disabled={busy} aria-current={c.id===selected?'true':undefined} onClick={()=>select(c.id)}><span className="avatar" style={{background:color[0],color:color[1]}}>{c.nombre.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}</span><span><strong>{c.nombre}</strong><small>{c.email}</small></span></button>;})}{!list.length&&<p className="empty">{q?'No se encontraron clientes.':'Todavía no hay clientes. Agregá el primero.'}</p>}</nav></aside><section className="panel detail" aria-label="Detalle del cliente">{error&&<div role="alert" className="notice">{error}<button aria-label="Cerrar error" onClick={()=>setError('')}>×</button></div>}{busy&&<div role="status" className="muted">Guardando cambios…</div>}{mode!=='view'?<><h2>{mode==='new'?'Agregar cliente':'Editar cliente'}</h2><form className="client-form" onSubmit={saveClient}>{[['nombre','Nombre',120],['email','Correo electrónico',254],['telefono','Teléfono',50],['direccion','Dirección',250]].map(([key,label,max])=><label key={key}>{label}<input autoFocus={key==='nombre'} required maxLength={max} type={key==='email'?'email':key==='telefono'?'tel':'text'} value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})}/></label>)}<div className="actions"><button className="primary" disabled={busy}>Guardar cliente</button><button type="button" disabled={busy} onClick={()=>setMode('view')}>Cancelar</button></div></form></>:loading?<p className="loading" role="status">Cargando ficha…</p>:detail?<><section className="profile"><div className="heading"><h2>{detail.nombre}</h2><span className="muted">#{detail.id}</span></div><div className="actions"><button disabled={busy} onClick={()=>{setForm({nombre:detail.nombre,email:detail.email,telefono:detail.telefono,direccion:detail.direccion});setMode('edit');}}>✎ Editar</button><button className="danger" disabled={busy} onClick={deleteClient}>Eliminar</button></div><div className="contacts"><div><p>✉ &nbsp;{detail.email}</p><p>☎ &nbsp;{detail.telefono}</p></div><p>⌖ &nbsp;{detail.direccion}</p></div></section><section className="subform"><h3>{editing?'Editar actividad':'Agregar actividad'}</h3><form className="activity-form" onSubmit={saveActivity}><input ref={descRef} required maxLength="500" aria-label="Descripción de la actividad" placeholder="Descripción de la actividad" value={activity.descripcion} onChange={e=>setActivity({...activity,descripcion:e.target.value})}/><input type="date" aria-label="Fecha opcional" value={activity.fecha} onChange={e=>setActivity({...activity,fecha:e.target.value})}/><button className="primary" disabled={busy}>Guardar</button><button type="button" disabled={busy} onClick={resetActivity}>Cancelar</button></form></section><div className="activity-sections">{[false,true].map(done=><section className="activity-section" key={String(done)}><h3>{done?'Actividades completadas':'Compromisos'}</h3><div className={'activity-list'+(done?' completed':'')}>{detail.actividades.filter(a=>a.completada===done).map(activityRow)}{!detail.actividades.some(a=>a.completada===done)&&<div className="empty">{done?'Sin actividades completadas.':'Sin compromisos pendientes.'}</div>}</div></section>)}</div></>:<div className="welcome"><h2>Tu agenda de clientes</h2><p>Seleccioná un cliente para ver su ficha y gestionar sus actividades, o agregá uno para comenzar.</p></div>}</section></main></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
