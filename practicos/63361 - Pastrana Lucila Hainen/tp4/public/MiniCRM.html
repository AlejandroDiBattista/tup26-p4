<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniCRM</title>

  <!-- Bibliotecas desde CDN con versiones fijas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>

  <style>
    :root {
      --azul-oscuro: #2c3e5c;
      --azul: #2563eb;
      --azul-hover: #1d4ed8;
      --azul-suave: #e8f0fe;
      --rojo: #dc2626;
      --rojo-suave: #fef2f2;
      --verde: #16a34a;
      --texto: #1f2937;
      --texto-suave: #6b7280;
      --borde: #e5e7eb;
      --fondo: #f3f4f6;
      --panel: #ffffff;
      --radio: 10px;
    }

    html, body, #root { height: 100%; }
    body {
      margin: 0;
      overflow: hidden; /* sin desplazamiento global: la app ocupa la ventana */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--texto);
      background: var(--fondo);
    }

    /* ───── Estructura ───── */
    .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .header {
      background: var(--azul-oscuro); color: #fff;
      padding: 14px 24px; font-size: 1.6rem; font-weight: 700; letter-spacing: .3px;
    }
    .main {
      display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr);
      gap: 12px; padding: 12px; min-height: 0;
    }
    .panel {
      background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio);
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }

    /* ───── Maestro ───── */
    .maestro-cab { padding: 16px 16px 12px; display: grid; gap: 12px; border-bottom: 1px solid var(--borde); }
    .maestro-titulo { display: flex; align-items: center; justify-content: space-between; }
    .maestro-titulo h2 { margin: 0; font-size: 1.5rem; }
    .buscador { position: relative; }
    .buscador svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--texto-suave); }
    .buscador input { padding-left: 38px; }
    .lista { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
    .item {
      display: flex; align-items: center; gap: 14px; padding: 12px 16px;
      border-bottom: 1px solid var(--borde); cursor: pointer;
    }
    .item:hover { background: #f9fafb; }
    .item.activo { background: var(--azul-suave); }
    .item-texto { min-width: 0; }
    .item-nombre { font-weight: 600; }
    .item-email, .vacio { color: var(--texto-suave); font-size: .92rem; }
    .item-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vacio { padding: 24px 16px; text-align: center; }
    .avatar {
      flex: none; width: 46px; height: 46px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 600; font-size: .95rem;
    }

    /* ───── Detalle ───── */
    .detalle { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .ficha-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .ficha-cab h1 { margin: 8px 0 0; font-size: 2rem; line-height: 1.2; }
    .ficha-acciones { display: grid; justify-items: end; gap: 6px; flex: none; }
    .ficha-acciones .botones { flex-wrap: nowrap; }
    .ficha-id { color: var(--texto-suave); font-size: 1rem; }
    .botones { display: flex; gap: 8px; flex-wrap: wrap; }
    .contacto {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 32px;
      margin-top: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--borde);
    }
    .dato { display: flex; gap: 12px; align-items: flex-start; overflow-wrap: anywhere; }
    .dato svg { flex: none; color: var(--texto-suave); margin-top: 2px; }
    .dato .falta { color: var(--texto-suave); font-style: italic; }
    .placeholder { height: 100%; display: grid; place-items: center; color: var(--texto-suave); text-align: center; }

    /* ───── Formulario ───── */
    .form h1 { margin: 0 0 18px; font-size: 1.6rem; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .campo { display: grid; gap: 6px; }
    .campo span { font-size: .88rem; font-weight: 600; color: #374151; }
    .campo span i { color: var(--rojo); font-style: normal; }
    .form .botones { margin-top: 6px; }

    /* ───── Controles ───── */
    input {
      width: 100%; padding: 10px 12px; font: inherit; color: inherit;
      border: 1px solid #d1d5db; border-radius: 8px; background: #fff;
    }
    input:focus { outline: 2px solid var(--azul); outline-offset: -1px; border-color: transparent; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
      font: inherit; font-weight: 500; border-radius: 8px; cursor: pointer;
      border: 1px solid #d1d5db; background: #f9fafb; color: var(--texto);
    }
    .btn:hover { background: #f3f4f6; }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-primario { background: var(--azul); border-color: var(--azul); color: #fff; }
    .btn-primario:hover { background: var(--azul-hover); }
    .btn-peligro { color: var(--rojo); border-color: #fca5a5; background: var(--rojo-suave); }
    .btn-peligro:hover { background: #fee2e2; }
    .error {
      margin-bottom: 14px; padding: 10px 14px; border-radius: 8px;
      background: var(--rojo-suave); color: var(--rojo); border: 1px solid #fecaca;
    }

    /* ───── Pantallas angostas: maestro arriba, detalle abajo (cada uno con su scroll) ───── */
    @media (max-width: 760px) {
      .header { padding: 10px 16px; font-size: 1.3rem; }
      .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 40%) minmax(0, 1fr); padding: 8px; gap: 8px; }
      .detalle { padding: 16px; }
      .ficha-cab { flex-direction: column-reverse; }
      .ficha-cab h1 { font-size: 1.5rem; margin-top: 0; }
      .ficha-acciones { width: 100%; grid-template-columns: 1fr auto; align-items: center; }
      .ficha-acciones .ficha-id { order: 2; }
      .fila { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Código de la app en JSX. Tipo "text/x-jsx" para que Babel no lo ejecute solo:
       se compila abajo con la configuración explícita (preset react, runtime classic → React.createElement global). -->
  <script type="text/x-jsx" id="app-jsx">
    const { useState, useEffect, useCallback } = React;

    // ───────────── API REST ─────────────
    async function api(metodo, url, cuerpo) {
      const res = await fetch(`/api${url}`, {
        method: metodo,
        headers: cuerpo ? { "Content-Type": "application/json" } : undefined,
        body: cuerpo ? JSON.stringify(cuerpo) : undefined,
      });
      if (res.status === 204) return null;
      const datos = await res.json().catch(() => null);
      if (!res.ok) throw new Error(datos?.error?.mensaje ?? `Error ${res.status}`);
      return datos;
    }

    const ClientesApi = {
      buscar: (q) => api("GET", `/clientes?q=${encodeURIComponent(q)}`),
      obtener: (id) => api("GET", `/clientes/${id}`),
      crear: (datos) => api("POST", "/clientes", datos),
      actualizar: (id, datos) => api("PUT", `/clientes/${id}`, datos),
      eliminar: (id) => api("DELETE", `/clientes/${id}`),
    };

    // ───────────── Utilidades ─────────────
    const coloresAvatar = [
      ["#dbeafe", "#1d4ed8"], ["#dcfce7", "#15803d"], ["#ede9fe", "#6d28d9"], ["#ffedd5", "#c2410c"],
      ["#fce7f3", "#be185d"], ["#ccfbf1", "#0f766e"], ["#e0e7ff", "#4338ca"], ["#fef9c3", "#a16207"],
    ];
    const iniciales = (c) => `${c.nombre[0] ?? ""}${c.apellido[0] ?? ""}`.toUpperCase();
    const nombreCompleto = (c) => `${c.nombre} ${c.apellido}`;
    const formatoTelefono = (t) => t?.replace(/^(\+?\d{2,3})?(\d{3})(\d{3})(\d{4})$/, (m, p, a, b, c) => [p, a, b, c].filter(Boolean).join(" ")) ?? t;

    // ───────────── Íconos (SVG en línea) ─────────────
    const Icono = ({ d, size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{d}</svg>
    );
    const IcBuscar = () => <Icono d={<><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></>} />;
    const IcMas = () => <Icono d={<path d="M12 5v14M5 12h14" />} />;
    const IcMail = () => <Icono d={<><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></>} />;
    const IcTel = () => <Icono d={<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />} />;
    const IcLugar = () => <Icono d={<><path d="M12 22s7-6.1 7-12a7 7 0 0 0-14 0c0 5.9 7 12 7 12z" /><circle cx="12" cy="10" r="2.5" /></>} />;
    const IcEditar = () => <Icono d={<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />} />;
    const IcBorrar = () => <Icono d={<><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" /></>} />;
    const IcGuardar = () => <Icono d={<><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M7 3v5h8V3M7 21v-7h10v7" /></>} />;
    const IcCerrar = () => <Icono d={<path d="M18 6 6 18M6 6l12 12" />} />;

    // ───────────── Maestro ─────────────
    function Avatar({ cliente }) {
      const [fondo, color] = coloresAvatar[cliente.id % coloresAvatar.length];
      return <div className="avatar" style={{ background: fondo, color }}>{iniciales(cliente)}</div>;
    }

    function Maestro({ clientes, cargando, busqueda, onBuscar, seleccionadoId, onSeleccionar, onAgregar }) {
      return (
        <section className="panel">
          <div className="maestro-cab">
            <div className="maestro-titulo">
              <h2>Clientes</h2>
              <button className="btn btn-primario" onClick={onAgregar}><IcMas /> Agregar</button>
            </div>
            <label className="buscador">
              <IcBuscar />
              <input type="search" placeholder="Buscar por cualquier campo..." value={busqueda}
                onChange={(e) => onBuscar(e.target.value)} aria-label="Buscar clientes" />
            </label>
          </div>
          <ul className="lista">
            {clientes.map((c) => (
              <li key={c.id} className={`item ${c.id === seleccionadoId ? "activo" : ""}`} onClick={() => onSeleccionar(c.id)}>
                <Avatar cliente={c} />
                <div className="item-texto">
                  <div className="item-nombre">{nombreCompleto(c)}</div>
                  <div className="item-email">{c.email}</div>
                </div>
              </li>
            ))}
            {!cargando && clientes.length === 0 && (
              <li className="vacio">{busqueda ? "Ningún cliente coincide con la búsqueda." : "Todavía no hay clientes."}</li>
            )}
          </ul>
        </section>
      );
    }

    // ───────────── Detalle: ficha ─────────────
    function Dato({ icono, children }) {
      return <div className="dato">{icono}<div>{children}</div></div>;
    }

    function Ficha({ cliente, onEditar, onEliminar }) {
      const falta = (txt) => <span className="falta">{txt}</span>;
      return (
        <div>
          <div className="ficha-cab">
            <h1>{nombreCompleto(cliente)}</h1>
            <div className="ficha-acciones">
              <span className="ficha-id">#{cliente.id}</span>
              <div className="botones">
                <button className="btn" onClick={onEditar}><IcEditar /> Editar</button>
                <button className="btn btn-peligro" onClick={onEliminar}><IcBorrar /> Eliminar</button>
              </div>
            </div>
          </div>
          <div className="contacto">
            <div style={{ display: "grid", gap: 10 }}>
              <Dato icono={<IcMail />}><a href={`mailto:${cliente.email}`} style={{ color: "inherit" }}>{cliente.email}</a></Dato>
              <Dato icono={<IcTel />}>{cliente.telefono ? formatoTelefono(cliente.telefono) : falta("Sin teléfono")}</Dato>
            </div>
            <Dato icono={<IcLugar />}>
              <div>{cliente.domicilio ?? falta("Sin domicilio")}</div>
              <div>{cliente.localidad ?? falta("Sin localidad")}</div>
            </Dato>
          </div>
        </div>
      );
    }

    // ───────────── Detalle: formulario de alta / edición ─────────────
    const vacio = { nombre: "", apellido: "", email: "", telefono: "", domicilio: "", localidad: "" };

    function Campo({ etiqueta, requerido, ...props }) {
      return (
        <label className="campo">
          <span>{etiqueta}{requerido && <i> *</i>}</span>
          <input required={requerido} {...props} />
        </label>
      );
    }

    function FormCliente({ cliente, onGuardar, onCancelar }) {
      const [datos, setDatos] = useState(() => (cliente ? { ...vacio, ...quitarNulos(cliente) } : vacio));
      const [error, setError] = useState("");
      const [guardando, setGuardando] = useState(false);

      const cambiar = (e) => setDatos({ ...datos, [e.target.name]: e.target.value });

      async function enviar(e) {
        e.preventDefault();
        setGuardando(true);
        setError("");
        try {
          await onGuardar(datos);
        } catch (err) {
          setError(err.message);
          setGuardando(false);
        }
      }

      return (
        <form className="form" onSubmit={enviar} onKeyDown={(e) => e.key === "Escape" && onCancelar()}>
          <h1>{cliente ? `Editar #${cliente.id}` : "Nuevo cliente"}</h1>
          {error && <div className="error" role="alert">{error}</div>}
          <div className="fila">
            <Campo etiqueta="Nombre" name="nombre" requerido value={datos.nombre} onChange={cambiar} autoFocus autoComplete="given-name" />
            <Campo etiqueta="Apellido" name="apellido" requerido value={datos.apellido} onChange={cambiar} autoComplete="family-name" />
          </div>
          <div className="fila">
            <Campo etiqueta="Email" name="email" type="email" requerido value={datos.email} onChange={cambiar} autoComplete="email" />
            <Campo etiqueta="Teléfono" name="telefono" type="tel" value={datos.telefono} onChange={cambiar} autoComplete="tel" />
          </div>
          <div className="fila">
            <Campo etiqueta="Domicilio" name="domicilio" value={datos.domicilio} onChange={cambiar} autoComplete="street-address" />
            <Campo etiqueta="Localidad" name="localidad" value={datos.localidad} onChange={cambiar} />
          </div>
          <div className="botones">
            <button type="submit" className="btn btn-primario" disabled={guardando}><IcGuardar /> {guardando ? "Guardando..." : "Guardar"}</button>
            <button type="button" className="btn" onClick={onCancelar}><IcCerrar /> Cancelar</button>
          </div>
        </form>
      );
    }

    const quitarNulos = (obj) => Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, v ?? ""]));

    // ───────────── App ─────────────
    function App() {
      const [busqueda, setBusqueda] = useState("");
      const [clientes, setClientes] = useState([]);
      const [cargando, setCargando] = useState(true);
      const [seleccionadoId, setSeleccionadoId] = useState(null);
      const [cliente, setCliente] = useState(null); // ficha del seleccionado (con actividades)
      const [modo, setModo] = useState("ver"); // "ver" | "nuevo" | "editar"
      const [error, setError] = useState("");

      // Búsqueda en vivo contra la API (con pequeña espera y descartando respuestas viejas).
      const recargarLista = useCallback(async (q) => {
        try {
          const lista = await ClientesApi.buscar(q);
          setClientes(lista);
          setError("");
          return lista;
        } catch (e) {
          setError(e.message);
          return [];
        } finally {
          setCargando(false);
        }
      }, []);

      useEffect(() => {
        let vigente = true;
        const t = setTimeout(async () => {
          const lista = await ClientesApi.buscar(busqueda).catch((e) => (setError(e.message), null));
          if (!vigente || !lista) return;
          setClientes(lista);
          setCargando(false);
          setSeleccionadoId((actual) => actual ?? lista[0]?.id ?? null);
        }, 200);
        return () => { vigente = false; clearTimeout(t); };
      }, [busqueda]);

      // Carga la ficha del cliente seleccionado.
      useEffect(() => {
        if (seleccionadoId == null) { setCliente(null); return; }
        let vigente = true;
        ClientesApi.obtener(seleccionadoId)
          .then((c) => vigente && setCliente(c))
          .catch((e) => vigente && (setError(e.message), setCliente(null)));
        return () => { vigente = false; };
      }, [seleccionadoId]);

      function seleccionar(id) {
        setModo("ver");
        setSeleccionadoId(id);
      }

      async function guardar(datos) {
        const guardado = modo === "nuevo"
          ? await ClientesApi.crear(datos)
          : await ClientesApi.actualizar(cliente.id, datos);
        await recargarLista(busqueda);
        setCliente(await ClientesApi.obtener(guardado.id));
        setSeleccionadoId(guardado.id);
        setModo("ver");
      }

      async function eliminar() {
        if (!confirm(`¿Eliminar a ${nombreCompleto(cliente)} y todas sus actividades?`)) return;
        try {
          await ClientesApi.eliminar(cliente.id);
          const indice = clientes.findIndex((c) => c.id === cliente.id);
          const lista = await recargarLista(busqueda);
          setSeleccionadoId(lista[Math.min(indice, lista.length - 1)]?.id ?? null);
        } catch (e) {
          setError(e.message);
        }
      }

      let contenido;
      if (modo === "nuevo") {
        contenido = <FormCliente key="nuevo" onGuardar={guardar} onCancelar={() => setModo("ver")} />;
      } else if (modo === "editar" && cliente) {
        contenido = <FormCliente key={`ed-${cliente.id}`} cliente={cliente} onGuardar={guardar} onCancelar={() => setModo("ver")} />;
      } else if (cliente) {
        contenido = <Ficha cliente={cliente} onEditar={() => setModo("editar")} onEliminar={eliminar} />;
      } else {
        contenido = <div className="placeholder">{cargando ? "Cargando..." : "Seleccioná un cliente o agregá uno nuevo."}</div>;
      }

      return (
        <div className="app">
          <header className="header">MiniCRM</header>
          <main className="main">
            <Maestro
              clientes={clientes}
              cargando={cargando}
              busqueda={busqueda}
              onBuscar={setBusqueda}
              seleccionadoId={modo === "nuevo" ? null : seleccionadoId}
              onSeleccionar={seleccionar}
              onAgregar={() => setModo("nuevo")}
            />
            <section className="panel">
              <div className="detalle">
                {error && <div className="error" role="alert">{error} <button className="btn" style={{ marginLeft: 8, padding: "2px 8px" }} onClick={() => setError("")}>×</button></div>}
                {contenido}
              </div>
            </section>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    // Babel configurado explícitamente: preset "react" con runtime clásico (usa React global).
    const fuente = document.getElementById("app-jsx").textContent;
    const { code } = Babel.transform(fuente, { presets: [["react", { runtime: "classic" }]] });
    const script = document.createElement("script");
    script.textContent = code;
    document.body.appendChild(script);
  </script>
</body>
</html>
