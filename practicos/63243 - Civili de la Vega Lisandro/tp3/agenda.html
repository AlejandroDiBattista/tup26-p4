<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font-family: sans-serif; background: #f5f6f4; color: #26302a; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; }

    .buscador { width: 300px; padding: 12px 18px; border: 1px solid #d9ded9; border-radius: 20px; font-size: 15px; }
    .btn-agregar { padding: 12px 18px; border: none; border-radius: 20px; background: #2e3a30; color: white; font-weight: bold; cursor: pointer; }

    .lista { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .vacio { color: gray; }

    .tarjeta { padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; cursor: pointer; }
    .tarjeta:focus { outline: 2px solid #2e3a30; outline-offset: 2px; }
    .tarjeta-arriba { display: flex; justify-content: space-between; }
    .tarjeta h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; }
    .tarjeta h2 span { font-family: sans-serif; font-size: 16px; font-weight: normal; color: gray; }
    .estrella { padding: 0; border: none; background: none; font-size: 24px; color: #8b7c55; cursor: pointer; }
    .telefono { margin: 20px 0 8px; font-size: 14px; font-weight: bold; }
    .github { margin: 0; font-size: 13px; color: gray; }
    .tarjeta hr { border: none; border-top: 1px solid #ddd; margin: 14px 0 10px; }
    .datos { margin: 0; font-size: 12px; color: gray; letter-spacing: 1px; }

    dialog { width: 560px; padding: 20px; border: none; border-radius: 16px; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
    dialog h2 { margin: 0; }
    .subtitulo { margin-top: 4px; color: gray; }
    .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .campos label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: bold; color: #555; }
    .campos input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    .error { color: #c0392b; }
    .botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .botones button { padding: 10px 16px; border: 1px solid #ccc; border-radius: 8px; background: white; cursor: pointer; }
    .btn-guardar { background: #2e3a30 !important; color: white; }
    .btn-eliminar { margin-right: auto; color: #c0392b; }

    @media (max-width: 1120px) { .lista { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .lista { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <dialog id="dialogo"></dialog>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core';
    import alumnosJson from './alumnos.json' with { type: 'json' };

    const CLAVE = 'agenda-alumnos';

    // ================== ESTADO ==================

    // si hay algo guardado en localStorage uso eso, si no uso el json y lo guardo
    function cargarAlumnos() {
        const guardado = localStorage.getItem(CLAVE);
        if (guardado) {
            return JSON.parse(guardado);
        }
        localStorage.setItem(CLAVE, JSON.stringify(alumnosJson));
        return alumnosJson;
    }

    function formVacio() {
        return { apellido: '', nombre: '', legajo: '', comision: '', telefono: '', github: '' };
    }

    const estado = reactive({
        alumnos: cargarAlumnos(),
        busqueda: '',
        dialogoAbierto: false,
        editando: null, // id del alumno que se esta editando, null si es uno nuevo
        form: formVacio(),
        error: '',
    });

    // ================== FUNCIONES ==================

    function guardar() {
        localStorage.setItem(CLAVE, JSON.stringify(estado.alumnos));
    }

    // saco mayusculas y acentos para poder comparar
    function normalizar(texto) {
        return String(texto).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    // primero los favoritos, despues por apellido y nombre
    function compararAlumnos(a, b) {
        if (a.favorito != b.favorito) {
            return a.favorito ? -1 : 1;
        }
        const porApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' });
        if (porApellido != 0) {
            return porApellido;
        }
        return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' });
    }

    function alumnosFiltrados() {
        const texto = normalizar(estado.busqueda.trim());
        const lista = estado.alumnos.filter(a => {
            const datos = normalizar(a.apellido + ' ' + a.nombre + ' ' + a.legajo + ' ' + a.comision + ' ' + a.github + ' ' + a.telefono);
            return datos.includes(texto);
        });
        return lista.sort(compararAlumnos);
    }

    function alternarFavorito(alumno) {
        alumno.favorito = !alumno.favorito;
        guardar();
    }

    function nuevoId() {
        let max = 0;
        for (const a of estado.alumnos) {
            if (a.id > max) max = a.id;
        }
        return max + 1;
    }

    function abrirAgregar() {
        estado.editando = null;
        estado.form = formVacio();
        estado.error = '';
        estado.dialogoAbierto = true;
    }

    function abrirEditar(alumno) {
        estado.editando = alumno.id;
        // hago una copia para que si cancela no se modifique el original
        estado.form = {
            apellido: alumno.apellido,
            nombre: alumno.nombre,
            legajo: alumno.legajo,
            comision: alumno.comision,
            telefono: alumno.telefono,
            github: alumno.github,
        };
        estado.error = '';
        estado.dialogoAbierto = true;
    }

    function cerrarDialogo() {
        estado.dialogoAbierto = false;
    }

    function validar(datos) {
        for (const campo in datos) {
            if (datos[campo] == '') {
                return 'Todos los campos son obligatorios.';
            }
        }
        if (isNaN(datos.legajo)) {
            return 'El legajo tiene que ser un numero.';
        }
        return '';
    }

    function guardarAlumno(e) {
        e.preventDefault();

        const datos = {};
        for (const campo in estado.form) {
            datos[campo] = estado.form[campo].trim();
        }
        datos.github = datos.github.replace('@', '');

        estado.error = validar(datos);
        if (estado.error != '') return;

        if (estado.editando == null) {
            const nuevo = { id: nuevoId(), ...datos, favorito: false };
            estado.alumnos = [...estado.alumnos, nuevo];
        } else {
            const alumno = estado.alumnos.find(a => a.id == estado.editando);
            Object.assign(alumno, datos);
        }

        guardar();
        cerrarDialogo();
    }

    function eliminarAlumno() {
        estado.alumnos = estado.alumnos.filter(a => a.id != estado.editando);
        guardar();
        cerrarDialogo();
    }

    function manejarTeclado(e, alumno) {
        // solo si el foco esta en la tarjeta
        if (e.target != e.currentTarget) return;

        if (e.key == 'Enter') {
            e.preventDefault();
            abrirEditar(alumno);
        } else if (e.key == ' ') {
            e.preventDefault(); // para que no baje la pagina
            alternarFavorito(alumno);
            // al reordenar la lista se pierde el foco, lo vuelvo a poner en la tarjeta
            setTimeout(() => {
                const tarjeta = document.querySelector('article[data-id="' + alumno.id + '"]');
                if (tarjeta) tarjeta.focus();
            }, 0);
        }
    }

    // ================== VISTAS ==================

    function Tarjeta(alumno) {
        return html`
            <article class="tarjeta" tabindex="0" data-id="${alumno.id}"
                @click="${() => abrirEditar(alumno)}"
                @keydown="${(e) => manejarTeclado(e, alumno)}">
                <div class="tarjeta-arriba">
                    <h2>${() => alumno.apellido} <span>${() => alumno.nombre}</span></h2>
                    <button type="button" class="estrella" tabindex="-1"
                        @click="${(e) => { e.stopPropagation(); alternarFavorito(alumno); }}">
                        ${() => alumno.favorito ? '★' : '☆'}
                    </button>
                </div>
                <p class="telefono">${() => alumno.telefono}</p>
                <p class="github">@${() => alumno.github}</p>
                <hr>
                <p class="datos">${() => alumno.comision} · ${() => alumno.legajo}</p>
            </article>
        `;
    }

    function Lista() {
        const lista = alumnosFiltrados();
        if (lista.length == 0) {
            // lo devuelvo dentro de un array porque si no despues de buscar algo
            // sin resultados la lista no se volvia a mostrar
            return [html`<p class="vacio">No hay alumnos para mostrar.</p>`];
        }
        return lista.map(Tarjeta);
    }

    function Campo(titulo, nombre) {
        return html`
            <label>
                ${titulo}
                <input type="text" name="${nombre}"
                    value="${() => estado.form[nombre]}"
                    @input="${(e) => estado.form[nombre] = e.target.value}">
            </label>
        `;
    }

    const app = document.getElementById('app');

    html`
        <header>
            <h1>Agenda</h1>
            <div>
                <input type="search" class="buscador" placeholder="Buscar alumno..."
                    @input="${(e) => estado.busqueda = e.target.value}">
                <button type="button" class="btn-agregar" @click="${abrirAgregar}">+ Agregar</button>
            </div>
        </header>
        <section class="lista">
            ${() => Lista()}
        </section>
    `(app);

    const dialogo = document.getElementById('dialogo');

    html`
        <form @submit="${guardarAlumno}">
            <h2>${() => estado.editando == null ? 'Agregar alumno' : 'Editar alumno'}</h2>
            <p class="subtitulo">${() => estado.editando == null ? 'Completá los datos del nuevo alumno.' : 'Actualizá los datos del alumno.'}</p>
            <div class="campos">
                ${Campo('Apellido', 'apellido')}
                ${Campo('Nombre', 'nombre')}
                ${Campo('Legajo', 'legajo')}
                ${Campo('Comisión', 'comision')}
                ${Campo('Teléfono', 'telefono')}
                ${Campo('GitHub', 'github')}
            </div>
            <p class="error">${() => estado.error}</p>
            <div class="botones">
                ${() => estado.editando != null
                    ? html`<button type="button" class="btn-eliminar" @click="${eliminarAlumno}">Eliminar</button>`
                    : ''}
                <button type="submit" class="btn-guardar">Guardar</button>
                <button type="button" @click="${cerrarDialogo}">Cancelar</button>
            </div>
        </form>
    `(dialogo);

    // abro o cierro el dialogo segun el estado
    watch(() => {
        if (estado.dialogoAbierto) {
            if (!dialogo.open) dialogo.showModal();
        } else if (dialogo.open) {
            dialogo.close();
        }
    });

    // si lo cierran con Escape tambien actualizo el estado
    dialogo.addEventListener('close', () => estado.dialogoAbierto = false);
  </script>
</body>
</html>
