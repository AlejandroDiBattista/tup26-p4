<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font-family: sans-serif; background: #f5f6f4; color: #26302a; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; }

    .buscador { width: 300px; padding: 12px 18px; border: 1px solid #d9ded9; border-radius: 20px; font-size: 15px; }

    .lista { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .vacio { color: gray; }

    .tarjeta { padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; }
    .tarjeta-arriba { display: flex; justify-content: space-between; }
    .tarjeta h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; }
    .tarjeta h2 span { font-family: sans-serif; font-size: 16px; font-weight: normal; color: gray; }
    .estrella { padding: 0; border: none; background: none; font-size: 24px; color: #8b7c55; cursor: pointer; }
    .telefono { margin: 20px 0 8px; font-size: 14px; font-weight: bold; }
    .github { margin: 0; font-size: 13px; color: gray; }
    .tarjeta hr { border: none; border-top: 1px solid #ddd; margin: 14px 0 10px; }
    .datos { margin: 0; font-size: 12px; color: gray; letter-spacing: 1px; }

    @media (max-width: 1120px) { .lista { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .lista { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core';
    import alumnosJson from './alumnos.json' with { type: 'json' };

    const CLAVE = 'agenda-alumnos';

    // ================== ESTADO ==================

    // si hay algo guardado en localStorage uso eso, si no uso el json y lo guardo
    function cargarAlumnos() {
        const guardado = localStorage.getItem(CLAVE);
        if (guardado) {
            return JSON.parse(guardado);
        }
        localStorage.setItem(CLAVE, JSON.stringify(alumnosJson));
        return alumnosJson;
    }

    const estado = reactive({
        alumnos: cargarAlumnos(),
        busqueda: '',
    });

    // ================== FUNCIONES ==================

    function guardar() {
        localStorage.setItem(CLAVE, JSON.stringify(estado.alumnos));
    }

    // saco mayusculas y acentos para poder comparar
    function normalizar(texto) {
        return String(texto).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    // primero los favoritos, despues por apellido y nombre
    function compararAlumnos(a, b) {
        if (a.favorito != b.favorito) {
            return a.favorito ? -1 : 1;
        }
        const porApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' });
        if (porApellido != 0) {
            return porApellido;
        }
        return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' });
    }

    function alumnosFiltrados() {
        const texto = normalizar(estado.busqueda.trim());
        const lista = estado.alumnos.filter(a => {
            const datos = normalizar(a.apellido + ' ' + a.nombre + ' ' + a.legajo + ' ' + a.comision + ' ' + a.github + ' ' + a.telefono);
            return datos.includes(texto);
        });
        return lista.sort(compararAlumnos);
    }

    function alternarFavorito(alumno) {
        alumno.favorito = !alumno.favorito;
        guardar();
    }

    // ================== VISTAS ==================

    function Tarjeta(alumno) {
        return html`
            <article class="tarjeta">
                <div class="tarjeta-arriba">
                    <h2>${alumno.apellido} <span>${alumno.nombre}</span></h2>
                    <button type="button" class="estrella" @click="${() => alternarFavorito(alumno)}">
                        ${() => alumno.favorito ? '★' : '☆'}
                    </button>
                </div>
                <p class="telefono">${alumno.telefono}</p>
                <p class="github">@${alumno.github}</p>
                <hr>
                <p class="datos">${alumno.comision} · ${alumno.legajo}</p>
            </article>
        `;
    }

    function Lista() {
        const lista = alumnosFiltrados();
        if (lista.length == 0) {
            // lo devuelvo dentro de un array porque si no despues de buscar algo
            // sin resultados la lista no se volvia a mostrar
            return [html`<p class="vacio">No hay alumnos para mostrar.</p>`];
        }
        return lista.map(Tarjeta);
    }

    const app = document.getElementById('app');

    html`
        <header>
            <h1>Agenda</h1>
            <input type="search" class="buscador" placeholder="Buscar alumno..."
                @input="${(e) => estado.busqueda = e.target.value}">
        </header>
        <section class="lista">
            ${() => Lista()}
        </section>
    `(app);
  </script>
</body>
</html>
