<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    :root {
      --verde: #2f3f34;
      --dorado: #8a7c50;
      --borde: #dfe3dc;
      --suave: #6b7469;
    }
 
    body {
      margin: 0;
      padding: 48px 20px;
      background: #f5f5f4;
      color: var(--verde);
      font: 16px/1.4 system-ui, sans-serif;
    }
 
    /* ===== Página ===== */
    main {
      max-width: 1104px;
      margin: 0 auto;
 
      > header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 24px;
 
        h1 { margin: 0; font-size: 1.9rem; }
      }
 
      > section {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
 
        > p {
          grid-column: 1 / -1;
          margin: 24px 0;
          text-align: center;
          color: var(--suave);
        }
      }
 
      > footer {
        margin-top: 24px;
        text-align: center;
        font-size: .85rem;
        color: var(--suave);
      }
    }
 
    /* ===== Buscador y acciones ===== */
    main > header > div {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
 
      input {
        width: min(280px, 100%);
        padding: 12px 20px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        background: #fdfdfa;
        color: var(--verde);
        font: inherit;
        font-size: .9rem;
 
        &:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
      }
 
      button {
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--verde);
        color: white;
        font: 700 .9rem system-ui, sans-serif;
        cursor: pointer;
 
        &:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
      }
    }
 
    /* ===== Tarjeta ===== */
    article {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: 16px;
      background: #fdfdfa;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .14);
      cursor: pointer;
 
      &:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
 
      > header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        min-height: 3.4rem;
 
        h2 {
          margin: 0;
          font: 700 1.5rem/1.2 Georgia, 'Times New Roman', serif;
 
          span {
            font: 400 1rem system-ui, sans-serif;
            color: var(--suave);
          }
        }
 
        button {
          flex: none;
          padding: 0;
          border: 0;
          background: none;
          font-size: 1.4rem;
          line-height: 1;
          color: var(--dorado);
          cursor: pointer;
 
          &:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; border-radius: 4px; }
        }
      }
 
      > address {
        display: grid;
        gap: 4px;
        font-style: normal;
 
        p { margin: 0; }
        p:first-child { font-weight: 600; }
        p:last-child { font-size: .85rem; color: var(--suave); }
      }
 
      > footer {
        padding-top: 12px;
        border-top: 1px solid var(--borde);
        font-size: .72rem;
        font-weight: 600;
        letter-spacing: .08em;
        color: var(--suave);
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
 
  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import iniciales from './alumnos.json' with { type: 'json' }
 
    // ===== ESTADO =====
    const CLAVE = 'agenda.alumnos'
 
    function leerGuardados() {
      try {
        const texto = localStorage.getItem(CLAVE)
        return texto ? JSON.parse(texto) : null
      } catch {
        return null
      }
    }
 
    const state = reactive({
      alumnos: leerGuardados() ?? structuredClone(iniciales),
      busqueda: '',
      editando: null,   // id del alumno que se está editando (el diálogo llega en el paso 7)
    })
 
    // ===== ACCIONES =====
    function guardar() {
      localStorage.setItem(CLAVE, JSON.stringify(state.alumnos))
    }
 
    function alternarFavorito(id) {
      const alumno = state.alumnos.find(a => a.id === id)
      alumno.favorito = !alumno.favorito
      guardar()
    }
 
    function abrirEdicion(id) {
      state.editando = id
    }
 
    // Al cambiar un favorito la tarjeta se mueve y el navegador pierde el foco:
    // lo devolvemos a esa tarjeta cuando Arrow terminó de reordenar
    function enfocarTarjeta(id) {
      requestAnimationFrame(() =>
        document.querySelector(`article[data-id="${id}"]`)?.focus()
      )
    }
 
    // Enter abre la edición; la barra espaciadora alterna el favorito
    function alPresionarTecla(e, id) {
      // Ignora las teclas que vienen de la estrella: ese botón ya las maneja solo
      if (e.target !== e.currentTarget) return
 
      if (e.key === 'Enter') {
        e.preventDefault()
        abrirEdicion(id)
      } else if (e.key === ' ') {
        e.preventDefault()   // evita que la página haga scroll
        alternarFavorito(id)
        enfocarTarjeta(id)
      }
    }
 
    function alHacerClicEnEstrella(e, id) {
      e.stopPropagation()   // que el clic no llegue a la tarjeta y abra la edición
      alternarFavorito(id)
      enfocarTarjeta(id)
    }
 
    function buscar(texto) {
      state.busqueda = texto
    }
 
    // Minúsculas y sin tildes: "Álvarez" -> "alvarez"
    function normalizar(texto) {
      return String(texto).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    }
 
    // Compara textos ignorando mayúsculas y tildes
    function comparar(a, b) {
      return a.localeCompare(b, 'es', { sensitivity: 'base' })
    }
 
    // Un alumno coincide si TODAS las palabras buscadas aparecen en alguno de sus datos
    function coincide(alumno, terminos) {
      const datos = normalizar(
        `${alumno.apellido} ${alumno.nombre} ${alumno.legajo} ${alumno.comision} ${alumno.telefono} ${alumno.github}`
      )
      return terminos.every(t => datos.includes(t))
    }
 
    // Filtra por la búsqueda; favoritos primero, luego apellido y nombre
    function alumnosVisibles() {
      const terminos = normalizar(state.busqueda).split(/\s+/).filter(Boolean)
      return state.alumnos
        .filter(a => coincide(a, terminos))
        .sort((a, b) =>
          (b.favorito - a.favorito) ||
          comparar(a.apellido, b.apellido) ||
          comparar(a.nombre, b.nombre)
        )
    }
 
    // Si era la primera vez, crea el almacenamiento local con los datos iniciales
    if (localStorage.getItem(CLAVE) === null) guardar()
 
    // ===== VISTA =====
    // Plantilla de una tarjeta
    const tarjeta = a => html`
      <article tabindex="0"
               data-id="${a.id}"
               @click="${() => abrirEdicion(a.id)}"
               @keydown="${e => alPresionarTecla(e, a.id)}">
        <header>
          <h2>${() => a.apellido} <span>${() => a.nombre}</span></h2>
          <button type="button"
                  aria-pressed="${() => String(a.favorito)}"
                  aria-label="${() => a.favorito ? 'Quitar de favoritos' : 'Marcar como favorito'}"
                  @click="${e => alHacerClicEnEstrella(e, a.id)}">
            ${() => a.favorito ? '★' : '☆'}
          </button>
        </header>
        <address>
          <p>${() => a.telefono}</p>
          <p>@${() => a.github}</p>
        </address>
        <footer>${() => a.comision} · ${() => a.legajo}</footer>
      </article>
    `.key(a.id)
 
    // Mensaje cuando la búsqueda no encuentra nada
    const sinResultados = () => html`
      <p role="status">No hay alumnos para mostrar.</p>
    `.key('sin-resultados')
 
    // OJO: dentro de html`...` no se pueden usar comentarios de HTML: Arrow falla.
    // TEMPORAL: el <span> del pie sirve para probar Enter y el clic. Se borra en el paso 7.
    html`
      <main>
        <header>
          <h1>Agenda</h1>
          <div>
            <input type="search"
                   placeholder="Buscar alumno..."
                   aria-label="Buscar alumno"
                   @input="${e => buscar(e.target.value)}">
            <button type="button">+ Agregar</button>
          </div>
        </header>
 
        <section>
          ${() => {
            const lista = alumnosVisibles()
            // Siempre devuelve un array: cambiar entre "una plantilla" y "un array"
            // en el mismo lugar rompe el redibujado de Arrow
            return lista.length === 0 ? [sinResultados()] : lista.map(tarjeta)
          }}
        </section>
 
        <footer>
          ${() => alumnosVisibles().length} alumnos
          <span>${() => state.editando !== null ? ` · Editando el alumno id ${state.editando}` : ''}</span>
        </footer>
      </main>
    `(document.getElementById('app'))
  </script>
</body>
</html>
