<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    :root {
      --verde: #2f3f34;
      --dorado: #8a7c50;
      --borde: #dfe3dc;
      --suave: #6b7469;
    }

    body {
      margin: 0;
      padding: 48px 20px;
      background: #f5f5f4;
      color: var(--verde);
      font: 16px/1.4 system-ui, sans-serif;
    }

    main {
      max-width: 1104px;
      margin: 0 auto;

      > header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;

        h1 { margin: 0; font-size: 1.9rem; }
      }

      > section {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
      }

      > footer {
        margin-top: 24px;
        text-align: center;
        font-size: .85rem;
        color: var(--suave);
      }
    }

    article {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: 16px;
      background: #fdfdfa;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .14);

      > header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        min-height: 3.4rem;

        h2 {
          margin: 0;
          font: 700 1.5rem/1.2 Georgia, 'Times New Roman', serif;

          span {
            font: 400 1rem system-ui, sans-serif;
            color: var(--suave);
          }
        }

        button {
          flex: none;
          padding: 0;
          border: 0;
          background: none;
          font-size: 1.4rem;
          line-height: 1;
          color: var(--dorado);
          cursor: pointer;
        }
      }

      > address {
        display: grid;
        gap: 4px;
        font-style: normal;

        p { margin: 0; }
        p:first-child { font-weight: 600; }
        p:last-child { font-size: .85rem; color: var(--suave); }
      }

      > footer {
        padding-top: 12px;
        border-top: 1px solid var(--borde);
        font-size: .72rem;
        font-weight: 600;
        letter-spacing: .08em;
        color: var(--suave);
      }
    }
  </style>
</head>


<body>
  <div id="app"></div>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import iniciales from './alumnos.json' with { type: 'json' }

    const CLAVE = 'agenda.alumnos'

    function leerGuardados() {
      try {
        const texto = localStorage.getItem(CLAVE)
        return texto ? JSON.parse(texto) : null
      } catch {
        return null
      }
    }

    const state = reactive({
      alumnos: leerGuardados() ?? structuredClone(iniciales),
    })

    function guardar() {
      localStorage.setItem(CLAVE, JSON.stringify(state.alumnos))
    }

    function alternarFavorito(id) {
      const alumno = state.alumnos.find(a => a.id === id)
      alumno.favorito = !alumno.favorito
      guardar()
    }

    function comparar(a, b) {
      return a.localeCompare(b, 'es', { sensitivity: 'base' })
    }

    function alumnosVisibles() {
      return [...state.alumnos].sort((a, b) =>
        (b.favorito - a.favorito) ||
        comparar(a.apellido, b.apellido) ||
        comparar(a.nombre, b.nombre)
      )
    }

    if (localStorage.getItem(CLAVE) === null) guardar()

    html`
      <main>
        <header>
          <h1>Agenda</h1>
        </header>

        <section>
          ${() => alumnosVisibles().map(a => html`
            <article>
              <header>
                <h2>${() => a.apellido} <span>${() => a.nombre}</span></h2>
                <button type="button"
                        aria-pressed="${() => String(a.favorito)}"
                        aria-label="${() => a.favorito ? 'Quitar de favoritos' : 'Marcar como favorito'}"
                        @click="${() => alternarFavorito(a.id)}">
                  ${() => a.favorito ? '★' : '☆'}
                </button>
              </header>
              <address>
                <p>${() => a.telefono}</p>
                <p>@${() => a.github}</p>
              </address>
              <footer>${() => a.comision} · ${() => a.legajo}</footer>
            </article>
          `.key(a.id))}
        </section>

        <footer>${() => alumnosVisibles().length} alumnos</footer>
      </main>
    `(document.getElementById('app'))
  </script>
</body>
</html>
