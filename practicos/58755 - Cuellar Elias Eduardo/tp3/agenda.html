<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import iniciales from './alumnos.json' with { type: 'json' }

    const CLAVE = 'agenda.alumnos'

    function leerGuardados() {
      try {
        const texto = localStorage.getItem(CLAVE)
        return texto ? JSON.parse(texto) : null
      } catch {
        return null
      }
    }

    const state = reactive({
      alumnos: leerGuardados() ?? structuredClone(iniciales),
    })

    function guardar() {
      localStorage.setItem(CLAVE, JSON.stringify(state.alumnos))
    }

    function alternarFavorito(id) {
      const alumno = state.alumnos.find(a => a.id === id)
      alumno.favorito = !alumno.favorito
      guardar()
    }

    function comparar(a, b) {
      return a.localeCompare(b, 'es', { sensitivity: 'base' })
    }

    function alumnosVisibles() {
      return [...state.alumnos].sort((a, b) =>
        (b.favorito - a.favorito) ||
        comparar(a.apellido, b.apellido) ||
        comparar(a.nombre, b.nombre)
      )
    }
    
    if (localStorage.getItem(CLAVE) === null) guardar()

    const app = document.getElementById('app')
    html`
      <h1>Alumnos</h1>
      <ul>
        ${() => alumnosVisibles().map(a => html`
          <li @click="${() => alternarFavorito(a.id)}">
            ${() => a.favorito ? '★ ' : ''}${a.nombre} <b>${a.apellido}</b>
          </li>
        `.key(a.id))}
      </ul>
    `(app)
  </script>
</body>
</html>
