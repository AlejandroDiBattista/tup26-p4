<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniCRM</title>

  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────── */
    :root {
      --color-fondo: #f1f4f8;
      --color-panel: #ffffff;
      --color-barra: #2c4466;
      --color-texto: #1d2633;
      --color-suave: #5f6b7a;
      --color-borde: #e1e6ed;
      --color-borde-fuerte: #c9d1dc;
      --color-hover: #f5f8fc;
      --color-seleccion: #e6f0fd;
      --color-primario: #2470dc;
      --color-primario-hover: #1c5fc0;
      --color-peligro: #d03535;
      --color-peligro-fondo: #fdf1f1;
      --color-exito: #2f9e5b;
      --color-exito-fondo: #f2faf5;

      --radio: 10px;
      --radio-control: 8px;
      --espacio: 16px;
      --sombra: 0 1px 2px rgb(16 24 40 / 6%), 0 1px 3px rgb(16 24 40 / 8%);
      --fuente: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ── Base: la página ocupa la pantalla y nunca se desplaza ──────────── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body, #raiz { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--color-fondo);
      color: var(--color-texto);
      font: 15px/1.45 var(--fuente);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    button, input { font: inherit; color: inherit; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .barra {
      flex: none;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 24px;
      background: var(--color-barra);
      color: #fff;
    }

    .barra h1 { font-size: 22px; font-weight: 700; letter-spacing: .2px; }

    .selector-conexion {
      display: flex; align-items: center; gap: 2px;
      padding: 3px;
      border-radius: 9px;
      background: rgb(255 255 255 / 12%);
    }
    .selector-titulo { padding: 0 8px 0 6px; font-size: 13px; opacity: .8; }
    .selector-conexion button {
      padding: 4px 12px;
      border: 0; border-radius: 6px;
      background: none; color: #fff;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .selector-conexion button:hover { background: rgb(255 255 255 / 12%); }
    .selector-conexion button[aria-checked="true"] { background: #fff; color: var(--color-barra); }
    .selector-conexion button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }

    .contenido {
      flex: 1;
      min-height: 0; /* permite que los hijos tengan scroll propio */
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: var(--espacio);
      padding: var(--espacio);
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--color-panel);
      border: 1px solid var(--color-borde);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      overflow: hidden;
    }

    .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

    /* ── Botones ────────────────────────────────────────────────────────── */
    .boton {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--color-borde-fuerte);
      border-radius: var(--radio-control);
      background: #fff;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color .15s, border-color .15s;
    }
    .boton:hover { background: var(--color-hover); }
    .boton:focus-visible, .boton-icono:focus-visible, .marca:focus-visible {
      outline: 2px solid var(--color-primario); outline-offset: 2px;
    }
    .boton:disabled, .boton-icono:disabled, .marca:disabled { opacity: .55; cursor: not-allowed; }
    .boton svg, .boton-icono svg { width: 17px; height: 17px; flex: none; }

    .boton.primario { background: var(--color-primario); border-color: var(--color-primario); color: #fff; }
    .boton.primario:hover:not(:disabled) { background: var(--color-primario-hover); }
    .boton.peligro { color: var(--color-peligro); border-color: #f0b4b4; }
    .boton.peligro:hover:not(:disabled) { background: var(--color-peligro-fondo); }

    .boton-icono {
      display: inline-grid; place-items: center;
      width: 36px; height: 36px; flex: none;
      border: 1px solid var(--color-borde-fuerte);
      border-radius: var(--radio-control);
      background: #fff;
      cursor: pointer;
    }
    .boton-icono:hover:not(:disabled) { background: var(--color-hover); }
    .boton-icono.primario { background: var(--color-primario); border-color: var(--color-primario); color: #fff; }
    .boton-icono.primario:hover:not(:disabled) { background: var(--color-primario-hover); }
    .boton-icono.peligro { color: var(--color-peligro); }
    .boton-icono.peligro:hover:not(:disabled) { background: var(--color-peligro-fondo); }

    /* ── Controles de formulario ────────────────────────────────────────── */
    .control {
      width: 100%;
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--color-borde-fuerte);
      border-radius: var(--radio-control);
      background: #fff;
    }
    .control:focus { outline: 2px solid var(--color-primario); outline-offset: -1px; border-color: transparent; }
    .control[aria-invalid="true"] { border-color: var(--color-peligro); }
    .control::placeholder { color: #8a95a3; }

    .error-formulario { color: var(--color-peligro); font-size: 14px; }

    /* ── Maestro ────────────────────────────────────────────────────────── */
    .maestro-cabecera { flex: none; padding: 20px 20px 14px; }
    .maestro-titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .maestro-titulo h2 { font-size: 22px; }

    .buscador { position: relative; }
    .buscador svg {
      position: absolute; left: 12px; top: 50%; translate: 0 -50%;
      width: 18px; height: 18px; color: var(--color-suave); pointer-events: none;
    }
    .buscador .control { padding-left: 38px; }

    .contador { margin-top: 8px; font-size: 13px; color: var(--color-suave); }

    .cliente {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 12px 20px;
      border: 0;
      border-top: 1px solid var(--color-borde);
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .cliente:hover { background: var(--color-hover); }
    .cliente:focus-visible { outline: 2px solid var(--color-primario); outline-offset: -2px; }
    .cliente[aria-current="true"] { background: var(--color-seleccion); }

    .cliente-datos { min-width: 0; }
    .cliente-nombre { font-weight: 600; }
    .cliente-email { font-size: 14px; color: var(--color-suave); }
    .cliente-nombre, .cliente-email { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .avatar {
      flex: none;
      display: grid; place-items: center;
      width: 44px; height: 44px;
      border-radius: 50%;
      font-weight: 600; font-size: 15px;
    }

    /* ── Detalle: ficha ─────────────────────────────────────────────────── */
    .ficha {
      flex: none;
      position: relative;
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--color-borde);
    }
    .ficha-id { position: absolute; top: 14px; right: 20px; color: var(--color-suave); font-variant-numeric: tabular-nums; }
    .ficha-cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 0 16px; }
    .ficha h2 { font-size: 28px; line-height: 1.2; overflow-wrap: anywhere; }
    .ficha-acciones { display: flex; gap: 8px; flex: none; margin-top: 18px; }

    .ficha-datos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px 32px;
    }
    .ficha-contacto { display: grid; gap: 10px; }
    .dato { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
    .dato svg { flex: none; width: 18px; height: 18px; margin-top: 2px; color: var(--color-suave); }
    .dato span { overflow-wrap: anywhere; }
    .dato-vacio { color: var(--color-suave); font-style: italic; }

    /* ── Detalle: formulario de cliente ─────────────────────────────────── */
    .formulario-cliente { display: grid; gap: 14px; }
    .formulario-cliente h2 { font-size: 22px; margin-right: 60px; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .campo { display: grid; gap: 4px; min-width: 0; }
    .campo label { font-size: 13px; font-weight: 500; color: var(--color-suave); }
    .campo abbr { color: var(--color-peligro); text-decoration: none; }
    .formulario-acciones { display: flex; gap: 8px; justify-content: flex-end; }

    .detalle-formulario { padding: 24px 28px; position: relative; }

    /* ── Detalle: subformulario de actividades ──────────────────────────── */
    .subformulario {
      flex: none;
      margin: 16px 28px 0;
      padding: 12px;
      border: 2px dotted var(--color-borde-fuerte);
      border-radius: 12px;
      transition: border-color .15s, background-color .15s;
    }
    .subformulario.editando { border-color: var(--color-primario); background: #f7faff; }
    .subformulario-linea { display: flex; gap: 8px; align-items: center; }
    .subformulario-linea .descripcion { flex: 1 1 auto; }
    .subformulario-linea .fecha { flex: 0 0 170px; }
    .subformulario .error-formulario { margin-top: 8px; }

    /* ── Detalle: actividades ───────────────────────────────────────────── */
    .actividades { padding: 18px 28px 24px; }
    .actividades section + section { margin-top: 24px; }
    .actividades h3 { font-size: 18px; margin-bottom: 10px; }
    .actividades h3 small { font-weight: 400; color: var(--color-suave); font-size: 14px; }

    .lista-actividades { border: 1px solid var(--color-borde); border-radius: var(--radio); overflow: hidden; }
    .lista-actividades.completadas { background: var(--color-exito-fondo); }

    .actividad { display: flex; gap: 14px; align-items: center; padding: 10px 12px 10px 16px; transition: background-color .15s; }
    .actividad + .actividad { border-top: 1px solid var(--color-borde); }
    .actividad.editando { background: var(--color-seleccion); }
    .actividad-texto { flex: 1; min-width: 0; }
    .actividad-descripcion { overflow-wrap: anywhere; }
    .actividad-fecha { font-size: 14px; color: var(--color-suave); }
    .actividad-fecha.vencida { color: var(--color-peligro); }
    .actividad-acciones { display: flex; gap: 6px; flex: none; }
    .actividad-acciones .boton-icono { width: 34px; height: 34px; }

    .marca {
      flex: none;
      display: grid; place-items: center;
      width: 22px; height: 22px;
      padding: 0;
      border: 2px solid #b7c0cc; border-radius: 6px;
      background: #fff;
      color: #fff;
    }
    button.marca { cursor: pointer; }
    button.marca:hover:not(:disabled) { border-color: var(--color-exito); color: var(--color-exito); }
    .marca.hecha { background: var(--color-exito); border-color: var(--color-exito); }
    .marca svg { width: 14px; height: 14px; }
    button.marca svg { opacity: 0; }
    button.marca:hover:not(:disabled) svg { opacity: 1; }

    /* ── Estados ────────────────────────────────────────────────────────── */
    .aviso {
      padding: 28px 20px;
      text-align: center;
      color: var(--color-suave);
    }
    .aviso.error { color: var(--color-peligro); }
    .aviso .boton { margin-top: 10px; }
    .detalle-vacio { flex: 1; display: grid; place-items: center; }
    .lista-actividades .aviso { padding: 16px; }

    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 16px; padding: 10px 12px 10px 16px;
      border: 1px solid #f0b4b4; border-radius: var(--radio-control);
      background: var(--color-peligro-fondo); color: var(--color-peligro);
    }
    .banner .boton-icono { width: 30px; height: 30px; border: 0; background: none; color: inherit; }

    /* ── Modal de confirmación ──────────────────────────────────────────── */
    .dialogo {
      width: min(440px, calc(100vw - 32px));
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: var(--color-panel);
      color: var(--color-texto);
      box-shadow: 0 24px 60px rgb(16 24 40 / 28%);
    }
    .dialogo[open] { animation: aparecer .16s ease-out; }
    .dialogo::backdrop { background: rgb(16 24 40 / 45%); animation: oscurecer .16s ease-out; }
    .dialogo-cuerpo { display: flex; gap: 16px; align-items: flex-start; padding: 24px 24px 20px; }
    .dialogo-icono {
      flex: none;
      display: grid; place-items: center;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--color-exito-fondo); color: var(--color-exito);
    }
    .dialogo-icono.peligro { background: var(--color-peligro-fondo); color: var(--color-peligro); }
    .dialogo-icono svg { width: 22px; height: 22px; }
    .dialogo-mensaje { padding-top: 9px; overflow-wrap: anywhere; }
    .dialogo-acciones {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 24px;
      background: #f7f9fc;
      border-top: 1px solid var(--color-borde);
    }
    .boton.peligro-solido { background: var(--color-peligro); border-color: var(--color-peligro); color: #fff; }
    .boton.peligro-solido:hover:not(:disabled) { background: #b72c2c; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    @keyframes oscurecer { from { opacity: 0; } }

    /* ── Pantallas angostas: maestro arriba, detalle abajo, cada uno con su scroll ── */
    @media (max-width: 760px) {
      .barra { padding: 10px 16px; }
      .selector-titulo { display: none; }
      .contenido { grid-template-columns: 1fr; grid-template-rows: 38% 1fr; gap: 12px; padding: 12px; }
      .maestro-cabecera { padding: 12px 16px 10px; }
      .maestro-titulo { margin-bottom: 10px; }
      .maestro-titulo h2 { font-size: 18px; }
      .cliente { padding: 10px 16px; }
      .ficha, .detalle-formulario { padding: 18px 16px 14px; }
      .ficha h2 { font-size: 22px; }
      .ficha-acciones { margin-top: 22px; }
      .ficha-acciones .boton span { display: none; } /* solo iconos */
      .ficha-acciones .boton { padding: 8px 10px; }
      .fila { grid-template-columns: 1fr; }
      .subformulario { margin: 12px 16px 0; padding: 8px; }
      .subformulario-linea { gap: 6px; }
      .subformulario-linea .control { padding: 8px; }
      .subformulario-linea .fecha { flex-basis: 112px; font-size: 13px; }
      .subformulario-linea .boton-icono { width: 34px; height: 34px; }
      .actividades { padding: 16px; }
    }
  </style>

  <!-- Versiones fijas. React 18.3.1 es la última con build UMD (expone los globales React y ReactDOM). -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js" crossorigin></script>
  <script>
    // JSX con runtime clásico: se compila a React.createElement y usa el React global (sin imports).
    Babel.registerPreset("react-clasico", {
      presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
    });
  </script>
</head>
<body>
  <div id="raiz"></div>

  <script type="text/babel" data-presets="react-clasico">
    const { useState, useEffect, useCallback, useMemo, useRef, useId, createContext, useContext } = React;

    // ── Acceso a datos ─────────────────────────────────────────────────────
    // Dos implementaciones con la misma interfaz: la API REST (/api) y el servidor MCP (/mcp).
    // Ambas lanzan Error con el mensaje del servidor y, si viene, `campo` (para marcarlo en el formulario).

    /** REST: fetch con JSON y errores uniformes. */
    async function pedir(ruta, { signal, metodo = "GET", datos } = {}) {
      const respuesta = await fetch(`/api${ruta}`, {
        method: metodo,
        signal,
        headers: { Accept: "application/json", ...(datos !== undefined ? { "Content-Type": "application/json" } : {}) },
        body: datos !== undefined ? JSON.stringify(datos) : undefined,
      });
      if (respuesta.status === 204) return null;
      const cuerpo = await respuesta.json().catch(() => null);
      if (!respuesta.ok) {
        const error = new Error(cuerpo?.error?.mensaje ?? `Error ${respuesta.status} al consultar el servidor`);
        error.campo = cuerpo?.error?.campo;
        throw error;
      }
      return cuerpo;
    }

    const apiRest = {
      listarClientes: (busqueda, signal) => pedir(`/clientes?q=${encodeURIComponent(busqueda)}`, { signal }),
      obtenerCliente: (id, signal) => pedir(`/clientes/${id}`, { signal }),
      crearCliente: (datos) => pedir("/clientes", { metodo: "POST", datos }),
      actualizarCliente: (id, datos) => pedir(`/clientes/${id}`, { metodo: "PUT", datos }),
      eliminarCliente: (id) => pedir(`/clientes/${id}`, { metodo: "DELETE" }),

      crearActividad: (clienteId, datos) => pedir(`/clientes/${clienteId}/actividades`, { metodo: "POST", datos }),
      actualizarActividad: (clienteId, id, datos) =>
        pedir(`/clientes/${clienteId}/actividades/${id}`, { metodo: "PUT", datos }),
      completarActividad: (clienteId, id) =>
        pedir(`/clientes/${clienteId}/actividades/${id}/completar`, { metodo: "POST", datos: {} }),
      eliminarActividad: (clienteId, id) => pedir(`/clientes/${clienteId}/actividades/${id}`, { metodo: "DELETE" }),
    };

    /**
     * Cliente MCP mínimo sobre Streamable HTTP (JSON-RPC 2.0 por POST a /mcp).
     * Hace el handshake `initialize` una vez y luego invoca herramientas con `tools/call`.
     */
    function crearClienteMcp(url) {
      const VERSION_PROTOCOLO = "2025-06-18";
      let siguienteId = 1;
      let inicializacion = null;

      async function enviar(mensaje, signal) {
        const respuesta = await fetch(url, {
          method: "POST",
          signal,
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json, text/event-stream",
            "MCP-Protocol-Version": VERSION_PROTOCOLO,
          },
          body: JSON.stringify({ jsonrpc: "2.0", ...mensaje }),
        });
        if (respuesta.status === 202) return null; // notificación aceptada, sin cuerpo
        const texto = await respuesta.text();
        // El servidor responde JSON; si respondiera como stream SSE, el mensaje viene en las líneas "data:".
        const json = respuesta.headers.get("Content-Type")?.includes("text/event-stream")
          ? texto.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5)).join("")
          : texto;
        const cuerpo = json ? JSON.parse(json) : null;
        if (cuerpo?.error) throw new Error(`MCP: ${cuerpo.error.message}`);
        if (!respuesta.ok) throw new Error(`Error ${respuesta.status} del servidor MCP`);
        return cuerpo?.result;
      }

      const rpc = (method, params, signal) => enviar({ id: siguienteId++, method, params }, signal);

      async function inicializar() {
        await rpc("initialize", {
          protocolVersion: VERSION_PROTOCOLO,
          capabilities: {},
          clientInfo: { name: "minicrm-web", version: "1.0.0" },
        });
        await enviar({ method: "notifications/initialized" });
      }

      /** Invoca una herramienta y devuelve su structuredContent; los errores de negocio llegan con isError. */
      async function herramienta(nombre, argumentos, signal) {
        inicializacion ??= inicializar().catch((error) => {
          inicializacion = null; // permite reintentar si el servidor no estaba disponible
          throw error;
        });
        await inicializacion;
        const resultado = await rpc("tools/call", { name: nombre, arguments: argumentos }, signal);
        if (resultado.isError) {
          const detalle = resultado.structuredContent?.error;
          const error = new Error(detalle?.mensaje ?? resultado.content?.[0]?.text ?? `Falló ${nombre}`);
          error.campo = detalle?.campo;
          throw error;
        }
        return resultado.structuredContent;
      }

      return herramienta;
    }

    const herramientaMcp = crearClienteMcp("/mcp");

    const apiMcp = {
      listarClientes: async (busqueda, signal) => (await herramientaMcp("listar_clientes", { busqueda }, signal)).clientes,
      obtenerCliente: async (id, signal) => (await herramientaMcp("obtener_cliente", { clienteId: id }, signal)).cliente,
      crearCliente: async (datos) => (await herramientaMcp("crear_cliente", datos)).cliente,
      actualizarCliente: async (id, datos) => (await herramientaMcp("actualizar_cliente", { clienteId: id, ...datos })).cliente,
      eliminarCliente: async (id) => { await herramientaMcp("eliminar_cliente", { clienteId: id }); },

      crearActividad: async (clienteId, datos) => (await herramientaMcp("agregar_actividad", { clienteId, ...datos })).actividad,
      actualizarActividad: async (clienteId, id, datos) =>
        (await herramientaMcp("actualizar_actividad", { clienteId, actividadId: id, ...datos })).actividad,
      completarActividad: async (clienteId, id) =>
        (await herramientaMcp("completar_actividad", { clienteId, actividadId: id })).actividad,
      eliminarActividad: async (clienteId, id) => { await herramientaMcp("eliminar_actividad", { clienteId, actividadId: id }); },
    };

    const CONEXIONES = {
      rest: { etiqueta: "REST", descripcion: "API REST en /api", api: apiRest },
      mcp: { etiqueta: "MCP", descripcion: "Servidor MCP en /mcp", api: apiMcp },
    };

    // La conexión elegida se recuerda en este navegador (si el almacenamiento está disponible).
    const CLAVE_CONEXION = "minicrm.conexion";
    function leerConexion() {
      try {
        const guardada = localStorage.getItem(CLAVE_CONEXION);
        return guardada in CONEXIONES ? guardada : "rest";
      } catch {
        return "rest";
      }
    }
    function guardarConexion(conexion) {
      try { localStorage.setItem(CLAVE_CONEXION, conexion); } catch { /* sin almacenamiento: solo dura la sesión */ }
    }

    /** Los componentes obtienen la implementación activa desde el contexto. */
    const ApiContexto = createContext(apiRest);
    const useApi = () => useContext(ApiContexto);

    const esCancelacion = (error) => error?.name === "AbortError";

    // ── Utilidades ─────────────────────────────────────────────────────────

    const nombreCompleto = (c) => `${c.nombre} ${c.apellido}`;

    const iniciales = (c) => `${c.nombre.charAt(0)}${c.apellido.charAt(0)}`.toUpperCase();

    // Colores estables por cliente (el mismo id siempre da el mismo color).
    const PALETA_AVATAR = [
      ["#e3eefc", "#2b62b8"], ["#e2f5ea", "#23804a"], ["#ece6fb", "#6a46c2"], ["#fdeadb", "#b8601b"],
      ["#fde4ea", "#bf3557"], ["#dff4f5", "#1f7f86"], ["#f3e6fa", "#8a3fae"], ["#fbf1d6", "#8b6a12"],
    ];
    const colorAvatar = (id) => PALETA_AVATAR[id % PALETA_AVATAR.length];

    const FORMATO_FECHA = new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", year: "numeric" });

    /** "2026-10-16" → "16 oct 2026". Se arma en hora local para no correr el día por la zona horaria. */
    function formatearFecha(iso) {
      const [anio, mes, dia] = iso.split("-").map(Number);
      return FORMATO_FECHA.format(new Date(anio, mes - 1, dia)).replace(/\./g, "").replace(/ de /g, " ");
    }

    /**
     * Orden de los compromisos: primero sin fecha, luego vencidos y al final los de hoy o futuros.
     * Dentro de cada grupo con fecha, ascendente; a igual fecha, por orden de alta.
     */
    const GRUPO_COMPROMISO = { sinFecha: 0, vencida: 1, vigente: 2 };
    const grupoCompromiso = (a) =>
      a.fechaCompromiso === null ? GRUPO_COMPROMISO.sinFecha : a.vencida ? GRUPO_COMPROMISO.vencida : GRUPO_COMPROMISO.vigente;

    function ordenarCompromisos(lista) {
      return [...lista].sort((a, b) =>
        grupoCompromiso(a) - grupoCompromiso(b)
        || (a.fechaCompromiso ?? "").localeCompare(b.fechaCompromiso ?? "")
        || a.id - b.id);
    }

    /** Devuelve el valor con demora: la búsqueda en vivo no consulta la API en cada tecla. */
    function useDemorado(valor, ms) {
      const [demorado, setDemorado] = useState(valor);
      useEffect(() => {
        const t = setTimeout(() => setDemorado(valor), ms);
        return () => clearTimeout(t);
      }, [valor, ms]);
      return demorado;
    }

    /**
     * Consulta asíncrona cancelable: si cambian las dependencias antes de que responda,
     * la respuesta vieja se descarta. `recargar` repite la consulta conservando los datos
     * actuales mientras llega la nueva (sin parpadeos).
     */
    function useConsulta(consultar, dependencias) {
      const [estado, setEstado] = useState({ datos: null, cargando: true, error: null });
      const [version, setVersion] = useState(0);

      useEffect(() => {
        const control = new AbortController();
        setEstado((e) => ({ ...e, cargando: true, error: null }));
        consultar(control.signal)
          .then((datos) => setEstado({ datos, cargando: false, error: null }))
          .catch((error) => {
            if (!esCancelacion(error)) setEstado((e) => ({ ...e, cargando: false, error }));
          });
        return () => control.abort();
      }, [...dependencias, version]);

      const recargar = useCallback(() => setVersion((v) => v + 1), []);
      return { ...estado, recargar };
    }

    // ── Íconos ─────────────────────────────────────────────────────────────

    const Icono = ({ children }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
           strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
    );
    const IconoBuscar = () => <Icono><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></Icono>;
    const IconoEmail = () => <Icono><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></Icono>;
    const IconoTelefono = () => (
      <Icono><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2" /></Icono>
    );
    const IconoUbicacion = () => <Icono><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" /></Icono>;
    const IconoCheck = () => <Icono><path d="m5 12 5 5 9-10" /></Icono>;
    const IconoMas = () => <Icono><path d="M12 5v14M5 12h14" /></Icono>;
    const IconoLapiz = () => <Icono><path d="M4 20h4L19 9l-4-4L4 16v4z" /><path d="m13.5 6.5 4 4" /></Icono>;
    const IconoPapelera = () => (
      <Icono><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></Icono>
    );
    const IconoGuardar = () => (
      <Icono><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2z" /><path d="M8 3v5h7V3M8 21v-7h8v7" /></Icono>
    );
    const IconoCerrar = () => <Icono><path d="M6 6l12 12M18 6 6 18" /></Icono>;

    // ── Componentes genéricos ──────────────────────────────────────────────

    function Boton({ variante, icono, children, ...props }) {
      return (
        <button type="button" className={`boton${variante ? ` ${variante}` : ""}`} {...props}>
          {icono}{children && <span>{children}</span>}
        </button>
      );
    }

    /** Botón solo con ícono: el texto queda como tooltip y nombre accesible. */
    function BotonIcono({ titulo, icono, variante, ...props }) {
      return (
        <button type="button" className={`boton-icono${variante ? ` ${variante}` : ""}`}
                title={titulo} aria-label={titulo} {...props}>
          {icono}
        </button>
      );
    }

    function Aviso({ children, error, onReintentar }) {
      return (
        <div className={`aviso${error ? " error" : ""}`} role={error ? "alert" : "status"}>
          <p>{children}</p>
          {onReintentar && <Boton onClick={onReintentar}>Reintentar</Boton>}
        </div>
      );
    }

    function Banner({ mensaje, onCerrar }) {
      if (!mensaje) return null;
      return (
        <div className="banner" role="alert">
          <span>{mensaje}</span>
          <BotonIcono titulo="Cerrar aviso" icono={<IconoCerrar />} onClick={onCerrar} />
        </div>
      );
    }

    /**
     * Modal de confirmación con <dialog> (reemplaza a window.confirm).
     * `pedido` = { mensaje, peligro } mientras está abierto; null cuando está cerrado.
     * Esc, Cancelar o un clic fuera del recuadro responden false.
     */
    function DialogoConfirmacion({ pedido, onResponder }) {
      const refDialogo = useRef(null);
      const refAceptar = useRef(null);
      const refCancelar = useRef(null);

      useEffect(() => {
        const dialogo = refDialogo.current;
        if (pedido && !dialogo.open) {
          dialogo.showModal();
          // En las acciones destructivas el foco queda en Cancelar, para no confirmar con Enter por error.
          (pedido.peligro ? refCancelar : refAceptar).current?.focus();
        } else if (!pedido && dialogo.open) {
          dialogo.close();
        }
      }, [pedido]);

      return (
        <dialog
          ref={refDialogo}
          className="dialogo"
          aria-describedby="dialogo-mensaje"
          onCancel={(e) => { e.preventDefault(); onResponder(false); }}
          onClick={(e) => e.target === refDialogo.current && onResponder(false)}
        >
          {pedido && (
            <>
              <div className="dialogo-cuerpo">
                <span className={`dialogo-icono${pedido.peligro ? " peligro" : ""}`} aria-hidden="true">
                  {pedido.peligro ? <IconoPapelera /> : <IconoCheck />}
                </span>
                <p id="dialogo-mensaje" className="dialogo-mensaje">{pedido.mensaje}</p>
              </div>
              <div className="dialogo-acciones">
                <button ref={refCancelar} type="button" className="boton" onClick={() => onResponder(false)}>
                  Cancelar
                </button>
                <button ref={refAceptar} type="button" className={`boton ${pedido.peligro ? "peligro-solido" : "primario"}`}
                        onClick={() => onResponder(true)}>
                  Aceptar
                </button>
              </div>
            </>
          )}
        </dialog>
      );
    }

    /** `confirmar(mensaje, { peligro })` abre el modal y devuelve una promesa con la respuesta. */
    const ConfirmacionContexto = createContext(async (mensaje) => window.confirm(mensaje));
    const useConfirmar = () => useContext(ConfirmacionContexto);

    function Avatar({ cliente }) {
      const [fondo, texto] = colorAvatar(cliente.id);
      return <span className="avatar" style={{ background: fondo, color: texto }} aria-hidden="true">{iniciales(cliente)}</span>;
    }

    // ── Maestro ────────────────────────────────────────────────────────────

    function Buscador({ valor, onCambio }) {
      return (
        <div className="buscador">
          <IconoBuscar />
          <input
            className="control"
            type="search"
            value={valor}
            onChange={(e) => onCambio(e.target.value)}
            placeholder="Buscar por cualquier campo…"
            aria-label="Buscar clientes"
            autoFocus
          />
        </div>
      );
    }

    function ItemCliente({ cliente, seleccionado, onSeleccionar }) {
      const ref = useRef(null);
      // Mantiene visible al seleccionado (por ejemplo, después de dar de alta un cliente).
      useEffect(() => {
        if (seleccionado) ref.current?.scrollIntoView({ block: "nearest" });
      }, [seleccionado]);

      return (
        <li>
          <button ref={ref} type="button" className="cliente" aria-current={seleccionado}
                  onClick={() => onSeleccionar(cliente.id)}>
            <Avatar cliente={cliente} />
            <span className="cliente-datos">
              <span className="cliente-nombre">{nombreCompleto(cliente)}</span>
              <span className="cliente-email">{cliente.email}</span>
            </span>
          </button>
        </li>
      );
    }

    function Maestro({ busqueda, onBuscar, consulta, seleccionadoId, onSeleccionar, onAgregar }) {
      const { datos: clientes, cargando, error, recargar } = consulta;

      let cuerpo;
      if (error) cuerpo = <Aviso error onReintentar={recargar}>No se pudo cargar la lista: {error.message}</Aviso>;
      else if (!clientes) cuerpo = <Aviso>Cargando clientes…</Aviso>;
      else if (clientes.length === 0) {
        cuerpo = <Aviso>{busqueda.trim() ? "Ningún cliente coincide con la búsqueda." : "Todavía no hay clientes."}</Aviso>;
      } else {
        cuerpo = (
          <ul>
            {clientes.map((c) => (
              <ItemCliente key={c.id} cliente={c} seleccionado={c.id === seleccionadoId} onSeleccionar={onSeleccionar} />
            ))}
          </ul>
        );
      }

      return (
        <aside className="panel" aria-label="Clientes">
          <div className="maestro-cabecera">
            <div className="maestro-titulo">
              <h2>Clientes</h2>
              <Boton variante="primario" icono={<IconoMas />} onClick={onAgregar}>Agregar</Boton>
            </div>
            <Buscador valor={busqueda} onCambio={onBuscar} />
            <p className="contador" aria-live="polite">
              {clientes ? `${clientes.length} cliente${clientes.length === 1 ? "" : "s"}` : " "}
              {cargando && clientes ? " · buscando…" : ""}
            </p>
          </div>
          <div className="scroll">{cuerpo}</div>
        </aside>
      );
    }

    // ── Detalle: ficha y formulario de cliente ─────────────────────────────

    function Dato({ icono, children }) {
      const vacio = !children || (Array.isArray(children) && children.every((c) => !c));
      return (
        <div className="dato">
          {icono}
          {vacio ? <span className="dato-vacio">Sin datos</span> : <span>{children}</span>}
        </div>
      );
    }

    function FichaCliente({ cliente, ocupado, onEditar, onEliminar }) {
      return (
        <header className="ficha">
          <span className="ficha-id" title="Identificador del cliente">#{cliente.id}</span>
          <div className="ficha-cabecera">
            <h2>{nombreCompleto(cliente)}</h2>
            <div className="ficha-acciones">
              <Boton icono={<IconoLapiz />} onClick={onEditar} disabled={ocupado}>Editar</Boton>
              <Boton variante="peligro" icono={<IconoPapelera />} onClick={onEliminar} disabled={ocupado}>Eliminar</Boton>
            </div>
          </div>
          <div className="ficha-datos">
            <div className="ficha-contacto">
              <Dato icono={<IconoEmail />}>{cliente.email}</Dato>
              <Dato icono={<IconoTelefono />}>{cliente.telefono}</Dato>
            </div>
            <Dato icono={<IconoUbicacion />}>
              {cliente.domicilio}
              {cliente.domicilio && cliente.localidad && <br />}
              {cliente.localidad}
            </Dato>
          </div>
        </header>
      );
    }

    // Tres filas de dos campos: nombre/apellido, email/teléfono, domicilio/localidad.
    const FILAS_CLIENTE = [
      [
        { campo: "nombre", etiqueta: "Nombre", requerido: true, autoComplete: "given-name" },
        { campo: "apellido", etiqueta: "Apellido", requerido: true, autoComplete: "family-name" },
      ],
      [
        { campo: "email", etiqueta: "Email", tipo: "email", requerido: true, autoComplete: "email" },
        { campo: "telefono", etiqueta: "Teléfono", tipo: "tel", autoComplete: "tel" },
      ],
      [
        { campo: "domicilio", etiqueta: "Domicilio", autoComplete: "street-address" },
        { campo: "localidad", etiqueta: "Localidad", autoComplete: "address-level2" },
      ],
    ];
    const CAMPOS_CLIENTE = FILAS_CLIENTE.flat().map((f) => f.campo);

    const valoresIniciales = (cliente) =>
      Object.fromEntries(CAMPOS_CLIENTE.map((campo) => [campo, cliente?.[campo] ?? ""]));

    /** Alta (sin cliente) o edición. `onGuardar` debe lanzar el error de la API para mostrarlo aquí. */
    function FormCliente({ cliente, onGuardar, onCancelar }) {
      const [valores, setValores] = useState(() => valoresIniciales(cliente));
      const [guardando, setGuardando] = useState(false);
      const [error, setError] = useState(null);
      const prefijoId = useId();

      const cambiar = (campo) => (e) => setValores((v) => ({ ...v, [campo]: e.target.value }));

      async function enviar(e) {
        e.preventDefault();
        setGuardando(true);
        setError(null);
        try {
          await onGuardar(valores); // al tener éxito, el padre cierra el formulario
        } catch (err) {
          setError(err);
          setGuardando(false);
        }
      }

      return (
        <form className="formulario-cliente" onSubmit={enviar} onKeyDown={(e) => e.key === "Escape" && onCancelar()}>
          <h2>{cliente ? "Editar cliente" : "Nuevo cliente"}</h2>
          {FILAS_CLIENTE.map((fila, i) => (
            <div className="fila" key={i}>
              {fila.map(({ campo, etiqueta, tipo = "text", requerido, autoComplete }, j) => (
                <div className="campo" key={campo}>
                  <label htmlFor={`${prefijoId}-${campo}`}>
                    {etiqueta}{requerido && <abbr title="obligatorio"> *</abbr>}
                  </label>
                  <input
                    id={`${prefijoId}-${campo}`}
                    className="control"
                    type={tipo}
                    value={valores[campo]}
                    onChange={cambiar(campo)}
                    required={requerido}
                    autoComplete={autoComplete}
                    autoFocus={i === 0 && j === 0}
                    aria-invalid={error?.campo === campo}
                    disabled={guardando}
                  />
                </div>
              ))}
            </div>
          ))}
          {error && <p className="error-formulario" role="alert">{error.message}</p>}
          <div className="formulario-acciones">
            <Boton icono={<IconoCerrar />} onClick={onCancelar} disabled={guardando}>Cancelar</Boton>
            <button type="submit" className="boton primario" disabled={guardando}>
              <IconoGuardar /><span>{guardando ? "Guardando…" : "Guardar"}</span>
            </button>
          </div>
        </form>
      );
    }

    // ── Detalle: actividades ───────────────────────────────────────────────

    /**
     * Subformulario de una sola línea, sin etiquetas visibles. Sirve para el alta y para editar
     * una actividad pendiente (`editando`). `onGuardar` lanza el error de la API para mostrarlo aquí.
     */
    function FormActividad({ editando, onGuardar, onCancelar }) {
      const [descripcion, setDescripcion] = useState("");
      const [fecha, setFecha] = useState("");
      const [guardando, setGuardando] = useState(false);
      const [error, setError] = useState(null);
      const refDescripcion = useRef(null);

      // Al elegir una actividad para editar se cargan sus datos; al terminar, se limpia.
      useEffect(() => {
        setDescripcion(editando?.descripcion ?? "");
        setFecha(editando?.fechaCompromiso ?? "");
        setError(null);
        if (editando) refDescripcion.current?.focus();
      }, [editando]);

      const vacio = !descripcion.trim() && !fecha;

      function cancelar() {
        setDescripcion("");
        setFecha("");
        setError(null);
        onCancelar();
      }

      async function enviar(e) {
        e.preventDefault();
        setGuardando(true);
        setError(null);
        try {
          await onGuardar({ descripcion, fechaCompromiso: fecha || null });
          setDescripcion("");
          setFecha("");
        } catch (err) {
          setError(err);
        } finally {
          setGuardando(false);
        }
      }

      return (
        <form className={`subformulario${editando ? " editando" : ""}`} onSubmit={enviar}
              onKeyDown={(e) => e.key === "Escape" && cancelar()}
              aria-label={editando ? "Editar actividad" : "Agregar actividad"}>
          <div className="subformulario-linea">
            <input
              ref={refDescripcion}
              className="control descripcion"
              value={descripcion}
              onChange={(e) => setDescripcion(e.target.value)}
              placeholder={editando ? "Descripción de la actividad" : "Nueva actividad…"}
              aria-label="Descripción de la actividad"
              aria-invalid={error?.campo === "descripcion"}
              maxLength={500}
              required
              disabled={guardando}
            />
            <input
              className="control fecha"
              type="date"
              value={fecha}
              onChange={(e) => setFecha(e.target.value)}
              aria-label="Fecha de compromiso (opcional)"
              title="Fecha de compromiso (opcional)"
              aria-invalid={error?.campo === "fechaCompromiso"}
              disabled={guardando}
            />
            <BotonIcono type="submit" variante="primario" icono={<IconoGuardar />}
                        titulo={editando ? "Guardar cambios" : "Agregar actividad"}
                        disabled={guardando || !descripcion.trim()} />
            <BotonIcono icono={<IconoCerrar />} titulo={editando ? "Cancelar edición" : "Limpiar"}
                        onClick={cancelar} disabled={guardando || (!editando && vacio)} />
          </div>
          {error && <p className="error-formulario" role="alert">{error.message}</p>}
        </form>
      );
    }

    function textoFecha({ completada, fechaCompromiso, fechaFinalizacion, vencida }) {
      if (completada) return `Completada el ${formatearFecha(fechaFinalizacion)}`;
      if (!fechaCompromiso) return "Sin fecha";
      return `${formatearFecha(fechaCompromiso)}${vencida ? " · Vencida" : ""}`;
    }

    /** Fila de actividad. Las completadas no tienen acciones: son inalterables. */
    function ItemActividad({ actividad, editando, ocupado, onCompletar, onEditar, onEliminar }) {
      const { descripcion, completada, vencida } = actividad;
      return (
        <li className={`actividad${editando ? " editando" : ""}`}>
          {completada ? (
            <span className="marca hecha" role="img" aria-label="Completada"><IconoCheck /></span>
          ) : (
            <button type="button" className="marca" onClick={onCompletar} disabled={ocupado}
                    title="Marcar como completada" aria-label={`Marcar como completada: ${descripcion}`}>
              <IconoCheck />
            </button>
          )}
          <div className="actividad-texto">
            <p className="actividad-descripcion">{descripcion}</p>
            <p className={`actividad-fecha${vencida ? " vencida" : ""}`}>{textoFecha(actividad)}</p>
          </div>
          {!completada && (
            <div className="actividad-acciones">
              <BotonIcono titulo="Editar actividad" icono={<IconoLapiz />} onClick={onEditar} disabled={ocupado} />
              <BotonIcono titulo="Eliminar actividad" variante="peligro" icono={<IconoPapelera />}
                          onClick={onEliminar} disabled={ocupado} />
            </div>
          )}
        </li>
      );
    }

    function ListaActividades({ titulo, actividades, vacio, completadas, children }) {
      return (
        <section>
          <h3>{titulo} <small>({actividades.length})</small></h3>
          <ul className={`lista-actividades${completadas ? " completadas" : ""}`}>
            {actividades.length ? children : <li><Aviso>{vacio}</Aviso></li>}
          </ul>
        </section>
      );
    }

    // ── Detalle ────────────────────────────────────────────────────────────

    function PanelDetalle({ children, cargando }) {
      return <main className="panel" aria-label="Detalle del cliente" aria-busy={cargando}>{children}</main>;
    }

    function DetalleNuevo({ onCreado, onCancelar }) {
      const api = useApi();
      async function guardar(datos) {
        onCreado(await api.crearCliente(datos));
      }
      return (
        <PanelDetalle>
          <div className="scroll detalle-formulario">
            <FormCliente onGuardar={guardar} onCancelar={onCancelar} />
          </div>
        </PanelDetalle>
      );
    }

    /** Ficha del cliente (o su formulario de edición), subformulario y listas de actividades. */
    function Detalle({ clienteId, onGuardado, onEliminado }) {
      const api = useApi();
      const confirmar = useConfirmar();
      const consulta = useConsulta((signal) => api.obtenerCliente(clienteId, signal), [clienteId, api]);
      const { datos: cliente, error, recargar } = consulta;

      const [editandoCliente, setEditandoCliente] = useState(false);
      const [actividadEditada, setActividadEditada] = useState(null);
      const [ocupado, setOcupado] = useState(false);
      const [mensaje, setMensaje] = useState(null);

      const [compromisos, completadas] = useMemo(() => {
        const lista = cliente?.actividades ?? [];
        // Completadas: la API ya las entrega de la más reciente a la más antigua.
        return [ordenarCompromisos(lista.filter((a) => !a.completada)), lista.filter((a) => a.completada)];
      }, [cliente]);

      /** Acciones de un clic: bloquea los botones mientras corre y muestra el error en el banner. */
      async function ejecutar(accion) {
        setOcupado(true);
        setMensaje(null);
        try {
          await accion();
        } catch (err) {
          setMensaje(err.message);
          recargar(); // el estado pudo cambiar en el servidor (por ejemplo, otra pestaña)
        } finally {
          setOcupado(false);
        }
      }

      async function guardarCliente(datos) {
        const actualizado = await api.actualizarCliente(clienteId, datos);
        setEditandoCliente(false);
        recargar();
        onGuardado(actualizado);
      }

      async function eliminarCliente() {
        const cantidad = cliente.actividades.length;
        const detalle = cantidad ? ` y sus ${cantidad} actividad${cantidad === 1 ? "" : "es"}` : "";
        const mensaje = `¿Eliminar a ${nombreCompleto(cliente)}${detalle}? Esta acción no se puede deshacer.`;
        if (!(await confirmar(mensaje, { peligro: true }))) return;
        ejecutar(async () => {
          await api.eliminarCliente(clienteId);
          onEliminado(clienteId);
        });
      }

      async function guardarActividad(datos) {
        if (actividadEditada) await api.actualizarActividad(clienteId, actividadEditada.id, datos);
        else await api.crearActividad(clienteId, datos);
        setActividadEditada(null);
        recargar();
      }

      async function completarActividad(actividad) {
        const mensaje = `¿Marcar "${actividad.descripcion}" como completada? Después no podrá editarse ni borrarse.`;
        if (!(await confirmar(mensaje))) return;
        ejecutar(async () => {
          await api.completarActividad(clienteId, actividad.id);
          if (actividadEditada?.id === actividad.id) setActividadEditada(null);
          recargar();
        });
      }

      async function eliminarActividad(actividad) {
        if (!(await confirmar(`¿Eliminar la actividad "${actividad.descripcion}"?`, { peligro: true }))) return;
        ejecutar(async () => {
          await api.eliminarActividad(clienteId, actividad.id);
          if (actividadEditada?.id === actividad.id) setActividadEditada(null);
          recargar();
        });
      }

      if (error && !cliente) {
        return (
          <PanelDetalle>
            <div className="detalle-vacio">
              <Aviso error onReintentar={recargar}>No se pudo cargar el cliente: {error.message}</Aviso>
            </div>
          </PanelDetalle>
        );
      }
      if (!cliente) {
        return <PanelDetalle cargando><div className="detalle-vacio"><Aviso>Cargando ficha…</Aviso></div></PanelDetalle>;
      }

      if (editandoCliente) {
        return (
          <PanelDetalle>
            <div className="scroll detalle-formulario">
              <span className="ficha-id">#{cliente.id}</span>
              <FormCliente cliente={cliente} onGuardar={guardarCliente} onCancelar={() => setEditandoCliente(false)} />
            </div>
          </PanelDetalle>
        );
      }

      return (
        <PanelDetalle cargando={consulta.cargando}>
          <FichaCliente cliente={cliente} ocupado={ocupado}
                        onEditar={() => setEditandoCliente(true)} onEliminar={eliminarCliente} />
          <FormActividad editando={actividadEditada} onGuardar={guardarActividad}
                         onCancelar={() => setActividadEditada(null)} />
          <div className="scroll actividades">
            <Banner mensaje={mensaje} onCerrar={() => setMensaje(null)} />
            <ListaActividades titulo="Compromisos" actividades={compromisos} vacio="No hay actividades pendientes.">
              {compromisos.map((a) => (
                <ItemActividad
                  key={a.id}
                  actividad={a}
                  editando={actividadEditada?.id === a.id}
                  ocupado={ocupado}
                  onCompletar={() => completarActividad(a)}
                  onEditar={() => setActividadEditada(a)}
                  onEliminar={() => eliminarActividad(a)}
                />
              ))}
            </ListaActividades>
            <ListaActividades titulo="Actividades completadas" actividades={completadas}
                              vacio="Aún no hay actividades completadas." completadas>
              {completadas.map((a) => <ItemActividad key={a.id} actividad={a} />)}
            </ListaActividades>
          </div>
        </PanelDetalle>
      );
    }

    // ── Aplicación ─────────────────────────────────────────────────────────

    /** Selector de la conexión: el resto de la app no sabe si habla con REST o con MCP. */
    function SelectorConexion({ valor, onCambio }) {
      return (
        <div className="selector-conexion" role="radiogroup" aria-label="Conexión con el servidor">
          <span className="selector-titulo">Conexión</span>
          {Object.entries(CONEXIONES).map(([clave, { etiqueta, descripcion }]) => (
            <button key={clave} type="button" role="radio" aria-checked={valor === clave}
                    title={descripcion} onClick={() => onCambio(clave)}>
              {etiqueta}
            </button>
          ))}
        </div>
      );
    }

    function App() {
      const [conexion, setConexion] = useState(leerConexion);
      const api = CONEXIONES[conexion].api;

      const [busqueda, setBusqueda] = useState("");
      const [seleccionadoId, setSeleccionadoId] = useState(null);
      const [creando, setCreando] = useState(false);
      const busquedaDemorada = useDemorado(busqueda, 250);

      // Al cambiar de conexión, la lista y el detalle se vuelven a pedir por el nuevo canal.
      const consultaClientes = useConsulta(
        (signal) => api.listarClientes(busquedaDemorada.trim(), signal),
        [busquedaDemorada, api],
      );

      function cambiarConexion(nueva) {
        setConexion(nueva);
        guardarConexion(nueva);
      }

      // Un único modal de confirmación para toda la app; `confirmar` se reparte por contexto.
      const [pedidoConfirmacion, setPedidoConfirmacion] = useState(null);
      const confirmar = useCallback(
        (mensaje, { peligro = false } = {}) =>
          new Promise((resolver) => setPedidoConfirmacion({ mensaje, peligro, resolver })),
        [],
      );
      function responderConfirmacion(aceptado) {
        pedidoConfirmacion?.resolver(aceptado);
        setPedidoConfirmacion(null);
      }
      const clientes = consultaClientes.datos;
      const recargarClientes = consultaClientes.recargar;

      // Solo en la primera carga se selecciona el primer cliente, para no mostrar el detalle vacío.
      const autoseleccionado = useRef(false);
      useEffect(() => {
        if (autoseleccionado.current || !clientes) return;
        autoseleccionado.current = true;
        if (clientes.length) setSeleccionadoId((actual) => actual ?? clientes[0].id);
      }, [clientes]);

      function seleccionar(id) {
        setCreando(false);
        setSeleccionadoId(id);
      }

      function alCrear(cliente) {
        setCreando(false);
        setSeleccionadoId(cliente.id);
        recargarClientes();
      }

      /** Tras eliminar, se pasa al cliente vecino de la lista para no dejar el detalle vacío. */
      function alEliminar(id) {
        const lista = clientes ?? [];
        const i = lista.findIndex((c) => c.id === id);
        const vecino = i === -1 ? null : (lista[i + 1] ?? lista[i - 1] ?? null);
        setSeleccionadoId(vecino?.id ?? null);
        recargarClientes();
      }

      let detalle;
      if (creando) detalle = <DetalleNuevo onCreado={alCrear} onCancelar={() => setCreando(false)} />;
      else if (seleccionadoId == null) {
        detalle = (
          <PanelDetalle>
            <div className="detalle-vacio"><Aviso>Seleccione un cliente o agregue uno nuevo.</Aviso></div>
          </PanelDetalle>
        );
      } else {
        // key: al cambiar de cliente o de conexión se reinicia el estado interno (formularios, edición en curso).
        detalle = (
          <Detalle key={`${conexion}:${seleccionadoId}`} clienteId={seleccionadoId}
                   onGuardado={recargarClientes} onEliminado={alEliminar} />
        );
      }

      return (
        <ApiContexto.Provider value={api}>
        <ConfirmacionContexto.Provider value={confirmar}>
        <div className="app">
          <header className="barra">
            <h1>MiniCRM</h1>
            <SelectorConexion valor={conexion} onCambio={cambiarConexion} />
          </header>
          <div className="contenido">
            <Maestro
              busqueda={busqueda}
              onBuscar={setBusqueda}
              consulta={consultaClientes}
              seleccionadoId={creando ? null : seleccionadoId}
              onSeleccionar={seleccionar}
              onAgregar={() => setCreando(true)}
            />
            {detalle}
          </div>
          <DialogoConfirmacion pedido={pedidoConfirmacion} onResponder={responderConfirmacion} />
        </div>
        </ConfirmacionContexto.Provider>
        </ApiContexto.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
  </script>
</body>
</html>
