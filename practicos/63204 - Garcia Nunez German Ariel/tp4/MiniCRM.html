<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCRM</title>

  <!-- Bibliotecas de React y Babel desde CDN con versiones fijas -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <style>
    /* Variables de colores basadas en minicrm.jpg */
    :root {
      --azul: #2563eb;
      --azul-oscuro: #1e385b;
      --fondo: #eef2f6;
      --blanco: #ffffff;
      --texto: #1e293b;
      --gris: #64748b;
      --borde: #dce4ec;
      --rojo: #dc2626;
      --verde: #16a34a;
      --activo: #eaf2fd;
    }

    /* Reseteo general y layout fijo sin scroll de pantalla */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: var(--fondo); color: var(--texto); }
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* Barra superior */
    .topbar { height: 56px; background: var(--azul-oscuro); display: flex; align-items: center; padding: 0 24px; color: var(--blanco); font-size: 22px; font-weight: 700; flex-shrink: 0; }

    /* Paneles Maestro y Detalle */
    .workspace { flex: 1; display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; min-height: 0; }
    .panel { background: var(--blanco); border: 1px solid var(--borde); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

    /* Botones */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid var(--borde); background: var(--blanco); color: var(--texto); }
    .btn:hover { background: #f8fafc; }
    .btn-azul { background: var(--azul); color: var(--blanco); border-color: var(--azul); font-weight: 600; }
    .btn-azul:hover { background: #1d4ed8; }
    .btn-rojo { color: var(--rojo); border-color: #fca5a5; }
    .btn-rojo:hover { background: #fef2f2; }

    /* Panel Maestro (Izquierda) */
    .maestro-header { padding: 16px 16px 12px; }
    .maestro-titulo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 22px; font-weight: 700; }
    .buscador-box { position: relative; display: flex; align-items: center; }
    .buscador-box span { position: absolute; left: 10px; color: var(--gris); font-size: 14px; pointer-events: none; }
    .buscador-box input { width: 100%; height: 36px; padding-left: 32px; padding-right: 10px; border: 1px solid var(--borde); border-radius: 6px; font-size: 14px; outline: none; }
    .buscador-box input:focus { border-color: var(--azul); }

    /* Lista de Clientes con scroll interno */
    .lista-clientes { flex: 1; overflow-y: auto; border-top: 1px solid #f1f5f9; }
    .cliente-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; border-left: 3px solid transparent; }
    .cliente-item:hover { background: #f8fafc; }
    .cliente-item.activo { background: var(--activo); border-left-color: var(--azul); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .cliente-item h4 { font-size: 15px; font-weight: 600; }
    .cliente-item p { font-size: 13px; color: var(--gris); }

    /* Panel Detalle (Derecha) */
    .detalle-scroll { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .detalle-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .detalle-header h2 { font-size: 26px; font-weight: 700; }
    .detalle-header-der { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .detalle-id { font-size: 14px; color: #94a3b8; }
    .detalle-botones { display: flex; gap: 8px; }

    /* Datos del cliente (2 columnas) */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; padding-bottom: 16px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #334155; }
    .info-fila { display: flex; align-items: center; gap: 8px; }

    /* Subformulario de actividades */
    .subform { border: 1px dashed #cbd5e1; border-radius: 8px; padding: 14px 16px; margin: 18px 0 20px; background: #fff; }
    .subform h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .subform-fila { display: flex; gap: 8px; }
    .subform-fila input[type="text"] { flex: 1; height: 36px; padding: 0 10px; border: 1px solid var(--borde); border-radius: 6px; font-size: 14px; outline: none; }
    .subform-fila input[type="date"] { width: 160px; height: 36px; padding: 0 8px; border: 1px solid var(--borde); border-radius: 6px; font-size: 14px; outline: none; color: #334155; }

    /* Listas de actividades */
    .seccion-act { margin-bottom: 20px; }
    .seccion-act h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .act-caja { border: 1px solid var(--borde); border-radius: 8px; max-height: 200px; overflow-y: auto; background: #fff; }
    .act-fila { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #f1f5f9; }
    .act-fila:last-child { border-bottom: none; }
    .act-check { width: 18px; height: 18px; border: 2px solid #94a3b8; border-radius: 4px; cursor: pointer; display: grid; place-items: center; background: #fff; flex-shrink: 0; }
    .act-check.ok { background: var(--verde); border-color: var(--verde); color: #fff; font-size: 12px; cursor: default; }
    .act-info { flex: 1; min-width: 0; }
    .act-desc { font-size: 14px; font-weight: 600; }
    .act-desc.tachada { font-weight: 500; color: #334155; }
    .act-meta { font-size: 12px; color: var(--gris); margin-top: 2px; }
    .act-meta.vencida { color: var(--rojo); font-weight: 600; }
    .btn-ico { width: 30px; height: 30px; border: 1px solid var(--borde); border-radius: 6px; background: #fff; cursor: pointer; display: grid; place-items: center; font-size: 13px; }
    .btn-ico:hover { background: #f8fafc; }
    .btn-ico.del:hover { background: #fef2f2; color: var(--rojo); border-color: #fca5a5; }

    /* Formulario para agregar / editar cliente */
    .form-cliente { max-width: 520px; display: flex; flex-direction: column; gap: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-full { grid-column: span 2; }
    .campo label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .campo input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--borde); border-radius: 6px; font-size: 14px; outline: none; }
    .campo input:focus { border-color: var(--azul); }
    .form-btns { display: flex; gap: 8px; margin-top: 8px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body>
  <!-- Elemento raíz donde React inyecta la aplicación -->
  <div id="root"></div>

  <!-- Script con Babel para procesar JSX en el navegador -->
  <script type="text/babel">
    // Desestructuramos los hooks principales de React
    const { useState, useEffect, useMemo } = React;

    // Colores pastel para identificar visualmente a los clientes
    const PALETA = [
      { fondo: "#dbeafe", texto: "#1d4ed8" }, // Azul
      { fondo: "#dcfce7", texto: "#15803d" }, // Verde
      { fondo: "#ede9fe", texto: "#6d28d9" }, // Violeta
      { fondo: "#ffedd5", texto: "#c2410c" }, // Naranja
      { fondo: "#fce7f3", texto: "#be185d" }, // Rosa
      { fondo: "#cffafe", texto: "#0e7490" }  // Cian
    ];

    // Obtener iniciales en mayúscula del cliente (ej: "Ana García" -> "AG")
    function getIniciales(nombre = "", apellido = "") {
      const n = nombre.trim().charAt(0).toUpperCase();
      const a = apellido.trim().charAt(0).toUpperCase();
      return (n + a) || "C";
    }

    // Seleccionar color de avatar de forma determinista
    function getColor(nombre = "", apellido = "") {
      const suma = (nombre.charCodeAt(0) || 0) + (apellido.charCodeAt(0) || 0);
      return PALETA[suma % PALETA.length];
    }

    // Formatear fecha en formato legible "16 oct 2026"
    function formatearFecha(iso) {
      if (!iso) return "Sin fecha";
      const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
      const [y, m, d] = iso.split("-");
      if (!y || !m || !d) return iso;
      return `${parseInt(d, 10)} ${meses[parseInt(m, 10) - 1]} ${y}`;
    }

    // Verificar si una fecha ya venció
    function estaVencida(iso) {
      if (!iso) return false;
      const hoy = new Date().toISOString().split("T")[0];
      return iso < hoy;
    }

    // Datos iniciales de demostración (idénticos a minicrm.jpg para funcionamiento offline)
    const DATOS_SEMILLA = [
      {
        id: 123,
        nombre: "Ana",
        apellido: "García",
        email: "ana.garcia@example.com",
        telefono: "381 555 0123",
        domicilio: "San Martín 450",
        localidad: "Yerba Buena",
        actividades: [
          { id: 1, clienteId: 123, descripcion: "Consultar nuevas necesidades", fechaCompromiso: null, fechaFinalizacion: null },
          { id: 2, clienteId: 123, descripcion: "Enviar presupuesto", fechaCompromiso: "2026-10-16", fechaFinalizacion: null },
          { id: 3, clienteId: 123, descripcion: "Llamar para seguimiento", fechaCompromiso: "2026-10-22", fechaFinalizacion: null },
          { id: 4, clienteId: 123, descripcion: "Enviar presentación", fechaCompromiso: "2026-10-15", fechaFinalizacion: "2026-10-15" },
          { id: 5, clienteId: 123, descripcion: "Primera reunión", fechaCompromiso: "2026-10-12", fechaFinalizacion: "2026-10-12" }
        ]
      },
      { id: 124, nombre: "Bruno", apellido: "López", email: "bruno.lopez@example.com", telefono: "381 555 0456", domicilio: "Av. Aconquija 1200", localidad: "Yerba Buena", actividades: [] },
      { id: 125, nombre: "Carla", apellido: "Pérez", email: "carla.perez@example.com", telefono: "381 555 0789", domicilio: "25 de Mayo 320", localidad: "San Miguel de Tucumán", actividades: [] },
      { id: 126, nombre: "Diego", apellido: "Ruiz", email: "diego.ruiz@example.com", telefono: "381 555 0112", domicilio: "Crisóstomo Álvarez 650", localidad: "San Miguel de Tucumán", actividades: [] },
      { id: 127, nombre: "Elena", apellido: "Torres", email: "elena.torres@example.com", telefono: "381 555 0334", domicilio: "Av. Mate de Luna 2800", localidad: "San Miguel de Tucumán", actividades: [] },
      { id: 128, nombre: "Federico", apellido: "Díaz", email: "federico.diaz@example.com", telefono: "381 555 0556", domicilio: "Laprida 150", localidad: "San Miguel de Tucumán", actividades: [] },
      { id: 129, nombre: "Gabriela", apellido: "Sosa", email: "gabriela.sosa@example.com", telefono: "381 555 0778", domicilio: "Las Heras 420", localidad: "Yerba Buena", actividades: [] }
    ];

    // Capa de API que interactúa con Express y tiene respaldo en localStorage
    const api = {
      leerLocal() {
        const val = localStorage.getItem("crm_data");
        if (!val) {
          localStorage.setItem("crm_data", JSON.stringify(DATOS_SEMILLA));
          return DATOS_SEMILLA;
        }
        return JSON.parse(val);
      },
      guardarLocal(arr) {
        localStorage.setItem("crm_data", JSON.stringify(arr));
      },

      async getClientes(filtro = "") {
        try {
          const res = await fetch(`/api/clientes?q=${encodeURIComponent(filtro)}`);
          if (!res.ok) throw new Error();
          return await res.json();
        } catch {
          const datos = this.leerLocal();
          if (!filtro.trim()) return datos;
          const q = filtro.toLowerCase();
          return datos.filter(c =>
            `${c.nombre} ${c.apellido}`.toLowerCase().includes(q) ||
            (c.email || "").toLowerCase().includes(q) ||
            (c.telefono || "").toLowerCase().includes(q) ||
            (c.domicilio || "").toLowerCase().includes(q) ||
            (c.localidad || "").toLowerCase().includes(q) ||
            String(c.id).includes(q)
          );
        }
      },

      async getCliente(id) {
        try {
          const res = await fetch(`/api/clientes/${id}`);
          if (!res.ok) throw new Error();
          return await res.json();
        } catch {
          return this.leerLocal().find(c => c.id === id) || null;
        }
      },

      async guardarCliente(datos, id = null) {
        try {
          const url = id ? `/api/clientes/${id}` : "/api/clientes";
          const method = id ? "PUT" : "POST";
          const res = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || "Error al guardar");
          }
          return await res.json();
        } catch (e) {
          if (e.message && e.message !== "Failed to fetch") throw e;
          const arr = this.leerLocal();
          if (id) {
            const idx = arr.findIndex(c => c.id === id);
            arr[idx] = { ...arr[idx], ...datos };
            this.guardarLocal(arr);
            return arr[idx];
          } else {
            const nuevo = { ...datos, id: Date.now(), actividades: [] };
            arr.push(nuevo);
            this.guardarLocal(arr);
            return nuevo;
          }
        }
      },

      async eliminarCliente(id) {
        try {
          await fetch(`/api/clientes/${id}`, { method: "DELETE" });
        } catch {}
        const filtrado = this.leerLocal().filter(c => c.id !== id);
        this.guardarLocal(filtrado);
      },

      async guardarActividad(clienteId, act, actId = null) {
        try {
          const url = actId ? `/api/actividades/${actId}` : `/api/clientes/${clienteId}/actividades`;
          const method = actId ? "PUT" : "POST";
          const res = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(act)
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || "Error al guardar actividad");
          }
          return await res.json();
        } catch (e) {
          if (e.message && e.message !== "Failed to fetch") throw e;
          const arr = this.leerLocal();
          const cliente = arr.find(c => c.id === clienteId);
          if (cliente) {
            cliente.actividades = cliente.actividades || [];
            if (actId) {
              const item = cliente.actividades.find(a => a.id === actId);
              if (item) Object.assign(item, act);
            } else {
              cliente.actividades.push({ id: Date.now(), clienteId, ...act, fechaFinalizacion: null });
            }
            this.guardarLocal(arr);
          }
        }
      },

      async completarActividad(actId) {
        try {
          await fetch(`/api/actividades/${actId}/completar`, { method: "POST" });
        } catch {}
        const arr = this.leerLocal();
        const hoy = new Date().toISOString().split("T")[0];
        arr.forEach(c => {
          const a = (c.actividades || []).find(x => x.id === actId);
          if (a) a.fechaFinalizacion = hoy;
        });
        this.guardarLocal(arr);
      },

      async eliminarActividad(actId) {
        try {
          const res = await fetch(`/api/actividades/${actId}`, { method: "DELETE" });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || "Error al borrar");
          }
        } catch (e) {
          if (e.message && e.message !== "Failed to fetch") throw e;
        }
        const arr = this.leerLocal();
        arr.forEach(c => {
          c.actividades = (c.actividades || []).filter(x => x.id !== actId);
        });
        this.guardarLocal(arr);
      }
    };

    // Componente Principal MiniCRM
    function MiniCRM() {
      // Estados de clientes y búsqueda
      const [clientes, setClientes] = useState([]);
      const [filtro, setFiltro] = useState("");
      const [seleccionadoId, setSeleccionadoId] = useState(null);
      const [clienteActivo, setClienteActivo] = useState(null);

      // Estado para formulario de cliente: null | 'nuevo' | 'editar'
      const [vistaForm, setVistaForm] = useState(null);

      // Estado del subformulario de actividades
      const [subform, setSubform] = useState({ id: null, desc: "", fecha: "" });

      // Cargar lista de clientes
      const cargarLista = async (q = filtro, mantener = true) => {
        const datos = await api.getClientes(q);
        setClientes(datos);
        if (!mantener && datos.length > 0) {
          setSeleccionadoId(datos[0].id);
        } else if (mantener && seleccionadoId) {
          if (!datos.some(c => c.id === seleccionadoId) && datos.length > 0) {
            setSeleccionadoId(datos[0].id);
          }
        } else if (!seleccionadoId && datos.length > 0) {
          setSeleccionadoId(datos[0].id);
        }
      };

      // Cargar cliente activo con sus actividades
      const cargarDetalle = async (id) => {
        if (!id) return setClienteActivo(null);
        const data = await api.getCliente(id);
        setClienteActivo(data);
      };

      // Carga inicial
      useEffect(() => { cargarLista("", false); }, []);

      // Al cambiar el ID seleccionado, recargar ficha
      useEffect(() => { if (seleccionadoId) cargarDetalle(seleccionadoId); }, [seleccionadoId]);

      // Búsqueda en vivo
      const handleBuscar = (e) => {
        const val = e.target.value;
        setFiltro(val);
        cargarLista(val, true);
      };

      // Separar compromisos de actividades completadas
      const { compromisos, completadas } = useMemo(() => {
        const comp = [];
        const done = [];
        (clienteActivo?.actividades || []).forEach(a => {
          if (a.fechaFinalizacion) done.push(a);
          else comp.push(a);
        });
        return { compromisos: comp, completadas: done };
      }, [clienteActivo]);

      // Guardar Cliente (Nuevo o Editado)
      const handleGuardarCliente = async (datos) => {
        try {
          const res = await api.guardarCliente(datos, vistaForm === "editar" ? seleccionadoId : null);
          setVistaForm(null);
          await cargarLista(filtro);
          setSeleccionadoId(res.id);
        } catch (e) {
          alert(e.message || "Error al guardar");
        }
      };

      // Eliminar Cliente
      const handleEliminarCliente = async () => {
        if (!clienteActivo) return;
        if (confirm(`¿Eliminar al cliente ${clienteActivo.nombre} ${clienteActivo.apellido}?`)) {
          await api.eliminarCliente(clienteActivo.id);
          setClienteActivo(null);
          setSeleccionadoId(null);
          await cargarLista(filtro, false);
        }
      };

      // Guardar Actividad
      const handleGuardarActividad = async (e) => {
        e.preventDefault();
        if (!subform.desc.trim()) return alert("La descripción es obligatoria");
        try {
          await api.guardarActividad(
            clienteActivo.id,
            { descripcion: subform.desc.trim(), fechaCompromiso: subform.fecha || null },
            subform.id
          );
          setSubform({ id: null, desc: "", fecha: "" });
          await cargarDetalle(clienteActivo.id);
        } catch (err) {
          alert(err.message || "Error");
        }
      };

      // Completar Actividad
      const handleCompletarActividad = async (id) => {
        await api.completarActividad(id);
        await cargarDetalle(clienteActivo.id);
      };

      // Eliminar Actividad
      const handleEliminarActividad = async (act) => {
        if (confirm(`¿Eliminar "${act.descripcion}"?`)) {
          try {
            await api.eliminarActividad(act.id);
            await cargarDetalle(clienteActivo.id);
          } catch (e) {
            alert(e.message);
          }
        }
      };

      return (
        <div className="app">
          {/* Barra Superior */}
          <div className="topbar">MiniCRM</div>

          {/* Área de Trabajo */}
          <div className="workspace">
            {/* Panel Izquierdo: Lista de Clientes */}
            <div className="panel">
              <div className="maestro-header">
                <div className="maestro-titulo">
                  <span>Clientes</span>
                  <button className="btn btn-azul" onClick={() => setVistaForm("nuevo")}>+ Agregar</button>
                </div>
                <div className="buscador-box">
                  <span>🔍</span>
                  <input
                    type="text"
                    placeholder="Buscar por cualquier campo..."
                    value={filtro}
                    onChange={handleBuscar}
                  />
                </div>
              </div>

              {/* Lista Scrollable */}
              <div className="lista-clientes">
                {clientes.map(c => {
                  const paleta = getColor(c.nombre, c.apellido);
                  const activo = c.id === seleccionadoId && !vistaForm;
                  return (
                    <div
                      key={c.id}
                      className={`cliente-item ${activo ? "activo" : ""}`}
                      onClick={() => { setSeleccionadoId(c.id); setVistaForm(null); }}
                    >
                      <div className="avatar" style={{ background: paleta.fondo, color: paleta.texto }}>
                        {getIniciales(c.nombre, c.apellido)}
                      </div>
                      <div>
                        <h4>{c.nombre} {c.apellido}</h4>
                        <p>{c.email}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Panel Derecho: Detalle o Formulario */}
            <div className="panel">
              <div className="detalle-scroll">
                {vistaForm ? (
                  <FormCliente
                    modo={vistaForm}
                    inicial={vistaForm === "editar" ? clienteActivo : null}
                    onGuardar={handleGuardarCliente}
                    onCancelar={() => setVistaForm(null)}
                  />
                ) : clienteActivo ? (
                  <div>
                    {/* Encabezado del Detalle */}
                    <div className="detalle-header">
                      <h2>{clienteActivo.nombre} {clienteActivo.apellido}</h2>
                      <div className="detalle-header-der">
                        <span className="detalle-id">#{clienteActivo.id}</span>
                        <div className="detalle-botones">
                          <button className="btn" onClick={() => setVistaForm("editar")}>✏️ Editar</button>
                          <button className="btn btn-rojo" onClick={handleEliminarCliente}>🗑️ Eliminar</button>
                        </div>
                      </div>
                    </div>

                    {/* Datos del Cliente */}
                    <div className="info-grid">
                      <div className="info-fila">✉️ {clienteActivo.email}</div>
                      <div className="info-fila">
                        📍 {clienteActivo.domicilio || "Sin domicilio"}
                        {clienteActivo.localidad && <span style={{ color: "var(--gris)", marginLeft: 6 }}>{clienteActivo.localidad}</span>}
                      </div>
                      <div className="info-fila">📞 {clienteActivo.telefono || "Sin teléfono"}</div>
                    </div>

                    {/* Subformulario de Actividad */}
                    <form className="subform" onSubmit={handleGuardarActividad}>
                      <h3>{subform.id ? "Editar actividad" : "Agregar actividad"}</h3>
                      <div className="subform-fila">
                        <input
                          type="text"
                          placeholder="Descripción de la actividad"
                          value={subform.desc}
                          onChange={e => setSubform({ ...subform, desc: e.target.value })}
                        />
                        <input
                          type="date"
                          value={subform.fecha}
                          onChange={e => setSubform({ ...subform, fecha: e.target.value })}
                        />
                        <button type="submit" className="btn btn-azul">💾 Guardar</button>
                        {subform.id && (
                          <button type="button" className="btn" onClick={() => setSubform({ id: null, desc: "", fecha: "" })}>
                            ✕ Cancelar
                          </button>
                        )}
                      </div>
                    </form>

                    {/* Sección Compromisos */}
                    <div className="seccion-act">
                      <h3>Compromisos</h3>
                      <div className="act-caja">
                        {compromisos.length === 0 ? (
                          <p style={{ padding: 14, color: "var(--gris)", fontSize: 13, textAlign: "center" }}>No hay compromisos pendientes</p>
                        ) : (
                          compromisos.map(a => {
                            const vencida = estaVencida(a.fechaCompromiso);
                            return (
                              <div key={a.id} className="act-fila">
                                <button className="act-check" title="Completar" onClick={() => handleCompletarActividad(a.id)} />
                                <div className="act-info">
                                  <div className="act-desc">{a.descripcion}</div>
                                  <div className={`act-meta ${vencida ? "vencida" : ""}`}>
                                    {formatearFecha(a.fechaCompromiso)}{vencida ? " · Vencido" : ""}
                                  </div>
                                </div>
                                <div style={{ display: "flex", gap: 6 }}>
                                  <button className="btn-ico" title="Editar" onClick={() => setSubform({ id: a.id, desc: a.descripcion, fecha: a.fechaCompromiso || "" })}>✏️</button>
                                  <button className="btn-ico del" title="Borrar" onClick={() => handleEliminarActividad(a)}>🗑️</button>
                                </div>
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>

                    {/* Sección Actividades Completadas */}
                    <div className="seccion-act">
                      <h3>Actividades completadas</h3>
                      <div className="act-caja">
                        {completadas.length === 0 ? (
                          <p style={{ padding: 14, color: "var(--gris)", fontSize: 13, textAlign: "center" }}>No hay actividades completadas</p>
                        ) : (
                          completadas.map(a => (
                            <div key={a.id} className="act-fila">
                              <div className="act-check ok">✓</div>
                              <div className="act-info">
                                <div className="act-desc tachada">{a.descripcion}</div>
                                <div className="act-meta">Completada el {formatearFecha(a.fechaFinalizacion)}</div>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                ) : (
                  <p style={{ color: "var(--gris)", textAlign: "center", marginTop: 40 }}>Seleccione un cliente para ver su ficha</p>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Componente Formulario de Cliente
    function FormCliente({ modo, inicial, onGuardar, onCancelar }) {
      const [nombre, setNombre] = useState(inicial?.nombre || "");
      const [apellido, setApellido] = useState(inicial?.apellido || "");
      const [email, setEmail] = useState(inicial?.email || "");
      const [telefono, setTelefono] = useState(inicial?.telefono || "");
      const [domicilio, setDomicilio] = useState(inicial?.domicilio || "");
      const [localidad, setLocalidad] = useState(inicial?.localidad || "");

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!nombre.trim() || !apellido.trim() || !email.trim()) return alert("Nombre, Apellido y Email son requeridos");
        onGuardar({ nombre, apellido, email, telefono, domicilio, localidad });
      };

      return (
        <form className="form-cliente" onSubmit={handleSubmit}>
          <h2 style={{ fontSize: 22, fontWeight: 700 }}>{modo === "nuevo" ? "Nuevo Cliente" : "Editar Cliente"}</h2>
          <div className="form-grid">
            <div className="campo"><label>Nombre *</label><input required value={nombre} onChange={e => setNombre(e.target.value)} /></div>
            <div className="campo"><label>Apellido *</label><input required value={apellido} onChange={e => setApellido(e.target.value)} /></div>
            <div className="campo form-full"><label>Email *</label><input type="email" required value={email} onChange={e => setEmail(e.target.value)} /></div>
            <div className="campo"><label>Teléfono</label><input value={telefono} onChange={e => setTelefono(e.target.value)} /></div>
            <div className="campo"><label>Localidad</label><input value={localidad} onChange={e => setLocalidad(e.target.value)} /></div>
            <div className="campo form-full"><label>Domicilio</label><input value={domicilio} onChange={e => setDomicilio(e.target.value)} /></div>
          </div>
          <div className="form-btns">
            <button type="submit" className="btn btn-azul">💾 Guardar</button>
            <button type="button" className="btn" onClick={onCancelar}>✕ Cancelar</button>
          </div>
        </form>
      );
    }

    // Montar la aplicación React en el DOM
    ReactDOM.createRoot(document.getElementById("root")).render(<MiniCRM />);
  </script>
</body>
</html>
