<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px 60px; font: 16px/1.4 system-ui, sans-serif; background: #f5f6f4; color: #1e2824; }
    main { max-width: 1104px; margin: auto; }

    /* Cabecera */
    header.barra {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px;
      & h1 { margin: 0; font-size: 2rem; }
    }

    /* Grilla y Tarjetas */
    section.grilla {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      @media (max-width: 900px) { grid-template-columns: repeat(2, 1fr); }
      @media (max-width: 600px) { grid-template-columns: 1fr; }
    }

    article {
      background: #fff; border: 1px solid #e3e7e3; border-radius: 16px; padding: 22px 24px 18px;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import iniciales from './alumnos.json' with { type: 'json' }

    const estado = reactive({
      alumnos: iniciales
    })

    // Render principal
    html`
      <header class="barra">
        <h1>Agenda</h1>
      </header>

      <section class="grilla">
        ${() => estado.alumnos.map(a => html`
          <article>
            <h2>${a.apellido} ${a.nombre}</h2>
          </article>
        `)}
      </section>
    `(document.getElementById('app'))
  </script>
</body>
</html>
