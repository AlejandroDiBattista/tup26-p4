<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCRM</title>
  
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --bg-app: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1e293b;
      --bg-input: #0b111e;
      --bg-hover: #1e293b;
      --border-color: #1e293b;
      --border-subtle: #334155;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.14);
      --card-selected: #172554;
      --card-selected-border: #3b82f6;
      --card-selected-glow: rgba(59, 130, 246, 0.25);
      --avatar-bg: #1e293b;
      --avatar-color: #60a5fa;
      --avatar-border: #334155;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
    }

    body.tema-claro {
      color-scheme: light;
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-input: #ffffff;
      --bg-hover: #f1f5f9;
      --border-color: #e2e8f0;
      --border-subtle: #cbd5e1;
      --border-focus: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-bg: #fef2f2;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --card-selected: #eff6ff;
      --card-selected-border: #93c5fd;
      --card-selected-glow: rgba(59, 130, 246, 0.12);
      --avatar-bg: #e2e8f0;
      --avatar-color: #334155;
      --avatar-border: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-contenedor {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    header.app-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .brand .logo-badge {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-derecha {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .header-info {
        display: none;
      }
    }

    .btn-toggle-tema {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-toggle-tema:hover {

      color: var(--primary);
    }

    .app-cuerpo {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      overflow: hidden;
      background: var(--bg-app);
    }

    @media (max-width: 900px) {
      .app-cuerpo {
        grid-template-columns: 300px 1fr;
      }

    .panel-maestro {
      background: var(--bg-surface);

      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .maestro-cabecera {

      align-items: center;

    .maestro-cabecera h2 {

    .btn-nuevo {

    .input-busqueda-wrap svg {

    .input-busqueda {

    .cliente-tarjeta {

    .cliente-info-corta {

    .cliente-nombre-fila {

    .cliente-email-fila {

    .badge-metricas {

    .btn-secundario {

    .btn-peligro {

    .subform-campos {

    .subform-fila {

    .btn-completar-check {

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MESES = [
      "ene", "feb", "mar", "abr", "may", "jun",
      "jul", "ago", "sep", "oct", "nov", "dic"
    ];

    function formatearFecha(cadenaFecha) {
      if (!cadenaFecha) return "Sin fecha";
      const partes = cadenaFecha.split("-");
      if (partes.length === 3) {
        const dia = parseInt(partes[2], 10);
        const mesIdx = parseInt(partes[1], 10) - 1;
        const anio = partes[0];
        if (mesIdx >= 0 && mesIdx < 12) {
          return `${dia} ${MESES[mesIdx]} ${anio}`;
        }
      }
      return cadenaFecha;
    }

    function esFechaVencida(cadenaFecha) {
      if (!cadenaFecha) return false;
      const partes = cadenaFecha.split("-");
      if (partes.length !== 3) return false;
      
      const hoy = new Date();
      const anioHoy = hoy.getFullYear();
      const mesHoy = String(hoy.getMonth() + 1).padStart(2, "0");
      const diaHoy = String(hoy.getDate()).padStart(2, "0");
      return cadenaFecha < `${anioHoy}-${mesHoy}-${diaHoy}`;
    }

    function obtenerIniciales(nombre) {
      if (!nombre) return "??";
      const palabras = nombre.trim().split(/\s+/);
      if (palabras.length === 1) {
        return palabras[0].substring(0, 2).toUpperCase();
      }
      return (palabras[0][0] + palabras[palabras.length - 1][0]).toUpperCase();
    }

    function MiniCRMApp() {
      const [temaOscuro, setTemaOscuro] = useState(true);

      useEffect(() => {
        if (temaOscuro) {
          document.body.classList.remove("tema-claro");
        } else {
          document.body.classList.add("tema-claro");
        }
      }, [temaOscuro]);

      const [clientes, setClientes] = useState([]);
      const [clienteSeleccionadoId, setClienteSeleccionadoId] = useState(null);
      const [clienteDetalle, setClienteDetalle] = useState(null);
      const [terminoBusqueda, setTerminoBusqueda] = useState("");
      const [modoDetalle, setModoDetalle] = useState("ver");

      const [formCliente, setFormCliente] = useState({
        nombre: "",
        email: "",
        telefono: "",
        domicilio: "",
      });
      const [errorCliente, setErrorCliente] = useState("");

      const [formActividad, setFormActividad] = useState({
        descripcion: "",
        fecha: "",
      });
      const [actividadEnEdicionId, setActividadEnEdicionId] = useState(null);
      const [errorActividad, setErrorActividad] = useState("");

      async function cargarClientes(termino = terminoBusqueda) {
        try {
          const url = termino.trim()
            ? `/api/clientes?buscar=${encodeURIComponent(termino.trim())}`
            : "/api/clientes";
          const res = await fetch(url);
          if (!res.ok) throw new Error("Error al consultar clientes");
          const datos = await res.json();
          setClientes(datos);

          if (datos.length > 0 && !clienteSeleccionadoId && modoDetalle === "ver") {
            setClienteSeleccionadoId(datos[0].id);
          }
        } catch (err) {
          console.error(err);
        }
      }

      async function cargarDetalleCliente(id) {
        if (!id) {
          setClienteDetalle(null);
          return;
        }
        try {
          const res = await fetch(`/api/clientes/${id}`);
          if (!res.ok) throw new Error("Error al obtener cliente");
          const datos = await res.json();
          setClienteDetalle(datos);
        } catch (err) {
          console.error(err);
          setClienteDetalle(null);
        }
      }

      useEffect(() => {
        cargarClientes();
      }, []);

      useEffect(() => {
        const timer = setTimeout(() => {
          cargarClientes(terminoBusqueda);
        }, 200);
        return () => clearTimeout(timer);
      }, [terminoBusqueda]);

      useEffect(() => {
        if (clienteSeleccionadoId) {
          cargarDetalleCliente(clienteSeleccionadoId);
        }
      }, [clienteSeleccionadoId]);

      function iniciarCrearCliente() {
        setModoDetalle("crear");
        setFormCliente({ nombre: "", email: "", telefono: "", domicilio: "" });
        setErrorCliente("");
      }

      function iniciarEditarCliente() {
        if (!clienteDetalle) return;
        setModoDetalle("editar");
        setFormCliente({
          nombre: clienteDetalle.nombre || "",
          email: clienteDetalle.email || "",
          telefono: clienteDetalle.telefono || "",
          domicilio: clienteDetalle.domicilio || "",
        });
        setErrorCliente("");
      }

      function cancelarEdicionCliente() {
        setModoDetalle("ver");
        setErrorCliente("");
      }

      async function guardarCliente(e) {
        e.preventDefault();
        setErrorCliente("");

        if (!formCliente.nombre.trim() || !formCliente.email.trim()) {
          setErrorCliente("Nombre y correo electrónico son obligatorios.");
          return;
        }

        try {
          if (modoDetalle === "crear") {
            const res = await fetch("/api/clientes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(formCliente),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Error al crear cliente");

            await cargarClientes();
            setClienteSeleccionadoId(data.id);
            setModoDetalle("ver");
          } else if (modoDetalle === "editar") {
            const res = await fetch(`/api/clientes/${clienteSeleccionadoId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(formCliente),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Error al actualizar");

            await cargarClientes();
            await cargarDetalleCliente(clienteSeleccionadoId);
            setModoDetalle("ver");
          }
        } catch (err) {
          setErrorCliente(err.message);
        }
      }

      async function eliminarCliente() {
        if (!clienteDetalle) return;
        if (!window.confirm(`¿Eliminar al cliente "${clienteDetalle.nombre}"?`)) return;

        try {
          const res = await fetch(`/api/clientes/${clienteDetalle.id}`, { method: "DELETE" });
          if (!res.ok) throw new Error("Error al eliminar cliente");

          setClienteSeleccionadoId(null);
          setClienteDetalle(null);
          setModoDetalle("ver");
          await cargarClientes();
        } catch (err) {
          alert(err.message);
        }
      }

      function iniciarEditarActividad(act) {
        if (act.completada) return;
        setActividadEnEdicionId(act.id);
        setFormActividad({
          descripcion: act.descripcion || "",
          fecha: act.fecha || "",
        });
        setErrorActividad("");
      }

      function cancelarEdicionActividad() {
        setActividadEnEdicionId(null);
        setFormActividad({ descripcion: "", fecha: "" });
        setErrorActividad("");
      }

      async function guardarActividad(e) {
        e.preventDefault();
        setErrorActividad("");

        if (!formActividad.descripcion.trim()) {
          setErrorActividad("La descripción es obligatoria.");
          return;
        }

        try {
          const payload = {
            descripcion: formActividad.descripcion.trim(),
            fecha: formActividad.fecha || null,
          };

          const url = actividadEnEdicionId
            ? `/api/clientes/${clienteSeleccionadoId}/actividades/${actividadEnEdicionId}`
            : `/api/clientes/${clienteSeleccionadoId}/actividades`;

          const res = await fetch(url, {
            method: actividadEnEdicionId ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Error al guardar actividad");

          cancelarEdicionActividad();
          await cargarDetalleCliente(clienteSeleccionadoId);
          await cargarClientes();
        } catch (err) {
          setErrorActividad(err.message);
        }
      }

      async function completarActividad(actividadId) {
        try {
          const res = await fetch(
            `/api/clientes/${clienteSeleccionadoId}/actividades/${actividadId}/completar`,
            { method: "PATCH" }
          );
          if (!res.ok) throw new Error("Error al completar actividad");

          if (actividadEnEdicionId === actividadId) cancelarEdicionActividad();
          await cargarDetalleCliente(clienteSeleccionadoId);
          await cargarClientes();
        } catch (err) {
          alert(err.message);
        }
      }

      async function eliminarActividad(actividadId) {
        if (!window.confirm("¿Deseas eliminar este compromiso?")) return;

        try {
          const res = await fetch(
            `/api/clientes/${clienteSeleccionadoId}/actividades/${actividadId}`,
            { method: "DELETE" }
          );
          if (!res.ok) throw new Error("Error al eliminar");

          if (actividadEnEdicionId === actividadId) cancelarEdicionActividad();
          await cargarDetalleCliente(clienteSeleccionadoId);
          await cargarClientes();
        } catch (err) {
          alert(err.message);
        }
      }

      return (
        <div className="app-contenedor">
          <header className="app-header">
            <div className="brand">
              <span className="logo-badge">CRM</span>
              <span>MiniCRM</span>
            </div>
            <div className="header-derecha">
              <span className="header-info">Gestión de clientes y actividades</span>
              <button
                type="button"
                className="btn-toggle-tema"
                onClick={() => setTemaOscuro(!temaOscuro)}
              >
                {temaOscuro ? "☀️ Claro" : "🌙 Oscuro"}
              </button>
            </div>
          </header>

          <div className="app-cuerpo">
            <aside className="panel-maestro">
              <div className="maestro-cabecera">
                <h2>Clientes</h2>
                <button
                  type="button"
                  className="btn-nuevo"
                  onClick={iniciarCrearCliente}
                >
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  <span>Nuevo</span>
                </button>
              </div>

              <div className="maestro-buscador">
                <div className="input-busqueda-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input
                    type="text"
                    className="input-busqueda"
                    placeholder="Buscar por cualquier campo..."
                    value={terminoBusqueda}
                    onChange={(e) => setTerminoBusqueda(e.target.value)}
                  />
                </div>
              </div>

              <div className="maestro-lista">
                {clientes.length === 0 && (
                  <div className="sin-resultados-maestro">
                    No se encontraron clientes.
                  </div>
                )}
                {clientes.map((c) => {
                  const activa = c.id === clienteSeleccionadoId && modoDetalle === "ver";
                  return (
                    <div
                      key={c.id}
                      className={`cliente-tarjeta ${activa ? "activa" : ""}`}
                      onClick={() => {
                        setClienteSeleccionadoId(c.id);
                        setModoDetalle("ver");
                        cancelarEdicionActividad();
                      }}
                    >
                      <div className="avatar-circulo">{obtenerIniciales(c.nombre)}</div>
                      <div className="cliente-info-corta">
                        <div className="cliente-nombre-fila">{c.nombre}</div>
                        <div className="cliente-email-fila">{c.email}</div>
                      </div>
                      <div className="badge-metricas">
                        {c.pendientes} | {c.completadas}
                      </div>
                    </div>
                  );
                })}
              </div>
            </aside>

            <main className="panel-detalle">
              {modoDetalle === "crear" || modoDetalle === "editar" ? (
                <div className="detalle-scrollable">
                  <div className="formulario-cliente-card">
                    <h2>{modoDetalle === "crear" ? "Nuevo Cliente" : "Editar Ficha de Cliente"}</h2>
                    {errorCliente && <div className="alerta-error">{errorCliente}</div>}

                    <form onSubmit={guardarCliente}>
                      <div className="form-grupo">
                        <label>Nombre y Apellido <span className="requerido">*</span></label>
                        <input
                          type="text"
                          className="input-control"
                          placeholder="Ej: Ana Garcia"
                          value={formCliente.nombre}
                          onChange={(e) => setFormCliente({ ...formCliente, nombre: e.target.value })}
                          autoFocus
                          required
                        />
                      </div>

                      <div className="form-grupo">
                        <label>Correo electrónico <span className="requerido">*</span></label>
                        <input
                          type="email"
                          className="input-control"
                          placeholder="Ej: ana.garcia@example.com"
                          value={formCliente.email}
                          onChange={(e) => setFormCliente({ ...formCliente, email: e.target.value })}
                          required
                        />
                      </div>

                      <div className="form-grupo">
                        <label>Teléfono</label>
                        <input
                          type="text"
                          className="input-control"
                          placeholder="Ej: 381 555 0123"
                          value={formCliente.telefono}
                          onChange={(e) => setFormCliente({ ...formCliente, telefono: e.target.value })}
                        />
                      </div>

                      <div className="form-grupo">
                        <label>Domicilio / Dirección</label>
                        <input
                          type="text"
                          className="input-control"
                          placeholder="Ej: San Martin 450, Yerba Buena"
                          value={formCliente.domicilio}
                          onChange={(e) => setFormCliente({ ...formCliente, domicilio: e.target.value })}
                        />
                      </div>

                      <div className="form-acciones-pie">
                        <button
                          type="button"
                          className="btn-secundario"
                          onClick={cancelarEdicionCliente}
                        >
                          Cancelar
                        </button>
                        <button type="submit" className="btn-nuevo">
                          {modoDetalle === "crear" ? "Guardar Cliente" : "Actualizar Cliente"}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              ) : clienteDetalle ? (
                <div className="detalle-scrollable">
                  <article className="ficha-cliente-card">
                    <header className="ficha-cabecera">
                      <div className="ficha-titulos">
                        <h2>{clienteDetalle.nombre}</h2>
                        <span className="ficha-id-badge">#{clienteDetalle.id}</span>
                      </div>
                      <div className="ficha-acciones">
                        <button
                          type="button"
                          className="btn-secundario"
                          onClick={iniciarEditarCliente}
                        >
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                          </svg>
                          <span>Editar</span>
                        </button>
                        <button
                          type="button"
                          className="btn-peligro"
                          onClick={eliminarCliente}
                        >
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                          </svg>
                          <span>Eliminar</span>
                        </button>
                      </div>
                    </header>

                    <div className="ficha-datos-grilla">
                      <div className="dato-item">
                        <div className="dato-icono">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                          </svg>
                        </div>
                        <div className="dato-texto-wrap">
                          <span className="dato-etiqueta">Email</span>
                          <span className="dato-valor">{clienteDetalle.email}</span>
                        </div>
                      </div>

                      <div className="dato-item">
                        <div className="dato-icono">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                          </svg>
                        </div>
                        <div className="dato-texto-wrap">
                          <span className="dato-etiqueta">Teléfono</span>
                          <span className="dato-valor">{clienteDetalle.telefono || "—"}</span>
                        </div>
                      </div>

                      <div className="dato-item">
                        <div className="dato-icono">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                          </svg>
                        </div>
                        <div className="dato-texto-wrap">
                          <span className="dato-etiqueta">Domicilio</span>
                          <span className="dato-valor">{clienteDetalle.domicilio || "—"}</span>
                        </div>
                      </div>
                    </div>
                  </article>

                  <div className="subformulario-card">
                    <h3>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                      </svg>
                      <span>{actividadEnEdicionId ? "Editar actividad" : "Agregar actividad"}</span>
                    </h3>

                    {errorActividad && <div className="alerta-error">{errorActividad}</div>}

                    <form onSubmit={guardarActividad} className="subform-campos">
                      <div className="subform-fila">
                        <div className="campo-desc">
                          <input
                            type="text"
                            className="input-control"
                            placeholder="Descripción de la actividad..."
                            value={formActividad.descripcion}
                            onChange={(e) => setFormActividad({ ...formActividad, descripcion: e.target.value })}
                            required
                          />
                        </div>
                        <div className="campo-fecha">
                          <input
                            type="date"
                            className="input-control"
                            value={formActividad.fecha}
                            onChange={(e) => setFormActividad({ ...formActividad, fecha: e.target.value })}
                          />
                        </div>
                      </div>

                      <div className="subform-botones">
                        {actividadEnEdicionId && (
                          <button
                            type="button"
                            className="btn-secundario"
                            onClick={cancelarEdicionActividad}
                          >
                            Cancelar
                          </button>
                        )}
                        <button type="submit" className="btn-nuevo">
                          {actividadEnEdicionId ? "Guardar cambios" : "Agregar"}
                        </button>
                      </div>
                    </form>
                  </div>

                  <section className="seccion-actividades">
                    <div className="seccion-titulo-fila">
                      <h3 className="seccion-titulo">
                        <span>Compromisos</span>
                        <span className="contador-pill">{clienteDetalle.compromisos?.length || 0}</span>
                      </h3>
                    </div>

                    <div className="lista-actividades-grupo">
                      {(!clienteDetalle.compromisos || clienteDetalle.compromisos.length === 0) && (
                        <div className="sin-actividades-aviso">
                          No hay compromisos pendientes.
                        </div>
                      )}
                      {clienteDetalle.compromisos?.map((act) => {
                        const vencida = esFechaVencida(act.fecha);
                        return (
                          <div key={act.id} className="actividad-fila">
                            <div className="actividad-cuerpo">
                              <button
                                type="button"
                                className="btn-completar-check"
                                onClick={() => completarActividad(act.id)}
                              >
                                ✓
                              </button>
                              <div className="actividad-textos">
                                <span className="actividad-desc">{act.descripcion}</span>
                                <span className={`actividad-fecha-tag ${vencida ? "vencida" : ""}`}>
                                  {act.fecha ? (
                                    <>
                                      {formatearFecha(act.fecha)}
                                      {vencida && " · Vencido"}
                                    </>
                                  ) : (
                                    "Sin fecha"
                                  )}
                                </span>
                              </div>
                            </div>
                            <div className="actividad-acciones">
                              <button
                                type="button"
                                className="btn-icono"
                                onClick={() => iniciarEditarActividad(act)}
                              >
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                              </button>
                              <button
                                type="button"
                                className="btn-icono icono-peligro"
                                onClick={() => eliminarActividad(act.id)}
                              >
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                  <polyline points="3 6 5 6 21 6"></polyline>
                                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </section>

                  <section className="seccion-actividades">
                    <div className="seccion-titulo-fila">
                      <h3 className="seccion-titulo">
                        <span>Actividades completadas</span>
                        <span className="contador-pill">{clienteDetalle.completadas?.length || 0}</span>
                      </h3>
                    </div>

                    <div className="lista-actividades-grupo">
                      {(!clienteDetalle.completadas || clienteDetalle.completadas.length === 0) && (
                        <div className="sin-actividades-aviso">
                          No hay actividades completadas.
                        </div>
                      )}
                      {clienteDetalle.completadas?.map((act) => (
                        <div key={act.id} className="actividad-fila">
                          <div className="actividad-cuerpo">
                            <svg className="icono-check-completa" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                              <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <div className="actividad-textos">
                              <span className="actividad-desc completada-texto">{act.descripcion}</span>
                              <span className="actividad-fecha-tag">
                                {act.fechaCompletada
                                  ? `Completada el ${formatearFecha(act.fechaCompletada)}`
                                  : "Completada"}
                              </span>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                </div>
              ) : (
                <div className="detalle-vacio">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                  </svg>
                  <h3>Ningún cliente seleccionado</h3>
                  <p>Selecciona un cliente de la lista de la izquierda o crea uno nuevo.</p>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const raiz = ReactDOM.createRoot(document.getElementById("root"));
    raiz.render(<MiniCRMApp />);
  </script>
</body>
</html>
