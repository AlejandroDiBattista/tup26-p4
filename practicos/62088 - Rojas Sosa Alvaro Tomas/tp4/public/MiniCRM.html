<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniCRM</title>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<style>
  :root {
    --azul:      #2563eb;
    --azul-osc:  #1e3a5f;
    --rojo:      #dc2626;
    --verde:     #16a34a;
    --verde-sua: #f0fdf4;
    --texto:     #1e293b;
    --suave:     #64748b;
    --tenue:     #94a3b8;
    --linea:     #e2e8f0;
    --fondo:     #f1f5f9;
    --panel:     #ffffff;
    --sel:       #eff6ff;
  }

  * { box-sizing: border-box; }

  html, body, #root { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background: var(--fondo);
    color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  button { font: inherit; cursor: pointer; }
  input  { font: inherit; }

  .app { height: 100%; display: flex; flex-direction: column; }

  /* ---------- barra superior ---------- */
  .barra {
    flex: none;
    padding: 14px 24px;
    background: var(--azul-osc);
    color: #fff;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* ---------- disposición maestro / detalle ---------- */
  .cuerpo {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 14px;
    padding: 14px;
  }
  @media (max-width: 820px) {
    .cuerpo { grid-template-columns: 1fr; grid-template-rows: 240px 1fr; }
  }

  .tarjeta {
    background: var(--panel);
    border: 1px solid var(--linea);
    border-radius: 10px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- maestro ---------- */
  .maestro-top { flex: none; padding: 16px 16px 10px; }

  .maestro-titulo {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .maestro-titulo h2 { margin: 0 auto 0 0; font-size: 20px; }

  .btn-agregar {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 15px; border: 0; border-radius: 8px;
    background: var(--azul); color: #fff; font-weight: 600; font-size: 14px;
  }
  .btn-agregar:hover { background: #1d4ed8; }

  .buscador {
    width: 100%; padding: 9px 12px 9px 34px;
    border: 1px solid var(--linea); border-radius: 8px;
    background: #fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2394a3b8' stroke-width='2'%3E%3Ccircle cx='7' cy='7' r='5'/%3E%3Cpath d='M11 11l4 4'/%3E%3C/svg%3E") no-repeat 11px center;
  }
  .buscador:focus { outline: 2px solid var(--azul); outline-offset: -1px; }

  .lista { flex: 1; min-height: 0; overflow-y: auto; }

  .item {
    width: 100%; display: flex; align-items: center; gap: 11px;
    padding: 11px 16px; border: 0; border-top: 1px solid var(--linea);
    background: none; text-align: left;
  }
  .item:hover { background: #f8fafc; }
  .item[aria-current="true"] { background: var(--sel); box-shadow: inset 3px 0 0 var(--azul); }

  .avatar {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
  }
  .item-datos { min-width: 0; display: flex; flex-direction: column; }
  .item-nombre { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-mail   { display: block; font-size: 13px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- detalle ---------- */
  .detalle-top { flex: none; padding: 20px 24px 0; }

  .detalle-cab { display: flex; align-items: flex-start; gap: 12px; }
  .detalle-cab h2 { margin: 0 auto 0 0; font-size: 27px; letter-spacing: -0.02em; }
  .num { color: var(--tenue); font-size: 13px; padding-top: 4px; }

  .acciones { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border: 1px solid var(--linea); border-radius: 8px;
    background: #fff; font-size: 14px; font-weight: 500;
  }
  .btn:hover { background: #f8fafc; }
  .btn.peligro { color: var(--rojo); border-color: #fecaca; }
  .btn.peligro:hover { background: #fef2f2; }
  .btn.primario { background: var(--azul); color: #fff; border-color: var(--azul); font-weight: 600; }
  .btn.primario:hover { background: #1d4ed8; }

  .contacto {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px;
    margin: 18px 0 0; padding: 0; list-style: none;
    font-size: 14.5px;
  }
  .contacto li { display: flex; gap: 10px; align-items: flex-start; }
  .contacto .ic { flex: none; color: var(--suave); line-height: 1.4; }
  @media (max-width: 640px) { .contacto { grid-template-columns: 1fr; } }

  /* ---------- subformulario ---------- */
  .subform {
    margin-top: 18px; padding: 14px 16px;
    border: 1px dashed #cbd5e1; border-radius: 10px;
  }
  .subform h3 { margin: 0 0 10px; font-size: 15px; }
  .subform-fila { display: flex; gap: 10px; flex-wrap: wrap; }
  .subform input[type=text] { flex: 1 1 260px; min-width: 0; }
  .subform input[type=date] { flex: 0 1 170px; }
  .subform input {
    padding: 9px 12px; border: 1px solid var(--linea); border-radius: 8px;
  }
  .subform input:focus { outline: 2px solid var(--azul); outline-offset: -1px; }

  /* ---------- formulario de cliente ---------- */
  .form-cliente { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .form-cliente label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 4px; }
  .form-cliente input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--linea); border-radius: 8px;
  }
  .form-cliente input:focus { outline: 2px solid var(--azul); outline-offset: -1px; }
  .form-cliente .ancho { grid-column: 1 / -1; }
  @media (max-width: 640px) { .form-cliente { grid-template-columns: 1fr; } }

  /* ---------- actividades (scroll propio) ---------- */
  .actividades { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px 20px; }

  .actividades h3 {
    margin: 20px 0 8px; font-size: 17px;
  }

  .grupo { border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; }
  .grupo.hechas { background: var(--verde-sua); border-color: #bbf7d0; }

  .act { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
  .act + .act { border-top: 1px solid var(--linea); }
  .grupo.hechas .act + .act { border-top-color: #bbf7d0; }

  .act-texto { flex: 1; min-width: 0; }
  .act-desc { font-weight: 500; }
  .act-fecha { font-size: 13px; color: var(--suave); }
  .act-fecha.vencido { color: var(--rojo); font-weight: 500; }
  .hechas .act-desc { color: #166534; }
  .hechas .act-fecha { color: #15803d; }

  .check {
    flex: none; width: 21px; height: 21px; padding: 0;
    border: 2px solid #cbd5e1; border-radius: 5px; background: #fff;
  }
  .check:hover { border-color: var(--azul); }
  .check.ok {
    border-color: var(--verde); background: var(--verde); color: #fff;
    display: grid; place-items: center; font-size: 13px; cursor: default;
  }

  .mini {
    flex: none; width: 32px; height: 32px; padding: 0;
    border: 1px solid var(--linea); border-radius: 7px; background: #fff;
    display: grid; place-items: center; color: var(--suave);
  }
  .mini:hover { background: #f8fafc; color: var(--texto); }
  .mini.peligro:hover { background: #fef2f2; color: var(--rojo); border-color: #fecaca; }

  .vacio { padding: 16px; color: var(--suave); font-size: 14px; text-align: center; }

  .sin-seleccion {
    flex: 1; display: grid; place-items: center;
    color: var(--tenue); text-align: center; padding: 24px;
  }

  .error {
    margin: 12px 24px 0; padding: 10px 13px;
    border: 1px solid #fecaca; border-radius: 8px;
    background: #fef2f2; color: #991b1b; font-size: 14px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React

const API = '/api'

/* ---------------- utilidades ---------------- */

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']

function formatearFecha(iso) {
  if (!iso) return null
  const [a, m, d] = iso.split('-').map(Number)
  if (!a || !m || !d) return iso
  return `${d} ${MESES[m - 1]} ${a}`
}

function hoyISO() {
  const d = new Date()
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
}

function estaVencida(iso) {
  return Boolean(iso) && iso < hoyISO()
}

const completada = a => a.fechaFinalizacion !== null

const nombreCompleto = c => `${c.nombre} ${c.apellido}`

// El telefono se guarda normalizado (solo digitos). Aca lo separamos en grupos
// para que se lea mejor, sin tocar el dato almacenado.
function formatearTelefono(valor) {
  if (!valor) return ''
  const mas = valor.startsWith('+')
  const d = valor.replace(/\D/g, '')
  const partes = mas && d.length > 10
    ? [d.slice(0, 2), d.slice(2, 5), d.slice(5, 8), d.slice(8)]
    : [d.slice(0, 3), d.slice(3, 6), d.slice(6)]
  const texto = partes.filter(Boolean).join(' ')
  return mas ? `+${texto}` : texto
}

function iniciales(cliente) {
  return ((cliente.nombre[0] ?? '') + (cliente.apellido[0] ?? '')).toUpperCase()
}

const PALETA = [
  ['#dbeafe', '#1d4ed8'], ['#dcfce7', '#15803d'], ['#f3e8ff', '#7e22ce'],
  ['#ffedd5', '#c2410c'], ['#fce7f3', '#be185d'], ['#ccfbf1', '#0f766e'],
  ['#fef9c3', '#a16207'], ['#e0e7ff', '#4338ca'],
]

function colorDe(nombre) {
  let n = 0
  for (const c of nombre) n = (n + c.charCodeAt(0)) % PALETA.length
  return PALETA[n]
}

async function pedir(url, opciones) {
  const r = await fetch(url, opciones)
  if (r.status === 204) return null
  const cuerpo = await r.json().catch(() => null)
  if (!r.ok) throw new Error((cuerpo && cuerpo.error) || `Error ${r.status}`)
  return cuerpo
}

/* ---------------- maestro ---------------- */

function ListaClientes({ clientes, seleccionado, onSeleccionar, busqueda, onBuscar, onAgregar }) {
  return (
    <div className="tarjeta">
      <div className="maestro-top">
        <div className="maestro-titulo">
          <h2>Clientes</h2>
          <button className="btn-agregar" onClick={onAgregar}>+ Agregar</button>
        </div>
        <input
          className="buscador"
          type="search"
          placeholder="Buscar por cualquier campo..."
          aria-label="Buscar cliente"
          value={busqueda}
          onChange={e => onBuscar(e.target.value)}
        />
      </div>

      <div className="lista">
        {clientes.length === 0 && <p className="vacio">No hay clientes que coincidan.</p>}
        {clientes.map(c => {
          const [fondo, tinta] = colorDe(nombreCompleto(c))
          return (
            <button
              key={c.id}
              className="item"
              aria-current={seleccionado === c.id}
              onClick={() => onSeleccionar(c.id)}
            >
              <span className="avatar" style={{ background: fondo, color: tinta }}>
                {iniciales(c)}
              </span>
              <span className="item-datos">
                <span className="item-nombre">{nombreCompleto(c)}</span>
                <span className="item-mail">{c.email}</span>
              </span>
            </button>
          )
        })}
      </div>
    </div>
  )
}

/* ---------------- formulario de cliente ---------------- */

const CLIENTE_VACIO = { nombre: '', apellido: '', email: '', telefono: '', domicilio: '', localidad: '' }

function FormCliente({ inicial, onGuardar, onCancelar }) {
  const [datos, setDatos] = useState(
    inicial
      ? {
          nombre: inicial.nombre, apellido: inicial.apellido, email: inicial.email,
          telefono: inicial.telefono ?? '', domicilio: inicial.domicilio ?? '', localidad: inicial.localidad ?? '',
        }
      : CLIENTE_VACIO,
  )
  const campo = k => e => setDatos({ ...datos, [k]: e.target.value })

  return (
    <form
      onSubmit={e => { e.preventDefault(); onGuardar(datos) }}
      style={{ padding: '20px 24px' }}
    >
      <h2 style={{ margin: '0 0 16px', fontSize: 22 }}>
        {inicial ? 'Editar cliente' : 'Nuevo cliente'}
      </h2>

      <div className="form-cliente">
        <div>
          <label htmlFor="f-nombre">Nombre</label>
          <input id="f-nombre" value={datos.nombre} onChange={campo('nombre')} required autoFocus />
        </div>
        <div>
          <label htmlFor="f-apellido">Apellido</label>
          <input id="f-apellido" value={datos.apellido} onChange={campo('apellido')} required />
        </div>
        <div>
          <label htmlFor="f-email">Email</label>
          <input id="f-email" type="email" value={datos.email} onChange={campo('email')} required />
        </div>
        <div>
          <label htmlFor="f-tel">Teléfono</label>
          <input id="f-tel" value={datos.telefono} onChange={campo('telefono')} />
        </div>
        <div>
          <label htmlFor="f-dom">Domicilio</label>
          <input id="f-dom" value={datos.domicilio} onChange={campo('domicilio')} />
        </div>
        <div>
          <label htmlFor="f-loc">Localidad</label>
          <input id="f-loc" value={datos.localidad} onChange={campo('localidad')} />
        </div>
      </div>

      <div className="acciones" style={{ marginTop: 18 }}>
        <button type="submit" className="btn primario">Guardar</button>
        <button type="button" className="btn" onClick={onCancelar}>Cancelar</button>
      </div>
    </form>
  )
}

/* ---------------- subformulario de actividad ---------------- */

function SubformActividad({ editando, onGuardar, onCancelar }) {
  const [descripcion, setDescripcion] = useState('')
  const [fecha, setFecha] = useState('')

  useEffect(() => {
    setDescripcion(editando ? editando.descripcion : '')
    setFecha(editando && editando.fechaCompromiso ? editando.fechaCompromiso : '')
  }, [editando])

  const enviar = e => {
    e.preventDefault()
    if (!descripcion.trim()) return
    onGuardar({ descripcion, fechaCompromiso: fecha || null })
    setDescripcion('')
    setFecha('')
  }

  return (
    <form className="subform" onSubmit={enviar}>
      <h3>{editando ? 'Editar actividad' : 'Agregar actividad'}</h3>
      <div className="subform-fila">
        <input
          type="text"
          placeholder="Descripción de la actividad"
          aria-label="Descripción de la actividad"
          value={descripcion}
          onChange={e => setDescripcion(e.target.value)}
          required
        />
        <input
          type="date"
          aria-label="Fecha opcional"
          value={fecha}
          onChange={e => setFecha(e.target.value)}
        />
        <button type="submit" className="btn primario">Guardar</button>
        <button
          type="button"
          className="btn"
          onClick={() => { setDescripcion(''); setFecha(''); onCancelar() }}
        >
          Cancelar
        </button>
      </div>
    </form>
  )
}

/* ---------------- listas de actividades ---------------- */

function Compromisos({ actividades, onCompletar, onEditar, onEliminar }) {
  if (actividades.length === 0) {
    return <div className="grupo"><p className="vacio">No hay compromisos pendientes.</p></div>
  }
  return (
    <div className="grupo">
      {actividades.map(a => (
        <div className="act" key={a.id}>
          <button
            className="check"
            aria-label={'Completar: ' + a.descripcion}
            onClick={() => onCompletar(a.id)}
          />
          <div className="act-texto">
            <div className="act-desc">{a.descripcion}</div>
            <div className={'act-fecha' + (estaVencida(a.fechaCompromiso) ? ' vencido' : '')}>
              {a.fechaCompromiso
                ? formatearFecha(a.fechaCompromiso) + (estaVencida(a.fechaCompromiso) ? ' · Vencido' : '')
                : 'Sin compromiso'}
            </div>
          </div>
          <button className="mini" aria-label="Editar actividad" onClick={() => onEditar(a)}>✎</button>
          <button className="mini peligro" aria-label="Eliminar actividad" onClick={() => onEliminar(a.id)}>🗑</button>
        </div>
      ))}
    </div>
  )
}

function Completadas({ actividades }) {
  if (actividades.length === 0) return null
  return (
    <div className="grupo hechas">
      {actividades.map(a => (
        <div className="act" key={a.id}>
          <span className="check ok" aria-hidden="true">✓</span>
          <div className="act-texto">
            <div className="act-desc">{a.descripcion}</div>
            <div className="act-fecha">
              {'Completada el ' + formatearFecha(a.fechaFinalizacion)}
            </div>
          </div>
        </div>
      ))}
    </div>
  )
}

/* ---------------- ficha del cliente ---------------- */

function FichaCliente({ cliente, actividades, onEditar, onEliminar, acciones }) {
  const [editandoAct, setEditandoAct] = useState(null)

  useEffect(() => setEditandoAct(null), [cliente.id])

  const pendientes = actividades.filter(a => !completada(a))
  const hechas = actividades.filter(completada)

  return (
    <>
      <div className="detalle-top">
        <div className="detalle-cab">
          <h2>{nombreCompleto(cliente)}</h2>
          <span className="num">#{cliente.id}</span>
          <div className="acciones">
            <button className="btn" onClick={onEditar}>✎ Editar</button>
            <button className="btn peligro" onClick={onEliminar}>🗑 Eliminar</button>
          </div>
        </div>

        <ul className="contacto">
          <li><span className="ic">✉</span><span>{cliente.email}</span></li>
          <li>
            <span className="ic">📍</span>
            <span>
              {cliente.domicilio || '—'}
              {cliente.localidad && <><br />{cliente.localidad}</>}
            </span>
          </li>
          <li><span className="ic">📞</span><span>{formatearTelefono(cliente.telefono) || '—'}</span></li>
        </ul>

        <SubformActividad
          editando={editandoAct}
          onGuardar={datos => {
            if (editandoAct) acciones.editarActividad(editandoAct.id, datos)
            else acciones.crearActividad(datos)
            setEditandoAct(null)
          }}
          onCancelar={() => setEditandoAct(null)}
        />
      </div>

      <div className="actividades">
        <h3>Compromisos</h3>
        <Compromisos
          actividades={pendientes}
          onCompletar={acciones.completarActividad}
          onEditar={setEditandoAct}
          onEliminar={acciones.eliminarActividad}
        />

        {hechas.length > 0 && (
          <>
            <h3>Actividades completadas</h3>
            <Completadas actividades={hechas} />
          </>
        )}
      </div>
    </>
  )
}

/* ---------------- aplicación ---------------- */

function App() {
  const [clientes, setClientes] = useState([])
  const [busqueda, setBusqueda] = useState('')
  const [seleccionado, setSeleccionado] = useState(null)
  const [actividades, setActividades] = useState([])
  const [modo, setModo] = useState('ver')   // 'ver' | 'nuevo' | 'editar'
  const [error, setError] = useState('')

  const fallar = e => setError(e.message || String(e))

  const cargarClientes = useCallback(async (q) => {
    try {
      const lista = await pedir(`${API}/clientes?q=${encodeURIComponent(q)}`)
      setClientes(lista)
      return lista
    } catch (e) { fallar(e); return [] }
  }, [])

  const cargarActividades = useCallback(async (id) => {
    if (id == null) { setActividades([]); return }
    try {
      setActividades(await pedir(`${API}/clientes/${id}/actividades`))
    } catch (e) { fallar(e) }
  }, [])

  useEffect(() => { cargarClientes('') }, [cargarClientes])

  useEffect(() => {
    const t = setTimeout(() => cargarClientes(busqueda), 150)
    return () => clearTimeout(t)
  }, [busqueda, cargarClientes])

  useEffect(() => { cargarActividades(seleccionado) }, [seleccionado, cargarActividades])

  const cliente = clientes.find(c => c.id === seleccionado) ?? null

  useEffect(() => {
    if (seleccionado != null && !clientes.some(c => c.id === seleccionado) && busqueda === '') {
      setSeleccionado(null)
    }
  }, [clientes, seleccionado, busqueda])

  const elegir = id => { setError(''); setModo('ver'); setSeleccionado(id) }

  const acciones = {
    async guardarCliente(datos) {
      setError('')
      try {
        if (modo === 'nuevo') {
          const creado = await pedir(`${API}/clientes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
          })
          await cargarClientes(busqueda)
          setSeleccionado(creado.id)
        } else {
          await pedir(`${API}/clientes/${seleccionado}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos),
          })
          await cargarClientes(busqueda)
        }
        setModo('ver')
      } catch (e) { fallar(e) }
    },

    async eliminarCliente() {
      setError('')
      try {
        await pedir(`${API}/clientes/${seleccionado}`, { method: 'DELETE' })
        setSeleccionado(null)
        setModo('ver')
        await cargarClientes(busqueda)
      } catch (e) { fallar(e) }
    },

    async crearActividad(datos) {
      setError('')
      try {
        await pedir(`${API}/clientes/${seleccionado}/actividades`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        })
        await cargarActividades(seleccionado)
      } catch (e) { fallar(e) }
    },

    async editarActividad(id, datos) {
      setError('')
      try {
        await pedir(`${API}/actividades/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos),
        })
        await cargarActividades(seleccionado)
      } catch (e) { fallar(e) }
    },

    async completarActividad(id) {
      setError('')
      try {
        await pedir(`${API}/actividades/${id}/completar`, { method: 'PATCH' })
        await cargarActividades(seleccionado)
      } catch (e) { fallar(e) }
    },

    async eliminarActividad(id) {
      setError('')
      try {
        await pedir(`${API}/actividades/${id}`, { method: 'DELETE' })
        await cargarActividades(seleccionado)
      } catch (e) { fallar(e) }
    },
  }

  return (
    <div className="app">
      <header className="barra">MiniCRM</header>

      <div className="cuerpo">
        <ListaClientes
          clientes={clientes}
          seleccionado={seleccionado}
          onSeleccionar={elegir}
          busqueda={busqueda}
          onBuscar={setBusqueda}
          onAgregar={() => { setError(''); setSeleccionado(null); setModo('nuevo') }}
        />

        <div className="tarjeta">
          {error && <p className="error">{error}</p>}

          {modo === 'nuevo' && (
            <FormCliente
              inicial={null}
              onGuardar={acciones.guardarCliente}
              onCancelar={() => setModo('ver')}
            />
          )}

          {modo === 'editar' && cliente && (
            <FormCliente
              inicial={cliente}
              onGuardar={acciones.guardarCliente}
              onCancelar={() => setModo('ver')}
            />
          )}

          {modo === 'ver' && cliente && (
            <FichaCliente
              cliente={cliente}
              actividades={actividades}
              onEditar={() => setModo('editar')}
              onEliminar={acciones.eliminarCliente}
              acciones={acciones}
            />
          )}

          {modo === 'ver' && !cliente && (
            <div className="sin-seleccion">
              <p>Elegí un cliente de la lista para ver su ficha.</p>
            </div>
          )}
        </div>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
