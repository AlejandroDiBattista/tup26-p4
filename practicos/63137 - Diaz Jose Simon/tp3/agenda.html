<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font: 16px sans-serif;
      color: #2d3b30;
      background: #f5f6f4;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: auto;

      > header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;

        h1 {
          margin: 0;
          font-size: 28px;
        }

        input[type="search"] {
          width: 300px;
          max-width: 100%;
          padding: 12px 20px;
          border: 1px solid #d9ded9;
          border-radius: 999px;
          font: inherit;
          font-size: 14px;
          background: #fffffc;
        }

        button {
          padding: 12px 20px;
          border: 0;
          border-radius: 999px;
          font: inherit;
          font-size: 14px;
          font-weight: 700;
          color: white;
          background: #2d3b30;
          cursor: pointer;
        }
      }

      > section {
        display: grid;
        grid-template-columns: repeat(3, 360px);
        justify-content: center;
        gap: 12px;

        @media (max-width: 1120px) {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        @media (max-width: 700px) {
          grid-template-columns: 1fr;
        }

        > article {
          position: relative;
          display: flex;
          flex-direction: column;
          gap: 24px;
          min-width: 0;
          padding: 20px;
          border: 1px solid #d9ded9;
          border-radius: 16px;
          background: #fffffc;
          box-shadow: 0 2px 8px rgb(45 59 48 / 8%);

          h2 {
            margin: 0;
            padding-right: 36px;
            font-weight: 400;
            font-size: 16px;
            color: #5c675f;

            strong {
              font: 700 24px Georgia, serif;
              color: #2d3b30;
            }
          }

          button {
            position: absolute;
            top: 14px;
            right: 16px;
            padding: 0;
            border: 0;
            font-size: 24px;
            line-height: 1;
            color: #8a7a4a;
            background: none;
            cursor: pointer;
          }

          address {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-style: normal;

            > :first-child {
              font-weight: 600;
              font-size: 14px;
            }

            > :last-child {
              font-size: 13px;
              color: #5c675f;
            }
          }

          footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #d9ded9;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #5c675f;
          }
        }
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }

    const CLAVE_ALMACENAMIENTO = 'agenda-alumnos'
    const CONFIGURACION_REGIONAL = 'es-AR'

    const estado = reactive({
      alumnos: cargarAlumnos(),
    })
    function cargarAlumnos() {
      const alumnosGuardados = localStorage.getItem(CLAVE_ALMACENAMIENTO)
      if (alumnosGuardados) {
        return JSON.parse(alumnosGuardados)
      }
      return alumnosIniciales
    }

    function guardarAlumnos(alumnosSerializados) {
      localStorage.setItem(CLAVE_ALMACENAMIENTO, alumnosSerializados)
    }

    watch(() => JSON.stringify(estado.alumnos), guardarAlumnos)

    function compararTexto(textoA, textoB) {
      return textoA.localeCompare(textoB, CONFIGURACION_REGIONAL, { sensitivity: 'base' })
    }

    function compararAlumnos(alumnoA, alumnoB) {
      return Number(alumnoB.favorito) - Number(alumnoA.favorito)
        || compararTexto(alumnoA.apellido, alumnoB.apellido)
        || compararTexto(alumnoA.nombre, alumnoB.nombre)
    }

    function obtenerAlumnosOrdenados() {
      return estado.alumnos.toSorted(compararAlumnos)
    }

    const Cabecera = () => html`
      <header>
        <h1>Agenda</h1>
        <div>
          <input type="search" placeholder="Buscar alumno...">
          <button type="button">+ Agregar</button>
        </div>
      </header>
    `
    const Tarjeta = alumno => html`
      <article>
        <h2><strong>${alumno.apellido}</strong> ${alumno.nombre}</h2>
        <button type="button" aria-label="Favorito" aria-pressed="${() => alumno.favorito}">
          ${() => alumno.favorito ? '★' : '☆'}
        </button>
        <address>
          <span>${alumno.telefono}</span>
          <span>@${alumno.github}</span>
        </address>
        <footer>${alumno.comision} · ${alumno.legajo}</footer>
      </article>
    `.key(alumno.id)
    const Agenda = () => html`
      <section>
        ${() => obtenerAlumnosOrdenados().map(Tarjeta)}
      </section>
    `

    html`${Cabecera()}${Agenda()}`(document.getElementById('app'))
  </script>
</body>
</html>
