<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font: 16px sans-serif;
      color: #2d3b30;
      background: #f5f6f4;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: auto;

      > header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;

        h1 {
          margin: 0;
          font-size: 28px;
        }

        input[type="search"] {
          width: 300px;
          max-width: 100%;
          padding: 12px 20px;
          border: 1px solid #d9ded9;
          border-radius: 999px;
          font: inherit;
          font-size: 14px;
          background: #fffffc;
        }

        button {
          padding: 12px 20px;
          border: 0;
          border-radius: 999px;
          font: inherit;
          font-size: 14px;
          font-weight: 700;
          color: white;
          background: #2d3b30;
          cursor: pointer;
        }
      }

      > section {
        display: grid;
        grid-template-columns: repeat(3, 360px);
        justify-content: center;
        gap: 12px;

        @media (max-width: 1120px) {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        @media (max-width: 700px) {
          grid-template-columns: 1fr;
        }

        > p {
          grid-column: 1 / -1;
          margin: 40px 0;
          text-align: center;
          color: #5c675f;
        }

        > article {
          position: relative;
          cursor: pointer;
          display: flex;
          flex-direction: column;
          gap: 24px;
          min-width: 0;
          padding: 20px;
          border: 1px solid #d9ded9;
          border-radius: 16px;
          background: #fffffc;
          box-shadow: 0 2px 8px rgb(45 59 48 / 8%);

          h2 {
            margin: 0;
            padding-right: 36px;
            font-weight: 400;
            font-size: 16px;
            color: #5c675f;

            strong {
              font: 700 24px Georgia, serif;
              color: #2d3b30;
            }
          }

          button {
            position: absolute;
            top: 14px;
            right: 16px;
            padding: 0;
            border: 0;
            font-size: 24px;
            line-height: 1;
            color: #8a7a4a;
            background: none;
            cursor: pointer;
          }

          address {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-style: normal;

            > :first-child {
              font-weight: 600;
              font-size: 14px;
            }

            > :last-child {
              font-size: 13px;
              color: #5c675f;
            }
          }

          footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #d9ded9;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #5c675f;
          }
        }
      }

      > dialog {
        width: 620px;
        max-width: 92vw;
        padding: 0;
        border: 8px solid #cdd9d0;
        border-radius: 28px;
        color: #2d3b30;
        background: #fffffc;

        &::backdrop {
          background: rgb(45 59 48 / 40%);
          backdrop-filter: blur(6px);
        }

        form {
          > header {
            display: block;
            margin: 0;
            padding: 20px 18px;
            border-bottom: 1px solid #d9ded9;
            background: #f5f6f4;

            h2 {
              margin: 0 0 4px;
              font-size: 22px;
            }

            p {
              margin: 0;
              font-size: 14px;
              color: #5c675f;
            }
          }

          > div {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 16px;
            padding: 20px 18px;

            @media (max-width: 700px) {
              grid-template-columns: 1fr;
            }

            label {
              display: flex;
              flex-direction: column;
              gap: 6px;
              font-size: 12px;
              font-weight: 700;
              color: #5c675f;
            }

            input {
              padding: 12px;
              border: 1px solid #d9ded9;
              border-radius: 10px;
              font: inherit;
              font-size: 15px;
              font-weight: 400;
              color: #2d3b30;
              background: #f1f2ef;

              &:focus {
                outline: 2px solid #2d3b30;
                background: #fffffc;
              }
            }
          }

          > footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 14px 18px;
            border-top: 1px solid #d9ded9;

            button {
              padding: 10px 16px;
              border: 1px solid #d9ded9;
              border-radius: 10px;
              font: inherit;
              font-size: 14px;
              font-weight: 700;
              color: #2d3b30;
              background: #fffffc;
              cursor: pointer;

              &[type="submit"] {
                border-color: #2d3b30;
                color: white;
                background: #2d3b30;
              }

              &:first-child[type="button"] {
                margin-right: auto;
                color: #c0443a;
              }
            }
          }
        }
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }

    const CLAVE_ALMACENAMIENTO = 'agenda-alumnos'
    const CONFIGURACION_REGIONAL = 'es-AR'
    const CAMPOS_BUSCABLES = ['apellido', 'nombre', 'telefono', 'github', 'comision', 'legajo']
    const ALUMNO_NUEVO = { apellido: '', nombre: '', legajo: '', comision: '', telefono: '', github: '' }
    const TEXTOS_DE_ALTA = { titulo: 'Agregar alumno', descripcion: 'Ingresá los datos del alumno.' }
    const TEXTOS_DE_EDICION = { titulo: 'Editar alumno', descripcion: 'Actualizá los datos del alumno.' }
    const CAMPOS_DEL_FORMULARIO = [
      { nombre: 'apellido', etiqueta: 'Apellido' },
      { nombre: 'nombre', etiqueta: 'Nombre' },
      { nombre: 'legajo', etiqueta: 'Legajo' },
      { nombre: 'comision', etiqueta: 'Comisión' },
      { nombre: 'telefono', etiqueta: 'Teléfono' },
      { nombre: 'github', etiqueta: 'GitHub' },
    ]

    const estado = reactive({
      alumnos: cargarAlumnos(),
      busqueda: '',
      formularioAbierto: false,
      esEdicion: false,
      alumnoEnFormulario: ALUMNO_NUEVO,
    })
    function cargarAlumnos() {
      const alumnosGuardados = localStorage.getItem(CLAVE_ALMACENAMIENTO)
      if (alumnosGuardados) {
        return JSON.parse(alumnosGuardados)
      }
      return alumnosIniciales
    }

    function guardarAlumnos(alumnosSerializados) {
      localStorage.setItem(CLAVE_ALMACENAMIENTO, alumnosSerializados)
    }

    watch(() => JSON.stringify(estado.alumnos), guardarAlumnos)

    function compararTexto(textoA, textoB) {
      return textoA.localeCompare(textoB, CONFIGURACION_REGIONAL, { sensitivity: 'base' })
    }

    function compararAlumnos(alumnoA, alumnoB) {
      return Number(alumnoB.favorito) - Number(alumnoA.favorito)
        || compararTexto(alumnoA.apellido, alumnoB.apellido)
        || compararTexto(alumnoA.nombre, alumnoB.nombre)
    }

    function obtenerAlumnosOrdenados() {
      return estado.alumnos.toSorted(compararAlumnos)
    }

    function normalizarTexto(texto) {
      return texto
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim()
    }

    function coincideConBusqueda(alumno) {
      const textoBuscado = normalizarTexto(estado.busqueda)
      return CAMPOS_BUSCABLES.some(campo => normalizarTexto(alumno[campo]).includes(textoBuscado))
    }

    function obtenerAlumnosVisibles() {
      return obtenerAlumnosOrdenados().filter(coincideConBusqueda)
    }

    function actualizarBusqueda(textoBuscado) {
      estado.busqueda = textoBuscado
    }

    function generarIdentificador() {
      return Math.max(0, ...estado.alumnos.map(alumno => alumno.id)) + 1
    }

    function agregarAlumno(datosDelAlumno) {
      estado.alumnos.push({ id: generarIdentificador(), ...datosDelAlumno, favorito: false })
    }

    function actualizarAlumno(idAlumno, datosDelAlumno) {
      const alumno = estado.alumnos.find(alumnoBuscado => alumnoBuscado.id === idAlumno)
      Object.assign(alumno, datosDelAlumno)
    }

    function eliminarAlumno(idAlumno) {
      estado.alumnos = estado.alumnos.filter(alumno => alumno.id !== idAlumno)
    }

    function abrirFormularioDeAlta() {
      estado.alumnoEnFormulario = ALUMNO_NUEVO
      estado.esEdicion = false
      estado.formularioAbierto = true
    }

    function abrirFormularioDeEdicion(alumno) {
      estado.alumnoEnFormulario = { ...alumno }
      estado.esEdicion = true
      estado.formularioAbierto = true
    }

    function cerrarFormulario() {
      estado.formularioAbierto = false
    }

    function guardarAlumnoDelFormulario(datosDelAlumno) {
      if (estado.esEdicion) {
        actualizarAlumno(estado.alumnoEnFormulario.id, datosDelAlumno)
        return
      }
      agregarAlumno(datosDelAlumno)
    }

    function alternarFavorito(idAlumno) {
      const alumno = estado.alumnos.find(alumnoBuscado => alumnoBuscado.id === idAlumno)
      alumno.favorito = !alumno.favorito
    }

    const Cabecera = () => html`
      <header>
        <h1>Agenda</h1>
        <div>
          <input
            type="search"
            placeholder="Buscar alumno..."
            @input="${evento => actualizarBusqueda(evento.target.value)}"
          >
          <button type="button" @click="${abrirFormularioDeAlta}">+ Agregar</button>
        </div>
      </header>
    `
    function alternarFavoritoDesdeTarjeta(evento, idAlumno) {
      evento.stopPropagation()
      alternarFavorito(idAlumno)
    }

    const Tarjeta = alumno => html`
      <article @click="${() => abrirFormularioDeEdicion(alumno)}">
        <h2><strong>${alumno.apellido}</strong> ${alumno.nombre}</h2>
        <button
          type="button"
          aria-label="Favorito"
          aria-pressed="${() => alumno.favorito}"
          @click="${evento => alternarFavoritoDesdeTarjeta(evento, alumno.id)}"
        >
          ${() => alumno.favorito ? '★' : '☆'}
        </button>
        <address>
          <span>${alumno.telefono}</span>
          <span>@${alumno.github}</span>
        </address>
        <footer>${alumno.comision} · ${alumno.legajo}</footer>
      </article>
    `.key(alumno.id)
    const SinResultados = () => html`<p>No hay alumnos para mostrar.</p>`
    const Agenda = () => html`
      <section>
        ${() => {
          const alumnosVisibles = obtenerAlumnosVisibles()
          return alumnosVisibles.length > 0 ? alumnosVisibles.map(Tarjeta) : [SinResultados()]
        }}
      </section>
    `

    function leerDatosDelFormulario(formulario) {
      const campos = [...new FormData(formulario)]
      return Object.fromEntries(campos.map(([nombreCampo, valor]) => [nombreCampo, valor.trim()]))
    }

    function enviarFormulario(evento) {
      evento.preventDefault()
      guardarAlumnoDelFormulario(leerDatosDelFormulario(evento.target))
      cerrarFormulario()
    }

    function eliminarAlumnoDelFormulario() {
      eliminarAlumno(estado.alumnoEnFormulario.id)
      cerrarFormulario()
    }

    const CampoDelFormulario = (campo, alumno) => html`
      <label>
        ${campo.etiqueta}
        <input
          name="${campo.nombre}"
          value="${alumno[campo.nombre]}"
          required
          pattern=".*[^ ].*"
          title="Este campo no puede estar vacío"
        >
      </label>
    `.key(campo.nombre)
    const BotonEliminar = () => html`
      <button type="button" @click="${eliminarAlumnoDelFormulario}">Eliminar</button>
    `
    const FormularioDeAlumno = (alumno, esEdicion) => html`
      <form @submit="${enviarFormulario}">
        <header>
          <h2>${esEdicion ? TEXTOS_DE_EDICION.titulo : TEXTOS_DE_ALTA.titulo}</h2>
          <p>${esEdicion ? TEXTOS_DE_EDICION.descripcion : TEXTOS_DE_ALTA.descripcion}</p>
        </header>
        <div>${CAMPOS_DEL_FORMULARIO.map(campo => CampoDelFormulario(campo, alumno))}</div>
        <footer>
          ${esEdicion ? [BotonEliminar()] : []}
          <button type="submit">Guardar</button>
          <button type="button" @click="${cerrarFormulario}">Cancelar</button>
        </footer>
      </form>
    `
    const DialogoDeAlumno = () => html`
      <dialog @close="${cerrarFormulario}">
        ${() => estado.formularioAbierto
          ? [FormularioDeAlumno(estado.alumnoEnFormulario, estado.esEdicion)]
          : []}
      </dialog>
    `

    html`${Cabecera()}${Agenda()}${DialogoDeAlumno()}`(document.getElementById('app'))

    const dialogo = document.querySelector('main > dialog')

    function sincronizarDialogo(formularioAbierto) {
      if (formularioAbierto) {
        dialogo.showModal()
        return
      }
      dialogo.close()
    }

    watch(() => estado.formularioAbierto, sincronizarDialogo)
  </script>
</body>
</html>
