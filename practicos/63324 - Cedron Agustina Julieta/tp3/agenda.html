<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    
    /*cada tarjeta individual*/
    li.tarjeta{
      min-width: 0;
      padding: 22px 24px;
      border: 1px solid #e1e4dc;
      border-radius: 18px;
      background: #ffffff;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
    }
  /*cabecera para el nombre y estrella */
  .tarjeta-cabecera{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  /*nombre y apellido*/
  .nombre{
    margin: 0;
    font-size: 1.15rem;
    font-weight: 400;
    color: #2b3321;
  }
  .nombre .apellido{
    font-family: Georgia, 'Times New Roman', Times, serif;
    font-weight: 700;
    font-size: 1.25rem;
    color: #171d12;
  }
  /*boton de la estrellita*/
  .btn-fav{
    background: none;
    border:none;
    font-size: 1.5rem;
    cursor: pointer;
    color:#736b46;
    line-height: 1;
    padding: 0;
  }
  /*telefono y github*/
  .tarjeta-contacto .telefono{
    font-weight: 600;
    color:#222a1d;
  }
  /*pie de la tarjeta*/
  .tarjeta-pie{
    border-top: 1px solid #edf0e9;
    padding-top: 12px;
    font-size: 0.85rem;
    color: #7a8275;
    font-weight: 500;
  }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>
<script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')
    const clave_storage = 'agenda_alumnos'

    // Obtener los datos del localstorage o del json inicial
    const datosGuardados = localStorage.getItem(clave_storage)
    let listaInicial = datosGuardados ? JSON.parse(datosGuardados) : alumnos

    if (!datosGuardados) {
      localStorage.setItem(clave_storage, JSON.stringify(listaInicial))
    }

    // Crear el estado reactivo con arrowjs
    const estado = reactive({
      alumnos: listaInicial,
      busqueda: '',
      modalAbierto:false,
      modoEdicion:false,
      alumnoForm:{
        id:'',
        apellido:'',
        nombre:'',
        legajo:'',
        comision:'',
        telefono:'',
        github:'',
        favorito:false        
      }
    })

    // Guardar automaticamente cada vez que la lista cambie
    watch(() => {
      localStorage.setItem(clave_storage, JSON.stringify(estado.alumnos))
    })

    // Normalizar el texto
    function normalizar(texto) {
      return (texto || '')
        .toLowerCase()
        .replaceAll('á', 'a')
        .replaceAll('é', 'e')
        .replaceAll('í', 'i')
        .replaceAll('ó', 'o')
        .replaceAll('ú', 'u')
    }

    // Funcion para filtrar
    function obtenerAlumnos() {
      const termino = normalizar(estado.busqueda.trim())
      let lista= estado.alumnos
      if (termino) {
        lista= lista.filter(a=>
        normalizar(a.nombre).includes(termino) ||
        normalizar(a.apellido).includes(termino)
      )
      }
      return [...lista].sort((a,b)=>{
        //los favorito primero
        if (a.favorito!==b.favorito) {
          return a.favorito ?-1:1
        }
        //apellido, sin distinguir mayusuculas y minusculas
        const compApellido=a.apellido.localeCompare(b.apellido, 'es',{sensitivity: 'base'})
      if (comApellido !==0)return compApellido
      })
      return a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base'})

    }

    // Alternar favorito
    function alternarFavorito(evento, legajo) {
      evento.stopPropagation()
      const copia = [...estado.alumnos]
      const index = copia.findIndex(a => a.legajo === legajo)
      if (index !== -1) {
        copia[index].favorito = !copia[index].favorito
        estado.alumnos = copia
      }
    }
    //abrir para crear un alumno nuevo
    function abrirModalNuevo(){
      estado.modoEdicion=false
      estado.alumnoForm={
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        apellido:'',
        nombre:'',
        legajo:'',
        comision:'',
        telefono:'',
        github:'',
        favorito:false  
      }
      estado.modalAbierto=true
    }
    // abrir para editar un alumno existente
    function abrirModalEdicion(){
      estado.modoEdicion=true
      estado.alumnoForm={...alumno}
      estado.modalAbiert=true
    }
    // cerrar modal
    function cerrarModal(){
      estado.modalAbierto=false
    }
    
    // guardar alumno
    function guardarAlumno(evento){
      evento.preventDefault()
      const copia=[...estado.alumnos]
      if (estado.modoEdicion) {
        const index= copia.findIndex(a=>a.id=== estado.alumnoForm.id || a.legajo=== estado.alumnoForm.legajo)
        if (index!==-1) {
          copia[index]={...estado.alumnoForm}
        }
      }else{
        copia.push({...estado.alumnoForm})
      }
      estado.alumnos=copia
      cerrarModal()
    }
    // eliminar alumno
    function eliminarAlumno(){
      if (confirm(`¿Eliminar a ${estado.alumnoForm.nombre} ${estado.alumnoForm.apellido}?`)) {
       estados.alumnos= estado.alumnos.filter(a=>
        a.id ? a.id !== estado.alumnoForm.id : a.legajo !== estado.alumnoForm.legajo
       ) 
       cerrarModal()
      }
    }
    //accesibilidad con teclado en las tarjetas
    function manejarTarjeta(eventi,alumno){
      if (evento.key ==='Enter') {
        evento.preventDefault()
        abrirModalEdicion(alumno)
      }else if (evento.key=== ' ') {
        evento.preventDefault()
        alternarFavorito(evento.alumno.legajo)
      }
    }

    html`
      <h1>Alumnos (${() => obtenerAlumnos().length})</h1>
      <input
        type="search"
        placeholder="Buscar por nombre o apellido"
        @input="${(e) => { estado.busqueda = e.target.value }}"
      >
      <ul>
        ${() => {
          const lista = obtenerAlumnos()

          if (lista.length === 0) {
            return [html`<li style="grid-column: 1 / -1; text-align: center; color: #7a8275; padding: 20px;">No se encontraron alumnos</li>`]
          }

          return lista.map((alumno) => html`
            <li tabindex="0" class="tarjeta">
              <div class="tarjeta-cabecera">
                <h2 class="nombre">
                  <span class="apellido">${alumno.apellido}</span> ${alumno.nombre}
                </h2>
                <button
                  type="button"
                  class="btn-fav"
                  aria-label="Marcar favorito"
                  @click="${(e) => alternarFavorito(e, alumno.legajo)}"
                >
                  ${alumno.favorito ? '★' : '☆'}
                </button>
              </div>
              <div class="tarjeta-contacto">
                <p class="telefono">${alumno.telefono}</p>
                <p class="github">@${alumno.github}</p>
              </div>
              <div class="tarjeta-pie">
                <span>${alumno.comision} ·${alumno.legajo}</span>
              </div>
            </li>
          `)
        }}
      </ul>
    `(app)
  </script>
  </body>
</html>
