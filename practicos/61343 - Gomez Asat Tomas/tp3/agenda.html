<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    li.empty { grid-column: 1 / -1; text-align: center; padding: 40px; color: #6b756b; border-style: dashed; }
    header.app-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .toolbar { display: flex; gap: 10px; align-items: center;
      input[type="search"] { padding: 10px 14px; border: 1px solid #d9ded9; border-radius: 10px; min-width: 220px; font-size: 15px; }
       button { padding: 10px 18px; border: none; border-radius: 10px; background: #233524; color: #fff; font-weight: 600; cursor: pointer;
        &:hover { background: #1a2818; }}}
    article { cursor: pointer; outline: none; 
      &:focus-visible { box-shadow: 0 0 0 3px rgba(35, 53, 36, .12); border-radius: 12px; }
      & > header { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px;
        strong { font-size: 17px; margin-right: 6px; }
        .fav { margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: #d9b431; line-height: 1; padding: 0;
            &:hover { transform: scale(1.15); }}}  
      address { font-style: normal; color: #3c463c; line-height: 1.5; margin: 0 0 12px; }
       footer { color: #6b756b; font-size: 14px;} }
       dialog { width: 460px; max-width: 90vw; border: none; border-radius: 16px; padding: 24px; background: white; 
         &::backdrop { background: rgba(10, 15, 10, .55); }
         h2 { margin: 0 0 4px; font-size: 20px; }
         p  { margin: 0 0 20px; color: #6b756b; font-size: 14px; }
         .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px;
            label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3c463c;
              input { padding: 10px 12px; border: 1px solid #d9ded9; border-radius: 8px; font-size: 15px;
                &:focus { outline: 2px solid #233524; }}}}
         form > footer { display: flex; align-items: center; justify-content: space-between;       
          .danger { background: none; border: none; color: #c0392b; font-weight: 600; cursor: pointer; padding: 8px 4px;
             &:hover { text-decoration: underline; }}
             .actions { display: flex; gap: 10px; margin-left: auto;
              button { padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-weight: 600;}
               button[type="submit"] { background: #233524; color: white;
                &:hover { background: #1a2818; }}
                button[type="button"]:not(.danger) { background: #f1f2f0; color: #333; border-color: #d9ded9;
                  &:hover { background: #e7e9e6; }}}}}
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')
    html`
      <h1>Alumnos</h1>
      <ul>
        ${alumnos.map(a => html`<li>${a.nombre} <b>${a.apellido}</b></li>`)}
      </ul>
    `(app)




















































































































    
  </script>
</body> 
</html>
