<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>MiniCRM · Clientes</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; }
      body { margin: 0; min-width: 320px; overflow: hidden; }
      button { font: inherit; }

      .topbar {
        height: 72px;
        display: flex;
        align-items: center;
        padding: 0 clamp(20px, 5vw, 72px);
        background: #fff;
        border-bottom: 1px solid #e7ebf2;
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: -0.03em; }
      .brand-mark {
        width: 36px; height: 36px; display: grid; place-items: center;
        border-radius: 11px; color: #fff; background: #3159d9; font-size: 15px;
      }
      .brand-name { font-size: 17px; }
      .brand-subtitle { margin-left: 2px; color: #8792a5; font-size: 13px; font-weight: 500; letter-spacing: 0; }

      main { width: min(1320px, calc(100% - 40px)); height: calc(100% - 72px); min-height: 0; margin: 0 auto; padding: 28px 0; display: flex; flex-direction: column; }
      .heading-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .eyebrow { margin: 0 0 8px; color: #64748b; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
      h1 { margin: 0; color: #172033; font-size: clamp(26px, 4vw, 34px); letter-spacing: -.045em; }
      .description { margin: 9px 0 0; color: #748095; font-size: 15px; }
      .count { flex: none; padding: 9px 13px; border: 1px solid #e2e8f0; border-radius: 999px; background: #fff; color: #516078; font-size: 13px; }
      .count strong { color: #24324a; }

      .panel { overflow: hidden; border: 1px solid #e5eaf1; border-radius: 16px; background: #fff; box-shadow: 0 8px 28px rgba(20, 37, 71, .045); }
      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 19px 22px; border-bottom: 1px solid #edf0f5; }
      .panel-title { margin: 0; font-size: 15px; font-weight: 700; }
      .refresh {
        display: inline-flex; align-items: center; gap: 8px; padding: 8px 11px;
        border: 1px solid #dce3ed; border-radius: 9px; background: #fff;
        color: #40516c; cursor: pointer; font-size: 13px; font-weight: 600;
      }
      .refresh:hover { background: #f8faff; border-color: #b9c8e2; }
      .refresh:disabled { opacity: .55; cursor: wait; }
      .refresh svg { width: 15px; height: 15px; }

      .workspace { display: grid; grid-template-columns: minmax(280px, .82fr) minmax(0, 1.45fr); gap: 20px; flex: 1; min-height: 0; }
      .master-panel { display: flex; flex-direction: column; min-height: 0; }
      .detail-column { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
      .table-wrap { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
      table { width: 100%; border-collapse: collapse; text-align: left; }
      th { padding: 12px 22px; background: #fafbfc; color: #78859a; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      thead { position: sticky; top: 0; z-index: 1; }
      td { padding: 15px 22px; border-top: 1px solid #edf0f5; color: #56647a; font-size: 14px; }
      tbody tr:hover { background: #fbfcff; }
      td:first-child { width: 76px; color: #8994a7; font-variant-numeric: tabular-nums; }
      .person { display: flex; align-items: center; gap: 11px; min-width: 200px; color: #27344b; font-weight: 650; }
      .avatar { width: 34px; height: 34px; display: grid; flex: none; place-items: center; border-radius: 50%; background: #edf2ff; color: #3659c5; font-size: 12px; font-weight: 750; text-transform: uppercase; }
      .muted { color: #8994a7; }

      .state { padding: 48px 22px; text-align: center; color: #718096; }
      .state strong { display: block; margin-bottom: 6px; color: #344258; font-size: 15px; }
      .state p { margin: 0; font-size: 14px; }
      .state.error strong { color: #b42332; }
      .footer { padding: 16px 22px; border-top: 1px solid #edf0f5; color: #97a1b1; font-size: 12px; }
      .heading-actions { display: flex; align-items: center; gap: 10px; }
      .primary, .secondary {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 38px; padding: 8px 13px; border-radius: 9px; cursor: pointer;
        font-size: 13px; font-weight: 650; transition: background .15s, border-color .15s;
      }
      .primary { border: 1px solid #3159d9; background: #3159d9; color: #fff; }
      .primary:hover { border-color: #254bc2; background: #254bc2; }
      .secondary { border: 1px solid #dce3ed; background: #fff; color: #40516c; }
      .secondary:hover { border-color: #b9c8e2; background: #f8faff; }
      .primary:disabled, .secondary:disabled { opacity: .6; cursor: wait; }
      .clickable-row { cursor: pointer; }
      .clickable-row.selected { background: #f0f4ff; }
      .clickable-row:focus-visible { outline: 2px solid #3159d9; outline-offset: -2px; }
      .detail-panel { margin-top: 20px; }
      .detail-body { padding: 24px 22px; }
      .detail-grid, .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; }
      .detail-item dt { margin-bottom: 7px; color: #8490a3; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      .detail-item dd { margin: 0; color: #29364d; font-size: 14px; font-weight: 550; overflow-wrap: anywhere; }
      .client-form { display: grid; gap: 19px; }
      .field { display: grid; gap: 7px; min-width: 0; }
      .field label { color: #536178; font-size: 12px; font-weight: 650; }
      .field input { width: 100%; height: 41px; padding: 0 11px; border: 1px solid #dce3ed; border-radius: 8px; outline: none; color: #26344b; background: #fff; font: inherit; font-size: 14px; }
      .field input:focus { border-color: #6685e7; box-shadow: 0 0 0 3px rgba(49, 89, 217, .12); }
      .form-error { margin: 0; color: #b42332; font-size: 13px; }
      .form-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 3px; }
      .activity-panel { margin-top: 20px; }
      .detail-column .detail-panel, .detail-column .activity-panel { margin-top: 0; }
      .search-input { width: min(280px, 45vw); height: 38px; padding: 0 11px; border: 1px solid #dce3ed; border-radius: 8px; color: #26344b; font: inherit; font-size: 13px; }
      .search-input:focus { outline: 2px solid rgba(49,89,217,.18); border-color: #6685e7; }
      .search-bar { padding: 12px 18px; border-bottom: 1px solid #edf0f5; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .detail-placeholder { margin: 0; }
      .activity-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 18px; }
      .activity-group { min-width: 0; overflow: hidden; border: 1px solid #e8edf4; border-radius: 12px; background: #fff; }
      .activity-group-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 15px; border-bottom: 1px solid #edf0f5; }
      .activity-group-head h3 { margin: 0; color: #344258; font-size: 13px; font-weight: 700; }
      .activity-number { min-width: 25px; padding: 4px 7px; border-radius: 999px; background: #f0f3f8; color: #64748b; text-align: center; font-size: 11px; font-weight: 700; }
      .activity-scroll { max-height: 320px; overflow-y: auto; overscroll-behavior: contain; scrollbar-color: #cbd5e1 transparent; scrollbar-width: thin; }
      .activity-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 14px 15px; border-bottom: 1px solid #f0f2f6; }
      .activity-row:last-child { border-bottom: 0; }
      .activity-description { min-width: 0; color: #344258; font-size: 13px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
      .activity-date { display: flex; flex: none; flex-direction: column; align-items: flex-end; gap: 6px; color: #748095; font-size: 11px; text-align: right; white-space: nowrap; }
      .activity-badge { padding: 4px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }
      .activity-badge.undated { background: #f1f3f6; color: #697589; }
      .activity-badge.overdue { background: #fff0ee; color: #b5473c; }
      .activity-badge.today { background: #fff7e6; color: #a66a00; }
      .activity-badge.upcoming { background: #edf3ff; color: #3b5fba; }
      .activity-badge.completed { background: #eaf7ef; color: #287548; }
      .activity-state { padding: 28px 14px; color: #8994a7; font-size: 12px; text-align: center; }
      .activity-state.error { color: #b42332; }
      .activity-editor { margin: 18px 18px 0; padding: 18px; border: 1px solid #e4eaf3; border-radius: 12px; background: #fafbfe; }
      .activity-editor-title { margin: 0 0 15px; color: #344258; font-size: 14px; font-weight: 700; }
      .activity-textarea { width: 100%; min-height: 82px; padding: 10px 11px; resize: vertical; border: 1px solid #dce3ed; border-radius: 8px; outline: none; color: #26344b; background: #fff; font: inherit; font-size: 14px; }
      .activity-textarea:focus, .field input[type="date"]:focus { border-color: #6685e7; box-shadow: 0 0 0 3px rgba(49, 89, 217, .12); }
      .activity-actions { display: flex; flex: none; align-items: center; gap: 5px; }
      .icon-action { width: 32px; height: 32px; display: inline-grid; place-items: center; padding: 0; border: 1px solid #e1e6ef; border-radius: 8px; background: #fff; color: #52627a; cursor: pointer; }
      .icon-action:hover { border-color: #c3cee0; background: #f7f9fc; color: #294a9d; }
      .icon-action.complete { color: #287548; }
      .icon-action.complete:hover { border-color: #abd6ba; background: #f0faf3; }
      .icon-action.delete { color: #ad3b43; }
      .icon-action.delete:hover { border-color: #ecc0c2; background: #fff6f5; }
      .icon-action:disabled { opacity: .45; cursor: wait; }
      .icon-action svg { width: 15px; height: 15px; }
      .activity-action-error { margin: 14px 18px 0; color: #b42332; font-size: 13px; }
      .detail-actions { display: flex; align-items: center; gap: 8px; }
      .danger-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 8px 12px; border: 1px solid #efc7c8; border-radius: 9px; background: #fff; color: #a3363d; cursor: pointer; font: inherit; font-size: 13px; font-weight: 650; }
      .danger-button:hover { border-color: #df9b9d; background: #fff7f6; }
      .danger-button:disabled { opacity: .55; cursor: wait; }
      .danger-button svg { width: 15px; height: 15px; }
      .delete-client-error { margin: 0 22px 18px; color: #b42332; font-size: 13px; }

      @media (max-width: 650px) {
        main { width: calc(100% - 24px); height: calc(100% - 64px); padding: 18px 0; }
        .heading-row { align-items: flex-start; flex-direction: column; }
        .count { align-self: flex-start; }
        .heading-actions { width: 100%; flex-wrap: wrap; }
        th, td { padding-right: 15px; padding-left: 15px; }
        .topbar { height: 64px; }
        .brand-subtitle { display: none; }
        .detail-body { padding: 20px 16px; }
        .detail-grid, .form-row { grid-template-columns: 1fr; gap: 16px; }
        .activity-columns { grid-template-columns: 1fr; padding: 12px; }
        .activity-editor { margin: 12px 12px 0; padding: 15px; }
        .activity-row { flex-wrap: wrap; }
        .activity-actions { margin-left: auto; }
        .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(180px, 38%) minmax(0, 1fr); gap: 12px; }
        .panel-head { padding: 14px; }
        .detail-column { gap: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script>
      Babel.registerPreset("react-classic", {
        presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
      });
    </script>
    <script type="text/babel" data-presets="env,react-classic">
      const { useEffect, useState } = React;

      function iniciales(cliente) {
        return `${cliente.nombre?.[0] ?? ""}${cliente.apellido?.[0] ?? ""}`;
      }

      function App() {
        const [clientes, setClientes] = useState([]);
        const [clientesVisibles, setClientesVisibles] = useState([]);
        const [busqueda, setBusqueda] = useState("");
        const [buscando, setBuscando] = useState(false);
        const [errorBusqueda, setErrorBusqueda] = useState("");
        const [cargando, setCargando] = useState(true);
        const [error, setError] = useState("");
        const [actualizacion, setActualizacion] = useState(0);
        const [clienteSeleccionado, setClienteSeleccionado] = useState(null);
        const [modoFormulario, setModoFormulario] = useState(null);
        const [formulario, setFormulario] = useState({ nombre: "", apellido: "", email: "", telefono: "", domicilio: "", localidad: "" });
        const [guardando, setGuardando] = useState(false);
        const [errorFormulario, setErrorFormulario] = useState("");
        const [eliminandoCliente, setEliminandoCliente] = useState(false);
        const [errorEliminacionCliente, setErrorEliminacionCliente] = useState("");
        const [actividadesCliente, setActividadesCliente] = useState([]);
        const [cargandoActividades, setCargandoActividades] = useState(false);
        const [errorActividades, setErrorActividades] = useState("");
        const [modoFormularioActividad, setModoFormularioActividad] = useState(null);
        const [actividadEditandoId, setActividadEditandoId] = useState(null);
        const [formularioActividad, setFormularioActividad] = useState({ descripcion: "", fechaCompromiso: "" });
        const [guardandoActividad, setGuardandoActividad] = useState(false);
        const [actividadProcesandoId, setActividadProcesandoId] = useState(null);
        const [errorFormularioActividad, setErrorFormularioActividad] = useState("");
        const [errorAccionActividad, setErrorAccionActividad] = useState("");

        const formularioVacio = () => ({ nombre: "", apellido: "", email: "", telefono: "", domicilio: "", localidad: "" });

        function agregarCliente() {
          limpiarFormularioActividad();
          setClienteSeleccionado(null);
          setFormulario(formularioVacio());
          setErrorFormulario("");
          setModoFormulario("alta");
        }

        function seleccionarCliente(cliente) {
          if (eliminandoCliente) return;
          limpiarFormularioActividad();
          setClienteSeleccionado(cliente);
          setModoFormulario(null);
          setErrorFormulario("");
          setErrorEliminacionCliente("");
        }

        function editarCliente() {
          if (!clienteSeleccionado) return;
          limpiarFormularioActividad();
          setFormulario({
            nombre: clienteSeleccionado.nombre ?? "",
            apellido: clienteSeleccionado.apellido ?? "",
            email: clienteSeleccionado.email ?? "",
            telefono: clienteSeleccionado.telefono ?? "",
            domicilio: clienteSeleccionado.domicilio ?? "",
            localidad: clienteSeleccionado.localidad ?? "",
          });
          setErrorFormulario("");
          setModoFormulario("edicion");
        }

        function cancelarFormulario() {
          setModoFormulario(null);
          setErrorFormulario("");
          setFormulario(formularioVacio());
          if (modoFormulario === "alta") setClienteSeleccionado(null);
        }

        function cambiarCampo(evento) {
          const { name, value } = evento.target;
          setFormulario((anterior) => ({ ...anterior, [name]: value }));
        }

        function limpiarFormularioActividad() {
          setModoFormularioActividad(null);
          setActividadEditandoId(null);
          setFormularioActividad({ descripcion: "", fechaCompromiso: "" });
          setErrorFormularioActividad("");
        }

        function fechaParaInput(valor) {
          if (!valor) return "";
          const fecha = new Date(valor);
          if (Number.isNaN(fecha.getTime())) return "";
          const anio = fecha.getFullYear();
          const mes = String(fecha.getMonth() + 1).padStart(2, "0");
          const dia = String(fecha.getDate()).padStart(2, "0");
          return `${anio}-${mes}-${dia}`;
        }

        function fechaIsoDesdeInput(valor) {
          if (!valor) return null;
          const [anio, mes, dia] = valor.split("-").map(Number);
          return new Date(anio, mes - 1, dia, 12, 0, 0, 0).toISOString();
        }

        function agregarActividad() {
          setActividadEditandoId(null);
          setFormularioActividad({ descripcion: "", fechaCompromiso: "" });
          setErrorFormularioActividad("");
          setErrorAccionActividad("");
          setModoFormularioActividad("alta");
        }

        function editarActividad(actividad) {
          setActividadEditandoId(actividad.id);
          setFormularioActividad({
            descripcion: actividad.descripcion ?? "",
            fechaCompromiso: fechaParaInput(actividad.fechaCompromiso),
          });
          setErrorFormularioActividad("");
          setErrorAccionActividad("");
          setModoFormularioActividad("edicion");
        }

        function cancelarFormularioActividad() {
          limpiarFormularioActividad();
          setErrorAccionActividad("");
        }

        function cambiarCampoActividad(evento) {
          const { name, value } = evento.target;
          setFormularioActividad((anterior) => ({ ...anterior, [name]: value }));
        }

        async function guardarActividad(evento) {
          evento.preventDefault();
          if (guardandoActividad || !clienteSeleccionado) return;
          setGuardandoActividad(true);
          setErrorFormularioActividad("");
          const esAlta = modoFormularioActividad === "alta";
          const payload = {
            descripcion: formularioActividad.descripcion.trim(),
            fechaCompromiso: fechaIsoDesdeInput(formularioActividad.fechaCompromiso),
          };

          try {
            const url = esAlta
              ? `/api/clientes/${clienteSeleccionado.id}/actividades`
              : `/api/clientes/${clienteSeleccionado.id}/actividades/${actividadEditandoId}`;
            const respuesta = await fetch(url, {
              method: esAlta ? "POST" : "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const cuerpo = await respuesta.json();
            if (!respuesta.ok) throw new Error(cuerpo.error?.mensaje ?? "No se pudo guardar la actividad.");

            const actividadGuardada = cuerpo.datos;
            setActividadesCliente((actuales) => esAlta
              ? [...actuales, actividadGuardada]
              : actuales.map((actividad) => actividad.id === actividadGuardada.id ? actividadGuardada : actividad));
            limpiarFormularioActividad();
          } catch (motivo) {
            setErrorFormularioActividad(motivo.message || "No se pudo guardar la actividad.");
          } finally {
            setGuardandoActividad(false);
          }
        }

        async function completarActividad(actividad) {
          if (!clienteSeleccionado || actividadProcesandoId !== null) return;
          setActividadProcesandoId(actividad.id);
          setErrorAccionActividad("");
          try {
            const respuesta = await fetch(`/api/clientes/${clienteSeleccionado.id}/actividades/${actividad.id}/completar`, { method: "PATCH" });
            const cuerpo = await respuesta.json();
            if (!respuesta.ok) throw new Error(cuerpo.error?.mensaje ?? "No se pudo completar la actividad.");
            const actividadActualizada = cuerpo.datos;
            setActividadesCliente((actuales) => actuales.map((item) => item.id === actividadActualizada.id ? actividadActualizada : item));
            if (actividadEditandoId === actividadActualizada.id) limpiarFormularioActividad();
          } catch (motivo) {
            setErrorAccionActividad(motivo.message || "No se pudo completar la actividad.");
          } finally {
            setActividadProcesandoId(null);
          }
        }

        async function eliminarActividad(actividad) {
          if (!clienteSeleccionado || actividadProcesandoId !== null) return;
          setActividadProcesandoId(actividad.id);
          setErrorAccionActividad("");
          try {
            const respuesta = await fetch(`/api/clientes/${clienteSeleccionado.id}/actividades/${actividad.id}`, { method: "DELETE" });
            const cuerpo = await respuesta.json();
            if (!respuesta.ok) throw new Error(cuerpo.error?.mensaje ?? "No se pudo eliminar la actividad.");
            setActividadesCliente((actuales) => actuales.filter((item) => item.id !== actividad.id));
            if (actividadEditandoId === actividad.id) limpiarFormularioActividad();
          } catch (motivo) {
            setErrorAccionActividad(motivo.message || "No se pudo eliminar la actividad.");
          } finally {
            setActividadProcesandoId(null);
          }
        }

        async function guardarCliente(evento) {
          evento.preventDefault();
          if (guardando) return;
          setGuardando(true);
          setErrorFormulario("");

          const esAlta = modoFormulario === "alta";
          const payload = {
            nombre: formulario.nombre.trim(),
            apellido: formulario.apellido.trim(),
            email: formulario.email.trim(),
            telefono: formulario.telefono.trim() || null,
            domicilio: formulario.domicilio.trim() || null,
            localidad: formulario.localidad.trim() || null,
          };

          try {
            const respuesta = await fetch(esAlta ? "/api/clientes" : `/api/clientes/${clienteSeleccionado.id}`, {
              method: esAlta ? "POST" : "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const cuerpo = await respuesta.json();
            if (!respuesta.ok) throw new Error(cuerpo.error?.mensaje ?? "No se pudieron guardar los cambios.");

            const clienteGuardado = cuerpo.datos;
            if (esAlta) {
              setClientes((actuales) => [...actuales, clienteGuardado].sort((a, b) => a.id - b.id));
            } else {
              setClientes((actuales) => actuales.map((cliente) => cliente.id === clienteGuardado.id ? clienteGuardado : cliente));
            }
            setClienteSeleccionado(clienteGuardado);
            setFormulario(formularioVacio());
            setModoFormulario(null);
          } catch (motivo) {
            setErrorFormulario(motivo.message || "No se pudieron guardar los cambios.");
          } finally {
            setGuardando(false);
          }
        }

        async function eliminarClienteSeleccionado() {
          if (!clienteSeleccionado || eliminandoCliente) return;
          const nombreCompleto = `${clienteSeleccionado.nombre} ${clienteSeleccionado.apellido}`;
          const confirmado = window.confirm(
            `¿Eliminar a ${nombreCompleto}? Los clientes con actividades asociadas no se pueden eliminar.`,
          );
          if (!confirmado) return;

          setEliminandoCliente(true);
          setErrorEliminacionCliente("");
          try {
            const respuesta = await fetch(`/api/clientes/${clienteSeleccionado.id}`, { method: "DELETE" });
            const cuerpo = await respuesta.json();
            if (!respuesta.ok) throw new Error(cuerpo.error?.mensaje ?? "No se pudo eliminar el cliente.");

            const idEliminado = clienteSeleccionado.id;
            setClientes((actuales) => actuales.filter((cliente) => cliente.id !== idEliminado));
            setClienteSeleccionado(null);
            setModoFormulario(null);
            setActividadesCliente([]);
            limpiarFormularioActividad();
          } catch (motivo) {
            setErrorEliminacionCliente(motivo.message || "No se pudo eliminar el cliente.");
          } finally {
            setEliminandoCliente(false);
          }
        }

        useEffect(() => {
          const controller = new AbortController();
          setCargando(true);
          setError("");

          fetch("/api/clientes", { signal: controller.signal })
            .then(async (respuesta) => {
              const cuerpo = await respuesta.json();
              if (!respuesta.ok) {
                throw new Error(cuerpo.error?.mensaje ?? "No se pudieron cargar los clientes.");
              }
              return cuerpo.datos;
            })
            .then((datos) => {
              if (!Array.isArray(datos)) throw new Error("La respuesta del servidor no tiene el formato esperado.");
              setClientes(datos);
            })
            .catch((motivo) => {
              if (motivo.name !== "AbortError") setError(motivo.message || "No se pudo conectar con el servidor.");
            })
            .finally(() => {
              if (!controller.signal.aborted) setCargando(false);
            });

          return () => controller.abort();
        }, [actualizacion]);

        useEffect(() => {
          const termino = busqueda.trim();
          if (!termino) {
            setClientesVisibles(clientes);
            setErrorBusqueda("");
            setBuscando(false);
            return;
          }

          const controller = new AbortController();
          const temporizador = setTimeout(() => {
            setBuscando(true);
            setErrorBusqueda("");
            fetch(`/api/clientes/buscar?termino=${encodeURIComponent(termino)}`, { signal: controller.signal })
              .then(async (respuesta) => {
                const cuerpo = await respuesta.json();
                if (!respuesta.ok) throw new Error(cuerpo.error?.mensaje ?? "No se pudo buscar clientes.");
                return cuerpo.datos;
              })
              .then((datos) => {
                if (!Array.isArray(datos)) throw new Error("La respuesta de búsqueda no tiene el formato esperado.");
                setClientesVisibles(datos);
              })
              .catch((motivo) => {
                if (motivo.name !== "AbortError") setErrorBusqueda(motivo.message || "No se pudo buscar clientes.");
              })
              .finally(() => {
                if (!controller.signal.aborted) setBuscando(false);
              });
          }, 200);

          return () => {
            clearTimeout(temporizador);
            controller.abort();
          };
        }, [busqueda, clientes, actualizacion]);

        useEffect(() => {
          const clienteId = clienteSeleccionado?.id;
          if (!clienteId) {
            setActividadesCliente([]);
            setCargandoActividades(false);
            setErrorActividades("");
            return;
          }

          const controller = new AbortController();
          setActividadesCliente([]);
          setCargandoActividades(true);
          setErrorActividades("");

          fetch(`/api/clientes/${clienteId}/actividades`, { signal: controller.signal })
            .then(async (respuesta) => {
              const cuerpo = await respuesta.json();
              if (!respuesta.ok) {
                throw new Error(cuerpo.error?.mensaje ?? "No se pudieron cargar las actividades.");
              }
              return cuerpo.datos;
            })
            .then((datos) => {
              if (!Array.isArray(datos)) throw new Error("La respuesta de actividades no tiene el formato esperado.");
              setActividadesCliente(datos);
            })
            .catch((motivo) => {
              if (motivo.name !== "AbortError") setErrorActividades(motivo.message || "No se pudieron cargar las actividades.");
            })
            .finally(() => {
              if (!controller.signal.aborted) setCargandoActividades(false);
            });

          return () => controller.abort();
        }, [clienteSeleccionado?.id]);

        const inicioHoy = new Date();
        inicioHoy.setHours(0, 0, 0, 0);
        const inicioHoyMs = inicioHoy.getTime();
        const compromisoPendientes = actividadesCliente.filter((actividad) => !actividad.fechaFinalizacion);
        const compromisoSinFecha = compromisoPendientes
          .filter((actividad) => !actividad.fechaCompromiso)
          .sort((a, b) => a.id - b.id);
        const compromisosConFecha = compromisoPendientes
          .filter((actividad) => actividad.fechaCompromiso)
          .sort((a, b) => new Date(a.fechaCompromiso) - new Date(b.fechaCompromiso));
        const compromisosVencidos = compromisosConFecha.filter((actividad) => {
          const fecha = new Date(actividad.fechaCompromiso);
          fecha.setHours(0, 0, 0, 0);
          return fecha.getTime() < inicioHoyMs;
        });
        const compromisosActualesOFuturos = compromisosConFecha.filter((actividad) => {
          const fecha = new Date(actividad.fechaCompromiso);
          fecha.setHours(0, 0, 0, 0);
          return fecha.getTime() >= inicioHoyMs;
        });
        const actividadesCompletadas = actividadesCliente
          .filter((actividad) => Boolean(actividad.fechaFinalizacion))
          .sort((a, b) => new Date(a.fechaFinalizacion) - new Date(b.fechaFinalizacion));

        function fechaVisible(valor) {
          return new Intl.DateTimeFormat("es-AR", { dateStyle: "medium" }).format(new Date(valor));
        }

        function filaCompromiso(actividad, estado) {
          const esSinFecha = estado === "undated";
          const accionesDeshabilitadas = Boolean(modoFormularioActividad || modoFormulario === "edicion" || guardandoActividad || actividadProcesandoId !== null);
          return (
            <div className="activity-row" key={actividad.id}>
              <div className="activity-description">{actividad.descripcion}</div>
              <div className="activity-date">
                <span className={`activity-badge ${estado}`}>
                  {esSinFecha ? "Sin fecha" : estado === "overdue" ? "Vencida" : estado === "today" ? "Hoy" : "Próxima"}
                </span>
                <span>{esSinFecha ? "Sin fecha de compromiso" : `Compromiso: ${fechaVisible(actividad.fechaCompromiso)}`}</span>
              </div>
              <div className="activity-actions">
                <button className="icon-action complete" type="button" onClick={() => completarActividad(actividad)} disabled={accionesDeshabilitadas} aria-label={`Completar actividad: ${actividad.descripcion}`} title="Completar actividad">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="m4.5 10.3 3.6 3.5 7.4-7.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
                </button>
                <button className="icon-action" type="button" onClick={() => editarActividad(actividad)} disabled={accionesDeshabilitadas} aria-label={`Editar actividad: ${actividad.descripcion}`} title="Editar actividad">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="m12.9 4.1 3 3M4 16l3.3-.7L16 6.6a2.1 2.1 0 0 0-3-3l-8.7 8.7L4 16Z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                </button>
                <button className="icon-action delete" type="button" onClick={() => eliminarActividad(actividad)} disabled={accionesDeshabilitadas} aria-label={`Eliminar actividad: ${actividad.descripcion}`} title="Eliminar actividad">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M4.5 6h11m-9.8 0 .7 10h8.2l.7-10M8 6V4h4v2m-3 3v4m2-4v4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                </button>
              </div>
            </div>
          );
        }

        function contenidoLista(actividades, vacio) {
          if (cargandoActividades) return <div className="activity-state" role="status">Cargando actividades…</div>;
          if (errorActividades) return <div className="activity-state error" role="alert">{errorActividades}</div>;
          if (actividades.length === 0) return <div className="activity-state">{vacio}</div>;
          return actividades;
        }

        return (
          <>
            <header className="topbar">
              <div className="brand">
                <span className="brand-mark">M</span>
                <span className="brand-name">MiniCRM</span>
                <span className="brand-subtitle">Gestión de clientes</span>
              </div>
            </header>
            <main>
              <section className="heading-row" aria-labelledby="page-title">
                <div>
                  <p className="eyebrow">Panel de gestión</p>
                  <h1 id="page-title">Clientes</h1>
                  <p className="description">Listado de clientes registrados en el sistema.</p>
                </div>
                <div className="heading-actions">
                  {!cargando && !error && <span className="count"><strong>{clientes.length}</strong> {clientes.length === 1 ? "cliente" : "clientes"}</span>}
                  <button className="primary" type="button" onClick={agregarCliente} disabled={cargando}>+ Agregar</button>
                </div>
              </section>

              <div className="workspace">
              <section className="panel master-panel" aria-label="Listado de clientes">
                <div className="panel-head">
                  <h2 className="panel-title">Todos los clientes</h2>
                  <button className="refresh" type="button" onClick={() => setActualizacion((n) => n + 1)} disabled={cargando || buscando}>
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                      <path d="M16.25 8A6.5 6.5 0 0 0 4.8 5.7L3.3 7.2M3.3 7.2V3.8M3.3 7.2h3.4M3.75 12A6.5 6.5 0 0 0 15.2 14.3l1.5-1.5m0 0v3.4m0-3.4h-3.4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                    Actualizar
                  </button>
                </div>
                <div className="search-bar">
                  <label className="visually-hidden" htmlFor="buscar-clientes">Buscar clientes</label>
                  <input id="buscar-clientes" className="search-input" type="search" value={busqueda} onChange={(evento) => setBusqueda(evento.target.value)} placeholder="Buscar por cualquier campo…" aria-describedby="search-help" />
                  <span className="visually-hidden" id="search-help">Busca en todos los campos del cliente mientras escribís.</span>
                </div>

                {cargando ? (
                  <div className="state" role="status"><strong>Cargando clientes…</strong><p>Consultando el servidor.</p></div>
                ) : error ? (
                  <div className="state error" role="alert"><strong>No se pudieron cargar los clientes</strong><p>{error}</p></div>
                ) : errorBusqueda ? (
                  <div className="state error" role="alert"><strong>No se pudo completar la búsqueda</strong><p>{errorBusqueda}</p></div>
                ) : clientes.length === 0 ? (
                  <div className="state"><strong>Todavía no hay clientes</strong><p>Cuando existan registros, aparecerán en este listado.</p></div>
                ) : buscando ? (
                  <div className="state" role="status"><strong>Buscando…</strong></div>
                ) : clientesVisibles.length === 0 ? (
                  <div className="state"><strong>Sin resultados</strong><p>No hay clientes que coincidan con “{busqueda}”.</p></div>
                ) : (
                  <div className="table-wrap">
                    <table>
                      <thead>
                        <tr><th>ID</th><th>Cliente</th><th>Email</th><th>Teléfono</th><th>Localidad</th></tr>
                      </thead>
                      <tbody>
                        {clientesVisibles.map((cliente) => (
                          <tr
                            key={cliente.id}
                            className={`clickable-row ${clienteSeleccionado?.id === cliente.id && !modoFormulario ? "selected" : ""}`}
                            onClick={() => seleccionarCliente(cliente)}
                            onKeyDown={(evento) => { if (evento.key === "Enter" || evento.key === " ") { evento.preventDefault(); seleccionarCliente(cliente); } }}
                            tabIndex={0}
                            role="button"
                            aria-pressed={clienteSeleccionado?.id === cliente.id && !modoFormulario}
                          >
                            <td>#{cliente.id}</td>
                            <td><div className="person"><span className="avatar">{iniciales(cliente)}</span><span>{cliente.nombre} {cliente.apellido}</span></div></td>
                            <td>{cliente.email || <span className="muted">—</span>}</td>
                            <td>{cliente.telefono || <span className="muted">—</span>}</td>
                            <td>{cliente.localidad || <span className="muted">—</span>}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {!cargando && !error && !errorBusqueda && clientes.length > 0 && (
                  <div className="footer">Se muestran {clientesVisibles.length} de {clientes.length} {clientes.length === 1 ? "cliente" : "clientes"}.</div>
                )}
              </section>

              <div className="detail-column">
              {(clienteSeleccionado || modoFormulario === "alta") && (
                <section className="panel detail-panel" aria-label="Detalle del cliente">
                  <div className="panel-head">
                    <h2 className="panel-title">
                      {modoFormulario === "alta" ? "Agregar cliente" : modoFormulario === "edicion" ? "Editar cliente" : "Detalle del cliente"}
                    </h2>
                    {!modoFormulario && clienteSeleccionado && (
                      <div className="detail-actions">
                        <button className="secondary" type="button" onClick={editarCliente}>Editar</button>
                        <button className="danger-button" type="button" onClick={eliminarClienteSeleccionado} disabled={eliminandoCliente} aria-label={`Eliminar cliente ${clienteSeleccionado.nombre} ${clienteSeleccionado.apellido}`}>
                          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M4.5 6h11m-9.8 0 .7 10h8.2l.7-10M8 6V4h4v2m-3 3v4m2-4v4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                          {eliminandoCliente ? "Eliminando…" : "Eliminar"}
                        </button>
                      </div>
                    )}
                  </div>
                  {errorEliminacionCliente && <p className="delete-client-error" role="alert">{errorEliminacionCliente}</p>}

                  {modoFormulario ? (
                    <form className="detail-body client-form" onSubmit={guardarCliente}>
                      <div className="form-row">
                        <div className="field"><label htmlFor="nombre">Nombre</label><input id="nombre" name="nombre" value={formulario.nombre} onChange={cambiarCampo} required autoFocus /></div>
                        <div className="field"><label htmlFor="apellido">Apellido</label><input id="apellido" name="apellido" value={formulario.apellido} onChange={cambiarCampo} required /></div>
                      </div>
                      <div className="form-row">
                        <div className="field"><label htmlFor="email">Email</label><input id="email" name="email" type="email" value={formulario.email} onChange={cambiarCampo} required /></div>
                        <div className="field"><label htmlFor="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" value={formulario.telefono} onChange={cambiarCampo} /></div>
                      </div>
                      <div className="form-row">
                        <div className="field"><label htmlFor="domicilio">Domicilio</label><input id="domicilio" name="domicilio" value={formulario.domicilio} onChange={cambiarCampo} /></div>
                        <div className="field"><label htmlFor="localidad">Localidad</label><input id="localidad" name="localidad" value={formulario.localidad} onChange={cambiarCampo} /></div>
                      </div>
                      {errorFormulario && <p className="form-error" role="alert">{errorFormulario}</p>}
                      <div className="form-actions">
                        <button className="secondary" type="button" onClick={cancelarFormulario} disabled={guardando}>Cancelar</button>
                        <button className="primary" type="submit" disabled={guardando}>{guardando ? "Guardando…" : "Guardar"}</button>
                      </div>
                    </form>
                  ) : (
                    <dl className="detail-body detail-grid">
                      <div className="detail-item"><dt>Nombre</dt><dd>{clienteSeleccionado.nombre}</dd></div>
                      <div className="detail-item"><dt>Apellido</dt><dd>{clienteSeleccionado.apellido}</dd></div>
                      <div className="detail-item"><dt>Email</dt><dd>{clienteSeleccionado.email || <span className="muted">Sin registrar</span>}</dd></div>
                      <div className="detail-item"><dt>Teléfono</dt><dd>{clienteSeleccionado.telefono || <span className="muted">Sin registrar</span>}</dd></div>
                      <div className="detail-item"><dt>Domicilio</dt><dd>{clienteSeleccionado.domicilio || <span className="muted">Sin registrar</span>}</dd></div>
                      <div className="detail-item"><dt>Localidad</dt><dd>{clienteSeleccionado.localidad || <span className="muted">Sin registrar</span>}</dd></div>
                    </dl>
                  )}
                </section>
              )}

              {clienteSeleccionado && modoFormulario !== "alta" && (
                <section className="panel activity-panel" aria-label={`Actividades de ${clienteSeleccionado.nombre} ${clienteSeleccionado.apellido}`}>
                  <div className="panel-head">
                    <h2 className="panel-title">Actividades</h2>
                    {!modoFormularioActividad && modoFormulario !== "edicion" && (
                      <button className="secondary" type="button" onClick={agregarActividad}>
                        Agregar actividad
                      </button>
                    )}
                  </div>
                  {modoFormularioActividad && (
                    <form className="activity-editor" onSubmit={guardarActividad}>
                      <h3 className="activity-editor-title">{modoFormularioActividad === "alta" ? "Nueva actividad" : "Editar actividad pendiente"}</h3>
                      <div className="client-form">
                        <div className="field">
                          <label htmlFor="actividad-descripcion">Descripción</label>
                          <textarea id="actividad-descripcion" className="activity-textarea" name="descripcion" value={formularioActividad.descripcion} onChange={cambiarCampoActividad} required />
                        </div>
                        <div className="field">
                          <label htmlFor="actividad-fecha">Fecha de compromiso (opcional)</label>
                          <input id="actividad-fecha" name="fechaCompromiso" type="date" value={formularioActividad.fechaCompromiso} onChange={cambiarCampoActividad} />
                        </div>
                        {errorFormularioActividad && <p className="form-error" role="alert">{errorFormularioActividad}</p>}
                        <div className="form-actions">
                          <button className="secondary" type="button" onClick={cancelarFormularioActividad} disabled={guardandoActividad}>Cancelar</button>
                          <button className="primary" type="submit" disabled={guardandoActividad}>{guardandoActividad ? "Guardando…" : "Guardar"}</button>
                        </div>
                      </div>
                    </form>
                  )}
                  {errorAccionActividad && <p className="activity-action-error" role="alert">{errorAccionActividad}</p>}
                  <div className="activity-columns">
                    <section className="activity-group" aria-labelledby="commitments-title">
                      <div className="activity-group-head">
                        <h3 id="commitments-title">Compromisos</h3>
                        <span className="activity-number">{compromisoPendientes.length}</span>
                      </div>
                      <div className="activity-scroll">
                        {cargandoActividades || errorActividades ? contenidoLista([], "") : (
                          compromisoPendientes.length === 0 ? contenidoLista([], "No hay compromisos pendientes.") : <>
                            {compromisoSinFecha.map((actividad) => filaCompromiso(actividad, "undated"))}
                            {compromisosVencidos.map((actividad) => filaCompromiso(actividad, "overdue"))}
                            {compromisosActualesOFuturos.map((actividad) => {
                              const fecha = new Date(actividad.fechaCompromiso);
                              fecha.setHours(0, 0, 0, 0);
                              return filaCompromiso(actividad, fecha.getTime() === inicioHoyMs ? "today" : "upcoming");
                            })}
                          </>
                        )}
                      </div>
                    </section>
                    <section className="activity-group" aria-labelledby="completed-title">
                      <div className="activity-group-head">
                        <h3 id="completed-title">Actividades completadas</h3>
                        <span className="activity-number">{actividadesCompletadas.length}</span>
                      </div>
                      <div className="activity-scroll">
                        {cargandoActividades || errorActividades ? contenidoLista([], "") : (
                          actividadesCompletadas.length === 0 ? contenidoLista([], "Todavía no hay actividades completadas.") : actividadesCompletadas.map((actividad) => (
                            <div className="activity-row" key={actividad.id}>
                              <div className="activity-description">{actividad.descripcion}</div>
                              <div className="activity-date">
                                <span className="activity-badge completed">Completada</span>
                                <span>Finalizada: {fechaVisible(actividad.fechaFinalizacion)}</span>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </section>
                  </div>
                </section>
              )}
              {!clienteSeleccionado && modoFormulario !== "alta" && <section className="panel state detail-placeholder"><strong>Seleccioná un cliente</strong><p>Su ficha y sus actividades aparecerán aquí.</p></section>}
              </div>
              </div>
            </main>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
