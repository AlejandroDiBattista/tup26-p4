<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')
    const estado= reactive ({
      alumnos: alumnos,
      busqueda: ''
    })

    function guardarAlumnos() {
      localStorage.setItem('alumnos', JSON.stringify(estado.alumnos))
    }

    function cargarAlumnos() {
      const datos = localStorage.getItem('alumnos')

      if (datos) {
        estado.alumnos = JSON.parse(datos)

      } else {
        guardarAlumnos()
      }
    }


    html`
      <h1>Alumnos</h1>

      <input
      type="search"
      placeholder="Buscar alumno..."
      @input="${(e) => estado.busqueda = e.target.value}"
      >
       ${() => {
       const alumnosFiltrados = ordenarAlumnos(filtrarAlumnos(estado.alumnos))

       return alumnosFiltrados.length
       ? alumnosFiltrados.map(a => html`<li>${a.nombre} <b>${a.apellido}</b></li>`)
       : html`<li>No se encontraron alumnos.</li>`
}}
    `(app)

    cargarAlumnos()

    function ordenarAlumnos(lista) {
      return [...lista].sort((a, b) => {
        if (a.favorito !== b.favorito) {
          return a.favorito ? -1 : 1
        }

         const apellidoA = a.apellido.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
         const apellidoB = b.apellido.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()

         const comparacionApellido = apellidoA.localeCompare(apellidoB)

         if (comparacionApellido !== 0) {
          return comparacionApellido
         }

         const nombreA = a.nombre.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
         const nombreB = b.nombre.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()

         return nombreA.localeCompare(nombreB)

      })
    }

    function filtrarAlumnos(lista) {
      const texto = estado.busqueda
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim()

      if (!texto) {
        return lista
      }

      return lista.filter(a => {
        const apellido = a.apellido
        .normalize('NFD') 
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()

        const nombre = a.nombre
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()

        const legajo = String(a.legajo)

        return apellido.includes(texto) ||
              nombre.includes(texto) ||
              legajo.includes(texto)
      })
    }


  </script>
</body>
</html>
