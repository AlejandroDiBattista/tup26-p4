<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniCRM</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
  }

  #root {
    height: 100vh;
  }
.app {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: 100vh;
}

.clientes {
  padding: 20px;
  border-right: 1px solid #ccc;
  background: white;
  overflow-y: auto;
}

.detalle {
  padding: 20px;
  overflow-y: auto;
}

</style>

</head>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
<body>

  <div id="root"></div>

<script type="text/babel">
  function App() {
    const [busqueda, setBusqueda] = React.useState("");
    const [clientes, setClientes] = React.useState([]);
    const [clienteSeleccionado, setClienteSeleccionado] = React.useState(null);
    const [actividades, setActividades] = React.useState([]);
    const [modoFormulario, setModoFormulario] = React.useState(false); 
    const [editandoCliente, setEditandoCliente] = React.useState(false);
    
    const [formularioCliente, setFormularioCliente] = React.useState({
  nombre: "",
  apellido: "",
  email: "",
  domicilio: "",
  localidad: "",
  telefono: "",
});

const [formularioActividad, setFormularioActividad] = React.useState({
  descripcion: "",
  fechaCompromiso: "",
});

const [mostrarFormularioActividad, setMostrarFormularioActividad] =
  React.useState(false);

const [editandoActividad, setEditandoActividad] = React.useState(false);
const [actividadEditadaId, setActividadEditadaId] = React.useState(null);


    React.useEffect(() => {
  if (!clienteSeleccionado) {
    setActividades([]);
    return;
  }

  fetch(`/api/clientes/${clienteSeleccionado.id}/actividades`)
    .then((respuesta) => respuesta.json())
    .then((datos) => setActividades(datos));
}, [clienteSeleccionado]);


    React.useEffect(() => {
  fetch("/api/clientes")
    .then((respuesta) => respuesta.json())
    .then((datos) => setClientes(datos));
}, []);


    return (
  <div className="app">
    <aside className="clientes">
  <h2>Clientes</h2>

  <button
  onClick={() => {
    setClienteSeleccionado(null);
    setModoFormulario(true);
  }}
>
  Nuevo cliente
</button>
  <input
    type="text"
    placeholder="Buscar cliente..."
    value={busqueda}
    onChange={(e) => setBusqueda(e.target.value)}
  />

  <div className="lista-clientes">
  {clientes
  .filter((cliente) =>
    Object.values(cliente)
      .join(" ")
      .toLowerCase()
      .includes(busqueda.toLowerCase())
  )
  .map((cliente) => (
    <div
  key={cliente.id}
  className="cliente-item"
  onClick={() => setClienteSeleccionado(cliente)}
>
      <strong>
        {cliente.nombre} {cliente.apellido}
      </strong>
      <small>{cliente.email}</small>
    </div>
  ))}
</div>
</aside>

  <main className="detalle">
  <h2>
  {modoFormulario
    ? editandoCliente
      ? "Editar cliente"
      : "Nuevo cliente"
    : "Detalle del cliente"}
</h2>

  {modoFormulario ? (
    <div>
      <p>Formulario para agregar un nuevo cliente.</p>

      <label>
        Nombre:
        <input
  type="text"
  value={formularioCliente.nombre}
  onChange={(e) =>
    setFormularioCliente({
      ...formularioCliente,
      nombre: e.target.value,
    })
  }
/>
      </label>

      <br />

      <label>
        Apellido:
        <input
  type="text"
  value={formularioCliente.apellido}
  onChange={(e) =>
    setFormularioCliente({
      ...formularioCliente,
      apellido: e.target.value,
    })
  }
/>
      </label>

      <br />

      <label>
        Email:
        <input
  type="email"
  value={formularioCliente.email}
  onChange={(e) =>
    setFormularioCliente({
      ...formularioCliente,
      email: e.target.value,
    })
  }
/>
      </label>

      <br />

      <label>
        Domicilio:
        <input
  type="text"
  value={formularioCliente.domicilio}
  onChange={(e) =>
    setFormularioCliente({
      ...formularioCliente,
      domicilio: e.target.value,
    })
  }
/>
      </label>

      <br />

      <label>
        Localidad:
        <input
  type="text"
  value={formularioCliente.localidad}
  onChange={(e) =>
    setFormularioCliente({
      ...formularioCliente,
      localidad: e.target.value,
    })
  }
/>
      </label>

      <br />

      <label>
        Teléfono:
        <input
  type="text"
  value={formularioCliente.telefono}
  onChange={(e) =>
    setFormularioCliente({
      ...formularioCliente,
      telefono: e.target.value,
    })
  }
/>
      </label>

  <button
  onClick={async () => {
    const url = editandoCliente
      ? `/api/clientes/${clienteSeleccionado.id}`
      : "/api/clientes";

    const metodo = editandoCliente ? "PUT" : "POST";

    const respuesta = await fetch(url, {
      method: metodo,
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify(formularioCliente),
    });

    if (respuesta.ok) {
      const clienteGuardado = await respuesta.json();

      if (editandoCliente) {
        setClientes(
          clientes.map((cliente) =>
            cliente.id === clienteGuardado.id
              ? clienteGuardado
              : cliente
          )
        );
        setClienteSeleccionado(clienteGuardado);
      } else {
        setClientes([...clientes, clienteGuardado]);
        setClienteSeleccionado(clienteGuardado);
      }

      setModoFormulario(false);
      setEditandoCliente(false);

      setFormularioCliente({
        nombre: "",
        apellido: "",
        email: "",
        domicilio: "",
        localidad: "",
        telefono: "",
      });
    }
  }}
>
  {editandoCliente ? "Guardar cambios" : "Guardar cliente"}
</button>
    </div>
  ) : (
    clienteSeleccionado && (
      <div>
        <h3>
          {clienteSeleccionado.nombre} {clienteSeleccionado.apellido}
        </h3>

        <p><strong>ID:</strong> {clienteSeleccionado.id}</p>
        <p><strong>Email:</strong> {clienteSeleccionado.email}</p>
        <p><strong>Domicilio:</strong> {clienteSeleccionado.domicilio || "—"}</p>
        <p><strong>Localidad:</strong> {clienteSeleccionado.localidad || "—"}</p>
        <p><strong>Teléfono:</strong> {clienteSeleccionado.telefono || "—"}</p>

        <button
  onClick={() => {
    setFormularioCliente({
      nombre: clienteSeleccionado.nombre,
      apellido: clienteSeleccionado.apellido,
      email: clienteSeleccionado.email,
      domicilio: clienteSeleccionado.domicilio || "",
      localidad: clienteSeleccionado.localidad || "",
      telefono: clienteSeleccionado.telefono || "",
    });

    setModoFormulario(true);
    setEditandoCliente(true);
  }}
>
  Editar cliente
</button>

<button
  onClick={async () => {
    if (!window.confirm("¿Seguro que querés eliminar este cliente?")) {
  return;
}


    const respuesta = await fetch(
      `/api/clientes/${clienteSeleccionado.id}`,
      {
        method: "DELETE",
      }
    );

    if (respuesta.ok) {
      setClientes(
        clientes.filter(
          (cliente) => cliente.id !== clienteSeleccionado.id
        )
      );

      setClienteSeleccionado(null);
    }
  }}
>
  Eliminar cliente
</button>

<button
  onClick={() => {
    setMostrarFormularioActividad(true);
  }}
>
  Agregar actividad
</button>

{mostrarFormularioActividad && (
  <div>
    <h4>Nueva actividad</h4>

    <label>
      Descripción:
      <input
        type="text"
        value={formularioActividad.descripcion}
        onChange={(e) =>
          setFormularioActividad({
            ...formularioActividad,
            descripcion: e.target.value,
          })
        }
      />
    </label>

    <br />

    <label>
      Fecha de compromiso:
      <input
        type="date"
        value={formularioActividad.fechaCompromiso}
        onChange={(e) =>
          setFormularioActividad({
            ...formularioActividad,
            fechaCompromiso: e.target.value,
          })
        }
      />
    </label>

    <br />

    <button
 onClick={async () => {
  const url = editandoActividad
    ? `/api/actividades/${actividadEditadaId}`
    : `/api/clientes/${clienteSeleccionado.id}/actividades`;

  const metodo = editandoActividad ? "PUT" : "POST";

  const respuesta = await fetch(url, {
    method: metodo,
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify(formularioActividad),
  });

  if (respuesta.ok) {
    const actividadGuardada = await respuesta.json();

    if (editandoActividad) {
      setActividades(
        actividades.map((actividad) =>
          actividad.id === actividadGuardada.id
            ? actividadGuardada
            : actividad
        )
      );
    } else {
      setActividades([...actividades, actividadGuardada]);
    }

    setFormularioActividad({
      descripcion: "",
      fechaCompromiso: "",
    });

    setEditandoActividad(false);
    setActividadEditadaId(null);
    setMostrarFormularioActividad(false);
  }
}}
>
  {editandoActividad ? "Guardar cambios" : "Guardar actividad"}
</button>
  </div>
)}

        <h4>Compromisos</h4>

        {actividades.filter((actividad) => !actividad.fechaFinalizacion).length === 0 ? (
          <p>No hay compromisos pendientes.</p>
        ) : (
          <ul>
            {actividades
              .filter((actividad) => !actividad.fechaFinalizacion)
              .map((actividad) => (
                <li key={actividad.id}>
  <strong>{actividad.descripcion}</strong>
  <br />
  Fecha de compromiso: {actividad.fechaCompromiso || "Sin fecha"}

  <br />

  <button
    onClick={() => {
      setFormularioActividad({
        descripcion: actividad.descripcion,
        fechaCompromiso: actividad.fechaCompromiso || "",
      });

      setActividadEditadaId(actividad.id);
      setEditandoActividad(true);
      setMostrarFormularioActividad(true);
    }}
  >
    Editar
  </button>

  <button
    onClick={async () => {
      if (!window.confirm("¿Seguro que querés eliminar esta actividad?")) {
        return;
      }

      const respuesta = await fetch(
        `/api/actividades/${actividad.id}`,
        {
          method: "DELETE",
        }
      );

      if (respuesta.ok) {
        setActividades(
          actividades.filter(
            (item) => item.id !== actividad.id
          )
        );
      }
    }}
  >
    Eliminar
  </button>

  <button
    onClick={async () => {
      const respuesta = await fetch(
        `/api/actividades/${actividad.id}/completar`,
        {
          method: "PATCH",
        }
      );

      if (respuesta.ok) {
        const actividadActualizada = await respuesta.json();

        setActividades(
          actividades.map((item) =>
            item.id === actividadActualizada.id
              ? actividadActualizada
              : item
          )
        );
      }
    }}
  >
    Completar
  </button>
</li>
              ))}
          </ul>
        )}

       <h4>Completadas</h4>

{actividades.filter((actividad) => actividad.fechaFinalizacion).length === 0 ? (
  <p>No hay actividades completadas.</p>
) : (
  <ul>
    {actividades
      .filter((actividad) => actividad.fechaFinalizacion)
      .map((actividad) => (
        <li key={actividad.id}>
          <strong>{actividad.descripcion}</strong>
          <br />
          Fecha de finalización: {actividad.fechaFinalizacion}
        </li>
      ))}
  </ul>
)}
        
      </div>
    )
  )}
</main>
  </div>
);
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>

</body>
</html>
