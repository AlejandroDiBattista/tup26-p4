<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniCRM</title>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
    <style>
      * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; color: #172033; background: #f4f7fb; overflow: hidden; }
      header { height: 68px; padding: 16px 28px; background: #1f4775; color: white; font-size: 30px; font-weight: 700; }
      #root { height: calc(100vh - 68px); } .app { display: grid; grid-template-columns: 370px 1fr; gap: 14px; height: 100%; padding: 14px; }
      .panel { min-height: 0; background: white; border: 1px solid #dbe3ed; border-radius: 9px; box-shadow: 0 1px 3px #18233c10; }
      .master { display: flex; flex-direction: column; } .top { padding: 20px; border-bottom: 1px solid #e5eaf0; } .title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      h1, h2, h3, p { margin: 0; } h2 { font-size: 28px; } h3 { font-size: 22px; margin: 16px 0 10px; } button { border: 1px solid #ccd5e1; border-radius: 6px; padding: 10px 14px; background: white; cursor: pointer; font-size: 15px; } button.primary { color: white; border-color: #1769d1; background: #1769d1; } button.danger { color: #b42318; border-color: #efb5b0; } button:disabled { opacity: .55; cursor: not-allowed; }
      input { width: 100%; border: 1px solid #c9d3df; border-radius: 6px; padding: 11px; font-size: 15px; } input[type="checkbox"] { width: 22px; height: 22px; flex: 0 0 22px; margin: 0; padding: 0; accent-color: #319b70; cursor: pointer; } .search { margin-top: 16px; } .client-list { overflow-y: auto; } .client { width: 100%; text-align: left; border: 0; border-bottom: 1px solid #edf0f4; border-radius: 0; padding: 16px 20px; } .client.selected { background: #e7f1ff; } .client strong { display: block; font-size: 17px; } .client small, .muted { color: #64748b; display: block; margin-top: 4px; }
      .detail { overflow-y: auto; padding: 28px; } .detail-header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; } .actions { display: flex; gap: 8px; } .info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 20px; } .box { border: 1px dashed #cbd5e1; border-radius: 8px; padding: 18px; margin-top: 22px; } .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; } .form-actions { display: flex; gap: 8px; align-items: end; } .activity-list { border: 1px solid #e0e7ef; border-radius: 8px; max-height: 240px; overflow-y: auto; } .activity { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #edf0f4; } .activity:last-child { border: 0; } .activity-body { flex: 1; } .activity.done { background: #effaf5; } .activity button { padding: 6px 9px; } .empty { display: grid; place-items: center; height: 100%; color: #64748b; text-align: center; } .error { color: #b42318; margin-top: 10px; } label { font-size: 13px; font-weight: 600; color: #475569; } .edit-form { margin-top: 18px; } @media (max-width: 800px) { .app { grid-template-columns: 1fr; } .master { min-height: 230px; } header { font-size: 24px; } }
    </style>
  </head>
  <body>
    <header>MiniCRM</header><div id="root"></div>
    <script type="text/babel">
      const { useEffect, useState } = React;
      const vacio = { nombre: "", email: "", telefono: "", direccion: "", ciudad: "" };
      const api = async (url, options = {}) => { const r = await fetch(`/api${url}`, { headers: { "Content-Type": "application/json" }, ...options }); if (!r.ok) { const body = await r.json().catch(() => ({})); throw new Error(body.error || "No se pudo completar la operación."); } return r.status === 204 ? null : r.json(); };
      const fecha = value => value ? new Intl.DateTimeFormat("es-AR", { dateStyle: "medium" }).format(new Date(`${value}T00:00:00`)) : "Sin fecha";
      function App() {
        const [lista, setLista] = useState([]), [seleccionado, setSeleccionado] = useState(null), [busqueda, setBusqueda] = useState(""), [cliente, setCliente] = useState(vacio), [editando, setEditando] = useState(false), [nuevaActividad, setNuevaActividad] = useState({ descripcion: "", fecha: "" }), [actividadEditada, setActividadEditada] = useState(null), [error, setError] = useState("");
        const cargarLista = async (q = busqueda) => { try { const datos = await api(`/clientes?q=${encodeURIComponent(q)}`); setLista(datos); } catch (e) { setError(e.message); } };
        const abrir = async id => { try { setError(""); setSeleccionado(await api(`/clientes/${id}`)); setEditando(false); } catch(e) { setError(e.message); } };
        useEffect(() => { cargarLista(""); }, []); useEffect(() => { const t = setTimeout(() => cargarLista(), 250); return () => clearTimeout(t); }, [busqueda]);
        const guardarCliente = async e => { e.preventDefault(); try { const guardado = editando && seleccionado ? await api(`/clientes/${seleccionado.id}`, { method:"PUT", body:JSON.stringify(cliente) }) : await api("/clientes", { method:"POST", body:JSON.stringify(cliente) }); await cargarLista(); await abrir(guardado.id); setCliente(vacio); setEditando(false); } catch(e) { setError(e.message); } };
        const eliminarCliente = async () => { if (!seleccionado || !confirm("¿Eliminar este cliente y sus actividades?")) return; try { await api(`/clientes/${seleccionado.id}`, { method:"DELETE" }); setSeleccionado(null); await cargarLista(); } catch(e) { setError(e.message); } };
        const guardarActividad = async e => { e.preventDefault(); try { await api(`/clientes/${seleccionado.id}/actividades`, { method:"POST", body:JSON.stringify(nuevaActividad) }); setNuevaActividad({descripcion:"",fecha:""}); await abrir(seleccionado.id); } catch(e) { setError(e.message); } };
        const completar = async id => { try { await api(`/actividades/${id}/completar`, {method:"PATCH"}); await abrir(seleccionado.id); } catch(e) { setError(e.message); } };
        const eliminarActividad = async id => { try { await api(`/actividades/${id}`, {method:"DELETE"}); await abrir(seleccionado.id); } catch(e) { setError(e.message); } };
        const guardarEdicionActividad = async e => { e.preventDefault(); try { await api(`/actividades/${actividadEditada.id}`, { method:"PUT", body:JSON.stringify(actividadEditada) }); setActividadEditada(null); await abrir(seleccionado.id); } catch(e) { setError(e.message); } };
        const iniciarAlta = () => { setSeleccionado(null); setCliente(vacio); setEditando(true); setError(""); };
        const iniciarEdicion = () => { setCliente({ nombre:seleccionado.nombre, email:seleccionado.email, telefono:seleccionado.telefono, direccion:seleccionado.direccion, ciudad:seleccionado.ciudad }); setEditando(true); };
        return <main className="app"><aside className="panel master"><div className="top"><div className="title-row"><h2>Clientes</h2><button className="primary" onClick={iniciarAlta}>+ Agregar</button></div><input className="search" placeholder="Buscar por cualquier campo..." value={busqueda} onChange={e=>setBusqueda(e.target.value)} /></div><div className="client-list">{lista.map(c=><button className={`client ${seleccionado?.id===c.id?"selected":""}`} key={c.id} onClick={()=>abrir(c.id)}><strong>{c.nombre}</strong><small>{c.email}</small></button>)}</div></aside><section className="panel detail">{error && <p className="error">{error}</p>}{editando ? <form onSubmit={guardarCliente}><div className="detail-header"><h2>{seleccionado ? "Editar cliente" : "Nuevo cliente"}</h2><div className="actions"><button type="button" onClick={()=>{setEditando(false);setCliente(vacio)}}>Cancelar</button><button className="primary">Guardar</button></div></div><div className="form-grid">{[["nombre","Nombre"],["email","Email"],["telefono","Teléfono"],["direccion","Dirección"],["ciudad","Ciudad"]].map(([key,label])=><label key={key}>{label}<input required={key==="nombre"||key==="email"} type={key==="email"?"email":"text"} value={cliente[key]} onChange={e=>setCliente({...cliente,[key]:e.target.value})}/></label>)}</div></form> : seleccionado ? <><div className="detail-header"><div><h2>{seleccionado.nombre}</h2><span className="muted">#{seleccionado.id}</span></div><div className="actions"><button onClick={iniciarEdicion}>Editar</button><button className="danger" onClick={eliminarCliente}>Eliminar</button></div></div><div className="info"><p>✉ {seleccionado.email}</p><p>☎ {seleccionado.telefono || "Sin teléfono"}</p><p>⌖ {seleccionado.direccion || "Sin dirección"}</p><p>⌖ {seleccionado.ciudad || "Sin ciudad"}</p></div><form className="box" onSubmit={guardarActividad}><h3>Agregar actividad</h3><div className="form-grid"><input required placeholder="Descripción de la actividad" value={nuevaActividad.descripcion} onChange={e=>setNuevaActividad({...nuevaActividad,descripcion:e.target.value})}/><input type="date" value={nuevaActividad.fecha} onChange={e=>setNuevaActividad({...nuevaActividad,fecha:e.target.value})}/></div><div className="form-actions"><button className="primary">Guardar actividad</button></div></form>{actividadEditada && <form className="box" onSubmit={guardarEdicionActividad}><h3>Editar compromiso</h3><div className="form-grid"><input required value={actividadEditada.descripcion} onChange={e=>setActividadEditada({...actividadEditada,descripcion:e.target.value})}/><input type="date" value={actividadEditada.fecha || ""} onChange={e=>setActividadEditada({...actividadEditada,fecha:e.target.value})}/></div><div className="form-actions"><button type="button" onClick={()=>setActividadEditada(null)}>Cancelar</button><button className="primary">Guardar cambios</button></div></form>}<h3>Compromisos</h3><div className="activity-list">{seleccionado.actividades.filter(a=>!a.completada).map(a=><div className="activity" key={a.id}><input type="checkbox" onChange={()=>completar(a.id)}/><div className="activity-body"><strong>{a.descripcion}</strong><span className="muted">{fecha(a.fecha)}</span></div><button onClick={()=>setActividadEditada({id:a.id,descripcion:a.descripcion,fecha:a.fecha || ""})}>Editar</button><button className="danger" onClick={()=>eliminarActividad(a.id)}>Eliminar</button></div>)}{!seleccionado.actividades.some(a=>!a.completada)&&<p className="muted activity">No hay compromisos pendientes.</p>}</div><h3>Actividades completadas</h3><div className="activity-list">{seleccionado.actividades.filter(a=>a.completada).map(a=><div className="activity done" key={a.id}><input type="checkbox" checked readOnly/><div className="activity-body"><strong>{a.descripcion}</strong><span className="muted">Completada</span></div></div>)}{!seleccionado.actividades.some(a=>a.completada)&&<p className="muted activity">No hay actividades completadas.</p>}</div></> : <div className="empty"><div><h2>Seleccioná un cliente</h2><p className="muted">o agregá uno nuevo para comenzar.</p></div></div>}</section></main>;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
