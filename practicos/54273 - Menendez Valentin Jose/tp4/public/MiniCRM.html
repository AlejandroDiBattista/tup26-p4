<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    async function pedirJSON(url, opciones) {
      const respuesta = await fetch(url, opciones);
      const datos = await respuesta.json().catch(() => null);
      if (!respuesta.ok) {
        const mensaje =
          datos && typeof datos.error === 'string'
            ? datos.error
            : 'Ocurrió un error al comunicarse con el servidor';
        throw new Error(mensaje);
      }
      return datos;
    }

    const PALETA_AVATARES = [
      { fondo: '#dbeafe', texto: '#1d4ed8' },
      { fondo: '#dcfce7', texto: '#15803d' },
      { fondo: '#ede9fe', texto: '#6d28d9' },
      { fondo: '#ffedd5', texto: '#c2410c' },
      { fondo: '#fce7f3', texto: '#be185d' },
      { fondo: '#ccfbf1', texto: '#0f766e' },
    ];

    const FORMULARIO_CLIENTE_VACIO = {
      nombre: '',
      apellido: '',
      email: '',
      telefono: '',
      domicilio: '',
      localidad: '',
    };

    const FORMULARIO_ACTIVIDAD_VACIO = {
      descripcion: '',
      fechaCompromiso: '',
    };

    function obtenerEstiloAvatar(id) {
      const indice = Math.abs((Number(id) || 1) - 1) % PALETA_AVATARES.length;
      return PALETA_AVATARES[indice];
    }

    function obtenerIniciales(nombre, apellido) {
      const inicialNombre = (nombre || '').trim().charAt(0).toUpperCase();
      const inicialApellido = (apellido || '').trim().charAt(0).toUpperCase();
      return `${inicialNombre}${inicialApellido}` || 'CL';
    }

    function obtenerFechaLocalHoy() {
      const hoy = new Date();
      const anio = hoy.getFullYear();
      const mes = String(hoy.getMonth() + 1).padStart(2, '0');
      const dia = String(hoy.getDate()).padStart(2, '0');
      return `${anio}-${mes}-${dia}`;
    }

    function formatearFechaLocal(fechaStr) {
      if (!fechaStr) return 'Sin fecha';
      const fecha = new Date(`${fechaStr}T00:00:00`);
      if (Number.isNaN(fecha.getTime())) return fechaStr;
      return new Intl.DateTimeFormat('es-AR', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
      })
        .format(fecha)
        .replace('.', '');
    }

    function obtenerGrupoCompromiso(fechaCompromiso, hoy) {
      if (!fechaCompromiso) return 0;
      if (fechaCompromiso < hoy) return 1;
      return 2;
    }

    function ordenarCompromisos(lista, hoy) {
      return [...lista].sort((a, b) => {
        const grupoA = obtenerGrupoCompromiso(a.fechaCompromiso, hoy);
        const grupoB = obtenerGrupoCompromiso(b.fechaCompromiso, hoy);
        if (grupoA !== grupoB) return grupoA - grupoB;
        if (a.fechaCompromiso && b.fechaCompromiso) {
          const cmp = a.fechaCompromiso.localeCompare(b.fechaCompromiso);
          if (cmp !== 0) return cmp;
        }
        return a.id - b.id;
      });
    }

    function ordenarCompletadas(lista) {
      return [...lista].sort((a, b) => {
        const fechaA = a.fechaFinalizacion || '';
        const fechaB = b.fechaFinalizacion || '';
        const cmp = fechaB.localeCompare(fechaA);
        if (cmp !== 0) return cmp;
        return b.id - a.id;
      });
    }

    function App() {
      const [clientes, setClientes] = useState([]);
      const [busqueda, setBusqueda] = useState('');
      const [clienteSeleccionadoId, setClienteSeleccionadoId] = useState(null);
      const [clienteDetalle, setClienteDetalle] = useState(null);
      const [modoCliente, setModoCliente] = useState('ver');
      const [formCliente, setFormCliente] = useState(FORMULARIO_CLIENTE_VACIO);
      const [actividadEditandoId, setActividadEditandoId] = useState(null);
      const [formActividad, setFormActividad] = useState(FORMULARIO_ACTIVIDAD_VACIO);
      const [error, setError] = useState('');

      const hoy = obtenerFechaLocalHoy();
      const todasActividades = clienteDetalle?.actividades || [];
      const compromisos = ordenarCompromisos(
        todasActividades.filter((a) => a.fechaFinalizacion === null),
        hoy
      );
      const actividadesCompletadas = ordenarCompletadas(
        todasActividades.filter((a) => a.fechaFinalizacion !== null)
      );

      function limpiarFormularioActividad() {
        setActividadEditandoId(null);
        setFormActividad(FORMULARIO_ACTIVIDAD_VACIO);
      }

      async function cargarClientes(terminoBusqueda, idPreferido) {
        try {
          const query = terminoBusqueda.trim()
            ? `?q=${encodeURIComponent(terminoBusqueda.trim())}`
            : '';
          const lista = await pedirJSON(`/api/clientes${query}`);
          setClientes(lista);

          if (lista.length === 0) {
            setClienteSeleccionadoId(null);
            setClienteDetalle(null);
            return null;
          }

          const idObjetivo = idPreferido !== undefined ? idPreferido : clienteSeleccionadoId;
          const existeEnLista = lista.some((c) => c.id === idObjetivo);
          const nuevoId = existeEnLista ? idObjetivo : lista[0].id;
          setClienteSeleccionadoId(nuevoId);
          return nuevoId;
        } catch (err) {
          setError(err.message);
          return null;
        }
      }

      async function cargarDetalleCliente(id) {
        if (!id) {
          setClienteDetalle(null);
          return;
        }
        try {
          const detalle = await pedirJSON(`/api/clientes/${id}`);
          setClienteDetalle(detalle);
        } catch (err) {
          setError(err.message);
        }
      }

      useEffect(() => {
        cargarClientes(busqueda);
      }, [busqueda]);

      useEffect(() => {
        limpiarFormularioActividad();
        if (clienteSeleccionadoId !== null) {
          cargarDetalleCliente(clienteSeleccionadoId);
        } else {
          setClienteDetalle(null);
        }
      }, [clienteSeleccionadoId]);

      function iniciarAltaCliente() {
        setError('');
        limpiarFormularioActividad();
        setFormCliente(FORMULARIO_CLIENTE_VACIO);
        setModoCliente('crear');
      }

      function iniciarEdicionCliente() {
        if (!clienteDetalle) return;
        setError('');
        setFormCliente({
          nombre: clienteDetalle.nombre || '',
          apellido: clienteDetalle.apellido || '',
          email: clienteDetalle.email || '',
          telefono: clienteDetalle.telefono || '',
          domicilio: clienteDetalle.domicilio || '',
          localidad: clienteDetalle.localidad || '',
        });
        setModoCliente('editar');
      }

      function cancelarFormularioCliente() {
        setError('');
        setModoCliente('ver');
      }

      function cambiarCampoCliente(campo, valor) {
        setFormCliente((prev) => ({
          ...prev,
          [campo]: valor,
        }));
      }

      async function guardarCliente(e) {
        e.preventDefault();
        try {
          setError('');
          if (modoCliente === 'crear') {
            const creado = await pedirJSON('/api/clientes', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formCliente),
            });
            setModoCliente('ver');
            await cargarClientes(busqueda, creado.id);
            setClienteSeleccionadoId(creado.id);
            setClienteDetalle(creado);
          } else if (modoCliente === 'editar' && clienteDetalle) {
            const actualizado = await pedirJSON(`/api/clientes/${clienteDetalle.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formCliente),
            });
            setModoCliente('ver');
            setClienteDetalle(actualizado);
            await cargarClientes(busqueda, actualizado.id);
          }
        } catch (err) {
          setError(err.message);
        }
      }

      async function eliminarClienteActual() {
        if (!clienteDetalle) return;
        try {
          setError('');
          await pedirJSON(`/api/clientes/${clienteDetalle.id}`, {
            method: 'DELETE',
          });
          setModoCliente('ver');
          limpiarFormularioActividad();
          const nuevoId = await cargarClientes(busqueda, null);
          if (nuevoId) {
            await cargarDetalleCliente(nuevoId);
          }
        } catch (err) {
          setError(err.message);
        }
      }

      function seleccionarClienteEnMaestro(id) {
        setError('');
        setModoCliente('ver');
        limpiarFormularioActividad();
        setClienteSeleccionadoId(id);
      }

      function iniciarEdicionActividad(actividad) {
        setError('');
        setActividadEditandoId(actividad.id);
        setFormActividad({
          descripcion: actividad.descripcion || '',
          fechaCompromiso: actividad.fechaCompromiso || '',
        });
      }

      function cancelarEdicionActividad() {
        setError('');
        limpiarFormularioActividad();
      }

      async function guardarActividad(e) {
        e.preventDefault();
        if (!clienteDetalle) return;
        try {
          setError('');
          const payload = {
            descripcion: formActividad.descripcion,
            fechaCompromiso: formActividad.fechaCompromiso || null,
          };

          if (actividadEditandoId === null) {
            await pedirJSON(`/api/clientes/${clienteDetalle.id}/actividades`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
          } else {
            await pedirJSON(
              `/api/clientes/${clienteDetalle.id}/actividades/${actividadEditandoId}`,
              {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              }
            );
          }

          limpiarFormularioActividad();
          await cargarDetalleCliente(clienteDetalle.id);
          await cargarClientes(busqueda, clienteDetalle.id);
        } catch (err) {
          setError(err.message);
        }
      }

      async function completarActividad(actividadId) {
        if (!clienteDetalle) return;
        try {
          setError('');
          await pedirJSON(
            `/api/clientes/${clienteDetalle.id}/actividades/${actividadId}/completar`,
            {
              method: 'PATCH',
            }
          );
          if (actividadEditandoId === actividadId) {
            limpiarFormularioActividad();
          }
          await cargarDetalleCliente(clienteDetalle.id);
          await cargarClientes(busqueda, clienteDetalle.id);
        } catch (err) {
          setError(err.message);
        }
      }

      async function eliminarActividad(actividadId) {
        if (!clienteDetalle) return;
        try {
          setError('');
          await pedirJSON(
            `/api/clientes/${clienteDetalle.id}/actividades/${actividadId}`,
            {
              method: 'DELETE',
            }
          );
          if (actividadEditandoId === actividadId) {
            limpiarFormularioActividad();
          }
          await cargarDetalleCliente(clienteDetalle.id);
          await cargarClientes(busqueda, clienteDetalle.id);
        } catch (err) {
          setError(err.message);
        }
      }

      return (
        <>
          <header className="barra-superior">MiniCRM</header>

          <main className="contenedor-principal">
            <section className="panel-maestro" aria-label="Listado de clientes">
              <div className="maestro-cabecera">
                <h2 className="maestro-titulo">Clientes</h2>
                <button
                  type="button"
                  className="btn-agregar"
                  onClick={iniciarAltaCliente}
                >
                  + Agregar
                </button>
              </div>

              <div className="buscador-contenedor">
                <div className="buscador-caja">
                  <span className="buscador-icono" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <circle cx="11" cy="11" r="8" />
                      <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                  </span>
                  <input
                    type="search"
                    className="buscador-input"
                    placeholder="Buscar por cualquier campo..."
                    value={busqueda}
                    onChange={(e) => setBusqueda(e.target.value)}
                  />
                </div>
              </div>

              <div className="lista-clientes">
                {clientes.length === 0 ? (
                  <div className="estado-vacio">No se encontraron clientes</div>
                ) : (
                  clientes.map((c) => {
                    const colorAvatar = obtenerEstiloAvatar(c.id);
                    const esActivo = c.id === clienteSeleccionadoId && modoCliente !== 'crear';
                    return (
                      <div
                        key={c.id}
                        className={`fila-cliente ${esActivo ? 'activo' : ''}`}
                        onClick={() => seleccionarClienteEnMaestro(c.id)}
                      >
                        <div
                          className="avatar-iniciales"
                          style={{
                            backgroundColor: colorAvatar.fondo,
                            color: colorAvatar.texto,
                          }}
                        >
                          {obtenerIniciales(c.nombre, c.apellido)}
                        </div>
                        <div className="cliente-info">
                          <div className="cliente-nombre-lista">
                            {c.nombre} {c.apellido}
                          </div>
                          <div className="cliente-email-lista">{c.email}</div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </section>

            <section className="panel-detalle" aria-label="Detalle del cliente">
              {error && <div className="alerta-error">{error}</div>}

              {modoCliente === 'crear' || modoCliente === 'editar' ? (
                <div className="ficha-cliente">
                  <h2 className="form-cliente-titulo">
                    {modoCliente === 'crear' ? 'Nuevo cliente' : 'Editar cliente'}
                  </h2>
                  <form onSubmit={guardarCliente}>
                    <div className="form-cliente-grid">
                      <div className="campo-grupo">
                        <label className="campo-etiqueta">Nombre *</label>
                        <input
                          type="text"
                          className="campo-input"
                          placeholder="Nombre"
                          value={formCliente.nombre}
                          onChange={(e) => cambiarCampoCliente('nombre', e.target.value)}
                        />
                      </div>
                      <div className="campo-grupo">
                        <label className="campo-etiqueta">Apellido *</label>
                        <input
                          type="text"
                          className="campo-input"
                          placeholder="Apellido"
                          value={formCliente.apellido}
                          onChange={(e) => cambiarCampoCliente('apellido', e.target.value)}
                        />
                      </div>

                      <div className="campo-grupo">
                        <label className="campo-etiqueta">Email *</label>
                        <input
                          type="email"
                          className="campo-input"
                          placeholder="correo@ejemplo.com"
                          value={formCliente.email}
                          onChange={(e) => cambiarCampoCliente('email', e.target.value)}
                        />
                      </div>
                      <div className="campo-grupo">
                        <label className="campo-etiqueta">Teléfono</label>
                        <input
                          type="text"
                          className="campo-input"
                          placeholder="Ej. 381 555 0123"
                          value={formCliente.telefono}
                          onChange={(e) => cambiarCampoCliente('telefono', e.target.value)}
                        />
                      </div>

                      <div className="campo-grupo">
                        <label className="campo-etiqueta">Domicilio</label>
                        <input
                          type="text"
                          className="campo-input"
                          placeholder="Calle y número"
                          value={formCliente.domicilio}
                          onChange={(e) => cambiarCampoCliente('domicilio', e.target.value)}
                        />
                      </div>
                      <div className="campo-grupo">
                        <label className="campo-etiqueta">Localidad</label>
                        <input
                          type="text"
                          className="campo-input"
                          placeholder="Ciudad / Localidad"
                          value={formCliente.localidad}
                          onChange={(e) => cambiarCampoCliente('localidad', e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="form-cliente-acciones">
                      <button type="submit" className="btn-primario">
                        Guardar
                      </button>
                      <button
                        type="button"
                        className="btn-secundario"
                        onClick={cancelarFormularioCliente}
                      >
                        Cancelar
                      </button>
                    </div>
                  </form>
                </div>
              ) : !clienteDetalle ? (
                <div className="estado-vacio">
                  Selecciona un cliente de la lista o pulsa "+ Agregar" para crear uno nuevo.
                </div>
              ) : (
                <div className="ficha-cliente">
                  <div className="ficha-cabecera">
                    <h1 className="ficha-nombre">
                      {clienteDetalle.nombre} {clienteDetalle.apellido}
                    </h1>
                    <div className="ficha-derecha">
                      <span className="ficha-id">#{clienteDetalle.id}</span>
                      <div className="ficha-acciones">
                        <button
                          type="button"
                          className="btn-ficha btn-editar-cliente"
                          onClick={iniciarEdicionCliente}
                        >
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M12 20h9" />
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                          </svg>
                          Editar
                        </button>
                        <button
                          type="button"
                          className="btn-ficha btn-eliminar-cliente"
                          onClick={eliminarClienteActual}
                        >
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                            <path d="M10 11v6" />
                            <path d="M14 11v6" />
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                          </svg>
                          Eliminar
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="ficha-datos-grid">
                    <div className="dato-columna">
                      <div className="dato-item">
                        <span className="dato-icono" aria-hidden="true">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                          </svg>
                        </span>
                        <span>{clienteDetalle.email}</span>
                      </div>
                      <div className="dato-item">
                        <span className="dato-icono" aria-hidden="true">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                          </svg>
                        </span>
                        <span>{clienteDetalle.telefono || 'Sin teléfono'}</span>
                      </div>
                    </div>

                    <div className="dato-columna">
                      <div className="dato-item">
                        <span className="dato-icono" aria-hidden="true">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                            <circle cx="12" cy="10" r="3" />
                          </svg>
                        </span>
                        <span>{clienteDetalle.domicilio || 'Sin domicilio'}</span>
                      </div>
                      {clienteDetalle.localidad && (
                        <div className="dato-subtexto">{clienteDetalle.localidad}</div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {clienteDetalle && modoCliente !== 'crear' && (
                <>
                  <form className="subformulario-actividad" onSubmit={guardarActividad}>
                    <h3 className="subformulario-titulo">
                      {actividadEditandoId === null ? 'Agregar actividad' : 'Editar actividad'}
                    </h3>
                    <div className="subformulario-fila">
                      <input
                        type="text"
                        className="input-actividad-descripcion"
                        placeholder="Descripción de la actividad"
                        aria-label="Descripción de la actividad"
                        value={formActividad.descripcion}
                        onChange={(e) =>
                          setFormActividad((prev) => ({
                            ...prev,
                            descripcion: e.target.value,
                          }))
                        }
                      />
                      <input
                        type="date"
                        className="input-actividad-fecha"
                        aria-label="Fecha opcional"
                        value={formActividad.fechaCompromiso}
                        onChange={(e) =>
                          setFormActividad((prev) => ({
                            ...prev,
                            fechaCompromiso: e.target.value,
                          }))
                        }
                      />
                      <button type="submit" className="btn-guardar-actividad">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                          <polyline points="17 21 17 13 7 13 7 21" />
                          <polyline points="7 3 7 8 15 8" />
                        </svg>
                        Guardar
                      </button>
                      <button
                        type="button"
                        className="btn-cancelar-actividad"
                        onClick={cancelarEdicionActividad}
                      >
                        ✕ Cancelar
                      </button>
                    </div>
                  </form>

                  <div className="detalle-scroll">
                    <div className="seccion-bloque">
                      <h2 className="seccion-titulo">Compromisos</h2>
                      {compromisos.length === 0 ? (
                        <div className="estado-vacio">No hay compromisos pendientes.</div>
                      ) : (
                        <div className="bloque-compromisos">
                          {compromisos.map((act) => {
                            const esVencida =
                              act.fechaCompromiso !== null && act.fechaCompromiso < hoy;
                            const estaEditando = actividadEditandoId === act.id;
                            return (
                              <div
                                key={act.id}
                                className={`fila-compromiso ${estaEditando ? 'editando' : ''}`}
                              >
                                <input
                                  type="checkbox"
                                  className="checkbox-compromiso"
                                  checked={false}
                                  onChange={() => completarActividad(act.id)}
                                  aria-label={`Completar ${act.descripcion}`}
                                />
                                <div className="actividad-centro">
                                  <div className="actividad-descripcion">{act.descripcion}</div>
                                  {!act.fechaCompromiso ? (
                                    <div className="actividad-fecha">Sin fecha</div>
                                  ) : esVencida ? (
                                    <div className="actividad-fecha vencida">
                                      {formatearFechaLocal(act.fechaCompromiso)} · Vencido
                                    </div>
                                  ) : (
                                    <div className="actividad-fecha">
                                      {formatearFechaLocal(act.fechaCompromiso)}
                                    </div>
                                  )}
                                </div>
                                <div className="compromiso-acciones">
                                  <button
                                    type="button"
                                    className="btn-icono-cuadrado btn-icono-editar"
                                    title="Editar actividad"
                                    aria-label="Editar actividad"
                                    onClick={() => iniciarEdicionActividad(act)}
                                  >
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                      <path d="M12 20h9" />
                                      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                                    </svg>
                                  </button>
                                  <button
                                    type="button"
                                    className="btn-icono-cuadrado btn-icono-eliminar"
                                    title="Eliminar actividad"
                                    aria-label="Eliminar actividad"
                                    onClick={() => eliminarActividad(act.id)}
                                  >
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                      <polyline points="3 6 5 6 21 6" />
                                      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                                      <path d="M10 11v6" />
                                      <path d="M14 11v6" />
                                      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                                    </svg>
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    <div className="seccion-bloque">
                      <h2 className="seccion-titulo">Actividades completadas</h2>
                      {actividadesCompletadas.length === 0 ? (
                        <div className="estado-vacio">No hay actividades completadas.</div>
                      ) : (
                        <div className="bloque-completadas">
                          {actividadesCompletadas.map((act) => (
                            <div key={act.id} className="fila-completada">
                              <div className="icono-completada" aria-hidden="true">
                                ✓
                              </div>
                              <div className="actividad-centro">
                                <div className="actividad-descripcion">{act.descripcion}</div>
                                <div className="actividad-fecha">
                                  Completada el {formatearFechaLocal(act.fechaFinalizacion)}
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </>
              )}
            </section>
          </main>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
