
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>

  
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 32px 20px;
    font: 16px Arial, sans-serif;
    color: #27332b;
    background: #f5f6f4;
  }

  main {
    width: 1104px;
    max-width: 100%;
    margin: 0 auto;
  }

  .agenda-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: normal;
      color: #26352b;
    }

    & > div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      width: 240px;
      max-width: 100%;
      padding: 10px 14px;
      border: 1px solid #d9ded9;
      border-radius: 24px;
      background: #fff;
      font: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;

      &:focus {
        border-color: #879889;
        box-shadow: 0 0 0 3px #87988925;
      }
    }
  }

  button {
    font: inherit;
  }

  .agregar {
    padding: 10px 18px;
    border: none;
    border-radius: 24px;
    background: #304035;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, transform 0.2s;

    &:hover {
      background: #405747;
    }

    &:active {
      transform: scale(0.98);
    }
  }

  ul {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    padding: 0;
    margin: 0;
    list-style: none;
  }

  li {
    min-width: 0;
    padding: 20px 24px;
    border: 1px solid #dce1dc;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 2px 8px #26352b08;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;

    &:hover {
      border-color: #c5cec5;
      box-shadow: 0 5px 16px #26352b12;
    }

    &:focus-visible {
      outline: 2px solid #879889;
      outline-offset: 3px;
    }

    article {
      position: relative;
    }

    article > header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-right: 32px;
      margin-bottom: 18px;
    }

    b {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: normal;
      color: #171d18;
    }

    article > header span {
      font-size: 18px;
      color: #202620;
    }

    address {
      font-style: normal;

      p {
        margin: 0;
        padding: 10px 0;
        color: #59635b;
        overflow-wrap: anywhere;
      }

      p + p {
        border-top: 1px solid #e5e8e4;
        color: #7b847c;
        font-style: italic;
      }
    }

    article > footer > p {
      margin: 0;
      padding-top: 14px;
      border-top: 1px solid #e5e8e4;
      color: #737b73;
      font-size: 14px;
    }

    .favorito {
      position: absolute;
      top: -5px;
      right: -8px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #a18d55;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;

      &:hover {
        background: #a18d5518;
        transform: scale(1.1);
      }
    }
  }

  dialog {
    width: 560px;
    max-width: calc(100% - 32px);
    max-height: calc(100% - 32px);
    overflow-y: auto;
    padding: 28px;
    border: 1px solid #e1e4df;
    border-radius: 18px;
    background: #fff;
    color: #26352b;
    box-shadow: 0 18px 60px #0002;

    &::backdrop {
      background: #17201980;
      backdrop-filter: blur(4px);
    }

    h2 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: normal;
    }
  }

  .campos {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin: 24px 0;
  }

  .campo {
    display: flex;
    flex-direction: column;
    gap: 7px;

    label {
      font-size: 14px;
      font-weight: 600;
      color: #465348;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid #d9ded9;
      border-radius: 8px;
      background: #fbfcfa;
      font: inherit;
      outline: none;

      &:focus {
        border-color: #879889;
        box-shadow: 0 0 0 3px #87988925;
      }
    }
  }

  .error {
    color: #b42318;
    font-size: 13px;
  }

  .acciones {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;

    button {
      padding: 10px 16px;
      border: 1px solid #d9ded9;
      border-radius: 24px;
      font: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
  }

  .guardar {
    border-color: #304035 !important;
    background: #304035;
    color: #fff;

    &:hover {
      background: #405747;
    }
  }

  .cancelar {
    background: #fff;
    color: #304035;

    &:hover {
      background: #f3f5f2;
    }
  }

  @media (max-width: 800px) {
    ul {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 700px) {
    .agenda-header {
      align-items: stretch;
      flex-direction: column;

      & > div {
        flex-wrap: wrap;
      }

      input {
        flex: 1;
        width: auto;
      }
    }
  }

  @media (max-width: 540px) {
    body {
      padding: 24px 14px;
    }

    ul {
      grid-template-columns: 1fr;
    }

    .campos {
      grid-template-columns: 1fr;
    }

    dialog {
      padding: 20px;
    }
  }
</style>

</head>

<body>
  <main id="app"></main>

  


<script type="module">
  import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
  import alumnosIniciales from './alumnos.json' with { type: 'json' }

  const app = document.getElementById('app')

  const datosGuardados = localStorage.getItem('alumnos')

  const alumnosInicialesGuardados = datosGuardados
    ? JSON.parse(datosGuardados)
    : alumnosIniciales

  const estado = reactive({
    alumnos: alumnosInicialesGuardados,
    busqueda: '',
    editando: false,
    alumnoActual: crearAlumnoVacio(),
    errores: {}
  })

  if (!datosGuardados) {
    localStorage.setItem('alumnos', JSON.stringify(alumnosIniciales))
  }

  watch(() => {
    localStorage.setItem('alumnos', JSON.stringify(estado.alumnos))
  })
  function crearAlumnoVacio() {
    return {
      id: 0,
      apellido: '',
      nombre: '',
      legajo: '',
      comision: '',
      telefono: '',
      github: '',
      favorito: false
    }
  }

  function normalizar(texto) {
    return String(texto ?? '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
  }

  function obtenerAlumnos() {
    const busqueda = normalizar(estado.busqueda)

    return estado.alumnos
      .filter(alumno => {
        const datos = `${alumno.apellido} ${alumno.nombre} ${alumno.legajo}`
        return normalizar(datos).includes(busqueda)
      })
      .sort((a, b) =>
        Number(b.favorito) - Number(a.favorito) ||
        a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' }) ||
        a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
      )
  }

  function alternarFavorito(alumno) {
    alumno.favorito = !alumno.favorito
  }

  function agregarAlumno() {
    estado.editando = false
    estado.alumnoActual = crearAlumnoVacio()
    estado.errores = {}
    document.getElementById('dialog_alumno').showModal()
  }

  function editarAlumno(alumno) {
    estado.editando = true
    estado.alumnoActual = { ...alumno }
    estado.errores = {}
    document.getElementById('dialog_alumno').showModal()
  }

  function cerrarFormulario() {
    document.getElementById('dialog_alumno').close()
  }

  function validarAlumno() {
    const alumno = estado.alumnoActual
    const errores = {}

    if (!alumno.apellido.trim()) {
      errores.apellido = 'Ingresá el apellido.'
    }

    if (!alumno.nombre.trim()) {
      errores.nombre = 'Ingresá el nombre.'
    }

    if (!alumno.legajo.trim()) {
      errores.legajo = 'Ingresá el legajo.'
    } else if (!/^\d+$/.test(alumno.legajo)) {
      errores.legajo = 'El legajo debe tener solo números.'
    } else if (estado.alumnos.some(otro =>
      otro.id !== alumno.id && otro.legajo === alumno.legajo
    )) {
      errores.legajo = 'Ese legajo ya existe.'
    }

    estado.errores = errores
    return Object.keys(errores).length === 0
  }

  function guardarAlumno() {
    if (!validarAlumno()) return

    const alumno = { ...estado.alumnoActual }

    if (estado.editando) {
      const posicion = estado.alumnos.findIndex(a => a.id === alumno.id)

      if (posicion !== -1) {
        estado.alumnos[posicion] = alumno
      }
    } else {
      alumno.id = Math.max(0, ...estado.alumnos.map(a => Number(a.id) || 0)) + 1
      estado.alumnos.push(alumno)
    }

    cerrarFormulario()
  }

  function eliminarAlumno() {
    if (!estado.editando) return

    estado.alumnos = estado.alumnos.filter(
      alumno => alumno.id !== estado.alumnoActual.id
    )

    cerrarFormulario()
}

  function mostrarError(campo) {
    return estado.errores[campo]
      ? html`<small class="error">${estado.errores[campo]}</small>`
      : ''
  }

  html`
    <header class="agenda-header">
      <h1>Alumnos</h1>

      <div>
        <input
          type="search"
          placeholder="Buscar alumno..."
          aria-label="Buscar alumnos"
          @input="${e => estado.busqueda = e.target.value}"
        />

        <button class="agregar" type="button" @click="${agregarAlumno}">
          + Agregar
        </button>
      </div>
    </header>

    <ul>
      ${() => obtenerAlumnos().map(alumno => html`
               
<li
  tabindex="0"
  @click="${() => editarAlumno(alumno)}"
  @keydown="${e => {
    if (e.target !== e.currentTarget) return

    if (e.key === 'Enter') {
      e.preventDefault()
      editarAlumno(alumno)
    }
  }}"
>
  <article>
    <header>
      <b>${alumno.apellido}</b>
      <span>${alumno.nombre}</span>

      <button
        class="favorito"
        type="button"
        aria-label="${() => alumno.favorito
          ? 'Quitar de favoritos'
          : 'Marcar como favorito'}"
        aria-pressed="${() => String(alumno.favorito)}"
        @click="${e => {
          e.stopPropagation()
          alternarFavorito(alumno)
        }}"
      >${() => alumno.favorito ? '★' : '☆'}</button>
    </header>

    <address>
      <p>${alumno.telefono}</p>
      <p>@${alumno.github}</p>
    </address>

    <footer>
      <p>${alumno.comision} · Legajo ${alumno.legajo}</p>
    </footer>
  </article>
</li>

      `)}

      ${() => obtenerAlumnos().length === 0
        ? html`<li>No se encontraron alumnos.</li>`
        : ''}
    </ul>

    <dialog id="dialog_alumno">
      <form @submit="${e => {
        e.preventDefault()
        guardarAlumno()
      }}">
        <h2>${() => estado.editando ? 'Editar alumno' : 'Agregar alumno'}</h2>

        <div class="campos">
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input id="apellido" .value="${() => estado.alumnoActual.apellido}"
              @input="${e => estado.alumnoActual.apellido = e.target.value}" />
            ${() => mostrarError('apellido')}
          </div>

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" .value="${() => estado.alumnoActual.nombre}"
              @input="${e => estado.alumnoActual.nombre = e.target.value}" />
            ${() => mostrarError('nombre')}
          </div>

          <div class="campo">
            <label for="legajo">Legajo</label>
            <input id="legajo" inputmode="numeric"
              .value="${() => estado.alumnoActual.legajo}"
              @input="${e => estado.alumnoActual.legajo = e.target.value}" />
            ${() => mostrarError('legajo')}
          </div>

          <div class="campo">
            <label for="comision">Comisión</label>
            <input id="comision" .value="${() => estado.alumnoActual.comision}"
              @input="${e => estado.alumnoActual.comision = e.target.value}" />
          </div>

          <div class="campo">
            <label for="telefono">Teléfono</label>
            <input id="telefono" .value="${() => estado.alumnoActual.telefono}"
              @input="${e => estado.alumnoActual.telefono = e.target.value}" />
          </div>

          <div class="campo">
            <label for="github">GitHub</label>
            <input id="github" .value="${() => estado.alumnoActual.github}"
              @input="${e => estado.alumnoActual.github = e.target.value}" />
          </div>
        </div>

        <div class="acciones">
          ${() => estado.editando
           ? html`
                <button
                 type="button"
                  class="cancelar"
                  @click="${eliminarAlumno}"
                >
                  Eliminar
                </button>
              `
           : ''}

          <button
           class="cancelar"
            type="button"
           @click="${cerrarFormulario}"
         >
            Cancelar
          </button>

         <button class="guardar" type="submit">
           Guardar
         </button>
       </div>
      </form>
    </dialog>
  `(app)
</script>



</body>
</html>
