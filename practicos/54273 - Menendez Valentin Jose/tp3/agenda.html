
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>

  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font: 16px sans-serif;
      background: #f5f6f4;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: auto;
    }

    h1 {
      margin: 0 0 24px;
    }

    ul {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    li {
      position: relative;
      min-width: 0;
      padding: 20px;
      border: 1px solid #d9ded9;
      border-radius: 14px;
      background: white;
      text-align: left;
    }

    li > div:first-child {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 30px;
      margin-bottom: 18px;
    }

    li b {
      font-family: Georgia, serif;
      font-size: 21px;
      font-weight: normal;
    }

    li p {
      margin: 10px 0;
      color: #525b53;
      overflow-wrap: anywhere;
    }

    li p:last-of-type {
      padding-top: 12px;
      margin-bottom: 0;
      border-top: 1px solid #e5e8e4;
      font-size: 13px;
      color: #737b73;
    }

    li .favorito {
      position: absolute;
      top: 12px;
      right: 12px;
    }

    li > button:not(.favorito) {
      margin-top: 14px;
      padding: 7px 12px;
      border: 1px solid #d9ded9;
      border-radius: 18px;
      background: white;
      cursor: pointer;
    }


    .agenda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .agenda-header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: normal;
    }

    .agenda-header > div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

   .agenda-header input {
      box-sizing: border-box;
      width: 240px;
      max-width: 100%;
      padding: 10px 14px;
      border: 1px solid #d9ded9;
      border-radius: 20px;
      background: white;
      font: inherit;
   }

   .favorito {
      border: 0;
      background: transparent;
      color: #8a7b4e;
      font-size: 24px;
      cursor: pointer;
   }

   button {
      font: inherit;
   }  

   .agregar {
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: #304035;
      color: white;
      cursor: pointer;
      white-space: nowrap;
   }

   dialog {
      box-sizing: border-box;
      width: 560px;
      max-width: calc(100% - 32px);
      max-height: calc(100% - 32px);
      overflow-y: auto;
      border: 1px solid #e1e4df;
      border-radius: 16px;
      padding: 28px;
      background: #fff;
      color: #26352b;
      box-shadow: 0 18px 60px #0002;
   }

   dialog::backdrop {
      background: #17201980;
      backdrop-filter: blur(3px);
   }

   dialog h2 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: normal;
    }

   .campos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 24px 0;
   }

   .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
   }

   .campo label {
      font-size: 14px;
      font-weight: 600;
    }
    
   .campo input {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d9ded9;
      border-radius: 8px;
      background: #fbfcfa;
      font: inherit;
   }

    .campo input:focus,
    .agenda-header input:focus {
      outline: 2px solid #8b9e8d;
      outline-offset: 2px;
    }

   .error {
      color: #b42318;
      font-size: 13px;
   }

   .acciones {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
   }

  .acciones button {
      padding: 10px 16px;
      border-radius: 20px;
      font: inherit;
      cursor: pointer;
  }

  .guardar {
      border: 0;
      background: #304035;
      color: white;
  }

  .cancelar {
      border: 1px solid #d9ded9;
      background: white;
      color: #304035;
  }

  @media (max-width: 800px) {
      ul {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

  @media (max-width: 700px) {
      .agenda-header {
        align-items: stretch;
        flex-direction: column;
    }

     .agenda-header > div {
        flex-wrap: wrap;
      }

      .agenda-header input {
        flex: 1;
        width: auto;
      }

     .campos {
       grid-template-columns: 1fr;
     }
    }

    @media (max-width: 540px) {
      ul {
        grid-template-columns: 1fr;
      }

      dialog {
        padding: 20px;
      }

       .campos {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>
  <main id="app"></main>

  


<script type="module">
  import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
  import alumnosIniciales from './alumnos.json' with { type: 'json' }

  const app = document.getElementById('app')

  const datosGuardados = localStorage.getItem('alumnos')

  const alumnosInicialesGuardados = datosGuardados
    ? JSON.parse(datosGuardados)
    : alumnosIniciales

  const estado = reactive({
    alumnos: alumnosInicialesGuardados,
    busqueda: '',
    editando: false,
    alumnoActual: crearAlumnoVacio(),
    errores: {}
  })

  if (!datosGuardados) {
    localStorage.setItem('alumnos', JSON.stringify(alumnosIniciales))
  }

  watch(() => {
    localStorage.setItem('alumnos', JSON.stringify(estado.alumnos))
  })
  function crearAlumnoVacio() {
    return {
      id: 0,
      apellido: '',
      nombre: '',
      legajo: '',
      comision: '',
      telefono: '',
      github: '',
      favorito: false
    }
  }

  function normalizar(texto) {
    return String(texto ?? '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
  }

  function obtenerAlumnos() {
    const busqueda = normalizar(estado.busqueda)

    return estado.alumnos
      .filter(alumno => {
        const datos = `${alumno.apellido} ${alumno.nombre} ${alumno.legajo}`
        return normalizar(datos).includes(busqueda)
      })
      .sort((a, b) =>
        Number(b.favorito) - Number(a.favorito) ||
        a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' }) ||
        a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
      )
  }

  function alternarFavorito(alumno) {
    alumno.favorito = !alumno.favorito
  }

  function agregarAlumno() {
    estado.editando = false
    estado.alumnoActual = crearAlumnoVacio()
    estado.errores = {}
    document.getElementById('dialog_alumno').showModal()
  }

  function editarAlumno(alumno) {
    estado.editando = true
    estado.alumnoActual = { ...alumno }
    estado.errores = {}
    document.getElementById('dialog_alumno').showModal()
  }

  function cerrarFormulario() {
    document.getElementById('dialog_alumno').close()
  }

  function validarAlumno() {
    const alumno = estado.alumnoActual
    const errores = {}

    if (!alumno.apellido.trim()) {
      errores.apellido = 'Ingresá el apellido.'
    }

    if (!alumno.nombre.trim()) {
      errores.nombre = 'Ingresá el nombre.'
    }

    if (!alumno.legajo.trim()) {
      errores.legajo = 'Ingresá el legajo.'
    } else if (!/^\d+$/.test(alumno.legajo)) {
      errores.legajo = 'El legajo debe tener solo números.'
    } else if (estado.alumnos.some(otro =>
      otro.id !== alumno.id && otro.legajo === alumno.legajo
    )) {
      errores.legajo = 'Ese legajo ya existe.'
    }

    estado.errores = errores
    return Object.keys(errores).length === 0
  }

  function guardarAlumno() {
    if (!validarAlumno()) return

    const alumno = { ...estado.alumnoActual }

    if (estado.editando) {
      const posicion = estado.alumnos.findIndex(a => a.id === alumno.id)

      if (posicion !== -1) {
        estado.alumnos[posicion] = alumno
      }
    } else {
      alumno.id = Math.max(0, ...estado.alumnos.map(a => Number(a.id) || 0)) + 1
      estado.alumnos.push(alumno)
    }

    cerrarFormulario()
  }

  function eliminarAlumno() {
    if (!estado.editando) return

    estado.alumnos = estado.alumnos.filter(
      alumno => alumno.id !== estado.alumnoActual.id
    )

    cerrarFormulario()
}

  function mostrarError(campo) {
    return estado.errores[campo]
      ? html`<small class="error">${estado.errores[campo]}</small>`
      : ''
  }

  html`
    <header class="agenda-header">
      <h1>Alumnos</h1>

      <div>
        <input
          type="search"
          placeholder="Buscar alumno..."
          aria-label="Buscar alumnos"
          @input="${e => estado.busqueda = e.target.value}"
        />

        <button class="agregar" type="button" @click="${agregarAlumno}">
          + Agregar
        </button>
      </div>
    </header>

    <ul>
      ${() => obtenerAlumnos().map(alumno => html`
        <li>
          <div>
            <b>${alumno.apellido}</b>
            ${alumno.nombre}

            <button
              class="favorito"
              type="button"
              aria-label="${() => alumno.favorito
                ? 'Quitar de favoritos'
                : 'Marcar como favorito'}"
              aria-pressed="${() => String(alumno.favorito)}"
              @click="${e => {
                e.stopPropagation()
                alternarFavorito(alumno)
              }}"
            >${() => alumno.favorito ? '★' : '☆'}</button>
          </div>

          <p>${alumno.telefono}</p>
          <p>@${alumno.github}</p>
          <p>${alumno.comision} · Legajo ${alumno.legajo}</p>

          <button type="button" @click="${() => editarAlumno(alumno)}">
            Editar
          </button>
        </li>
      `)}

      ${() => obtenerAlumnos().length === 0
        ? html`<li>No se encontraron alumnos.</li>`
        : ''}
    </ul>

    <dialog id="dialog_alumno">
      <form @submit="${e => {
        e.preventDefault()
        guardarAlumno()
      }}">
        <h2>${() => estado.editando ? 'Editar alumno' : 'Agregar alumno'}</h2>

        <div class="campos">
          <div class="campo">
            <label for="apellido">Apellido</label>
            <input id="apellido" .value="${() => estado.alumnoActual.apellido}"
              @input="${e => estado.alumnoActual.apellido = e.target.value}" />
            ${() => mostrarError('apellido')}
          </div>

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" .value="${() => estado.alumnoActual.nombre}"
              @input="${e => estado.alumnoActual.nombre = e.target.value}" />
            ${() => mostrarError('nombre')}
          </div>

          <div class="campo">
            <label for="legajo">Legajo</label>
            <input id="legajo" inputmode="numeric"
              .value="${() => estado.alumnoActual.legajo}"
              @input="${e => estado.alumnoActual.legajo = e.target.value}" />
            ${() => mostrarError('legajo')}
          </div>

          <div class="campo">
            <label for="comision">Comisión</label>
            <input id="comision" .value="${() => estado.alumnoActual.comision}"
              @input="${e => estado.alumnoActual.comision = e.target.value}" />
          </div>

          <div class="campo">
            <label for="telefono">Teléfono</label>
            <input id="telefono" .value="${() => estado.alumnoActual.telefono}"
              @input="${e => estado.alumnoActual.telefono = e.target.value}" />
          </div>

          <div class="campo">
            <label for="github">GitHub</label>
            <input id="github" .value="${() => estado.alumnoActual.github}"
              @input="${e => estado.alumnoActual.github = e.target.value}" />
          </div>
        </div>

        <div class="acciones">
          ${() => estado.editando
           ? html`
                <button
                 type="button"
                  class="cancelar"
                  @click="${eliminarAlumno}"
                >
                  Eliminar
                </button>
              `
           : ''}

          <button
           class="cancelar"
            type="button"
           @click="${cerrarFormulario}"
         >
            Cancelar
          </button>

         <button class="guardar" type="submit">
           Guardar
         </button>
       </div>
      </form>
    </dialog>
  `(app)
</script>



</body>
</html>
