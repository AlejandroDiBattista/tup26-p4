<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f5f3;
      color: #222;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: 0 auto;
    }

    header.principal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;

      h1 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
      }
    }

    .listado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .tarjeta {
      background: #ffffff;
      border: 1px solid #e1e4dc;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 180px;

      .tarjeta-cabecera {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        h2 {
          margin: 0;
          font-size: 1.15rem;
          font-family: Georgia, serif;
          line-height: 1.2;

          .apellido {
            font-weight: bold;
            color: #1f2937;
          }

          .nombre {
            font-weight: normal;
            color: #4b5563;
          }
        }

        .btn-favorito {
          background: none;
          border: none;
          font-size: 1.4rem;
          cursor: pointer;
          color: #71716b;
          padding: 0;
          line-height: 1;

          &.activo {
            color: #6b6947;
          }
        }
      }

      .tarjeta-contacto {
        font-style: normal;
        display: flex;
        flex-direction: column;
        gap: 4px;

        .telefono {
          font-weight: 600;
          color: #1f2937;
        }

        .github {
          color: #6b7280;
          font-size: 0.95rem;
        }
      }

      .tarjeta-pie {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid #eee;
        color: #555;
        font-size: 0.85rem;
        font-weight: 600;
      }
    }

    @media (max-width: 900px) {
      .listado {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .listado {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }

    const datosGuardados = localStorage.getItem('alumnos')
    let listaInicial = []

    if (datosGuardados) {
      listaInicial = JSON.parse(datosGuardados)
    } else {
      listaInicial = alumnosIniciales
      localStorage.setItem('alumnos', JSON.stringify(listaInicial))
    }

    const estado = reactive({
      alumnos: listaInicial
    })

    function guardarEnStorage() {
      localStorage.setItem('alumnos', JSON.stringify(estado.alumnos))
    }

    function ordenarAlumnos(lista) {
      return [...lista].sort((a, b) => {
        if (a.favorito !== b.favorito) {
          return a.favorito ? -1 : 1
        }
        const cmpApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' })
        if (cmpApellido !== 0) {
          return cmpApellido
        }
        return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
      })
    }

    function toggleFavorito(alumno, e) {
      if (e) e.stopPropagation()
      alumno.favorito = !alumno.favorito
      estado.alumnos = [...estado.alumnos]
      guardarEnStorage()
    }

    const app = document.getElementById('app')

    const vista = html`
      <header class="principal">
        <h1>Agenda</h1>
      </header>

      <section class="listado">
        ${() => ordenarAlumnos(estado.alumnos).map(alumno => html`
          <article class="tarjeta">
            <header class="tarjeta-cabecera">
              <h2>
                <span class="apellido">${alumno.apellido}</span>
                <span class="nombre">${alumno.nombre}</span>
              </h2>
              <button 
                class="${() => alumno.favorito ? 'btn-favorito activo' : 'btn-favorito'}" 
                type="button"
                @click="${(e) => toggleFavorito(alumno, e)}"
              >
                ${() => alumno.favorito ? '★' : '☆'}
              </button>
            </header>

            <address class="tarjeta-contacto">
              <div class="telefono">${alumno.telefono}</div>
              <div class="github">@${alumno.github}</div>
            </address>

            <footer class="tarjeta-pie">
              <span>${alumno.comision} · ${alumno.legajo}</span>
            </footer>
          </article>
        `)}
      </section>
    `

    vista(app)
  </script>
</body>
</html>
