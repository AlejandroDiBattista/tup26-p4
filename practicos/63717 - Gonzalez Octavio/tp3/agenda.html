<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f5f3;
      color: #333;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;

      h1 {
        margin: 0;
        font-size: 2rem;
      }
    }

    ul {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 0;
      list-style: none;
    }

    li {
      background: white;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    @media (max-width: 900px) {
      ul {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      ul {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }

    const datosGuardados = localStorage.getItem('alumnos')
    let listaInicial = []

    if (datosGuardados) {
      listaInicial = JSON.parse(datosGuardados)
    } else {
      listaInicial = alumnosIniciales
      localStorage.setItem('alumnos', JSON.stringify(listaInicial))
    }

    const estado = reactive({
      alumnos: listaInicial
    })

    function guardarEnStorage() {
      localStorage.setItem('alumnos', JSON.stringify(estado.alumnos))
    }

    const app = document.getElementById('app')

    const vista = html`
      <header>
        <h1>Agenda</h1>
      </header>

      <section>
        <ul>
          ${() => estado.alumnos.map(alumno => html`
            <li>
              <strong>${alumno.apellido}</strong>, ${alumno.nombre}
            </li>
          `)}
        </ul>
      </section>
    `

    vista(app)
  </script>
</body>
</html>
