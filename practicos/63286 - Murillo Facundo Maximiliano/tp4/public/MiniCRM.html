<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#243a5a" />
    <title>MiniCRM</title>
    <link rel="stylesheet" href="/MiniCRM.css" />
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

    <script id="app-jsx" type="text/plain">
      const { useEffect, useMemo, useState } = React;

      const icons = {
        search: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16 16 5 5"/></svg>,
        mail: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>,
        phone: <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.32.57 3.58.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.26.2 2.46.57 3.58a1 1 0 0 1-.24 1.02l-2.23 2.2Z"/></svg>,
        pin: <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>,
        check: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m5 12 4 4L19 6"/></svg>,
        plus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg>,
        edit: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="m15 5 4 4M4 20l4-.8L19.5 7.7a2.1 2.1 0 0 0-3-3L5 16.2 4 20Z"/></svg>,
        trash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>,
        close: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 6 12 12M18 6 6 18"/></svg>,
        save: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 3h12l4 4v14H3V3h2Zm2 0v6h10V3M7 21v-8h10v8"/></svg>
      };

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers }
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || "No se pudo completar la solicitud.");
        return result.data;
      }

      function fechaLocalHoy() {
        const hoy = new Date();
        return `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}-${String(hoy.getDate()).padStart(2, "0")}`;
      }

      function mostrarFecha(fecha) {
        if (!fecha) return "";
        return new Date(`${fecha}T00:00:00`).toLocaleDateString("es-AR", {
          day: "2-digit", month: "short", year: "numeric"
        });
      }

      function iniciales(cliente) {
        return `${cliente.nombre?.[0] || ""}${cliente.apellido?.[0] || ""}`.toLocaleUpperCase("es-AR");
      }

      function ClientRow({ cliente, seleccionado, onSelect }) {
        return <button className="client-row" type="button" aria-current={seleccionado ? "true" : undefined}
          aria-label={`Ver ficha de ${cliente.nombre} ${cliente.apellido}`} onClick={onSelect}>
          <span className="avatar" aria-hidden="true">{iniciales(cliente)}</span>
          <span className="client-copy">
            <span className="client-name">{cliente.nombre} {cliente.apellido}</span>
            <span className="client-email">{cliente.email}</span>
          </span>
        </button>;
      }

      function ClientList({ clientes, seleccionadoId, onSelect, busqueda, setBusqueda, cargando, onCrear }) {
        return <aside className="panel master" aria-label="Listado de clientes">
          <div className="master-heading"><h1>Clientes</h1>
            <button className="button primary add-client" type="button" onClick={onCrear} aria-label="Agregar cliente">
              {icons.plus}<span>Agregar</span>
            </button>
          </div>
          <label className="search-box">
            {icons.search}
            <input type="search" value={busqueda} onChange={(event) => setBusqueda(event.target.value)}
              placeholder="Buscar por cualquier campo..." aria-label="Buscar clientes por cualquier campo" />
          </label>
          <div className="client-list" aria-live="polite">
            {cargando ? <div className="state-message">Cargando clientes...</div>
              : clientes.length === 0 ? <div className="state-message"><strong>No hay clientes</strong>Probá con otra búsqueda.</div>
              : clientes.map((cliente) => <ClientRow key={cliente.id} cliente={cliente}
                  seleccionado={cliente.id === seleccionadoId} onSelect={() => onSelect(cliente.id)} />)}
          </div>
        </aside>;
      }

      function Contacto({ icono, children, clase = "" }) {
        return <div className={`contact-item ${clase}`}>{icono}<span>{children || "Sin dato"}</span></div>;
      }

      function Actividad({ actividad, completada, onCompletar, onEditar, onEliminar }) {
        const vencida = !completada && actividad.fechaCompromiso && actividad.fechaCompromiso < fechaLocalHoy();
        const detalleFecha = completada
          ? `Completada el ${mostrarFecha(actividad.fechaFinalizacion)}`
          : actividad.fechaCompromiso
            ? `${mostrarFecha(actividad.fechaCompromiso)}${vencida ? " · Vencido" : ""}`
            : "Sin fecha de compromiso";
        return <li className={`activity-row ${completada ? "is-completed" : ""}`}>
          {completada
            ? <span className="activity-mark" aria-hidden="true">{icons.check}</span>
            : <button className="activity-mark pending-check" type="button" aria-label={`Completar: ${actividad.descripcion}`} onClick={() => onCompletar(actividad.id)} />}
          <span className="activity-copy">
            <span className="activity-description">{actividad.descripcion}</span>
            <span className={`activity-date ${vencida ? "overdue" : ""}`}>{detalleFecha}</span>
          </span>
          {!completada && <span className="activity-actions">
            <button className="icon-button" type="button" aria-label={`Editar: ${actividad.descripcion}`} onClick={() => onEditar(actividad)}>{icons.edit}</button>
            <button className="icon-button danger" type="button" aria-label={`Eliminar: ${actividad.descripcion}`} onClick={() => onEliminar(actividad)}>{icons.trash}</button>
          </span>}
        </li>;
      }

      function GrupoActividades({ titulo, actividades, completada, onCompletar, onEditar, onEliminar }) {
        return <section className="section" aria-label={titulo}>
          <h3>{titulo}</h3>
          <ul className={`activity-list ${completada ? "completed" : ""}`}>
            {actividades.length === 0
              ? <li className="empty-group">No hay actividades {completada ? "completadas" : "pendientes"}.</li>
              : actividades.map((actividad) => <Actividad key={actividad.id} actividad={actividad} completada={completada}
                  onCompletar={onCompletar} onEditar={onEditar} onEliminar={onEliminar} />)}
          </ul>
        </section>;
      }

      function Campo({ etiqueta, ...props }) {
        return <input {...props} aria-label={etiqueta} placeholder={etiqueta} />;
      }

      function FormularioCliente({ cliente, onGuardar, onCancelar }) {
        const [valores, setValores] = useState(() => ({
          nombre: cliente?.nombre || "", apellido: cliente?.apellido || "", email: cliente?.email || "",
          telefono: cliente?.telefono || "", domicilio: cliente?.domicilio || "", localidad: cliente?.localidad || ""
        }));
        const [guardando, setGuardando] = useState(false);
        function cambiar(event) { setValores((actuales) => ({ ...actuales, [event.target.name]: event.target.value })); }
        async function enviar(event) {
          event.preventDefault(); setGuardando(true);
          try { await onGuardar(valores); } finally { setGuardando(false); }
        }
        return <form className="customer-form" onSubmit={enviar}>
          <div className="form-heading"><h2>{cliente ? "Editar cliente" : "Agregar cliente"}</h2>{cliente && <span className="detail-id">#{cliente.id}</span>}</div>
          <div className="customer-fields">
            <Campo etiqueta="Nombre" name="nombre" value={valores.nombre} onChange={cambiar} required maxLength="100" autoComplete="given-name" />
            <Campo etiqueta="Apellido" name="apellido" value={valores.apellido} onChange={cambiar} required maxLength="100" autoComplete="family-name" />
            <Campo etiqueta="Email" name="email" type="email" value={valores.email} onChange={cambiar} required maxLength="254" autoComplete="email" />
            <Campo etiqueta="Teléfono" name="telefono" type="tel" value={valores.telefono} onChange={cambiar} maxLength="40" autoComplete="tel" />
            <Campo etiqueta="Domicilio" name="domicilio" value={valores.domicilio} onChange={cambiar} maxLength="200" autoComplete="street-address" />
            <Campo etiqueta="Localidad" name="localidad" value={valores.localidad} onChange={cambiar} maxLength="200" autoComplete="address-level2" />
          </div>
          <div className="form-actions">
            <button className="button primary" type="submit" disabled={guardando}>{guardando ? "Guardando..." : "Guardar"}</button>
            <button className="button" type="button" onClick={onCancelar} disabled={guardando}>Cancelar</button>
          </div>
        </form>;
      }

      function EditorActividad({ actividad, onGuardar, onCancelar }) {
        const [descripcion, setDescripcion] = useState(actividad?.descripcion || "");
        const [fechaCompromiso, setFechaCompromiso] = useState(actividad?.fechaCompromiso || "");
        const [guardando, setGuardando] = useState(false);
        async function enviar(event) {
          event.preventDefault(); setGuardando(true);
          try {
            const guardado = await onGuardar({ descripcion: descripcion.trim(), fechaCompromiso: fechaCompromiso || null });
            if (guardado !== false) onCancelar();
          }
          finally { setGuardando(false); }
        }
        return <form className="activity-form" onSubmit={enviar}>
          <input type="text" value={descripcion} onChange={(event) => setDescripcion(event.target.value)}
            placeholder="Descripción de la actividad" aria-label="Descripción de la actividad" required maxLength="500" />
          <input type="date" value={fechaCompromiso} onChange={(event) => setFechaCompromiso(event.target.value)}
            aria-label="Fecha opcional de compromiso" title="Fecha opcional de compromiso" />
          <button className="button primary icon-label" type="submit" disabled={guardando} aria-label={guardando ? "Guardando actividad" : "Guardar actividad"}>
            {icons.save}<span>Guardar</span>
          </button>
          <button className="button icon-label" type="button" onClick={onCancelar} disabled={guardando} aria-label="Cancelar actividad">
            {icons.close}<span>Cancelar</span>
          </button>
        </form>;
      }

      function Ficha({ cliente, cargando, modoCliente, onGuardarCliente, onCancelarCliente, onEditarCliente,
          onEliminarCliente, onGuardarActividad, onCompletarActividad, onEliminarActividad }) {
        const [actividadEdicion, setActividadEdicion] = useState(null);
        const grupos = useMemo(() => {
          const actividades = cliente?.actividades || [];
          const pendientes = actividades.filter((actividad) => !actividad.fechaFinalizacion).sort((a, b) => {
            if (!a.fechaCompromiso && b.fechaCompromiso) return -1;
            if (a.fechaCompromiso && !b.fechaCompromiso) return 1;
            return (a.fechaCompromiso || "").localeCompare(b.fechaCompromiso || "");
          });
          const completadas = actividades.filter((actividad) => actividad.fechaFinalizacion)
            .sort((a, b) => b.fechaFinalizacion.localeCompare(a.fechaFinalizacion));
          return { pendientes, completadas };
        }, [cliente]);

        if (modoCliente) return <section className="panel detail">
          <FormularioCliente key={modoCliente === "crear" ? "nuevo" : `editar-${cliente?.id}`}
            cliente={modoCliente === "editar" ? cliente : null} onGuardar={onGuardarCliente} onCancelar={onCancelarCliente} />
        </section>;
        if (cargando) return <section className="panel detail"><div className="state-message">Cargando ficha...</div></section>;
        if (!cliente) return <section className="panel detail"><div className="state-message"><strong>Seleccioná un cliente</strong>Su ficha y actividades aparecerán acá.</div></section>;

        return <section className="panel detail" aria-label={`Ficha de ${cliente.nombre} ${cliente.apellido}`}>
          <div className="detail-scroll">
            <header className="detail-heading">
              <div className="detail-title">
                <h2>{cliente.nombre} {cliente.apellido}</h2>
                <div className="contact-grid">
                  <Contacto icono={icons.mail}>{cliente.email}</Contacto>
                  <Contacto icono={icons.phone}>{cliente.telefono}</Contacto>
                  <Contacto clase="contact-address" icono={icons.pin}>
                    {[cliente.domicilio, cliente.localidad].filter(Boolean).join(" · ")}
                  </Contacto>
                </div>
              </div>
              <div className="detail-actions">
                <span className="detail-id">#{cliente.id}</span>
                <button className="button" type="button" onClick={onEditarCliente}>{icons.edit}<span>Editar</span></button>
                <button className="button danger" type="button" onClick={() => onEliminarCliente(cliente)}>{icons.trash}<span>Eliminar</span></button>
              </div>
            </header>
            <EditorActividad key={actividadEdicion?.id || "nueva"} actividad={actividadEdicion}
              onGuardar={async (datos) => {
                const guardado = await onGuardarActividad(actividadEdicion?.id, datos);
                if (guardado !== false) setActividadEdicion(null);
                return guardado;
              }} onCancelar={() => setActividadEdicion(null)} />
            <GrupoActividades titulo="Compromisos" actividades={grupos.pendientes} completada={false}
              onCompletar={async (id) => {
                const completada = await onCompletarActividad(id);
                if (completada && actividadEdicion?.id === id) setActividadEdicion(null);
              }} onEditar={setActividadEdicion} onEliminar={async (actividad) => {
                const eliminada = await onEliminarActividad(actividad);
                if (eliminada && actividadEdicion?.id === actividad.id) setActividadEdicion(null);
              }} />
            <GrupoActividades titulo="Actividades completadas" actividades={grupos.completadas} completada={true} />
          </div>
        </section>;
      }

      function App() {
        const [busqueda, setBusqueda] = useState("");
        const [clientes, setClientes] = useState([]);
        const [seleccionadoId, setSeleccionadoId] = useState(null);
        const [cliente, setCliente] = useState(null);
        const [cargandoLista, setCargandoLista] = useState(true);
        const [cargandoFicha, setCargandoFicha] = useState(false);
        const [error, setError] = useState("");
        const [intento, setIntento] = useState(0);
        const [modoCliente, setModoCliente] = useState(null);

        useEffect(() => {
          const abort = new AbortController();
          const timer = setTimeout(async () => {
            setCargandoLista(true);
            try {
              const query = busqueda.trim() ? `?q=${encodeURIComponent(busqueda.trim())}` : "";
              const datos = await api(`/api/clientes${query}`, { signal: abort.signal });
              setClientes(datos);
              setSeleccionadoId((actual) => datos.some((item) => item.id === actual) ? actual : datos[0]?.id ?? null);
              setError("");
            } catch (err) {
              if (err.name !== "AbortError") setError(err.message);
            } finally {
              if (!abort.signal.aborted) setCargandoLista(false);
            }
          }, busqueda ? 180 : 0);
          return () => { clearTimeout(timer); abort.abort(); };
        }, [busqueda, intento]);

        useEffect(() => {
          if (!seleccionadoId) { setCliente(null); return; }
          const abort = new AbortController();
          setCargandoFicha(true);
          api(`/api/clientes/${seleccionadoId}`, { signal: abort.signal })
            .then((datos) => { setCliente(datos); setError(""); })
            .catch((err) => { if (err.name !== "AbortError") setError(err.message); })
            .finally(() => { if (!abort.signal.aborted) setCargandoFicha(false); });
          return () => abort.abort();
        }, [seleccionadoId, intento]);

        async function guardarCliente(valores) {
          try {
            if (modoCliente === "crear") {
              const nuevo = await api("/api/clientes", { method: "POST", body: JSON.stringify(valores) });
              setBusqueda(""); setSeleccionadoId(nuevo.id);
            } else {
              await api(`/api/clientes/${seleccionadoId}`, { method: "PATCH", body: JSON.stringify(valores) });
            }
            setModoCliente(null); setError(""); setIntento((n) => n + 1);
            return true;
          } catch (err) { setError(err.message); return false; }
        }

        async function eliminarCliente(objetivo) {
          if (!window.confirm(`¿Eliminar a ${objetivo.nombre} ${objetivo.apellido} y todas sus actividades?`)) return;
          try {
            await api(`/api/clientes/${objetivo.id}`, { method: "DELETE" });
            setModoCliente(null); setCliente(null); setSeleccionadoId(null); setError(""); setIntento((n) => n + 1);
          } catch (err) { setError(err.message); }
        }

        async function guardarActividad(id, datos) {
          if (!seleccionadoId) return false;
          try {
            const ruta = id ? `/api/actividades/${id}` : `/api/clientes/${seleccionadoId}/actividades`;
            await api(ruta, { method: id ? "PATCH" : "POST", body: JSON.stringify(datos) });
            setError(""); setIntento((n) => n + 1); return true;
          } catch (err) { setError(err.message); return false; }
        }

        async function completarActividad(id) {
          try {
            await api(`/api/actividades/${id}/completar`, { method: "POST" });
            setError(""); setIntento((n) => n + 1); return true;
          } catch (err) { setError(err.message); return false; }
        }

        async function eliminarActividad(actividad) {
          if (!window.confirm(`¿Eliminar la actividad “${actividad.descripcion}”?`)) return;
          try {
            await api(`/api/actividades/${actividad.id}`, { method: "DELETE" });
            setError(""); setIntento((n) => n + 1); return true;
          } catch (err) { setError(err.message); return false; }
        }

        return <main className="app-shell">
          <header className="topbar">MiniCRM</header>
          {error && <div className="error-banner" role="alert">
            {error} <button className="load-button" type="button" onClick={() => setIntento((n) => n + 1)}>Reintentar</button>
          </div>}
          <div className="workspace">
            <ClientList clientes={clientes} seleccionadoId={seleccionadoId}
              onSelect={(id) => { setModoCliente(null); setSeleccionadoId(id); }}
              busqueda={busqueda} setBusqueda={(value) => { setModoCliente(null); setBusqueda(value); }}
              cargando={cargandoLista} onCrear={() => setModoCliente("crear")} />
            <Ficha key={seleccionadoId || "ninguno"} cliente={cliente} cargando={cargandoFicha} modoCliente={modoCliente}
              onGuardarCliente={guardarCliente} onCancelarCliente={() => setModoCliente(null)}
              onEditarCliente={() => setModoCliente("editar")} onEliminarCliente={eliminarCliente}
              onGuardarActividad={guardarActividad} onCompletarActividad={completarActividad} onEliminarActividad={eliminarActividad} />
          </div>
        </main>;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script>
      const jsx = document.getElementById("app-jsx").textContent;
      const compilado = Babel.transform(jsx, {
        presets: [["react", { runtime: "classic" }]],
        filename: "MiniCRM.jsx"
      }).code;
      new Function("React", "ReactDOM", compilado)(React, ReactDOM);
    </script>
  </body>
</html>
