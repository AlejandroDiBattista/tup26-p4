<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px;
        font:
          16px Arial,
          sans-serif;
        background: #f5f6f4;
        color: #172019;
      }
      main {
        width: 1104px;
        max-width: 100%;
        margin: auto;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 34px;
      }
      ul {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
        li {
          min-width: 0;
          article {
            height: 100%;
            padding: 20px;
            border: 1px solid #d9ded9;
            border-radius: 16px;
            background: white;
            header {
              position: relative;
              padding-right: 40px;
              h2 {
                display: inline;
                margin: 0;
                font-size: 18px;
              }
              span {
                margin-left: 5px;
                color: #39443d;
              }
              button {
                position: absolute;
                top: -7px;
                right: -7px;
                width: 36px;
                height: 36px;
                border: none;
                background: transparent;
                font-size: 25px;
                cursor: pointer;
              }
            }
            address {
              display: flex;
              flex-direction: column;
              gap: 4px;
              margin-top: 18px;
              font-style: normal;
              strong {
                font-size: 15px;
              }
              span {
                color: #59635d;
                font-size: 14px;
              }
            }
            footer {
              margin-top: 18px;
              padding-top: 14px;
              border-top: 1px solid #e1e5e1;
              color: #59635d;
              font-size: 14px;
            }
          }
        }
      }
      @media (max-width: 800px) {
        ul {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 550px) {
        ul {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <script type="module">
      import { html, reactive, watch } from "https://esm.sh/@arrow-js/core";
      import alumnos from "./alumnos.json" with { type: "json" };

      const app = document.getElementById("app");

      const estado = reactive({
        alumnos: alumnos,
        busqueda: "",
      });

      function ordenarAlumnos(lista){

        lista.sort((a,b)=>{
          if(a.favorito === true && b.favorito === false){

            return -1
          
          } else if(b.favorito === true && a.favorito === false){

            return 1
          
          } else {  

            return a.apellido.localeCompare(b.apellido)

          }
        })
      }
      html`
        <h1>Alumnos</h1>
        <ul>
          ${() =>
            estado.alumnos.map(
              (a) =>
                html`<li>
                  <article>
                    <header>
                      <h2>${a.apellido}</h2>
                      <span>${a.nombre}</span>
                      <button>☆</button>
                    </header>
                    <address>
                      <strong>${a.telefono}</strong>
                      <span>@${a.github}</span>
                    </address>
                    <footer>${a.comision} · ${a.legajo}</footer>
                  </article>
                </li>`,
            )}
        </ul>
      `(app);
    </script>
  </body>
</html>
