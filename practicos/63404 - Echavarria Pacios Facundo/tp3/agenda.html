<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    //Imports
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }
    
    //valores Constates
    const STORAGE_KEY = 'alumnos_tp3'

    //FUNCIONES
    //Funcion para obtener los alumnos del local storage o si esta vacio desde el json
    const obtenerAlumnos = () => {
      let datos = localStorage.getItem(STORAGE_KEY)
      
      if (datos) {
        try {
          return JSON.parse(datos)
        } catch (error) {
          console.error(`Error: ${error.message}`);
          return [...alumnos]
        }
      }else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alumnos))
        return [...alumnos]
      }
    }
    
    //Funcion para guardar la lista de alumnos en el locale storage
    const guardarAlumnos = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(estado.alumnos))
    }
    
    //Funcion para ordenar la lista de alumnos segun favoritos y alfabeticamente
    const ordenarAlumnos = (lista) => {
      return [...lista].sort((a, b) => {
        if (a.favorito && !b.favorito) {
          return -1
        }else if (!a.favorito && b.favorito) {
          return 1
        }else if (a.favorito === b.favorito) {
          let compararApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' })
          if (compararApellido === 0) {
            return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
          }else {
            return compararApellido
          }
        }
      })
    }

    //Funcion para cambiar el estado de favorito
    const cambiarFavorito = (id) => {
      let alumnoEncotrado = estado.alumnos.find(a => a.id === id)

      if (!alumnoEncotrado) {
        console.error('El alumno no existe')
        return
      }

      alumnoEncotrado.favorito = !alumnoEncotrado.favorito
      guardarAlumnos()
    }

    //Estados reactivos de ArroJs
    const estado = reactive({
      alumnos: obtenerAlumnos()
    })

    //Return HTML de ArrowJs
    const app = document.getElementById('app')
    html`
      <h1>Alumnos</h1>
      <section>
        ${() => ordenarAlumnos(estado.alumnos).map(a => html`
          <article>
            <header>
              <b>${a.apellido}</b>
              ${a.nombre}
              <button @click="${(e) => {e.stopPropagation(); cambiarFavorito(a.id)}}">
                ${a.favorito ? '\u2605' : '\u2606'}
              </button>
            </header>
            <address>
              ${a.telefono}
              @${a.github}
            </address>
            <footer>
              ${a.comision} . ${a.legajo} 
            </footer>
          </article>
        `)}
      </section>
    `(app)
  </script>
</body>
</html>
