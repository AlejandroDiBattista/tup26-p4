<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    //Imports
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }
    
    //valores Constates
    const STORAGE_KEY = 'alumnos_tp3'

    //FUNCIONES
    //Funcion para obtener los alumnos del local storage o si esta vacio desde el json
    const obtenerAlumnos = () => {
      let datos = localStorage.getItem(STORAGE_KEY)
      
      if (datos) {
        try {
          return JSON.parse(datos)
        } catch (error) {
          console.error(`Error: ${error.message}`);
          return [...alumnos]
        }
      }else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alumnos))
        return [...alumnos]
      }
    }
    
    //Funcion para guardar la lista de alumnos en el locale storage
    const guardarAlumnos = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(estado.alumnos))
    }
    
    //Funcion para ordenar la lista de alumnos segun favoritos y alfabeticamente
    const ordenarAlumnos = (lista) => {
      return [...lista].sort((a, b) => {
        if (a.favorito && !b.favorito) {
          return -1
        }else if (!a.favorito && b.favorito) {
          return 1
        }else if (a.favorito === b.favorito) {
          let compararApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' })
          if (compararApellido === 0) {
            return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
          }else {
            return compararApellido
          }
        }
      })
    }

    //Funcion para cambiar el estado de favorito
    const cambiarFavorito = (id) => {
      let alumnoEncotrado = estado.alumnos.find(a => a.id === id)

      if (!alumnoEncotrado) {
        console.error('El alumno no existe')
        return
      }

      alumnoEncotrado.favorito = !alumnoEncotrado.favorito
      guardarAlumnos()
    }

    //Funcion para mostrar los alumnos segun la busqueda actual
    const verAlumnos = () => {
      const busqueda = estado.busqueda.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      
      if (!busqueda) {
        return estado.alumnos
      }

      return estado.alumnos.filter(a => {
        let apellido = a.apellido.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") 
        let nombre = a.nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")   
        return apellido.includes(busqueda) || nombre.includes(busqueda)
      })
    }

    //Funcion para abrir modal de agregar alumno
    const abrirCrear = () => {
      estado.dialogo.modo = 'crear'
      estado.dialogo.alumno = {
        apellido: '',
        nombre: '',
        legajo: '',
        comision: '',
        telefono: '',
        github: ''
      }
      document.getElementById('modalAlumno').showModal()
    }
    //Funcion para abrir modal de editar alumno
    const abrirEditar = (alumno) => {
      estado.dialogo.modo = 'editar'
      estado.dialogo.alumno = { ...alumno }
      document.getElementById('modalAlumno').showModal()
    }
    //Funcion para cerrar el modal
    const cerrarDialogo = () => {document.getElementById('modalAlumno').close()}

    //Funcion para guardar un alumno unico despues de crarlo o editarlo
    const guardarAlumno = (e, id) => {
      e.preventDefault()
      const formData = new FormData(e.target)
      const {legajo, nombre, apellido, comision, telefono, github} = Object.fromEntries(formData)

      if (!id) {
        id = Date.now()
      }
      

      if (estado.dialogo.modo === 'crear') {
        const nuevoAlumno = {
          id,
          legajo,
          apellido,
          nombre,
          comision,
          telefono,
          github,
          favorito: false
        }

        estado.alumnos.push(nuevoAlumno)
      }else {
        const alumnoEditar = estado.alumnos.find(a => a.id === id)
        if (alumnoEditar) {
          Object.assign(alumnoEditar, { legajo, apellido, nombre, comision, telefono, github })
        }
      }

      guardarAlumnos()
      cerrarDialogo()
    }
    
    //Funcion para eliminar a un alumno
    const eliminarAlumno = (id) => {
      estado.alumnos = estado.alumnos.filter(a => a.id !== id)
      guardarAlumnos()
      cerrarDialogo()
    }

    //Funcion para manejar las teclas del teclado
    const manejarTeclado = (e , alumno) => {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault()
        cambiarFavorito(alumno.id)
      }
      if (e.key === 'Enter') {
        e.preventDefault()
        abrirEditar(alumno)
      }
    }

    //Estados reactivos de ArroJs
    const estado = reactive({
      alumnos: obtenerAlumnos(),
      busqueda: '',
      dialogo: {
        modo: 'crear',
        alumno: null
      }
    })

    //Return HTML de ArrowJs
    const app = document.getElementById('app')
    html`
      <header>
        <h1>Agenda</h1>
        <input type="search" placeholder="Buscar alumno..." @input="${(e) => estado.busqueda = e.target.value}"/>
        <button @click="${abrirCrear}">+ Agregar</button>
      </header>
      <section>
        ${() => {
          const lista = ordenarAlumnos(verAlumnos())
          if (lista.length === 0) {
            return [html`<p>No hay alumnos para mostrar</p>`]
          }

          return lista.map(a => html`
            <article @click="${() => abrirEditar(a)}" tabindex="0" @keydown="${(e) => manejarTeclado(e, a)}">
              <header>
                <b>${a.apellido}</b>
                ${a.nombre}
                <button @click="${(e) => {e.stopPropagation(); cambiarFavorito(a.id)}}" tabindex="-1">
                  ${a.favorito ? '\u2605' : '\u2606'}
                </button>
              </header>
              <address>
                ${a.telefono}
                @${a.github}
              </address>
              <footer>
                ${a.comision} · ${a.legajo} 
              </footer>
            </article>
          `)
        }}
      </section>
      <dialog id="modalAlumno">
        <form @submit="${(e) => guardarAlumno(e, estado.dialogo.alumno?.id)}">
          <h2>${() => estado.dialogo.modo === 'editar' ? 'Editar alumno' : 'Agregar alumno'}</h2>
          <p>${() => estado.dialogo.modo === 'editar' ? 'Actualizá los datos del alumno.' : 'Ingresá los datos del alumno.'}</p>
          <div>
            <label>
              Apellido
              <input type="text" name="apellido" .value="${() => estado.dialogo.alumno?.apellido || ''}" required />
            </label>
            <label>
              Nombre
              <input type="text" name="nombre" .value="${() => estado.dialogo.alumno?.nombre || ''}" required />
            </label>
            <label>
              Legajo
              <input type="text" name="legajo" .value="${() => estado.dialogo.alumno?.legajo || ''}" required />
            </label>
            <label>
              Comisión
              <input type="text" name="comision" .value="${() => estado.dialogo.alumno?.comision || ''}" required />
            </label>
            <label>
              Teléfono
              <input type="tel" name="telefono" .value="${() => estado.dialogo.alumno?.telefono || ''}" required />
            </label>
            <label>
              GitHub
              <input type="text" name="github" .value="${() => estado.dialogo.alumno?.github || ''}" required />
            </label>
          </div>
          <div class="acciones">
            ${() => estado.dialogo.modo === 'editar' ? html`
              <button type="button" @click="${() => eliminarAlumno(estado.dialogo.alumno?.id)}">
                Eliminar
              </button>
            ` : ''}
            <button type="submit">Guardar</button>
            <button type="button" @click="${cerrarDialogo}">Cancelar</button>
          </div>
        </form>
      </dialog>
    `(app)
  </script>
</body>
</html>
