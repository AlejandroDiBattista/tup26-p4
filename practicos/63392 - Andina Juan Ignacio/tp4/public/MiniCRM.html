<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCRM</title>
  <style>
    :root {
      --azul-header: #163a63;
      --azul: #1d6fd8;
      --azul-hover: #185fb8;
      --azul-suave: #edf5ff;
      --azul-borde: #cfe0f5;
      --azul-activo: #e8f1fc;
      --rojo: #dc3545;
      --rojo-hover: #c82333;
      --rojo-suave: #fff1f2;
      --verde: #28a745;
      --verde-suave: #edf7f0;
      --verde-borde: #cce5d4;
      --texto: #212529;
      --texto-sec: #495057;
      --texto-muted: #6c757d;
      --borde: #dee2e6;
      --borde-suave: #e9ecef;
      --fondo: #ffffff;
      --fondo-app: #f4f6f8;
      --radio: 8px;
      --sombra: 0 1px 3px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }

    body {
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      color: var(--texto);
      background: var(--fondo-app);
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 14px;
      background: var(--azul);
      color: #fff;
      transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.2;
      white-space: nowrap;
    }
    button:hover { background: var(--azul-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button:focus-visible,
    .cliente-btn:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    .chk-completar:focus-visible {
      outline: 3px solid rgba(29, 111, 216, 0.35);
      outline-offset: 1px;
    }

    button.secundario {
      background: #fff;
      color: var(--texto-sec);
      border-color: var(--borde);
    }
    button.secundario:hover { background: #f8f9fa; color: var(--texto); }

    button.peligro { background: var(--rojo); color: #fff; border-color: var(--rojo); }
    button.peligro:hover { background: var(--rojo-hover); border-color: var(--rojo-hover); }

    button.btn-icono {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--texto-muted);
      border-color: transparent;
    }
    button.btn-icono:hover { background: #f1f3f5; color: var(--texto); }
    button.btn-icono.peligro-icono:hover { background: var(--rojo-suave); color: var(--rojo); }

    .icono { width: 16px; height: 16px; flex-shrink: 0; display: block; }
    .icono-sm { width: 15px; height: 15px; flex-shrink: 0; display: block; }

    input, textarea {
      font: inherit;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background: #fff;
      color: inherit;
    }
    input:focus, textarea:focus {
      border-color: #86b7fe;
      outline: 0;
      box-shadow: 0 0 0 3px rgba(29,111,216,0.15);
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 52px;
      min-height: 52px;
      background: var(--azul-header);
      color: #fff;
      flex-shrink: 0;
    }
    .topbar h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }

    /* ---------- Maestro ---------- */
    .maestro {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #fff;
      border-right: 1px solid var(--borde);
    }

    .maestro-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 20px 14px;
    }
    .maestro-cabecera h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .btn-agregar {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
    }

    .buscador {
      padding: 0 20px 16px;
      border-bottom: 1px solid var(--borde-suave);
    }
    .buscador-wrap {
      position: relative;
    }
    .buscador-wrap .icono-buscar {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #8a949e;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .buscador input {
      padding-left: 38px;
      background: #fff;
      border-color: #ced4da;
      height: 40px;
    }

    .maestro-lista {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 8px 12px;
    }

    .cliente-item { margin: 0 0 2px; padding: 0; }

    .cliente-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
    }
    .cliente-btn:hover { background: #f8f9fa; }
    .cliente-btn.activo {
      background: var(--azul-activo);
      border-color: #d6e6f7;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #e3edf7;
      color: #2c5f8a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      letter-spacing: 0.2px;
    }

    .cliente-texto { min-width: 0; flex: 1; }
    .cliente-texto strong {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cliente-texto span {
      display: block;
      font-size: 13px;
      color: var(--texto-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Detalle ---------- */
    .detalle {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      padding: 24px 28px;
      gap: 20px;
      overflow: hidden;
      background: #fff;
    }

    .vacio {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--texto-muted);
      text-align: center;
      gap: 8px;
    }
    .vacio h2 { margin: 0; font-size: 28px; color: #495057; font-weight: 600; }
    .vacio p { margin: 0; font-size: 15px; }

    .ficha {
      padding-bottom: 4px;
    }

    .ficha-cabecera {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .ficha-identidad { min-width: 0; }
    .ficha-nombre {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .ficha h2 { margin: 0; font-size: 32px; font-weight: 700; color: #1a1a1a; line-height: 1.2; }
    .badge-id {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      background: #eef2f7;
      color: #495057;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      flex-shrink: 0;
    }
    .ficha-ciudad {
      margin-top: 4px;
      font-size: 15px;
      color: var(--texto-muted);
    }

    .acciones { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

    .ficha-datos {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr);
      gap: 10px 40px;
      max-width: 760px;
    }

    .dato {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
      color: #495057;
    }
    .dato .icono { color: #6c757d; }
    .dato-texto { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .panel { background: #fff; }

    .formulario {
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 20px;
      background: #fff;
    }
    .formulario h3 { margin: 0 0 16px; font-size: 20px; font-weight: 700; color: #1a1a1a; }

    .grilla {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .campo { display: flex; flex-direction: column; gap: 6px; }
    .campo label { font-size: 13px; font-weight: 600; color: #495057; }

    .form-acciones {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .alerta {
      background: var(--rojo-suave);
      border: 1px solid #f5c2c7;
      color: #842029;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
    }

    /* ---------- Actividades ---------- */
    .actividades {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow: hidden;
    }

    .bloque {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .bloque-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 0 12px;
    }

    .bloque-cabecera h3 { margin: 0; font-size: 22px; font-weight: 700; color: #1a1a1a; }

    .subformulario {
      padding: 0 0 16px;
    }
    .subform-panel {
      border: 1px solid var(--borde-suave);
      border-radius: 8px;
      padding: 16px;
      background: #fff;
    }
    .subform-titulo { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #495057; }

    .subformulario .grilla { grid-template-columns: 1fr 220px; align-items: end; }
    .subformulario textarea { resize: vertical; min-height: 42px; }
    .fecha-wrap { position: relative; }
    .fecha-wrap input { padding-right: 40px; }
    .btn-calendario {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--texto-muted);
      border-radius: 4px;
    }
    .btn-calendario:hover { background: #f1f3f5; color: var(--texto); }

    .lista-actividades {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--borde-suave);
    }

    .actividad {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--borde-suave);
    }

    .actividad-info { min-width: 0; flex: 1; }
    .actividad-row { display: flex; align-items: flex-start; gap: 12px; }
    .actividad-descripcion { word-break: break-word; color: #212529; font-size: 14px; line-height: 1.45; }

    .actividad-fecha {
      display: block;
      font-size: 13px;
      color: var(--texto-muted);
      margin-top: 2px;
    }
    .chip-vencida {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 12px;
      background: var(--rojo-suave);
      color: #c82333;
      font-size: 12px;
      font-weight: 600;
      vertical-align: baseline;
    }

    .chk-completar {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      margin: 1px 0 0;
      border: 2px solid #adb5bd;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: grid;
      place-content: center;
    }
    .chk-completar::before {
      content: "";
      width: 10px;
      height: 6px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) scale(0);
      margin-top: -2px;
      transition: transform 0.1s ease-in-out;
    }
    .chk-completar:hover { border-color: var(--azul); }
    .chk-completar:checked {
      background: var(--verde);
      border-color: var(--verde);
    }
    .chk-completar:checked::before { transform: rotate(-45deg) scale(1); }

    .actividad.hecha .actividad-descripcion { color: #495057; }
    .actividad.hecha .actividad-fecha { color: #5f7a66; }

    .check-verde {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--verde);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .check-verde .icono-sm { width: 12px; height: 12px; }

    .vacio-lista {
      padding: 20px 4px;
      color: var(--texto-muted);
      font-size: 13px;
    }

    .cargando-linea {
      padding: 10px 4px;
      font-size: 13px;
      color: var(--texto-muted);
      border-bottom: 1px solid var(--borde-suave);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(220px, 38vh) minmax(0, 1fr);
      }
      .maestro {
        border-right: 0;
        border-bottom: 1px solid var(--borde);
      }
      .detalle { padding: 20px; }
      .ficha h2 { font-size: 28px; }
    }

    @media (max-width: 640px) {
      .topbar { padding: 0 16px; height: 52px; min-height: 52px; }
      .topbar h1 { font-size: 22px; }
      .maestro-cabecera { padding: 16px 16px 12px; }
      .maestro-cabecera h2 { font-size: 24px; }
      .buscador { padding: 0 16px 14px; }
      .detalle { padding: 16px; gap: 16px; }
      .subformulario .grilla { grid-template-columns: 1fr; }
      .ficha-cabecera { flex-direction: column; align-items: stretch; }
      .acciones { justify-content: flex-start; }
      .form-acciones { justify-content: stretch; }
      .form-acciones button { flex: 1; }
      .bloque-cabecera h3 { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useEffect, useMemo, useState } = React;

    const IconoMas = () => (
      <svg className="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    );
    const IconoBuscar = () => (
      <svg className="icono-buscar" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    );
    const IconoEditar = () => (
      <svg className="icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
    );
    const IconoBorrar = () => (
      <svg className="icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg>
    );
    const IconoGuardar = () => (
      <svg className="icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
    );
    const IconoX = () => (
      <svg className="icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    );
    const IconoCheck = () => (
      <svg className="icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    );
    const IconoMail = () => (
      <svg className="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    );
    const IconoTel = () => (
      <svg className="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07A19.5 19.5 0 0 1 3.69 12.8a19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 2.6 2h3a2 2 0 0 1 2 1.72c.13 1 .37 1.99.72 2.93a2 2 0 0 1-.45 2.11L6.91 9.91a16 16 0 0 0 7.18 7.18l1.15-1.15a2 2 0 0 1 2.11-.45c.94.35 1.93.59 2.93.72A2 2 0 0 1 22 16.92z"/></svg>
    );
    const IconoPin = () => (
      <svg className="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    );
    const IconoCalendario = () => (
      <svg className="icono-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    );

    async function pedir(url, opciones = {}) {
      const respuesta = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...opciones,
      });

      if (respuesta.status === 204) return null;

      const cuerpo = await respuesta.json().catch(() => null);

      if (!respuesta.ok) {
        throw new Error((cuerpo && cuerpo.error) || "No se pudo completar la operación");
      }

      return cuerpo;
    }

    function formatearFecha(fecha) {
      if (!fecha) return "";
      const partes = String(fecha).slice(0, 10).split("-");
      if (partes.length !== 3) return fecha;
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function hoyISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function estaVencida(fecha, completada) {
      if (completada || !fecha) return false;
      return String(fecha).slice(0, 10) < hoyISO();
    }

    function iniciales(nombre) {
      const partes = String(nombre || "").trim().split(/\s+/).filter(Boolean);
      if (partes.length === 0) return "?";
      const primera = partes[0][0] || "";
      const segunda = partes.length > 1 ? partes[partes.length - 1][0] || "" : (partes[0][1] || "");
      return (primera + segunda).toUpperCase();
    }

    const PALETA_AVATAR = ["#dbeafe", "#dcfce7", "#ede9fe", "#ffedd5", "#fce7f3", "#ccfbf1", "#e0e7ff"];
    const COLOR_TEXTO_AVATAR = ["#1d4ed8", "#15803d", "#7c3aed", "#c2410c", "#be185d", "#0f766e", "#4338ca"];
    function colorAvatar(nombre) {
      const txt = String(nombre || "");
      let hash = 0;
      for (let i = 0; i < txt.length; i++) hash = (hash * 31 + txt.charCodeAt(i)) >>> 0;
      const idx = hash % PALETA_AVATAR.length;
      return { bg: PALETA_AVATAR[idx], fg: COLOR_TEXTO_AVATAR[idx] };
    }

    function fechaISOaTexto(fecha) {
      if (!fecha) return "";
      const p = String(fecha).slice(0, 10).split("-");
      if (p.length !== 3) return String(fecha);
      return `${p[2]}/${p[1]}/${p[0]}`;
    }

    function fechaTextoAISO(texto) {
      const m = String(texto || "").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!m) return null;
      const [, dd, mm, yyyy] = m;
      const iso = `${yyyy}-${mm}-${dd}`;
      const d = new Date(`${iso}T00:00:00`);
      if (Number.isNaN(d.getTime())) return null;
      if (d.getUTCFullYear() !== Number(yyyy) || d.getUTCMonth() + 1 !== Number(mm) || d.getUTCDate() !== Number(dd)) return null;
      return iso;
    }

    function clienteVacio() {
      return { nombre: "", email: "", telefono: "", direccion: "", ciudad: "" };
    }

    function App() {
      const [clientes, setClientes] = useState([]);
      const [busqueda, setBusqueda] = useState("");
      const [seleccionado, setSeleccionado] = useState(null);
      const [actividades, setActividades] = useState([]);
      const [modoCliente, setModoCliente] = useState("ver");
      const [formCliente, setFormCliente] = useState(clienteVacio());
      const [formActividad, setFormActividad] = useState(null);
      const [error, setError] = useState("");
      const [cargandoLista, setCargandoLista] = useState(false);
      const [cargandoActividades, setCargandoActividades] = useState(false);
      const [guardando, setGuardando] = useState(false);

      async function cargarClientes(texto = busqueda) {
        setCargandoLista(true);
        try {
          const datos = await pedir(`/api/clientes?buscar=${encodeURIComponent(texto)}`);
          setClientes(datos);
          setError("");
          return datos;
        } catch (e) {
          setError(e.message);
          return [];
        } finally {
          setCargandoLista(false);
        }
      }

      async function cargarActividades(cliente) {
        if (!cliente) return [];
        setCargandoActividades(true);
        try {
          const datos = await pedir(`/api/clientes/${cliente.id}/actividades`);
          setActividades(datos);
          return datos;
        } catch (e) {
          setError(e.message);
          return [];
        } finally {
          setCargandoActividades(false);
        }
      }

      async function seleccionar(cliente) {
        setSeleccionado(cliente);
        setModoCliente("ver");
        setFormActividad(null);
        setError("");
        await cargarActividades(cliente);
      }

      useEffect(() => {
        cargarClientes(busqueda);
      }, [busqueda]);

      useEffect(() => {
        if (seleccionado) {
          const actualizado = clientes.find((c) => c.id === seleccionado.id);
          if (actualizado && actualizado !== seleccionado) {
            setSeleccionado(actualizado);
          }
        }
      }, [clientes, seleccionado]);

      function agregarCliente() {
        setModoCliente("alta");
        setFormCliente(clienteVacio());
        setFormActividad(null);
        setError("");
      }

      function editarCliente() {
        if (!seleccionado) return;
        setModoCliente("editar");
        setFormCliente({
          nombre: seleccionado.nombre ?? "",
          email: seleccionado.email ?? "",
          telefono: seleccionado.telefono ?? "",
          direccion: seleccionado.direccion ?? "",
          ciudad: seleccionado.ciudad ?? "",
        });
        setError("");
      }

      async function guardarCliente(evento) {
        evento.preventDefault();
        setGuardando(true);
        try {
          const datos = { ...formCliente };
          const guardado =
            modoCliente === "editar" && seleccionado
              ? await pedir(`/api/clientes/${seleccionado.id}`, {
                  method: "PUT",
                  body: JSON.stringify(datos),
                })
              : await pedir("/api/clientes", {
                  method: "POST",
                  body: JSON.stringify(datos),
                });

          const lista = await cargarClientes();
          const encontrado = lista.find((c) => c.id === guardado.id) || guardado;
          setSeleccionado(encontrado);
          setModoCliente("ver");
          setError("");
          await cargarActividades(encontrado);
        } catch (e) {
          setError(e.message);
        } finally {
          setGuardando(false);
        }
      }

      async function eliminarCliente() {
        if (!seleccionado) return;
        if (!confirm(`¿Eliminar a ${seleccionado.nombre} y sus actividades?`)) return;

        try {
          await pedir(`/api/clientes/${seleccionado.id}`, { method: "DELETE" });
          setSeleccionado(null);
          setActividades([]);
          setModoCliente("ver");
          await cargarClientes();
          setError("");
        } catch (e) {
          setError(e.message);
        }
      }

      function agregarActividad() {
        setFormActividad({ id: null, descripcion: "", fecha: "" });
      }

      function editarActividad(actividad) {
        setFormActividad({
          id: actividad.id,
          descripcion: actividad.descripcion ?? "",
          fecha: fechaISOaTexto(actividad.fecha) ?? "",
        });
      }

      async function guardarActividad(evento) {
        evento.preventDefault();
        if (!seleccionado || !formActividad) return;
        const fechaTexto = String(formActividad.fecha || "").trim();
        let fechaISO = null;
        if (fechaTexto) {
          fechaISO = /^\d{4}-\d{2}-\d{2}$/.test(fechaTexto) ? fechaTexto : fechaTextoAISO(fechaTexto);
          if (!fechaISO) {
            setError("La fecha debe tener formato dd/mm/aaaa");
            return;
          }
        }
        setGuardando(true);
        try {
          const cuerpo = {
            descripcion: formActividad.descripcion,
            fecha: fechaISO,
          };

          if (formActividad.id) {
            await pedir(`/api/actividades/${formActividad.id}`, {
              method: "PUT",
              body: JSON.stringify(cuerpo),
            });
          } else {
            await pedir(`/api/clientes/${seleccionado.id}/actividades`, {
              method: "POST",
              body: JSON.stringify(cuerpo),
            });
          }

          setFormActividad(null);
          setError("");
          await cargarActividades(seleccionado);
        } catch (e) {
          setError(e.message);
        } finally {
          setGuardando(false);
        }
      }

      async function completarActividad(actividad) {
        try {
          await pedir(`/api/actividades/${actividad.id}/completar`, { method: "PATCH" });
          setError("");
          await cargarActividades(seleccionado);
        } catch (e) {
          setError(e.message);
        }
      }

      async function eliminarActividad(actividad) {
        if (!confirm("¿Eliminar esta actividad?")) return;
        try {
          await pedir(`/api/actividades/${actividad.id}`, { method: "DELETE" });
          setError("");
          await cargarActividades(seleccionado);
        } catch (e) {
          setError(e.message);
        }
      }

      const pendientes = useMemo(() => actividades.filter((a) => !a.completada), [actividades]);
      const completadas = useMemo(() => actividades.filter((a) => a.completada), [actividades]);

      return (
        <div className="app-shell">
          <header className="topbar">
            <h1>MiniCRM</h1>
          </header>

          <div className="app">
            <aside className="maestro" aria-label="Lista de clientes">
              <div className="maestro-cabecera">
                <h2>Clientes</h2>
                <button type="button" className="btn-agregar" onClick={agregarCliente}>
                  <IconoMas /> Agregar
                </button>
              </div>

              <div className="buscador">
                <div className="buscador-wrap">
                  <IconoBuscar />
                  <input
                    id="buscar-clientes"
                    type="search"
                    placeholder="Buscar por cualquier campo…"
                    aria-label="Buscar clientes por cualquier campo"
                    value={busqueda}
                    onChange={(e) => setBusqueda(e.target.value)}
                  />
                </div>
              </div>

              <ul className="maestro-lista">
                {cargandoLista && clientes.length === 0 && (
                  <li className="vacio-lista">Cargando clientes…</li>
                )}

                {!cargandoLista && clientes.length === 0 && (
                  <li className="vacio-lista">No hay clientes que coincidan.</li>
                )}

                {clientes.map((cliente) => {
                  const activo = seleccionado && seleccionado.id === cliente.id;
                  const avatar = colorAvatar(cliente.nombre);
                  return (
                    <li key={cliente.id} className="cliente-item">
                      <button
                        type="button"
                        className={"cliente-btn" + (activo ? " activo" : "")}
                        aria-current={activo ? "true" : undefined}
                        onClick={() => seleccionar(cliente)}
                      >
                        <span className="avatar" aria-hidden="true" style={{ backgroundColor: avatar.bg, color: avatar.fg }}>{iniciales(cliente.nombre)}</span>
                        <span className="cliente-texto">
                          <strong>{cliente.nombre}</strong>
                          <span>
                            {[cliente.ciudad, cliente.email].filter(Boolean).join(" · ") ||
                              "Sin datos de contacto"}
                          </span>
                        </span>
                      </button>
                    </li>
                  );
                })}
              </ul>
            </aside>

            <main className="detalle">
              {error && <div className="alerta" role="alert" aria-live="polite">{error}</div>}

              {modoCliente === "alta" || modoCliente === "editar" ? (
                <form className="formulario" onSubmit={guardarCliente}>
                  <h3>{modoCliente === "alta" ? "Nuevo cliente" : "Editar cliente"}</h3>
                  <div className="grilla">
                    <div className="campo">
                      <label htmlFor="cliente-nombre">Nombre</label>
                      <input
                        id="cliente-nombre"
                        value={formCliente.nombre}
                        onChange={(e) =>
                          setFormCliente({ ...formCliente, nombre: e.target.value })
                        }
                        autoFocus
                      />
                    </div>
                    <div className="campo">
                      <label htmlFor="cliente-email">Email</label>
                      <input
                        id="cliente-email"
                        type="email"
                        value={formCliente.email}
                        onChange={(e) =>
                          setFormCliente({ ...formCliente, email: e.target.value })
                        }
                      />
                    </div>
                    <div className="campo">
                      <label htmlFor="cliente-telefono">Teléfono</label>
                      <input
                        id="cliente-telefono"
                        value={formCliente.telefono}
                        onChange={(e) =>
                          setFormCliente({ ...formCliente, telefono: e.target.value })
                        }
                      />
                    </div>
                    <div className="campo">
                      <label htmlFor="cliente-direccion">Dirección</label>
                      <input
                        id="cliente-direccion"
                        value={formCliente.direccion}
                        onChange={(e) =>
                          setFormCliente({ ...formCliente, direccion: e.target.value })
                        }
                      />
                    </div>
                    <div className="campo">
                      <label htmlFor="cliente-ciudad">Ciudad</label>
                      <input
                        id="cliente-ciudad"
                        value={formCliente.ciudad}
                        onChange={(e) =>
                          setFormCliente({ ...formCliente, ciudad: e.target.value })
                        }
                      />
                    </div>
                  </div>
                  <div className="form-acciones">
                    <button
                      type="button"
                      className="secundario"
                      onClick={() => setModoCliente("ver")}
                    >
                      <IconoX /> Cancelar
                    </button>
                    <button type="submit" disabled={guardando}>
                      <IconoGuardar /> {guardando ? "Guardando…" : "Guardar"}
                    </button>
                  </div>
                </form>
              ) : seleccionado ? (
                <>
                  <section className="ficha" aria-label="Ficha del cliente">
                    <div className="ficha-cabecera">
                      <div className="ficha-identidad">
                        <div className="ficha-nombre">
                          <h2>{seleccionado.nombre}</h2>
                          <span className="badge-id">#{seleccionado.id}</span>
                        </div>
                        <div className="ficha-ciudad">{seleccionado.ciudad || "Sin ciudad"}</div>
                      </div>
                      <div className="acciones">
                        <button type="button" className="secundario" onClick={editarCliente}>
                          <IconoEditar /> Editar
                        </button>
                        <button type="button" className="peligro" onClick={eliminarCliente}>
                          <IconoBorrar /> Eliminar
                        </button>
                      </div>
                    </div>

                    <div className="ficha-datos">
                      <div className="dato">
                        <IconoMail />
                        <span className="dato-texto">{seleccionado.email || "—"}</span>
                      </div>
                      <div className="dato">
                        <IconoPin />
                        <span className="dato-texto">{seleccionado.direccion || "—"}</span>
                      </div>
                      <div className="dato">
                        <IconoTel />
                        <span className="dato-texto">{seleccionado.telefono || "—"}</span>
                      </div>
                      <div className="dato">
                        <IconoPin />
                        <span className="dato-texto">{seleccionado.ciudad || "—"}</span>
                      </div>
                    </div>
                  </section>

                  <div className="actividades">
                    <section className="bloque" aria-label="Compromisos pendientes">
                      <div className="bloque-cabecera">
                        <h3>Compromisos</h3>
                        <button type="button" className="btn-agregar" onClick={agregarActividad}>
                          <IconoMas /> Agregar actividad
                        </button>
                      </div>

                      {formActividad && (
                        <form className="subformulario" onSubmit={guardarActividad}>
                          <div className="subform-panel">
                            <div className="subform-titulo">{formActividad.id ? "Editar actividad" : "Agregar actividad"}</div>
                            <div className="grilla">
                              <div className="campo">
                                <label htmlFor="actividad-descripcion">Descripción</label>
                                <textarea
                                  id="actividad-descripcion"
                                  placeholder="Descripción de la actividad"
                                  value={formActividad.descripcion}
                                  onChange={(e) =>
                                    setFormActividad({
                                      ...formActividad,
                                      descripcion: e.target.value,
                                    })
                                  }
                                  autoFocus
                                />
                              </div>
                              <div className="campo">
                                <label htmlFor="actividad-fecha">Fecha opcional</label>
                                <div className="fecha-wrap">
                                  <input
                                    id="actividad-fecha"
                                    type="text"
                                    inputMode="numeric"
                                    placeholder="dd/mm/aaaa"
                                    value={formActividad.fecha || ""}
                                    onChange={(e) =>
                                      setFormActividad({ ...formActividad, fecha: e.target.value })
                                    }
                                  />
                                  <button
                                    type="button"
                                    className="btn-calendario"
                                    aria-label="Formato de fecha dd/mm/aaaa"
                                    title="dd/mm/aaaa"
                                    onClick={() => document.getElementById("actividad-fecha")?.focus()}
                                  >
                                    <IconoCalendario />
                                  </button>
                                </div>
                              </div>
                            </div>
                            <div className="form-acciones">
                              <button
                                type="button"
                                className="secundario"
                                onClick={() => setFormActividad(null)}
                              >
                                <IconoX /> Cancelar
                              </button>
                              <button type="submit" disabled={guardando}>
                                <IconoGuardar /> {guardando ? "Guardando…" : "Guardar"}
                              </button>
                            </div>
                          </div>
                        </form>
                      )}

                      {cargandoActividades && <div className="cargando-linea">Cargando actividades…</div>}

                      <ul className="lista-actividades">
                        {!cargandoActividades && pendientes.length === 0 && (
                          <li className="vacio-lista">No hay actividades pendientes.</li>
                        )}
                        {pendientes.map((actividad) => {
                          const vencida = estaVencida(actividad.fecha, actividad.completada);
                          return (
                            <li key={actividad.id} className="actividad">
                              <div className="actividad-info">
                                <div className="actividad-row">
                                  <input
                                    type="checkbox"
                                    className="chk-completar"
                                    checked={false}
                                    aria-label={`Completar actividad: ${actividad.descripcion}`}
                                    onChange={() => completarActividad(actividad)}
                                  />
                                  <div>
                                    <div className="actividad-descripcion">{actividad.descripcion}</div>
                                    <span className="actividad-fecha">
                                      {actividad.fecha ? formatearFecha(actividad.fecha) : "Sin fecha"}
                                      {vencida && <span className="chip-vencida">Vencido</span>}
                                    </span>
                                  </div>
                                </div>
                              </div>
                              <div className="acciones">
                                <button
                                  type="button"
                                  className="btn-icono"
                                  aria-label={`Editar actividad: ${actividad.descripcion}`}
                                  title="Editar"
                                  onClick={() => editarActividad(actividad)}
                                >
                                  <IconoEditar />
                                </button>
                                <button
                                  type="button"
                                  className="btn-icono peligro-icono"
                                  aria-label={`Borrar actividad: ${actividad.descripcion}`}
                                  title="Borrar"
                                  onClick={() => eliminarActividad(actividad)}
                                >
                                  <IconoBorrar />
                                </button>
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </section>

                    <section className="bloque" aria-label="Actividades completadas">
                      <div className="bloque-cabecera">
                        <h3>Actividades completadas</h3>
                      </div>
                      {cargandoActividades && completadas.length === 0 && (
                        <div className="cargando-linea">Cargando actividades…</div>
                      )}
                      <ul className="lista-actividades">
                        {!cargandoActividades && completadas.length === 0 && (
                          <li className="vacio-lista">Todavía no hay actividades completadas.</li>
                        )}
                        {completadas.map((actividad) => (
                          <li key={actividad.id} className="actividad hecha">
                            <div className="actividad-info">
                              <div className="actividad-row">
                                <span className="check-verde" aria-hidden="true"><IconoCheck /></span>
                                <div>
                                  <div className="actividad-descripcion">{actividad.descripcion}</div>
                                  <span className="actividad-fecha">
                                    Completada el{" "}
                                    {actividad.completadaEn
                                      ? formatearFecha(actividad.completadaEn)
                                      : "—"}
                                    {actividad.fecha
                                      ? ` · Fecha: ${formatearFecha(actividad.fecha)}`
                                      : ""}
                                  </span>
                                </div>
                              </div>
                            </div>
                          </li>
                        ))}
                      </ul>
                    </section>
                  </div>
                </>
              ) : (
                <div className="vacio">
                  <h2>MiniCRM</h2>
                  <p>Elegí un cliente de la lista o agregá uno nuevo.</p>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
