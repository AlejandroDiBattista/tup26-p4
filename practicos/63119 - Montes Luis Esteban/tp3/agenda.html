<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda de alumnos</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui;background:#f2f5f4;color:#213b32;margin:0}main{max-width:1100px;margin:auto;padding:24px}header,footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header input{flex:1}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}article,dialog{background:white;border:1px solid #cbd8d1;border-radius:14px;padding:20px}article{cursor:pointer;& button{float:right}& h2{font-size:20px}& address{font-style:normal}}button,input{font:inherit;padding:8px}button{cursor:pointer}dialog{max-width:min(420px,95vw);& label{display:grid;margin:8px 0}& footer{margin-top:16px}}dialog::backdrop{background:#14291f80}
</style><main id="app"></main><script type="module">
import {html,reactive} from 'https://esm.sh/@arrow-js/core'
import iniciales from './alumnos.json' with {type:'json'}
const clave='agenda-63119'
const guardados=localStorage.getItem(clave)
const estado=reactive({alumnos:guardados===null?iniciales:JSON.parse(guardados),busqueda:''})
function guardar(lista){
  localStorage.setItem(clave,JSON.stringify(lista))
  estado.alumnos=lista
}
if(guardados===null) guardar(iniciales)
const limpiar=valor=>String(valor).normalize('NFD').replace(/\p{M}/gu,'').toLowerCase()
function visibles(){
  const texto=limpiar(estado.busqueda.trim())
  return estado.alumnos.filter(a=>Object.values(a).some(v=>limpiar(v).includes(texto)))
    .sort((a,b)=>Number(b.favorito)-Number(a.favorito)||a.apellido.localeCompare(b.apellido,'es',{sensitivity:'base'})||a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base'}))
}
function tarjeta(a){
  return html`<article tabindex="0" ><h2>${a.apellido}, ${a.nombre}</h2><address>${a.telefono} · ${a.github}</address><footer>Comisión ${a.comision} · Legajo ${a.legajo}</footer></article>`
}
html`<header><h1>Agenda</h1><input aria-label="Buscar alumnos" placeholder="Buscar alumnos" @input=${e=>estado.busqueda=e.target.value}></header>
<section>${()=>visibles().length?visibles().map(tarjeta):'No hay alumnos para mostrar.'}</section>`(document.querySelector('#app'))
</script></html>
