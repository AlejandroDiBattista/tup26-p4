<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda</title>
    <style>
      body {
        margin: 0;
        padding: 32px 20px;
        font: 16px sans-serif;
        background: #f5f6f4;
      }
      main {
        width: 1104px;
        max-width: 100%;
        margin: auto;
      }
      h1 {
        margin: 0 0 24px;
      }
      ul {
        display: grid;
        grid-template-columns: repeat(3, 360px);
        justify-content: center;
        gap: 12px;
        padding: 0;
        list-style: none;
      }
      li {
        min-width: 0;
        padding: 20px;
        border: 1px solid #d9ded9;
        border-radius: 16px;
        background: white;
        text-align: center;
      }
      @media (max-width: 1120px) {
        ul {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        ul {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <script type="module">
      import { html, reactive, watch } from "https://esm.sh/@arrow-js/core";
      import alumnos from "./alumnos.json" with { type: "json" };

      const app = document.getElementById("app");
      const estado = reactive({
        busqueda: "",
        alumnos: alumnos.map((a) => ({
          ...a,
          favorito: Boolean(a.favorito),
        })),
      });
      function normalizar(texto) {
        return String(texto ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }
      function alumnosFiltrados() {
        const texto = normalizar(estado.busqueda).trim();
        return estado.alumnos
          .filter((a) =>
            normalizar(
              [
                a.nombre,
                a.apellido,
                a.telefono,
                a.github,
                a.comision,
                a.legajo,
              ].join(""),
            ).includes(texto),
          )
          .sort(
            (a, b) =>
              Number(b.favorito) - Number(a.favorito) ||
              a.apellido.localeCompare(b.apellido, "es", {
                sensitivity: "base",
              }) ||
              a.nombre.localeCompare(b.nombre, "es", {
                sensitivity: "base",
              }),
          );
      }
      function cambiarFavorito(id) {
        estado.alumnos = estado.alumnos.map((a) =>
          a.id === id ? { ...a, favorito: !a.favorito } : a,
        );
      }
      html`
        <h1>Alumnos</h1>
        <input
        id="buscador"
        type="search"
        placeholder="Nombre",Apellido,Legajo..."
        @input="${(e) => (estado.busqueda = e.target.value)}"
        >
        <ul>
          ${() =>
            alumnosFiltrados().map(
              (a) => html`
        <li>
          <article>
            <header>
              <h2>${a.nombre},${a.apellido}</h2>
              <button type="button"
              aria-pressed="${() => a.favorito}"
              @click ="${() => cambiarFavorito(a.id)}"
              >
              ${() => (a.favorito ? "Favorito" : "Marcar Favorito")}
              </button>
              </header>
               <address>
                <p> Telefono: ${a.telefono}</p>
                <p> Github: ${a.github}</p>
              <footer>
                <p>Comision${a.comision}</p>
                <p>Legajo: ${a.legajo}</p>
                </footer>
                </article>
              </li>`,
            )}
        </ul>
        <p role="status">
          ${() =>
            alumnosFiltrados().length === 0
              ? "No hay alumnos para mostrar."
              : ""}
      `(app);
    </script>
  </body>
</html>
