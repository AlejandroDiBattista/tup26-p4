<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }
    
    const guardado = localStorage.getItem("listado")
    
    let listado 
    if (guardado) {
    listado = JSON.parse(guardado) 
    } else {
    listado = alumnos
    localStorage.setItem("listado", JSON.stringify(listado))
    }
  
    const personas = reactive ({ 
    contenido : listado, busqueda: ""});

  function guardarAlumnos (){
  localStorage.setItem("listado", JSON.stringify(personas.contenido))
  }

  function alternarFavorito (alumno) {
  alumno.favorito = !alumno.favorito
  guardarAlumnos()
  }

  function ordenamiento (){
  return [...personas.contenido]
  .filter(a =>
  convertir(`${a.apellido} ${a.nombre}`).includes(convertir(personas.busqueda)))
  .sort((a,b) =>
  b.favorito - a.favorito ||
  a.apellido.localeCompare(b.apellido, "es", {sensitivity: "base"}) ||
  a.nombre.localeCompare(b.nombre, "es", {sensitivity: "base"})
  )}
  
 function convertir(texto) {
  return texto.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, '')
}

    const app = document.getElementById('app')
    html`
      <h1>Alumnos</h1>
      <input type="search"
      
      placeholder="Buscar alumno.."
      .value="${() => personas.busqueda}"
      @input="${e => personas.busqueda = e.target.value}">
      
      
      <section>
       ${() => ordenamiento().map(a => html`<article>
        <header>
        <h2>
        ${a.apellido}
        <span>
        ${a.nombre}
        </span>
        
        </h2>
      
        <button @click="${() => alternarFavorito(a)}">
        ${() => a.favorito ? '★' : '☆'}
        </button>

          </header>
          <address>
            ${a.telefono} 
            @${a.github}
            </address>
             <footer>
              ${a.comision} · ${a.legajo}
              </footer>
          </article>`.key(a.id))}
      </section>
      <p>${() =>ordenamiento().length === 0  ? "No hay alumnos para mostrar" : ""}</p>
       `(app)
  </script>
</body>
</html>
