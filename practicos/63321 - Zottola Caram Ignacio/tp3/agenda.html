<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
:root {
  --fondo: #f4f5f2;
  --tarjeta: #ffffff;
  --texto: #1f2920;
  --suave: #757872;
  --borde: #dde1db;
  --verde: #2f3d34;
  --verde-hover: #243028;
  --estrella: #998d75;
  --estrella-off: #c2c1b8;
  --rojo: #b04040;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 40px 24px 64px;
  font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
  color: var(--texto);
  background: var(--fondo);
}

main {
  width: 1104px;
  max-width: 100%;
  margin: 0 auto;

  & > header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;

    & h1 {
      margin: 0;
      margin-right: auto;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    & .acciones {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1 1 280px;
      justify-content: flex-end;
    }
  }

  & > footer {
    margin-top: 32px;
    text-align: center;
    font-size: 13px;
    color: var(--suave);
  }
}

.busqueda {
  flex: 1 1 220px;
  max-width: 320px;
  padding: 10px 16px;
  border: 1px solid var(--borde);
  border-radius: 999px;
  background: var(--tarjeta);
  font: inherit;
  color: var(--texto);
  outline: none;

  &::placeholder { color: var(--suave); }

  &:focus {
    border-color: var(--verde);
    box-shadow: 0 0 0 3px rgba(47, 61, 52, .12);
  }
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border: 1px solid transparent;
  border-radius: 999px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;

  &.btn-primary {
    background: var(--verde);
    color: #fff;

    &:hover { background: var(--verde-hover); }
  }

  &.btn-ghost {
    background: var(--tarjeta);
    border-color: var(--borde);
    color: var(--texto);

    &:hover { background: #f1f1ef; }
  }

  &.btn-danger {
    background: var(--tarjeta);
    border-color: #e8c9c9;
    color: var(--rojo);

    &:hover { background: #faf1f1; }
  }
}

.lista {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}

@media (max-width: 900px) {
  .lista { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 560px) {
  .lista { grid-template-columns: 1fr; }

  main > header .acciones {
    flex: 1 1 100%;
    justify-content: stretch;

    & .busqueda { max-width: none; }
    & .btn { flex-shrink: 0; }
  }
}

.tarjeta {
  position: relative;
  min-height: 170px;
  padding: 18px 20px 16px;
  border: 1px solid var(--borde);
  border-radius: 16px;
  background: var(--tarjeta);
  cursor: pointer;
  outline: none;
  transition: box-shadow .15s, border-color .15s;

  &:hover {
    box-shadow: 0 8px 24px rgba(31, 41, 32, .08);
  }

  &:focus-visible {
    border-color: var(--verde);
    box-shadow: 0 0 0 3px rgba(47, 61, 52, .15);
  }

  & h2 {
    margin: 0 36px 12px 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    overflow-wrap: break-word;

    & span {
      font-weight: 400;
      color: var(--suave);
      font-size: 16px;
    }
  }

  & address {
    margin: 0;
    font-style: normal;
    font-size: 14px;

    & .tel {
      display: block;
      font-weight: 700;
      color: var(--texto);
    }

    & .gh {
      display: block;
      margin-top: 2px;
      color: var(--suave);
      text-decoration: none;

      &:hover {
        color: var(--texto);
        text-decoration: underline;
      }
    }
  }

  & > footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--borde);
    font-size: 12px;
    color: var(--suave);
    letter-spacing: .02em;
  }

  & .fav {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--estrella-off);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;

    &[aria-pressed="true"] { color: var(--estrella); }

    &:hover { background: #f1f1ef; }
    &:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
  }
}

.vacio {
  grid-column: 1 / -1;
  padding: 48px 20px;
  text-align: center;
  color: var(--suave);
}

dialog {
  width: min(560px, calc(100% - 32px));
  border: none;
  border-radius: 16px;
  padding: 0;
  color: var(--texto);
  box-shadow: 0 16px 48px rgba(31, 41, 32, .2);

  &::backdrop {
    background: rgba(120, 128, 118, .55);
  }

  & form {
    padding: 26px;

    & h2 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    & .subtitulo {
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--suave);
    }

    & .campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 12px;
    }

    & label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;

      & input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--borde);
        border-radius: 10px;
        background: #f5f5f5;
        font: inherit;
        color: var(--texto);
        outline: none;

        &:focus {
          border-color: var(--texto);
          background: var(--tarjeta);
        }
      }
    }

    & .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--borde);

      & .espacio { margin-right: auto; }
    }
  }
}

@media (max-width: 520px) {
  dialog form .campos { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
  <main id="app"></main>
  <dialog id="dialogo"></dialog>
  <script type="module">
import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
import alumnosJson from './alumnos.json' with { type: 'json' }

const STORAGE_KEY = 'agenda-alumnos'
const dialogo = document.getElementById('dialogo')

const estado = reactive({
  alumnos: cargarAlumnos(),
  busqueda: '',
  abierto: false,
  modo: 'agregar',
  form: formVacio()
})

function cargarAlumnos() {
  const guardado = localStorage.getItem(STORAGE_KEY)
  if (guardado) {
    try {
      return JSON.parse(guardado)
    } catch {}
  }
  const iniciales = structuredClone(alumnosJson)
  localStorage.setItem(STORAGE_KEY, JSON.stringify(iniciales))
  return iniciales
}

function persistir() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(estado.alumnos))
}

function formVacio() {
  return {
    id: null,
    apellido: '',
    nombre: '',
    legajo: '',
    comision: '',
    telefono: '',
    github: ''
  }
}

function normalizar(texto) {
  return String(texto ?? '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
}

function siguienteId() {
  return estado.alumnos.reduce((max, a) => Math.max(max, Number(a.id) || 0), 0) + 1
}

function alumnosVisibles() {
  const q = normalizar(estado.busqueda)
  return estado.alumnos
    .filter(a => {
      if (!q) return true
      const texto = normalizar(
        `${a.apellido} ${a.nombre} ${a.legajo} ${a.comision} ${a.telefono} ${a.github}`
      )
      return texto.includes(q)
    })
    .sort((a, b) => {
      if (a.favorito !== b.favorito) return a.favorito ? -1 : 1
      const porApellido = normalizar(a.apellido).localeCompare(normalizar(b.apellido))
      if (porApellido !== 0) return porApellido
      return normalizar(a.nombre).localeCompare(normalizar(b.nombre))
    })
}

function toggleFavorito(alumno, e) {
  if (e) e.stopPropagation()
  alumno.favorito = !alumno.favorito
  persistir()
}

function abrirAgregar() {
  estado.modo = 'agregar'
  estado.form = formVacio()
  estado.abierto = true
}

function abrirEditar(alumno) {
  estado.modo = 'editar'
  estado.form = {
    id: alumno.id,
    apellido: alumno.apellido,
    nombre: alumno.nombre,
    legajo: alumno.legajo,
    comision: alumno.comision,
    telefono: alumno.telefono,
    github: alumno.github
  }
  estado.abierto = true
}

function cerrarDialogo() {
  estado.abierto = false
  if (dialogo.open) dialogo.close()
}

function manejarTeclado(alumno, e) {
  if (e.target.closest('.fav')) return
  if (e.key === 'Enter') {
    e.preventDefault()
    abrirEditar(alumno)
  } else if (e.key === ' ') {
    e.preventDefault()
    toggleFavorito(alumno)
  }
}

function guardar(e) {
  e.preventDefault()
  const form = e.currentTarget
  if (!form.checkValidity()) {
    form.reportValidity()
    return
  }

  const datos = {
    apellido: estado.form.apellido.trim(),
    nombre: estado.form.nombre.trim(),
    legajo: estado.form.legajo.trim(),
    comision: estado.form.comision.trim(),
    telefono: estado.form.telefono.trim(),
    github: estado.form.github.trim()
  }

  if (estado.modo === 'agregar') {
    estado.alumnos.push({
      id: siguienteId(),
      ...datos,
      favorito: false
    })
  } else {
    const alumno = estado.alumnos.find(a => a.id === estado.form.id)
    if (alumno) Object.assign(alumno, datos)
  }

  persistir()
  cerrarDialogo()
}

function eliminar() {
  estado.alumnos = estado.alumnos.filter(a => a.id !== estado.form.id)
  persistir()
  cerrarDialogo()
}

function tarjeta(alumno) {
  return html`
    <li>
      <article class="tarjeta" tabindex="0"
        @click="${() => abrirEditar(alumno)}"
        @keydown="${e => manejarTeclado(alumno, e)}">
        <button class="fav" type="button"
          aria-pressed="${() => alumno.favorito ? 'true' : 'false'}"
          aria-label="${() => alumno.favorito ? 'Quitar de favoritos' : 'Marcar como favorito'}"
          @click="${e => toggleFavorito(alumno, e)}">
          ${() => alumno.favorito ? '★' : '☆'}
        </button>
        <h2>${() => alumno.apellido} <span>${() => alumno.nombre}</span></h2>
        <address>
          <span class="tel">${() => alumno.telefono}</span>
          <a class="gh" href="${() => 'https://github.com/' + alumno.github}"
            target="_blank" rel="noopener"
            @click="${e => e.stopPropagation()}">@${() => alumno.github}</a>
        </address>
        <footer>${() => alumno.comision} · ${() => alumno.legajo}</footer>
      </article>
    </li>
  `.key(alumno.id)
}

html`
  <header>
    <h1>Agenda</h1>
    <div class="acciones">
      <input class="busqueda" type="search" placeholder="Buscar alumno..."
        aria-label="Buscar alumnos"
        .value="${() => estado.busqueda}"
        @input="${e => { estado.busqueda = e.target.value }}">
      <button class="btn btn-primary" type="button" @click="${abrirAgregar}">+ Agregar</button>
    </div>
  </header>

  <section aria-label="Listado de alumnos">
    <ul class="lista">
      ${() => {
        const lista = alumnosVisibles()
        if (!lista.length) {
          return html`<li class="vacio">No hay alumnos para mostrar</li>`
        }
        return lista.map(tarjeta)
      }}
    </ul>
  </section>

  <footer>
    <p>${() => estado.alumnos.length} alumnos · datos guardados en el navegador</p>
  </footer>
`(document.getElementById('app'))

html`
  <form @submit="${guardar}">
    <h2>${() => estado.modo === 'agregar' ? 'Agregar alumno' : 'Editar alumno'}</h2>
    <p class="subtitulo">${() => estado.modo === 'agregar'
      ? 'Completá los datos del nuevo alumno.'
      : 'Actualizá los datos del alumno.'}</p>

    <div class="campos">
      <label for="campo-apellido">
        Apellido
        <input id="campo-apellido" name="apellido" type="text" required autocomplete="family-name"
          .value="${() => estado.form.apellido}"
          @input="${e => { estado.form.apellido = e.target.value }}">
      </label>
      <label for="campo-nombre">
        Nombre
        <input id="campo-nombre" name="nombre" type="text" required autocomplete="given-name"
          .value="${() => estado.form.nombre}"
          @input="${e => { estado.form.nombre = e.target.value }}">
      </label>
      <label for="campo-legajo">
        Legajo
        <input id="campo-legajo" name="legajo" type="text" required inputmode="numeric"
          .value="${() => estado.form.legajo}"
          @input="${e => { estado.form.legajo = e.target.value }}">
      </label>
      <label for="campo-comision">
        Comisión
        <input id="campo-comision" name="comision" type="text" required
          .value="${() => estado.form.comision}"
          @input="${e => { estado.form.comision = e.target.value }}">
      </label>
      <label for="campo-telefono">
        Teléfono
        <input id="campo-telefono" name="telefono" type="tel" required autocomplete="tel"
          .value="${() => estado.form.telefono}"
          @input="${e => { estado.form.telefono = e.target.value }}">
      </label>
      <label for="campo-github">
        GitHub
        <input id="campo-github" name="github" type="text" required autocomplete="username"
          .value="${() => estado.form.github}"
          @input="${e => { estado.form.github = e.target.value }}">
      </label>
    </div>

    <div class="botones">
      ${() => estado.modo === 'editar'
        ? html`<button class="btn btn-danger" type="button" @click="${eliminar}">Eliminar</button><span class="espacio"></span>`
        : html`<span class="espacio"></span>`}
      <button class="btn btn-primary" type="submit">Guardar</button>
      <button class="btn btn-ghost" type="button" @click="${cerrarDialogo}">Cancelar</button>
    </div>
  </form>
`(dialogo)

watch(() => {
  if (estado.abierto && !dialogo.open) dialogo.showModal()
  else if (!estado.abierto && dialogo.open) dialogo.close()
})

dialogo.addEventListener('close', () => { estado.abierto = false })
  </script>
</body>
</html>
