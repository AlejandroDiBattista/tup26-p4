<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniCRM</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --panel-soft: #edf2ff;
        --line: #dfe7ff;
        --text: #1d253d;
        --muted: #5d6b87;
        --primary: #3d6ef7;
        --primary-soft: #e8eeff;
        --danger: #d9534f;
        --success: #1c9d73;
        --shadow: 0 10px 28px rgba(55, 76, 128, 0.12);
      }

      * { box-sizing: border-box; }

      html, body, #root {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      button, input, textarea {
        font: inherit;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .title {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 320px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        color: var(--text);
      }

      .primary-btn, .secondary-btn, .ghost-btn, .danger-btn {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .primary-btn:hover, .secondary-btn:hover, .ghost-btn:hover, .danger-btn:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
      }

      .secondary-btn {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .ghost-btn {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .danger-btn {
        background: #fef1f2;
        color: var(--danger);
        border: 1px solid #f5c0c3;
      }

      .content {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 18px;
        flex: 1;
        min-height: 0;
        margin-top: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        min-height: 0;
      }

      .list-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel-header {
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .client-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }

      .client-item {
        width: 100%;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 12px;
        text-align: left;
        cursor: pointer;
        margin-bottom: 10px;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .client-item.active {
        background: var(--primary-soft);
        border-color: var(--primary);
        box-shadow: inset 0 0 0 1px rgba(61,110,247,0.08);
      }

      .client-name {
        margin: 0 0 6px;
        font-weight: 700;
        font-size: 1.02rem;
      }

      .client-meta {
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.5;
      }

      .detail-panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .detail-body {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr);
        gap: 16px;
        padding: 18px;
        flex: 1;
        min-height: 0;
      }

      .details-section, .activity-section {
        background: #fafbff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-head h3 {
        margin: 0;
        font-size: 1.02rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .field input,
      .field textarea {
        border: 1px solid var(--line);
        background: white;
        border-radius: 10px;
        padding: 10px 11px;
        outline: none;
        color: var(--text);
      }

      .field textarea {
        resize: vertical;
        min-height: 90px;
      }

      .actions-row {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }

      .activity-form {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .list-box {
        max-height: 240px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }

      .activity-item {
        padding: 12px 12px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .activity-item.completed {
        background: #f4faf7;
        border-color: #bfe5d5;
      }

      .activity-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }

      .activity-title {
        margin: 0;
        font-weight: 700;
        font-size: 0.95rem;
      }

      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .badge.pending {
        background: #fff6df;
        color: #9a6700;
      }

      .badge.done {
        background: #eafaf4;
        color: var(--success);
      }

      .activity-date {
        color: var(--muted);
        font-size: 0.76rem;
        margin: 8px 0;
      }

      .activity-description {
        color: var(--muted);
        font-size: 0.88rem;
        margin: 0;
      }

      .small-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 10px;
      }

      .empty-state {
        padding: 18px 12px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: #fff;
      }

      @media (max-width: 980px) {
        .content,
        .detail-body {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: stretch;
        }

        .search-box {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/plain" id="minicrm-source">
      const API_BASE = "http://localhost:3000/api";
      const EMPTY_CLIENT = {
        nombre: "",
        apellido: "",
        email: "",
        telefono: "",
        empresa: "",
        direccion: "",
        notas: "",
      };
      const EMPTY_ACTIVITY = {
        titulo: "",
        descripcion: "",
        fecha: new Date().toISOString().slice(0, 10),
      };

      function App() {
        const [clientes, setClientes] = React.useState([]);
        const [selectedId, setSelectedId] = React.useState(null);
        const [search, setSearch] = React.useState("");
        const [clientForm, setClientForm] = React.useState(EMPTY_CLIENT);
        const [activityForm, setActivityForm] = React.useState(EMPTY_ACTIVITY);
        const [editingActivityId, setEditingActivityId] = React.useState(null);
        const [loading, setLoading] = React.useState(true);
        const [busy, setBusy] = React.useState(false);

        const selectedClient = React.useMemo(
          () => clientes.find((cliente) => cliente.id === selectedId) ?? null,
          [clientes, selectedId]
        );

        const fetchClientes = React.useCallback(async (term = search) => {
          setLoading(true);
          try {
            const response = await fetch(`${API_BASE}/clientes?search=${encodeURIComponent(term)}`);
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "No se pudo cargar la lista.");
            }
            setClientes(data);
            if (!data.some((cliente) => cliente.id === selectedId)) {
              setSelectedId(data[0]?.id ?? null);
            }
          } catch (error) {
            console.error(error);
            window.alert(error.message || "Error al cargar clientes");
          } finally {
            setLoading(false);
          }
        }, [search, selectedId]);

        React.useEffect(() => {
          fetchClientes(search);
        }, [search]);

        React.useEffect(() => {
          if (selectedClient) {
            setClientForm({
              nombre: selectedClient.nombre || "",
              apellido: selectedClient.apellido || "",
              email: selectedClient.email || "",
              telefono: selectedClient.telefono || "",
              empresa: selectedClient.empresa || "",
              direccion: selectedClient.direccion || "",
              notas: selectedClient.notas || "",
            });
          }
        }, [selectedClient]);

        React.useEffect(() => {
          if (!selectedClient) {
            setActivityForm({ ...EMPTY_ACTIVITY });
            setEditingActivityId(null);
            return;
          }

          const pending = (selectedClient.actividades || []).filter((actividad) => !actividad.completada);
          if (editingActivityId) {
            const act = pending.find((item) => item.id === editingActivityId);
            if (act) {
              setActivityForm({
                titulo: act.titulo || "",
                descripcion: act.descripcion || "",
                fecha: act.fecha || new Date().toISOString().slice(0, 10),
              });
            }
          } else {
            setActivityForm({
              titulo: "",
              descripcion: "",
              fecha: new Date().toISOString().slice(0, 10),
            });
          }
        }, [selectedClient, editingActivityId]);

        const handleClientChange = (event) => {
          const { name, value } = event.target;
          setClientForm((prev) => ({ ...prev, [name]: value }));
        };

        const handleActivityChange = (event) => {
          const { name, value } = event.target;
          setActivityForm((prev) => ({ ...prev, [name]: value }));
        };

        const handleSaveClient = async () => {
          if (!selectedClient) return;
          setBusy(true);
          try {
            const response = await fetch(`${API_BASE}/clientes/${selectedClient.id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(clientForm),
            });
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Error al guardar cliente");
            }
            await fetchClientes();
            setSelectedId(data.id);
          } catch (error) {
            window.alert(error.message || "Error al guardar cliente");
          } finally {
            setBusy(false);
          }
        };

        const handleCreateClient = async () => {
          const payload = {
            nombre: clientForm.nombre || "",
            apellido: clientForm.apellido || "",
            email: clientForm.email || "",
            telefono: clientForm.telefono || "",
            empresa: clientForm.empresa || "",
            direccion: clientForm.direccion || "",
            notas: clientForm.notas || "",
          };

          if (!payload.nombre || !payload.apellido) {
            window.alert("Nombre y apellido son obligatorios.");
            return;
          }

          setBusy(true);
          try {
            const response = await fetch(`${API_BASE}/clientes`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Error al crear cliente");
            }
            await fetchClientes();
            setSelectedId(data.id);
            setClientForm({ ...EMPTY_CLIENT });
          } catch (error) {
            window.alert(error.message || "Error al crear cliente");
          } finally {
            setBusy(false);
          }
        };

        const handleDeleteClient = async (id) => {
          if (!window.confirm("¿Seguro que deseas eliminar este cliente?")) return;
          setBusy(true);
          try {
            const response = await fetch(`${API_BASE}/clientes/${id}`, { method: "DELETE" });
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Error al eliminar cliente");
            }
            await fetchClientes();
          } catch (error) {
            window.alert(error.message || "Error al eliminar cliente");
          } finally {
            setBusy(false);
          }
        };

        const handleSaveActivity = async () => {
          if (!selectedClient) return;
          if (!activityForm.titulo.trim()) {
            window.alert("El título de la actividad es obligatorio.");
            return;
          }

          setBusy(true);
          try {
            const payload = {
              titulo: activityForm.titulo,
              descripcion: activityForm.descripcion,
              fecha: activityForm.fecha,
            };

            let response;
            if (editingActivityId) {
              response = await fetch(`${API_BASE}/actividades/${editingActivityId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
            } else {
              response = await fetch(`${API_BASE}/clientes/${selectedClient.id}/actividades`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
            }

            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Error al guardar actividad");
            }
            setEditingActivityId(null);
            setActivityForm({ ...EMPTY_ACTIVITY });
            await fetchClientes();
          } catch (error) {
            window.alert(error.message || "Error al guardar actividad");
          } finally {
            setBusy(false);
          }
        };

        const handleCompleteActivity = async (id) => {
          setBusy(true);
          try {
            const response = await fetch(`${API_BASE}/actividades/${id}/completar`, { method: "PATCH" });
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Error al completar actividad");
            }
            await fetchClientes();
          } catch (error) {
            window.alert(error.message || "Error al completar actividad");
          } finally {
            setBusy(false);
          }
        };

        const handleDeleteActivity = async (id) => {
          setBusy(true);
          try {
            const response = await fetch(`${API_BASE}/actividades/${id}`, { method: "DELETE" });
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || "Error al eliminar actividad");
            }
            await fetchClientes();
          } catch (error) {
            window.alert(error.message || "Error al eliminar actividad");
          } finally {
            setBusy(false);
          }
        };

        return (
          <div className="app-shell">
            <header className="topbar">
              <h1 className="title">MiniCRM</h1>
              <div className="topbar-actions">
                <div className="search-box">
                  <span>🔎</span>
                  <input
                    type="text"
                    value={search}
                    placeholder="Buscar clientes..."
                    onChange={(event) => setSearch(event.target.value)}
                  />
                </div>
                <button className="primary-btn" onClick={handleCreateClient} disabled={busy}>
                  + Nuevo cliente
                </button>
              </div>
            </header>

            <main className="content">
              <aside className="panel list-panel">
                <div className="panel-header">
                  <h2>Clientes</h2>
                  <span>{clientes.length}</span>
                </div>
                <div className="client-list">
                  {loading ? (
                    <div className="empty-state">Cargando...</div>
                  ) : clientes.length === 0 ? (
                    <div className="empty-state">No hay clientes.</div>
                  ) : (
                    clientes.map((cliente) => (
                      <button
                        key={cliente.id}
                        className={`client-item ${selectedClient && selectedClient.id === cliente.id ? "active" : ""}`}
                        onClick={() => setSelectedId(cliente.id)}
                      >
                        <p className="client-name">{cliente.nombre} {cliente.apellido}</p>
                        <div className="client-meta">
                          <div>{cliente.email || "Sin email"}</div>
                          <div>{cliente.empresa || "Sin empresa"}</div>
                        </div>
                      </button>
                    ))
                  )}
                </div>
              </aside>

              <section className="panel detail-panel">
                {selectedClient ? (
                  <>
                    <div className="panel-header">
                      <h2>Detalle del cliente</h2>
                      <button className="danger-btn" onClick={() => handleDeleteClient(selectedClient.id)} disabled={busy}>
                        Eliminar cliente
                      </button>
                    </div>

                    <div className="detail-body">
                      <section className="details-section">
                        <div className="section-head">
                          <h3>Ficha</h3>
                        </div>

                        <div className="form-grid">
                          <div className="field">
                            <label>Nombre</label>
                            <input name="nombre" value={clientForm.nombre} onChange={handleClientChange} />
                          </div>
                          <div className="field">
                            <label>Apellido</label>
                            <input name="apellido" value={clientForm.apellido} onChange={handleClientChange} />
                          </div>
                          <div className="field">
                            <label>Email</label>
                            <input name="email" value={clientForm.email} onChange={handleClientChange} />
                          </div>
                          <div className="field">
                            <label>Teléfono</label>
                            <input name="telefono" value={clientForm.telefono} onChange={handleClientChange} />
                          </div>
                          <div className="field full">
                            <label>Empresa</label>
                            <input name="empresa" value={clientForm.empresa} onChange={handleClientChange} />
                          </div>
                          <div className="field full">
                            <label>Dirección</label>
                            <input name="direccion" value={clientForm.direccion} onChange={handleClientChange} />
                          </div>
                          <div className="field full">
                            <label>Notas</label>
                            <textarea name="notas" value={clientForm.notas} onChange={handleClientChange} />
                          </div>
                        </div>

                        <div className="actions-row">
                          <button className="ghost-btn" onClick={() => setClientForm({
                            nombre: selectedClient.nombre || "",
                            apellido: selectedClient.apellido || "",
                            email: selectedClient.email || "",
                            telefono: selectedClient.telefono || "",
                            empresa: selectedClient.empresa || "",
                            direccion: selectedClient.direccion || "",
                            notas: selectedClient.notas || "",
                          })}>
                            Restablecer
                          </button>
                          <button className="primary-btn" onClick={handleSaveClient} disabled={busy}>
                            Guardar cambios
                          </button>
                        </div>

                        <div className="activity-form">
                          <div className="section-head">
                            <h3>{editingActivityId ? "Editar actividad" : "Nueva actividad"}</h3>
                            {editingActivityId && (
                              <button className="ghost-btn" onClick={() => {
                                setEditingActivityId(null);
                                setActivityForm({ ...EMPTY_ACTIVITY });
                              }}>
                                Cancelar
                              </button>
                            )}
                          </div>

                          <div className="form-grid">
                            <div className="field full">
                              <label>Título</label>
                              <input name="titulo" value={activityForm.titulo} onChange={handleActivityChange} />
                            </div>
                            <div className="field full">
                              <label>Descripción</label>
                              <textarea name="descripcion" value={activityForm.descripcion} onChange={handleActivityChange} />
                            </div>
                            <div className="field full">
                              <label>Fecha</label>
                              <input type="date" name="fecha" value={activityForm.fecha} onChange={handleActivityChange} />
                            </div>
                          </div>

                          <div className="actions-row">
                            <button className="secondary-btn" onClick={handleSaveActivity} disabled={busy}>
                              {editingActivityId ? "Actualizar actividad" : "Agregar actividad"}
                            </button>
                          </div>
                        </div>
                      </section>

                      <section className="activity-section">
                        <div className="section-head">
                          <h3>Actividades pendientes</h3>
                        </div>
                        <div className="list-box">
                          {(!selectedClient.actividades || selectedClient.actividades.filter((item) => !item.completada).length === 0) ? (
                            <div className="empty-state">Sin actividades pendientes.</div>
                          ) : (
                            selectedClient.actividades
                              .filter((item) => !item.completada)
                              .map((actividad) => (
                                <div key={actividad.id} className="activity-item">
                                  <div className="activity-top">
                                    <h4 className="activity-title">{actividad.titulo}</h4>
                                    <span className="badge pending">Pendiente</span>
                                  </div>
                                  <div className="activity-date">{actividad.fecha}</div>
                                  <p className="activity-description">{actividad.descripcion || "Sin descripción."}</p>
                                  <div className="small-actions">
                                    <button className="ghost-btn" onClick={() => {
                                      setEditingActivityId(actividad.id);
                                    }}>
                                      Editar
                                    </button>
                                    <button className="secondary-btn" onClick={() => handleCompleteActivity(actividad.id)}>
                                      Completar
                                    </button>
                                  </div>
                                </div>
                              ))
                          )}
                        </div>

                        <div className="section-head" style={{ marginTop: 20 }}>
                          <h3>Actividades completadas</h3>
                        </div>
                        <div className="list-box">
                          {(!selectedClient.actividades || selectedClient.actividades.filter((item) => item.completada).length === 0) ? (
                            <div className="empty-state">Sin actividades completadas.</div>
                          ) : (
                            selectedClient.actividades
                              .filter((item) => item.completada)
                              .map((actividad) => (
                                <div key={actividad.id} className="activity-item completed">
                                  <div className="activity-top">
                                    <h4 className="activity-title">{actividad.titulo}</h4>
                                    <span className="badge done">Completada</span>
                                  </div>
                                  <div className="activity-date">{actividad.fecha}</div>
                                  <p className="activity-description">{actividad.descripcion || "Sin descripción."}</p>
                                </div>
                              ))
                          )}
                        </div>
                      </section>
                    </div>
                  </>
                ) : (
                  <div className="empty-state" style={{ margin: 18 }}>Selecciona un cliente para ver su ficha.</div>
                )}
              </section>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
