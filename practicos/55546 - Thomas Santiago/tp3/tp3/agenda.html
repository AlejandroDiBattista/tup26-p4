<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')
    const contentRoot = document.createElement('div')
    app.append(contentRoot)
    const STORAGE_KEY = 'agenda-alumnos'

    const escapeHtml = (value = '') => String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;')

    const inicializarAlumnos = () => {
      try {
        const guardado = localStorage.getItem(STORAGE_KEY)
        if (guardado) {
          const data = JSON.parse(guardado)
          if (Array.isArray(data) && data.length > 0) {
            return data
          }
        }
      } catch (error) {
        console.warn('No se pudo leer localStorage', error)
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(alumnos))
      return alumnos
    }

    const estado = reactive({
      alumnos: inicializarAlumnos(),
      busqueda: '',
      modal: null,
      error: ''
    })
    const comparador = new Intl.Collator('es', { sensitivity: 'base' })

    const crearAlumnoBase = () => ({
      id: Date.now() + Math.floor(Math.random() * 1000),
      apellido: '',
      nombre: '',
      legajo: '',
      comision: '',
      telefono: '',
      github: '',
      favorito: false
    })

    const ordenarAlumnos = (alumnos) => [...alumnos].sort((a, b) => {
      if (a.favorito !== b.favorito) return a.favorito ? -1 : 1
      return comparador.compare(a.apellido, b.apellido) || comparador.compare(a.nombre, b.nombre)
    })

    const filtrarAlumnos = (alumnos, texto) => {
      const termino = texto.trim().toLowerCase()
      if (!termino) return alumnos

      return alumnos.filter(alumno => {
        const hayCoincidencia = [
          alumno.apellido,
          alumno.nombre,
          alumno.legajo,
          alumno.comision,
          alumno.telefono,
          alumno.github
        ].some(valor => String(valor).toLowerCase().includes(termino))

        return hayCoincidencia
      })
    }

    const abrirModalAgregar = () => {
      estado.modal = {
        tipo: 'crear',
        alumno: crearAlumnoBase()
      }
      estado.error = ''
    }

    const abrirModalEditar = (alumno) => {
      estado.modal = {
        tipo: 'editar',
        alumno: { ...alumno }
      }
      estado.error = ''
    }

    const cerrarModal = () => {
      estado.modal = null
      estado.error = ''
    }

    const guardarAlumnos = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(estado.alumnos))
      } catch (error) {
        console.warn('No se pudo guardar en localStorage', error)
      }
    }

    const obtenerAlumnoPorId = (id) => estado.alumnos.find(alumno => alumno.id === Number(id))

    const alternarFavorito = (id) => {
      estado.alumnos = estado.alumnos.map(alumno =>
        alumno.id === Number(id) ? { ...alumno, favorito: !alumno.favorito } : alumno
      )
      guardarAlumnos()
      renderizar()
    }

    const renderizar = () => {
      const alumnosFiltrados = filtrarAlumnos(estado.alumnos, estado.busqueda)
      const alumnosOrdenados = ordenarAlumnos(alumnosFiltrados)

      const cards = alumnosOrdenados.length === 0
        ? '<p class="sin-resultados">No hay alumnos para mostrar.</p>'
        : `<section class="agenda-grid" aria-label="Agenda de alumnos">${alumnosOrdenados.map(alumno => {
            const apellido = escapeHtml(alumno.apellido)
            const nombre = escapeHtml(alumno.nombre)
            const telefono = escapeHtml(alumno.telefono)
            const github = escapeHtml(alumno.github)
            const comision = escapeHtml(alumno.comision)
            const legajo = escapeHtml(alumno.legajo)
            return `
            <article
              class="alumno-card"
              tabindex="0"
              data-editar-id="${alumno.id}"
              aria-label="Editar alumno ${nombre} ${apellido}"
            >
              <header class="alumno-card-header">
                <div>
                  <h2>${apellido}</h2>
                  <p class="alumno-nombre">${nombre}</p>
                </div>
                <button
                  class="favorito"
                  type="button"
                  data-favorito-id="${alumno.id}"
                  aria-label="${alumno.favorito ? 'Quitar de favoritos' : 'Marcar como favorito'}: ${nombre} ${apellido}"
                  aria-pressed="${alumno.favorito}"
                >${alumno.favorito ? '★' : '☆'}</button>
              </header>
              <address class="alumno-contacto">
                <a href="tel:${telefono}">${telefono}</a>
                <a href="https://github.com/${github}" target="_blank" rel="noreferrer">@${github}</a>
              </address>
              <footer class="alumno-detalles">
                <span>Comisión <b>${comision}</b></span>
                <span>Legajo <b>${legajo}</b></span>
              </footer>
            </article>
          `
          }).join('')}</section>`

      const modal = estado.modal ? (() => {
        const modalAlumno = estado.modal.alumno
        const apellido = escapeHtml(modalAlumno.apellido)
        const nombre = escapeHtml(modalAlumno.nombre)
        const legajo = escapeHtml(modalAlumno.legajo)
        const comision = escapeHtml(modalAlumno.comision)
        const telefono = escapeHtml(modalAlumno.telefono)
        const github = escapeHtml(modalAlumno.github)
        const error = estado.error ? `<p class="mensaje-error">${escapeHtml(estado.error)}</p>` : ''

        return `
        <dialog open class="modal">
          <form class="modal-form" method="dialog" data-form="alumno" data-tipo="${estado.modal.tipo}">
            <header class="modal-header">
              <h2>${estado.modal.tipo === 'editar' ? 'Editar alumno' : 'Agregar alumno'}</h2>
              <button type="button" class="cerrar-modal" data-accion="cerrar-modal" aria-label="Cerrar formulario">×</button>
            </header>

            <div class="form-grid">
              <label>
                <span>Apellido</span>
                <input name="apellido" required value="${apellido}" />
              </label>
              <label>
                <span>Nombre</span>
                <input name="nombre" required value="${nombre}" />
              </label>
              <label>
                <span>Legajo</span>
                <input name="legajo" required value="${legajo}" />
              </label>
              <label>
                <span>Comisión</span>
                <input name="comision" required value="${comision}" />
              </label>
              <label>
                <span>Teléfono</span>
                <input name="telefono" required value="${telefono}" />
              </label>
              <label>
                <span>GitHub</span>
                <input name="github" required value="${github}" />
              </label>
            </div>

            ${error}

            <footer class="modal-footer">
              ${estado.modal.tipo === 'editar' ? '<button type="button" class="boton-eliminar" data-accion="eliminar-alumno">Eliminar</button>' : ''}
              <button type="button" class="boton-secundario" data-accion="cerrar-modal">Cancelar</button>
              <button type="submit" class="boton-primario">Guardar</button>
            </footer>
          </form>
        </dialog>
      `
      })() : ''

      contentRoot.innerHTML = `
        <header class="agenda-header">
          <div>
            <p class="agenda-kicker">Directorio académico</p>
            <h1>Alumnos</h1>
          </div>
          <div class="agenda-acciones">
            <p class="agenda-count">${alumnosOrdenados.length} alumnos</p>
            <button type="button" class="boton-agregar" data-accion="agregar">Agregar</button>
          </div>
        </header>

        <section class="agenda-tools" aria-label="Herramientas de búsqueda">
          <label class="campo-busqueda" for="buscador-alumnos">
            <span>Buscar</span>
            <input
              id="buscador-alumnos"
              type="search"
              name="busqueda"
              placeholder="Apellido, nombre, legajo, comisión..."
              value="${escapeHtml(estado.busqueda)}"
              data-busqueda-input
            />
          </label>
        </section>

        ${cards}
        ${modal}
      `
    }

    app.addEventListener('click', (evento) => {
      const accion = evento.target.closest('[data-accion]')
      if (accion?.dataset.accion === 'agregar') {
        abrirModalAgregar()
        renderizar()
        return
      }

      if (accion?.dataset.accion === 'cerrar-modal') {
        cerrarModal()
        renderizar()
        return
      }

      if (accion?.dataset.accion === 'eliminar-alumno') {
        if (!estado.modal || estado.modal.tipo !== 'editar') return
        const id = Number(estado.modal.alumno.id)
        estado.alumnos = estado.alumnos.filter(alumno => alumno.id !== id)
        guardarAlumnos()
        cerrarModal()
        renderizar()
        return
      }

      const botonFavorito = evento.target.closest('[data-favorito-id]')
      if (botonFavorito) {
        evento.stopPropagation()
        alternarFavorito(botonFavorito.dataset.favoritoId)
        return
      }

      const tarjeta = evento.target.closest('[data-editar-id]')
      if (tarjeta) {
        const alumno = obtenerAlumnoPorId(tarjeta.dataset.editarId)
        if (alumno) {
          abrirModalEditar(alumno)
          renderizar()
        }
      }
    })

    app.addEventListener('keydown', (evento) => {
      const tarjeta = evento.target.closest('[data-editar-id]')
      if (!tarjeta) return

      if (evento.key === 'Enter') {
        evento.preventDefault()
        const alumno = obtenerAlumnoPorId(tarjeta.dataset.editarId)
        if (alumno) {
          abrirModalEditar(alumno)
          renderizar()
        }
        return
      }

      if (evento.key === ' ') {
        evento.preventDefault()
        alternarFavorito(tarjeta.dataset.editarId)
      }
    })

    app.addEventListener('input', (evento) => {
      const input = evento.target.closest('[data-busqueda-input]')
      if (!input) return

      const start = input.selectionStart
      const end = input.selectionEnd
      estado.busqueda = input.value
      renderizar()

      const nuevoInput = contentRoot.querySelector('#buscador-alumnos')
      if (nuevoInput) {
        nuevoInput.focus()
        if (typeof start === 'number' && typeof end === 'number') {
          nuevoInput.setSelectionRange(start, end)
        }
      }
    })

    app.addEventListener('submit', (evento) => {
      const form = evento.target.closest('[data-form="alumno"]')
      if (!form) return
      evento.preventDefault()

      const datos = Object.fromEntries(new FormData(form).entries())
      const idBase = estado.modal?.tipo === 'editar' ? Number(estado.modal.alumno.id) : Date.now() + Math.floor(Math.random() * 1000)
      const alumno = {
        id: idBase,
        apellido: String(datos.apellido || '').trim(),
        nombre: String(datos.nombre || '').trim(),
        legajo: String(datos.legajo || '').trim(),
        comision: String(datos.comision || '').trim(),
        telefono: String(datos.telefono || '').trim(),
        github: String(datos.github || '').trim(),
        favorito: estado.modal?.tipo === 'editar' ? Boolean(estado.modal.alumno.favorito) : false
      }

      const camposRequeridos = [alumno.apellido, alumno.nombre, alumno.legajo, alumno.comision, alumno.telefono, alumno.github]
      if (camposRequeridos.some(valor => valor === '')) {
        estado.error = 'Todos los campos son obligatorios.'
        renderizar()
        return
      }

      if (estado.modal?.tipo === 'editar') {
        estado.alumnos = estado.alumnos.map(item => item.id === idBase ? alumno : item)
      } else {
        estado.alumnos = [...estado.alumnos, alumno]
      }

      guardarAlumnos()
      cerrarModal()
      renderizar()
    })

    const estilos = document.createElement('style')
    estilos.textContent = `
      #app {
        max-width: 1160px;
        margin-inline: auto;
      }
      .agenda-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }
      .agenda-header h1 { margin: 0; }
      .agenda-acciones {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .agenda-kicker {
        margin: 0 0 6px;
        color: #58685e;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .agenda-count {
        margin: 0;
        color: #58685e;
        font-size: 14px;
        font-weight: 700;
      }
      .boton-agregar, .boton-primario, .boton-secundario, .cerrar-modal, .boton-eliminar {
        border: none;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
        transition: filter .15s ease, transform .15s ease;
      }
      .boton-agregar, .boton-primario {
        background: #2d6a4f;
        color: white;
        padding: 10px 16px;
      }
      .boton-agregar:hover, .boton-primario:hover,
      .boton-secundario:hover, .boton-eliminar:hover,
      .cerrar-modal:hover {
        filter: brightness(0.98);
      }
      .boton-secundario {
        background: #eef2ee;
        color: #28453b;
        padding: 10px 16px;
      }
      .boton-eliminar {
        background: #f0d6d6;
        color: #7b2f2f;
        padding: 10px 16px;
        margin-right: auto;
      }
      .cerrar-modal {
        width: 34px;
        height: 34px;
        background: #eef2ee;
        color: #28453b;
        font-size: 20px;
      }
      .modal {
        border: none;
        padding: 0;
        border-radius: 16px;
        box-shadow: 0 18px 46px rgba(20, 30, 27, 0.18);
        width: min(540px, calc(100vw - 32px));
      }
      .modal::backdrop {
        background: rgba(15, 26, 23, 0.35);
      }
      .modal-form {
        padding: 22px;
        background: #fff;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .modal-header h2 {
        margin: 0;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .form-grid label {
        display: grid;
        gap: 8px;
        font-size: 14px;
        color: #30453d;
        font-weight: 600;
      }
      .form-grid input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #cfd7d0;
        border-radius: 8px;
        font: inherit;
        background: #fff;
      }
      .form-grid input:focus {
        outline: 2px solid #2e7254;
        outline-offset: 2px;
      }
      .mensaje-error {
        margin: 14px 0 0;
        color: #a83838;
        font-size: 14px;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
      }
      .alumno-card {
        min-width: 0;
        padding: 18px;
        border: 1px solid #d9ded9;
        border-radius: 8px;
        background: #fff;
        text-align: left;
        cursor: pointer;
        transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
      }
      .alumno-card:hover {
        border-color: #bfd0c8;
        box-shadow: 0 8px 18px rgba(38, 58, 50, 0.06);
      }
      .alumno-card:focus-visible {
        outline: 3px solid #2e7254;
        outline-offset: 2px;
        border-radius: 10px;
      }
      .agenda-tools {
        margin-bottom: 20px;
      }
      .campo-busqueda {
        display: grid;
        gap: 8px;
        max-width: 460px;
        font-size: 14px;
        color: #30453d;
        font-weight: 600;
      }
      .campo-busqueda input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cfd7d0;
        border-radius: 10px;
        background: #fff;
        font: inherit;
      }
      .campo-busqueda input:focus {
        outline: 2px solid #2e7254;
        outline-offset: 2px;
      }
      .sin-resultados {
        margin-top: 10px;
        padding: 24px 18px;
        border: 1px dashed #c9d1cd;
        border-radius: 10px;
        background: #f8f9f8;
        color: #4d5f59;
        text-align: center;
      }
      .agenda-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .alumno-card-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }
      .alumno-card h2 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
      }
      .alumno-nombre {
        margin: 4px 0 0;
        color: #58685e;
      }
      .favorito {
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        border: 1px solid #d9ded9;
        border-radius: 6px;
        background: #fff;
        color: #9a641b;
        cursor: pointer;
        font-size: 21px;
        line-height: 1;
      }
      .favorito:hover, .favorito[aria-pressed="true"] {
        border-color: #c68a36;
        background: #fff4dc;
      }
      .favorito:focus-visible {
        outline: 3px solid #2e7254;
        outline-offset: 2px;
      }
      .alumno-contacto {
        display: grid;
        gap: 6px;
        margin: 18px 0;
        font-size: 14px;
        font-style: normal;
        overflow-wrap: anywhere;
      }
      .alumno-contacto a { color: #285d49; }
      .alumno-detalles {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 12px;
        border-top: 1px solid #e8ebe8;
        color: #58685e;
        font-size: 13px;
      }
      .alumno-detalles b { color: #25342b; }
      @media (max-width: 900px) {
        .agenda-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 600px) {
        body { padding: 24px 16px; }
        .agenda-grid { grid-template-columns: 1fr; }
        .agenda-header { align-items: start; }
      }
    `
    document.head.append(estilos)
    renderizar()
  </script>
</body>
</html>
