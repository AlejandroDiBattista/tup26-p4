<!DOCTYPE html>
<!--
  TP3 — Agenda reactiva (Arrow.js)
  Para ejecutar: servir esta carpeta por HTTP (el import de alumnos.json no funciona con file://)
    npx serve .        o        python -m http.server 8000
  y abrir http://localhost:8000/agenda.html (o el puerto que indique el servidor).
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    :root {
      --fondo: #e3e5e8;
      --tarjeta: #ffffff;
      --borde: #cfd3d8;
      --texto: #1f2328;
      --suave: #6a7079;
      --acento: #3d5a80;
      --estrella: #e0a800;
      --peligro: #c0392b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font: 15px/1.4 Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: var(--fondo);
    }

    button, input { font: inherit; color: inherit; }

    main {
      width: 1000px;
      max-width: 100%;
      margin: auto;

      > header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--borde);

        h1 { margin: 0 auto 0 0; font-size: 24px; }

        > div { display: flex; gap: 8px; flex: 0 1 380px; }

        input[type="search"] {
          flex: 1;
          min-width: 0;
          padding: 8px 10px;
          border: 1px solid var(--borde);
          border-radius: 4px;
          background: var(--tarjeta);

          &:focus { outline: 2px solid var(--acento); outline-offset: -1px; }
        }

        button {
          padding: 8px 14px;
          border: 0;
          border-radius: 4px;
          background: var(--acento);
          color: white;
          cursor: pointer;

          &:hover { opacity: .9; }
        }
      }

      > section {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 10px;

        > p {
          grid-column: 1 / -1;
          padding: 30px;
          text-align: center;
          color: var(--suave);
        }
      }
    }

    article {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background: var(--tarjeta);
      cursor: pointer;

      &:hover { border-color: var(--acento); }
      &:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }

      > header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;

        h2 {
          margin: 0;
          font-size: 14px;
          font-weight: 400;
          color: var(--suave);

          strong { display: block; font-size: 17px; color: var(--texto); }
        }

        button {
          flex: none;
          padding: 0;
          border: 0;
          background: none;
          color: var(--estrella);
          font-size: 20px;
          line-height: 1;
          cursor: pointer;
        }
      }

      > address {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-style: normal;
        font-size: 14px;

        > :last-child { color: var(--acento); }
      }

      > footer {
        margin-top: auto;
        font-size: 12px;
        color: var(--suave);
      }
    }

    dialog {
      width: min(480px, calc(100% - 32px));
      padding: 20px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background: var(--tarjeta);
      color: var(--texto);

      &::backdrop { background: rgb(0 0 0 / .4); }

      form > header {
        margin-bottom: 12px;

        h2 { margin: 0; font-size: 18px; }
        p { margin: 4px 0 0; font-size: 13px; color: var(--suave); }
      }

      fieldset {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        border: 0;

        label {
          display: flex;
          flex-direction: column;
          gap: 4px;
          font-size: 13px;
          color: var(--suave);
        }

        input {
          padding: 8px 10px;
          border: 1px solid var(--borde);
          border-radius: 4px;
          font-size: 15px;
          color: var(--texto);

          &:focus { outline: 2px solid var(--acento); outline-offset: -1px; }
          &:user-invalid { border-color: var(--peligro); }
        }
      }

      form > footer {
        display: flex;
        gap: 8px;
        margin-top: 18px;

        button {
          padding: 8px 14px;
          border: 1px solid var(--borde);
          border-radius: 4px;
          background: #f2f3f5;
          cursor: pointer;

          &:first-child:not([type="submit"]) { border-color: var(--peligro); background: none; color: var(--peligro); }
          &[type="submit"] { margin-left: auto; border-color: var(--acento); background: var(--acento); color: white; }
          &:hover { opacity: .9; }
        }
      }
    }

    @media (max-width: 560px) {
      main > header > div { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core@1.0.6'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }


    const CLAVE = 'agenda-alumnos'
    const CAMPOS = ['apellido', 'nombre', 'legajo', 'comision', 'telefono', 'github']

    function cargar() {
      try {
        const guardados = JSON.parse(localStorage.getItem(CLAVE))
        if (Array.isArray(guardados)) return guardados
      } catch {}
      const iniciales = alumnosIniciales.map(a => ({ ...a, favorito: Boolean(a.favorito) }))
      localStorage.setItem(CLAVE, JSON.stringify(iniciales))
      return iniciales
    }

    const state = reactive({
      alumnos: cargar(),
      busqueda: '',
      editandoId: null,   
    })


    const normalizar = texto => String(texto ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    const comparar = (a, b) => normalizar(a).localeCompare(normalizar(b), 'es')

    function ordenar(lista) {
      return lista.sort((a, b) =>
        (b.favorito - a.favorito) || comparar(a.apellido, b.apellido) || comparar(a.nombre, b.nombre))
    }

    function visibles() {
      const q = normalizar(state.busqueda).trim()
      const lista = state.alumnos.filter(a =>
        !q || CAMPOS.some(campo => normalizar(a[campo]).includes(q)) ||
        normalizar(`${a.nombre} ${a.apellido}`).includes(q) ||
        normalizar(`${a.apellido} ${a.nombre}`).includes(q))
      return ordenar(lista)
    }

    const buscarAlumno = id => state.alumnos.find(a => a.id === id)

   
    function guardar() {
      localStorage.setItem(CLAVE, JSON.stringify(state.alumnos))
    }

    function alternarFavorito(alumno) {
      alumno.favorito = !alumno.favorito
      guardar()
    }

    function agregarAlumno(datos) {
      const id = Math.max(0, ...state.alumnos.map(a => a.id)) + 1
      state.alumnos.push({ id, ...datos, favorito: false })
      guardar()
    }

    function actualizarAlumno(id, datos) {
      Object.assign(buscarAlumno(id), datos)
      guardar()
    }

    function eliminarAlumno(id) {
      const i = state.alumnos.findIndex(a => a.id === id)
      if (i >= 0) state.alumnos.splice(i, 1)
      guardar()
    }

   
    const REGLAS = {
      apellido: [/^\S.{0,59}$/, 'Ingresá el apellido.'],
      nombre:   [/^\S.{0,59}$/, 'Ingresá el nombre.'],
      legajo:   [/^\d{5}$/, 'El legajo debe tener 5 dígitos.'],
      comision: [/^C\d{1,2}$/i, 'La comisión debe tener el formato C1, C2, ...'],
      telefono: [/^(?=(?:\D*\d){7,15}\D*$)[\d\s()+-]+$/, 'Ingresá un teléfono válido, por ejemplo (381) 555-1234.'],
      github:   [/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/, 'Usuario de GitHub inválido.'],
    }

    function leerFormulario(form) {
      const datos = {}
      for (const campo of CAMPOS) {
        const input = form.elements[campo]
        let valor = input.value.trim()
        if (campo === 'github') valor = valor.replace(/^@/, '')
        if (campo === 'comision') valor = valor.toUpperCase()
        const [regla, mensaje] = REGLAS[campo]
        let error = regla.test(valor) ? '' : mensaje
        if (!error && campo === 'legajo' &&
            state.alumnos.some(a => a.legajo === valor && a.id !== state.editandoId)) {
          error = 'Ya existe un alumno con ese legajo.'
        }
        input.setCustomValidity(error)
        datos[campo] = valor
      }
      return form.reportValidity() ? datos : null
    }


    const dialogo = () => document.querySelector('dialog')
    const formulario = () => document.querySelector('dialog form')

    function abrirDialogo(alumno = null) {
      state.editandoId = alumno ? alumno.id : null
      const form = formulario()
      for (const campo of CAMPOS) {
        form.elements[campo].value = alumno ? alumno[campo] : ''
        form.elements[campo].setCustomValidity('')
      }
      dialogo().showModal()
      form.elements.apellido.focus()
    }

    function cerrarDialogo() {
      dialogo().close()
    }

    function alGuardar(e) {
      e.preventDefault()
      const datos = leerFormulario(e.target)
      if (!datos) return
      if (state.editandoId === null) agregarAlumno(datos)
      else actualizarAlumno(state.editandoId, datos)
      cerrarDialogo()
    }

    function alEliminar() {
      const alumno = buscarAlumno(state.editandoId)
      if (alumno && confirm(`¿Eliminar a ${alumno.apellido}, ${alumno.nombre}?`)) {
        eliminarAlumno(alumno.id)
        cerrarDialogo()
      }
    }

    function alTeclear(e, alumno) {
      if (e.target !== e.currentTarget) return
      if (e.key === 'Enter') {
        e.preventDefault()
        abrirDialogo(alumno)
      } else if (e.key === ' ') {
        e.preventDefault()
        alternarFavorito(alumno)
      }
    }

    function alClickFavorito(e, alumno) {
      e.stopPropagation()
      alternarFavorito(alumno)
    }

    const tarjeta = alumno => html`
      <article tabindex="0"
        aria-label="${() => `${alumno.apellido}, ${alumno.nombre}`}"
        @click="${() => abrirDialogo(alumno)}"
        @keydown="${e => alTeclear(e, alumno)}">
        <header>
          <h2><strong>${() => alumno.apellido}</strong> ${() => alumno.nombre}</h2>
          <button type="button" tabindex="-1"
            title="${() => alumno.favorito ? 'Quitar de favoritos' : 'Marcar como favorito'}"
            aria-pressed="${() => String(alumno.favorito)}"
            @click="${e => alClickFavorito(e, alumno)}">${() => alumno.favorito ? '★' : '☆'}</button>
        </header>
        <address>
          <span>${() => alumno.telefono}</span>
          <span>@${() => alumno.github}</span>
        </address>
        <footer>${() => alumno.comision} · ${() => alumno.legajo}</footer>
      </article>
    `.key(alumno.id)

    const sinResultados = () => html`<p>No hay alumnos para mostrar.</p>`.key('sin-resultados')

    const vista = html`
      <header>
        <h1>Agenda</h1>
        <div>
          <input type="search" placeholder="Buscar alumno..." aria-label="Buscar alumno"
            @input="${e => state.busqueda = e.target.value}">
          <button type="button" @click="${() => abrirDialogo()}">+ Agregar</button>
        </div>
      </header>
      <section aria-live="polite">
        ${() => {
          const lista = visibles()
          return lista.length ? lista.map(tarjeta) : [sinResultados()]
        }}
      </section>
    `

    const dialogoAlumno = html`
      <dialog aria-labelledby="titulo-dialogo">
        <form novalidate @submit="${alGuardar}">
          <header>
            <h2 id="titulo-dialogo">${() => state.editandoId === null ? 'Agregar alumno' : 'Editar alumno'}</h2>
            <p>${() => state.editandoId === null ? 'Completá los datos del nuevo alumno.' : 'Actualizá los datos del alumno.'}</p>
          </header>
          <fieldset>
            <label>Apellido <input name="apellido" required autocomplete="off"></label>
            <label>Nombre <input name="nombre" required autocomplete="off"></label>
            <label>Legajo <input name="legajo" required inputmode="numeric" placeholder="63409"></label>
            <label>Comisión <input name="comision" required placeholder="C1"></label>
            <label>Teléfono <input name="telefono" type="tel" required placeholder="(381) 555-1234"></label>
            <label>GitHub <input name="github" required placeholder="usuario"></label>
          </fieldset>
          <footer>
            ${() => state.editandoId === null ? '' :
              html`<button type="button" @click="${alEliminar}">Eliminar</button>`}
            <button type="submit">Guardar</button>
            <button type="button" @click="${cerrarDialogo}">Cancelar</button>
          </footer>
        </form>
      </dialog>
    `

    vista(document.getElementById('app'))
    dialogoAlumno(document.body)
  </script>
</body>
</html>
