<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>

  <style>
    body {
      margin: 0;
      padding: 32px 20px;
      font: 16px sans-serif;
      background: #f5f6f4;
    }

    main {
      width: 1104px;
      max-width: 100%;
      margin: auto;
    }

    .agenda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    .acciones {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .buscador {
      width: 260px;
      height: 42px;
      box-sizing: border-box;
      padding: 0 14px;
      border: 1px solid #d9ded9;
      border-radius: 25px;
      background: white;
      font: inherit;
      outline: none;
    }

    .buscador:focus {
      border-color: #999;
    }

    .agregar {
      height: 42px;
      padding: 0 18px;
      border: none;
      border-radius: 25px;
      background: #000;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .agregar:hover {
      background: #222;
    }

    ul {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    li {
      height: 200px;
      box-sizing: border-box;
      padding: 20px;
      border: 1px solid #d9ded9;
      border-radius: 16px;
      background: white;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .nombre {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .estrella {
      font-size: 26px;
      line-height: 1;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .datos {
      margin-top: 24px;
    }

    .datos p {
      margin: 8px 0;
    }

    .separador {
      margin: 16px 0 12px;
      border: 0;
      border-top: 1px solid #d9ded9;
    }

    .card-footer p {
      margin: 0;
    }

    .sin-resultados {
      grid-column: 1 / -1;
      height: auto;
      padding: 40px 20px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .agenda-header {
        align-items: stretch;
        flex-direction: column;
        gap: 16px;
      }

      .acciones {
        width: 100%;
      }

      .buscador {
        flex: 1;
        width: auto;
      }

      ul {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')

    const alumnosGuardados = localStorage.getItem('alumnos')

    const estado = reactive({
      alumnos: alumnosGuardados
        ? JSON.parse(alumnosGuardados)
        : alumnos,
      busqueda: ''
    })

    if (!alumnosGuardados) {
      localStorage.setItem('alumnos', JSON.stringify(alumnos))
    }

   

    const normalizar = texto => {
      return texto
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
    }

    const ordenarAlumnos = lista => {
      return [...lista].sort((a, b) => {
        if (a.favorito !== b.favorito) {
          return b.favorito - a.favorito
        }

        const apellidoA = normalizar(a.apellido)
        const apellidoB = normalizar(b.apellido)

        const comparacionApellido = apellidoA.localeCompare(apellidoB)

        if (comparacionApellido !== 0) {
          return comparacionApellido
        }

        return normalizar(a.nombre).localeCompare(normalizar(b.nombre))
      })
    }

    const alumnosFiltrados = () => {
      const busqueda = normalizar(estado.busqueda.trim())

      let lista = estado.alumnos

      if (busqueda) {
        lista = lista.filter(a => {
          return [
            a.apellido,
            a.nombre,
            a.legajo,
            a.comision,
            a.telefono,
            a.github
          ].some(dato =>
            normalizar(String(dato)).includes(busqueda)
          )
        })
      }

      return ordenarAlumnos(lista)
    }

    const cambiarFavorito = id => {
  const alumnosActualizados = estado.alumnos.map(alumno => {
    if (alumno.id === id) {
      return {
        ...alumno,
        favorito: !alumno.favorito
      }
    }

    return alumno
  })

  estado.alumnos = alumnosActualizados

  localStorage.setItem(
    'alumnos',
    JSON.stringify(estado.alumnos)
  )
}

    const vistaAlumnos = () => {
      const lista = alumnosFiltrados()

      if (lista.length === 0) {
        return html`
          <li class="sin-resultados">
            No hay alumnos para mostrar.
          </li>
        `
      }

      return lista.map(a => html`
        <li>
          <div class="card-header">
            <h2 class="nombre">${a.apellido}, ${a.nombre}</h2>

            <button
              class="estrella"
              type="button"
              aria-label="${a.favorito ? 'Quitar de favoritos' : 'Agregar a favoritos'}"
              @click="${() => cambiarFavorito(a.id)}"
            >
              ${() => a.favorito ? '★' : '☆'}
            </button>
          </div>

          <div class="datos">
            <p>${a.telefono}</p>
            <p>${a.github}</p>
          </div>

          <hr class="separador">

          <div class="card-footer">
            <p>${a.comision} · ${a.legajo}</p>
          </div>
        `
      ).map(card => card)
    }

    html`
      <header class="agenda-header">
        <h1>Agenda</h1>

        <div class="acciones">
          <input
            class="buscador"
            type="search"
            placeholder="Buscar alumno..."
            @input="${event => estado.busqueda = event.target.value}"
          >

          <button class="agregar" type="button">
            + Agregar
          </button>
        </div>
      </header>

      <section>
        <ul>
          ${() => vistaAlumnos()}
        </ul>
      </section>
    `(app)
  </script>
</body>
</html>
