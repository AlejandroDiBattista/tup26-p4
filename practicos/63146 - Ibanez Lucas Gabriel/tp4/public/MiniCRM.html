<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniCRM</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --header: #2c3e5c;
      --fondo: #eef1f5;
      --panel: #ffffff;
      --borde: #e1e5eb;
      --texto: #1f2733;
      --suave: #5f6b7a;
      --azul: #1f6fe0;
      --azul-hover: #195dc0;
      --seleccion: #e7f0fd;
      --rojo: #d63c3c;
      --rojo-fondo: #fdeeee;
      --verde: #3fa96b;
      --verde-fondo: #f1f9f4;
      --radio: 8px;
    }

    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--texto);
      background: var(--fondo);
      overflow: hidden;
    }
    button, input { font: inherit; color: inherit; }
    svg { flex-shrink: 0; }

    /* --- Estructura general: alto fijo de la ventana, sin scroll de página --- */
    .app { height: 100%; display: flex; flex-direction: column; }
    .header {
      background: var(--header);
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .header h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .3px; }
    .contenido {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 12px;
      padding: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Botones --- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--borde);
      background: #f7f8fa;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #eceff3; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-primario { background: var(--azul); border-color: var(--azul); color: #fff; }
    .btn-primario:hover { background: var(--azul-hover); }
    .btn-primario:disabled:hover { background: var(--azul); }
    .btn-peligro { background: var(--rojo-fondo); border-color: #f2b8b8; color: var(--rojo); }
    .btn-peligro:hover { background: #fbdcdc; }
    .btn-icono { padding: 7px; background: #fff; }
    .btn-icono.peligro { color: var(--rojo); }

    /* --- Inputs --- */
    .input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfd5dd;
      border-radius: 6px;
      background: #fff;
      outline: 0;
    }
    .input:focus { border-color: var(--azul); box-shadow: 0 0 0 3px #1f6fe022; }

    /* --- Maestro --- */
    .maestro-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 12px;
    }
    .maestro-cabecera h2 { margin: 0; font-size: 26px; }
    .buscador {
      margin: 0 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      color: var(--suave);
    }
    .buscador:focus-within { border-color: var(--azul); box-shadow: 0 0 0 3px #1f6fe022; }
    .buscador input { flex: 1; border: 0; outline: 0; padding: 10px 0; background: transparent; color: var(--texto); }
    .lista { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--borde); }
    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-bottom: 1px solid var(--borde);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .item:hover { background: #f5f8fc; }
    .item.activo { background: var(--seleccion); }
    .item-texto { min-width: 0; }
    .item-nombre { font-weight: 600; }
    .item-email { color: var(--suave); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 15px;
      flex-shrink: 0;
    }
    .vacio { padding: 24px 16px; color: var(--suave); text-align: center; }

    /* --- Detalle: cabecera y ficha fijas, listas de actividades con scroll propio --- */
    .detalle { padding: 20px 24px; overflow-y: auto; gap: 16px; }
    .detalle > * { flex-shrink: 0; }
    .detalle-cabecera { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .detalle-cabecera h2 { margin: 8px 0 0; font-size: 32px; }
    .detalle-acciones { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .detalle-id { color: var(--suave); font-size: 15px; }
    .botonera { display: flex; gap: 8px; }
    .ficha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--borde);
    }
    .ficha-columna { display: flex; flex-direction: column; gap: 12px; }
    .dato { display: flex; gap: 12px; align-items: flex-start; }
    .dato svg { color: var(--suave); margin-top: 2px; }
    .dato > div { min-width: 0; overflow-wrap: anywhere; }
    .dato .falta { color: var(--suave); font-style: italic; }
    .centrado { flex: 1; display: grid; place-items: center; color: var(--suave); }
    .error { color: var(--rojo); }
    .aviso {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--rojo-fondo);
      color: var(--rojo);
    }
    .aviso button { border: 0; background: none; color: inherit; cursor: pointer; display: flex; }

    /* --- Formulario de cliente --- */
    .formulario h2 { margin: 0 0 4px; font-size: 26px; }
    .form-grilla { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
    .campo { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--suave); }
    .campo .requerido { color: var(--rojo); }
    .form-botones { display: flex; gap: 8px; justify-content: flex-end; }

    /* --- Subformulario de actividad --- */
    .subform {
      border: 1.5px dashed #c5ccd6;
      border-radius: var(--radio);
      padding: 14px 16px;
    }
    .subform h3 { margin: 0 0 10px; font-size: 18px; }
    .subform-fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .subform-fila .descripcion { flex: 2 1 220px; width: auto; }
    .subform-fila .fecha { flex: 1 1 150px; width: auto; }
    .subform .error { margin: 8px 0 0; font-size: 14px; }

    /* --- Listas de actividades --- */
    .grupos { flex: 1 1 auto; min-height: 180px; display: flex; flex-direction: column; gap: 16px; }
    .detalle > .grupos { flex-shrink: 1; }
    .grupo { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; }
    .grupo h3 { margin: 0 0 8px; font-size: 20px; flex-shrink: 0; }
    .grupo-vacio { flex-shrink: 0; }
    .actividades {
      list-style: none;
      margin: 0;
      padding: 0;
      min-height: 64px;
      overflow-y: auto;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
    }
    .actividades.completadas { background: var(--verde-fondo); }
    .actividad {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--borde);
    }
    .actividad:last-child { border-bottom: 0; }
    .actividad.editando { background: var(--seleccion); }
    .actividad-texto { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .actividad-fecha { color: var(--suave); font-size: 14px; }
    .actividad-fecha.vencida { color: var(--rojo); }
    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--rojo-fondo);
      font-size: 12px;
      font-weight: 600;
    }
    .actividad .botonera { gap: 6px; }
    .check {
      width: 22px;
      height: 22px;
      border: 2px solid #9aa4b1;
      border-radius: 4px;
      background: #fff;
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      color: #fff;
    }
    .check:hover { border-color: var(--verde); }
    .check:disabled { cursor: default; opacity: .5; }
    .check.hecho { background: var(--verde); border-color: var(--verde); cursor: default; }
    .lista-vacia {
      margin: 0;
      padding: 8px 14px;
      border: 1px dashed var(--borde);
      border-radius: var(--radio);
      color: var(--suave);
      font-size: 14px;
    }

    /* --- Pantallas angostas: maestro arriba, detalle abajo, cada uno con su scroll --- */
    @media (max-width: 760px) {
      .header { padding: 0 16px; }
      .contenido { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; padding: 8px; gap: 8px; }
      .maestro-cabecera h2 { font-size: 22px; }
      .detalle { padding: 16px; }
      .detalle-cabecera h2 { font-size: 24px; margin: 0; }
      .ficha, .form-grilla { grid-template-columns: 1fr; }
      .detalle-cabecera { flex-direction: column-reverse; }
      .detalle-acciones { width: 100%; flex-direction: row-reverse; justify-content: space-between; align-items: center; }
      .botonera { flex-wrap: wrap; }
      .btn { padding: 6px 12px; }
      .grupos { flex-shrink: 0; min-height: 0; }
      .actividades { max-height: 260px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    /** @jsxRuntime classic */
    const { useEffect, useState } = React;

    // ------------------------------------------------------------------
    // API
    // ------------------------------------------------------------------
    async function api(ruta, opciones = {}) {
      const { body, ...resto } = opciones;
      const res = await fetch(`/api${ruta}`, {
        ...resto,
        headers: body === undefined ? undefined : { "Content-Type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      const datos = res.status === 204 ? null : await res.json();
      if (!res.ok) throw new Error(datos?.error ?? `Error ${res.status}`);
      return datos;
    }

    // ------------------------------------------------------------------
    // Iconos (SVG en línea, trazo heredado del color del texto)
    // ------------------------------------------------------------------
    function Icono({ children, size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {children}
        </svg>
      );
    }
    const IconoMas = () => <Icono><path d="M12 5v14M5 12h14" /></Icono>;
    const IconoLupa = () => <Icono><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></Icono>;
    const IconoLapiz = ({ size }) => <Icono size={size}><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /></Icono>;
    const IconoTacho = ({ size }) => (
      <Icono size={size}><path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6" /></Icono>
    );
    const IconoSobre = () => <Icono><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-10 6L2 7" /></Icono>;
    const IconoTelefono = () => (
      <Icono>
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z" />
      </Icono>
    );
    const IconoUbicacion = () => <Icono><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></Icono>;
    const IconoGuardar = () => (
      <Icono><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" /><path d="M17 21v-8H7v8M7 3v5h8" /></Icono>
    );
    const IconoCerrar = () => <Icono><path d="M18 6 6 18M6 6l12 12" /></Icono>;
    const IconoTilde = () => <Icono size={14}><path d="M20 6 9 17l-5-5" /></Icono>;

    // ------------------------------------------------------------------
    // Utilidades de presentación
    // ------------------------------------------------------------------
    const COLORES_AVATAR = [
      ["#e1edfd", "#2f6fd1"], ["#e2f6ea", "#2e8a55"], ["#ece6fb", "#6b4fc4"], ["#fdeadb", "#c4621f"],
      ["#fde4ea", "#c43a5c"], ["#dff5f5", "#23827f"], ["#f9f1d8", "#9a7712"],
    ];

    const iniciales = (c) => `${c.nombre[0] ?? ""}${c.apellido[0] ?? ""}`.toUpperCase();
    const nombreCompleto = (c) => `${c.nombre} ${c.apellido}`;

    function Avatar({ cliente }) {
      const [fondo, color] = COLORES_AVATAR[cliente.id % COLORES_AVATAR.length];
      return <div className="avatar" style={{ background: fondo, color }}>{iniciales(cliente)}</div>;
    }

    const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const dosDigitos = (n) => String(n).padStart(2, "0");

    /** Fecha local de hoy como "AAAA-MM-DD", comparable con fechaCompromiso. */
    function hoy() {
      const d = new Date();
      return `${d.getFullYear()}-${dosDigitos(d.getMonth() + 1)}-${dosDigitos(d.getDate())}`;
    }

    /** "2026-10-16" => "16 oct 2026" (sin pasar por Date, para no correr el día por la zona horaria). */
    function formatearFecha(iso) {
      const [a, m, d] = iso.slice(0, 10).split("-").map(Number);
      return `${d} ${MESES[m - 1]} ${a}`;
    }

    /** Fecha-hora ISO (UTC) => día local formateado. */
    function formatearFinalizacion(iso) {
      const d = new Date(iso);
      return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
    }

    /** Compromisos: primero sin fecha, luego vencidos y por último hoy/futuros; cada grupo por fecha ascendente. */
    function ordenarCompromisos(pendientes) {
      const hoyIso = hoy();
      const grupo = (a) => (a.fechaCompromiso === null ? 0 : a.fechaCompromiso < hoyIso ? 1 : 2);
      return [...pendientes].sort((a, b) =>
        grupo(a) - grupo(b) || (a.fechaCompromiso ?? "").localeCompare(b.fechaCompromiso ?? "") || a.id - b.id);
    }

    /** Devuelve `valor` con retardo: evita pedir a la API en cada tecla. */
    function useDemorado(valor, ms) {
      const [demorado, setDemorado] = useState(valor);
      useEffect(() => {
        const t = setTimeout(() => setDemorado(valor), ms);
        return () => clearTimeout(t);
      }, [valor, ms]);
      return demorado;
    }

    // ------------------------------------------------------------------
    // Maestro: lista de clientes con búsqueda en vivo
    // ------------------------------------------------------------------
    function Maestro({ clientes, cargando, error, busqueda, onBuscar, seleccionado, onSeleccionar, onAgregar }) {
      return (
        <section className="panel">
          <div className="maestro-cabecera">
            <h2>Clientes</h2>
            <button className="btn btn-primario" type="button" onClick={onAgregar}><IconoMas /> Agregar</button>
          </div>

          <label className="buscador">
            <IconoLupa />
            <input
              type="search"
              placeholder="Buscar por cualquier campo..."
              value={busqueda}
              onChange={(e) => onBuscar(e.target.value)}
              aria-label="Buscar clientes"
            />
          </label>

          <ul className="lista">
            {error && <li className="vacio error">{error}</li>}
            {!error && !cargando && clientes.length === 0 && (
              <li className="vacio">{busqueda ? "Ningún cliente coincide con la búsqueda" : "No hay clientes"}</li>
            )}
            {clientes.map((c) => (
              <li key={c.id}>
                <button
                  type="button"
                  className={`item ${c.id === seleccionado ? "activo" : ""}`}
                  onClick={() => onSeleccionar(c.id)}
                >
                  <Avatar cliente={c} />
                  <div className="item-texto">
                    <div className="item-nombre">{nombreCompleto(c)}</div>
                    <div className="item-email">{c.email}</div>
                  </div>
                </button>
              </li>
            ))}
          </ul>
        </section>
      );
    }

    // ------------------------------------------------------------------
    // Formulario de cliente (alta y edición)
    // ------------------------------------------------------------------
    const CAMPOS_CLIENTE = [
      { nombre: "nombre", etiqueta: "Nombre", requerido: true },
      { nombre: "apellido", etiqueta: "Apellido", requerido: true },
      { nombre: "email", etiqueta: "Email", requerido: true, tipo: "email" },
      { nombre: "telefono", etiqueta: "Teléfono", tipo: "tel" },
      { nombre: "domicilio", etiqueta: "Domicilio" },
      { nombre: "localidad", etiqueta: "Localidad" },
    ];

    function FormularioCliente({ cliente, onGuardar, onCancelar }) {
      const [datos, setDatos] = useState(() =>
        Object.fromEntries(CAMPOS_CLIENTE.map((c) => [c.nombre, cliente?.[c.nombre] ?? ""])));
      const [error, setError] = useState(null);
      const [guardando, setGuardando] = useState(false);

      async function enviar(e) {
        e.preventDefault();
        setGuardando(true);
        setError(null);
        try {
          await onGuardar(datos);
        } catch (err) {
          setError(err.message);
          setGuardando(false);
        }
      }

      return (
        <form className="panel detalle formulario" onSubmit={enviar}>
          <h2>{cliente ? `Editar ${nombreCompleto(cliente)}` : "Nuevo cliente"}</h2>
          <div className="form-grilla">
            {CAMPOS_CLIENTE.map((c, i) => (
              <label key={c.nombre} className="campo">
                <span>{c.etiqueta} {c.requerido && <span className="requerido">*</span>}</span>
                <input
                  className="input"
                  type={c.tipo ?? "text"}
                  required={c.requerido}
                  autoFocus={i === 0}
                  value={datos[c.nombre]}
                  onChange={(e) => setDatos({ ...datos, [c.nombre]: e.target.value })}
                />
              </label>
            ))}
          </div>
          {error && <div className="aviso">{error}</div>}
          <div className="form-botones">
            <button className="btn btn-primario" type="submit" disabled={guardando}><IconoGuardar /> Guardar</button>
            <button className="btn" type="button" onClick={onCancelar}><IconoCerrar /> Cancelar</button>
          </div>
        </form>
      );
    }

    // ------------------------------------------------------------------
    // Subformulario de actividad (alta o edición de un compromiso)
    // ------------------------------------------------------------------
    function SubformActividad({ clienteId, actividad, onGuardada, onCancelar }) {
      const [descripcion, setDescripcion] = useState(actividad?.descripcion ?? "");
      const [fecha, setFecha] = useState(actividad?.fechaCompromiso?.slice(0, 10) ?? "");
      const [error, setError] = useState(null);
      const [guardando, setGuardando] = useState(false);

      async function enviar(e) {
        e.preventDefault();
        setGuardando(true);
        setError(null);
        try {
          const body = { descripcion, fechaCompromiso: fecha || null };
          if (actividad) await api(`/actividades/${actividad.id}`, { method: "PUT", body });
          else await api(`/clientes/${clienteId}/actividades`, { method: "POST", body });
          setDescripcion("");
          setFecha("");
          onGuardada();
        } catch (err) {
          setError(err.message);
        } finally {
          setGuardando(false);
        }
      }

      function cancelar() {
        setDescripcion("");
        setFecha("");
        setError(null);
        onCancelar();
      }

      return (
        <form className="subform" onSubmit={enviar}>
          <h3>{actividad ? "Editar actividad" : "Agregar actividad"}</h3>
          <div className="subform-fila">
            <input
              className="input descripcion"
              placeholder="Descripción de la actividad"
              aria-label="Descripción de la actividad"
              value={descripcion}
              onChange={(e) => setDescripcion(e.target.value)}
              autoFocus={!!actividad}
            />
            <input
              className="input fecha"
              type="date"
              aria-label="Fecha opcional"
              title="Fecha opcional"
              value={fecha}
              onChange={(e) => setFecha(e.target.value)}
            />
            <button className="btn btn-primario" type="submit" disabled={guardando || !descripcion.trim()}>
              <IconoGuardar /> Guardar
            </button>
            <button className="btn" type="button" onClick={cancelar}><IconoCerrar /> Cancelar</button>
          </div>
          {error && <p className="error">{error}</p>}
        </form>
      );
    }

    // ------------------------------------------------------------------
    // Listas de actividades
    // ------------------------------------------------------------------
    function Compromisos({ actividades, editandoId, ocupado, onCompletar, onEditar, onEliminar }) {
      const hoyIso = hoy();
      return (
        <div className={`grupo ${actividades.length === 0 ? "grupo-vacio" : ""}`}>
          <h3>Compromisos</h3>
          {actividades.length === 0 ? (
            <p className="lista-vacia">No hay compromisos pendientes.</p>
          ) : (
            <ul className="actividades">
              {actividades.map((a) => {
                const vencida = a.fechaCompromiso !== null && a.fechaCompromiso < hoyIso;
                return (
                  <li key={a.id} className={`actividad ${a.id === editandoId ? "editando" : ""}`}>
                    <button
                      type="button"
                      className="check"
                      title="Marcar como completada"
                      aria-label={`Completar "${a.descripcion}"`}
                      disabled={ocupado}
                      onClick={() => onCompletar(a)}
                    />
                    <div className="actividad-texto">
                      <div>{a.descripcion}</div>
                      <div className={`actividad-fecha ${vencida ? "vencida" : ""}`}>
                        {a.fechaCompromiso === null ? "Sin fecha" : formatearFecha(a.fechaCompromiso)}
                        {vencida && <span className="badge">Vencido</span>}
                      </div>
                    </div>
                    <div className="botonera">
                      <button type="button" className="btn btn-icono" title="Editar" aria-label="Editar actividad"
                        disabled={ocupado} onClick={() => onEditar(a)}>
                        <IconoLapiz size={16} />
                      </button>
                      <button type="button" className="btn btn-icono peligro" title="Eliminar" aria-label="Eliminar actividad"
                        disabled={ocupado} onClick={() => onEliminar(a)}>
                        <IconoTacho size={16} />
                      </button>
                    </div>
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      );
    }

    function Completadas({ actividades }) {
      return (
        <div className={`grupo ${actividades.length === 0 ? "grupo-vacio" : ""}`}>
          <h3>Actividades completadas</h3>
          {actividades.length === 0 ? (
            <p className="lista-vacia">Todavía no hay actividades completadas.</p>
          ) : (
            <ul className="actividades completadas">
              {actividades.map((a) => (
                <li key={a.id} className="actividad">
                  <span className="check hecho" aria-label="Completada"><IconoTilde /></span>
                  <div className="actividad-texto">
                    <div>{a.descripcion}</div>
                    <div className="actividad-fecha">Completada el {formatearFinalizacion(a.fechaFinalizacion)}</div>
                  </div>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    // ------------------------------------------------------------------
    // Detalle: ficha del cliente, subformulario y actividades
    // ------------------------------------------------------------------
    function Dato({ icono, children, falta }) {
      return (
        <div className="dato">
          {icono}
          <div>{children || <span className="falta">{falta}</span>}</div>
        </div>
      );
    }

    function FichaCliente({ cliente, onEditar, onEliminar, onCambio }) {
      const [editando, setEditando] = useState(null); // actividad pendiente en edición
      const [ocupado, setOcupado] = useState(false);
      const [aviso, setAviso] = useState(null);

      const ubicacion = [cliente.domicilio, cliente.localidad].filter(Boolean);
      const compromisos = ordenarCompromisos(cliente.actividades.filter((a) => a.fechaFinalizacion === null));
      const completadas = cliente.actividades
        .filter((a) => a.fechaFinalizacion !== null)
        .sort((a, b) => b.fechaFinalizacion.localeCompare(a.fechaFinalizacion));

      /** Ejecuta una acción sobre una actividad y recarga el cliente. */
      async function accion(actividad, peticion) {
        setOcupado(true);
        setAviso(null);
        try {
          await peticion();
          if (editando?.id === actividad.id) setEditando(null);
          await onCambio();
        } catch (err) {
          setAviso(err.message);
        } finally {
          setOcupado(false);
        }
      }

      const completar = (a) => accion(a, () => api(`/actividades/${a.id}/completar`, { method: "PATCH" }));
      const eliminar = (a) => {
        if (!confirm(`¿Eliminar la actividad "${a.descripcion}"?`)) return;
        accion(a, () => api(`/actividades/${a.id}`, { method: "DELETE" }));
      };

      return (
        <section className="panel detalle">
          <div className="detalle-cabecera">
            <h2>{nombreCompleto(cliente)}</h2>
            <div className="detalle-acciones">
              <span className="detalle-id">#{cliente.id}</span>
              <div className="botonera">
                <button className="btn" type="button" onClick={onEditar}><IconoLapiz /> Editar</button>
                <button className="btn btn-peligro" type="button" onClick={onEliminar}><IconoTacho /> Eliminar</button>
              </div>
            </div>
          </div>

          <div className="ficha">
            <div className="ficha-columna">
              <Dato icono={<IconoSobre />}>{cliente.email}</Dato>
              <Dato icono={<IconoTelefono />} falta="Sin teléfono">{cliente.telefono}</Dato>
            </div>
            <div className="ficha-columna">
              <Dato icono={<IconoUbicacion />} falta="Sin domicilio">
                {ubicacion.length > 0 && ubicacion.map((linea) => <div key={linea}>{linea}</div>)}
              </Dato>
            </div>
          </div>

          <SubformActividad
            key={editando?.id ?? "nueva"}
            clienteId={cliente.id}
            actividad={editando}
            onGuardada={() => { setEditando(null); onCambio(); }}
            onCancelar={() => setEditando(null)}
          />

          {aviso && (
            <div className="aviso">
              {aviso}
              <button type="button" aria-label="Cerrar aviso" onClick={() => setAviso(null)}><IconoCerrar /></button>
            </div>
          )}

          <div className="grupos">
            <Compromisos
              actividades={compromisos}
              editandoId={editando?.id}
              ocupado={ocupado}
              onCompletar={completar}
              onEditar={setEditando}
              onEliminar={eliminar}
            />
            <Completadas actividades={completadas} />
          </div>
        </section>
      );
    }

    // ------------------------------------------------------------------
    // App
    // ------------------------------------------------------------------
    function App() {
      const [busqueda, setBusqueda] = useState("");
      const filtro = useDemorado(busqueda, 200);
      const [lista, setLista] = useState({ clientes: [], cargando: true, error: null });
      const [seleccionado, setSeleccionado] = useState(null);
      const [detalle, setDetalle] = useState({ cliente: null, cargando: false, error: null });
      const [modo, setModo] = useState("ver"); // "ver" | "editar" | "nuevo"
      const [version, setVersion] = useState(0); // se incrementa para recargar lista y detalle

      const recargar = () => setVersion((v) => v + 1);

      // Lista: se vuelve a pedir cuando cambia el filtro o hay cambios. Se ignoran respuestas viejas.
      useEffect(() => {
        let vigente = true;
        setLista((l) => ({ ...l, cargando: true }));
        api(`/clientes?q=${encodeURIComponent(filtro.trim())}`)
          .then((clientes) => {
            if (!vigente) return;
            setLista({ clientes, cargando: false, error: null });
            // Sin cliente seleccionado (inicio o tras eliminar), se toma el primero.
            setSeleccionado((actual) => actual ?? clientes[0]?.id ?? null);
          })
          .catch((e) => vigente && setLista({ clientes: [], cargando: false, error: e.message }));
        return () => { vigente = false; };
      }, [filtro, version]);

      // Detalle: ficha completa (con actividades) del cliente seleccionado.
      useEffect(() => {
        if (seleccionado === null) {
          setDetalle({ cliente: null, cargando: false, error: null });
          return;
        }
        let vigente = true;
        setDetalle((d) => ({ cliente: d.cliente?.id === seleccionado ? d.cliente : null, cargando: true, error: null }));
        api(`/clientes/${seleccionado}`)
          .then((cliente) => vigente && setDetalle({ cliente, cargando: false, error: null }))
          .catch((e) => vigente && setDetalle({ cliente: null, cargando: false, error: e.message }));
        return () => { vigente = false; };
      }, [seleccionado, version]);

      function seleccionar(id) {
        setSeleccionado(id);
        setModo("ver");
      }

      async function guardarCliente(datos) {
        if (modo === "nuevo") {
          const creado = await api("/clientes", { method: "POST", body: datos });
          setSeleccionado(creado.id);
        } else {
          await api(`/clientes/${seleccionado}`, { method: "PUT", body: datos });
        }
        setModo("ver");
        recargar();
      }

      async function eliminarCliente() {
        const c = detalle.cliente;
        if (!confirm(`¿Eliminar a ${nombreCompleto(c)} y todas sus actividades?`)) return;
        try {
          await api(`/clientes/${c.id}`, { method: "DELETE" });
          setSeleccionado(null);
          recargar();
        } catch (err) {
          alert(err.message);
        }
      }

      let panelDetalle;
      if (modo === "nuevo") {
        panelDetalle = <FormularioCliente key="nuevo" onGuardar={guardarCliente} onCancelar={() => setModo("ver")} />;
      } else if (detalle.error) {
        panelDetalle = <section className="panel centrado error">{detalle.error}</section>;
      } else if (!detalle.cliente) {
        panelDetalle = (
          <section className="panel centrado">{detalle.cargando ? "Cargando…" : "Seleccioná un cliente de la lista"}</section>
        );
      } else if (modo === "editar") {
        panelDetalle = (
          <FormularioCliente key={detalle.cliente.id} cliente={detalle.cliente}
            onGuardar={guardarCliente} onCancelar={() => setModo("ver")} />
        );
      } else {
        panelDetalle = (
          <FichaCliente
            key={detalle.cliente.id}
            cliente={detalle.cliente}
            onEditar={() => setModo("editar")}
            onEliminar={eliminarCliente}
            onCambio={recargar}
          />
        );
      }

      return (
        <div className="app">
          <header className="header"><h1>MiniCRM</h1></header>
          <main className="contenido">
            <Maestro
              {...lista}
              busqueda={busqueda}
              onBuscar={setBusqueda}
              seleccionado={seleccionado}
              onSeleccionar={seleccionar}
              onAgregar={() => setModo("nuevo")}
            />
            {panelDetalle}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
