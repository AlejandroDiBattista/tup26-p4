<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniCRM</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; color: #222; background: #f6f7f9; overflow: hidden; }
    .app { height: 100%; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;

    function App() {
      const [estado, setEstado] = useState("verificando API…");

      useEffect(() => {
        fetch("/api/health")
          .then((r) => r.json())
          .then((d) => setEstado(d.ok ? "API conectada" : "API con error"))
          .catch(() => setEstado("API no disponible"));
      }, []);

      return (
        <div className="app">
          <div>
            <h1>MiniCRM</h1>
            <p>{estado}</p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
