<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'

    const estado= reactive({
      alumnos: [],
      busqueda: "",
      idEditando: null
    })
    async function cargarAlumnos(){
      const guardado= localStorage.getItem("alumnos")
      if(guardado){
        estado.alumnos= JSON.parse(guardado)
      }else {
        const respuesta= await fetch("./alumnos.json")
        estado.alumnos= await respuesta.json()
        localStorage.setItem("alumnos", JSON.stringify(estado.alumnos))
      }
    }
    cargarAlumnos()
    function guardar(){
      localStorage.setItem("alumnos", JSON.stringify(estado.alumnos))
    }
    function favoritos(id){
      const alumno= estado.alumnos.find(a=> a.id === id)
      alumno.favorito= !alumno.favorito
      guardar()
    }
    function agregarAlumno(){
      const nuevo={
        id: Date.now(),
        apellido: document.getElementById("napellido").value,
        nombre: document.getElementById("nnombre").value,
        legajo: document.getElementById("nlegajo").value,
        comision: document.getElementById("ncomision").value,
        celular: document.getElementById("ncelular").value,
        github: document.getElementById("ngithub").value,
        favorito: false
      }
      estado.alumnos.push(nuevo)
      guardar()
    }
    function alumnosEncontrados(){
      const texto= estado.busqueda.toLowerCase()
      const lista= estado.alumnos.filter(a=> {
        const datos= (a.apellido + " " + a.nombre+ " " + a.legajo + " " + a.github).toLocaleLowerCase()
        return datos.includes(texto)
      })
      lista.sort((a,b)=> {
        if (a.favorito !== b.favorito){
          return a.favorito ? -1: 1
        }
        const porApellido= a.apellido.localeCompare(b.apellido, "es", {sensitivity:"base"})
        if (porApellido !==0){
          return porApellido
        }
        return a.nombre.localeCompare(b.nombre, "es", {sensitivity:"base"})
      })
      return lista
    }
    function abrirEdicion(id){
      const alumno= estado.alumnos.find(a => a.id === id)
      estado.idEditando= id
      document.getElementById("eapellido").value= alumno.apellido
      document.getElementById("enombre").value= alumno.nombre
      document.getElementById("elegajo").value= alumno.legajo
      document.getElementById("ecomision").value= alumno.comision
      document.getElementById("etelefono").value= alumno.celular
      document.getElementById("egithub").value= alumno.github
      document.getElementById("editar").showModal()
    }
    function guardarEdicion(){
      const alumno= estado.alumnos.find(a => a.id === estado.idEditando)
      alumno.apellido= document.getElementById("eapellido").value
      alumno.nombre= document.getElementById("enombre").value
      alumno.legajo= document.getElementById("elegajo").value
      alumno.comision= document.getElementById("ecomision").value
      alumno.celular= document.getElementById("etelefono").value
      alumno.github= document.getElementById("egithub").value
    }
    function eliminarAlumno(){
      estado.alumnos= estado.alumnos.filter(a => a.id !== estado.idEditando)
      guardar()
      document.getElementById("editar").close()
      guardar()
    }

    const app= document.getElementById("app")
    html`
    <h1>Alumnos</h1>
    <input type="search" placeholder="buscar alumno" @input="${(e) =>estado.busqueda= e.target.value}">
    <button @click="${() => document.getElementById("agregar").showModal()}">agregar</button>
      <ul>
        ${() => alumnosEncontrados().map(a => html`
        <li tabindex="0"
        @click="${() => abrirEdicion(a.id)}"
        @keydown="${(e) =>{
          if (e.key=== 'Enter') abrirEdicion(a.id)
          if (e.key === ' ' ) {e.preventDefault(); favoritos(a.id)}
        }}"> 
          <article>
            <header>
              <h2>${a.apellido}, ${a.nombre}</h2>
              <button @click="${() => favoritos(a.id)}">${a.favorito ? "★" : "☆"}</button>
            </header>
            <address>
              <p>Tel: ${a.celular}</p>
              <p>Github: ${a.github}</p>
            </address>
            <footer>
              <p>comision ${a.comision} - legajo ${a.legajo}</p>
            </footer>
          </article>
        </li>` )}
      </ul>
      ${() => alumnosEncontrados().length=== 0 ? html`<p>no hay alumnos</p>` : "" }

      <dialog id="agregar">
        <form method="dialog">
          <h2>agregar alumno</h2>
          <label> apellido <input type="text" id="napellido" required> </label>
          <label> nombre<input type="text" id="nnombre" required> </label>
          <label> legajo <input type="text" id="nlegajo" required> </label>
          <label> comision <input type="text" id="ncomision" required> </label>
          <label> celular <input type="text" id="ncelular" required> </label>
          <label> github <input type="text" id="ngithub" required> </label>
          <button type="submit" @click="${() => agregarAlumno()}">guardar</button>
          <button type="button" @click="${() => document.getElementById("agregar").close()}">cancelar</button>
          </form>
        </dialog>

        <dialog id="editar">
          <form method="dialog">
            <h2>editar alumno</h2>
            <label>apellido <input type="text" id="eapellido" required></label>
            <label>nombre <input type="text" id="enombre" required></label>
            <label>legajo <input type="text" id="elegajo" required></label>
            <label>comision <input type="text" id="ecomision" required></label>
            <label>telefono <input type="text" id="etelefono" required></label>
            <label>github <input type="text" id="egithub" required></label>
            <button type="submit" @click="${() => guardarEdicion()}">guardar</button>
            <button type="button" @click="${() => document.getElementById("editar").close()}">cancelar</button>
            <button type="button" @click="${() => eliminarAlumno()}">eliminar</button>
          </form>
        </dialog>

        `(app)
  </script>
</body>
</html>
