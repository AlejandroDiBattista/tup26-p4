<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniCRM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #f3f5f8;
      color: #192535;
      font-family: system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #88b9ff;
      outline-offset: 2px;
    }
    svg { flex-shrink: 0; vertical-align: middle; }
    h1, h2, h3, p { margin: 0; }
    header {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: #1f3047;
      color: white;
    }
    h1 { font-size: 24px; letter-spacing: -.6px; }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }
    .panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e0e5ec;
      border-radius: 12px;
      background: white;
    }
    .cabecera-maestro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 20px;
    }
    .cabecera-maestro h2 { font-size: 22px; }
    .boton {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      border: 1px solid #d7dde5;
      border-radius: 6px;
      background: white;
      color: #293647;
      font-size: 14px;
    }
    .boton-primario { background: #1d72e8; border-color: #1d72e8; color: white; }
    .boton-peligro { border-color: #efc5c2; color: #d93025; }
    .buscador {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 20px 16px;
      padding: 10px 12px;
      border: 1px solid #d7dde5;
      border-radius: 7px;
      color: #77818f;
    }
    .buscador:focus-within { border-color: #1d72e8; }
    .buscador input {
      min-width: 0;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: #192535;
      font-size: 14px;
    }
    .buscador input:focus-visible { outline: none; }
    .contenido-maestro { flex: 1; min-height: 0; overflow-y: auto; }
    .lista-clientes, .lista-actividades { margin: 0; padding: 0; list-style: none; }
    .cliente {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border: 0;
      border-bottom: 1px solid #edf0f4;
      background: white;
      color: inherit;
      text-align: left;
    }
    .cliente:hover { background: #f5f8fc; }
    .cliente.activo { background: #e8f1fb; }
    .avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
    }
    .texto-cliente { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .texto-cliente strong { font-size: 15px; overflow-wrap: anywhere; }
    .texto-cliente small { color: #6b7583; font-size: 13px; overflow-wrap: anywhere; }
    .contador { padding: 12px 20px; border-top: 1px solid #edf0f4; color: #6b7583; font-size: 12px; }
    .detalle { padding: 24px; }
    .ficha { flex-shrink: 0; padding-bottom: 24px; border-bottom: 1px solid #edf0f4; }
    .cabecera-ficha { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .cabecera-ficha h2 { font-size: 28px; line-height: 1.25; letter-spacing: -.6px; overflow-wrap: anywhere; }
    .herramientas-ficha { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .identificador { color: #7b8490; font-size: 14px; }
    .acciones-ficha { display: flex; gap: 8px; }
    .datos-cliente { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 24px; }
    .columna-datos { display: flex; flex-direction: column; gap: 12px; }
    .dato { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; overflow-wrap: anywhere; }
    .dato svg { margin-top: 2px; color: #7b8490; }
    .localidad { padding-left: 28px; color: #6b7583; font-size: 14px; overflow-wrap: anywhere; }
    .actividades { flex: 1; min-height: 0; overflow-y: auto; padding-top: 22px; }
    .actividades h3 { margin-bottom: 14px; font-size: 18px; }
    .lista-actividades { border: 1px solid #e5e9ef; border-radius: 8px; }
    .actividad { display: flex; flex-direction: column; gap: 7px; padding: 16px; overflow-wrap: anywhere; }
    .actividad + .actividad { border-top: 1px solid #edf0f4; }
    .actividad strong { font-size: 14px; }
    .actividad span { color: #6b7583; font-size: 13px; }
    .estado { padding: 24px 20px; color: #6b7583; font-size: 14px; line-height: 1.6; }
    .estado-error { color: #b3261e; }
    .detalle > .estado { margin: auto; text-align: center; }
    @media (max-width: 900px) {
      main { grid-template-columns: minmax(220px, 32%) minmax(0, 1fr); }
      .cabecera-ficha { flex-direction: column; }
      .herramientas-ficha { align-items: flex-start; }
      .datos-cliente { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    }
    @media (max-width: 600px) {
      header { padding: 0 12px; }
      main { grid-template-columns: minmax(130px, 36%) minmax(0, 1fr); gap: 8px; padding: 8px; }
      .cabecera-maestro { padding: 12px; }
      .cabecera-maestro h2 { font-size: 18px; }
      .buscador { margin: 0 10px 12px; padding: 8px; }
      .cliente { padding: 12px 10px; gap: 8px; }
      .avatar { width: 30px; height: 30px; font-size: 11px; }
      .texto-cliente strong { font-size: 13px; }
      .texto-cliente small { font-size: 11px; }
      .detalle { padding: 14px; }
      .cabecera-ficha h2 { font-size: 22px; }
      .acciones-ficha { flex-wrap: wrap; }
      .contador { padding: 10px; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <header><h1>MiniCRM</h1></header>
  <main id="aplicacion"></main>
  <script type="text/babel" data-presets="react">
    const { useEffect, useState } = React;

    async function pedirJSON(url, opciones = {}) {
      const respuesta = await fetch(url, opciones);
      if (!respuesta.ok) {
        let mensaje = `No se pudo completar la solicitud (${respuesta.status}).`;
        try {
          const datos = await respuesta.json();
          if (typeof datos.error === 'string') mensaje = datos.error;
        } catch {}
        throw new Error(mensaje);
      }

      return await respuesta.json();
    }

    function Icono({ nombre }) {
      const trazos = {
        buscar: <><circle cx="10" cy="10" r="6.5" /><path d="m15 15 5 5" /></>,
        agregar: <path d="M12 5v14M5 12h14" />,
        editar: <><path d="m15 4 5 5M4 20l4-1L20 7a2.1 2.1 0 0 0-3-3L5 16l-1 4Z" /></>,
        eliminar: <><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" /></>,
        email: <><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 6 9 7 9-7" /></>,
        telefono: <path d="m7 3 3 5-3 3a15 15 0 0 0 6 6l3-3 5 3-1 4C10 23 1 14 3 4l4-1Z" />,
        ubicacion: <><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" /><circle cx="12" cy="10" r="2" /></>,
      };

      return (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {trazos[nombre]}
        </svg>
      );
    }

    function Estado({ children, error = false }) {
      return <p className={`estado${error ? ' estado-error' : ''}`} role={error ? 'alert' : 'status'}>{children}</p>;
    }

    const colores = [
      ['#dcecff', '#285d9c'], ['#def2e7', '#286347'], ['#e8e0fa', '#66449d'],
      ['#ffedcf', '#955b1d'], ['#fbe0e9', '#9b3c5a'], ['#d9f2f0', '#287571'],
    ];

    function ListaClientes({ clientes, seleccionId, seleccionar }) {
      return (
        <ul className="lista-clientes" aria-label="Clientes encontrados">
          {clientes.map((cliente) => {
            const [fondo, color] = colores[(cliente.id - 1) % colores.length];
            const iniciales = `${cliente.nombre[0]}${cliente.apellido[0]}`.toLocaleUpperCase('es-AR');
            return (
              <li key={cliente.id}>
                <button type="button" className={`cliente${seleccionId === cliente.id ? ' activo' : ''}`} aria-pressed={seleccionId === cliente.id} onClick={() => seleccionar(cliente.id)}>
                  <span className="avatar" style={{ background: fondo, color }} aria-hidden="true">{iniciales}</span>
                  <span className="texto-cliente">
                    <strong>{cliente.nombre} {cliente.apellido}</strong>
                    <small>{cliente.email}</small>
                  </span>
                </button>
              </li>
            );
          })}
        </ul>
      );
    }

    function FichaCliente({ cliente }) {
      return (
        <section className="ficha" aria-label="Ficha del cliente">
          <div className="cabecera-ficha">
            <h2>{cliente.nombre} {cliente.apellido}</h2>
            <div className="herramientas-ficha">
              <span className="identificador">#{cliente.id}</span>
              <div className="acciones-ficha">
                <button type="button" className="boton" disabled><Icono nombre="editar" />Editar</button>
                <button type="button" className="boton boton-peligro" disabled><Icono nombre="eliminar" />Eliminar</button>
              </div>
            </div>
          </div>
          <div className="datos-cliente">
            <div className="columna-datos">
              <p className="dato"><Icono nombre="email" /><span>{cliente.email}</span></p>
              <p className="dato"><Icono nombre="telefono" /><span>{cliente.telefono || 'Sin teléfono'}</span></p>
            </div>
            <div className="columna-datos">
              <p className="dato"><Icono nombre="ubicacion" /><span>{cliente.domicilio || 'Sin domicilio'}</span></p>
              <p className="localidad">{cliente.localidad || 'Sin localidad'}</p>
            </div>
          </div>
        </section>
      );
    }

    const formatoFecha = new Intl.DateTimeFormat('es-AR', { day: 'numeric', month: 'short', year: 'numeric' });

    function formatearFecha(fecha) {
      return formatoFecha.format(new Date(`${fecha}T00:00:00`));
    }

    function Actividades({ actividades }) {
      return (
        <section className="actividades" aria-label="Actividades del cliente">
          <h3>Actividades</h3>
          {actividades.length === 0 ? <Estado>Este cliente todavía no tiene actividades.</Estado> : (
            <ul className="lista-actividades">
              {actividades.map((actividad) => (
                <li key={actividad.id} className="actividad">
                  <strong>{actividad.descripcion}</strong>
                  <span>
                    {actividad.fechaFinalizacion
                      ? `Completada el ${formatearFecha(actividad.fechaFinalizacion)}`
                      : actividad.fechaCompromiso
                        ? `Compromiso: ${formatearFecha(actividad.fechaCompromiso)}`
                        : 'Sin fecha'}
                  </span>
                </li>
              ))}
            </ul>
          )}
        </section>
      );
    }

    function App() {
      const [busqueda, setBusqueda] = useState('');
      const [clientes, setClientes] = useState([]);
      const [seleccionId, setSeleccionId] = useState(null);
      const [cliente, setCliente] = useState(null);
      const [cargandoLista, setCargandoLista] = useState(true);
      const [cargandoDetalle, setCargandoDetalle] = useState(false);
      const [errorLista, setErrorLista] = useState('');
      const [errorDetalle, setErrorDetalle] = useState('');

      useEffect(() => {
        const controlador = new AbortController();
        let vigente = true;

        async function cargarClientes() {
          setCargandoLista(true);
          setErrorLista('');
          try {
            const resultado = await pedirJSON(`/api/clientes?q=${encodeURIComponent(busqueda)}`, { signal: controlador.signal });
            if (!vigente) return;
            setClientes(resultado);
            setSeleccionId((actual) => resultado.some((item) => item.id === actual) ? actual : resultado[0]?.id ?? null);
          } catch (error) {
            if (!vigente) return;
            setClientes([]);
            setSeleccionId(null);
            setErrorLista(`No se pudo cargar el listado. ${error.message}`);
          } finally {
            if (vigente) setCargandoLista(false);
          }
        }

        cargarClientes();
        return () => {
          vigente = false;
          controlador.abort();
        };
      }, [busqueda]);

      useEffect(() => {
        setCliente(null);
        setErrorDetalle('');
        if (seleccionId === null) {
          setCargandoDetalle(false);
          return;
        }

        const controlador = new AbortController();
        let vigente = true;

        async function cargarDetalle() {
          setCargandoDetalle(true);
          try {
            const resultado = await pedirJSON(`/api/clientes/${seleccionId}`, { signal: controlador.signal });
            if (vigente) setCliente(resultado);
          } catch (error) {
            if (vigente) setErrorDetalle(`No se pudo cargar la ficha. ${error.message}`);
          } finally {
            if (vigente) setCargandoDetalle(false);
          }
        }

        cargarDetalle();
        return () => {
          vigente = false;
          controlador.abort();
        };
      }, [seleccionId]);

      return (
        <>
          <section className="panel" aria-labelledby="titulo-clientes">
            <div className="cabecera-maestro">
              <h2 id="titulo-clientes">Clientes</h2>
              <button type="button" className="boton boton-primario" disabled><Icono nombre="agregar" />Agregar</button>
            </div>
            <div className="buscador">
              <Icono nombre="buscar" />
              <input type="search" placeholder="Buscar por cualquier campo..." aria-label="Buscar clientes por cualquier campo" value={busqueda} onChange={(evento) => setBusqueda(evento.target.value)} />
            </div>
            <div className="contenido-maestro" aria-busy={cargandoLista}>
              {cargandoLista ? <Estado>Buscando clientes…</Estado>
                : errorLista ? <Estado error>{errorLista}</Estado>
                : clientes.length === 0 ? <Estado>{busqueda.trim() ? 'No se encontraron coincidencias.' : 'Todavía no hay clientes.'}</Estado>
                : <ListaClientes clientes={clientes} seleccionId={seleccionId} seleccionar={setSeleccionId} />}
            </div>
            <p className="contador" role="status">{cargandoLista ? 'Buscando…' : `${clientes.length} ${clientes.length === 1 ? 'cliente' : 'clientes'}`}</p>
          </section>
          <section className="panel detalle" aria-label="Detalle del cliente" aria-busy={cargandoDetalle}>
            {cargandoDetalle ? <Estado>Cargando ficha…</Estado>
              : errorDetalle ? <Estado error>{errorDetalle}</Estado>
              : cliente ? <><FichaCliente cliente={cliente} /><Actividades actividades={cliente.actividades} /></>
              : <Estado>Seleccioná un cliente para ver su ficha y sus actividades.</Estado>}
          </section>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('aplicacion')).render(<App />);
  </script>
</body>
</html>
