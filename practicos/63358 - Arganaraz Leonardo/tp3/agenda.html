<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de alumnos</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #fff; --text: #1d2330; --muted: #5d6677;
    --accent: #3b5bdb; --danger: #c92a2a; --star: #f08c00; --border: #d9dde5;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171f; --surface: #1d222d; --text: #e8ebf2; --muted: #9aa3b5; --accent: #748ffc; --danger: #ff8787; --border: #323a4a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; }

  /* Botones comunes */
  button { font: inherit; cursor: pointer; border-radius: .5rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: .5rem 1rem;
    &:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    &.primario { background: var(--accent); border-color: var(--accent); color: #fff; }
    &.peligro { color: var(--danger); border-color: var(--danger); }
  }

  /* Encabezado */
  body > header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; padding: 1rem 1.5rem;
    background: var(--surface); border-bottom: 1px solid var(--border);
    & h1 { font-size: 1.4rem; margin: 0; flex: 1 1 10rem; }
    & input[type="search"] { flex: 2 1 14rem; font: inherit; padding: .5rem .75rem; border-radius: .5rem;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  }

  /* Listado */
  main { flex: 1; padding: 1.5rem; width: 100%; max-width: 72rem; margin: 0 auto;
    & > section { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 1rem; }
    & .vacio { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 2rem; }
  }

  /* Tarjeta de alumno */
  article { position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: .75rem; padding: 1rem; cursor: pointer;
    &:hover { border-color: var(--accent); }
    &:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    &.favorito { border-left: 5px solid var(--star); }
    & h2 { font-size: 1.1rem; margin: 0 2.5rem .5rem 0; }
    & address { font-style: normal; color: var(--muted); display: grid; gap: .15rem; font-size: .92rem;
      & strong { color: var(--text); font-weight: 600; }
    }
    & .fav { position: absolute; top: .6rem; right: .6rem; padding: .1rem .5rem; font-size: 1.3rem;
      line-height: 1.2; border: 0; background: transparent; color: var(--star); }
  }

  /* Pie */
  body > footer { text-align: center; padding: 1rem; color: var(--muted); font-size: .9rem; }

  /* Diálogo */
  dialog { border: 1px solid var(--border); border-radius: .75rem; background: var(--surface); color: var(--text);
    padding: 1.5rem; width: min(26rem, calc(100vw - 2rem));
    &::backdrop { background: rgb(0 0 0 / .5); }
    & h2 { margin-top: 0; }
    & form { display: grid; gap: .75rem;
      & label { display: grid; gap: .2rem; font-size: .9rem; color: var(--muted); }
      & input { font: inherit; padding: .5rem; border-radius: .4rem; border: 1px solid var(--border);
        background: var(--bg); color: var(--text); }
      & .error { color: var(--danger); margin: 0; font-size: .9rem; }
      & .acciones { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: flex-end; margin-top: .5rem;
        & .peligro { margin-right: auto; }
      }
    }
  }
</style>
</head>
<body>
<script type="module">
import { reactive, html } from 'https://esm.sh/@arrow-js/core';

/* ===================== ESTADO ===================== */
const CLAVE = 'agenda-alumnos';

const estado = reactive({
  alumnos: [],
  busqueda: '',
  dialogo: { id: null, error: '' }   // id === null => alta; otro valor => edición
});

/* ===================== ACTUALIZACIONES ===================== */
const normalizar = (t) => String(t ?? '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
const comparar = (a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' });

const persistir = () => localStorage.setItem(CLAVE, JSON.stringify(estado.alumnos));

async function cargarDatos() {
  try {
    const guardado = localStorage.getItem(CLAVE);
    if (guardado) { estado.alumnos = JSON.parse(guardado); return; }
  } catch { /* datos corruptos: se recarga desde el JSON */ }
  try {
    const modulo = await import('./alumnos.json', { with: { type: 'json' } });
    estado.alumnos = modulo.default.map((a) => ({ favorito: false, ...a }));
    persistir();
  } catch (e) {
    console.error('No se pudo cargar alumnos.json (¿se sirve por HTTP?)', e);
  }
}

function alumnosVisibles() {
  const q = normalizar(estado.busqueda.trim());
  return estado.alumnos
    .filter((a) => !q || normalizar(
        [a.apellido, a.nombre, a.legajo, a.comision, a.telefono, a.github].join(' ')).includes(q))
    .sort((a, b) => (b.favorito - a.favorito) || comparar(a.apellido, b.apellido) || comparar(a.nombre, b.nombre));
}

function alternarFavorito(alumno) {
  alumno.favorito = !alumno.favorito;
  persistir();
}

function validar(d) {
  if (!d.apellido || !d.nombre || !d.legajo || !d.comision || !d.telefono || !d.github)
    return 'Completá todos los campos.';
  if (!/^[\d\s+()-]{6,}$/.test(d.telefono)) return 'El teléfono no es válido.';
  if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(d.github)) return 'El usuario de GitHub no es válido.';
  return '';
}

function guardarAlumno(datos) {
  const error = validar(datos);
  estado.dialogo.error = error;
  if (error) return false;
  if (estado.dialogo.id === null) {
    estado.alumnos.push({ id: `${Date.now()}${Math.floor(Math.random() * 1000)}`, favorito: false, ...datos });
  } else {
    const a = estado.alumnos.find((x) => x.id === estado.dialogo.id);
    if (a) Object.assign(a, datos);
  }
  persistir();
  return true;
}

function eliminarAlumno(id) {
  estado.alumnos = estado.alumnos.filter((a) => a.id !== id);
  persistir();
}

/* ===================== INTERFAZ ===================== */
const CAMPOS = ['apellido', 'nombre', 'legajo', 'comision', 'telefono', 'github'];
const $ = (sel) => document.querySelector(sel);

function abrirDialogo(alumno) {
  const form = $('dialog form');
  estado.dialogo.id = alumno ? alumno.id : null;
  estado.dialogo.error = '';
  CAMPOS.forEach((c) => { form.elements[c].value = alumno ? alumno[c] : ''; });
  $('dialog').showModal();
  form.elements.apellido.focus();
}

function enviarFormulario(e) {
  e.preventDefault();
  const form = e.target;
  const datos = Object.fromEntries(CAMPOS.map((c) => [c, form.elements[c].value.trim()]));
  if (guardarAlumno(datos)) $('dialog').close();
}

function confirmarEliminar() {
  const a = estado.alumnos.find((x) => x.id === estado.dialogo.id);
  if (a && confirm(`¿Eliminar a ${a.apellido}, ${a.nombre}?`)) {
    eliminarAlumno(a.id);
    $('dialog').close();
  }
}

function teclaTarjeta(e, alumno) {
  if (e.target !== e.currentTarget) return;        // ignora teclas del botón interno
  if (e.key === 'Enter') { e.preventDefault(); abrirDialogo(alumno); }
  else if (e.key === ' ') { e.preventDefault(); alternarFavorito(alumno); }
}

const tarjeta = (a) => html`
  <article tabindex="0" class="${() => (a.favorito ? 'favorito' : '')}"
    @click="${() => abrirDialogo(a)}" @keydown="${(e) => teclaTarjeta(e, a)}">
    <h2>${() => `${a.apellido}, ${a.nombre}`}</h2>
    <button type="button" class="fav" aria-label="Marcar o desmarcar favorito"
      aria-pressed="${() => String(a.favorito)}"
      @click="${(e) => { e.stopPropagation(); alternarFavorito(a); }}">${() => (a.favorito ? '★' : '☆')}</button>
    <address>
      <span><strong>Legajo:</strong> ${() => a.legajo}</span>
      <span><strong>Comisión:</strong> ${() => a.comision}</span>
      <span><strong>Teléfono:</strong> ${() => a.telefono}</span>
      <span><strong>GitHub:</strong> @${() => a.github}</span>
    </address>
  </article>`.key(a.id);

const campo = (nombre, etiqueta) =>
  html`<label>${etiqueta}<input name="${nombre}" required autocomplete="off"></label>`;

const app = html`
  <header>
    <h1>Agenda de alumnos</h1>
    <input type="search" placeholder="Buscar alumno…" aria-label="Buscar alumno"
      @input="${(e) => { estado.busqueda = e.target.value; }}">
    <button type="button" class="primario" @click="${() => abrirDialogo(null)}">Agregar</button>
  </header>

  <main>
    <section aria-live="polite">
      ${() => {
        const lista = alumnosVisibles();
        return lista.length
          ? lista.map(tarjeta)
          : html`<p class="vacio">No hay alumnos para mostrar.</p>`;
      }}
    </section>
  </main>

  <footer>${() => `${alumnosVisibles().length} de ${estado.alumnos.length} alumnos`}</footer>

  <dialog aria-labelledby="titulo-dialogo">
    <form method="dialog" novalidate @submit="${enviarFormulario}">
      <h2 id="titulo-dialogo">${() => (estado.dialogo.id === null ? 'Agregar alumno' : 'Editar alumno')}</h2>
      ${campo('apellido', 'Apellido')}
      ${campo('nombre', 'Nombre')}
      ${campo('legajo', 'Legajo')}
      ${campo('comision', 'Comisión')}
      ${campo('telefono', 'Teléfono')}
      ${campo('github', 'Usuario de GitHub')}
      <p class="error" role="alert">${() => estado.dialogo.error}</p>
      <div class="acciones">
        ${() => (estado.dialogo.id === null ? '' :
          html`<button type="button" class="peligro" @click="${confirmarEliminar}">Eliminar</button>`)}
        <button type="button" @click="${() => $('dialog').close()}">Cancelar</button>
        <button type="submit" class="primario">Guardar</button>
      </div>
    </form>
  </dialog>`;

app(document.body);
cargarDatos();
</script>
</body>
</html>
