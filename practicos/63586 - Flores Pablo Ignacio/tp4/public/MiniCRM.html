<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniCRM</title>
<style>
  :root {
    --fondo: #f3f5f9; --panel: #fff; --borde: #dfe3ec; --texto: #1b2236; --suave: #6b7488;
    --primario: #1f6feb; --primario-oscuro: #1858bc; --peligro: #d1344a; --ok: #2e9e6a;
    --cabecera: #2c4268; --seleccion: #e6f0ff; --radio: 8px;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--fondo); color: var(--texto); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }

  .app { height: 100%; display: flex; flex-direction: column; }
  .cabecera { background: var(--cabecera); color: #fff; padding: 10px 24px; font-size: 22px; font-weight: 700; flex: none; }
  .cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 12px; padding: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; min-height: 0; display: flex; flex-direction: column; }

  /* maestro */
  .maestro-cab { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .maestro-cab .fila { display: flex; align-items: center; justify-content: space-between; }
  h2 { margin: 0; font-size: 22px; }
  h3 { margin: 0; font-size: 17px; }
  .busqueda { position: relative; }
  .busqueda svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--suave); }
  .busqueda input { width: 100%; padding: 9px 10px 9px 34px; border: 1px solid var(--borde); border-radius: var(--radio); }
  .lista { flex: 1; min-height: 0; overflow-y: auto; }
  .item { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px 14px; border: 0; border-top: 1px solid var(--borde); background: none; text-align: left; cursor: pointer; }
  .item:hover { background: #f6f8fc; }
  .item.activo { background: var(--seleccion); }
  .item .datos { min-width: 0; }
  .item .nombre { font-weight: 600; }
  .item .sub { color: var(--suave); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .vacio { padding: 20px 14px; color: var(--suave); }

  /* detalle */
  .detalle { padding: 18px 22px; gap: 12px; overflow: hidden; position: relative; }
  .detalle-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex: none; }
  .detalle-cab h2 { font-size: 28px; }
  .id { position: absolute; top: 10px; right: 16px; color: var(--suave); font-size: 14px; }
  .acciones { display: flex; gap: 8px; margin-top: 14px; }
  .ficha { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; padding-bottom: 12px; border-bottom: 1px solid var(--borde); flex: none; }
  .dato { display: flex; gap: 10px; align-items: flex-start; color: var(--texto); min-width: 0; overflow-wrap: anywhere; }
  .dato svg { color: var(--suave); flex: none; margin-top: 2px; }
  .dato.tenue { color: var(--suave); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--borde); border-radius: var(--radio); background: #fff; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f3f5f9; }
  .btn.primario { background: var(--primario); border-color: var(--primario); color: #fff; }
  .btn.primario:hover { background: var(--primario-oscuro); }
  .btn.peligro { color: var(--peligro); border-color: #f0c0c8; }
  .btn.peligro:hover { background: #fdf0f2; }
  .btn.icono { padding: 6px; }
  .btn:focus-visible, input:focus-visible, .item:focus-visible { outline: 2px solid var(--primario); outline-offset: 1px; }

  /* formularios */
  .form { display: flex; flex-direction: column; gap: 10px; flex: none; }
  .form .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-botones { display: flex; gap: 8px; }
  .campo { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--suave); }
  .campo input, .sub-form input { padding: 8px 10px; border: 1px solid var(--borde); border-radius: var(--radio); color: var(--texto); background: #fff; font-size: 15px; }
  .sub-form { display: flex; gap: 8px; align-items: center; padding: 10px; border: 2px dashed #c4ccdc; border-radius: 12px; flex: none; }
  .sub-form input[type=text] { flex: 1; min-width: 0; }
  .sub-form input[type=date] { width: 160px; }
  .error { background: #fdf0f2; color: var(--peligro); border: 1px solid #f0c0c8; border-radius: var(--radio); padding: 8px 12px; flex: none; }

  /* actividades */
  .grupo { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; }
  .grupo h3 { padding: 2px 0 6px; flex: none; }
  .grupo .cuerpo-grupo { overflow-y: auto; min-height: 0; border: 1px solid var(--borde); border-radius: var(--radio); }
  .grupo.completadas .cuerpo-grupo { background: #f3faf6; }
  .actividad { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--borde); }
  .actividad:first-child { border-top: 0; }
  .actividad input[type=checkbox] { width: 18px; height: 18px; flex: none; cursor: pointer; accent-color: var(--ok); }
  .actividad .texto { flex: 1; min-width: 0; }
  .actividad .fecha { color: var(--suave); font-size: 13px; }
  .actividad .fecha.vencida { color: var(--peligro); }
  .vacio-chico { padding: 6px 12px; color: var(--suave); font-size: 13px; }
  .centro { flex: 1; display: grid; place-items: center; color: var(--suave); }

  @media (max-width: 760px) {
    .cuerpo { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
    .ficha { grid-template-columns: 1fr; }
    .sub-form { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script>
  // Babel con JSX en modo "classic": usa React.createElement desde el React global.
  Babel.registerPreset('react-clasico', { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] })
</script>
<script type="text/babel" data-presets="react-clasico">
const { useState, useEffect, useRef, useCallback } = React

/* ---------- API REST ---------- */
async function api(ruta, opciones = {}) {
  const respuesta = await fetch('/api/clientes' + ruta, {
    ...opciones,
    headers: opciones.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opciones.body ? JSON.stringify(opciones.body) : undefined,
  })
  if (respuesta.status === 204) return null
  const datos = await respuesta.json().catch(() => ({}))
  if (!respuesta.ok) throw new Error(datos.error || 'Error de comunicación con el servidor')
  return datos
}
const clientesApi = {
  buscar: (q) => api('?q=' + encodeURIComponent(q)),
  obtener: (id) => api(`/${id}`),
  crear: (datos) => api('', { method: 'POST', body: datos }),
  actualizar: (id, datos) => api(`/${id}`, { method: 'PUT', body: datos }),
  eliminar: (id) => api(`/${id}`, { method: 'DELETE' }),
  crearActividad: (id, datos) => api(`/${id}/actividades`, { method: 'POST', body: datos }),
  actualizarActividad: (id, aid, datos) => api(`/${id}/actividades/${aid}`, { method: 'PUT', body: datos }),
  completarActividad: (id, aid) => api(`/${id}/actividades/${aid}/completar`, { method: 'POST' }),
  eliminarActividad: (id, aid) => api(`/${id}/actividades/${aid}`, { method: 'DELETE' }),
}

/* ---------- Utilidades ---------- */
const hoy = () => new Date().toLocaleDateString('en-CA')
const formatearFecha = (iso) => {
  const [a, m, d] = iso.split('-').map(Number)
  return new Date(a, m - 1, d).toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '')
}
const iniciales = (c) => (c.nombre[0] + c.apellido[0]).toUpperCase()
const colores = [['#dbe8ff', '#1f5fd0'], ['#d9f5e6', '#1f8a55'], ['#e8e0ff', '#5b3fc4'], ['#ffe9d2', '#c4661a'], ['#ffdbe5', '#c4284f'], ['#d4f3f0', '#1a8a82']]
const colorDe = (id) => colores[id % colores.length]

// Primero sin fecha, luego vencidos y por último actuales o futuros; cada grupo con fecha va ascendente.
function ordenarCompromisos(lista) {
  const h = hoy()
  const rango = (a) => (!a.fechaCompromiso ? 0 : a.fechaCompromiso < h ? 1 : 2)
  return [...lista].sort((a, b) => rango(a) - rango(b) || (a.fechaCompromiso || '').localeCompare(b.fechaCompromiso || '') || a.id - b.id)
}

/* ---------- Componentes base ---------- */
const trazos = {
  buscar: <><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></>,
  mas: <path d="M12 5v14M5 12h14" />,
  editar: <><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></>,
  borrar: <><path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M19 6l-1 14H6L5 6" /><path d="M10 11v6M14 11v6" /></>,
  correo: <><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></>,
  telefono: <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" />,
  lugar: <><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z" /><circle cx="12" cy="10" r="2.5" /></>,
  guardar: <><path d="M5 3h11l3 3v15H5Z" /><path d="M8 3v6h8V3M8 21v-7h8v7" /></>,
  cancelar: <path d="M6 6l12 12M18 6 6 18" />,
}
function Icono({ nombre, tam = 18 }) {
  return (
    <svg width={tam} height={tam} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {trazos[nombre]}
    </svg>
  )
}

function Boton({ icono, children, tipo = '', etiqueta, ...props }) {
  return (
    <button type="button" className={`btn ${tipo} ${children ? '' : 'icono'}`} aria-label={etiqueta} title={etiqueta} {...props}>
      {icono && <Icono nombre={icono} />}
      {children}
    </button>
  )
}

function Campo({ etiqueta, ...props }) {
  return (
    <label className="campo">
      {etiqueta}
      <input {...props} />
    </label>
  )
}

function Avatar({ cliente }) {
  const [fondo, color] = colorDe(cliente.id)
  return <div className="avatar" style={{ background: fondo, color }}>{iniciales(cliente)}</div>
}

/* ---------- Maestro ---------- */
function Maestro({ clientes, seleccionado, busqueda, alBuscar, alElegir, alAgregar }) {
  return (
    <section className="panel" aria-label="Clientes">
      <div className="maestro-cab">
        <div className="fila">
          <h2>Clientes</h2>
          <Boton icono="mas" tipo="primario" onClick={alAgregar}>Agregar</Boton>
        </div>
        <div className="busqueda">
          <Icono nombre="buscar" />
          <input type="search" value={busqueda} onChange={(e) => alBuscar(e.target.value)} placeholder="Buscar por cualquier campo..." aria-label="Buscar clientes por cualquier campo" />
        </div>
      </div>
      <div className="lista">
        {clientes.length === 0 && <div className="vacio">No hay clientes que coincidan.</div>}
        {clientes.map((c) => (
          <button key={c.id} className={`item ${c.id === seleccionado ? 'activo' : ''}`} onClick={() => alElegir(c.id)}>
            <Avatar cliente={c} />
            <div className="datos">
              <div className="nombre">{c.nombre} {c.apellido}</div>
              <div className="sub">{c.email}</div>
            </div>
          </button>
        ))}
      </div>
    </section>
  )
}

/* ---------- Detalle: ficha y formulario de cliente ---------- */
function Ficha({ cliente }) {
  const lugar = [cliente.domicilio, cliente.localidad].filter(Boolean).join(', ')
  return (
    <div className="ficha">
      <div className="dato"><Icono nombre="correo" />{cliente.email}</div>
      <div className={`dato ${lugar ? '' : 'tenue'}`}><Icono nombre="lugar" />{lugar || 'Sin domicilio'}</div>
      <div className={`dato ${cliente.telefono ? '' : 'tenue'}`}><Icono nombre="telefono" />{cliente.telefono || 'Sin teléfono'}</div>
    </div>
  )
}

const VACIO = { nombre: '', apellido: '', email: '', telefono: '', domicilio: '', localidad: '' }

function FormularioCliente({ inicial, alGuardar, alCancelar }) {
  const [datos, setDatos] = useState({ ...VACIO, ...inicial })
  const campo = (nombre, etiqueta, extra = {}) => (
    <Campo etiqueta={etiqueta} value={datos[nombre] ?? ''} onChange={(e) => setDatos({ ...datos, [nombre]: e.target.value })} {...extra} />
  )
  return (
    <form className="form" onSubmit={(e) => { e.preventDefault(); alGuardar(datos) }}>
      <div className="fila">{campo('nombre', 'Nombre', { required: true, autoFocus: true })}{campo('apellido', 'Apellido', { required: true })}</div>
      <div className="fila">{campo('email', 'Email', { type: 'email', required: true })}{campo('telefono', 'Teléfono', { type: 'tel' })}</div>
      <div className="fila">{campo('domicilio', 'Domicilio')}{campo('localidad', 'Localidad')}</div>
      <div className="form-botones">
        <button className="btn primario" type="submit"><Icono nombre="guardar" />Guardar</button>
        <Boton icono="cancelar" onClick={alCancelar}>Cancelar</Boton>
      </div>
    </form>
  )
}

/* ---------- Detalle: actividades ---------- */
function FormularioActividad({ actividad, alGuardar, alCancelar }) {
  const [descripcion, setDescripcion] = useState(actividad?.descripcion ?? '')
  const [fecha, setFecha] = useState(actividad?.fechaCompromiso ?? '')
  useEffect(() => { setDescripcion(actividad?.descripcion ?? ''); setFecha(actividad?.fechaCompromiso ?? '') }, [actividad])
  const limpiar = () => { setDescripcion(''); setFecha('') }
  return (
    <form className="sub-form" onSubmit={(e) => { e.preventDefault(); alGuardar({ descripcion, fechaCompromiso: fecha || null }).then((ok) => ok && limpiar()) }}>
      <input type="text" value={descripcion} onChange={(e) => setDescripcion(e.target.value)} placeholder="Descripción de la actividad" aria-label="Descripción de la actividad" required />
      <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} aria-label="Fecha de compromiso (opcional)" />
      <button className="btn primario" type="submit" aria-label="Guardar actividad" title="Guardar actividad"><Icono nombre="guardar" /></button>
      <Boton icono="cancelar" etiqueta="Cancelar actividad" onClick={() => { limpiar(); alCancelar() }} />
    </form>
  )
}

function Actividad({ actividad, alCompletar, alEditar, alBorrar }) {
  const { descripcion, fechaCompromiso, fechaFinalizacion } = actividad
  const completa = Boolean(fechaFinalizacion)
  const vencida = !completa && fechaCompromiso && fechaCompromiso < hoy()
  return (
    <div className="actividad">
      <input type="checkbox" checked={completa} disabled={completa} onChange={() => alCompletar(actividad)} aria-label={`Completar: ${descripcion}`} />
      <div className="texto">
        <div>{descripcion}</div>
        <div className={`fecha ${vencida ? 'vencida' : ''}`}>
          {completa ? `Completada el ${formatearFecha(fechaFinalizacion)}` : fechaCompromiso ? formatearFecha(fechaCompromiso) + (vencida ? ' · Vencido' : '') : 'Sin fecha'}
        </div>
      </div>
      {!completa && (
        <>
          <Boton icono="editar" etiqueta={`Editar: ${descripcion}`} onClick={() => alEditar(actividad)} />
          <Boton icono="borrar" tipo="peligro" etiqueta={`Borrar: ${descripcion}`} onClick={() => alBorrar(actividad)} />
        </>
      )}
    </div>
  )
}

function Grupo({ titulo, clase, vacio, children }) {
  const vacia = React.Children.count(children) === 0
  return (
    <section className={`grupo ${clase}`} aria-label={titulo}>
      <h3>{titulo}</h3>
      <div className="cuerpo-grupo">{vacia ? <div className="vacio-chico">{vacio}</div> : children}</div>
    </section>
  )
}

/* ---------- Detalle ---------- */
function Detalle({ cliente, modo, error, alModo, alGuardarCliente, alEliminar, alRecargar, alError }) {
  const [editando, setEditando] = useState(null)
  useEffect(() => setEditando(null), [cliente?.id])

  if (modo === 'nuevo') {
    return (
      <section className="panel detalle" aria-label="Nuevo cliente">
        <h2>Nuevo cliente</h2>
        {error && <div className="error" role="alert">{error}</div>}
        <FormularioCliente inicial={VACIO} alGuardar={alGuardarCliente} alCancelar={() => alModo('ver')} />
      </section>
    )
  }
  if (!cliente) return <section className="panel"><div className="centro">Seleccioná un cliente para ver su ficha.</div></section>

  const ejecutar = async (accion) => {
    try { await accion(); alError(''); await alRecargar(); return true } catch (e) { alError(e.message); return false }
  }
  const guardarActividad = (datos) =>
    ejecutar(() => (editando ? clientesApi.actualizarActividad(cliente.id, editando.id, datos) : clientesApi.crearActividad(cliente.id, datos))).then((ok) => { if (ok) setEditando(null); return ok })
  const completar = (a) => ejecutar(() => clientesApi.completarActividad(cliente.id, a.id))
  const borrar = (a) => window.confirm(`¿Borrar la actividad "${a.descripcion}"?`) && ejecutar(() => clientesApi.eliminarActividad(cliente.id, a.id))

  const compromisos = ordenarCompromisos(cliente.actividades.filter((a) => !a.fechaFinalizacion))
  const completadas = cliente.actividades.filter((a) => a.fechaFinalizacion).sort((a, b) => b.fechaFinalizacion.localeCompare(a.fechaFinalizacion) || b.id - a.id)

  return (
    <section className="panel detalle" aria-label="Detalle del cliente">
      <div className="id" aria-label={`Identificador ${cliente.id}`}>#{cliente.id}</div>
      <div className="detalle-cab">
        <h2>{cliente.nombre} {cliente.apellido}</h2>
        {modo === 'ver' && (
          <div className="acciones">
            <Boton icono="editar" onClick={() => alModo('editar')}>Editar</Boton>
            <Boton icono="borrar" tipo="peligro" onClick={() => alEliminar(cliente)}>Eliminar</Boton>
          </div>
        )}
      </div>
      {error && <div className="error" role="alert">{error}</div>}
      {modo === 'editar'
        ? <FormularioCliente inicial={cliente} alGuardar={alGuardarCliente} alCancelar={() => alModo('ver')} />
        : <Ficha cliente={cliente} />}
      <FormularioActividad actividad={editando} alGuardar={guardarActividad} alCancelar={() => setEditando(null)} />
      <Grupo titulo="Compromisos" clase="compromisos" vacio="No hay compromisos pendientes.">
        {compromisos.map((a) => <Actividad key={a.id} actividad={a} alCompletar={completar} alEditar={setEditando} alBorrar={borrar} />)}
      </Grupo>
      <Grupo titulo="Actividades completadas" clase="completadas" vacio="Todavía no hay actividades completadas.">
        {completadas.map((a) => <Actividad key={a.id} actividad={a} />)}
      </Grupo>
    </section>
  )
}

/* ---------- Aplicación ---------- */
function App() {
  const [clientes, setClientes] = useState([])
  const [busqueda, setBusqueda] = useState('')
  const [seleccionado, setSeleccionado] = useState(null)
  const [cliente, setCliente] = useState(null)
  const [modo, setModo] = useState('ver') // ver | editar | nuevo
  const [error, setError] = useState('')

  const cargarLista = useCallback(async (q) => {
    try { setClientes(await clientesApi.buscar(q)) } catch (e) { setError(e.message) }
  }, [])
  const cargarDetalle = useCallback(async (id) => {
    if (id == null) return setCliente(null)
    try { setCliente(await clientesApi.obtener(id)) } catch (e) { setError(e.message); setCliente(null) }
  }, [])

  // búsqueda en vivo (con una pequeña espera para no consultar en cada tecla)
  useEffect(() => {
    const t = setTimeout(() => cargarLista(busqueda), 150)
    return () => clearTimeout(t)
  }, [busqueda, cargarLista])
  useEffect(() => { cargarDetalle(seleccionado) }, [seleccionado, cargarDetalle])

  const elegir = (id) => { setSeleccionado(id); setModo('ver'); setError('') }
  const cambiarModo = (m) => { setModo(m); setError('') }
  const recargar = async () => { await Promise.all([cargarLista(busqueda), cargarDetalle(seleccionado)]) }

  const guardarCliente = async (datos) => {
    try {
      const guardado = modo === 'nuevo' ? await clientesApi.crear(datos) : await clientesApi.actualizar(seleccionado, datos)
      setSeleccionado(guardado.id); setCliente(guardado); setModo('ver'); setError('')
      await cargarLista(busqueda)
    } catch (e) { setError(e.message) }
  }
  const eliminar = async (c) => {
    if (!window.confirm(`¿Eliminar a ${c.nombre} ${c.apellido} y todas sus actividades?`)) return
    try { await clientesApi.eliminar(c.id); setSeleccionado(null); setCliente(null); setError(''); await cargarLista(busqueda) } catch (e) { setError(e.message) }
  }

  return (
    <div className="app">
      <header className="cabecera">MiniCRM</header>
      <main className="cuerpo">
        <Maestro clientes={clientes} seleccionado={seleccionado} busqueda={busqueda} alBuscar={setBusqueda} alElegir={elegir} alAgregar={() => { setSeleccionado(null); cambiarModo('nuevo') }} />
        <Detalle cliente={cliente} modo={modo} error={error} alModo={cambiarModo} alGuardarCliente={guardarCliente} alEliminar={eliminar} alRecargar={recargar} alError={setError} />
      </main>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
