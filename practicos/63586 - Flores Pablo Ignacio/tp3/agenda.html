<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Alumnos</title>
  <style>
    /* --- CSS Nesting & Design --- */
    body {
      margin: 0;
      padding: 32px 20px;
      font: 16px sans-serif;
      background: #f5f6f4;
      color: #333;
    }
    main {
      width: 1104px;
      max-width: 100%;
      margin: auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 24px; }
    .search-wrapper { display: flex; align-items: center; }
    .search {
      padding: 8px 12px;
      border: 1px solid #d9ded9;
      border-radius: 8px;
      font-size: 14px;
      width: 240px;
    }
    .add-btn {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
      &:hover { background: #0056b3; }
    }
    ul {
      display: grid;
      grid-template-columns: repeat(3, 360px);
      justify-content: center;
      gap: 12px;
      padding: 0;
      list-style: none;
    }
    li {
      min-width: 0;
      padding: 20px;
      border: 1px solid #d9ded9;
      border-radius: 16px;
      background: white;
      text-align: center;
      position: relative;
      outline: none;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;

      &:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
      &:focus { outline: 2px solid #007bff; }
      &.favorito { border-color: #ffc107; background: #fff8e7; }
    }
    .fav-star {
      position: absolute;
      top: 12px;
      right: 12px;
      cursor: pointer;
      font-size: 20px;
      user-select: none;
      z-index: 10;
    }
    .student-info { margin: 12px 0; }
    .student-name { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
    .student-details {
      font-size: 14px;
      color: #666;
      margin: 4px 0;
      text-align: left;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0 8px;
    }
    .student-details strong { font-weight: 500; color: #888; }
    .github-link { color: #007bff; text-decoration: none; &:hover { text-decoration: underline; } }
    .student-id { font-size: 13px; color: #999; margin-top: 8px; }
    dialog {
      border: none;
      border-radius: 12px;
      padding: 0;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    dialog::backdrop { background: rgba(0,0,0,0.5); }
    .modal-content { padding: 24px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 20px; font-weight: bold; }
    .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      text-align: left;
      label { margin-bottom: 6px; font-size: 14px; font-weight: 500; }
      input { padding: 8px 12px; border: 1px solid #d9ded9; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    }
    .form-actions { display: flex; justify-content: space-between; margin-top: 24px; }
    .save-btn { background: #28a745; color: white; border: none; border-radius: 6px; padding: 10px 20px; cursor: pointer; font-size: 14px; &:hover { background: #218838; } }
    .delete-btn { background: #dc3545; color: white; border: none; border-radius: 6px; padding: 10px 20px; cursor: pointer; font-size: 14px; &:hover { background: #c82333; } }
    .cancel-btn { background: #6c757d; color: white; border: none; border-radius: 6px; padding: 10px 20px; cursor: pointer; font-size: 14px; &:hover { background: #5a6268; } }
    .empty-message { text-align: center; padding: 40px; color: #666; font-style: italic; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'

    /**
     * --- LÓGICA DE ESTADO Y PERSISTENCIA ---
     */
    let initialAlumnos = [];
    try {
      const response = await fetch('./alumnos.json');
      initialAlumnos = await response.json();
    } catch (e) {
      console.error('Error loading alumnos.json:', e);
    }

    const stored = localStorage.getItem('alumnos');
    const alumnosData = stored ? JSON.parse(stored) : initialAlumnos;

    const state = reactive({
      alumnos: alumnosData,
      searchText: '',
      editingAlumno: null, // {id, nombre, apellido, ...}
      isAdding: false
    });

    // Persistencia automática
    watch(() => state.alumnos, () => {
      localStorage.setItem('alumnos', JSON.stringify(state.alumnos));
    });

    /**
     * --- UTILIDADES ---
     */
    const normalize = (text) => {
      if (!text) return '';
      return text.toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, "").replace(/\p{P}/gu, '');
    };

    const getFilteredAndSorted = () => {
      const search = normalize(state.searchText);
      const filtered = state.alumnos.filter(a =>
        normalize(a.apellido).includes(search) ||
        normalize(a.nombre).includes(search) ||
        normalize(a.legajo).includes(search) ||
        normalize(a.github).includes(search) ||
        normalize(a.telefono).includes(search) ||
        normalize(a.comision).includes(search)
      );

      return [...filtered].sort((a, b) => {
        // 1. Favoritos primero
        if (a.favorito && !b.favorito) return -1;
        if (!a.favorito && b.favorito) return 1;
        // 2. Alfabético Apellido
        const apA = normalize(a.apellido), apB = normalize(b.apellido);
        if (apA !== apB) return apA < apB ? -1 : 1;
        // 3. Alfabético Nombre
        const nA = normalize(a.nombre), nB = normalize(b.nombre);
        return nA < nB ? -1 : (nA > nB ? 1 : 0);
      });
    };

    /**
     * --- ACCIONES ---
     */
    const openAdd = () => {
      state.isAdding = true;
      state.editingAlumno = {
        id: Date.now(),
        apellido: '', nombre: '', legajo: '', comision: '', telefono: '', github: '', favorito: false
      };
    };

    const openEdit = (alumno) => {
      state.editingAlumno = { ...alumno };
      state.isAdding = false;
    };

    const closeDialog = () => {
      state.editingAlumno = null;
      state.isAdding = false;
    };

    const save = () => {
      const form = document.querySelector('form');
      if (!form || !form.checkValidity()) {
        if (form) form.reportValidity();
        return;
      }

      if (state.isAdding) {
        state.alumnos.push({ ...state.editingAlumno });
      } else {
        const idx = state.alumnos.findIndex(a => a.id === state.editingAlumno.id);
        if (idx !== -1) state.alumnos[idx] = { ...state.editingAlumno };
      }
      closeDialog();
    };

    const remove = () => {
      state.alumnos = state.alumnos.filter(a => a.id !== state.editingAlumno.id);
      closeDialog();
    };

    const toggleFav = (alumno) => {
      const idx = state.alumnos.findIndex(a => a.id === alumno.id);
      if (idx !== -1) {
        state.alumnos[idx].favorito = !state.alumnos[idx].favorito;
        state.alumnos = [...state.alumnos]; // Trigger watch
      }
    };

    /**
     * --- RENDERIZADO ---
     * Para evitar el error "Invalid HTML position", utilizamos una estructura
     * de renderizado plana y evitamos anidar templates reactivos complejos.
     */
    const app = document.getElementById('app');

    // Componente de Tarjeta (Simple)
    const StudentCard = (a) => html`
      <li class="${() => a.favorito ? 'favorito' : ''}"
          tabindex="0"
          @click="${() => openEdit(a)}"
          @keydown="${(e) => {
            if(e.key==='Enter') openEdit(a);
            if(e.key===' ') { e.preventDefault(); toggleFav(a); }
          }}"
      >
        <div class="fav-star" @click="${(e) => { e.stopPropagation(); toggleFav(a); }}">
          ${() => a.favorito ? '★' : '☆'}
        </div>
        <div class="student-info">
          <div class="student-name">${() => a.apellido}, ${() => a.nombre}</div>
          <div class="student-details">
            <div><strong>GitHub:</strong> <a href="https://github.com/${() => a.github}" target="_blank" class="github-link" @click="${(e) => e.stopPropagation()}">${() => a.github}</a></div>
            <div><strong>Comisión:</strong> ${() => a.comision}</div>
            <div><strong>Legajo:</strong> ${() => a.legajo}</div>
            <div><strong>Teléfono:</strong> ${() => a.telefono}</div>
          </div>
          <div class="student-id">ID: ${() => a.id}</div>
        </div>
      </li>
    `;

    // Plantilla Principal
    html`
      <header>
        <h1>Alumnos</h1>
        <div class="search-wrapper">
          <input type="text" class="search" placeholder="Buscar alumnos..."
                 value="${() => state.searchText}"
                 @input="${(e) => state.searchText = e.target.value}" />
        </div>
        <button class="add-btn" @click="${() => openAdd()}">Agregar Alumno</button>
      </header>

      ${() => {
        const list = getFilteredAndSorted();
        if (list.length === 0) return html`<div class="empty-message">No hay alumnos para mostrar</div>`;
        return html`<ul>${list.map(a => StudentCard(a))}</ul>`;
      }}

      ${() => state.editingAlumno && html`
        <dialog open @keydown="${(e) => { if(e.key==='Escape') closeDialog(); }}">
          <div class="modal-content">
            <div class="modal-header">
              <span class="modal-title">${() => state.isAdding ? 'Agregar alumno' : 'Editar alumno'}</span>
              <button class="close-btn" @click="${() => closeDialog()}">&times;</button>
            </div>
            <form>
              <div class="form-group"><label>Apellido</label><input type="text" value="${() => state.editingAlumno.apellido}" @input="${(e) => state.editingAlumno.apellido = e.target.value}" required /></div>
              <div class="form-group"><label>Nombre</label><input type="text" value="${() => state.editingAlumno.nombre}" @input="${(e) => state.editingAlumno.nombre = e.target.value}" required /></div>
              <div class="form-group"><label>Legajo</label><input type="text" value="${() => state.editingAlumno.legajo}" @input="${(e) => state.editingAlumno.legajo = e.target.value}" required /></div>
              <div class="form-group"><label>Comisión</label><input type="text" value="${() => state.editingAlumno.comision}" @input="${(e) => state.editingAlumno.comision = e.target.value}" required /></div>
              <div class="form-group"><label>Teléfono</label><input type="tel" value="${() => state.editingAlumno.telefono}" @input="${(e) => state.editingAlumno.telefono = e.target.value}" required /></div>
              <div class="form-group"><label>GitHub</label><input type="text" value="${() => state.editingAlumno.github}" @input="${(e) => state.editingAlumno.github = e.target.value}" required /></div>
              <div class="form-actions">
                <button type="button" class="save-btn" @click="${() => save()}">Guardar</button>
                ${() => !state.isAdding ? html`<button type="button" class="delete-btn" @click="${() => remove()}">Eliminar</button>` : html``}
                <button type="button" class="cancel-btn" @click="${() => closeDialog()}">Cancelar</button>
              </div>
            </form>
          </div>
        </dialog>
      `}
    `(app);
  </script>
</body>
</html>
