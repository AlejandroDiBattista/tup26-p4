<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    :root {
      --fondo: #eef1f0;
      --tarjeta: #ffffff;
      --borde: #d3dad7;
      --texto: #1f2a2e;
      --suave: #62706f;
      --acento: #274043;
      --estrella: #b08a3e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 20px;
      font: 15px/1.4 "Helvetica Neue", Arial, sans-serif;
      color: var(--texto);
      background: var(--fondo);
    }

    main { width: 1104px; max-width: 100%; margin: auto; }


    main > header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 28px;

      & h1 {
        flex: 1;
        margin: 0;
        font-size: 28px;
      }

      & input {
        width: 300px;
        max-width: 100%;
        padding: 13px 20px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        background: var(--tarjeta);
        font: inherit;
        color: var(--texto);

        &:focus { outline: 2px solid var(--acento); }
      }
    }

    main > section {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
        & > p {
          grid-column: 1 / -1;
          padding: 40px;
          text-align: center;
          color: var(--suave);
        }
    }

    
    article {
      display: flex;
      flex-direction: column;
      padding: 20px 20px 14px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--tarjeta);
      box-shadow: 0 2px 6px rgb(0 0 0 / .05);
      transition: box-shadow .2s;

      &:hover { box-shadow: 0 6px 16px rgb(0 0 0 / .10); }

        & header {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-height: 64px;

        & h2 {
          flex: 1;
          margin: 0;
          font-family: Palatino, "Book Antiqua", serif;
          font-size: 24px;
          line-height: 1.2;
          color: var(--acento);

          & span { font: 15px "Helvetica Neue", Arial, sans-serif; }
        }

        & button {
          padding: 0;
          border: 0;
          background: none;
          font-size: 24px;
          line-height: 1;
          color: var(--estrella);
          cursor: pointer;
        }
      }

      & address {
        font-style: normal;
        & p { margin: 0 0 8px; }
        & p:last-child { font-size: 13px; color: var(--suave); }
      }

      & footer {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--borde);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .12em;
        color: var(--suave);
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>




  <script type="module">

    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }

    const CLAVE = 'agenda-alumnos'

    function cargarAlumnos() {
      const guardado = localStorage.getItem(CLAVE)
      if (guardado) 
        return JSON.parse(guardado)

      localStorage.setItem(CLAVE, JSON.stringify(alumnosIniciales))
      return alumnosIniciales
    }

    const estado = reactive({
    alumnos: cargarAlumnos(), 
    busqueda: '',
})





    function comparar(a, b) {
      if (a.favorito !== b.favorito) return b.favorito - a.favorito

      const porApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' })
      if (porApellido !== 0) return porApellido

      return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
    }

    function normalizar(texto) {
      return String(texto).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    }

    function alumnosVisibles() {
      const buscado = normalizar(estado.busqueda)

      const filtrados = estado.alumnos.filter(a => {
        const datos = normalizar(`${a.apellido} ${a.nombre} ${a.legajo} ${a.comision} ${a.telefono} ${a.github}`)
        return datos.includes(buscado)
      })

      return filtrados.sort(comparar)
    }





    function guardar() {
      localStorage.setItem(CLAVE, JSON.stringify(estado.alumnos))
    }

    function alternarFavorito(alumno) {
      alumno.favorito = !alumno.favorito
      guardar()
    }

    function estrella(alumno) {
      if (alumno.favorito) return '★'
      return '☆'
    }

    function buscar(texto) {
      estado.busqueda = texto
    }





    const Tarjeta = alumno => html`
      <article>
        <header>
          <h2>${() => alumno.apellido} <span>${() => alumno.nombre}</span></h2>
          <button type="button" @click="${() => alternarFavorito(alumno)}">
            ${() => estrella(alumno)}
          </button>
        </header>
        <address>
          <p>${() => alumno.telefono}</p>
          <p>@${() => alumno.github}</p>
        </address>
        <footer>${() => alumno.comision} · ${() => alumno.legajo}</footer>
      </article>
    `

    
    
    
    const Encabezado = () => html`
    <header>
      <h1>Agenda</h1>
      <input type="search" placeholder="Buscar alumno…"
      @input="${e => buscar(e.target.value)}">
      </header>
      `
      
      function listaDeTarjetas() {
        const lista = alumnosVisibles()
        if (lista.length === 0) {
          return [html`<p>No hay alumnos para mostrar.</p>`.key('vacio')]
        }
        return lista.map(a => Tarjeta(a).key(a.id))
      }




      
      html`
        ${Encabezado()}
        <section>
          ${() => listaDeTarjetas()}
        </section>
        `(document.getElementById('app'))

  </script>






</body>
</html>
