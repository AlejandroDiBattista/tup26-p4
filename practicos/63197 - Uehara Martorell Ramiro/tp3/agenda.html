<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    :root {
      --fondo: #eef1f0;
      --tarjeta: #ffffff;
      --borde: #d3dad7;
      --texto: #1f2a2e;
      --suave: #62706f;
      --acento: #274043;
      --estrella: #b08a3e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 20px;
      font: 15px/1.4 "Helvetica Neue", Arial, sans-serif;
      color: var(--texto);
      background: var(--fondo);
    }

    main { width: 1104px; max-width: 100%; margin: auto; }





    

    main > header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 28px;

      & h1 {
        flex: 1;
        margin: 0;
        font-size: 28px;
      }

      & input {
        width: 300px;
        max-width: 100%;
        padding: 13px 20px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        background: var(--tarjeta);
        font: inherit;
        color: var(--texto);

        &:focus { outline: 2px solid var(--acento); }
      }
    }







    /* Grilla */
    main > section {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;

      & > p {
        grid-column: 1 / -1;
        padding: 40px;
        text-align: center;
        color: var(--suave);
      }
    }







    
    article {
      display: flex;
      flex-direction: column;
      padding: 20px 20px 14px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--tarjeta);
      box-shadow: 0 2px 6px rgb(0 0 0 / .05);
      transition: box-shadow .2s;

      &:hover { box-shadow: 0 6px 16px rgb(0 0 0 / .10); }

      & header {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-height: 64px;

        & h2 {
          flex: 1;
          margin: 0;
          font-family: Palatino, "Book Antiqua", serif;
          font-size: 24px;
          line-height: 1.2;
          color: var(--acento);

          & span { font: 15px "Helvetica Neue", Arial, sans-serif; color: var(--suave); }
        }

        & button {
          padding: 0;
          border: 0;
          background: none;
          font-size: 24px;
          line-height: 1;
          color: var(--estrella);
          cursor: pointer;
        }
      }

      & address {
        font-style: normal;
        & p { margin: 0 0 8px; }
        & p:last-child { font-size: 13px; color: var(--suave); }
      }

      & footer {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid var(--borde);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .12em;
        color: var(--suave);
      }
    }

    main > header > button {
      padding: 13px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--acento);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    article { cursor: pointer; }








    dialog {
      width: 620px;
      max-width: calc(100% - 32px);
      padding: 0;
      border: 8px solid var(--borde);
      border-radius: 22px;
      background: var(--tarjeta);
      color: var(--texto);

      &::backdrop {
        background: rgb(80 100 95 / .45);
        backdrop-filter: blur(3px);
      }

      & form > header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--borde);
        background: var(--fondo);

        & h2 { margin: 0; font-size: 20px; }
        & p { margin: 4px 0 0; font-size: 13px; color: var(--suave); }
      }

      & fieldset {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 12px;
        margin: 0;
        padding: 18px;
        border: 0;

        & label {
          display: flex;
          flex-direction: column;
          gap: 6px;
          font-size: 12px;
          font-weight: 600;
          color: var(--suave);
        }

        & input {
          padding: 11px 12px;
          border: 1px solid var(--borde);
          border-radius: 10px;
          background: var(--fondo);
          font: 15px "Helvetica Neue", Arial, sans-serif;
          color: var(--texto);

          &:focus { outline: 2px solid var(--acento); background: white; }
        }

        & p {
          grid-column: 1 / -1;
          margin: 0;
          font-size: 13px;
          color: #c8423c;

          &:empty { display: none; }
        }
      }

      & form > footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 18px 16px;
        border-top: 1px solid var(--borde);

        & button {
          padding: 10px 18px;
          border: 1px solid var(--borde);
          border-radius: 10px;
          background: white;
          color: var(--texto);
          font: inherit;
          font-weight: 600;
          cursor: pointer;
        }

        & button[type="submit"] {
          border-color: var(--acento);
          background: var(--acento);
          color: white;
        }
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import alumnosIniciales from './alumnos.json' with { type: 'json' }

    const CLAVE = 'agenda-alumnos'

    
    function cargarAlumnos() {
      const guardado = localStorage.getItem(CLAVE)
      if (guardado) {
        return JSON.parse(guardado)
      }

      localStorage.setItem(CLAVE, JSON.stringify(alumnosIniciales))
      return alumnosIniciales
    }

    const estado = reactive({
      alumnos: cargarAlumnos(),
      busqueda: '',
    })

    const formulario = reactive({
      id: null,
      apellido: '',
      nombre: '',
      legajo: '',
      comision: '',
      telefono: '',
      github: '',
      error: '',
    })

    










    

    function comparar(a, b) {
      if (a.favorito !== b.favorito) return b.favorito - a.favorito

      const porApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' })
      if (porApellido !== 0) return porApellido

      return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' })
    }

    function normalizar(texto) {
      return String(texto).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    }

    function alumnosVisibles() {
      const buscado = normalizar(estado.busqueda)

      const filtrados = estado.alumnos.filter(a => {
        const datos = normalizar(`${a.apellido} ${a.nombre} ${a.legajo} ${a.comision} ${a.telefono} ${a.github}`)
        return datos.includes(buscado)
      })

      return filtrados.sort(comparar)
    }

    function validar() {
      if (formulario.apellido.trim() === '') return 'El apellido es obligatorio.'
      if (formulario.nombre.trim() === '') return 'El nombre es obligatorio.'
      if (!/^\d+$/.test(formulario.legajo.trim())) return 'El legajo debe tener solo números.'

      const repetido = estado.alumnos.some(a => a.legajo === formulario.legajo.trim() && a.id !== formulario.id)
      if (repetido) return 'Ya existe un alumno con ese legajo.'

      if (!/^C\d+$/i.test(formulario.comision.trim())) return 'La comisión debe ser C1, C2, C3…'
      if (formulario.telefono.trim() === '') return 'El teléfono es obligatorio.'
      if (formulario.github.trim() === '') return 'El usuario de GitHub es obligatorio.'
      return ''
    }

    function titulo() {
      if (formulario.id === null) return 'Agregar alumno'
      return 'Editar alumno'
    }

    function subtitulo() {
      if (formulario.id === null) return 'Completá los datos del nuevo alumno.'
      return 'Actualizá los datos del alumno.'
    }

    function estrella(alumno) {
      if (alumno.favorito) return '★'
      return '☆'
    }

    















    function guardar() {
      localStorage.setItem(CLAVE, JSON.stringify(estado.alumnos))
    }

    function alternarFavorito(alumno) {
      alumno.favorito = !alumno.favorito
      guardar()
    }

    function buscar(texto) {
      estado.busqueda = texto
    }

    function abrirNuevo() {
      formulario.id = null
      formulario.apellido = ''
      formulario.nombre = ''
      formulario.legajo = ''
      formulario.comision = ''
      formulario.telefono = ''
      formulario.github = ''
      formulario.error = ''
      document.querySelector('dialog').showModal()
    }

    function abrirEdicion(alumno) {
      formulario.id = alumno.id
      formulario.apellido = alumno.apellido
      formulario.nombre = alumno.nombre
      formulario.legajo = alumno.legajo
      formulario.comision = alumno.comision
      formulario.telefono = alumno.telefono
      formulario.github = alumno.github
      formulario.error = ''
      document.querySelector('dialog').showModal()
    }

    function cerrarFormulario() {
      document.querySelector('dialog').close()
    }

    function guardarFormulario() {
      const error = validar()
      if (error !== '') {
        formulario.error = error
        return
      }

      const datos = {
        apellido: formulario.apellido.trim(),
        nombre: formulario.nombre.trim(),
        legajo: formulario.legajo.trim(),
        comision: formulario.comision.trim().toUpperCase(),
        telefono: formulario.telefono.trim(),
        github: formulario.github.trim(),
      }

      if (formulario.id === null) {
        const ids = estado.alumnos.map(a => a.id)
        const nuevo = { id: Math.max(0, ...ids) + 1, ...datos, favorito: false }
        estado.alumnos = [...estado.alumnos, nuevo]
      } else {
        const alumno = estado.alumnos.find(a => a.id === formulario.id)
        Object.assign(alumno, datos)
      }

      guardar()
      cerrarFormulario()
    }

    














    const Tarjeta = alumno => html`
      <article @click="${() => abrirEdicion(alumno)}">
        <header>
          <h2>${() => alumno.apellido} <span>${() => alumno.nombre}</span></h2>
          <button type="button" @click="${e => { e.stopPropagation(); alternarFavorito(alumno) }}">
            ${() => estrella(alumno)}
          </button>
        </header>
        <address>
          <p>${() => alumno.telefono}</p>
          <p>@${() => alumno.github}</p>
        </address>
        <footer>${() => alumno.comision} · ${() => alumno.legajo}</footer>
      </article>
    `

    const Encabezado = () => html`
      <header>
        <h1>Agenda</h1>
        <input type="search" placeholder="Buscar alumno…"
               @input="${e => buscar(e.target.value)}">
        <button type="button" @click="${() => abrirNuevo()}">+ Agregar</button>
      </header>
    `

    const Campo = (campo, etiqueta) => html`
      <label>
        ${etiqueta}
        <input value="${() => formulario[campo]}"
               @input="${e => { formulario[campo] = e.target.value }}">
      </label>
    `

    const Dialogo = () => html`
      <dialog>
        <form novalidate @submit="${e => { e.preventDefault(); guardarFormulario() }}">
          <header>
            <h2>${() => titulo()}</h2>
            <p>${() => subtitulo()}</p>
          </header>
          <fieldset>
            ${Campo('apellido', 'Apellido')}
            ${Campo('nombre', 'Nombre')}
            ${Campo('legajo', 'Legajo')}
            ${Campo('comision', 'Comisión')}
            ${Campo('telefono', 'Teléfono')}
            ${Campo('github', 'GitHub')}
            <p>${() => formulario.error}</p>
          </fieldset>
          <footer>
            <button type="submit">Guardar</button>
            <button type="button" @click="${() => cerrarFormulario()}">Cancelar</button>
          </footer>
        </form>
      </dialog>
    `

    function listaDeTarjetas() {
      const lista = alumnosVisibles()
      if (lista.length === 0) {
        return [html`<p>No hay alumnos para mostrar.</p>`.key('vacio')]
      }
      return lista.map(a => Tarjeta(a).key(a.id))
    }

    html`
      ${Encabezado()}
      <section>
        ${() => listaDeTarjetas()}
      </section>
      ${Dialogo()}
    `(document.getElementById('app'))
  </script>
</body>
</html>
