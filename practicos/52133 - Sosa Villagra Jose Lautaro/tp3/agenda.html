<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app');

    const CLAVE = "agenda";
    const estado = reactive({
      alumnos: JSON.parse(localStorage.getItem(CLAVE)) ?? alumnos,
      busqueda: "",
    });

    watch(() => localStorage.setItem(CLAVE, JSON.stringify(estado.alumnos)));

    //id`, `apellido`, `nombre`, `legajo`, `comision`, `telefono`, `github` y `favorito`
    const CAMPOS = ["id", "apellido", "nombre", "legajo", "comision", "telefono", "github", "favorito"];

    const borrador = reactive({
      id: null,
      apellido: '',
      nombre: '',
      legajo: '',
      comision: '',
      telefono: '',
      github: '',
      favorito: '',
    });

    function normalizar(texto) {
      return texto.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase()
    }

    function comparar(a, b) {
      if (a.favorito !== b.favorito) return a.favorito ? -1 : 1
      const opciones = { sensitivity: 'base' }
      return a.apellido.localeCompare(b.apellido, 'es', opciones)
          || a.nombre.localeCompare(b.nombre, 'es', opciones)
    }

    html`
      <h1>Alumnos</h1>
      <ul>
        ${alumnos.map(a => html`<li>${a.nombre} <b>${a.apellido}</b></li>`)}
      </ul>
    `(app)
  </script>
</body>
</html>
