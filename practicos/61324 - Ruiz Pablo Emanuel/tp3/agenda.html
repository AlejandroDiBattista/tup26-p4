<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }
    main { width: 1104px; max-width: 100%; margin: auto; }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    
    li {
      min-width: 0;
      padding: 20px; 
      border: 1px solid #d9ded9;
      border-radius: 16px; 
      background: white; 
      text-align: left;

      h2 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      p{
        font-size: 14px;
        margin: 8px 0; 
        color: #444;
      }
      address {
        font-style: normal;
      }
      .favorito {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        border: none;
        background: transparent;
        color: #d4a017;
        cursor: pointer;

        svg {
          width: 26px;
          height: 26px;
        }
      }
    }

    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  
    dialog {
      width: min(90%, 420px);
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);

      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      
          input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
          }
          button {
            margin-top: 12px;
            padding: 10px;
            cursor: pointer;
          }
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import datosIniciales from './alumnos.json' with { type: 'json' }

    const datosGuardados = localStorage.getItem('agenda-alumnos')
    const alumnos = reactive(
      datosGuardados ? JSON.parse(datosGuardados) : datosIniciales.map(alumno => ({
        ...alumno,
        id: alumno.legajo,
        favorito: false
      }))
    )
    if (!datosGuardados) {
      localStorage.setItem('agenda-alumnos', JSON.stringify(alumnos))
    }

    const app = document.getElementById('app')
    const estado = reactive({
      busqueda: ''
    })
    function normalizarTexto(texto) {
      return texto 
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
    }
    function filtrarAlumnos() {
      const texto = normalizarTexto(estado.busqueda.trim())

      return alumnos 
        .filter(alumno => {
          const nombreCompleto = `${alumno.nombre} ${alumno.apellido}`
          return normalizarTexto(nombreCompleto).includes(texto)
        })
        .sort((a, b) => {
          if (a.favorito !== b.favorito) {
            return a.favorito ? -1 : 1
          }
          const apellidoA = normalizarTexto(a.apellido)
          const apellidoB = normalizarTexto(b.apellido)
          const comparacion = apellidoA.localeCompare(apellidoB)

          if (comparacion !==0) {
            return comparacion
          }
          return normalizarTexto(a.nombre).localeCompare(normalizarTexto(b.nombre)          )
        })
    }

    function guardarAlumnos() {
      localStorage.setItem('agenda-alumnos', JSON.stringify(alumnos))
    }
    function alterarFavorito(alumno) {
      alumno.favorito = !alumno.favorito
      guardarAlumnos()
    }
    let alumnoEnEdicion = null

    function editarAlumno(alumno) {
      alumnoEnEdicion = alumno
      document.getElementById('titulo-formulario').textContent = 'Editar alumno'
      console.log('Editar alumno:', alumno.nombre)

      const formulario = document.getElementById('formulario-alumno')
        formulario.elements['nombre'].value = alumno.nombre
        formulario.elements['apellido'].value = alumno.apellido
        formulario.elements['legajo'].value = alumno.legajo
        formulario.elements['comision'].value = alumno.comision
        formulario.elements['telefono'].value = alumno.telefono
        formulario.elements['github'].value = alumno.github

        document.getElementById('dialogo-alumno').showModal()
    }
    function eliminarAlumno(alumno) {
      const confirmado = confirm(
        `¿Estás seguro de que querés eliminar a ${alumno.nombre} ${alumno.apellido}?`
      )
      if (!confirmado) {
        return
      }
     const indice = alumnos.findIndex(a => a === alumno)

     if (indice !== -1) {
      alumnos.splice(indice, 1)
      guardarAlumnos()
     }
    }

    html`
      <h1>Alumnos</h1>

      <button type="button" id="btn-agregar">
        Agregar alumno
      </button>
        <dialog id="dialogo-alumno" aria-labelledby="titulo-formulario"> 
        <h2 id="titulo-formulario">Agregar alumno</h2>
        <form id="formulario-alumno">

          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required>
          
          <label for="apellido">Apellido:</label>
          <input type="text" id="apellido" name="apellido" required>  

          <label for="legajo">Legajo:</label>
          <input type="number" id="legajo" name="legajo" min="1" step="1"  required>  

          <label for="comision">Comisión:</label>
          <input type="text" id="comision" name="comision" required>  
        
          <label for="telefono">Teléfono:</label>
          <input type="text" id="telefono" name="telefono" required>  

          <label for="github">GitHub:</label>
          <input 
          type="text" 
          id="github" 
          name="github" 
          pattern="[A-Za-z0-9]+(-[A-Za-z0-9]+)*"
          title="Ingresa un usuario de GitHub con letras, números y guiones, sin espacios."
          required
          >

          <button type="submit">
            Guardar alumno
          </button>

        </form>

        <button type="button" id="btn-cerrar">
          Cerrar
        </button>
      </dialog>

      <input 
        type="search" 
        placeholder="Buscar alumno..." 
        aria-label="Buscar alumno" 
        @input="${(evento) => {
        estado.busqueda = evento.target.value

        console.log('Buscando:', estado.busqueda)
        }}"
        >

      <ul>
        ${() => filtrarAlumnos().map(a => html`
        <li>

         <article tabindex="0"
          aria-label="${() => `${a.nombre} ${a.apellido}. Presioná Enter para editar o Espacio para alternar favorito.`}"
          @keydown="${(evento) => {
            if (evento.target !== evento.currentTarget) return

            if (evento.key === 'Enter') {
              editarAlumno(a)
            }
            if (evento.key === ' ') {
              evento.preventDefault()
              alterarFavorito(a)
            }
          }}"
          >
          <header>
            <h2>${a.nombre} ${a.apellido}</h2>

            <button 
            type="button"
            class="favorito"
            aria-label="&{() => a.favorito ? 'Quitar de favoritos' : 'Marcar como favorito'}"
            aria-pressed="${() => a.favorito}"
            @click="${() => alterarFavorito(a)}"
            >
            <svg 
             xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="26"
            height="26"
            fill="${() => a.favorito ? '#d4a017' : 'none'}"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
            >
            <polygon points="12,2 15.1,8.3 22,9.3 17,14.2 18.2,21 12,17.8 5.8,21 7,14.2 2,9.3 8.9,8.3"/>
            </svg>
            </button>

          </header>

            <section>
              <p>Legajo: ${a.legajo}</p>
              <p>Comisión: ${a.comision}</p>
            </section>

              <address>
                <p>Teléfono: ${a.telefono}</p>
                <p>GitHub: ${a.github}</p>
              </address>

              <button type="button" class="btn-editar" @click="${() => editarAlumno(a)}">
                Editar
              </button>
              <button type="button" class="btn-eliminar" @click="${() => eliminarAlumno(a)}">
                Eliminar
              </button>

          </article>
          </li>
        `)}
      </ul>
      <p class="sin-resultados">
        ${() => filtrarAlumnos().length === 0 ? 'No se encontraron alumnos para mostrar.' : ''}  
      </p>
    `(app)

    const dialogoAlumno = document.getElementById('dialogo-alumno')
    dialogoAlumno.addEventListener('close', () => {
      alumnoEnEdicion = null
    })

    const botonAgregar = document.getElementById('btn-agregar')
    const botonCerrar = document.getElementById('btn-cerrar')

    botonAgregar.addEventListener('click', () => {
      alumnoEnEdicion = null
      formularioAlumno.reset()
      document.getElementById('titulo-formulario').textContent = 'Agregar alumno'
      dialogoAlumno.showModal()
    })
    botonCerrar.addEventListener('click', () => {
      dialogoAlumno.close()
    })

    const formularioAlumno = document.getElementById('formulario-alumno')
      formularioAlumno.addEventListener('submit', (evento) => {
        evento.preventDefault()

        const datosFormulario = new FormData(formularioAlumno)
        
        const nuevoAlumno = {
          nombre: datosFormulario.get('nombre').trim(),
          apellido: datosFormulario.get('apellido').trim(),
          legajo: Number(datosFormulario.get('legajo')),
          comision: datosFormulario.get('comision').trim(),
          telefono: datosFormulario.get('telefono').trim(),
          github: datosFormulario.get('github').trim(),
          favorito: alumnoEnEdicion ? alumnoEnEdicion.favorito : false
        }
        nuevoAlumno.id = nuevoAlumno.legajo
        if (!nuevoAlumno.nombre || !nuevoAlumno.apellido) {
          alert('El nombre y el apellido no pueden estar vacios.')
          return
        }
        if (!nuevoAlumno.comision || !nuevoAlumno.telefono) {
          alert('La comisión y el teléfono no pueden estar vacios.')
          return
        }
        if (!nuevoAlumno.github) {
          alert('El usuario de GitHub no puede estar vacio.')
          return
        }

        const legajoExistente = alumnos.some(
          alumno => Number(alumno.legajo) === nuevoAlumno.legajo &&
           Number(alumno.id) !== Number(alumnoEnEdicion?.id)
          )

        if (legajoExistente) {
          alert('Ya existe un alumno con ese legajo.')
          return
        }
        if (alumnoEnEdicion) {
          Object.assign(alumnoEnEdicion, nuevoAlumno)
        } else {
          alumnos.push(nuevoAlumno)
        }
        guardarAlumnos()
        formularioAlumno.reset()
        dialogoAlumno.close()
      })

  </script>
</body>
</html>
