<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniCRM · Clientes y actividades</title>
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
    <script>
      Babel.registerPreset("microcrm", {
        presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
      });
    </script>
    <style>
      :root {
        font:
          14px system-ui,
          sans-serif;
        color: #0f172a;
        background: #f5f7fa;
        --line: #e2e8f0;
        --muted: #64748b;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 23px;
      }
      h2 {
        font-size: 24px;
        letter-spacing: -0.025em;
      }
      h3 {
        font-size: 16px;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 40px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-weight: 600;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
        background: white;
        color: inherit;
      }
      .button:hover {
        background: #f1f5f9;
      }
      .button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .primary:hover {
        background: #1d4ed8;
      }
      .danger {
        color: #dc2626;
      }
      .icon {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }
      input,
      textarea {
        width: 100%;
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        caret-color: var(--accent);
        background: white;
        color: inherit;
      }
      textarea {
        min-height: 75px;
        resize: vertical;
      }
      input::placeholder {
        color: var(--muted);
      }
      :focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 2px;
      }
      ::selection {
        background: #dbeafe;
      }
      .topbar {

        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: white;

      }
      .topbar p {
        color: var(--muted);
        margin-top: 3px;
        font-size: 13px;

      .workspace {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 24px;
        padding: 24px;

      .panel {
        min-width: 0;
        min-height: 0;
        border: 0;
        border-radius: 16px;
        background: white;
        box-shadow: 0 4px 24px rgba(15, 23, 42, 0.05);
        overflow: hidden;

      .master {
        display: flex;
        flex-direction: column;
      }
      .master-head {
        flex-shrink: 0;
        padding: 20px;
        border-bottom: 1px solid var(--line);
      }
      .row {
        display: flex;
        align-items: center;

        gap: 12px;

        overflow: hidden;

        min-height: 0;

        flex-shrink: 0;

        margin: auto;

        text-align: center;
        max-width: 440px;

        margin: 12px 0 20px;

        max-height: 50%;

        overflow-wrap: anywhere;

        grid-template-columns: 1fr 1fr;

        grid-template-columns: 1fr 1fr;

        padding: 0;
        border: 0;

        color: var(--muted);

        padding: 14px;

        border-radius: 12px;
        background: white;

        padding: 0;

      .client-list {

      .client-copy {

      .client small {

      .avatar {

        flex-shrink: 0;

        height: 40px;

      .tone-1 {

      }
      .tone-2 {

      }
      .tone-3 {
        background: #ffedd5;

      .profile-title {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;

      .profile-title .avatar {
        width: 48px;
        height: 48px;
        font-size: 16px;
      }
      .identity {
        background: #f1f5f9;
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 12px;
      }
      .activity-list {
        padding-right: 5px;

      .activity-list h3 {
        display: flex;
        align-items: center;
        gap: 8px;

      .activity-list section:first-child h3 {

      .activity-list h3 small {

        font-weight: 500;
      }
      .completed-group h3 {

      }
      .is-complete {

        border-color: #dcfce7;

      .is-overdue {

      .is-scheduled small {

      .activity small::before {

        width: 6px;
        height: 6px;
        border-radius: 50%;

        margin-right: 6px;
        vertical-align: middle;
      }
      .is-complete small {
        color: #15803d;
      }
      .activity .actions {
        gap: 5px;
      }
      .activity .button {
        padding: 8px;
        min-height: 36px;
      }
      .button.danger:hover {

        border-color: #fecaca;
      }
      .client:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;

      @media (max-width: 960px) {
        .topbar {
          height: 76px;
          padding: 0 18px;
        }
        .topbar p {
          font-size: 11px;
        }
        .workspace {
          grid-template-columns: 1fr;
          padding: 8px;

        }
        .workspace.open .master,
        .workspace:not(.open) .detail {

        }
        .back {

        }
        .form {

        }
        .form > * {

        }
        .activity .actions {
          gap: 4px;
        }
        .activity-form-row {

    </style>
  </head>
  <body>
    <div id="root">
      <p class="loading">
        Cargando MicroCRM… Si el mensaje persiste, revisá la conexión a los CDN.
      </p>
    </div>
    <noscript>Activá JavaScript para utilizar MicroCRM.</noscript>
    <script id="mcp-module">
      // Adaptador independiente de React. El SDK implementa la negociación,
      // los encabezados MCP, JSON/SSE y la correlación de respuestas JSON-RPC.
      window.crearClienteMcp = function ({ cargarSdk, url = "/mcp" } = {}) {
        let conexion;
        const cargar =
          cargarSdk ||
          (() =>
            Promise.all([
              import(
                "https://esm.sh/@modelcontextprotocol/sdk@1.32.1/client/index.js?bundle&deps=zod@4.1.12"
              ),
              import(
                "https://esm.sh/@modelcontextprotocol/sdk@1.32.1/client/streamableHttp.js?bundle&deps=zod@4.1.12"
              ),
            ]));
        async function conectar() {
          if (!conexion) {
            conexion = (async () => {
              const [{ Client }, { StreamableHTTPClientTransport }] =
                await cargar();
              const client = new Client({
                name: "minicrm-web",
                version: "1.0.0",
              });
              try {
                await client.connect(
                  new StreamableHTTPClientTransport(
                    new URL(url, location.href),
                  ),
                );
                await client.listTools();
                return client;
              } catch (error) {
                await client.close();
                throw error;
              }
            })().catch((error) => {
              conexion = null;
              throw error;
            });
          }
          return conexion;
        }
        async function llamar(name, args, signal) {
          const client = await conectar();
          signal?.throwIfAborted();
          const result = await client.callTool(
            { name, arguments: args },
            undefined,
            { signal },
          );
          const text = result.content
            .filter((item) => item.type === "text")
            .map((item) => item.text)
            .join("\n");
          if (result.isError)
            throw new Error(text || "No se pudo ejecutar la herramienta MCP.");
          try {
            return JSON.parse(text);
          } catch {
            throw new Error(
              "El servidor MCP devolvió una respuesta no válida.",
            );
          }
        }
        return {
          conectar,
          clientes: {
            listar: (busqueda, signal) =>
              llamar("listar_clientes", { busqueda }, signal),
            obtener: (clienteId) => llamar("obtener_cliente", { clienteId }),
            guardar: (clienteId, datos) =>
              llamar(
                clienteId ? "editar_cliente" : "agregar_cliente",
                clienteId ? { clienteId, datos } : { datos },
              ),
            eliminar: (clienteId) => llamar("eliminar_cliente", { clienteId }),
          },
          actividades: {
            listar: (clienteId) => llamar("listar_actividades", { clienteId }),
            obtener: (clienteId, actividadId) =>
              llamar("obtener_actividad", { clienteId, actividadId }),
            guardar: (clienteId, actividadId, datos) =>
              llamar(
                actividadId ? "editar_actividad" : "agregar_actividad",
                actividadId
                  ? { clienteId, actividadId, datos }
                  : { clienteId, datos },
              ),
            eliminar: (clienteId, actividadId) =>
              llamar("eliminar_actividad", { clienteId, actividadId }),
            completar: (clienteId, actividadId) =>
              llamar("completar_actividad", { clienteId, actividadId }),
          },
          async cerrar() {
            const actual = conexion;
            conexion = null;
            if (actual) await (await actual).close();
          },
        };
      };
    </script>
    <script type="text/babel" data-presets="microcrm">
      const { useState, useEffect, useRef, useId } = React;

      // Servicios HTTP: los componentes no conocen fetch ni construyen las rutas.
      async function request(path, { body, ...options } = {}) {
        const response = await fetch("/api/clientes" + path, {
          ...options,
          headers: { "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (response.status === 204) return null;
        const data = await response.json();
        if (!response.ok)
          throw new Error([data.error, ...(data.detalles || [])].join(" "));
        return data;
      }
      const ClientesRest = {
        listar: (query, signal) =>
          request("?q=" + encodeURIComponent(query), { signal }),
        obtener: (id) => request("/" + id),
        guardar: (id, body) =>
          request(id ? "/" + id : "", { method: id ? "PUT" : "POST", body }),
        eliminar: (id) => request("/" + id, { method: "DELETE" }),
      };
      const ActividadesRest = {
        guardar: (clienteId, id, body) =>
          request(`/${clienteId}/actividades${id ? "/" + id : ""}`, {
            method: id ? "PUT" : "POST",
            body,
          }),
        completar: (clienteId, id) =>
          request(`/${clienteId}/actividades/${id}/completar`, {
            method: "PATCH",
          }),
        eliminar: (clienteId, id) =>
          request(`/${clienteId}/actividades/${id}`, { method: "DELETE" }),
      };

      const mcp = window.crearClienteMcp();
      const servicios = {
        rest: { clientes: ClientesRest, actividades: ActividadesRest },
        mcp,
      };

      // Controles y estructura reutilizables.
      function Icon({ name }) {
        const paths = {
          add: "M12 5v14M5 12h14",
          edit: "m15 5 4 4M4 20l4-1L20 7l-4-4L4 15z",
          trash: "M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7",
          check: "m5 12 4 4L19 6",
          back: "m12 5-7 7 7 7M5 12h15",
          save: "M5 3h12l4 4v14H3V3zM7 3v6h10V3M7 21v-8h10v8",
          cancel: "m6 6 12 12M18 6 6 18",
        };
        return (
          <svg
            className="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="1.7"
            strokeLinecap="round"
            strokeLinejoin="round"
            aria-hidden="true"
          >
            <path d={paths[name]} />
          </svg>
        );
      }
      function Button({
        children,
        icon,
        variant = "",
        className = "",
        type = "button",
        ...props
      }) {
        return (
          <button
            type={type}
            className={`button ${variant} ${className}`}
            {...props}
          >
            {icon && <Icon name={icon} />}
            {children}
          </button>
        );
      }
      function Field({ label, multiline = false, ...props }) {
        const id = useId();
        const Control = multiline ? "textarea" : "input";
        return (
          <label className="field" htmlFor={id}>
            <span>
              {label}
              {props.required && " *"}
            </span>
            <Control id={id} {...props} />
          </label>
        );
      }
      function Form({
        title,
        children,
        onSubmit,
        onCancel,
        busy,
        submitLabel = "Guardar",
        className = "",
      }) {
        return (
          <form
            className={className}
            onSubmit={(event) => {
              event.preventDefault();
              onSubmit();
            }}
          >
            <fieldset className="form" disabled={busy}>
              <h2 className="wide">{title}</h2>
              {children}
              <div className="actions wide">
                <Button type="submit" variant="primary" icon="save">
                  {busy ? "Guardando…" : submitLabel}
                </Button>
                <Button onClick={onCancel}>Cancelar</Button>
              </div>
            </fieldset>
          </form>
        );
      }
      function EmptyState({ title, children, action }) {
        return (
          <div className="empty">
            <h2>{title}</h2>
            <p>{children}</p>
            {action}
          </div>
        );
      }
      function Layout({
        master,
        children,
        open,
        error,
        onCloseError,
        transport,
        onTransport,
        transportDisabled,
        onDraft,
      }) {
        return (
          <>
            <header className="topbar">
              <div className="brand">
                <span className="brand-mark" aria-hidden="true">
                  <Icon name="edit" />
                </span>
                <div>
                  <h1>MiniCRM</h1>
                  <p>Clientes y actividades, en un solo lugar.</p>
                </div>
              </div>
              <label className="transport-control">
                <span>Conexión</span>
                <select
                  aria-label="Conexión de datos"
                  value={transport}
                  onChange={(event) => onTransport(event.target.value)}
                  disabled={transportDisabled}
                  title={
                    transportDisabled
                      ? "Guardá o cancelá el formulario y esperá a que termine la operación."
                      : "Elegir API REST o MCP"
                  }
                >
                  <option value="rest">API REST</option>
                  <option value="mcp">MCP</option>
                </select>
              </label>
            </header>
            {error && (
              <div className="notice" role="alert">
                <span>{error}</span>
                <Button onClick={onCloseError}>Cerrar</Button>
              </div>
            )}
            <main className={`workspace ${open ? "open" : ""}`}>
              <aside className="panel master" aria-label="Clientes">
                {master}
              </aside>
              <section
                className="panel detail"
                aria-label="Detalle del cliente"
                onInput={onDraft}
              >
                {children}
              </section>
            </main>
          </>
        );
      }

      // Entidades: formularios, listado y ficha.
      const clientFields = [
        { name: "nombre", label: "Nombre", required: true },
        { name: "apellido", label: "Apellido", required: true },
        { name: "email", label: "Email", type: "email", required: true },
        { name: "telefono", label: "Teléfono", type: "tel" },
        { name: "domicilio", label: "Domicilio" },
        { name: "localidad", label: "Localidad" },
      ];
      const fullName = (client) => `${client.nombre} ${client.apellido}`;
      function Avatar({ client }) {
        return (
          <span className={`avatar tone-${client.id % 4}`} aria-hidden="true">
            {client.nombre.charAt(0)}
            {client.apellido.charAt(0)}
          </span>
        );
      }
      const formatDate = (date) =>
        date
          ? new Date(date + "T12:00:00").toLocaleDateString("es-AR")
          : "Sin fecha de compromiso";
      function ClientForm({ client, onSave, ...props }) {
        const [values, setValues] = useState(() =>
          Object.fromEntries(
            clientFields.map((field) => [
              field.name,
              client?.[field.name] || "",
            ]),
          ),
        );
        return (
          <Form
            title={client ? "Editar cliente" : "Nuevo cliente"}
            className="client-form"
            onSubmit={() => onSave(values)}
            submitLabel="Guardar"
            {...props}
          >
            {clientFields.map(({ name, ...field }) => (
              <Field
                key={name}
                {...field}
                maxLength={300}
                autoFocus={name === "nombre"}
                value={values[name]}
                onChange={(event) =>
                  setValues({ ...values, [name]: event.target.value })
                }
              />
            ))}
          </Form>
        );
      }
      function ActivityForm({ activity, onSave, onCancel, busy }) {
        const [description, setDescription] = useState(
          activity.descripcion || "",
        );
        const [date, setDate] = useState(activity.fechaCompromiso || "");
        return (
          <form
            aria-label={activity.id ? "Editar actividad" : "Nueva actividad"}
            className="activity-form"
            onSubmit={(event) => {
              event.preventDefault();
              onSave({
                descripcion: description,
                fechaCompromiso:
                  event.currentTarget.elements.fechaCompromiso.value || null,
              });
            }}
          >
            <fieldset className="activity-form-row" disabled={busy}>
              <input
                aria-label="Descripción de la actividad"
                placeholder="Descripción de la actividad"
                value={description}
                required
                autoFocus={Boolean(activity.id)}
                maxLength={2000}
                onChange={(event) => setDescription(event.target.value)}
              />
              <input
                aria-label="Fecha de compromiso (opcional)"
                name="fechaCompromiso"
                title="Fecha de compromiso (opcional)"
                type="date"
                value={date}
                onInput={(event) => setDate(event.currentTarget.value)}
                onChange={(event) => setDate(event.target.value)}
              />
              <Button
                type="submit"
                variant="primary"
                icon="save"
                aria-label="Guardar actividad"
                title="Guardar actividad"
              />
              <Button
                icon="cancel"
                onClick={onCancel}
                aria-label="Cancelar actividad"
                title="Cancelar actividad"
              />
            </fieldset>
          </form>
        );
      }
      function ClientList({
        clients,
        selectedId,
        query,
        onQuery,
        onSelect,
        onCreate,
        busy,
        loading,
        failed,
        onRetry,
      }) {
        return (
          <>
            <div className="master-head">
              <div className="row">
                <h2>Clientes</h2>
                <Button
                  variant="primary"
                  icon="add"
                  onClick={onCreate}
                  disabled={busy}
                >
                  Agregar
                </Button>
              </div>
              <div className="search">
                <Field
                  label="Buscar por cualquier campo"
                  type="search"
                  placeholder="Nombre, apellido, email…"
                  value={query}
                  onChange={(event) => onQuery(event.target.value)}
                />
              </div>
            </div>
            <div className="client-list" aria-busy={loading}>
              {loading ? (
                <p className="loading" role="status">
                  Buscando clientes…
                </p>
              ) : failed ? (
                <EmptyState
                  title="No se pudo cargar la lista"
                  action={<Button onClick={onRetry}>Reintentar</Button>}
                >
                  Revisá la conexión y volvé a intentar.
                </EmptyState>
              ) : clients.length ? (
                clients.map((client) => (
                  <button
                    className="client"
                    key={client.id}
                    aria-current={selectedId === client.id}
                    disabled={busy}
                    onClick={() => onSelect(client.id)}
                  >
                    <Avatar client={client} />
                    <span className="client-copy">
                      <strong>{fullName(client)}</strong>
                      <small>{client.email}</small>
                    </span>
                  </button>
                ))
              ) : (
                <EmptyState
                  title={query ? "Sin coincidencias" : "Tu agenda empieza acá"}
                >
                  {query
                    ? "Probá con otro dato del cliente."
                    : "Agregá tu primer cliente para organizar sus próximos pasos."}
                </EmptyState>
              )}
            </div>
            <div className="count">
              {loading
                ? "Consultando…"
                : `${clients.length} clientes${query ? " en esta búsqueda" : ""}`}
            </div>
          </>
        );
      }
      function ClientCard({ client, onEdit, onDelete, busy }) {
        return (
          <div className="profile">
            <div className="profile-header">
              <div className="profile-title">
                <Avatar client={client} />
                <h2>{fullName(client)}</h2>
              </div>
              <span
                className="identity muted"
                aria-label={`Identificador del cliente ${client.id}`}
              >
                #{client.id}
              </span>
              <div className="actions">
                <Button icon="edit" disabled={busy} onClick={onEdit}>
                  Editar
                </Button>
                <Button
                  icon="trash"
                  variant="danger"
                  disabled={busy}
                  onClick={onDelete}
                >
                  Eliminar
                </Button>
              </div>
            </div>
            <dl className="facts">
              {clientFields
                .filter((field) => !["nombre", "apellido"].includes(field.name))
                .map((field) => (
                  <div key={field.name}>
                    <dt>{field.label}</dt>
                    <dd>{client[field.name] || "Sin registrar"}</dd>
                  </div>
                ))}
            </dl>
          </div>
        );
      }
      function ActivityItem({ activity, onEdit, onComplete, onDelete, busy }) {
        return (
          <article
            className={`activity ${activity.completada ? "is-complete" : activity.vencida ? "is-overdue" : activity.fechaCompromiso ? "is-scheduled" : "is-undated"}`}
          >
            <input
              className="activity-check"
              type="checkbox"
              checked={activity.completada}
              disabled={busy || activity.completada}
              aria-label={`${activity.completada ? "Completada" : "Completar"}: ${activity.descripcion}`}
              onChange={() => onComplete(activity.id)}
            />
            <div className="activity-text">
              <p>{activity.descripcion}</p>
              <small className={activity.vencida ? "danger" : ""}>
                {activity.completada
                  ? `Finalizada el ${new Date(activity.fechaFinalizacion).toLocaleString("es-AR")}`
                  : formatDate(activity.fechaCompromiso)}
                {!activity.completada && activity.vencida && " · Vencida"}
                {!activity.completada &&
                  !activity.vencida &&
                  activity.fechaCompromiso &&
                  " · Programada"}
              </small>
            </div>
            {activity.completada ? (
              <span className="badge">Completada</span>
            ) : (
              <div className="actions">
                <Button
                  icon="edit"
                  aria-label={`Editar actividad: ${activity.descripcion}`}
                  title="Editar actividad"
                  disabled={busy}
                  onClick={() => onEdit(activity)}
                />
                <Button
                  icon="trash"
                  variant="danger"
                  aria-label={`Borrar actividad: ${activity.descripcion}`}
                  title="Borrar actividad"
                  disabled={busy}
                  onClick={() => onDelete(activity.id)}
                />
              </div>
            )}
          </article>
        );
      }
      function ActivityList({ activities, ...props }) {
        return (
          <div className="activity-list">
            {[false, true].map((done) => {
              const items = activities.filter(
                (activity) => activity.completada === done,
              );
              return (
                <section
                  key={String(done)}
                  className={done ? "completed-group" : "pending-group"}
                >
                  <h3>
                    {done ? "Actividades completadas" : "Compromisos"}{" "}
                    <small>({items.length})</small>
                  </h3>
                  {items.length ? (
                    items.map((activity) => (
                      <ActivityItem
                        key={activity.id}
                        activity={activity}
                        {...props}
                      />
                    ))
                  ) : (
                    <p className="activity-empty">
                      {done
                        ? "Sin actividades completadas."
                        : "No hay compromisos pendientes."}
                    </p>
                  )}
                </section>
              );
            })}
          </div>
        );
      }
      function ClientDetail({
        client,
        activity,
        setActivity,
        busy,
        onEdit,
        onDelete,
        onSaveActivity,
        onCancelActivity,
        onComplete,
        onDeleteActivity,
      }) {
        return (
          <>
            <ClientCard
              client={client}
              busy={busy}
              onEdit={onEdit}
              onDelete={onDelete}
            />
            <div className="activity-area">
              <ActivityForm
                key={activity?.id || "new"}
                activity={activity || {}}
                busy={busy}
                onSave={onSaveActivity}
                onCancel={onCancelActivity}
              />
              <ActivityList
                activities={client.actividades}
                busy={busy}
                onEdit={setActivity}
                onComplete={onComplete}
                onDelete={onDeleteActivity}
              />
            </div>
          </>
        );
      }

      // Coordinación de estado y servicios. Las reglas de negocio viven en la API.
      function App() {
        const [transport, setTransport] = useState("rest");
        const [draftDirty, setDraftDirty] = useState(false);
        const { clientes: ClientesService, actividades: ActividadesService } =
          servicios[transport];
        const [clients, setClients] = useState([]),
          [query, setQuery] = useState("");
        const [selected, setSelected] = useState(null),
          [mode, setMode] = useState("view");
        const [activity, setActivity] = useState(null),
          [busy, setBusy] = useState(false);
        const [loading, setLoading] = useState(true),
          [detailLoading, setDetailLoading] = useState(false);
        const [error, setError] = useState(""),
          [listFailed, setListFailed] = useState(false),
          [revision, setRevision] = useState(0);
        const selectionRequest = useRef(0);
        const refreshList = () => setRevision((value) => value + 1);
        useEffect(() => {
          const controller = new AbortController();
          setLoading(true);
          setListFailed(false);
          const timer = setTimeout(
            () =>
              ClientesService.listar(query, controller.signal)
                .then((data) => {
                  if (!controller.signal.aborted) setClients(data);
                })
                .catch((error) => {
                  if (
                    !controller.signal.aborted &&
                    error.name !== "AbortError"
                  ) {
                    setError(error.message);
                    setListFailed(true);
                  }
                })
                .finally(() => {
                  if (!controller.signal.aborted) setLoading(false);
                }),
            200,
          );
          return () => {
            clearTimeout(timer);
            controller.abort();
          };
        }, [query, revision, transport]);
        const canLeave = () =>
          (mode === "view" && !activity && !draftDirty) ||
          confirm("¿Descartar los cambios del formulario?");
        async function loadClient(id) {
          const token = ++selectionRequest.current;
          setDetailLoading(true);
          try {
            const client = await ClientesService.obtener(id);
            if (token === selectionRequest.current) {
              setSelected(client);
              setMode("view");
              setActivity(null);
              setDraftDirty(false);
            }
          } finally {
            if (token === selectionRequest.current) setDetailLoading(false);
          }
        }
        async function selectClient(id) {
          if (!canLeave()) return;
          setError("");
          try {
            await loadClient(id);
          } catch (error) {
            setError(error.message);
          }
        }
        function reset(mode = "view") {
          selectionRequest.current++;
          setDetailLoading(false);
          setSelected(null);
          setActivity(null);
          setDraftDirty(false);
          setMode(mode);
        }
        function createClient() {
          if (canLeave()) {
            reset("new");
            setError("");
          }
        }
        async function perform(action) {
          setBusy(true);
          setError("");
          try {
            await action();
          } catch (error) {
            setError(error.message);
          } finally {
            setBusy(false);
          }
        }
        function saveClient(values) {
          perform(async () => {
            const saved = await ClientesService.guardar(
              mode === "new" ? null : selected.id,
              values,
            );
            // Cambia de modo antes de recargar para evitar repetir un alta si falla el GET.
            setSelected({ ...saved, actividades: selected?.actividades || [] });
            setMode("view");
            refreshList();
            await loadClient(saved.id);
          });
        }
        function changeActivity(action) {
          perform(async () => {
            await action();
            setActivity(null);
            await loadClient(selected.id);
          });
        }
        function deleteClient() {
          if (
            confirm(
              `¿Eliminar a ${fullName(selected)} y todas sus actividades?`,
            )
          )
            perform(async () => {
              await ClientesService.eliminar(selected.id);
              reset();
              refreshList();
            });
        }
        function deleteActivity(id) {
          if (confirm("¿Eliminar esta actividad pendiente?"))
            changeActivity(() => ActividadesService.eliminar(selected.id, id));
        }
        function changeTransport(next) {
          if (
            busy ||
            detailLoading ||
            mode !== "view" ||
            activity ||
            draftDirty
          )
            return;
          perform(async () => {
            const service = servicios[next];
            // No cambiar la conexión activa hasta que el destino responda.
            await service.clientes.listar(query);
            let detail = null;
            if (selected) {
              const all = await service.clientes.listar("");
              if (all.some((client) => client.id === selected.id)) {
                detail = await service.clientes.obtener(selected.id);
              }
            }
            selectionRequest.current++;
            setSelected(detail);
            setTransport(next);
          });
        }
        return (
          <Layout
            transport={transport}
            onTransport={changeTransport}
            transportDisabled={
              busy ||
              detailLoading ||
              mode !== "view" ||
              Boolean(activity) ||
              draftDirty
            }
            onDraft={() => setDraftDirty(true)}
            open={Boolean(selected || mode === "new" || detailLoading)}
            error={error}
            onCloseError={() => setError("")}
            master={
              <ClientList
                clients={clients}
                selectedId={selected?.id}
                query={query}
                onQuery={setQuery}
                onSelect={selectClient}
                onCreate={createClient}
                busy={busy}
                loading={loading}
                failed={listFailed}
                onRetry={refreshList}
              />
            }
          >
            <Button
              className="back"
              icon="back"
              disabled={busy}
              onClick={() => {
                if (canLeave()) reset();
              }}
            >
              Volver a clientes
            </Button>
            {detailLoading ? (
              <p className="loading" role="status">
                Cargando ficha…
              </p>
            ) : mode !== "view" ? (
              <ClientForm
                key={mode + selected?.id}
                client={mode === "edit" ? selected : null}
                busy={busy}
                onSave={saveClient}
                onCancel={() => {
                  setMode("view");
                  setDraftDirty(false);
                }}
              />
            ) : selected ? (
              <ClientDetail
                client={selected}
                activity={activity}
                setActivity={(next) => {
                  if (!activity || canLeave()) setActivity(next);
                }}
                busy={busy}
                onEdit={() => {
                  if (canLeave()) {
                    setActivity(null);
                    setMode("edit");
                  }
                }}
                onDelete={deleteClient}
                onSaveActivity={(values) =>
                  changeActivity(() =>
                    ActividadesService.guardar(
                      selected.id,
                      activity?.id,
                      values,
                    ),
                  )
                }
                onComplete={(id) =>
                  changeActivity(() =>
                    ActividadesService.completar(selected.id, id),
                  )
                }
                onCancelActivity={() =>
                  perform(async () => {
                    setActivity(null);
                    await loadClient(selected.id);
                  })
                }
                onDeleteActivity={deleteActivity}
              />
            ) : (
              <EmptyState
                title="Cada cliente, su historia."
                action={
                  <Button variant="primary" icon="add" onClick={createClient}>
                    Agregar cliente
                  </Button>
                }
              >
                Seleccioná un cliente para ver su ficha y organizar el próximo
                contacto.
              </EmptyState>
            )}
          </Layout>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
