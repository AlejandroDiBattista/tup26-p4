<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agenda</title>

  <style>

    body { margin: 0; padding: 32px 20px; font: 16px sans-serif; background: #f5f6f4; }

    main { width: 1104px; max-width: 100%; margin: auto; }

    h1 { margin: 0 0 24px; }

    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }

    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }

    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }

  </style>
</head>
<body>

  <main id="app"></main>
  <script type="module">

    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'

    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')
    
    let alumnosGuardados = localStorage.getItem("alumnos")
    let datosAlumnos
    if (alumnosGuardados) {
      datosAlumnos = JSON.parse(alumnosGuardados)
    } else {
      datosAlumnos = alumnos
      localStorage.setItem("alumnos", JSON.stringify(alumnos))
    }
    const estado = reactive({
      alumnos: datosAlumnos
    })
    watch(() => {
      localStorage.setItem("alumnos", JSON.stringify(estado.alumnos))
    })

    function ordenarAlumnos(alumnos) {
      let alumnosOrdenados = [...alumnos]

      alumnosOrdenados.sort((a, b) => {
        if (a.favorito && !b.favorito) {
          return -1
        }
        if (!a.favorito && b.favorito) {
          return 1
        }
        let comparacionApellido = a.apellido.localeCompare(b.apellido, "es", {
          sensitivity: "base"
        
        
      })
      if (comparacionApellido !==0) {
        return comparacionApellido
      }
      return a.nombre.localeCompare(b.nombre, "es", {
        sensitivity: "base"
      })
    })

      return alumnosOrdenados
    }


    html`
      <h1>Alumnos</h1>
      <ul>
        ${() => ordenarAlumnos(estado.alumnos).map(a => html`
          <li>
            <article>
            <div>${a.favorito ? "Favorito" : "No favorito"}</div>

           <h2> ${a.apellido} </h2>

          <p>${a.nombre}</p>

          <address>
            <p>Telefono: ${a.telefono}</p>
            <p>GitHub: ${a.github}</p>
          </address>
          <footer>
            <p>Comision: ${a.comision}</p>
            <p>Legajo: ${a.legajo}</p>
            </footer>
          </article>
         </li>   

        `)}
      </ul>
    `(app)
  </script>
</body>
</html>
