<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    :root {
      --bg: #edf0ec;
      --panel: #f5f3f1;
      --line: #d5d8d3;
      --line-strong: #c0c5bf;
      --text: #2b2d2b;
      --muted: #5d625f;
      --primary: #2e3d38;
      --favorite: #d6be88;
      --danger: #d85d5d;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body { padding: 18px 20px 40px; }

    .page {
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3.2rem);
      letter-spacing: -0.05em;
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search {
      width: min(320px, 42vw);
      min-width: 200px;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      padding: 0 18px;
      color: var(--text);
    }

    .search::placeholder { color: #7b7e7a; }

    .primary-button {
      min-height: 42px;
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      min-height: 220px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.14);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .name {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.1rem);
      line-height: 1.2;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .favorite-toggle {
      border: none;
      background: transparent;
      color: var(--favorite);
      font-size: 1.6rem;
      cursor: pointer;
      opacity: 0.4;
    }

    .favorite-toggle.is-favorite {
      opacity: 1;
    }

    .card-body {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-style: normal;
    }

    .detail {
      color: var(--text);
      font-size: 1.04rem;
    }

    .detail--github {
      color: var(--muted);
    }

    .card-footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-weight: 600;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 28px 18px;
      text-align: center;
      border: 1px dashed var(--line-strong);
      border-radius: 18px;
      color: var(--muted);
      background: rgba(255,255,255,0.1);
    }
	.modal {
		position: fixed;
		inset: 0;
		display: grid;
		place-items: center;
		padding: 20px;
		background: rgba(43, 45, 43, 0.35);
	}

	.modal[hidden] {
		display: none;
	}

	.modal-content {
		width: min(620px, 100%);
		padding: 0;
		border: 1px solid var(--line);
		border-radius: 18px;
		background: var(--panel);
		box-shadow: 0 12px 32px rgba(43, 45, 43, 0.2);
		overflow: hidden;
	}

	.modal-header {
		padding: 22px 24px 16px;
		border-bottom: 1px solid var(--line);
	}

	.modal-header h2 {
		margin: 0;
		font-size: 1.35rem;
	}

	.modal-header p {
		margin: 4px 0 0;
		color: var(--muted);
	}

	.form {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 10px 14px;
		padding: 18px 24px 20px;
	}

	.form label {
		display: grid;
		gap: 5px;
		color: var(--muted);
		font-size: 0.82rem;
		font-weight: 700;
	}

	.form input {
		width: 100%;
		min-height: 42px;
		padding: 0 12px;
		border: 1px solid var(--line);
		border-radius: 9px;
		background: #fff;
		color: var(--text);
	}

	.form-actions {
		grid-column: 1 / -1;
		display: flex;
		justify-content: space-between;
		align-items: center;
		margin: 8px -24px -20px;
		padding: 12px 24px;
		border-top: 1px solid var(--line);
	}

	.form-actions > div {
		display: flex;
		gap: 8px;
	}

	.form-actions button {
		min-height: 38px;
		padding: 0 16px;
		border: 1px solid var(--line);
		border-radius: 9px;
		background: white;
		color: var(--text);
		font-weight: 700;
		cursor: pointer;
	}

	.form-actions .primary-button {
		border: none;
		background: var(--primary);
		color: white;
	}

	.danger-button {
		color: var(--danger) !important;
	}

	@media (max-width: 600px) {
		.form { grid-template-columns: 1fr; }
	}

    @media (max-width: 920px) {
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <h1 class="title">Agenda</h1>

      <div class="topbar-actions">
        <input 
			class="search" 
			type="search" 
			placeholder="Buscar alumno...">

        <button  id="add-button" class="primary-button" type="button">+ Agregar</button>
      </div>
    </header>

    <section id="app" aria-live="polite"></section>

	<div id="modal" class="modal" hidden>
		<div class="modal-content">
			<header class="modal-header">
				<h2 id="modal-title">Agregar alumno</h2>
				<p id="modal-subtitle">Completá los datos del alumno.</p>
			</header>

			<form id="student-form" class="form">
				<label>Apellido<input name="apellido" required></label>
				<label>Nombre<input name="nombre" required></label>
				<label>Legajo<input name="legajo" required></label>
				<label>Comisión<input name="comision" required></label>
				<label>Teléfono<input name="telefono" required></label>
				<label>GitHub<input name="github" required></label>

				<div class="form-actions">
					<button id="delete-button" class="danger-button" type="button" hidden>
						Eliminar
					</button>

					<div>
						<button id="cancel-button" type="button">Cancelar</button>
						<button class="primary-button" type="submit">Guardar</button>
					</div>
				</div>
			</form>
		</div>
	</div>
  </main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core'
    import alumnosSeed from './alumnos.json' with { type: 'json' }


	const app = document.getElementById('app')
	
	const normalizeText = (value = '') =>
	  String(value)
	    .normalize('NFD')
	    .replace(/[\u0300-\u036f]/g, '')
	    .toLowerCase()
	    .trim()
	
	const sortAlumnos = (items = []) =>
	  [...items].sort((a, b) => {
	    if (Number(a.favorito) !== Number(b.favorito)) {
	      return Number(b.favorito) - Number(a.favorito)
	    }
	
	    const aKey = normalizeText(`${a.apellido} ${a.nombre}`)
	    const bKey = normalizeText(`${b.apellido} ${b.nombre}`)
	
	    return aKey.localeCompare(bKey, 'es', { sensitivity: 'base' })
	  })

	const filteredAlumnos = () => {
		const query = normalizeText(state.search)

		return sortAlumnos(state.alumnos).filter((alumno) => {
			const textoAlumno = normalizeText(`
				${alumno.apellido}
				${alumno.nombre}
				${alumno.telefono}
				${alumno.github}
			`)

			return textoAlumno.includes(query)
		})
	}

	const toggleFavorite = (id) => {
		const alumno = state.alumnos.find((item) => item.id === id)

		if (alumno) {
			alumno.favorito = !alumno.favorito
			persistAlumnos()
		}
	}
  
	const STORAGE_KEY = 'agenda-alumnos'

	const loadAlumnos = () => {
		const savedAlumnos = localStorage.getItem(STORAGE_KEY)	
		if (!savedAlumnos) {
			const alumnosIniciales = sortAlumnos(alumnosSeed)
			localStorage.setItem(STORAGE_KEY, JSON.stringify(alumnosIniciales))
			return alumnosIniciales
		}	
		try {
			const alumnosGuardados = JSON.parse(savedAlumnos)
			return Array.isArray(alumnosGuardados)
		    	? alumnosGuardados
		    	: sortAlumnos(alumnosSeed)
		} catch {
			return sortAlumnos(alumnosSeed)
		}
	}

	const persistAlumnos = () => {
		localStorage.setItem(STORAGE_KEY, JSON.stringify(state.alumnos))
	}

	const state = reactive({
	  	alumnos: loadAlumnos(),
	  	search: ''
	})

	const searchInput = document.querySelector('.search')

	searchInput.addEventListener('input', (event) => {
		state.search = event.target.value
	})

	const modal = document.querySelector('#modal')
	const addButton = document.querySelector('#add-button')
	const cancelButton = document.querySelector('#cancel-button')
	const studentForm = document.querySelector('#student-form')
	const modalTitle = document.querySelector('#modal-title')
	const modalSubtitle = document.querySelector('#modal-subtitle')
	const deleteButton = document.querySelector('#delete-button')

	let editingId = null

	const openEditModal = (alumno) => {
		editingId = alumno.id

		modalTitle.textContent = 'Editar alumno'
		modalSubtitle.textContent = 'Actualizá los datos del alumno.'
		deleteButton.hidden = false

		for (const [campo, valor] of Object.entries(alumno)) {
			const input = studentForm.elements[campo]

			if (input) {
				input.value = valor
			}
		}

		modal.hidden = false
	}

	addButton.addEventListener('click', () => {
		editingId = null
		modalTitle.textContent = 'Agregar alumno'
		modalSubtitle.textContent = 'Completá los datos del alumno.'
		deleteButton.hidden = true
		studentForm.reset()
		modal.hidden = false
	})

	cancelButton.addEventListener('click', () => {
		editingId = null
  		modalTitle.textContent = 'Agregar alumno'
  		modalSubtitle.textContent = 'Completá los datos del alumno.'
  		deleteButton.hidden = true
  		studentForm.reset()
  		modal.hidden = true
	})

	deleteButton.addEventListener('click', () => {
		if (editingId === null) {
			return	
		}

		const confirmar = confirm('¿Queres eliminar este alumno?')

		if (!confirmar) {
			return
		}

		state.alumnos = state.alumnos.filter(
			(alumno) => alumno.id !== editingId
		)

		persistAlumnos()

		editingId = null
		modalTitle.textContent = 'Agregar alumno'
		modalSubtitle.textContent = 'Completá los datos del alumno.'
		deleteButton.hidden = true
		studentForm.reset()
		modal.hidden = true
	})

	studentForm.addEventListener('submit', (event) => {
		event.preventDefault()

		const formData = new FormData(studentForm)

		  const datosAlumno = {
		    legajo: formData.get('legajo'),
		    apellido: formData.get('apellido'),
		    nombre: formData.get('nombre'),
		    comision: formData.get('comision'),
		    telefono: formData.get('telefono'),
		    github: formData.get('github')
		  }
	  
		  if (editingId !== null) {
		    state.alumnos = state.alumnos.map((alumno) =>
		      alumno.id === editingId
		        ? { ...alumno, ...datosAlumno }
		        : alumno
		    )
		  } else {
		    const nuevoAlumno = {
		      id: Math.max(...state.alumnos.map((alumno) => alumno.id)) + 1,
		      ...datosAlumno,
		      favorito: false
		    }
		
		    state.alumnos = [...state.alumnos, nuevoAlumno]
		  }
		  persistAlumnos()

		  editingId = null
		  modalTitle.textContent = 'Agregar alumno'
		  modalSubtitle.textContent = 'Completá los datos del alumno.'
		  deleteButton.hidden = true
		  studentForm.reset()
		  modal.hidden = true
	})
	
	const renderAlumnos = () => html`
	  <div class="card-grid">
	    ${() => filteredAlumnos().map(alumno => html`
	      <article class="card" data-alumno-id="${alumno.id}">
	        <header class="card-header">
	          <h2 class="name">${alumno.apellido} ${alumno.nombre}</h2>

	          <button
	            type="button"
	            class="${alumno.favorito ? 'favorite-toggle is-favorite' : 'favorite-toggle'}"
	            @click="${() => toggleFavorite(alumno.id)}">
	            ★
	          </button>
	        </header>

	        <div class="card-body">
	          <span class="detail">${alumno.telefono}</span>
	          <span class="detail detail--github">@${alumno.github}</span>
	        </div>

	        <footer class="card-footer">
	          ${alumno.comision} . ${alumno.legajo}
	        </footer>
	      </article>
	    `)}
	  </div>
	`
	renderAlumnos()(app)

	app.addEventListener('click', (event) => {
		const card = event.target.closest('.card')

		if (!card || event.target.closest('.favorite-toggle')) {
			return
		}

		const alumnoId = Number(card.dataset.alumnoId)
		const alumno = state.alumnos.find((item) => item.id === alumnoId)

		if (alumno) {
			openEditModal(alumno)
		}
	})
  </script>
</body>
</html>
