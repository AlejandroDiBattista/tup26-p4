<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Reactiva -  Programación C:1</title>

  <script>
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }
  </script>

  <style>
    :root {
      --primary: #2536eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --star: #f59e0b;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --randius: 0.5rem;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 2rem;
    }
    
    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);

      .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: space-between;
        align-items: center;

        h1 {
          font-size: 1.5rem;
          font-weight: 700;
        }

        .controls {
          display: flex;
          gap: 1rem;
          flex: 1;
          max-width: 500px;

          input[type="search"] {
            flex: 1;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--randius);
            font-size: 1rem;
            outline: none;

            &:focus {
              background-color: var(--primary);
              color: white;
              border: none;
              padding: 0.5rem 1.25rem;
              border-radius: var(--randius);
              font-weight: 600;
              cursor: pointer;
              white-space: nowrap;

              a:hover {
                background-color: var(--primary-hover);
              }
            }
          }
        }
      }

      main { 
        max-width: 1200px; 
        margin: auto; 
        padding: 0 1.5rem;

        .empty-state {
          text-align: center;
          padding: 4rem 1rem;
          color: var(--text-muted);
          font-size: 1.125rem;
        }

        .cards-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
          gap: 1.5rem;

          article.card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--randius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            transition: trsnform 0.15s ease, box-shadow 0.15s ease;

            &:hover, &:focus-visible {
              transform: translateY(-2px);
              box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
              outline: 2px solid var(--primary);
            }

            .fav-btn {
              position: absolute;
              top: 1rem;
              right: 1rem;
              background: none;
              border: none;
              font-size: 1.5rem;
              cursor: pointer;
              color: #cbd5e1;
              line-height: 1;

              &.is-fav {
                color: var(--star);
              }

              &.focus-visible {
                outline: 2px solid var(--primary);
                border-radius: 4px;
              }
            }

            .card-header {
              padding-right: 2rem;
              margin-bottom: 0.75rem;

              h2 {
                font-size: 1.25rem;
                font-weight: 600;
                line-height: 1.3;
              }
            }

            .card-body {
              font-size: 0.9rem;
              color: var(--text-muted);

              p {
                margin-bottom: 0.25rem;
              }

              address {
                font-style: normal;
                margin-top: 0.5rem;
                border-top: 1px solid var(--border);
                padding-top: 0.5rem;

                a {
                  color: var(--primary);
                  text-decoration: none;

                  &:hover {
                    text-decoration: underline;
                  }
                }
              }
            }

            footer.card-tags {
              margin-top: 1rem;
              display: flex;
              gap: 0.5rem;

              .badge {
                background-color: #eff6ff;
                color: var(--primary);
                font-size: 0.75rem;
                font-weight: 600;
                padding: 0.25rem 0.5rem;
                border-radius: 0.25rem;
              }
            }
          }
        }
      }

      

    }
    h1 { margin: 0 0 24px; }
    ul { display: grid; grid-template-columns: repeat(3, 360px); justify-content: center; gap: 12px; padding: 0; list-style: none; }
    li { min-width: 0; padding: 20px; border: 1px solid #d9ded9; border-radius: 16px; background: white; text-align: center; }
    @media (max-width: 1120px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { ul { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  
  <header>
    <div class="header-container">
      <h1>Agenda de Alumnos</h1>
      <div class="controls">
        <input 
          type="text"
          id="search-input"
          placeholder="Buscar por nombre, apellido, legajo"
          aria-label="Buscar alumnos"
          >
        <button id="btn-add" class="btn-primary">Agregar</button>
      </div>
    </div>
  </header>

  <main>
    <section id="app.container"></section>
  </main>

  <dialog id="student-dialog">
    <form id="student_form" method="dialog">
      <h2 id="dialog-title">Alumno</h2>
      <input type="hidden" name="id" id="field-id">

      <div class="form group">
        <label for="field-apellido">Apellido</label>
        <input type="text" id="field-apellido" name="apellido" required>
      </div>

      <div class="form-group">
        <label for="field-nombre">Nombre</label>
        <input type="text" id="field-nombre" name="nombre" required>
      </div>

      <div class="form-group">
        <label for="field-legajo">Legajo</label>
        <input type="text" id="field-legajo" name="legajo" required>
      </div>

      <div class="form-group">
        <label for="field-comision">Comisión</label>
        <input type="text" id="field-comision" name="comision" required>
      </div>

      <div class="form-group">
        <label for="field-telefono">Teléfono</label>
        <input type="tel" id="field-telefono" name="telefono" required>
      </div>

      <div class="form-group">
        <label for="field-github">Usuario de GitHub</label>
        <input type="text" id="field-github" name="github" required>
      </div>

      <div class="dialog=actions">
        <button type="button" id="btn-delete" class="btn-danger">Eliminar</button>
        <button type="button" id="btn-cancel" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-submit">Guardar</button>
      </div>
    </form>
  </dialog>
  
  <script type="module">
    const STORAGE_KEY = 'agenda_alumnos_data';
    const { reactive, html } = Arrow;

    const state = reactive ({
      alumnos: [],
      searchQuery: ''
    });

    async function initData() {
      const storedData = localStorage.getItem(STORAGE_KEY);
      if (storedData) {
        state.alumnos = JSON.parse(storedData);
      } else {
        try {
          const response = await fetch('./alumnos.json');
          if (response.ok) {
            const data = await response.json();
            state.alumnos = data;
            saveData();
          } else {
            console.warn('No se pudo cargar los alumnos automáticamente..');
          }
        } catch (err) {
          console.error('Error al cargar alumnos', err);
        }
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.alumnos));
    }


    function toggleFavorite(id, e) {
      if (e) e.stopPropagation();
      state.alumnos = state.alumnos.map(al =>
        al.id === id ? { ...al, favorito: !al.favorito } : al
      );
      saveData();
    } 
    
    function saveStudent(studentData) {
      if (studentData.id) {
        state.alumnos = state.alumnos.map(al =>
        al.id === studentData.id ? { ...al, ...studentData } : al
      );
      } else {
      const newStudent = {
        ...studentData,
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        favorito: false
      };
      state.alumnos = [...state.alumnos, newStudent];
    }
    saveData();
  }

  function deleteStudent(id) {
    state.alumnos = state.alumnos.filter(al => al.id !== id);
    saveData();
  }



  </script>
</body>
</html>
