<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Reactiva -  Programación C:1</title>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #172033;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 14px;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding-bottom: 2rem;
      color: var(--text);
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #e0f2fe 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 1.25rem 2rem;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(12px);
    }

    .header-container {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    h1 { color: var(--text); font-size: clamp(1.35rem, 3vw, 1.8rem); letter-spacing: -0.03em; }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: min(100%, 540px);
    }

    #search-input {
      min-width: 0;
      flex: 1;
      height: 42px;
      padding: 0 1rem;
      color: var(--text);
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: 0.2s ease;
    }

    #search-input:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    button { font: inherit; }

    .btn-primary, .btn-submit {
      height: 42px;
      padding: 0 1.1rem;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-primary:hover, .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    main { max-width: 1180px; margin: 0 auto; padding: 2rem; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    article.card {
      min-height: 190px;
      position: relative;
      padding: 1.35rem;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    article.card:hover, article.card:focus-visible {
      border-color: #a5b4fc;
      box-shadow: 0 16px 30px rgba(79, 70, 229, 0.14);
      transform: translateY(-5px);
      outline: none;
    }

    .card-header h2 { padding-right: 2rem; color: var(--text); font-size: 1.15rem; }
    .card-body { margin-top: 0.75rem; color: var(--text-muted); font-size: 0.9rem; }

    .card-body address {
      margin-top: 0.8rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-style: normal;
    }

    .card-body a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .card-body a:hover { text-decoration: underline; }

    footer.card-tags { margin-top: 1.1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .badge {
      padding: 0.3rem 0.6rem;
      color: #4338ca;
      background: #eef2ff;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .fav-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      color: #cbd5e1;
      background: transparent;
      border: 0;
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .fav-btn:hover, .fav-btn.is-fav { color: #f59e0b; transform: scale(1.12); }
    .empty-state { padding: 4rem 1rem; color: var(--text-muted); text-align: center; }

    dialog#student-dialog {
      width: min(100% - 2rem, 500px);
      margin: auto;
      padding: 0;
      background: #fff;
      border: 0;
      border-radius: var(--radius);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
    }

    dialog#student-dialog::backdrop { background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px); }
    dialog form { padding: 1.5rem; }
    dialog h2 { margin-bottom: 1.25rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; font-weight: 700; }

    .form-group input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .dialog-actions button {
      padding: 0.6rem 1rem;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-secondary { color: var(--text); background: transparent; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #f1f5f9; }
    .btn-danger { margin-right: auto; color: #fff; background: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }

    @media (max-width: 680px) {
      header { padding: 1rem; }
      .header-container, .controls { align-items: stretch; flex-direction: column; }
      .controls { width: 100%; }
      main { padding: 1.25rem 1rem; }
    }
  </style>
</head>
<body>
  
  <header>
    <div class="header-container">
      <h1>Agenda de Alumnos</h1>
      <div class="controls">
        <input 
          type="search"
          id="search-input"
          placeholder="Buscar por nombre, apellido, legajo"
          aria-label="Buscar alumnos"
          >
        <button id="btn-add" class="btn-primary">Agregar</button>
      </div>
    </div>
  </header>

  <main>
    <section id="app-container"></section>
  </main>

  <dialog id="student-dialog">
    <form id="student_form" method="dialog">
      <h2 id="dialog-title">Alumno</h2>
      <input type="hidden" name="id" id="field-id">

      <div class="form-group">
        <label for="field-apellido">Apellido</label>
        <input type="text" id="field-apellido" name="apellido" required>
      </div>

      <div class="form-group">
        <label for="field-nombre">Nombre</label>
        <input type="text" id="field-nombre" name="nombre" required>
      </div>

      <div class="form-group">
        <label for="field-legajo">Legajo</label>
        <input type="text" id="field-legajo" name="legajo" required>
      </div>

      <div class="form-group">
        <label for="field-comision">Comisión</label>
        <input type="text" id="field-comision" name="comision" required>
      </div>

      <div class="form-group">
        <label for="field-telefono">Teléfono</label>
        <input type="tel" id="field-telefono" name="telefono" required>
      </div>

      <div class="form-group">
        <label for="field-github">Usuario de GitHub</label>
        <input type="text" id="field-github" name="github" required>
      </div>

      <div class="dialog-actions">
        <button type="button" id="btn-delete" class="btn-danger">Eliminar</button>
        <button type="button" id="btn-cancel" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-submit">Guardar</button>
      </div>
    </form>
  </dialog>
  
  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core';

    const STORAGE_KEY = 'agenda_alumnos_data';

    const state = reactive ({
      alumnos: [],
      searchQuery: ''
    });

    async function initData() {
      const storedData = localStorage.getItem(STORAGE_KEY);
      if (storedData) {
        state.alumnos = JSON.parse(storedData);
      } else {
        try {
          const response = await fetch('./alumnos.json');
          if (response.ok) {
            const data = await response.json();
            state.alumnos = data;
            saveData();
          } else {
            console.warn('No se pudo cargar los alumnos automáticamente..');
          }
        } catch (err) {
          console.error('Error al cargar alumnos', err);
        }
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.alumnos));
    }


    function toggleFavorite(id, e) {
      if (e) e.stopPropagation();
      const alumno = state.alumnos.find(al => String(al.id) === String(id));
      if (!alumno) return;

      alumno.favorito = !alumno.favorito;
      state.alumnos = [...state.alumnos];
      saveData();
    } 
    
    function saveStudent(studentData) {
      if (studentData.id) {
        state.alumnos = state.alumnos.map(al =>
        al.id === studentData.id ? { ...al, ...studentData } : al
      );
      } else {
      const newStudent = {
        ...studentData,
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
        favorito: false
      };
      state.alumnos = [...state.alumnos, newStudent];
    }
    saveData();
  }

  function deleteStudent(id) {
    state.alumnos = state.alumnos.filter(al => al.id !== id);
    saveData();
  }

  function getFilteredAndSortedStudents() {
    const query = state.searchQuery.toLowerCase().trim();
    const filtered = state.alumnos.filter(al => {
      if (!query) return true;
      return (
        al.nombre.toLowerCase().includes(query) ||
        al.apellido.toLowerCase().includes(query) ||
        al.legajo.toString().toLowerCase().includes(query) ||
        al.comision.toLowerCase().includes(query)
      );
    });

    return filtered.sort((a, b) => {
      if (a.favorito !== b.favorito) {
        return a.favorito ? -1 : 1;
      }
      const cmpApellido = a.apellido.localeCompare(b.apellido, 'es', { sensitivity: 'base' });
      if (cmpApellido !== 0) return cmpApellido;
      return a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' });
    });
  }

  const cardTemplate = (alumno) => html`
  <article
    class="card"
    tabindex="0"
    role="button"
    aria-label="${() => `Editar a ${alumno.apellido},${alumno.nombre}`}"
    @click="${() => openEditDialog(alumno)}"
    @keydown="${(e) => {
      if (e.key === 'Enter') openEditDialog(alumno);
      if (e.key === ' '){
        e.preventDefault();
        toggleFavorite(alumno.id);
      }
    }}"
  >
    <button
    type="button"
    class="${() => `fav-btn ${alumno.favorito ? 'is-fav' : ''}`}"
    title="Marcar favorito"
    aria-label="Marcar como favorito"
    @click="${(e) => toggleFavorite(alumno.id, e)}"
    >★</button>

    <div class="card-header">
      <h2>${() => `${alumno.apellido},${alumno.nombre}`}</h2>
    </div>

    <div class="card-body">
      <p><strong>Teléfono:</strong> ${() => alumno.telefono}</p>
      <address>
        <strong>GitHub:</strong>
        <a
          href="${() => `https://github.com/${alumno.github}`}"
          target="_blank"
          rel="noopener noreferrer"
          @click="${(e) => e.stopPropagation()}"
        >@${() => alumno.github}</a>
      </address>
    </div>

    <footer class="card-tags">
      <span class="badge">Comisión ${() => alumno.comision}</span>
      <span class="badge">Legajo: ${() => alumno.legajo}</span>
    </footer>
  </article>  
    `;

    const appTemplate = html `
    ${() => {
      const students = getFilteredAndSortedStudents();
      if (students.length === 0){
        return html `<p class="empty-state">No hay alumnos para mostrar.</p>`;
    }
    return html`
      <div class="cards-grid">
        ${students.map(student => cardTemplate(student))}
      </div>
    `;
  }}
`;

appTemplate(document.getElementById('app-container'));

const dialog = document.getElementById('student-dialog');
const form = document.getElementById('student_form');
const dialogTitle = document.getElementById('dialog-title');
const btnDelete = document.getElementById('btn-delete');
const btnCancel = document.getElementById('btn-cancel');
const searchInput = document.getElementById('search-input');
const btnAdd = document.getElementById('btn-add');

searchInput.addEventListener('input', (e) => {
  state.searchQuery = e.target.value;
});

btnAdd.addEventListener('click', () => {
  form.reset();
  document.getElementById('field-id').value = '';
  dialogTitle.textContent = 'Agregar Alumno';
  btnDelete.style.display = 'none';
  dialog.showModal();
});

function openEditDialog(alumno){
  dialogTitle.textContent = 'Editar Alumno';
  document.getElementById('field-id').value = alumno.id;
  document.getElementById('field-apellido').value = alumno.apellido;
  document.getElementById('field-nombre').value = alumno.nombre;
  document.getElementById('field-legajo').value = alumno.legajo;
  document.getElementById('field-comision').value = alumno.comision;
  document.getElementById('field-telefono').value = alumno.telefono;
  document.getElementById('field-github').value = alumno.github;

  btnDelete.style.display = 'block';
  dialog.showModal();
}

btnCancel.addEventListener('click', () => {
  dialog.close();
});

btnDelete.addEventListener('click', () => {
  const id = document.getElementById('field-id').value;
  if (id) {
    deleteStudent(id);
    dialog.close();
  }
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const formData = new FormData(form);
  const studentData = {
    id: formData.get('id') || undefined,
    apellido: formData.get('apellido').trim(),
    nombre: formData.get('nombre').trim(),
    legajo: formData.get('legajo').trim(),
    comision: formData.get('comision').trim(),
    telefono: formData.get('telefono').trim(),
    github: formData.get('github').trim()
  };
  
  saveStudent(studentData);
  dialog.close();
});

initData();

  </script>
</body>
</html>
