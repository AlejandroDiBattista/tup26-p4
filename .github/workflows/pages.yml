name: Publicar pantallas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preparar la página
        run: |
          mkdir public
          cp pantallas.html public/index.html
          touch public/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cargar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
