<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contactos</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 24px;
                overflow: hidden;
                color: #26332f;
                background-color: #eef2ef;
                font-family: "Avenir Next", "Segoe UI", sans-serif;
            }
            ul {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            main {
                display: flex;
                height: calc(100vh - 48px);
                overflow: hidden;
                border: 1px solid #d6ded9;
                border-radius: 16px;
                background-color: #fafbf9;
                aside {
                    display: flex;
                    flex: 1;
                    min-width: 0;
                    min-height: 0;
                    flex-direction: column;
                    overflow: hidden;
                    color: #f3f6f4;
                    background-color: #29433b;

                    input {
                        flex: none;
                        width: calc(100% - 20px);
                        margin: 10px;
                        padding: 12px;
                        border: 0;
                        border-radius: 8px;
                        outline: none;
                        color: #26332f;
                        background-color: #f8faf8;
                        font: inherit;
                        transition: box-shadow 180ms ease-out;

                        &:focus {
                            box-shadow: 0 0 0 3px #f4d35e80;
                        }
                    }

                    nav {
                        flex: 1;
                        min-height: 0;
                        overflow-y: auto;

                        ul {
                            outline: none;

                            li {
                                margin: 0;
                                padding: 13px 16px;
                                border-bottom: 1px solid #ffffff18;
                                overflow-wrap: anywhere;

                                &[data-indice] {
                                    cursor: pointer;
                                    transition: color 160ms ease-out, background-color 160ms ease-out, transform 160ms ease-out;

                                    &:not(.seleccionado):hover {
                                        background-color: #35564c;
                                    }

                                    &:active {
                                        transform: scale(0.98);
                                    }
                                }

                                &.seleccionado {
                                    color: #26332f;
                                    background-color: #f4d35e;
                                    font-weight: 600;
                                    box-shadow: inset 4px 0 #26332f;
                                }
                            }
                        }
                    }
                }
                section {
                    flex: 2;
                    min-width: 0;
                    padding: 48px;
                    overflow-y: auto;
                    background-color: #fafbf9;

                    article > * {
                        animation: aparecer 200ms ease-out both;
                    }

                    h2 {
                        margin: 0 0 32px;
                        font-size: 32px;
                        font-weight: 600;
                        overflow-wrap: anywhere;
                    }
                    p {
                        margin: 24px 0 4px;
                        color: #718079;
                        font-size: 13px;
                        font-weight: 600;
                    }
                    strong {
                        font-size: 18px;
                        font-weight: 500;
                        overflow-wrap: anywhere;
                    }

                }
            }

            @keyframes aparecer {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                input,
                li,
                article > * {
                    animation: none;
                    transition: none;
                }
            }
        </style>

    </head>
    <body>
        <main>
            <aside>
                <input id="buscar" type="search" maxlength="100" aria-label="Buscar contactos">
                <nav>
                    <ul id="maestro" tabindex="0" aria-label="Lista de contactos"></ul>
                </nav>
            </aside>
            <section>
                <article id="detalle" aria-live="polite">
                </article>
            </section>
        </main>
        <script>
            let seleccionado = 0;
            let filtrados = contactos;
            let buscar = document.getElementById("buscar");
            let maestro = document.getElementById("maestro");
            let detalle = document.getElementById("detalle");

            function escapar(valor) {
                return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                })[caracter]);
            }

            function ItemContacto(contacto, seleccionado, indice) {
                let nombre = [contacto.nombre, contacto.apellido].filter(Boolean).join(" ") || "Contacto sin nombre";
                return `<li data-indice="${indice}" class="${seleccionado ? "seleccionado" : ""}">${escapar(nombre)}</li>`;
            }

            function ListarContactos(contactos) {
                if (contactos.length == 0) {
                    return `<li>No hay resultados. Probá con otra búsqueda.</li>`;
                }

                let lista = contactos.map((contacto, i) => ItemContacto(contacto, i == seleccionado, i));
                return lista.join("\n");
            }

            function DetalleContacto(contacto) {
                if (!contacto) {
                    return `<p>No se encontraron contactos</p>`;
                }

                let nombre = [contacto.apellido, contacto.nombre].filter(Boolean).join(" ") || "Contacto sin nombre";
                return `
                    <h2>${escapar(nombre)}</h2>
                    <p>Teléfono</p>
                    <strong>${escapar(contacto.telefono || "Sin teléfono")}</strong>
                    <p>Email</p>
                    <strong>${escapar(contacto.email || "Sin correo electrónico")}</strong>`;
            }

            function render(enfocar = false) {
                maestro.innerHTML = ListarContactos(filtrados);
                detalle.innerHTML = DetalleContacto(filtrados[seleccionado]);
                maestro.querySelector(".seleccionado")?.scrollIntoView({ block: "nearest" });

                if (enfocar) {
                    maestro.focus({ preventScroll: true });
                }
            }

            render();

            function normalizar(texto) {
                return String(texto ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            }

            buscar.addEventListener("input", () => {
                let texto = normalizar(buscar.value);
                filtrados = contactos.filter(contacto =>
                    normalizar(`${contacto.nombre ?? ""} ${contacto.apellido ?? ""}`).includes(texto)
                );
                seleccionado = 0;
                render();
            });

            buscar.addEventListener("keydown", (e) => {
                if (e.key == "Escape") {
                    e.preventDefault();
                    buscar.value = "";
                    buscar.dispatchEvent(new Event("input"));
                }

                if (e.key == "Enter" && filtrados.length > 0) {
                    e.preventDefault();
                    maestro.focus({ preventScroll: true });
                }
            });

            maestro.addEventListener("keydown", (e) => {
                if (e.key == "Escape" || e.key == "Enter") {
                    buscar.focus({ preventScroll: true });
                    return;
                }

                if (e.key != "ArrowDown" && e.key != "ArrowUp") {
                    return;
                }

                e.preventDefault();

                if (e.key == "ArrowDown") seleccionado += 1;
                if (e.key == "ArrowUp") seleccionado -= 1;

                seleccionado = Math.max(0, Math.min(seleccionado, filtrados.length - 1));
                render(true);
            });

            maestro.addEventListener("click", (e) => {
                let item = e.target.closest("li");

                if (!item) {
                    return;
                }

                let indice = Number(item.dataset.indice);

                if (!Number.isInteger(indice) || !filtrados[indice]) {
                    return;
                }

                seleccionado = indice;
                render(true);
            });
        </script>
    </body>
</html>
