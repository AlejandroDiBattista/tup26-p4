<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f1" />
    <title>Clientes · MiniCRM</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202b26; background: #f4f5f1; font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; --tinta: #202b26; --tinta-suave: #65716a; --verde: #245d48; --linea: #e2e6df; }
      * { box-sizing: border-box; }
      body { min-width: 320px; height: 100dvh; margin: 0; overflow: hidden; background: radial-gradient(ellipse at 92% 7%, rgb(211 226 210 / 42%), transparent 28rem), #f4f5f1; }
      button, input { font: inherit; }
      .skip-link { position: absolute; z-index: 5; top: 1rem; left: 1rem; padding: .75rem 1rem; transform: translateY(-180%); border-radius: .5rem; background: var(--tinta); color: white; }
      .skip-link:focus { transform: translateY(0); }
      .app-shell { display: flex; width: min(100% - 3rem, 1440px); height: 100%; flex-direction: column; margin-inline: auto; }
      .topbar { display: flex; min-height: 76px; flex: 0 0 auto; align-items: center; justify-content: space-between; border-bottom: 1px solid rgb(32 43 38 / 9%); }
      .brand { display: inline-flex; align-items: center; gap: .72rem; color: var(--tinta); text-decoration: none; }
      .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: var(--verde); color: #fff; }
      .brand-name { font-size: .96rem; font-weight: 700; letter-spacing: -.035em; }
      .brand-caption { display: block; margin-top: 2px; color: #79847d; font-size: .63rem; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; }
      .connection { display: inline-flex; align-items: center; gap: .55rem; color: #65716a; font-size: .78rem; font-weight: 550; }
      .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: #a7b1aa; }
      .connection[data-state="ready"] .connection-dot { background: #45a777; box-shadow: 0 0 0 3px rgb(69 167 119 / 13%); }
      .connection[data-state="error"] .connection-dot { background: #c27456; box-shadow: 0 0 0 3px rgb(194 116 86 / 13%); }
      main { display: flex; min-height: 0; flex: 1; flex-direction: column; padding: 23px 0 25px; }
      .intro { display: flex; flex: 0 0 auto; align-items: flex-end; justify-content: space-between; gap: 1rem; padding-bottom: 20px; }
      .eyebrow { display: flex; align-items: center; gap: .6rem; margin: 0 0 7px; color: var(--verde); font-size: .66rem; font-weight: 720; letter-spacing: .14em; text-transform: uppercase; }
      .eyebrow-mark { width: 20px; height: 1px; background: #b27c56; }
      h1 { margin: 0; font-family: Iowan Old Style, "Palatino Linotype", "Book Antiqua", Georgia, serif; font-size: clamp(1.8rem, 3vw, 2.55rem); font-weight: 500; letter-spacing: -.055em; line-height: 1; }
      h1 span { color: #758a76; font-style: italic; font-weight: 400; }
      .intro-note { max-width: 330px; margin: 0 2px 2px; color: var(--tinta-suave); font-size: .83rem; line-height: 1.5; text-align: right; }
      .workspace { display: grid; min-height: 0; flex: 1; grid-template-columns: minmax(280px, 350px) minmax(0, 1fr); gap: 16px; }
      .panel { min-width: 0; min-height: 0; overflow: hidden; border: 1px solid #e2e6df; border-radius: 16px; background: rgb(255 255 255 / 87%); box-shadow: 0 12px 35px rgb(39 55 46 / 4%), 0 2px 7px rgb(39 55 46 / 3%); }
      .master { display: flex; flex-direction: column; }
      .master-head { flex: 0 0 auto; padding: 20px 20px 15px; border-bottom: 1px solid var(--linea); }
      .section-label { margin: 0; color: #879188; font-size: .63rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
      h2 { margin: 5px 0 0; font-size: 1.12rem; font-weight: 650; letter-spacing: -.04em; }
      .search-wrap { position: relative; display: block; margin-top: 16px; }
      .search-icon { position: absolute; top: 50%; left: 12px; display: flex; transform: translateY(-50%); color: #89948c; pointer-events: none; }
      .search-input { width: 100%; height: 42px; padding: 0 12px 0 38px; border: 1px solid #e1e7df; border-radius: 10px; outline: 0; background: #f9faf8; color: var(--tinta); font-size: .82rem; transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease; }
      .search-input::placeholder { color: #98a199; }
      .search-input:focus { border-color: #91ad98; background: #fff; box-shadow: 0 0 0 3px rgb(69 120 83 / 11%); }
      .master-meta { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: 12px 20px 9px; color: #89938c; font-size: .7rem; }
      .record-count strong { color: var(--verde); font-weight: 700; }
      .master-list { min-height: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 9px 10px; scrollbar-color: #cbd5cc transparent; scrollbar-width: thin; }
      .client-option { position: relative; display: flex; width: 100%; min-height: 66px; align-items: center; gap: 11px; padding: 10px 11px; border: 0; border-radius: 10px; background: transparent; color: inherit; text-align: left; cursor: pointer; transition: background 140ms ease; }
      .client-option:hover { background: #f6f8f5; }
      .client-option[aria-pressed="true"] { background: #edf3ed; }
      .client-option[aria-pressed="true"]::before { position: absolute; top: 13px; bottom: 13px; left: 0; width: 3px; border-radius: 3px; background: var(--verde); content: ""; }
      .avatar { display: grid; width: 39px; height: 39px; flex: 0 0 auto; place-items: center; border-radius: 12px; background: #e8eee5; color: #456650; font-family: Georgia, serif; font-size: .91rem; letter-spacing: .015em; }
      .client-option:nth-child(4n + 2) .avatar { background: #f1e9de; color: #906747; }
      .client-option:nth-child(4n + 3) .avatar { background: #e7edf0; color: #4b6d78; }
      .client-option:nth-child(4n + 4) .avatar { background: #eee8f0; color: #745d7c; }
      .client-identity { min-width: 0; flex: 1; }
      .client-name { display: block; overflow: hidden; margin: 0; color: #26342d; font-size: .86rem; font-weight: 650; letter-spacing: -.02em; text-overflow: ellipsis; white-space: nowrap; }
      .client-email { display: block; overflow: hidden; margin: 4px 0 0; color: #78827b; font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
      .client-number { align-self: flex-start; color: #a0a9a1; font-size: .65rem; font-variant-numeric: tabular-nums; letter-spacing: .035em; }
      .detail { display: flex; flex-direction: column; }
      .detail-head { display: flex; flex: 0 0 auto; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 23px 27px 20px; border-bottom: 1px solid var(--linea); }
      .detail-title { min-width: 0; margin: 6px 0 0; overflow-wrap: anywhere; font-family: Iowan Old Style, "Palatino Linotype", "Book Antiqua", Georgia, serif; font-size: clamp(1.8rem, 3vw, 2.55rem); font-weight: 500; letter-spacing: -.05em; line-height: 1.06; }
      .detail-id { flex: 0 0 auto; margin-top: 2px; padding: 7px 10px; border: 1px solid #e3e9e2; border-radius: 8px; background: #f8faf7; color: #768279; font-size: .72rem; font-variant-numeric: tabular-nums; font-weight: 650; }
      .profile { display: grid; flex: 0 0 auto; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 26px; padding: 18px 27px 20px; border-bottom: 1px solid var(--linea); }
      .profile-item { min-width: 0; }
      .profile-label { display: block; margin-bottom: 5px; color: #96a098; font-size: .62rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
      .profile-value { overflow: hidden; color: #3d4a42; font-size: .84rem; text-overflow: ellipsis; white-space: nowrap; }
      .activities-head { display: flex; flex: 0 0 auto; align-items: baseline; justify-content: space-between; gap: 1rem; padding: 18px 27px 9px; }
      .activities-head h3 { margin: 0; font-size: .93rem; font-weight: 650; letter-spacing: -.02em; }
      .activities-count { color: #8a958d; font-size: .7rem; }
      .activities-list { min-height: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 2px 27px 20px; scrollbar-color: #cbd5cc transparent; scrollbar-width: thin; }
      .activity { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-bottom: 1px solid #eef0ec; }
      .activity:last-child { border-bottom: 0; }
      .activity-marker { width: 8px; height: 8px; margin-top: 6px; border: 1.5px solid #a7b2a8; border-radius: 50%; }
      .activity[data-completa="true"] .activity-marker { border-color: #4e8964; background: #4e8964; box-shadow: inset 0 0 0 2px #fff; }
      .activity-description { margin: 0; color: #344139; font-size: .84rem; font-weight: 560; line-height: 1.45; }
      .activity-meta { display: flex; flex-wrap: wrap; gap: 5px 15px; margin-top: 7px; color: #89938c; font-size: .69rem; line-height: 1.4; }
      .activity-status { color: #8a7558; }
      .activity[data-completa="true"] .activity-status { color: #4b8060; }
      .state-panel { display: grid; min-height: 180px; flex: 1; justify-items: center; align-content: center; padding: 28px 20px; text-align: center; }
      .state-icon { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid #e4e9e2; border-radius: 14px; background: #f8faf7; color: #668270; }
      .state-title { margin: 13px 0 0; font-size: .98rem; font-weight: 650; letter-spacing: -.025em; }
      .state-copy { max-width: 340px; margin: 6px 0 0; color: #7b857e; font-size: .8rem; line-height: 1.55; }
      .retry-button { margin-top: 15px; padding: .56rem .9rem; border: 1px solid #cbd8ce; border-radius: 9px; background: #fff; color: #345b46; cursor: pointer; font-size: .78rem; font-weight: 620; }
      .retry-button:hover { border-color: #aabfae; background: #f7faf6; }
      .loading-line { height: 48px; margin: 6px 0; border-radius: 9px; background: linear-gradient(100deg, #fff 25%, #f3f5f1 40%, #fff 55%); background-size: 220% 100%; animation: shimmer 1.5s ease-in-out infinite; }
      @keyframes shimmer { to { background-position-x: -220%; } }
      :focus-visible { outline: 3px solid #83a88e; outline-offset: 2px; }
      @media (max-width: 760px) {
        .app-shell { width: min(100% - 1.5rem, 620px); }
        .topbar { min-height: 65px; }
        main { padding: 17px 0; }
        .intro { align-items: flex-start; flex-direction: column; gap: 6px; padding-bottom: 13px; }
        .intro-note { margin: 0; text-align: left; }
        .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(155px, 32%) minmax(0, 1fr); gap: 10px; }
        .master-head { padding: 13px 14px 11px; }
        .master-head h2 { font-size: 1rem; }
        .search-wrap { margin-top: 10px; }
        .search-input { height: 38px; }
        .master-meta { padding: 7px 14px 4px; }
        .master-list { padding-inline: 6px; }
        .client-option { min-height: 54px; padding-block: 7px; }
        .avatar { width: 34px; height: 34px; }
        .detail-head { padding: 15px 17px 13px; }
        .detail-title { font-size: clamp(1.65rem, 7vw, 2.2rem); }
        .profile { gap: 10px 14px; padding: 12px 17px 14px; }
        .profile-value { font-size: .78rem; }
        .activities-head { padding: 13px 17px 7px; }
        .activities-list { padding: 2px 17px 12px; }
      }
      @media (max-width: 390px) {
        .app-shell { width: min(100% - 1rem, 620px); }
        .connection { font-size: .68rem; }
        .brand-caption { font-size: .58rem; }
        .intro-note { font-size: .75rem; }
        .detail-head { gap: .5rem; }
        .detail-id { padding: 6px 8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div id="raiz"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

    <script id="codigo-react" type="text/plain">
      const { useEffect, useMemo, useState } = React;
      const { createRoot } = ReactDOM;

      const iconos = {
        marca: <><path d="M7 18c0-6 4-11 11-13-1 7-5 12-11 13Z" /><path d="M7 18c2-4 5-6 9-8" /><path d="M6 20h12" /></>,
        buscar: <><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></>,
        correo: <><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></>,
        telefono: <><path d="M7 3h3l2 5-2.2 1.7a15 15 0 0 0 4.5 4.5L16 12l5 2v3a2 2 0 0 1-2.2 2A17 17 0 0 1 5 5.2 2 2 0 0 1 7 3Z" /></>,
        personas: <><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="10" cy="7" r="4" /><path d="M20 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" /></>,
        vacio: <><rect x="4" y="5" width="16" height="15" rx="3" /><path d="M8 9h8M8 13h5" /><path d="m16 17 1.5 1.5L21 15" /></>,
        error: <><path d="M12 3 2.8 19h18.4L12 3Z" /><path d="M12 9v4m0 3h.01" /></>
      };

      function Icono({ nombre, tamano = 18 }) {
        return <svg aria-hidden="true" width={tamano} height={tamano} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.65" strokeLinecap="round" strokeLinejoin="round">{iconos[nombre]}</svg>;
      }

      function Iniciales({ cliente }) {
        const nombre = [...(cliente.nombre || "")][0] || "?";
        const apellido = [...(cliente.apellido || "")][0] || "";
        return <span className="avatar" aria-hidden="true">{nombre}{apellido}</span>;
      }

      function textoNormalizado(valor) {
        return String(valor ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("es");
      }

      function fechaLegible(valor, incluirHora = false) {
        if (!valor) return "Sin fecha";
        const fecha = new Date(incluirHora ? valor : valor + "T00:00:00");
        if (Number.isNaN(fecha.getTime())) return valor;
        return new Intl.DateTimeFormat("es-AR", incluirHora
          ? { dateStyle: "medium", timeStyle: "short" }
          : { dateStyle: "medium", timeZone: "UTC" }).format(fecha);
      }

      function PanelEstado({ tipo, mensaje, reintentar }) {
        const error = tipo === "error";
        return (
          <div className="state-panel" role={error ? "alert" : "status"}>
            <span className="state-icon"><Icono nombre={error ? "error" : "vacio"} tamano={20} /></span>
            <h3 className="state-title">{error ? "No pudimos cargar los datos" : "No hay resultados"}</h3>
            <p className="state-copy">{mensaje}</p>
            {error && reintentar && <button className="retry-button" onClick={reintentar}>Volver a intentar</button>}
          </div>
        );
      }

      function OpcionCliente({ cliente, seleccionado, elegir }) {
        return (
          <button className="client-option" type="button" aria-pressed={seleccionado} onClick={elegir}>
            <Iniciales cliente={cliente} />
            <span className="client-identity"><span className="client-name">{cliente.nombre} {cliente.apellido}</span><span className="client-email">{cliente.email}</span></span>
            <span className="client-number">#{cliente.id}</span>
          </button>
        );
      }

      function Actividad({ actividad }) {
        const completa = Boolean(actividad.fechaFinalizacion);
        return (
          <article className="activity" data-completa={completa}>
            <span className="activity-marker" aria-hidden="true" />
            <div>
              <p className="activity-description">{actividad.descripcion}</p>
              <div className="activity-meta">
                <span className="activity-status">{completa ? "Completada" : "Pendiente"}</span>
                {actividad.fecha && <span>Fecha: {fechaLegible(actividad.fecha)}</span>}
                {actividad.fechaCompromiso && <span>Compromiso: {fechaLegible(actividad.fechaCompromiso)}</span>}
                {completa && <span>Finalizada: {fechaLegible(actividad.fechaFinalizacion, true)}</span>}
              </div>
            </div>
          </article>
        );
      }

      function Aplicacion() {
        const [clientes, setClientes] = useState([]);
        const [estado, setEstado] = useState("cargando");
        const [mensaje, setMensaje] = useState("");
        const [intento, setIntento] = useState(0);
        const [busqueda, setBusqueda] = useState("");
        const [clienteId, setClienteId] = useState(null);
        const [actividades, setActividades] = useState([]);
        const [estadoActividades, setEstadoActividades] = useState("inactivo");
        const [mensajeActividades, setMensajeActividades] = useState("");
        const [intentoActividades, setIntentoActividades] = useState(0);

        useEffect(() => {
          const controlador = new AbortController();
          async function cargarClientes() {
            setEstado("cargando");
            setMensaje("");
            try {
              const respuesta = await fetch("/api/clientes", { headers: { Accept: "application/json" }, signal: controlador.signal });
              const resultado = await respuesta.json();
              if (!respuesta.ok) throw new Error(resultado.error?.mensaje || "La solicitud no se pudo completar.");
              const lista = Array.isArray(resultado.datos) ? resultado.datos : [];
              setClientes(lista);
              setClienteId(actual => actual ?? lista[0]?.id ?? null);
              setEstado("lista");
            } catch (error) {
              if (error.name === "AbortError") return;
              setMensaje(error.message || "Comprueba la conexión e inténtalo de nuevo.");
              setEstado("error");
            }
          }
          cargarClientes();
          return () => controlador.abort();
        }, [intento]);

        const clientesFiltrados = useMemo(() => {
          const termino = textoNormalizado(busqueda.trim());
          if (!termino) return clientes;
          return clientes.filter(cliente => Object.values(cliente).some(valor => textoNormalizado(valor).includes(termino)));
        }, [clientes, busqueda]);
        const cliente = clientes.find(item => item.id === clienteId) || null;

        useEffect(() => {
          if (!cliente) {
            setActividades([]);
            setEstadoActividades("inactivo");
            return;
          }
          const controlador = new AbortController();
          async function cargarActividades() {
            setEstadoActividades("cargando");
            setMensajeActividades("");
            try {
              const respuesta = await fetch(`/api/clientes/${cliente.id}/actividades`, { headers: { Accept: "application/json" }, signal: controlador.signal });
              const resultado = await respuesta.json();
              if (!respuesta.ok) throw new Error(resultado.error?.mensaje || "La solicitud no se pudo completar.");
              setActividades(Array.isArray(resultado.datos) ? resultado.datos : []);
              setEstadoActividades("lista");
            } catch (error) {
              if (error.name === "AbortError") return;
              setMensajeActividades(error.message || "Comprueba la conexión e inténtalo de nuevo.");
              setEstadoActividades("error");
            }
          }
          cargarActividades();
          return () => controlador.abort();
        }, [cliente?.id, intentoActividades]);

        const etiquetaEstado = estado === "lista" ? "Lista actualizada" : estado === "error" ? "Sin conexión" : "Cargando lista";

        return (
          <div className="app-shell">
            <header className="topbar">
              <a className="brand" href="/" aria-label="MiniCRM, inicio"><span className="brand-mark"><Icono nombre="marca" tamano={21} /></span><span><span className="brand-name">MiniCRM</span><span className="brand-caption">Relaciones que cuentan</span></span></a>
              <span className="connection" data-state={estado === "lista" ? "ready" : estado === "error" ? "error" : "loading"}><span className="connection-dot" />{etiquetaEstado}</span>
            </header>
            <main id="contenido" tabIndex="-1">
              <div className="intro"><div><p className="eyebrow"><span className="eyebrow-mark" />GESTIÓN DE CLIENTES</p><h1>Clientes <span>con nombre propio.</span></h1></div><p className="intro-note">Cada relación, en un espacio claro para cuidar sus próximos pasos.</p></div>
              <div className="workspace">
                <section className="panel master" aria-labelledby="titulo-directorio">
                  <header className="master-head">
                    <p className="section-label">Tu cartera</p><h2 id="titulo-directorio">Directorio de clientes</h2>
                    <label className="search-wrap"><span className="search-icon"><Icono nombre="buscar" tamano={17} /></span><input className="search-input" type="search" value={busqueda} onChange={evento => setBusqueda(evento.target.value)} placeholder="Buscar por cualquier campo" aria-label="Buscar clientes por cualquier campo" /></label>
                  </header>
                  {estado === "lista" && <div className="master-meta"><span><span className="record-count"><strong>{clientesFiltrados.length}</strong> de {clientes.length}</span> clientes</span><span>Búsqueda en vivo</span></div>}
                  <div className="master-list" aria-label="Resultados de clientes">
                    {estado === "cargando" && <div className="state-panel" role="status"><span className="state-icon"><Icono nombre="personas" tamano={20} /></span><p className="state-title">Cargando clientes</p></div>}
                    {estado === "error" && <PanelEstado tipo="error" mensaje={mensaje} reintentar={() => setIntento(valor => valor + 1)} />}
                    {estado === "lista" && clientesFiltrados.map(item => <OpcionCliente key={item.id} cliente={item} seleccionado={item.id === cliente?.id} elegir={() => setClienteId(item.id)} />)}
                    {estado === "lista" && clientesFiltrados.length === 0 && <PanelEstado mensaje={busqueda ? "Prueba con otro nombre, correo, teléfono o id." : "Agrega clientes para verlos en este directorio."} />}
                  </div>
                </section>
                <section className="panel detail" aria-labelledby="titulo-detalle">
                  {!cliente && estado === "lista" && <PanelEstado mensaje="Selecciona un cliente para consultar su ficha y actividades." />}
                  {cliente && <>
                    <header className="detail-head"><div><p className="section-label">Ficha del cliente</p><h2 className="detail-title" id="titulo-detalle">{cliente.nombre} {cliente.apellido}</h2></div><span className="detail-id">#{cliente.id}</span></header>
                    <div className="profile" aria-label="Datos del cliente"><div className="profile-item"><span className="profile-label">Correo electrónico</span><span className="profile-value">{cliente.email}</span></div><div className="profile-item"><span className="profile-label">Teléfono</span><span className="profile-value">{cliente.telefono || "No registrado"}</span></div></div>
                    <div className="activities-head"><h3>Actividades</h3>{estadoActividades === "lista" && <span className="activities-count">{actividades.length} {actividades.length === 1 ? "actividad" : "actividades"}</span>}</div>
                    <div className="activities-list" aria-label="Actividades del cliente" aria-live="polite">
                      {estadoActividades === "cargando" && <div role="status" aria-label="Cargando actividades"><div className="loading-line" /><div className="loading-line" /><div className="loading-line" /></div>}
                      {estadoActividades === "error" && <PanelEstado tipo="error" mensaje={mensajeActividades} reintentar={() => setIntentoActividades(valor => valor + 1)} />}
                      {estadoActividades === "lista" && actividades.map(actividad => <Actividad key={actividad.id} actividad={actividad} />)}
                      {estadoActividades === "lista" && actividades.length === 0 && <PanelEstado mensaje="Este cliente todavía no tiene actividades." />}
                    </div>
                  </>}
                </section>
              </div>
            </main>
          </div>
        );
      }

      createRoot(document.getElementById("raiz")).render(<Aplicacion />);
    </script>
    <script>
      const codigoReact = document.getElementById("codigo-react").textContent;
      const compilacion = Babel.transform(codigoReact, {
        filename: "clientes.jsx",
        presets: [["react", { runtime: "classic" }]]
      });
      const aplicacion = document.createElement("script");
      aplicacion.textContent = compilacion.code;
      document.body.append(aplicacion);
    </script>
  </body>
</html>
