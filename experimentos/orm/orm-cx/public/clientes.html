<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f4" />
    <title>Clientes · MiniCRM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20221f;
        background: #f7f7f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body { margin: 0; min-width: 320px; }

      button { font: inherit; }

      .pagina { width: min(100% - 40px, 960px); margin: 0 auto; padding: 56px 0 72px; }

      .marca { color: #70746c; font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }

      .encabezado { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 38px 0 28px; }

      h1 { margin: 0; font-size: clamp(36px, 7vw, 54px); font-weight: 570; letter-spacing: -.055em; line-height: 1; }

      .descripcion { margin: 13px 0 0; color: #70746c; font-size: 15px; }

      .contador { flex: 0 0 auto; padding-bottom: 3px; color: #70746c; font-size: 14px; }
      .contador strong { color: #20221f; font-size: 20px; font-weight: 600; }

      .barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid #dedfd9; border-bottom: 1px solid #dedfd9; }

      .etiqueta { color: #858980; font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }

      .lista { margin: 0; padding: 0; list-style: none; }

      .fila { display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(190px, .8fr) 24px; align-items: center; gap: 18px; min-height: 88px; border-bottom: 1px solid #e6e7e1; }

      .avatar { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid #e4e5de; border-radius: 50%; color: #62675d; background: #edeee8; font-size: 13px; font-weight: 650; letter-spacing: .02em; }

      .nombre { margin: 0; font-size: 15px; font-weight: 590; letter-spacing: -.01em; }

      .email, .telefono { margin: 5px 0 0; color: #777b72; font-size: 13px; overflow-wrap: anywhere; }

      .telefono { margin: 0; }

      .indice { color: #a0a39a; font-size: 12px; text-align: right; }

      .estado { padding: 56px 20px; color: #777b72; font-size: 14px; text-align: center; }
      .estado.error { color: #a34e3f; }

      @media (max-width: 620px) {
        .pagina { width: min(100% - 32px, 480px); padding-top: 36px; }
        .encabezado { align-items: start; margin-top: 32px; }
        .contador { padding-top: 4px; }
        .fila { grid-template-columns: 42px minmax(0, 1fr) 20px; gap: 12px; min-height: 80px; }
        .avatar { width: 38px; height: 38px; }
        .telefono { display: none; }
      }
      .pagina { width: min(100% - 40px, 1200px); }
      .maestro-detalle { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 32px; align-items: start; }
      .maestro { min-width: 0; }
      .maestro > section { display: flex; flex-direction: column; height: clamp(320px, calc(100dvh - 270px), 760px); }
      .maestro .lista { min-height: 0; overflow-y: auto; overscroll-behavior: contain; flex: 1; }
      .maestro .barra, .maestro .busqueda { flex-shrink: 0; }
      .busqueda { display: grid; gap: 8px; margin: 18px 0; font-size: 13px; color: #70746c; }
      .busqueda input { width: 100%; padding: 12px; font: inherit; background: white; border: 1px solid #dedfd9; border-radius: 8px; color: #20221f; }
      button:focus-visible, input:focus-visible { outline: 2px solid #56735b; outline-offset: 3px; }
      .fila { display: block; min-height: auto; }
      .seleccionar { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; padding: 16px 10px; background: transparent; cursor: pointer; color: inherit; border-radius: 8px; }
      .seleccionar:hover { background: #eeefe9; }
      .seleccionar[aria-pressed="true"] { background: #e5ebe2; }
      .seleccionar > div { min-width: 0; }
      .detalle { background: #fff; border: 1px solid #dedfd9; border-radius: 12px; padding: 28px; min-width: 0; }
      .detalle h2 { margin: 0 0 24px; font-size: 26px; letter-spacing: -.03em; }
      .detalle-cabecera { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
      .cliente-id { color: #858980; font-size: 13px; padding-top: 5px; }
      .acciones { display: flex; gap: 10px; margin-top: 22px; }
      .acciones button { padding: 9px 15px; border: 1px solid #d8dcd2; border-radius: 7px; background: #fff; color: #454940; cursor: pointer; }
      .acciones button[type="submit"] { background: #354f3b; border-color: #354f3b; color: white; }
      .acciones button:disabled { opacity: .6; cursor: wait; }
      .formulario-cliente { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .formulario-cliente > .estado, .formulario-cliente > .acciones { grid-column: 1 / -1; }
      .formulario-cliente label { display: grid; gap: 7px; font-size: 13px; color: #70746c; }
      .formulario-cliente input { width: 100%; padding: 11px 12px; border: 1px solid #dedfd9; border-radius: 7px; font: inherit; color: #20221f; background: white; }
      .nuevo-compromiso { margin-top: 24px; padding: 18px; border: 2px dotted #cbd1c4; border-radius: 12px; display: grid; gap: 14px; }
      .nuevo-compromiso label { display: grid; gap: 7px; font-size: 12px; color: #70746c; }
      .nuevo-compromiso input { min-width: 0; width: 100%; padding: 10px; border: 1px solid #dedfd9; border-radius: 7px; font: inherit; background: white; color: #20221f; }
      .compromiso-pie { display: flex; align-items: end; gap: 10px; }
      .compromiso-pie label { flex: 1; min-width: 0; }
      .compromiso-pie label:nth-child(2) { flex: 0 1 170px; }
      .boton-icono { display: grid; place-items: center; width: 38px; height: 38px; flex-shrink: 0; border: 1px solid #d8dcd2; border-radius: 7px; background: white; color: #454940; cursor: pointer; }
      .boton-icono[type="submit"] { background: #354f3b; border-color: #354f3b; color: white; }
      .boton-icono:disabled { opacity: .5; cursor: wait; }
      .boton-icono svg { width: 18px; height: 18px; }
      .detalle h3 { margin: 32px 0 8px; font-size: 17px; }
      .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 0; }
      .datos dt { font-size: 12px; color: #777b72; margin-bottom: 6px; }
      .datos dd { margin: 0; overflow-wrap: anywhere; font-size: 14px; }
      .actividades { list-style: none; padding: 0; margin: 0; }
      .actividades > li { padding: 20px 0; border-top: 1px solid #e6e7e1; }
      .actividad { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; align-items: start; }
      .actividad input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: #56735b; }
      .actividad p { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
      .actividad .fecha-actividad { margin-top: 7px; color: #777b72; font-size: 12px; }
      @media (max-width: 800px) {
        .maestro-detalle { grid-template-columns: 1fr; gap: 24px; }
        .maestro > section { height: 380px; }
        .detalle { padding: 20px; }
        .pagina { width: calc(100% - 32px); }
      }
      html, body, #raiz { height: 100%; overflow: hidden; }
      .pagina { height: 100dvh; padding: 24px 0; display: flex; flex-direction: column; }
      .marca, .encabezado { flex-shrink: 0; }
      .encabezado { margin: 24px 0; }
      .maestro-detalle { flex: 1; min-height: 0; align-items: stretch; }
      .maestro { min-height: 0; }
      .maestro > section { height: 100%; }
      .detalle { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .detalle > :not(.panel-actividades) { flex-shrink: 0; }
      .panel-actividades { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin-top: 20px; }
      .panel-actividades h3 { margin: 12px 0; }
      .formulario-cliente { min-height: 0; overflow-y: auto; padding: 6px; flex-shrink: 1 !important; }
      @media (max-width: 800px) {
        .pagina { padding: 16px 0; }
        .encabezado { margin: 16px 0; }
        .maestro-detalle { grid-template-rows: minmax(120px, 30%) minmax(0, 1fr); gap: 16px; }
        .detalle { padding: 16px; }
        .detalle h2 { margin-bottom: 12px; font-size: 22px; }
        .nuevo-compromiso { margin-top: 12px; padding: 10px; }
        .acciones { margin-top: 12px; }
      }
      .actividad { grid-template-columns: 18px minmax(0, 1fr) auto; }
      .acciones-tarea { display: flex; gap: 5px; }
      .acciones-tarea .boton-icono { width: 30px; height: 30px; background: transparent; }
      .grupo-vacio { margin: 0; padding: 2px 0 8px; color: #777b72; font-size: 13px; }
      .acciones-cabecera { display: flex; align-items: center; gap: 16px; }
      .agregar-cliente { padding: 10px 14px; border: 0; border-radius: 7px; background: #354f3b; color: white; cursor: pointer; }
      @media (max-width: 620px) { .acciones-cabecera { flex-direction: column; align-items: end; gap: 8px; } }
    </style>
  </head>
  <body>
    <div id="raiz"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
    <script>
      Babel.registerPreset('react-clasico', {
        presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
      });
    </script>
    <script type="text/babel" data-presets="react-clasico">
      const { useEffect, useState } = React;

      function iniciales(cliente) {
        return `${cliente.nombre?.[0] ?? ''}${cliente.apellido?.[0] ?? ''}`.toLocaleUpperCase('es');
      }

      function LayoutPagina({ children }) {
        return <main className="pagina"><Marca />{children}</main>;
      }

      function Marca() {
        return <div className="marca">MiniCRM <span aria-hidden="true">/</span> Directorio</div>;
      }

      function Encabezado({ titulo, descripcion, children }) {
        return (
          <header className="encabezado">
            <div>
              <h1>{titulo}</h1>
              <p className="descripcion">{descripcion}</p>
            </div>
            {children}
          </header>
        );
      }

      function ContadorClientes({ cantidad }) {
        return (
          <div className="contador" aria-live="polite">
            <strong>{cantidad}</strong> {cantidad === 1 ? 'cliente' : 'clientes'}
          </div>
        );
      }

      function SeccionListado({ etiqueta, children }) {
        return (
          <section aria-label="Listado de clientes">
            <div className="barra">
              <span className="etiqueta">{etiqueta}</span>
            </div>
            {children}
          </section>
        );
      }

      function MensajeEstado({ children, error = false, cargando = false }) {
        return (
          <p className={error ? 'estado error' : 'estado'} role={error ? 'alert' : cargando ? 'status' : undefined}>
            {children}
          </p>
        );
      }

      function ListadoClientes({ clientes, cargando, error, seleccionadoId, onSeleccionar }) {
        if (cargando && clientes.length === 0) {
          return <MensajeEstado cargando>Cargando clientes…</MensajeEstado>;
        }
        if (error) return <MensajeEstado error>{error}</MensajeEstado>;
        if (clientes.length === 0) {
          return <MensajeEstado>Todavía no hay clientes para mostrar.</MensajeEstado>;
        }
        return (
          <ul className="lista">
            {clientes.map((cliente, indice) => (
              <FilaCliente key={cliente.id} cliente={cliente} seleccionado={cliente.id === seleccionadoId} onSeleccionar={onSeleccionar} />
            ))}
          </ul>
        );
      }

      function FilaCliente({ cliente, seleccionado, onSeleccionar }) {
        return (
          <li className="fila">
            <button type="button" className="seleccionar" aria-pressed={seleccionado} onClick={() => onSeleccionar(cliente)}>
              <AvatarCliente cliente={cliente} />
              <DatosCliente cliente={cliente} />
            </button>
          </li>
        );
      }

      function AvatarCliente({ cliente }) {
        return <span className="avatar" aria-hidden="true">{iniciales(cliente)}</span>;
      }

      function DatosCliente({ cliente }) {
        return (
          <div>
            <h2 className="nombre">{cliente.nombre} {cliente.apellido}</h2>
            <p className="email">{cliente.email}</p>
          </div>
        );
      }

      function BusquedaClientes({ texto, onBuscar }) {
        return <label className="busqueda">Buscar clientes
          <input type="search" value={texto} onChange={evento => onBuscar(evento.target.value)} placeholder="Nombre, email, teléfono…" />
        </label>;
      }

      function CampoDato({ etiqueta, children }) {
        return <div><dt>{etiqueta}</dt><dd>{children || '—'}</dd></div>;
      }

      function fechaVisible(valor, conHora = false) {
        if (!valor) return '—';
        const fecha = new Date(conHora ? valor : `${valor}T12:00:00`);
        return conHora ? fecha.toLocaleString('es-AR') : fecha.toLocaleDateString('es-AR');
      }

      function Actividad({ actividad, onCompletar, onEditar, onEliminar }) {
        const completada = Boolean(actividad.completadaEn);
        const [guardando, setGuardando] = useState(false);
        const [error, setError] = useState('');

        async function completar() {
          if (completada || guardando) return;
          setGuardando(true);
          setError('');
          try {
            await onCompletar(actividad.id);
          } catch (problema) {
            setError(problema.message);
          } finally {
            setGuardando(false);
          }
        }

        return <li className="actividad">
          <input type="checkbox" checked={completada} disabled={completada || guardando} onChange={completar} aria-label={completada ? 'Actividad completada' : `Completar: ${actividad.descripcion}`} />
          <div>
            <p>{actividad.descripcion}</p>
            <p className="fecha-actividad">
              {completada
                ? `Completada: ${fechaVisible(actividad.completadaEn, true)}`
                : actividad.fechaCompromiso
                  ? `Compromiso: ${fechaVisible(actividad.fechaCompromiso)}`
                  : 'Sin fecha de compromiso'}
            </p>
            {error && <p className="estado error" role="alert">{error}</p>}
          </div>
          {!completada && <div className="acciones-tarea">
            <button type="button" className="boton-icono" disabled={guardando} aria-label="Editar tarea" title="Editar tarea" onClick={() => onEditar(actividad)}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" aria-hidden="true"><path d="m15 4 5 5L9 20H4v-5Z" /></svg>
            </button>
            <button type="button" className="boton-icono" disabled={guardando} aria-label="Borrar tarea" title="Borrar tarea" onClick={async () => {
              setGuardando(true); setError('');
              try { await onEliminar(actividad.id); } catch (problema) { setError(problema.message); }
              finally { setGuardando(false); }
            }}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7" /></svg>
            </button>
          </div>}
        </li>;
      }

      function GrupoActividades({ titulo, actividades, onCompletar, onEditar, onEliminar }) {
        return <section aria-label={titulo}>
          <h3>{titulo}</h3>
          {actividades.length === 0 ? <p className="grupo-vacio">No hay {titulo.toLocaleLowerCase('es')}.</p>
            : <ul className="actividades">{actividades.map(actividad => <Actividad key={actividad.id} actividad={actividad} onCompletar={onCompletar} onEditar={onEditar} onEliminar={onEliminar} />)}</ul>}
        </section>;
      }

      function ActividadesCliente({ clienteId, onEditar, onCambio }) {
        const [resultado, setResultado] = useState({ cargando: true, actividades: [], error: '' });

        async function eliminarActividad(actividadId) {
          const respuesta = await fetch(`/api/clientes/${clienteId}/actividades/${actividadId}`, { method: 'DELETE' });
          if (!respuesta.ok) throw new Error('No se pudo borrar la tarea.');
          setResultado(anterior => ({ ...anterior, actividades: anterior.actividades.filter(actividad => actividad.id !== actividadId) }));
          onCambio(actividadId);
        }

        async function completarActividad(actividadId) {
          const respuesta = await fetch(`/api/clientes/${clienteId}/actividades/${actividadId}/completar`, { method: 'POST' });
          if (!respuesta.ok) throw new Error('No se pudo completar la actividad. Intentá nuevamente.');
          const actualizada = await respuesta.json();
          onCambio(actividadId);
          setResultado(anterior => ({
            ...anterior,
            actividades: anterior.actividades.map(actividad => actividad.id === actualizada.id ? actualizada : actividad),
          }));
        }
        useEffect(() => {
          const control = new AbortController();
          async function cargar() {
            try {
              const respuesta = await fetch(`/api/clientes/${clienteId}/actividades`, { signal: control.signal });
              if (!respuesta.ok) throw new Error('No se pudieron cargar las actividades.');
              const actividades = await respuesta.json();
              if (!control.signal.aborted) setResultado({ cargando: false, actividades, error: '' });
            } catch (error) {
              if (!control.signal.aborted) setResultado({ cargando: false, actividades: [], error: error.message });
            }
          }
          cargar();
          return () => control.abort();
        }, [clienteId]);
        const hoy = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Argentina/Tucuman' }).format(new Date());
        function prioridad(actividad) {
          if (!actividad.fechaCompromiso) return 0;
          return actividad.fechaCompromiso < hoy ? 1 : 2;
        }
        const compromisos = resultado.actividades.filter(actividad => !actividad.completadaEn)
          .sort((a, b) => prioridad(a) - prioridad(b)
            || (a.fechaCompromiso || '').localeCompare(b.fechaCompromiso || '') || a.id - b.id);
        const completadas = resultado.actividades.filter(actividad => actividad.completadaEn);

        return <div className="panel-actividades" aria-label="Actividades del cliente" tabIndex="0">
          {resultado.cargando ? <MensajeEstado cargando>Cargando actividades…</MensajeEstado>
            : resultado.error ? <MensajeEstado error>{resultado.error}</MensajeEstado>
            : <>
              <GrupoActividades titulo="Compromisos" actividades={compromisos} onCompletar={completarActividad} onEditar={onEditar} onEliminar={eliminarActividad} />
              <GrupoActividades titulo="Actividades completadas" actividades={completadas} onCompletar={completarActividad} onEditar={onEditar} onEliminar={eliminarActividad} />
            </>}
        </div>;
      }

      function FormularioCompromiso({ clienteId, actividad, onAgregado, onCancelar }) {
        const [descripcion, setDescripcion] = useState(actividad?.descripcion || '');
        const [fecha, setFecha] = useState(actividad?.fechaCompromiso || '');
        const [guardando, setGuardando] = useState(false);
        const [error, setError] = useState('');

        function cancelar() {
          setDescripcion('');
          setFecha('');
          setError('');
          onCancelar();
        }

        async function agregar(evento) {
          evento.preventDefault();
          if (guardando) return;
          if (!descripcion.trim()) {
            setError('Ingresá una descripción.');
            return;
          }
          setGuardando(true);
          setError('');
          try {
            const respuesta = await fetch(`/api/clientes/${clienteId}/actividades${actividad ? `/${actividad.id}` : ''}`, {
              method: actividad ? 'PATCH' : 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ descripcion: descripcion.trim(), fechaCompromiso: fecha || null }),
            });
            const resultado = await respuesta.json();
            if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo agregar el compromiso.');
            onAgregado();
            cancelar();
          } catch (problema) {
            setError(problema.message || 'No se pudo conectar con el servidor.');
          } finally {
            setGuardando(false);
          }
        }

        return <form className="nuevo-compromiso" onSubmit={agregar} aria-label="Nuevo compromiso">
          <div className="compromiso-pie">
            <label><input aria-label="Descripción" required placeholder="Nuevo compromiso…" value={descripcion} onChange={evento => setDescripcion(evento.target.value)} disabled={guardando} /></label>
            <label><input aria-label="Fecha de compromiso (opcional)" type="date" value={fecha} onChange={evento => setFecha(evento.target.value)} disabled={guardando} /></label>
            <button className="boton-icono" type="submit" disabled={guardando} aria-label={actividad ? "Guardar cambios" : "Agregar compromiso"} title={actividad ? "Guardar cambios" : "Agregar compromiso"}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d={actividad ? "m5 12 4 4L19 6" : "M12 5v14M5 12h14"} /></svg>
            </button>
            <button className="boton-icono" type="button" onClick={cancelar} disabled={guardando} aria-label="Cancelar ingreso" title="Cancelar ingreso">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          {error && <MensajeEstado error>{error}</MensajeEstado>}
        </form>;
      }

      function FormularioCliente({ cliente = {}, onGuardado, onCancelar }) {
        const [datos, setDatos] = useState({
          nombre: cliente.nombre || '',
          apellido: cliente.apellido || '',
          email: cliente.email || '',
          telefono: cliente.telefono || '',
        });
        const [guardando, setGuardando] = useState(false);
        const [error, setError] = useState('');

        function cambiar(campo, valor) {
          setDatos(anterior => ({ ...anterior, [campo]: valor }));
        }

        async function guardar(evento) {
          evento.preventDefault();
          if (guardando) return;
          setGuardando(true);
          setError('');
          try {
            const respuesta = await fetch(cliente.id ? `/api/clientes/${cliente.id}` : '/api/clientes', {
              method: cliente.id ? 'PATCH' : 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(datos),
            });
            const resultado = await respuesta.json();
            if (!respuesta.ok) throw new Error(resultado.error || 'No se pudo guardar el cliente.');
            onGuardado(resultado);
          } catch (problema) {
            setError(problema.message || 'No se pudo conectar con el servidor.');
          } finally {
            setGuardando(false);
          }
        }

        return <form className="formulario-cliente" onSubmit={guardar}>
          <label>Nombre<input autoFocus required value={datos.nombre} onChange={evento => cambiar('nombre', evento.target.value)} disabled={guardando} /></label>
          <label>Apellido<input required value={datos.apellido} onChange={evento => cambiar('apellido', evento.target.value)} disabled={guardando} /></label>
          <label>Email<input type="email" required value={datos.email} onChange={evento => cambiar('email', evento.target.value)} disabled={guardando} /></label>
          <label>Teléfono<input type="tel" value={datos.telefono} onChange={evento => cambiar('telefono', evento.target.value)} disabled={guardando} /></label>
          {error && <MensajeEstado error>{error}</MensajeEstado>}
          <div className="acciones">
            <button type="submit" disabled={guardando}>{guardando ? 'Guardando…' : 'Guardar'}</button>
            <button type="button" onClick={onCancelar} disabled={guardando}>Cancelar</button>
          </div>
        </form>;
      }

      function DetalleCliente({ cliente, onActualizar }) {
        const [editando, setEditando] = useState(false);
        const [versionActividades, setVersionActividades] = useState(0);
        const [actividadEditada, setActividadEditada] = useState(null);

        function guardar(actualizado) {
          onActualizar(actualizado);
          setEditando(false);
        }

        return <section className="detalle" aria-label="Detalle del cliente">
          {!cliente ? <MensajeEstado>Seleccioná un cliente para ver su información y actividades.</MensajeEstado> : <>
            <div className="detalle-cabecera">
              <h2>{cliente.nombre} {cliente.apellido}</h2>
              <span className="cliente-id">#{cliente.id}</span>
            </div>
            {editando ? <FormularioCliente cliente={cliente} onGuardado={guardar} onCancelar={() => setEditando(false)} /> : <>
            <dl className="datos">
              <CampoDato etiqueta="Email">{cliente.email}</CampoDato>
              <CampoDato etiqueta="Teléfono">{cliente.telefono}</CampoDato>
            </dl>
            <div className="acciones"><button type="button" onClick={() => setEditando(true)}>Editar</button></div>
            <FormularioCompromiso key={actividadEditada?.id || "nueva"} clienteId={cliente.id} actividad={actividadEditada} onCancelar={() => setActividadEditada(null)} onAgregado={() => setVersionActividades(version => version + 1)} />
            <ActividadesCliente key={`${cliente.id}-${versionActividades}`} clienteId={cliente.id} onEditar={setActividadEditada} onCambio={id => setActividadEditada(anterior => anterior?.id === id ? null : anterior)} />
            </>}
          </>}
        </section>;
      }

      function LayoutMaestroDetalle({ maestro, detalle }) {
        return <div className="maestro-detalle"><div className="maestro">{maestro}</div>{detalle}</div>;
      }

      function App() {
        const [clientes, setClientes] = useState([]);
        const [texto, setTexto] = useState('');
        const [seleccionado, setSeleccionado] = useState(null);
        const [creando, setCreando] = useState(false);
        const [cargando, setCargando] = useState(true);
        const [error, setError] = useState('');

        async function cargarClientes() {
          setCargando(true);
          setError('');
          try {
            const respuesta = await fetch('/api/clientes');
            if (!respuesta.ok) throw new Error('No se pudo cargar la lista de clientes.');
            setClientes(await respuesta.json());
          } catch (problema) {
            setError(problema.message || 'Ocurrió un error al conectar con la API.');
          } finally {
            setCargando(false);
          }
        }

        useEffect(() => { cargarClientes(); }, []);

        function actualizarCliente(actualizado) {
          setClientes(anteriores => anteriores.map(cliente => cliente.id === actualizado.id ? actualizado : cliente));
          setSeleccionado(actualizado);
        }

        function agregarCliente(cliente) {
          setClientes(anteriores => [...anteriores, cliente]);
          setSeleccionado(cliente);
          setTexto('');
          setCreando(false);
        }

        function seleccionarCliente(cliente) {
          setCreando(false);
          setSeleccionado(cliente);
        }

        return (
          <LayoutPagina>
            <Encabezado titulo="Clientes" descripcion="Personas y datos de contacto.">
              <div className="acciones-cabecera">
                <ContadorClientes cantidad={clientes.length} />
                <button type="button" className="agregar-cliente" onClick={() => setCreando(true)}>Agregar cliente</button>
              </div>
            </Encabezado>
            <LayoutMaestroDetalle
              maestro={<SeccionListado etiqueta="Directorio">
                <BusquedaClientes texto={texto} onBuscar={setTexto} />
                <ListadoClientes
                  clientes={clientes.filter(cliente => Object.values(cliente).some(valor => String(valor ?? '').toLocaleLowerCase('es').includes(texto.trim().toLocaleLowerCase('es'))))}
                  cargando={cargando} error={error} seleccionadoId={seleccionado?.id} onSeleccionar={seleccionarCliente}
                />
              </SeccionListado>}
              detalle={creando ? <section className="detalle" aria-label="Agregar cliente">
                <h2>Agregar cliente</h2>
                <FormularioCliente onGuardado={agregarCliente} onCancelar={() => setCreando(false)} />
              </section> : <DetalleCliente key={seleccionado?.id} cliente={seleccionado} onActualizar={actualizarCliente} />}
            />
          </LayoutPagina>
        );
      }

      ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
    </script>
  </body>
</html>
