  </script>
  <script>
    const { html, reactive } = window.Arrow;
    const state = reactive({ city: '', loading: false, error: '', place: null, weather: null });
    let activeController;

    const descriptions = {
      0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nublado',3:'Nublado',
      45:'Niebla',48:'Niebla con escarcha',51:'Llovizna ligera',53:'Llovizna',55:'Llovizna intensa',
      56:'Llovizna helada',57:'Llovizna helada intensa',61:'Lluvia ligera',63:'Lluvia',65:'Lluvia intensa',
      66:'Lluvia helada',67:'Lluvia helada intensa',71:'Nieve ligera',73:'Nieve',75:'Nieve intensa',77:'Granizo fino',
      80:'Chubascos ligeros',81:'Chubascos',82:'Chubascos intensos',85:'Nieve',86:'Nieve intensa',
      95:'Tormenta',96:'Tormenta con granizo',99:'Tormenta con granizo fuerte'
    };

    function weatherIcon(code, isDay) {
      if (code === 0) return isDay ? '☀️' : '🌙';
      if ([1,2].includes(code)) return isDay ? '🌤️' : '☁️';
      if (code === 3) return '☁️';
      if ([45,48].includes(code)) return '🌫️';
      if ([71,73,75,77,85,86].includes(code)) return '❄️';
      if ([95,96,99].includes(code)) return '⛈️';
      if ([51,53,55,56,57].includes(code)) return '🌦️';
      return '🌧️';
    }

    async function getJSON(url, signal) {
      let response;
      try {
        response = await fetch(url, { signal, headers: { Accept: 'application/json' } });
      } catch (error) {
        if (error.name === 'AbortError') throw error;
        throw new Error('No se pudo conectar con Open-Meteo. Revisá la conexión.');
      }
      if (!response.ok) throw new Error(`Open-Meteo respondió con el código ${response.status}.`);
      let data;
      try { data = JSON.parse(await response.text()); }
      catch { throw new Error('La API devolvió una respuesta que no es JSON. Abrí el archivo en un navegador y probá de nuevo.'); }
      if (data.error) throw new Error(data.reason || 'No se pudo consultar el servicio.');
      return data;
    }

    async function search(event) {
      event.preventDefault();
      const city = state.city.trim();
      if (!city) { state.error = 'Escribí una ciudad.'; return; }

      activeController?.abort();
      activeController = new AbortController();
      const { signal } = activeController;
      state.loading = true;
      state.error = '';
      state.weather = null;

      try {
        const geoUrl = new URL('https://geocoding-api.open-meteo.com/v1/search');
        geoUrl.search = new URLSearchParams({ name: city, count: '1', language: 'es', format: 'json' });
        const geocoding = await getJSON(geoUrl, signal);
        const place = geocoding.results?.[0];
        if (!place) throw new Error('No encontré esa ciudad. Probá con otro nombre.');

        const weatherUrl = new URL('https://api.open-meteo.com/v1/forecast');
        weatherUrl.search = new URLSearchParams({
          latitude: place.latitude,
          longitude: place.longitude,
          current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m',
          timezone: 'auto'
        });
        const weather = await getJSON(weatherUrl, signal);
        if (!weather.current) throw new Error('No hay datos meteorológicos para esa ciudad.');

        state.place = place;
        state.weather = weather.current;
      } catch (error) {
        if (error.name !== 'AbortError') state.error = error.message || 'No se pudo completar la consulta.';
      } finally {
        if (!signal.aborted) state.loading = false;
      }
    }

    function fact(label, value) {
      return html`<div class="fact"><span class="label">${label}</span><span class="value">${value}</span></div>`;
    }

    const app = html`
      <header><span class="logo" aria-hidden="true">🌤️</span> Clima simple</header>
      <h1>Clima de una ciudad</h1>
      <p class="lead">Ingresá una ciudad para ver sus condiciones actuales.</p>

      <form class="search" @submit="${search}">
        <input
          type="search"
          aria-label="Ciudad"
          placeholder="Ej.: San Miguel de Tucumán"
          autocomplete="off"
          @input="${event => state.city = event.target.value}"
          required
        >
        <button type="submit" disabled="${() => state.loading}">
          ${() => state.loading ? 'Buscando…' : 'Buscar'}
        </button>
      </form>

      <div class="${() => 'message ' + (state.error ? 'error' : '')}" role="status" aria-live="polite">
        ${() => state.loading ? 'Consultando el clima…' : state.error}
      </div>

      ${() => state.place && state.weather ? html`
        <section class="weather" aria-label="Clima actual">
          <div class="place">${state.place.name}</div>
          <div class="country">${[state.place.admin1, state.place.country].filter(Boolean).join(' · ')}</div>
          <div class="local-time">Hora local · ${state.weather.time.slice(11, 16)}</div>
          <div class="main">
            <div>
              <div class="condition">${descriptions[state.weather.weather_code] || 'Tiempo variable'}</div>
              <div class="temperature">${Math.round(state.weather.temperature_2m)}°</div>
            </div>
            <span class="icon" aria-hidden="true">${weatherIcon(state.weather.weather_code, Boolean(state.weather.is_day))}</span>
          </div>
          <div class="facts">
            ${fact('Sensación', `${Math.round(state.weather.apparent_temperature)}°C`)}
            ${fact('Humedad', `${state.weather.relative_humidity_2m}%`)}
            ${fact('Viento', `${Math.round(state.weather.wind_speed_10m)} km/h`)}
          </div>
        </section>
      ` : ''}

      <footer>Datos: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></footer>
    `;

    app(document.getElementById('app'));
  </script>
</body>
</html>
