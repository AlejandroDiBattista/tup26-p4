<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de programación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #eef1f6;
      --superficie: #ffffff;
      --tinta: #1c2433;
      --tenue: #677086;
      --linea: #d6dbe5;
      --acento: #2f4bd8;
      --acento-hover: #243cb4;
      --sobre-acento: #ffffff;
      --aviso: #a3281c;
      --aviso-fondo: #fbe9e7;
      --codigo-fondo: #1b2231;
      --codigo-tinta: #d3dbeb;
      --codigo-rol: #8ea2ff;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #131824;
        --superficie: #1d2432;
        --tinta: #e5e9f1;
        --tenue: #98a1b4;
        --linea: #2d3646;
        --acento: #7088ff;
        --acento-hover: #8b9dff;
        --sobre-acento: #0c1120;
        --aviso: #ffab9f;
        --aviso-fondo: #3b2124;
        --codigo-fondo: #0d121c;
      }
    }

    * { box-sizing: border-box; }
    html, body, #app { height: 100%; margin: 0; }

    body {
      font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      background: var(--fondo);
      color: var(--tinta);
    }

    button, textarea, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

    /* Estructura */

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: minmax(0, 1fr);
      height: 100%;
      max-width: 46rem;
      margin: 0 auto;
    }

    .app.con-historia {
      max-width: 78rem;
      grid-template-columns: minmax(0, 1fr) minmax(0, 28rem);
    }

    .barra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--linea);
    }

    .marca { display: flex; align-items: baseline; gap: 0.625rem; }
    .marca h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.01em; }
    .marca span { color: var(--tenue); font-size: 0.875rem; }

    .acciones { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }

    .boton {
      background: none;
      border: 0;
      border-radius: 0.5rem;
      padding: 0.375rem 0.625rem;
      color: var(--tenue);
      cursor: pointer;
      font-size: 0.9375rem;
    }
    .boton:hover:not(:disabled), .boton[aria-pressed="true"] { color: var(--tinta); background: var(--superficie); }
    .boton:disabled { opacity: 0.45; cursor: default; }

    .cuenta {
      display: inline-block;
      min-width: 1.5em;
      margin-left: 0.25rem;
      padding: 0 0.375rem;
      border-radius: 1rem;
      background: var(--linea);
      color: var(--tinta);
      font-size: 0.8125rem;
      text-align: center;
    }

    /* Conversación */

    .conversacion { overflow-y: auto; scroll-behavior: smooth; }
    .hilo { display: flex; flex-direction: column; gap: 1.25rem; padding: 1.75rem 1.25rem 2rem; }

    .mensaje { max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }

    .mensaje.user {
      align-self: flex-end;
      padding: 0.625rem 1rem;
      border-radius: 1.25rem 1.25rem 0.375rem 1.25rem;
      background: var(--acento);
      color: var(--sobre-acento);
    }

    .mensaje.assistant { align-self: flex-start; padding-left: 0.875rem; border-left: 3px solid var(--linea); }

    .escribiendo { display: flex; gap: 0.3rem; padding-block: 0.6rem; }
    .escribiendo span {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--tenue);
      animation: latido 1.2s infinite ease-in-out;
    }
    .escribiendo span:nth-child(2) { animation-delay: 0.15s; }
    .escribiendo span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes latido {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-0.2rem); }
    }

    .aviso {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      background: var(--aviso-fondo);
      color: var(--aviso);
    }
    .aviso p { margin: 0; }
    .aviso .boton { color: var(--aviso); border: 1px solid currentColor; }

    .vacio { margin: auto 0; padding-top: 12vh; }
    .vacio h2 { margin: 0 0 0.375rem; font-size: 1.5rem; letter-spacing: -0.01em; }
    .vacio p { margin: 0 0 1.25rem; color: var(--tenue); max-width: 34rem; }

    .sugerencias { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .sugerencia {
      border: 1px solid var(--linea);
      border-radius: 2rem;
      padding: 0.4rem 0.9rem;
      background: var(--superficie);
      cursor: pointer;
      text-align: left;
    }
    .sugerencia:hover { border-color: var(--acento); }

    /* Caja de texto */

    .compositor {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      margin: 0 1.25rem 1.25rem;
      padding: 0.5rem 0.5rem 0.5rem 1rem;
      border: 1px solid var(--linea);
      border-radius: 1.5rem;
      background: var(--superficie);
    }
    .compositor:focus-within { border-color: var(--acento); }

    .compositor textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: none;
      padding: 0.45rem 0;
      max-height: 12.5rem;
      line-height: 1.5;
    }

    .enviar {
      flex: none;
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      border: 0;
      border-radius: 50%;
      background: var(--acento);
      color: var(--sobre-acento);
      cursor: pointer;
    }
    .enviar:hover:not(:disabled) { background: var(--acento-hover); }
    .enviar:disabled { opacity: 0.4; cursor: default; }

    .ayuda { margin: -0.75rem 1.25rem 1rem; color: var(--tenue); font-size: 0.8125rem; text-align: center; }

    /* Historia */

    .historia {
      grid-column: 2;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-left: 1px solid var(--linea);
      background: var(--superficie);
    }

    .historia header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--linea);
    }
    .historia h2 { margin: 0; font-size: 1rem; }
    .historia > p { margin: 0; padding: 0.875rem 1.25rem; color: var(--tenue); font-size: 0.9375rem; }

    .historia pre {
      flex: 1;
      margin: 0 1.25rem 1.25rem;
      padding: 1rem;
      overflow: auto;
      border-radius: 0.75rem;
      background: var(--codigo-fondo);
      color: var(--codigo-tinta);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.8125rem;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bienvenida { max-width: 28rem; margin: 0 auto; padding: 18vh 1.5rem 2rem; }
    .bienvenida h1 { margin: 0 0 0.5rem; font-size: 2rem; letter-spacing: -0.02em; }
    .bienvenida > p { color: var(--tenue); margin: 0 0 1.5rem; }
    .bienvenida .aviso { margin-bottom: 1rem; }
    .form-clave { display: grid; gap: 0.5rem; }
    .form-clave label { font-weight: 700; font-size: 0.9375rem; }
    .form-clave input {
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--linea);
      border-radius: 0.75rem;
      background: var(--superficie);
    }
    .primario {
      margin-top: 0.5rem;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 0.75rem;
      background: var(--acento);
      color: var(--sobre-acento);
      font-weight: 700;
      cursor: pointer;
    }
    .primario:hover { background: var(--acento-hover); }

    /* Asistente */

    .carpeta {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.1rem 0.6rem;
      border-radius: 1rem;
      background: var(--superficie);
      border: 1px solid var(--linea);
      color: var(--tinta);
      font-size: 0.875rem;
      white-space: nowrap;
    }

    .app { max-width: 54rem; }
    .app.con-historia { max-width: 84rem; grid-template-columns: minmax(0, 1fr) minmax(0, 26rem); }
    .boton { white-space: nowrap; }

    .mensaje.assistant .texto { margin: 0; }
    .mensaje.assistant { display: grid; gap: 0.625rem; max-width: 100%; }

    .codigo {
      margin: 0;
      padding: 0.875rem 1rem;
      overflow-x: auto;
      border-radius: 0.625rem;
      background: var(--codigo-fondo);
      color: var(--codigo-tinta);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.8125rem;
      line-height: 1.6;
      white-space: pre;
    }

    .actividad {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: -0.75rem 0 0;
      color: var(--tenue);
      font-size: 0.875rem;
    }
    .actividad code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.8125rem; color: var(--tinta); }
    .actividad.fallo, .actividad.fallo code { color: var(--aviso); }
    .actividad .marca-estado { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--linea); flex: none; }
    .actividad.hecho .marca-estado { background: var(--acento); }
    .actividad.fallo .marca-estado { background: var(--aviso); }
    .actividad.en-curso .marca-estado { background: var(--tenue); animation: latido 1.2s infinite ease-in-out; }

    .aprobacion {
      display: grid;
      gap: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--acento);
      border-radius: 0.875rem;
      background: var(--superficie);
    }
    .aprobacion h3 { margin: 0; font-size: 1rem; }
    .aprobacion h3 code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.9375rem; }
    .aprobacion p { margin: 0; color: var(--tenue); font-size: 0.9375rem; }
    .aprobacion .codigo { max-height: 18rem; }
    .aprobacion .botones { display: flex; gap: 0.5rem; }
    .aprobacion .primario { margin: 0; }

    .mensaje.escribiendo { display: flex; }

    .enviar.detener { background: var(--tinta); color: var(--fondo); }

    .historia details { margin: 0 1.25rem 0.75rem; }
    .historia summary { cursor: pointer; color: var(--tenue); font-size: 0.9375rem; padding: 0.25rem 0; }
    .historia details pre { margin: 0.5rem 0 0; max-height: 50vh; }
    .historia .panel-cuerpo { flex: 1; min-height: 0; overflow-y: auto; }

    @media (max-width: 60rem) {
      .app.con-historia { grid-template-columns: minmax(0, 1fr); }
      .historia { position: fixed; inset: 20% 0 0 0; border-left: 0; border-top: 1px solid var(--linea); border-radius: 1.25rem 1.25rem 0 0; box-shadow: 0 -1rem 3rem rgb(0 0 0 / 0.2); }
    }

    @media (max-width: 34rem) {
      .barra { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
      .acciones { justify-content: flex-start; margin-left: -0.625rem; flex-wrap: wrap; }
      .ayuda { display: none; }
      .mensaje { max-width: 92%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .conversacion { scroll-behavior: auto; }
      .escribiendo span { animation: none; opacity: 0.6; }
    }
    </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { html, reactive } from "https://esm.sh/@arrow-js/core@1";

    const URL_API = "https://api.openai.com/v1/chat/completions";
    const MODELO = "gpt-6-luna";
    const NOMBRE_CLAVE = "openai-api-key";
    const MAX_PASOS = 20;
    const MAX_CARACTERES = 100_000;
    const CARPETAS_IGNORADAS = new Set(["node_modules", ".git", "dist", "build", ".next"]);

    const INSTRUCCIONES = `Sos un asistente de programación. Trabajás sobre la carpeta de un proyecto del usuario, y solo podés verla y modificarla con las herramientas listar_archivos, leer_archivo y escribir_archivo.
Explorá y leé los archivos necesarios antes de responder o de modificar algo.
Para modificar un archivo, leelo primero y después escribilo completo: escribir_archivo reemplaza todo su contenido.
Las rutas son relativas a la carpeta del proyecto y usan /.
Respondé en español y en forma breve. Podés usar bloques de código con triple acento grave; no uses otro formato Markdown.`;

    const SUGERENCIAS = [
      "Explicame qué hace este proyecto",
      "Revisá el código y señalá posibles errores",
      "Escribí un README.md para el proyecto",
    ];

    // Las herramientas, tal como se las describimos al modelo

    const HERRAMIENTAS = [
      {
        type: "function",
        function: {
          name: "listar_archivos",
          description: "Lista en forma recursiva los archivos y carpetas dentro de una carpeta del proyecto. Omite node_modules, .git y las carpetas de compilación.",
          parameters: {
            type: "object",
            properties: {
              ruta: { type: "string", description: "Carpeta a listar, relativa al proyecto. Una cadena vacía indica la raíz." },
            },
            required: ["ruta"],
            additionalProperties: false,
          },
          strict: true,
        },
      },
      {
        type: "function",
        function: {
          name: "leer_archivo",
          description: "Devuelve el contenido de un archivo de texto del proyecto.",
          parameters: {
            type: "object",
            properties: {
              ruta: { type: "string", description: "Ruta del archivo, relativa al proyecto." },
            },
            required: ["ruta"],
            additionalProperties: false,
          },
          strict: true,
        },
      },
      {
        type: "function",
        function: {
          name: "escribir_archivo",
          description: "Crea un archivo o reemplaza por completo su contenido. Crea las carpetas intermedias que falten. El usuario debe aprobar cada escritura.",
          parameters: {
            type: "object",
            properties: {
              ruta: { type: "string", description: "Ruta del archivo, relativa al proyecto." },
              contenido: { type: "string", description: "Contenido completo del archivo." },
            },
            required: ["ruta", "contenido"],
            additionalProperties: false,
          },
          strict: true,
        },
      },
    ];

    // El acceso a la carpeta

    let carpeta = null; // FileSystemDirectoryHandle; queda fuera del estado reactivo

    function partesDeRuta(ruta) {
      const partes = ruta.split("/").filter((parte) => parte && parte !== ".");
      if (partes.includes("..")) {
        throw new Error("La ruta no puede salir de la carpeta del proyecto.");
      }
      return partes;
    }

    async function abrirCarpeta(partes, crear = false) {
      let actual = carpeta;
      for (const parte of partes) {
        actual = await actual.getDirectoryHandle(parte, { create: crear });
      }
      return actual;
    }

    async function abrirArchivo(ruta, crear = false) {
      const partes = partesDeRuta(ruta);
      const nombre = partes.pop();
      if (!nombre) throw new Error("Falta el nombre del archivo.");
      const contenedora = await abrirCarpeta(partes, crear);
      return contenedora.getFileHandle(nombre, { create: crear });
    }

    async function listarArchivos(ruta) {
      const partes = partesDeRuta(ruta);
      const inicio = await abrirCarpeta(partes);
      const lineas = [];

      async function recorrer(actual, prefijo) {
        const entradas = [];
        for await (const [nombre, manejador] of actual.entries()) {
          entradas.push([nombre, manejador]);
        }
        entradas.sort(([a], [b]) => a.localeCompare(b));

        for (const [nombre, manejador] of entradas) {
          if (lineas.length >= 500) return;
          if (manejador.kind === "directory") {
            if (CARPETAS_IGNORADAS.has(nombre)) continue;
            lineas.push(`${prefijo}${nombre}/`);
            await recorrer(manejador, `${prefijo}${nombre}/`);
          } else {
            lineas.push(`${prefijo}${nombre}`);
          }
        }
      }

      await recorrer(inicio, partes.length ? `${partes.join("/")}/` : "");
      return lineas.length ? lineas.join("\n") : "(carpeta vacía)";
    }

    async function leerArchivo(ruta) {
      const manejador = await abrirArchivo(ruta);
      const texto = await (await manejador.getFile()).text();
      if (texto.length > MAX_CARACTERES) {
        return texto.slice(0, MAX_CARACTERES) + "\n[archivo truncado]";
      }
      return texto;
    }

    async function escribirArchivo(ruta, contenido) {
      const manejador = await abrirArchivo(ruta, true);
      const escritor = await manejador.createWritable();
      await escritor.write(contenido);
      await escritor.close();
      return `Se escribió ${ruta} (${contarLineas(contenido)} líneas).`;
    }

    async function lineasActuales(ruta) {
      try {
        return contarLineas(await leerArchivo(ruta));
      } catch {
        return null; // el archivo no existe
      }
    }

    function contarLineas(texto) {
      return texto === "" ? 0 : texto.split("\n").length;
    }

    // La ejecución de herramientas

    const IMPLEMENTACIONES = {
      listar_archivos: ({ ruta }) => listarArchivos(ruta),
      leer_archivo: ({ ruta }) => leerArchivo(ruta),
      escribir_archivo: async ({ ruta, contenido }) => {
        const aprobado = await pedirAprobacion(ruta, contenido);
        if (!aprobado) return `El usuario rechazó escribir ${ruta}.`;
        return escribirArchivo(ruta, contenido);
      },
    };

    async function ejecutarHerramienta(llamada) {
      const implementacion = IMPLEMENTACIONES[llamada.function.name];
      if (!implementacion) {
        return `Error: no existe la herramienta ${llamada.function.name}.`;
      }
      try {
        const argumentos = JSON.parse(llamada.function.arguments);
        return await implementacion(argumentos);
      } catch (error) {
        return `Error: ${describirErrorDeArchivo(error)}`;
      }
    }

    function describirErrorDeArchivo(error) {
      if (error.name === "NotFoundError") return "no existe ese archivo o carpeta.";
      if (error.name === "TypeMismatchError") return "la ruta es una carpeta y se esperaba un archivo, o al revés.";
      if (error.name === "NotAllowedError") return "el navegador no dio permiso para acceder.";
      return error.message;
    }

    // La clave de API

    function leerClave() {
      return localStorage.getItem(NOMBRE_CLAVE) ?? "";
    }

    function guardarClave(clave) {
      localStorage.setItem(NOMBRE_CLAVE, clave);
    }

    function olvidarClave() {
      localStorage.removeItem(NOMBRE_CLAVE);
    }

    // La llamada a la API

    function armarMensajes(historia) {
      return [{ role: "developer", content: INSTRUCCIONES }, ...historia];
    }

    async function pedirPaso(historia, clave, senal) {
      const datos = await llamarApi({
        model: MODELO,
        messages: armarMensajes(historia),
        tools: HERRAMIENTAS,
        // En Chat Completions, GPT-6 solo admite herramientas sin razonamiento
        reasoning_effort: "none",
      }, clave, senal);

      const { message } = datos.choices[0];
      const mensaje = { role: "assistant", content: message.content };
      if (message.tool_calls?.length) {
        mensaje.tool_calls = message.tool_calls;
      }
      return mensaje;
    }

    const MAX_REINTENTOS = 3;

    async function llamarApi(cuerpo, clave, senal) {
      for (let intento = 0; ; intento++) {
        const respuesta = await fetch(URL_API, {
          method: "POST",
          signal: senal,
          headers: {
            "Authorization": `Bearer ${clave}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(cuerpo),
        });
        if (respuesta.ok) return respuesta.json();

        const error = await leerError(respuesta);
        if (!esReintentable(error) || intento === MAX_REINTENTOS) throw error;
        await esperar(segundosDeEspera(respuesta, intento), senal);
      }
    }

    async function leerError(respuesta) {
      let detalle = {};
      try {
        detalle = (await respuesta.json()).error ?? {};
      } catch {
        // la respuesta no trae JSON
      }
      const error = new Error(describirError(respuesta.status, detalle));
      error.status = respuesta.status;
      error.code = detalle.code;
      return error;
    }

    function describirError(status, { message, code }) {
      if (status === 401) return "La clave guardada no es válida. Ingresá otra.";
      if (code === "insufficient_quota") return "La cuenta no tiene saldo o el proyecto alcanzó su límite de gasto.";
      const texto = message || `La API respondió con el código ${status}.`;
      return code ? `${texto} (${status}, ${code})` : `${texto} (${status})`;
    }

    function esReintentable(error) {
      if (error.status === 429) return error.code !== "insufficient_quota";
      return error.status >= 500;
    }

    function segundosDeEspera(respuesta, intento) {
      const indicado = Number(respuesta.headers.get("retry-after"));
      return indicado > 0 ? indicado : 2 ** intento;
    }

    function esperar(segundos, senal) {
      return new Promise((resolver, rechazar) => {
        const temporizador = setTimeout(resolver, segundos * 1000);
        senal?.addEventListener("abort", () => {
          clearTimeout(temporizador);
          rechazar(new DOMException("Detenido", "AbortError"));
        }, { once: true });
      });
    }

    // El estado

    const estado = reactive({
      clave: leerClave(),
      carpeta: "",
      historia: [],
      trabajando: false,
      pendiente: null,
      error: "",
      verHistoria: false,
    });

    let controlador = null;
    let resolverAprobacion = null;

    function historiaPlana() {
      return JSON.parse(JSON.stringify(estado.historia));
    }

    function agregar(mensaje) {
      estado.historia = [...historiaPlana(), mensaje];
      desplazarAlFinal();
    }

    // El ciclo del agente

    async function responder() {
      estado.trabajando = true;
      estado.error = "";
      controlador = new AbortController();

      try {
        for (let paso = 0; paso < MAX_PASOS; paso++) {
          const mensaje = await pedirPaso(historiaPlana(), estado.clave, controlador.signal);
          agregar(mensaje);
          if (!mensaje.tool_calls) return;

          for (const llamada of mensaje.tool_calls) {
            const resultado = await ejecutarHerramienta(llamada);
            agregar({ role: "tool", tool_call_id: llamada.id, content: resultado });
          }
          if (controlador.signal.aborted) {
            estado.error = "Detuviste al asistente.";
            return;
          }
        }
        estado.error = `El asistente llegó al límite de ${MAX_PASOS} pasos sin terminar.`;
      } catch (error) {
        if (error.name === "AbortError") {
          estado.error = "Detuviste al asistente.";
        } else {
          estado.error = error.message;
          if (error.status === 401) {
            olvidarClave();
            estado.clave = "";
          }
        }
      } finally {
        estado.trabajando = false;
        controlador = null;
        desplazarAlFinal();
      }
    }

    function pedirAprobacion(ruta, contenido) {
      return lineasActuales(ruta).then((antes) => new Promise((resolver) => {
        resolverAprobacion = resolver;
        estado.pendiente = { ruta, contenido, antes };
        desplazarAlFinal();
      }));
    }

    function decidir(aprobado) {
      estado.pendiente = null;
      resolverAprobacion?.(aprobado);
      resolverAprobacion = null;
    }

    function detener() {
      controlador?.abort();
      if (estado.pendiente) decidir(false);
    }

    // Las acciones de la interfaz

    function enviarTexto(texto) {
      texto = texto.trim();
      if (!texto || estado.trabajando) return false;
      agregar({ role: "user", content: texto });
      responder();
      return true;
    }

    function alEnviar(evento) {
      evento.preventDefault();
      const entrada = evento.target.elements.entrada;
      if (enviarTexto(entrada.value)) {
        entrada.value = "";
        ajustarAltura(entrada);
      }
      entrada.focus();
    }

    function alTeclear(evento) {
      if (evento.key === "Enter" && !evento.shiftKey && !evento.isComposing) {
        evento.preventDefault();
        evento.target.form.requestSubmit();
      }
    }

    function alGuardarClave(evento) {
      evento.preventDefault();
      const clave = evento.target.elements.clave.value.trim();
      if (!clave) return;
      guardarClave(clave);
      estado.clave = clave;
      estado.error = "";
    }

    async function elegirCarpeta() {
      try {
        carpeta = await window.showDirectoryPicker({ mode: "readwrite" });
        estado.historia = [];
        estado.error = "";
        estado.carpeta = carpeta.name;
      } catch (error) {
        if (error.name !== "AbortError") estado.error = describirErrorDeArchivo(error);
      }
    }

    function cambiarCarpeta() {
      carpeta = null;
      estado.carpeta = "";
    }

    function nuevaConversacion() {
      estado.historia = [];
      estado.error = "";
      document.getElementById("entrada")?.focus();
    }

    function cambiarClave() {
      olvidarClave();
      estado.clave = "";
    }

    function alternarHistoria() {
      estado.verHistoria = !estado.verHistoria;
    }

    // Ayudas de la interfaz

    function ajustarAltura(entrada) {
      entrada.style.height = "auto";
      entrada.style.height = `${entrada.scrollHeight}px`;
    }

    function desplazarAlFinal() {
      requestAnimationFrame(() => {
        const conversacion = document.getElementById("conversacion");
        if (conversacion) conversacion.scrollTop = conversacion.scrollHeight;
      });
    }

    function resultadosPorLlamada() {
      const resultados = {};
      for (const mensaje of estado.historia) {
        if (mensaje.role === "tool") resultados[mensaje.tool_call_id] = mensaje.content;
      }
      return resultados;
    }

    function resumenPedido() {
      const mensajes = armarMensajes(historiaPlana());
      const caracteres = JSON.stringify(mensajes).length;
      return `El próximo pedido lleva ${mensajes.length} mensajes, unos ${caracteres} caracteres, y la descripción de ${HERRAMIENTAS.length} herramientas.`;
    }

    // Las vistas

    function vistaTexto(texto) {
      const partes = (texto ?? "").split(/```[\w-]*\n?([\s\S]*?)```/g);
      return partes.map((parte, indice) => {
        if (indice % 2 === 1) return html`<pre class="codigo">${parte.replace(/\n$/, "")}</pre>`;
        const limpio = parte.trim();
        return limpio ? html`<p class="texto">${limpio}</p>` : "";
      });
    }

    function vistaActividad(llamada, resultado) {
      let argumentos = {};
      try { argumentos = JSON.parse(llamada.function.arguments); } catch {}
      const ruta = argumentos.ruta ? html`<code>${argumentos.ruta}</code>` : "la carpeta del proyecto";
      const verbos = {
        listar_archivos: ["Listando", "Listó"],
        leer_archivo: ["Leyendo", "Leyó"],
        escribir_archivo: ["Escribiendo", "Escribió"],
      };
      const [enCurso, hecho] = verbos[llamada.function.name] ?? ["Usando", "Usó"];

      let clase = "actividad hecho";
      let texto = hecho;
      let detalle = "";
      if (resultado === undefined) {
        clase = "actividad en-curso";
        texto = enCurso;
      } else if (resultado.startsWith("Error")) {
        clase = "actividad fallo";
        texto = `No pudo ${enCurso === "Listando" ? "listar" : enCurso === "Leyendo" ? "leer" : "escribir"}`;
        detalle = resultado.replace(/^Error: /, ": ");
      } else if (resultado.startsWith("El usuario rechazó")) {
        clase = "actividad fallo";
        texto = "Rechazaste escribir";
      }

      return html`
        <div class="${clase}">
          <span class="marca-estado"></span>
          <span>${texto} ${ruta}${detalle}</span>
        </div>
      `;
    }

    function vistaMensajes() {
      const resultados = resultadosPorLlamada();
      return estado.historia.flatMap((mensaje) => {
        if (mensaje.role === "user") {
          return [html`<div class="mensaje user">${mensaje.content}</div>`];
        }
        if (mensaje.role === "assistant") {
          const vistas = [];
          if (mensaje.content) {
            vistas.push(html`<div class="mensaje assistant">${vistaTexto(mensaje.content)}</div>`);
          }
          for (const llamada of mensaje.tool_calls ?? []) {
            vistas.push(vistaActividad(llamada, resultados[llamada.id]));
          }
          return vistas;
        }
        return [];
      });
    }

    function vistaAprobacion() {
      const { ruta, contenido, antes } = estado.pendiente;
      const despues = contarLineas(contenido);
      const descripcion = antes === null
        ? `Archivo nuevo de ${despues} líneas.`
        : `Reemplaza el archivo actual: pasa de ${antes} a ${despues} líneas.`;
      return html`
        <div class="aprobacion">
          <h3>¿Escribir <code>${ruta}</code>?</h3>
          <p>${descripcion}</p>
          <pre class="codigo">${contenido}</pre>
          <div class="botones">
            <button class="primario" @click="${() => decidir(true)}">Aplicar cambio</button>
            <button class="boton" @click="${() => decidir(false)}">Rechazar</button>
          </div>
        </div>
      `;
    }

    function vistaClave() {
      return html`
        <main class="bienvenida">
          <h1>Asistente</h1>
          <p>Para trabajar hace falta una clave de API de OpenAI. Se guarda solo en este navegador.</p>
          ${() => estado.error ? html`<div class="aviso"><p>${estado.error}</p></div>` : ""}
          <form class="form-clave" @submit="${alGuardarClave}">
            <label for="clave">Clave de API</label>
            <input id="clave" name="clave" type="password" placeholder="sk-proj-…" autocomplete="off" required>
            <button class="primario">Guardar clave</button>
          </form>
        </main>
      `;
    }

    function vistaCarpeta() {
      const soportado = "showDirectoryPicker" in window;
      return html`
        <main class="bienvenida">
          <h1>Asistente</h1>
          <p>Elegí la carpeta de tu proyecto. El asistente va a poder listar, leer y escribir archivos solo dentro de ella, y cada escritura necesita tu aprobación.</p>
          ${() => estado.error ? html`<div class="aviso"><p>${estado.error}</p></div>` : ""}
          ${soportado
            ? html`<button class="primario" @click="${elegirCarpeta}">Elegir carpeta</button>`
            : html`<div class="aviso"><p>Este navegador no permite acceder a carpetas. Abrí la página en Chrome o Edge.</p></div>`}
        </main>
      `;
    }

    function vistaVacia() {
      return html`
        <div class="vacio">
          <h2>¿En qué te ayudo?</h2>
          <p>El asistente explora la carpeta con sus herramientas antes de responder. Abrí Historia para ver cada pedido y cada resultado.</p>
          <div class="sugerencias">
            ${SUGERENCIAS.map((texto) => html`
              <button class="sugerencia" @click="${() => enviarTexto(texto)}">${texto}</button>
            `)}
          </div>
        </div>
      `;
    }

    function vistaHistoria() {
      return html`
        <aside class="historia" aria-label="Historia enviada">
          <header>
            <h2>Lo que viaja en cada pedido</h2>
            <button class="boton" @click="${alternarHistoria}">Cerrar</button>
          </header>
          <p>${() => resumenPedido()}</p>
          <div class="panel-cuerpo">
            <details open>
              <summary>Mensajes</summary>
              <pre>${() => JSON.stringify(armarMensajes(historiaPlana()), null, 2)}</pre>
            </details>
            <details>
              <summary>Herramientas</summary>
              <pre>${JSON.stringify(HERRAMIENTAS, null, 2)}</pre>
            </details>
          </div>
        </aside>
      `;
    }

    function vistaAsistente() {
      return html`
        <div class="${() => estado.verHistoria ? "app con-historia" : "app"}">
          <header class="barra">
            <div class="marca">
              <h1>Asistente</h1>
              <span class="carpeta" title="Carpeta del proyecto">${() => estado.carpeta}</span>
            </div>
            <nav class="acciones">
              <button class="boton" aria-pressed="${() => String(estado.verHistoria)}" @click="${alternarHistoria}">
                Historia<span class="cuenta">${() => estado.historia.length}</span>
              </button>
              <button class="boton" disabled="${() => estado.historia.length === 0 || estado.trabajando}" @click="${nuevaConversacion}">
                Nueva conversación
              </button>
              <button class="boton" disabled="${() => estado.trabajando}" @click="${cambiarCarpeta}">Cambiar carpeta</button>
              <button class="boton" disabled="${() => estado.trabajando}" @click="${cambiarClave}">Cambiar clave</button>
            </nav>
          </header>

          <main class="conversacion" id="conversacion">
            <div class="hilo" aria-live="polite">
              ${() => estado.historia.length === 0 && !estado.trabajando ? vistaVacia() : ""}
              ${() => vistaMensajes()}
              ${() => estado.pendiente ? vistaAprobacion() : ""}
              ${() => estado.trabajando && !estado.pendiente ? html`
                <div class="mensaje assistant escribiendo" aria-label="El asistente está trabajando">
                  <span></span><span></span><span></span>
                </div>
              ` : ""}
              ${() => estado.error ? html`
                <div class="aviso">
                  <p>${estado.error}</p>
                  <button class="boton" @click="${responder}">Reintentar</button>
                </div>
              ` : ""}
            </div>
          </main>

          <div>
            <form class="compositor" @submit="${alEnviar}">
              <textarea id="entrada" name="entrada" rows="1" placeholder="Pedile algo sobre tu proyecto" aria-label="Mensaje"
                @keydown="${alTeclear}" @input="${(evento) => ajustarAltura(evento.target)}"></textarea>
              ${() => estado.trabajando ? html`
                <button type="button" class="enviar detener" aria-label="Detener" @click="${detener}">
                  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="2.5" fill="currentColor"/></svg>
                </button>
              ` : html`
                <button class="enviar" aria-label="Enviar">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 19V5M5 12l7-7 7 7"/>
                  </svg>
                </button>
              `}
            </form>
            <p class="ayuda">Enter envía. Mayúscula + Enter agrega una línea.</p>
          </div>

          ${() => estado.verHistoria ? vistaHistoria() : ""}
        </div>
      `;
    }

    html`${() => {
      if (!estado.clave) return vistaClave();
      if (!estado.carpeta) return vistaCarpeta();
      return vistaAsistente();
    }}`(document.getElementById("app"));
  </script>
</body>
</html>
