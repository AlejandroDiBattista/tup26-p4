<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda · Arrow.js + Drizzle</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; --ink:#203530; --muted:#63746e; --line:#dfe7e2; --accent:#176b50; --soft:#edf5f0; --danger:#ad3535; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6f8f6; color:var(--ink); font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:8px; padding:9px 14px; background:white; color:var(--ink); }
    button:hover { background:var(--soft); } button:disabled { opacity:.5; cursor:default; }
    button.primary { background:var(--accent); border-color:var(--accent); color:white; }
    button.danger { color:var(--danger); } button.small { padding:7px 10px; font-size:13px; }
    :focus-visible { outline:3px solid #9bd4bd; outline-offset:3px; }
    input,select { width:100%; min-width:0; border:1px solid #cddbd2; border-radius:8px; padding:10px 12px; color:var(--ink); background:white; }
    input::placeholder { color:#88958f; } label { display:block; font-size:13px; font-weight:600; }
    label input,label select { margin-top:6px; font-size:15px; font-weight:400; }
    .page { max-width:1120px; margin:0 auto; padding:30px 24px; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:25px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.14em; }
    h1 { font-size:29px; line-height:1.2; letter-spacing:-.04em; margin:6px 0; } h2 { margin:0; font-size:21px; letter-spacing:-.02em; }
    p { margin:6px 0; } .muted { color:var(--muted); } .badge { font:12px/1.4 ui-monospace,monospace; border:1px solid var(--line); border-radius:20px; padding:7px 12px; white-space:nowrap; background:white; }
    .workspace { display:grid; grid-template-columns:310px minmax(0,1fr); border:1px solid var(--line); border-radius:14px; background:white; overflow:hidden; min-height:535px; }
    .master { border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
    .master-head { padding:21px 18px 16px; border-bottom:1px solid var(--line); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; } .master h2 { font-size:15px; }
    .search { margin-top:17px; } .counter { font-size:12px; color:var(--muted); margin-top:10px; }
    .contact-list { list-style:none; margin:0; padding:8px; overflow:auto; max-height:480px; }
    .contact { display:flex; gap:12px; align-items:center; text-align:left; width:100%; border-color:transparent; margin:2px 0; padding:12px 10px; }
    .contact.selected { background:var(--soft); border-color:#c4dece; }
    .avatar { display:grid; place-items:center; flex:0 0 37px; height:37px; background:#eaf0ec; color:#4b675b; border-radius:50%; font-size:12px; font-weight:750; }
    .contact.selected .avatar { background:#d2e8da; color:var(--accent); }
    .contact-copy { min-width:0; } .contact-copy strong { display:block; font-size:14px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .contact-copy small { display:block; color:var(--muted); font-size:12px; }
    .detail { padding:26px 28px; min-width:0; } .detail-head { margin-bottom:24px; } .detail-head p { font-size:13px; }
    .empty { padding:48px 22px; text-align:center; color:var(--muted); } .empty h2 { color:var(--ink); margin-bottom:8px; } .empty button { margin-top:15px; }
    fieldset { padding:0; margin:0; border:0; min-width:0; } .fields { display:grid; grid-template-columns:1fr 1fr; gap:16px; } .full { grid-column:1/-1; }
    .addresses { margin-top:26px; padding-top:23px; border-top:1px solid var(--line); } .addresses h3 { font-size:14px; margin:0; } .addresses .muted { font-size:12px; }
    .address-row { display:grid; grid-template-columns:140px minmax(0,1fr) 34px; align-items:end; gap:10px; margin-top:13px; }
    .remove { height:43px; padding:0; font-size:21px; color:var(--muted); border-color:transparent; } .remove:hover { color:var(--danger); background:#fff0f0; }
    .no-address { border:1px dashed var(--line); border-radius:8px; padding:14px; margin-top:14px; font-size:13px; color:var(--muted); }
    .actions { display:flex; align-items:center; gap:9px; padding-top:24px; margin-top:24px; border-top:1px solid var(--line); } .actions .danger { margin-right:auto; }
    .status { padding:0 0 16px; font-size:13px; } .error { color:#972626; padding:12px 15px; border:1px solid #edcccc; background:#fff4f4; border-radius:8px; margin-bottom:14px; }
    .notice { color:var(--accent); padding:0 0 14px; } .dirty { color:#986a13; font-size:12px; }
    details { margin-top:18px; border:1px solid var(--line); background:white; border-radius:10px; padding:13px 17px; }
    summary { cursor:pointer; font-size:13px; font-weight:600; } .trace { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:15px; }
    .trace h3 { margin:0 0 7px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
    pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; max-height:250px; overflow:auto; }
    .footer { display:flex; justify-content:space-between; gap:15px; margin-top:17px; color:var(--muted); font-size:11px; }
    [hidden] { display:none !important; }
    @media(max-width:700px) { .page { padding:20px 13px; } .header { align-items:flex-start; } h1 { font-size:24px; } .header .badge { display:none; } .workspace { grid-template-columns:1fr; } .master { border-right:0; border-bottom:1px solid var(--line); } .contact-list { max-height:200px; } .master-head { padding:16px; } .detail { padding:22px 17px; } .fields { gap:13px; } .address-row { grid-template-columns:108px minmax(0,1fr) 28px; gap:6px; } .address-row input,.address-row select { padding-left:8px; padding-right:8px; } .trace { grid-template-columns:1fr; } .footer { flex-direction:column; gap:3px; } }
  </style>
</head>

  </script>
  <script>
  'use strict';
  const { reactive, html } = window.Arrow;

  // 1. ESTADO DE LA INTERFAZ. No hay SQLite, SQL ni Drizzle en el navegador.
  const API = (new URLSearchParams(location.search).get('api') || '/api').replace(/\/$/, '');
  const s = reactive({
    contactos: [], q: '', borrador: null, original: null, sucio: false,
    ocupado: false, buscando: false, error: '', aviso: '', traza: null, version: 0,
  });
  let clave = 0, busqueda = 0, temporizador;
  const tipos = [['telefono','Teléfono'], ['celular','Celular'], ['email','Email']];
  const vacio = () => ({ nombre:'', apellido:'', domicilio:'', direcciones:[] });
  const contenido = c => ({
    nombre:c.nombre, apellido:c.apellido, domicilio:c.domicilio,
    direcciones:c.direcciones.map(d => ({ tipo:d.tipo, valor:d.valor })),
  });
  function mostrar(c) {
    s.original = c ? JSON.parse(JSON.stringify(c)) : null;
    s.borrador = c ? { ...c, direcciones:c.direcciones.map(d => ({ ...d, clave:++clave })) } : null;
    s.sucio = false;
    s.version++; // Un nuevo editor: no reutilizar manejadores del contacto anterior.
  }
  function cambiado() { s.sucio = true; s.aviso = ''; }
  function puedeSalir() { return !s.sucio || confirm('Hay cambios sin guardar. ¿Descartarlos?'); }

  // 2. ÚNICO PUNTO DE COMUNICACIÓN. La frontera entre ambos programas es JSON/HTTP.
  async function api(ruta, { method='GET', body, registrar=true } = {}) {
    const peticion = { method, headers:{ Accept:'application/json' }, cache:'no-store' };
    if (body !== undefined) {
      peticion.headers['Content-Type'] = 'application/json';
      peticion.body = JSON.stringify(body);
    }
    let respuesta;
    try { respuesta = await fetch(API + ruta, peticion); }
    catch {
      throw new Error('No se pudo conectar con la API. Ejecutá npm start y abrí http://127.0.0.1:3000.');
    }
    const texto = await respuesta.text();
    let datos = null;
    try { datos = texto ? JSON.parse(texto) : null; }
    catch { throw new Error('La URL devolvió algo que no es JSON. Revisá la dirección de la API.'); }
    if (registrar) s.traza = { method, ruta:API+ruta, body:body ?? null, status:respuesta.status, datos };
    if (!respuesta.ok) throw new Error(datos?.error || `Error HTTP ${respuesta.status}`);
    return datos;
  }

  // 3. BÚSQUEDA ACTIVA. Las coincidencias las busca el servidor, no Array.filter().
  async function listar(registrar=true) {
    const turno = ++busqueda;
    s.buscando = true;
    try {
      const ruta = `/contactos?q=${encodeURIComponent(s.q.trim())}`;
      const datos = await api(ruta, { registrar:false });
      if (turno !== busqueda) return; // Una respuesta vieja no pisa la nueva.
      s.contactos = datos;
      if (registrar) s.traza = { method:'GET', ruta:API+ruta, body:null, status:200, datos };
    } catch (e) { if (turno === busqueda) s.error = e.message; }
    finally { if (turno === busqueda) s.buscando = false; }
  }
  function buscar(e) {
    s.q = e.target.value;
    s.error = '';
    clearTimeout(temporizador);
    ++busqueda; // Invalidar también durante los 220 ms de espera.
    temporizador = setTimeout(() => listar(), 220);
  }
  async function seleccionar(id) {
    if (s.ocupado || s.borrador?.id === id || !puedeSalir()) return;
    s.ocupado = true; s.error = ''; s.aviso = '';
    try { mostrar(await api(`/contactos/${id}`)); }
    catch (e) { s.error = e.message; }
    finally { s.ocupado = false; }
  }
  function nuevo() {
    if (s.ocupado || !puedeSalir()) return;
    mostrar(vacio()); s.error = ''; s.aviso = '';
    requestAnimationFrame(() => document.querySelector('#nombre')?.focus());
  }
  function cancelar() { mostrar(s.original); s.error = ''; s.aviso = ''; }
  function agregar() {
    if (s.borrador.direcciones.length >= 20) return;
    s.borrador.direcciones.push({ clave:++clave, tipo:'celular', valor:'' }); cambiado();
  }
  function quitar(d) {
    s.borrador.direcciones = s.borrador.direcciones.filter(x => x.clave !== d.clave); cambiado();
  }
  async function guardar(e) {
    e.preventDefault();
    if (s.ocupado) return;
    s.ocupado = true; s.error = ''; s.aviso = '';
    try {
      const id = s.borrador.id;
      const c = await api(id ? `/contactos/${id}` : '/contactos', {
        method:id ? 'PUT' : 'POST', body:contenido(s.borrador),
      });
      mostrar(c); s.aviso = 'Contacto y direcciones guardados.';
      await listar(false); // Mantener visible la traza del POST/PUT, no taparla con GET.
    } catch (e) { s.error = e.message; }
    finally { s.ocupado = false; }
  }
  async function eliminar() {
    if (s.ocupado || !s.borrador?.id) return;
    if (!confirm('¿Eliminar este contacto y todas sus direcciones?')) return;
    s.ocupado = true; s.error = ''; s.aviso = '';
    try {
      await api(`/contactos/${s.borrador.id}`, { method:'DELETE' });
      mostrar(null); s.aviso = 'Contacto eliminado.'; await listar(false);
    } catch (e) { s.error = e.message; }
    finally { s.ocupado = false; }
  }

  // 4. PLANTILLAS ARROW. Funciones en ${...} = valores que siguen al estado reactivo.
  function tarjeta(c) {
    return html`<li><button class="${() => `contact ${s.borrador?.id === c.id ? 'selected' : ''}`}"
      type="button" aria-pressed="${() => String(s.borrador?.id === c.id)}"
      disabled="${() => s.ocupado}" @click="${() => seleccionar(c.id)}">
      <span class="avatar" aria-hidden="true">${(c.nombre[0]+c.apellido[0]).toUpperCase()}</span>
      <span class="contact-copy"><strong>${c.apellido}, ${c.nombre}</strong>
      <small>${c.cantidadDirecciones} ${c.cantidadDirecciones === 1 ? 'dirección' : 'direcciones'}</small></span>
    </button></li>`.key(c.id);
  }
  function fila(d) {
    return html`<div class="address-row">
      <label>Tipo<select aria-label="Tipo de dirección"
        @change="${e => { d.tipo=e.target.value; cambiado(); }}">
        ${tipos.map(([valor,etiqueta]) => html`<option value="${valor}" selected="${() => d.tipo === valor}">${etiqueta}</option>`)}
      </select></label>
      <label>Valor<input aria-label="Valor de dirección" type="${() => d.tipo === 'email' ? 'email' : 'tel'}"
        required maxlength="254" placeholder="${() => d.tipo === 'email' ? 'nombre@ejemplo.com' : 'Número de contacto'}"
        .value="${() => d.valor}" @input="${e => { d.valor=e.target.value; cambiado(); }}"></label>
      <button type="button" class="remove" aria-label="Quitar dirección" title="Quitar dirección" @click="${() => quitar(d)}">×</button>
    </div>`.key(d.clave);
  }
  function editor(c) {
    return html`<form @submit="${guardar}">
      <div class="detail-head row"><div>
        <span class="eyebrow">${c.id ? `Contacto #${c.id}` : 'Nuevo contacto'}</span>
        <h2>${c.id ? 'Detalle del contacto' : 'Crear contacto'}</h2>
        <p class="muted">Los cambios se envían al presionar Guardar.</p>
      </div><span class="dirty">${() => s.sucio ? 'Sin guardar' : ''}</span></div>
      <fieldset disabled="${() => s.ocupado}">
        <div class="fields">
          <label>Nombre<input id="nombre" name="nombre" required maxlength="80" autocomplete="given-name"
            .value="${() => c.nombre}" @input="${e => { c.nombre=e.target.value; cambiado(); }}"></label>
          <label>Apellido<input name="apellido" required maxlength="80" autocomplete="family-name"
            .value="${() => c.apellido}" @input="${e => { c.apellido=e.target.value; cambiado(); }}"></label>
          <label class="full">Domicilio <span class="muted">· opcional</span>
            <input name="domicilio" maxlength="200" autocomplete="street-address" placeholder="Calle, número y localidad"
              .value="${() => c.domicilio}" @input="${e => { c.domicilio=e.target.value; cambiado(); }}"></label>
        </div>
        <section class="addresses" aria-label="Direcciones del contacto">
          <div class="row"><div><h3>Direcciones de contacto <span class="muted">1:N</span></h3>
            <p class="muted">Teléfonos, celulares y emails. Hasta 20 por contacto.</p></div>
            <button type="button" class="small" disabled="${() => c.direcciones.length >= 20}" @click="${agregar}">+ Agregar</button>
          </div>
          ${() => c.direcciones.map(fila)}
          ${() => c.direcciones.length ? '' : html`<p class="no-address">Sin direcciones. Podés guardar el contacto así o agregar una.</p>`}
        </section>
        <div class="actions">
          <button type="button" class="danger" disabled="${!c.id}" @click="${eliminar}">Eliminar</button>
          <button type="button" @click="${cancelar}">Cancelar</button>
          <button type="submit" class="primary">${() => s.ocupado ? 'Guardando…' : 'Guardar'}</button>
        </div>
      </fieldset>
    </form>`;
  }
  const app = document.querySelector('#app');
  app.replaceChildren();
  html`<main class="page">
    <header class="header"><div><span class="eyebrow">Demostración · maestro / detalle</span>
      <h1>Agenda de contactos</h1><p class="muted">Una interfaz, una API y una relación uno a muchos.</p>
    </div><span class="badge">Arrow.js → REST → Drizzle</span></header>
    <div role="alert" class="error" hidden="${() => !s.error}">${() => s.error}</div>
    <div role="status" class="notice" hidden="${() => !s.aviso}">${() => s.aviso}</div>
    <div class="workspace">
      <aside class="master" aria-label="Listado de contactos">
        <div class="master-head"><div class="row"><h2>Contactos</h2>
          <button type="button" class="primary small" disabled="${() => s.ocupado}" @click="${nuevo}">+ Nuevo</button></div>
          <label class="search">Buscar contactos<input type="search" maxlength="100" placeholder="Nombre, teléfono o email…"
            .value="${() => s.q}" @input="${buscar}"></label>
          <div class="counter" role="status">${() => s.buscando ? 'Buscando…' : `${s.contactos.length} contactos encontrados`}</div>
        </div>
        <ul class="contact-list">${() => s.contactos.map(tarjeta)}</ul>
        <p class="empty" hidden="${() => s.buscando || s.contactos.length > 0}">No hay contactos para mostrar.</p>
      </aside>
      <section class="detail" aria-label="Detalle del contacto">
        ${() => s.borrador ? editor(s.borrador).key(s.version) : html`<div class="empty"><span class="eyebrow">Tu agenda</span>
          <h2>Seleccioná un contacto</h2><p>O creá uno nuevo y agregá sus direcciones.</p>
          <button type="button" disabled="${() => s.ocupado}" @click="${nuevo}">Crear un contacto</button></div>`}
      </section>
    </div>
    <details><summary>Ver comunicación REST <span class="muted">· última operación</span></summary>
      <div class="trace"><section><h3>Petición del navegador</h3><pre>${() => s.traza
        ? `${s.traza.method} ${s.traza.ruta}\n\n${s.traza.body ? JSON.stringify(s.traza.body,null,2) : '(sin cuerpo)'}` : 'Todavía no hay operaciones.'}</pre></section>
        <section><h3>Respuesta del servidor</h3><pre>${() => s.traza
          ? `HTTP ${s.traza.status}\n\n${s.traza.datos === null ? '(sin cuerpo)' : JSON.stringify(s.traza.datos,null,2)}` : ''}</pre></section></div>
    </details>
    <footer class="footer"><span>Frontend: Arrow.js · Backend: Express + Drizzle + SQLite</span><span>Demo local, sin autenticación · Datos iniciales ficticios</span></footer>
  </main>`(app);

  window.addEventListener('beforeunload', e => { if (s.sucio) { e.preventDefault(); e.returnValue=''; } });
  if (location.protocol === 'file:') {
    s.error = 'No abras el HTML con doble clic. Ejecutá npm start y abrí http://127.0.0.1:3000 en el navegador.';
  } else {
    (async () => { await listar(); if (s.contactos.length && !s.borrador) await seleccionar(s.contactos[0].id); })();
  }
  </script>
</body>
</html>
