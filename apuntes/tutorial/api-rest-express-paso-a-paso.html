<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La API de la agenda, paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #FFFFFF;
  --tinta: #0B1324;
  --tinta-2: #2C3B57;
  --gris: #5B6B85;
  --linea: #C9D3E3;
  --acento: #2F5BEA;
  --acento-suave: #E3EAFD;
  --codigo: #F3F6FB;
  --codigo-borde: #D3DCEA;
  --ok: #147A3C;
  --cliente: #A35200;
  --falla: #B4232A;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Code", Consolas, "SF Mono", "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #E4EAF3; font-family: var(--sans); color: var(--tinta); }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; background: var(--papel); overflow: hidden; }

.pantalla { position: absolute; inset: 0 0 50px 0; padding: 20px 28px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.cab { display: flex; align-items: center; gap: 14px; }
.num { font: 700 18px var(--mono); color: #fff; background: var(--acento); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.cab h2 { margin: 0; font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.idea { margin: 0; font-size: 25px; line-height: 1.3; color: var(--tinta-2); }

/* Paso: código a la izquierda, diálogo a la derecha */
.dos { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.rotulo { font: 600 19px var(--sans); color: var(--tinta-2); display: flex; align-items: center; gap: 10px; }
.rotulo .archivo { font-family: var(--mono); font-weight: 600; color: var(--tinta); background: var(--codigo); border: 2px solid var(--codigo-borde); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 3px 12px; }
.caja { flex: 1; min-height: 0; overflow: hidden; background: var(--codigo); border: 2px solid var(--codigo-borde); border-radius: 0 8px 8px 8px; padding: 10px 0; }
.caja-libre { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.caja-libre > .dialogo { flex: none; }

pre.code { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 20px; line-height: 1.32; white-space: pre; tab-size: 2; color: var(--tinta); width: max-content; }
pre.code .ln { display: block; padding: 0 16px 0 10px; border-left: 6px solid transparent; }
pre.code .ln.add { background: #DCE7FF; border-left-color: var(--acento); }
pre.code .ln.pliegue { color: var(--gris); font-family: var(--sans); font-style: italic; font-weight: 500; }
.on pre.code .ln.add { animation: marca 1.2s ease-out; }
@keyframes marca { from { background: #B9CCFF; } }

.dialogo { display: flex; flex-direction: column; gap: 8px; }
.dialogo .bloque { display: flex; flex-direction: column; gap: 4px; }
.dialogo .etq { font: 600 16px var(--sans); color: var(--tinta-2); }
.dialogo pre.code { width: auto; background: var(--codigo); border: 2px solid var(--codigo-borde); border-radius: 8px; padding: 8px 0; overflow: hidden; }
.dialogo pre.code .ln { padding: 0 12px; }
.dialogo pre.term { background: #F6F3EC; border-color: #E2D9C6; }
.caida { font-size: 22px; font-weight: 600; color: var(--falla); border: 2px dashed var(--falla); border-radius: 8px; padding: 10px 14px; }
.nota { font-size: 21px; line-height: 1.3; border-left: 5px solid var(--cliente); background: #FFF6E8; padding: 8px 12px; border-radius: 0 8px 8px 0; }
.contador { display: flex; align-items: center; gap: 8px; font: 600 17px var(--sans); color: var(--gris); }
.contador i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--acento); display: inline-block; }
.contador i.si { background: var(--acento); }
.on .dialogo { animation: aparece .35s ease-out; }
.dos.solo-codigo { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) !important; }
.dos.solo-codigo > .col:last-child, .dos.solo-dialogo > .col:first-child { display: none; }
.dos.solo-dialogo { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) !important; }
.solo-dialogo .dialogo.apilada { grid-template-columns: max-content; }
.apilado .dialogo, .solo-dialogo .dialogo { display: grid; grid-template-columns: max-content max-content; column-gap: 16px; row-gap: 8px; align-items: start; }
.apilado .dialogo > .contador, .apilado .dialogo > .nota, .apilado .dialogo > .ancho, .apilado .dialogo > .caida,
.solo-dialogo .dialogo > .contador, .solo-dialogo .dialogo > .nota, .solo-dialogo .dialogo > .ancho, .solo-dialogo .dialogo > .caida { grid-column: 1 / -1; }
@keyframes aparece { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .on pre.code .ln.add, .on .dialogo { animation: none; } }

.t-kw { color: #1D3FC2; font-weight: 600; }
.t-str { color: #9A3412; }
.t-num { color: #B4232A; }
.t-rx { color: #B4232A; }
.t-com { color: #5A6982; font-style: italic; }
.t-fn { color: #0B6E66; font-weight: 600; }
.t-type { color: #6B2BD9; }
.t-key { color: #1D3FC2; }
.t-attr { color: #0B6E66; font-weight: 600; }
.t-hval { color: var(--tinta); }
.t-meth { color: #1D3FC2; font-weight: 700; }
.t-path { color: #9A3412; }
.t-ver { color: #5A6982; }
.t-dim { color: #8A97AD; }
.t-s2 { color: var(--ok); font-weight: 700; }
.t-s3 { color: #1D3FC2; font-weight: 700; }
.t-s4 { color: var(--cliente); font-weight: 700; }
.t-s5 { color: var(--falla); font-weight: 700; }
.t-cmd { color: var(--tinta); font-weight: 700; }
.t-err { color: var(--falla); font-weight: 600; }

/* Conceptos, portada y cierre: un área que se escala */
.area { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; overflow: hidden; }
.cuerpo { flex: none; display: flex; flex-direction: column; gap: 14px; }
.par { display: grid; grid-template-columns: max-content max-content; gap: 24px; align-items: start; }
.par .bloque { display: flex; flex-direction: column; gap: 6px; }
.par .etq { font: 600 19px var(--sans); color: var(--tinta-2); }
.tarjeta { display: flex; flex-direction: column; gap: 8px; border: 3px solid var(--tinta); border-radius: 14px; padding: 20px 24px; font-size: 25px; width: 420px; }
.tarjeta b { font-size: 32px; }
.tarjeta em { font: 600 23px var(--mono); font-style: normal; color: var(--cliente); margin-top: 6px; }
.cuerpo > .bloque { display: flex; flex-direction: column; gap: 6px; }
.cuerpo > .bloque .etq { font: 600 19px var(--sans); color: var(--tinta-2); }
.cuerpo > .bloque pre.code { background: var(--codigo); border: 2px solid var(--codigo-borde); border-radius: 8px; padding: 8px 0; }
.par pre.code { background: var(--codigo); border: 2px solid var(--codigo-borde); border-radius: 8px; padding: 8px 0; }
ol.plain { margin: 0; padding-left: 1.3em; font-size: 24px; line-height: 1.45; }
table.t { border-collapse: collapse; font-size: 24px; }
table.t th { text-align: left; font-weight: 600; color: var(--tinta-2); font-size: 20px; padding: 0 26px 8px 0; border-bottom: 2px solid var(--linea); white-space: nowrap; }
table.t td { padding: 8px 26px 8px 0; border-bottom: 1px solid #E1E7F0; white-space: nowrap; }
.m { font-family: var(--mono); font-weight: 700; color: #1D3FC2; }
.mono { font-family: var(--mono); }
.familia { display: grid; grid-template-columns: 110px max-content; gap: 20px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #E1E7F0; font-size: 28px; }
.familia b { font: 700 38px var(--mono); }
.familia em { font: 500 22px var(--mono); color: var(--tinta-2); font-style: normal; margin-left: 14px; }
.f2 b { color: var(--ok); } .f3 b { color: #1D3FC2; } .f4 b { color: var(--cliente); } .f5 b { color: var(--falla); }

.portada h1 { margin: 0 0 14px; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em; }
.portada .sub { margin: 0 0 22px; font-size: 26px; color: var(--tinta-2); max-width: 30em; }
.boceto { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; width: 760px; }
.boceto div { border: 2px solid var(--codigo-borde); background: var(--codigo); border-radius: 8px; padding: 14px; font-size: 20px; color: var(--tinta-2); min-height: 130px; }
.boceto b { display: block; font-size: 22px; color: var(--tinta); margin-bottom: 6px; }
.ayuda { font-size: 19px; color: var(--gris); margin-top: 18px; }
kbd { font: 600 0.9em var(--mono); border: 2px solid var(--linea); border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; background: #fff; color: var(--tinta); }

.flow { display: flex; align-items: flex-start; gap: 30px; width: max-content; }
.node { position: relative; text-align: center; }
.node .b { border: 3px solid var(--tinta); border-radius: 12px; padding: 16px 12px; font: 600 20px var(--mono); background: #fff; white-space: nowrap; }
.node small { display: block; font-size: 19px; color: var(--tinta-2); margin-top: 8px; }
.node:not(:last-child)::after { content: ""; position: absolute; right: -27px; top: 26px; width: 23px; height: 3px; background: var(--acento); }
.node:not(:last-child)::before { content: ""; position: absolute; right: -29px; top: 20px; border: 7px solid transparent; border-left: 12px solid var(--acento); border-right: 0; }
.node.pedido .b { background: var(--tinta); color: #fff; }
.node.resp .b { border-color: var(--ok); color: var(--ok); }
.lead { font-size: 27px; line-height: 1.3; margin: 0; max-width: 34em; }

/* Barra */
.rail { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 24px; border-top: 1px solid #DCE3EE; background: #fff; }
.nodes { flex: 1; display: flex; align-items: center; }
.nodes .link { flex: 1; height: 2px; background: var(--linea); min-width: 6px; }
.nodes .link.done { background: var(--acento); }
.sec { font: 600 16px var(--sans); border: 2px solid var(--linea); color: var(--gris); background: #fff; border-radius: 999px; padding: 3px 11px; cursor: pointer; white-space: nowrap; }
.sec.done { border-color: var(--acento); color: var(--acento); }
.sec.now { background: var(--acento); border-color: var(--acento); color: #fff; }
.cont { font: 600 16px var(--mono); color: var(--gris); min-width: 64px; text-align: right; }
.navb { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--linea); background: #fff; color: var(--tinta); font-size: 20px; cursor: pointer; }
.navb:hover { border-color: var(--acento); color: var(--acento); }
.sec:focus-visible, .navb:focus-visible, .card:focus-visible { outline: 3px solid var(--cliente); outline-offset: 2px; }

.overview { position: absolute; inset: 0; background: rgba(255,255,255,0.98); display: none; flex-direction: column; padding: 28px 40px; gap: 16px; z-index: 5; }
.overview.on { display: flex; }
.ov-head { display: flex; justify-content: space-between; align-items: baseline; }
.ov-head h2 { margin: 0; font-size: 34px; }
.ov-head span { font-size: 18px; color: var(--gris); }
.ov-grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; padding: 4px; }
.card { text-align: left; border: 2px solid #DCE3EE; background: #fff; border-radius: 10px; padding: 10px 12px; font: 500 19px/1.3 var(--sans); color: var(--tinta); cursor: pointer; display: flex; gap: 10px; }
.card b { font-family: var(--mono); color: var(--gris); min-width: 28px; }
.card i { display: block; font-style: normal; font-size: 15px; color: var(--gris); }
.card.now { border-color: var(--acento); background: var(--acento-suave); }
</style>
</head>
<body>
<div id="stage">
  <div id="pantalla" class="pantalla on"></div>
  <div class="overview" id="overview" role="dialog" aria-label="Índice">
    <div class="ov-head"><h2>Índice</h2><span><kbd>O</kbd> o <kbd>Esc</kbd> para cerrar</span></div>
    <div class="ov-grid" id="ovGrid"></div>
  </div>
  <nav class="rail" aria-label="Secciones">
    <div class="nodes" id="nodes"></div>
    <span class="cont" id="contador"></span>
    <button class="navb" id="prev" aria-label="Anterior">‹</button>
    <button class="navb" id="next" aria-label="Siguiente">›</button>
  </nav>
</div>

ngify(elementos, null, 2));\n}\n", "intercambios": [], "diff": false, "panel": {"titulo": "Lo que queda en datos/", "lang": "tree", "texto": "datos/\n├── contactos.json\n├── usuarios.json\n└── sesiones.json"}}, {"tipo": "paso", "sec": 8, "titulo": "Las contraseñas no se guardan", "idea": "Se guarda un hash con sal, calculado con una función lenta a propósito.", "archivo": "src/contrasenas.js", "codigo": "import { scrypt, randomBytes, timingSafeEqual } from 'node:crypto';\nimport { promisify } from 'node:util';\n\nconst derivar = promisify(scrypt);\n\nexport async function hashear(contrasena) {\n  const sal = randomBytes(16).toString('hex');\n  const clave = await derivar(contrasena, sal, 64);\n  return `${sal}:${clave.toString('hex')}`;\n}\n\nexport async function verificar(contrasena, guardado) {\n  const [sal, claveGuardada] = guardado.split(':');\n  const clave = await derivar(contrasena, sal, 64);\n  return timingSafeEqual(clave, Buffer.from(claveGuardada, 'hex'));\n}\n", "intercambios": [{"comando": "node demo-hash.js", "terminal": "e906c2664baf5c83673cb6939e1b278b:089e297430298c4...\n84c48eb90d8584208b57638528af78bb:d563d2aead02de6...\ntrue\nfalse", "nota": "Misma contraseña, hashes distintos: cada uno tiene su sal."}], "diff": false}, {"tipo": "paso", "sec": 8, "titulo": "Registrarse", "idea": "El hash nunca sale de la API. Registrarse no inicia sesión.", "archivo": "src/cuentas.rutas.js", "codigo": "import { Router } from 'express';\nimport * as usuarios from './usuarios.repositorio.js';\nimport * as sesiones from './sesiones.repositorio.js';\nimport { validarCredenciales } from './usuarios.validacion.js';\nimport { hashear, verificar } from './contrasenas.js';\nimport { COOKIE_SESION, opcionesCookie, requerirSesion } from './sesion.js';\nimport { ErrorHttp } from './errores.js';\n\nexport const rutasUsuarios = Router();\nexport const rutasSesiones = Router();\n\nfunction publico(usuario) {\n  return { id: usuario.id, email: usuario.email };\n}\n\nrutasUsuar <script>
/* ---------- Resaltado de código ---------- */
const PALABRAS = new Set(('import export from const let var function async await return if else throw new class ' +
  'extends constructor super for of in typeof null undefined true false this default try catch').split(' '));

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const sp = (clase, s) => `<span class="t-${clase}">${esc(s)}</span>`;

function lineaJs(linea) {
  const re = /(\/\/.*$)|(`(?:\\[\s\S]|[^`\\])*`)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")|(\/(?![*\/])(?:\\.|\[(?:\\.|[^\]\\])*\]|[^\/\\\[])+\/[gimsuy]*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)|(\s+)|([\s\S])/g;
  let out = '';
  let previo = '';
  let m;
  while ((m = re.exec(linea))) {
    const [t, com, tpl, str, rx, num, id, ws] = m;
    if (com) out += sp('com', t);
    else if (tpl) { out += plantilla(t); previo = 'x'; }
    else if (str) { out += sp('str', t); previo = 'x'; }
    else if (rx) {
      if (previo === '' || /[=(,:!&|?{};\[]$/.test(previo) || previo === 'return') { out += sp('rx', t); previo = 'x'; }
      else { out += esc('/'); re.lastIndex = m.index + 1; previo = '/'; }
    }
    else if (num) { out += sp('num', t); previo = 'x'; }
    else if (id) {
      if (PALABRAS.has(id)) out += sp('kw', id);
      else if (linea[re.lastIndex] === '(') out += sp('fn', id);
      else if (/^[A-Z]/.test(id)) out += sp('type', id);
      else out += esc(id);
      previo = id;
    }
    else if (ws) out += t;
    else { out += esc(t); previo = t; }
  }
  return out;
}

function plantilla(t) {
  let out = '';
  let ultimo = 0;
  const re = /\$\{([^}]*)\}/g;
  let m;
  while ((m = re.exec(t))) {
    out += sp('str', t.slice(ultimo, m.index));
    out += sp('kw', '${') + lineaJs(m[1]) + sp('kw', '}');
    ultimo = re.lastIndex;
  }
  return out + sp('str', t.slice(ultimo));
}

function lineaJson(linea) {
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\b\d+(?:\.\d+)?\b)|\b(true|false|null)\b|([\s\S])/g;
  let out = '';
  let m;
  while ((m = re.exec(linea))) {
    if (m[1]) out += sp(m[2] ? 'key' : 'str', m[1]) + (m[2] ? esc(m[2]) : '');
    else if (m[3]) out += sp('num', m[3]);
    else if (m[4]) out += sp('kw', m[4]);
    else out += esc(m[5]);
  }
  return out;
}

function lineaBash(linea) {
  if (/^\s*#/.test(linea)) return sp('com', linea);
  const re = /(\s#.*$)|('[^']*'|"(?:\\.|[^"\\])*")|(\s--?[\w-]+)|(\\$)|(\S+)|(\s+)/g;
  let out = '';
  let primera = !/^\s/.test(linea);
  let m;
  while ((m = re.exec(linea))) {
    const [, comentario, cadena, opcion, sigue, palabra, espacio] = m;
    if (comentario) out += sp('com', comentario);
    else if (cadena) out += sp('str', cadena);
    else if (opcion) out += sp('attr', opcion);
    else if (sigue) out += sp('com', sigue);
    else if (palabra) {
      if (primera) out += sp('fn', palabra);
      else if (/^"?https?:/.test(palabra) || /^[A-Z_]+=/.test(palabra)) out += sp('path', palabra);
      else out += esc(palabra);
      primera = false;
    }
    else out += espacio;
  }
  return out;
}

function lineasHttp(lineas) {
  let estado = 'nada';
  return lineas.map(linea => {
    let m;
    if (/^###/.test(linea)) { estado = 'nada'; return sp('com', linea); }
    if ((m = linea.match(/^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)(\s+)(\S+)(.*)$/))) {
      estado = 'encabezados';
      return sp('meth', m[1]) + esc(m[2]) + sp('path', m[3]) + sp('ver', m[4]);
    }
    if ((m = linea.match(/^(HTTP\/[\d.]+)(\s+)(\d)(\d\d.*)$/))) {
      estado = 'encabezados';
      return sp('ver', m[1]) + esc(m[2]) + sp('s' + m[3], m[3] + m[4]);
    }
    if (estado === 'encabezados') {
      if (linea.trim() === '') { estado = 'cuerpo'; return ''; }
      if ((m = linea.match(/^([\w-]+)(:)(.*)$/))) return sp('attr', m[1]) + esc(m[2]) + sp('hval', m[3]);
    }
    if (estado === 'cuerpo') return lineaJson(linea);
    return esc(linea);
  });
}

const SQL_PALABRAS = new Set(('CREATE TABLE IF NOT EXISTS INTEGER TEXT REAL BLOB PRIMARY KEY NULL UNIQUE INSERT INTO ' +
  'VALUES SELECT FROM WHERE LIKE ORDER BY UPDATE SET DELETE RETURNING AND OR ALTER ADD INDEX ON ASC DESC').split(' '));

function lineaSql(linea) {
  const re = /(--.*$)|('(?:[^']|'')*')|(`[^`]*`)|(\?|:[A-Za-z_]\w*)|(\b\d+\b)|([A-Za-z_]\w*)|([\s\S])/g;
  let out = '';
  let m;
  while ((m = re.exec(linea))) {
    if (m[1]) out += sp('com', m[1]);
    else if (m[2]) out += sp('str', m[2]);
    else if (m[3]) out += sp('fn', m[3]);
    else if (m[4]) out += sp('num', m[4]);
    else if (m[5]) out += sp('num', m[5]);
    else if (m[6]) out += SQL_PALABRAS.has(m[6].toUpperCase()) ? sp('kw', m[6]) : esc(m[6]);
    else out += esc(m[7]);
  }
  return out;
}

function lineaEnv(linea) {
  if (/^\s*#/.test(linea)) return sp('com', linea);
  const m = linea.match(/^([A-Za-z_]\w*)(=)(.*)$/);
  if (!m) return esc(linea);
  return sp('attr', m[1]) + esc(m[2]) + sp('str', m[3]);
}

function lineaLog(linea) {
  const m = linea.match(/^(\w+) (\S+) → (\d)(\d\d)(.*)$/);
  if (!m) return esc(linea);
  return sp('meth', m[1]) + ' ' + sp('path', m[2]) + ' → ' + sp('s' + m[3], m[3] + m[4]) + sp('com', m[5]);
}

function lineaArbol(linea) {
  const m = linea.match(/^([│├└─\s]*)(\S+)(\s{2,}.*)?$/);
  if (!m) return esc(linea);
  return sp('dim', m[1]) + esc(m[2]) + (m[3] ? sp('com', m[3]) : '');
}

function resaltar(lenguaje, lineas) {
  switch (lenguaje) {
    case 'js': return lineas.map(lineaJs);
    case 'json': return lineas.map(lineaJson);
    case 'bash': return lineas.map(lineaBash);
    case 'http': return lineasHttp(lineas);
    case 'log': return lineas.map(lineaLog);
    case 'sql': return lineas.map(lineaSql);
    case 'env': return lineas.map(lineaEnv);
    case 'tree': return lineas.map(lineaArbol);
    default: return lineas.map(esc);
  }
}



function lineaTerminal(linea) {
  if (linea.startsWith('$ ')) return sp('dim', '$ ') + sp('cmd', linea.slice(2));
  if (/→ \d{3}/.test(linea)) return lineaLog(linea);
  if (/Error|^<anonymous|^Node\.js v/.test(linea)) return sp('err', linea);
  return esc(linea);
}

// Un paso se recorre así: primero el código a pantalla completa,
// después cada pedido con su respuesta, también a pantalla completa.
const VISTAS = [];
PANTALLAS.forEach((p, i) => {
  if (p.tipo !== 'paso') { VISTAS.push({ i, k: 0 }); return; }
  VISTAS.push({ i, k: -1 });
  const n = Math.max(1, p.intercambios.length);
  for (let k = 0; k < n; k++) VISTAS.push({ i, k });
});

// Número de paso, solo para las pantallas con código
let contadorPasos = 0;

/* ---------- Diferencias entre versiones de un archivo ---------- */
function versionAnterior(i) {
  const actual = PANTALLAS[i];
  for (let j = i - 1; j >= 0; j--) {
    const p = PANTALLAS[j];
    if (p.tipo === 'paso' && p.archivo === actual.archivo && p.codigo !== actual.codigo) return p.codigo;
  }
  return null;
}

function lineasNuevas(antes, ahora) {
  const a = antes.split('\n');
  const b = ahora.split('\n');
  const t = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let x = a.length - 1; x >= 0; x--) {
    for (let y = b.length - 1; y >= 0; y--) {
      t[x][y] = a[x] === b[y] ? t[x + 1][y + 1] + 1 : Math.max(t[x + 1][y], t[x][y + 1]);
    }
  }
  const nuevas = new Set();
  let x = 0;
  let y = 0;
  while (y < b.length) {
    if (x < a.length && a[x] === b[y]) { x++; y++; }
    else if (x < a.length && t[x + 1][y] >= t[x][y + 1]) x++;
    else { nuevas.add(y); y++; }
  }
  return nuevas;
}

function codigoDelPaso(i) {
  const p = PANTALLAS[i];
  const lineas = p.codigo.replace(/\n$/, '').split('\n');
  const anterior = p.diff ? (p.anterior ?? versionAnterior(i)) : null;
  const nuevas = anterior ? lineasNuevas(anterior.replace(/\n$/, ''), lineas.join('\n')) : new Set();

  let visible;
  if (p.foco) {
    visible = new Set();
    p.foco.forEach(([a, b]) => { for (let n = a - 1; n <= b - 1; n++) visible.add(n); });
  } else if (nuevas.size && lineas.length > 24) {
    visible = new Set();
    nuevas.forEach(n => { for (let d = -1; d <= 1; d++) visible.add(n + d); });
  } else {
    visible = new Set(lineas.map((_, n) => n));
  }

  const html = resaltar(p.archivo.endsWith('.js') ? 'js' : 'text', lineas);
  const salida = [];
  let n = 0;
  while (n < lineas.length) {
    if (visible.has(n)) {
      salida.push(`<span class="ln${nuevas.has(n) ? ' add' : ''}">${html[n] || ' '}</span>`);
      n++;
      continue;
    }
    let fin = n;
    while (fin < lineas.length && !visible.has(fin)) fin++;
    const cantidad = fin - n;
    if (cantidad === 1) salida.push(`<span class="ln">${html[n] || ' '}</span>`);
    else salida.push(`<span class="ln pliegue">⋯ ${cantidad} líneas${anterior ? ' sin cambios' : ''}</span>`);
    n = fin;
  }
  return `<pre class="code">${salida.join('')}</pre>`;
}

function bloqueCodigo(lenguaje, texto, clase = '') {
  const lineas = texto.split('\n');
  const html = lenguaje === 'terminal' ? lineas.map(lineaTerminal) : resaltar(lenguaje, lineas);
  return `<pre class="code ${clase}">${html.map(h => `<span class="ln">${h || ' '}</span>`).join('')}</pre>`;
}

/* ---------- Armado de cada tipo de pantalla ---------- */
function dialogoDe(p, k) {
  if (!p.intercambios.length) {
    const panel = p.panel;
    return `<div class="dialogo"><div class="bloque ancho"><div class="etq">${esc(panel.titulo)}</div>${bloqueCodigo(panel.lang, panel.texto, panel.lang === 'terminal' ? 'term' : '')}</div></div>`;
  }
  const x = p.intercambios[k];
  const total = p.intercambios.length;
  let html = '';
  if (total > 1) {
    const puntos = p.intercambios.map((_, n) => `<i class="${n <= k ? 'si' : ''}"></i>`).join('');
    html += `<div class="contador">${puntos}<span>${k + 1} de ${total}</span></div>`;
  }
  if (x.reinicio) {
    html += `<div class="bloque ancho"><div class="etq">Terminal del servidor</div>${bloqueCodigo('terminal', `$ node src/servidor.js\n${x.terminal}`, 'term')}</div>`;
  } else if (x.comando) {
    html += `<div class="bloque ancho"><div class="etq">Terminal</div>${bloqueCodigo('terminal', `$ ${x.comando}\n${x.terminal}`, 'term')}</div>`;
  } else {
    html += `<div class="bloque"><div class="etq">Pedido</div>${bloqueCodigo('http', x.pedido)}</div>`;
    html += x.respuesta
      ? `<div class="bloque"><div class="etq">Respuesta</div>${bloqueCodigo('http', x.respuesta)}</div>`
      : `<div class="caida">Sin respuesta: el servidor se cayó.</div>`;
    if (x.terminal) html += `<div class="bloque ancho"><div class="etq">Terminal del servidor</div>${bloqueCodigo('terminal', x.terminal, 'term')}</div>`;
  }
  if (x.nota) html += `<div class="nota">${esc(x.nota)}</div>`;
  return `<div class="dialogo">${html}</div>`;
}

/* ---------- Ajuste al espacio disponible ---------- */
const ZOOM = CSS.supports('zoom', '1');

function buscarZoom(entra, minimo, maximo) {
  if (entra(maximo)) return maximo;
  let bajo = minimo;
  let alto = maximo;
  for (let n = 0; n < 10; n++) {
    const medio = (bajo + alto) / 2;
    if (entra(medio)) bajo = medio;
    else alto = medio;
  }
  entra(bajo);
  return bajo;
}

function ajustarCodigo(caja, tope = 1.6) {
  const pre = caja.firstElementChild;
  return buscarZoom(z => {
    pre.style.zoom = z;
    const c = caja.getBoundingClientRect();
    const r = pre.getBoundingClientRect();
    return r.width <= c.width - 4 && r.bottom <= c.bottom - 8;
  }, 0.5, tope);
}

function ajustarBloque(caja, tope) {
  const cuerpo = caja.firstElementChild;
  const ancho = caja.clientWidth;
  return buscarZoom(z => {
    cuerpo.style.zoom = z;
    cuerpo.style.width = caja.dataset.ajuste === 'dialogo' ? `${ancho / z}px` : '';
    const c = caja.getBoundingClientRect();
    const r = cuerpo.getBoundingClientRect();
    if (r.height > c.height + 1 || r.width > c.width + 1) return false;
    if (cuerpo.scrollWidth > cuerpo.clientWidth + 1) return false;
    return [...cuerpo.querySelectorAll('pre')].every(p => p.scrollWidth <= p.clientWidth + 1);
  }, 0.4, tope);
}

// Código y diálogo pueden ir lado a lado o uno arriba del otro.
// Se prueban varias proporciones y se queda la que deja la letra más grande.
const DISPOSICIONES = [
  ['lado', 0.5], ['lado', 0.58], ['lado', 0.66],
  ['apilado', 0.45], ['apilado', 0.55], ['apilado', 0.65],
];

function disponer(dos, modo, f) {
  dos.classList.toggle('apilado', modo === 'apilado');
  dos.style.gridTemplateColumns = modo === 'lado' ? `minmax(0, ${f}fr) minmax(0, ${1 - f}fr)` : 'minmax(0, 1fr)';
  dos.style.gridTemplateRows = modo === 'lado' ? '' : `minmax(0, ${f}fr) minmax(0, ${1 - f}fr)`;
}

// Con A se ven el código y el diálogo juntos en la misma pantalla.
let juntos = false;

function ajustarPaso(dos) {
  const ampliado = juntos ? null : (VISTAS[actual].k < 0 ? 'codigo' : 'dialogo');
  const codigo = dos.querySelector('[data-ajuste=codigo]');
  const dialogo = dos.querySelector('[data-ajuste=dialogo]');
  dos.classList.toggle('solo-codigo', ampliado === 'codigo');
  dos.classList.toggle('solo-dialogo', ampliado === 'dialogo');
  if (ampliado === 'codigo') { dos.style.gridTemplateColumns = ''; dos.style.gridTemplateRows = ''; ajustarCodigo(codigo, 2); return; }
  if (ampliado === 'dialogo') {
    dos.style.gridTemplateColumns = '';
    dos.style.gridTemplateRows = '';
    // Pedido y respuesta lado a lado, o uno debajo del otro: lo que deje la letra más grande
    const d = dialogo.firstElementChild;
    d.classList.remove('apilada');
    const enFila = ajustarBloque(dialogo, 2.4);
    d.classList.add('apilada');
    const enColumna = ajustarBloque(dialogo, 2.4);
    if (enFila > enColumna) { d.classList.remove('apilada'); ajustarBloque(dialogo, 2.4); }
    return;
  }
  const medir = () => Math.min(20 * ajustarCodigo(codigo), 18 * ajustarBloque(dialogo, 1.5));
  let mejor = null;
  for (const [modo, f] of DISPOSICIONES) {
    disponer(dos, modo, f);
    const letra = medir();
    if (!mejor || letra > mejor.letra) mejor = { modo, f, letra };
  }
  disponer(dos, mejor.modo, mejor.f);
  medir();
}

function ajustar() {
  if (!ZOOM) return;
  const dos = contenedor.querySelector('.dos');
  if (dos) ajustarPaso(dos);
  contenedor.querySelectorAll('[data-ajuste=area]').forEach(caja => ajustarBloque(caja, Number(caja.dataset.tope) || 1.5));
}

/* ---------- Navegación ---------- */
const stage = document.getElementById('stage');
const contenedor = document.getElementById('pantalla');
const nodos = document.getElementById('nodes');
const contador = document.getElementById('contador');
const overview = document.getElementById('overview');
const ovGrid = document.getElementById('ovGrid');
let actual = 0;

const ANCHO = 1280;
function escalar() {
  const alto = Math.round(Math.min(1024, Math.max(640, ANCHO * window.innerHeight / window.innerWidth)));
  stage.style.height = `${alto}px`;
  const s = Math.min(window.innerWidth / ANCHO, window.innerHeight / alto);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}

function dibujar() {
  const { i, k } = VISTAS[actual];
  const p = PANTALLAS[i];
  const html = p.tipo === 'paso' ? pantallaPaso(p, i, k)
    : p.tipo === 'concepto' ? pantallaConcepto(p)
    : p.tipo === 'portada' ? pantallaPortada()
    : pantallaCierre(p);
  contenedor.classList.remove('on');
  contenedor.innerHTML = html;
  void contenedor.offsetWidth;
  contenedor.classList.add('on');
  ajustar();
  actualizarBarra(p, i);
  history.replaceState(null, '', `#${actual + 1}`);
}

function mostrar(n) {
  actual = Math.max(0, Math.min(VISTAS.length - 1, n));
  dibujar();
}

function primeraVista(i) { return VISTAS.findIndex(v => v.i === i); }

function construirBarra() {
  nodos.innerHTML = SECCIONES.map((nombre, k) =>
    `${k ? '<span class="link"></span>' : ''}<button class="sec" data-k="${k}">${nombre}</button>`).join('');
  nodos.addEventListener('click', e => {
    const b = e.target.closest('.sec');
    if (!b) return;
    const i = PANTALLAS.findIndex(p => p.sec === Number(b.dataset.k));
    if (i >= 0) mostrar(primeraVista(i));
  });
}

function actualizarBarra(p, i) {
  nodos.querySelectorAll('.sec').forEach(b => {
    const k = Number(b.dataset.k);
    b.classList.toggle('now', k === p.sec);
    b.classList.toggle('done', k < p.sec);
  });
  nodos.querySelectorAll('.link').forEach((l, k) => l.classList.toggle('done', k < p.sec));
  contador.textContent = `${i + 1} / ${PANTALLAS.length}`;
}

function construirIndice() {
  ovGrid.innerHTML = PANTALLAS.map((p, i) => {
    const titulo = p.tipo === 'portada' ? 'La API de la agenda, paso a paso' : p.titulo;
    const seccion = p.sec >= 0 ? SECCIONES[p.sec] : 'Portada';
    const etiqueta = p.tipo === 'paso' ? `Paso ${p.numero} · ${seccion}` : seccion;
    return `<button class="card" data-i="${i}"><b>${i + 1}</b><span>${esc(titulo)}<i>${esc(etiqueta)}</i></span></button>`;
  }).join('');
  ovGrid.addEventListener('click', e => {
    const c = e.target.closest('.card');
    if (!c) return;
    alternarIndice(false);
    mostrar(primeraVista(Number(c.dataset.i)));
  });
}

function alternarIndice(abrir = !overview.classList.contains('on')) {
  overview.classList.toggle('on', abrir);
  if (!abrir) return;
  const i = VISTAS[actual].i;
  ovGrid.querySelectorAll('.card').forEach((c, n) => c.classList.toggle('now', n === i));
  const c = ovGrid.querySelector('.card.now');
  if (c) { c.scrollIntoView({ block: 'center' }); c.focus(); }
}

function pantallaCompleta() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (overview.classList.contains('on')) {
    if (k === 'Escape' || k === 'o' || k === 'O') { e.preventDefault(); alternarIndice(false); }
    return;
  }
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(k)) { e.preventDefault(); mostrar(actual + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)) { e.preventDefault(); mostrar(actual - 1); }
  else if (k === 'Home') mostrar(0);
  else if (k === 'End') mostrar(VISTAS.length - 1);
  else if (k === 'o' || k === 'O') alternarIndice(true);
  else if (k === 'f' || k === 'F') pantallaCompleta();
  else if (k === 'a' || k === 'A') { juntos = !juntos; ajustar(); }
});

document.getElementById('prev').addEventListener('click', () => mostrar(actual - 1));
document.getElementById('next').addEventListener('click', () => mostrar(actual + 1));

let toqueX = null;
stage.addEventListener('touchstart', e => { toqueX = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => {
  if (toqueX === null) return;
  const dx = e.changedTouches[0].clientX - toqueX;
  if (Math.abs(dx) > 50) mostrar(actual + (dx < 0 ? 1 : -1));
  toqueX = null;
});

window.addEventListener('resize', () => { escalar(); ajustar(); });

construirBarra();
construirIndice();
escalar();
mostrar((parseInt(location.hash.slice(1), 10) || 1) - 1);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
</script>
</body>
</html>
