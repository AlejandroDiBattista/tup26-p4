<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botón contar motos</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #fff; color: #09090b; font-family: ui-sans-serif, system-ui, sans-serif; }
        .tarjeta { display: flex; flex-direction: column; gap: .75rem; width: 14rem; padding: 1rem; border: 1px solid #e4e4e7; border-radius: .5rem; }
        .acciones { display: flex; align-items: center; gap: .75rem; }
        .acciones button { width: 4rem; flex: none; }
        .acciones .icono { min-height: 3.5rem; padding: .25rem; font-size: 2rem; line-height: 1; }
        .cronometro { flex: 1; text-align: center; font-size: 2rem; font-weight: 600; }
        button { width: 100%; padding: .5rem 1rem; border: 1px solid #e4e4e7; border-radius: .375rem; background: #fff; color: #18181b; font: inherit; font-size: .875rem; font-weight: 500; text-align: center; cursor: pointer; box-shadow: 0 1px 2px #0000000d; transition: background 150ms; }
        .contador { display: flex; align-items: center; padding: .75rem 1rem; text-align: left; font-size: 1rem; }
        .etiqueta { display: flex; align-items: center; gap: .5rem; flex: 0 0 7rem; font-weight: 600; }
        .icono-vehiculo { width: 1.4em; text-align: center; }
        .valor { flex: 1; text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1rem; font-variant-numeric: tabular-nums; }
        .numero { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
        button:hover { background: #f4f4f5; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        button:focus-visible { outline: 2px solid #18181b; outline-offset: 2px; }
        .resumen { display: flex; flex-direction: column; gap: .5rem; margin-top: .25rem; padding-top: .75rem; border-top: 1px solid #e4e4e7; }
        .fila { display: flex; justify-content: space-between; align-items: center; color: #52525b; font-size: .875rem; }
        .total strong { color: #18181b; font-size: 1.25rem; }
        .flujo { padding: .75rem; border-radius: .375rem; background: #f4f4f5; color: #18181b; font-weight: 600; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        function createElement(tipo, propiedades, ...hijos) {
            if (typeof tipo === "function") {
                return tipo({ ...propiedades, children: hijos });
            }

            const elemento = document.createElement(tipo);

            for (const [nombre, valor] of Object.entries(propiedades ?? {})) {
                if (nombre.startsWith("on") && typeof valor === "function") {
                    elemento.addEventListener(nombre.slice(2).toLowerCase(), valor);
                } else if (nombre === "disabled") {
                    elemento.disabled = valor;
                } else {
                    elemento.setAttribute(nombre, valor);
                }
            }

            for (const hijo of hijos) {
                elemento.append(
                    hijo instanceof Node ? hijo : document.createTextNode(String(hijo))
                );
            }

            return elemento;
        }

        const h = createElement;

        const estados = [];
        const efectos = [];
        let indiceEstado = 0;
        let indiceEfecto = 0;
        let efectosPendientes = [];
        let redibujadoPendiente = false;

        function solicitarRedibujado() {
            if (redibujadoPendiente) return;

            redibujadoPendiente = true;
            queueMicrotask(() => {
                redibujadoPendiente = false;
                redibujar();
            });
        }

        function useState(valorInicial) {
            const indice = indiceEstado++;

            if (estados[indice] === undefined) {
                estados[indice] = valorInicial;
            }

            function actualizarEstado(nuevoValor) {
                estados[indice] = typeof nuevoValor === "function"
                    ? nuevoValor(estados[indice])
                    : nuevoValor;
                solicitarRedibujado();
            }

            return [estados[indice], actualizarEstado];
        }

        function useEffect(efecto, dependencias) {
            const indice = indiceEfecto++;
            const anterior = efectos[indice];
            const cambio = !anterior || dependencias.some(
                (dependencia, i) => !Object.is(dependencia, anterior.dependencias[i])
            );

            if (cambio) efectosPendientes.push({ indice, efecto, dependencias });
        }

        function Contador({ nombre, cantidad, onClick, deshabilitado }) {
            const iconos = { Motos: "🏍️", Autos: "🚗", Camionetas: "🚙" };

            return h("button", { class: "contador", onClick, disabled: deshabilitado },
                h("span", { class: "etiqueta" },
                    h("span", { class: "icono-vehiculo", "aria-hidden": "true" }, iconos[nombre]),
                    h("span", null, `${nombre}:`)
                ),
                h("span", { class: "valor" }, cantidad)
            );
        }

        function BotonMedicion({ enCurso, onAlternar }) {
            const accion = enCurso ? "Finalizar" : "Comenzar";
            return h("button", {
                class: "icono",
                onClick: onAlternar,
                title: `${accion} medición`,
                "aria-label": `${accion} medición`
            }, enCurso ? "■" : "▶");
        }

        function Controles({ enCurso, cronometro, onAlternar }) {
            return h("div", { class: "acciones" },
                h(BotonMedicion, { enCurso, onAlternar }),
                h("span", { class: "numero cronometro", "aria-live": "off" }, cronometro)
            );
        }

        function Tarjeta({ children }) {
            return h("section", { class: "tarjeta" }, ...children);
        }

        function Resumen({ cantidad, inicio, fin }) {
            const segundos = inicio
                ? Math.floor(((fin ?? new Date()).getTime() - inicio.getTime()) / 1000)
                : 0;
            const vehiculosPorHora = segundos > 0
                ? Math.round(cantidad / segundos * 3600).toLocaleString("es-AR")
                : "—";

            return h("section", { class: "resumen" },
                h("div", { class: "fila total" },
                    h("span", null, "Total de vehículos"),
                    h("strong", { class: "numero" }, cantidad)
                ),
                h("div", { class: "fila" },
                    h("span", null, "Tiempo transcurrido"),
                    h("span", { class: "numero" }, `${segundos} s`)
                ),
                h("div", { class: "fila flujo" },
                    h("span", null, "Flujo"),
                    h("strong", { class: "numero" }, `${vehiculosPorHora} v/h`)
                )
            );
        }

        function render(componente, contenedor) {
            indiceEstado = 0;
            indiceEfecto = 0;
            efectosPendientes = [];
            contenedor.replaceChildren(componente());

            for (const pendiente of efectosPendientes) {
                efectos[pendiente.indice]?.limpiar?.();
                efectos[pendiente.indice] = {
                    dependencias: pendiente.dependencias,
                    limpiar: pendiente.efecto()
                };
            }
        }

        function App() {
            const [motos, setMotos] = useState(0);
            const [autos, setAutos] = useState(0);
            const [camionetas, setCamionetas] = useState(0);
            const [inicio, setInicio] = useState(null);
            const [fin, setFin] = useState(null);
            const [, setPulso] = useState(0);
            const enCurso = inicio !== null && fin === null;
            const segundos = inicio
                ? Math.floor(((fin ?? new Date()).getTime() - inicio.getTime()) / 1000)
                : 0;
            const cronometro = `${String(Math.floor(segundos / 60)).padStart(2, "0")}:${String(segundos % 60).padStart(2, "0")}`;

            useEffect(() => {
                if (!enCurso) return;

                const timer = setInterval(() => { setPulso(pulso => pulso + 1); }, 1000);

                return () => clearInterval(timer);
            }, [enCurso]);

            function alternarMedicion() {
                if (enCurso) {
                    setFin(new Date());
                } else {
                    setMotos(0);
                    setAutos(0);
                    setCamionetas(0);
                    setInicio(new Date());
                    setFin(null);
                }
            }

            return h(Tarjeta, null,
                h(Controles, { enCurso, cronometro, onAlternar: alternarMedicion }),
                h(Contador, { nombre: "Motos", cantidad: motos, onClick: () => setMotos(motos + 1), deshabilitado: !enCurso }),
                h(Contador, { nombre: "Autos", cantidad: autos, onClick: () => setAutos(autos + 1), deshabilitado: !enCurso }),
                h(Contador, { nombre: "Camionetas", cantidad: camionetas, onClick: () => setCamionetas(camionetas + 1), deshabilitado: !enCurso }),
                h(Resumen, { cantidad: motos + autos + camionetas, inicio, fin })
            );
        }

        function redibujar() {
            render(App, document.querySelector("#app"));
        }

        redibujar();
    </script>
</body>
</html>
