<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conteo de tránsito</title>
<style>
:root { --fondo: #f4f5f8; --panel: #ffffff; --texto: #1c2230; --suave: #5a6375; --borde: #d7dbe3; --acento: #2254d1; --acento-suave: #e7edfc; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; padding: 24px 16px; background: var(--fondo); color: var(--texto); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .4; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: 20px; background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; }
.app h1 { margin: 0; font-size: 1.6rem; }
.control { display: flex; align-items: center; gap: 16px; }
.principal { width: 64px; height: 64px; flex: none; border: none; border-radius: 50%; background: var(--acento); color: #fff; font-size: 1.6rem; line-height: 1; }
.cronometro { flex: 1; text-align: center; font: 700 2rem/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .02em; }
.contadores { display: flex; flex-direction: column; gap: 12px; }
.contador { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; background: var(--panel); color: var(--texto); border: 2px solid var(--acento); border-radius: 12px; text-align: left; }
.contador:not(:disabled):hover { background: var(--acento-suave); }
.contador:not(:disabled):active { transform: scale(.98); }
.nombre { font-size: 1.4rem; font-weight: 600; }
.cantidad { font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 14px; background: var(--acento-suave); border-radius: 12px; }
.dato { text-align: center; }
.titulo { margin: 0; color: var(--suave); font-size: .95rem; }
.valor { margin: 0; font-size: 2rem; font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<main class="app">
  <h1>Conteo de tránsito</h1>

  <div class="control">
    <button id="boton" class="principal" title="Iniciar">▶</button>
    <div id="cronometro" class="cronometro">00:00:00</div>
  </div>

  <div class="contadores">
    <button class="contador" disabled>
      <span class="nombre">🏍️ Motos</span> <span class="cantidad">0</span>
    </button>
    <button class="contador" disabled>
      <span class="nombre">🚗 Autos</span> <span class="cantidad">0</span>
    </button>
    <button class="contador" disabled>
      <span class="nombre">🛻 Camionetas</span> <span class="cantidad">0</span>
    </button>
  </div>

  <section class="resumen">
    <div class="dato"><p class="titulo">Total de vehículos</p><p id="total" class="valor">0</p></div>
    <div class="dato"><p class="titulo">Flujo total</p><p id="flujo" class="valor">—</p></div>
  </section>
</main>

<script>
// ---------- Estado ----------
let inicio = null;   // null: detenido
let total = 0;       // el contador global
let reloj = null;    // el id del setInterval

// ---------- Nodos que vamos a modificar ----------
const boton = document.getElementById("boton");
const cronometro = document.getElementById("cronometro");
const textoTotal = document.getElementById("total");
const textoFlujo = document.getElementById("flujo");

function formatearDuracion(segundos) {
  const horas = String(Math.floor(segundos / 3600)).padStart(2, "0");
  const minutos = String(Math.floor((segundos % 3600) / 60)).padStart(2, "0");
  const resto = String(segundos % 60).padStart(2, "0");
  return `${horas}:${minutos}:${resto}`;
}

// Flujo: cuántos vehículos pasarían en una hora al ritmo observado.
function calcularFlujo(cantidad, segundos) {
  if (segundos === 0) return "—";
  return `${Math.round((cantidad * 3600) / segundos)} v/h`;
}

// ---------- El contador autocontenido ----------
function crearContador(elemento, alRegistrar) {
  const textoCantidad = elemento.querySelector(".cantidad");
  let cantidad = 0;   // su estado, encerrado en la clausura

  elemento.addEventListener("click", () => {
    cantidad++;
    textoCantidad.textContent = cantidad;   // actualiza su propio número
    alRegistrar();                          // avisa al padre
  });

  return {
    habilitar(habilitado) { elemento.disabled = !habilitado; },
    reiniciar() { cantidad = 0; textoCantidad.textContent = 0; },
  };
}

const contadores = [...document.querySelectorAll(".contador")]
  .map((elemento) => crearContador(elemento, registrarVehiculo));

// ---------- La aplicación ----------
function segundosTranscurridos() {
  return inicio === null ? 0 : Math.floor((Date.now() - inicio) / 1000);
}

function actualizarTiempo() {
  const segundos = segundosTranscurridos();
  cronometro.textContent = formatearDuracion(segundos);
  textoFlujo.textContent = calcularFlujo(total, segundos);
}

function registrarVehiculo() {
  total++;
  textoTotal.textContent = total;
  textoFlujo.textContent = calcularFlujo(total, segundosTranscurridos());
}

function iniciar() {
  inicio = Date.now();
  total = 0;
  textoTotal.textContent = 0;
  for (const contador of contadores) {
    contador.reiniciar();
    contador.habilitar(true);
  }
  boton.textContent = "⏹";
  boton.title = "Detener";
  reloj = setInterval(actualizarTiempo, 1000);
  actualizarTiempo();
}

function detener() {
  clearInterval(reloj);
  inicio = null;
  for (const contador of contadores) contador.habilitar(false);
  boton.textContent = "▶";
  boton.title = "Iniciar";
  actualizarTiempo();
}

boton.addEventListener("click", () => (inicio === null ? iniciar() : detener()));
</script>
</body>
</html>
