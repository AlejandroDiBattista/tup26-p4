<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini React: conteo de tránsito</title>
<style>
:root {
  --fondo: #f4f5f8;
  --panel: #ffffff;
  --texto: #1c2230;
  --suave: #5a6375;
  --borde: #d7dbe3;
  --acento: #2254d1;
  --acento-suave: #e7edfc;
  --aviso: #f2a516;
  --aviso-suave: #fff4d9;
  --codigo: #fbfbf6;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--fondo);
  color: var(--texto);
  font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .4; }

.pagina {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 14px 24px 10px;
}
.pagina h1 { margin: 0; font-size: 1.4rem; }
.pagina p { margin: 0; color: var(--suave); }

.escenario {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 400px;
  gap: 20px;
  padding: 0 24px 20px;
}

/* ---------- La aplicación ---------- */
.app {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 14px;
  padding: 20px;
  display: flex; flex-direction: column; gap: 18px;
}
.app > h1 { margin: 0; font-size: 1.8rem; }
.control { display: flex; align-items: center; gap: 16px; }
.control .principal {
  width: 64px; height: 64px; flex: none; border-radius: 50%;
  border: none; background: var(--acento); color: #fff; font-size: 1.6rem; line-height: 1;
}
.cronometro {
  flex: 1; text-align: center;
  font: 700 2rem/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  letter-spacing: .02em;
}

.contadores { display: flex; flex-direction: column; gap: 12px; }
.contador {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  width: 100%; padding: 12px 20px;
  border: 2px solid var(--acento); border-radius: 12px;
  background: var(--panel); color: var(--texto); text-align: left;
}
.contador:not(:disabled):hover { background: var(--acento-suave); }
.contador:not(:disabled):active { transform: scale(.98); }
.contador .nombre { font-size: 1.5rem; font-weight: 600; }
.contador .cantidad { font-size: 2.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }

.resumen {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;
  background: var(--acento-suave); border-radius: 12px; padding: 14px;
}
.dato { text-align: center; }
.dato .titulo { margin: 0; color: var(--suave); font-size: .95rem; }
.dato .valor { margin: 0; font-size: 2.2rem; font-weight: 700; }

/* Cada render crea nodos nuevos: la animación arranca de nuevo en todos. */
@keyframes destello {
  from { box-shadow: 0 0 0 3px var(--aviso); background-color: var(--aviso-suave); }
  to   { box-shadow: 0 0 0 3px transparent; }
}
body.resaltar .componente { animation: destello .7s ease-out; }

/* ---------- Panel del framework ---------- */
.inspector {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 14px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 0;
}
.inspector h2 { margin: 0; font-size: 1.2rem; }
.inspector .renders { margin: 0; font-size: 1.1rem; }
.inspector .renders strong { font-size: 1.6rem; color: var(--acento); }
.inspector label { color: var(--suave); font-size: .95rem; }
.tabla-contenedor { overflow: auto; flex: 1; }
table { border-collapse: collapse; width: 100%; font: 14px/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace; }
th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--borde); }
th { position: sticky; top: 0; background: var(--panel); }
tr.efecto td { color: #6b3fa0; }
tr.cambio td { background: var(--aviso-suave); }
.nota { margin: 0; color: var(--suave); font-size: .85rem; }

/* ---------- Código fuente ---------- */
.codigo { padding: 0 24px 24px; }
.pestanas { display: flex; gap: 6px; }
.pestanas button {
  padding: 8px 16px; border: 1px solid var(--borde); border-bottom: none;
  border-radius: 8px 8px 0 0; background: var(--fondo);
}
.pestanas button.activa { background: var(--codigo); font-weight: 600; }
pre {
  margin: 0; padding: 16px; overflow: auto; max-height: 75vh;
  background: var(--codigo); border: 1px solid var(--borde); border-radius: 0 10px 10px 10px;
  font: 15px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: #1f2430;
}

@media (max-width: 1000px) {
  .escenario { grid-template-columns: 1fr; }
  .inspector { max-height: 520px; }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .pagina, .escenario, .codigo { padding-left: 12px; padding-right: 12px; }
  .contadores, .resumen { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="resaltar">

<header class="pagina">
  <h1>Mini React</h1>
  <p>createElement, useState y useEffect con reconstrucción total de la pantalla</p>
</header>

<div class="escenario">
  <div id="raiz"></div>

  <aside class="inspector">
    <h2>Por dentro del framework</h2>
    <p class="renders">Renders: <strong id="contador-renders">0</strong></p>
    <label><input type="checkbox" id="resaltar" checked> Resaltar los componentes en cada render</label>
    <div class="tabla-contenedor">
      <table>
        <thead><tr><th>#</th><th>Componente</th><th>Hook</th><th>Valor</th></tr></thead>
        <tbody id="tabla-hooks"></tbody>
      </table>
    </div>
    <p class="nota">Cada fila es una ranura del arreglo <code>hooks</code>. Los componentes la encuentran por su posición. En amarillo, las que cambiaron en el último render.</p>
  </aside>
</div>

<section class="codigo">
  <div class="pestanas">
    <button class="activa" data-fuente="codigo-framework">mini-react.js</button>
    <button data-fuente="codigo-app">app.js</button>
  </div>
  <pre id="fuente"></pre>
</section>

<script id="codigo-framework">
// =============================================================
// Mini React: reconstrucción total, sin DOM virtual
// =============================================================
const MiniReact = (() => {
  let componenteRaiz = null;     // la función App
  let contenedor = null;         // el nodo del DOM donde se dibuja
  const hooks = [];              // memoria que sobrevive entre renders
  let indice = 0;                // próxima ranura a usar en este render
  let componenteActual = null;   // solo para mostrar en el panel
  let efectosPendientes = [];    // efectos a correr después de dibujar
  let renderPendiente = false;   // ¿ya hay un render agendado?
  let cantidadRenders = 0;
  const oyentes = [];

  // ---------- Describir la interfaz ----------
  function createElement(tipo, props, ...hijos) {
    props = props ?? {};

    // Un componente es una función: la ejecutamos y devolvemos lo que dibuja.
    if (typeof tipo === "function") {
      const anterior = componenteActual;
      componenteActual = tipo.name;
      const resultado = tipo({ ...props, children: hijos });
      componenteActual = anterior;
      return resultado;
    }

    // Una etiqueta HTML: creamos el nodo real.
    const elemento = document.createElement(tipo);
    for (const [nombre, valor] of Object.entries(props)) {
      asignarPropiedad(elemento, nombre, valor);
    }
    for (const hijo of hijos.flat(Infinity)) {
      if (hijo === null || hijo === undefined || typeof hijo === "boolean") continue;
      elemento.append(hijo instanceof Node ? hijo : String(hijo));
    }
    return elemento;
  }

  function asignarPropiedad(elemento, nombre, valor) {
    if (nombre.startsWith("on") && typeof valor === "function") {
      elemento.addEventListener(nombre.slice(2).toLowerCase(), valor);
    } else if (nombre === "className") {
      elemento.className = valor;
    } else if (nombre === "style" && typeof valor === "object") {
      Object.assign(elemento.style, valor);
    } else if (typeof valor === "boolean") {
      elemento.toggleAttribute(nombre, valor);
    } else if (valor !== null && valor !== undefined) {
      elemento.setAttribute(nombre, valor);
    }
  }

  // ---------- Estado ----------
  function useState(valorInicial) {
    const i = indice++;
    if (hooks[i] === undefined) {
      hooks[i] = { tipo: "estado", componente: componenteActual, valor: valorInicial };
    }
    const ranura = hooks[i];

    function setValor(nuevoValor) {
      const valor = typeof nuevoValor === "function"
        ? nuevoValor(ranura.valor)
        : nuevoValor;
      if (Object.is(valor, ranura.valor)) return;   // no cambió: no hay nada que dibujar
      ranura.valor = valor;
      programarRender();
    }

    return [ranura.valor, setValor];
  }

  // ---------- Efectos ----------
  function useEffect(efecto, dependencias) {
    const i = indice++;
    const primeraVez = hooks[i] === undefined;
    if (primeraVez) {
      hooks[i] = { tipo: "efecto", componente: componenteActual, dependencias: undefined, limpieza: undefined };
    }
    const ranura = hooks[i];

    const cambiaron = primeraVez
      || dependencias === undefined
      || dependencias.some((dep, k) => !Object.is(dep, ranura.dependencias[k]));

    if (cambiaron) {
      ranura.dependencias = dependencias;
      efectosPendientes.push({ ranura, efecto });
    }
  }

  // ---------- Dibujar ----------
  function render(componente, elemento) {
    componenteRaiz = componente;
    contenedor = elemento;
    renderizar();
  }

  function programarRender() {
    if (renderPendiente) return;
    renderPendiente = true;
    queueMicrotask(renderizar);
  }

  function renderizar() {
    renderPendiente = false;
    indice = 0;

    // 1. Ejecutar todos los componentes y construir un DOM nuevo.
    const arbol = createElement(componenteRaiz);

    // 2. Tirar la pantalla anterior y poner la nueva.
    contenedor.replaceChildren(arbol);
    cantidadRenders++;

    // 3. Con la pantalla ya armada, correr los efectos.
    for (const { ranura, efecto } of efectosPendientes) {
      if (typeof ranura.limpieza === "function") ranura.limpieza();
      ranura.limpieza = efecto();
    }
    efectosPendientes = [];

    for (const oyente of oyentes) oyente({ renders: cantidadRenders, hooks });
  }

  // Instrumentación para la clase: avisa cada vez que termina un render.
  function alRenderizar(oyente) {
    oyentes.push(oyente);
  }

  return { createElement, useState, useEffect, render, alRenderizar };
})();
</script>

<script id="codigo-inspector">
// Panel lateral: no usa el framework, lo observa desde afuera.
const tablaHooks = document.getElementById("tabla-hooks");
const contadorRenders = document.getElementById("contador-renders");
let descripcionesAnteriores = [];

function describirRanura(ranura) {
  if (ranura.tipo === "estado") return JSON.stringify(ranura.valor);
  return `deps ${JSON.stringify(ranura.dependencias)}`;
}

MiniReact.alRenderizar(({ renders, hooks }) => {
  contadorRenders.textContent = renders;
  const descripciones = hooks.map(describirRanura);
  tablaHooks.innerHTML = hooks.map((ranura, i) => {
    const cambio = renders > 1 && descripciones[i] !== descripcionesAnteriores[i];
    return `
      <tr class="${ranura.tipo}${cambio ? " cambio" : ""}">
        <td>${i}</td>
        <td>${ranura.componente}</td>
        <td>${ranura.tipo}</td>
        <td>${descripciones[i]}</td>
      </tr>`;
  }).join("");
  descripcionesAnteriores = descripciones;
});

document.getElementById("resaltar").addEventListener("change", (evento) => {
  document.body.classList.toggle("resaltar", evento.target.checked);
});

const fuente = document.getElementById("fuente");
function mostrarFuente(id) {
  fuente.textContent = document.getElementById(id).textContent.trim();
  document.querySelectorAll("[data-fuente]").forEach((boton) => {
    boton.classList.toggle("activa", boton.dataset.fuente === id);
  });
}
document.querySelectorAll("[data-fuente]").forEach((boton) => {
  boton.addEventListener("click", () => mostrarFuente(boton.dataset.fuente));
});
</script>

<script id="codigo-app">
// =============================================================
// Conteo de tránsito en una esquina
// =============================================================
const h = MiniReact.createElement;
const { useState, useEffect } = MiniReact;

function formatearDuracion(segundos) {
  const horas = String(Math.floor(segundos / 3600)).padStart(2, "0");
  const minutos = String(Math.floor((segundos % 3600) / 60)).padStart(2, "0");
  const resto = String(segundos % 60).padStart(2, "0");
  return `${horas}:${minutos}:${resto}`;
}

// Flujo: cuántos vehículos pasarían en una hora al ritmo observado.
function calcularFlujo(cantidad, segundos) {
  if (segundos === 0) return "—";
  return `${Math.round((cantidad * 3600) / segundos)} v/h`;
}

// ---------- Componentes de presentación: no tienen estado ----------
function Dato({ titulo, valor }) {
  return h("div", { className: "componente dato" },
    h("p", { className: "titulo" }, titulo),
    h("p", { className: "valor" }, valor),
  );
}

function Cronometro({ segundos }) {
  return h("div", { className: "componente cronometro" }, formatearDuracion(segundos));
}

function Resumen({ total, segundos }) {
  const flujo = calcularFlujo(total, segundos);
  return h("section", { className: "componente resumen" },
    h(Dato, { titulo: "Total de vehículos", valor: total }),
    h(Dato, { titulo: "Flujo total", valor: flujo }),
  );
}

// ---------- El contador: cuenta por su cuenta y avisa al padre ----------
function Contador({ nombre, habilitado, alRegistrar }) {
  const [cantidad, setCantidad] = useState(0);

  // Al empezar una medición, el contador arranca de cero.
  useEffect(() => {
    if (habilitado) setCantidad(0);
  }, [habilitado]);

  function registrar() {
    setCantidad((c) => c + 1);   // el contador interno
    alRegistrar();               // el aviso al padre
  }

  // Todo el contador es el botón.
  return h("button", { className: "componente contador", disabled: !habilitado, onClick: registrar },
    h("span", { className: "nombre" }, nombre),
    h("span", { className: "cantidad" }, cantidad),
  );
}

// ---------- La aplicación: lleva el reloj y el contador global ----------
function App() {
  const [inicio, setInicio] = useState(null);       // null: detenido
  const [ahora, setAhora] = useState(Date.now());
  const [total, setTotal] = useState(0);            // el contador global

  const corriendo = inicio !== null;
  const segundos = corriendo ? Math.floor((ahora - inicio) / 1000) : 0;

  // Mientras se cuenta, el reloj avanza una vez por segundo.
  useEffect(() => {
    if (!corriendo) return;
    const id = setInterval(() => setAhora(Date.now()), 1000);
    return () => clearInterval(id);
  }, [corriendo]);

  function iniciar() {
    const instante = Date.now();
    setInicio(instante);
    setAhora(instante);
    setTotal(0);
  }

  function detener() {
    setInicio(null);
  }

  function registrarVehiculo() {
    setTotal((t) => t + 1);
  }

  // Las props que reciben los tres contadores.
  const comunes = { habilitado: corriendo, alRegistrar: registrarVehiculo };

  return h("main", { className: "componente app" },
    h("h1", null, "Conteo de tránsito"),
    h("div", { className: "control" },
      h("button", {
        className: "principal",
        title: corriendo ? "Detener" : "Iniciar",
        onClick: corriendo ? detener : iniciar,
      }, corriendo ? "⏹" : "▶"),
      h(Cronometro, { segundos }),
    ),
    h("div", { className: "contadores" },
      h(Contador, { nombre: "🏍️ Motos", ...comunes }),
      h(Contador, { nombre: "🚗 Autos", ...comunes }),
      h(Contador, { nombre: "🛻 Camionetas", ...comunes }),
    ),
    h(Resumen, { total, segundos }),
  );
}

MiniReact.render(App, document.getElementById("raiz"));
</script>

<script>
mostrarFuente("codigo-framework");
</script>
</body>
</html>
