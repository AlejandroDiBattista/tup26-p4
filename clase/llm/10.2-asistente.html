<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18231f;
        background: #f2f3ee;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 16px; }
      main { width: min(100%, 760px); height: min(840px, calc(100vh - 48px)); min-height: 500px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #dfe3dc; border-radius: 20px; background: #fff; box-shadow: 0 20px 60px #23382c12; }
      header { display: flex; align-items: center; gap: 13px; padding: 20px 24px; border-bottom: 1px solid #edf0eb; }
      .avatar { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 13px; background: #e8efe8; color: #35543f; font-size: 20px; }
      h1 { margin: 0; font-size: 1rem; letter-spacing: -.02em; }
      .subtitle { margin: 3px 0 0; color: #7b867e; font-size: .8rem; }
      .model { margin-left: auto; padding: 5px 9px; border: 1px solid #e5e9e3; border-radius: 999px; color: #69756c; font-size: .72rem; }
      #messages { flex: 1; overflow-y: auto; padding: 26px clamp(16px, 5vw, 42px); scroll-behavior: smooth; }
      .welcome { max-width: 430px; margin: 12vh auto 0; color: #758078; text-align: center; }
      .welcome strong { display: block; margin-bottom: 8px; color: #28382e; font-size: 1.25rem; letter-spacing: -.03em; }
      .message { display: flex; margin: 0 0 18px; }
      .message.user { justify-content: flex-end; }
      .bubble { max-width: min(85%, 520px); padding: 12px 15px; border: 1px solid #e9ece7; border-radius: 16px 16px 16px 5px; background: #f7f8f5; color: #29372f; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
      .user .bubble { border-color: #304c39; border-radius: 16px 16px 5px 16px; background: #304c39; color: #fff; }
      .markdown { white-space: normal; }
      .markdown > :first-child { margin-top: 0; }
      .markdown > :last-child { margin-bottom: 0; }
      .markdown p, .markdown ul, .markdown ol, .markdown blockquote { margin: .55em 0; }
      .markdown pre { max-width: 100%; overflow-x: auto; padding: 13px; border-radius: 10px; background: #18212b; }
      .markdown pre code { padding: 0; background: transparent; font-size: .83rem; }
      .markdown :not(pre) > code { padding: .12em .35em; border-radius: 5px; background: #e9eee9; font-size: .88em; }
      .markdown a { color: #315c43; text-underline-offset: 3px; }
      .user .bubble { white-space: pre-wrap; }
      .typing { color: #77847a; letter-spacing: 2px; }
      form { margin: 0 18px 18px; padding: 10px; border: 1px solid #dfe4dd; border-radius: 16px; background: #fff; box-shadow: 0 5px 18px #23382c0b; }
      textarea { display: block; width: 100%; min-height: 54px; max-height: 160px; padding: 8px 10px; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; line-height: 1.5; resize: vertical; }
      textarea::placeholder { color: #9aa49c; }
      .form-footer { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0 10px; }
      .hint { color: #929c94; font-size: .72rem; }
      button { display: grid; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 11px; background: #304c39; color: #fff; font-size: 1.1rem; cursor: pointer; transition: background .15s, transform .15s; }
      button:hover:not(:disabled) { transform: translateY(-1px); background: #42654d; }
      button:disabled { opacity: .45; cursor: wait; }
      @media (max-width: 520px) { body { padding: 0; } main { height: 100dvh; min-height: 0; border: 0; border-radius: 0; } header { padding: 16px; } #messages { padding: 20px 16px; } form { margin: 0 12px 12px; } .model { font-size: .66rem; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <script type="module">
      import { html, reactive } from "https://esm.sh/@arrow-js/core";
      import { marked } from "https://esm.sh/marked@15.0.12";
      import hljs from "https://esm.sh/highlight.js@11.11.1";
      import DOMPurify from "https://esm.sh/dompurify@3.2.6";

      function obtenerApiKey() {
        let clave = localStorage.getItem("OPENAI_API_KEY")?.trim();
        if (!clave) {
          clave = prompt("Ingresá tu API key de OpenAI:")?.trim();
          if (!clave) throw new Error("Se necesita una API key para continuar.");
          localStorage.setItem("OPENAI_API_KEY", clave);
        }
        return clave;
      }

      const API_URL = "https://api.openai.com/v1/chat/completions";
      const MODEL = "gpt-6-luna";
      const SYSTEM_PROMPT = "Respondé de forma clara y breve.";

      const estado = reactive({ mensajes: [], cargando: false, error: "" });

      async function consultar(mensajes) {
        const respuesta = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${obtenerApiKey()}`,
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              ...mensajes.map(({ role, content }) => ({ role, content })),
            ],
          }),
        });

        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error?.message ?? respuesta.statusText);
        return datos.choices[0].message.content;
      }

      function Mensaje(mensaje) {
        if (mensaje.role === "assistant") {
          return html`<article class="${'message ' + mensaje.role}"><div class="bubble markdown" .innerHTML="${() => mensaje.markdown}"></div></article>`;
        }
        return html`<article class="${'message ' + mensaje.role}"><div class="bubble">${() => mensaje.content}</div></article>`;
      }

      function renderMarkdown(texto) {
        const htmlMarkdown = marked.parse(texto, { gfm: true, breaks: true });
        return DOMPurify.sanitize(htmlMarkdown);
      }

      function resaltarCodigo() {
        document.querySelectorAll("#messages pre code").forEach((bloque) => {
          if (!bloque.dataset.highlighted) hljs.highlightElement(bloque);
        });
      }

      function atajoTeclado(evento) {
        if (evento.key !== "Enter" || evento.shiftKey || evento.isComposing) return;
        evento.preventDefault();
        evento.currentTarget.form.requestSubmit();
      }

      async function enviar(evento) {
        evento.preventDefault();
        const formulario = evento.target;
        const texto = formulario.elements.prompt.value.trim();
        if (!texto || estado.cargando) return;

        estado.error = "";
        estado.mensajes.push({ role: "user", content: texto });
        formulario.reset();
        estado.cargando = true;
        requestAnimationFrame(() => document.querySelector("#messages").scrollTop = document.querySelector("#messages").scrollHeight);

        try {
          const respuesta = await consultar(estado.mensajes);
          estado.mensajes.push({ role: "assistant", content: respuesta, markdown: renderMarkdown(respuesta) });
          requestAnimationFrame(resaltarCodigo);
        } catch (error) {
          estado.error = error.message;
        } finally {
          estado.cargando = false;
          requestAnimationFrame(() => document.querySelector("#messages").scrollTop = document.querySelector("#messages").scrollHeight);
        }
      }

      const vista = html`
        <header>
          <div class="avatar" aria-hidden="true">✳</div>
          <div><h1>Chat</h1><p class="subtitle">Conversación con IA</p></div>
          <span class="model">${MODEL}</span>
        </header>
        <section id="messages" aria-live="polite" aria-label="Mensajes de la conversación">
          ${() => estado.mensajes.length
            ? estado.mensajes.map(Mensaje)
            : html`<div class="welcome"><strong>¿En qué puedo ayudarte?</strong>Escribí un mensaje para comenzar la conversación.</div>`}
          ${() => estado.cargando ? html`<article class="message"><div class="bubble typing" aria-label="Generando respuesta">•••</div></article>` : ""}
          ${() => estado.error ? html`<article class="message"><div class="bubble">Error: ${() => estado.error}</div></article>` : ""}
        </section>
        <form @submit="${enviar}">
          <textarea name="prompt" required aria-label="Mensaje" placeholder="Escribí tu mensaje…" @keydown="${atajoTeclado}"></textarea>
          <div class="form-footer">
            <span class="hint">Enter para enviar · Shift + Enter para nueva línea</span>
            <button type="submit" :disabled="${() => estado.cargando}" aria-label="Enviar mensaje">↑</button>
          </div>
        </form>
      `;

      vista(document.querySelector("#app"));
    </script>
  </body>
</html>
