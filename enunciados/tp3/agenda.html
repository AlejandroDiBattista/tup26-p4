<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda</title>
    <style>
      body {
        margin: 0;
        padding: 32px 20px;
        font: 16px sans-serif;
        background: #f5f6f4;
      }
      main {
        width: 1104px;
        max-width: 100%;
        margin: auto;
      }
      h1 {
        margin: 0 0 24px;
      }
      ul {
        display: grid;
        grid-template-columns: repeat(3, 360px);
        justify-content: center;
        gap: 12px;
        padding: 0;
        list-style: none;
      }
      li {
        min-width: 0;
        padding: 20px;
        border: 1px solid #d9ded9;
        border-radius: 16px;
        background: white;
        text-align: center;
      }
      @media (max-width: 1120px) {
        ul {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        ul {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { html, reactive, watch } from "https://esm.sh/@arrow-js/core";
      import alumnos from "./alumnos.json" with { type: "json" };
      const STORAGE_KEY = "agenda-alumnos";
      function crearFormulario() {
        return {
          id: null,
          apellido: "",
          nombre: "",
          legajo: "",
          comision: "",
          telefono: "",
          github: "",
          favorito: false,
        };
      }
      function cargarDatos() {
        const datosGuardados = localStorage.getItem(STORAGE_KEY);
        if (datosGuardados) {
          try {
            return JSON.parse(datosGuardados);
          } catch (error) {
            console.error("Error al leer localStorage:", error);
          }
        }
        const datosIniciales = alumnos.map((alumno) => ({
          ...alumno,
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(datosIniciales));
        return datosIniciales;
      }
      const estado = reactive({
        alumnos: cargarDatos(),
        busqueda: "",
        editando: false,
        formulario: crearFormulario(),
        error: "",
      });
      function guardarDatos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(estado.alumnos));
      }
      watch(
        () => estado.alumnos,
        () => guardarDatos(),
      );
      function normalizar(texto) {
        return texto
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }
      function ordenarAlumnos(lista) {
        return [...lista].sort((a, b) => {
          if (a.favorito !== b.favorito) {
            return a.favorito ? -1 : 1;
          }
          const apellidoA = normalizar(a.apellido);
          const apellidoB = normalizar(b.apellido);
          if (apellidoA !== apellidoB) {
            return apellidoA.localeCompare(apellidoB);
          }
          const nombreA = normalizar(a.nombre);
          const nombreB = normalizar(b.nombre);
          return nombreA.localeCompare(nombreB);
        });
      }
    </script>
  </body>
</html>
