<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda</title>
  <style>
    :root {
      --bg: #f5f6f4;
      --card-bg: #ffffff;
      --border: #d9ded9;
      --text: #1f2937;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --star-active: #eab308;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 24px 20px 48px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    main#app {
      width: 1104px;
      max-width: 100%;
      margin: 0 auto;

      header.agenda-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;

        h1 {
          font-size: 2rem;
          font-weight: 700;
        }

        .actions {
          display: flex;
          align-items: center;
          gap: 12px;
          flex: 1;
          max-width: 480px;
          justify-content: flex-end;

          input[type="search"] {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;

            &:focus {
              outline: 2px solid var(--primary);
              border-color: transparent;
            }
          }
        }
      }

      section.grid-alumnos {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;

        @media (max-width: 900px) {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (max-width: 600px) {
          grid-template-columns: 1fr;
        }
      }

      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 48px 16px;
        color: var(--text-muted);
      }
    }

    article.card-alumno {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        .nombre-alumno {
          font-size: 1.15rem;
          font-weight: 600;
        }

        .btn-fav {
          background: none;
          border: none;
          cursor: pointer;
          font-size: 1.4rem;
          color: #cbd5e1;
          line-height: 1;

          &.activo {
            color: var(--star-active);
          }
        }
      }

      address {
        font-style: normal;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.9rem;
        color: var(--text-muted);

        p strong {
          color: var(--text);
        }

        a {
          color: var(--primary);
          text-decoration: none;
        }
      }

      footer {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--border);
        padding-top: 10px;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive } from 'https://esm.sh/@arrow-js/core';
    import alumnosIniciales from './alumnos.json' with { type: 'json' };

    const state = reactive({
      alumnos: Array.isArray(alumnosIniciales) ? alumnosIniciales : [],
      busqueda: ''
    });

    function toggleFavorito(id) {
      const idx = state.alumnos.findIndex(a => a.id === id);
      if (idx !== -1) {
        state.alumnos[idx].favorito = !state.alumnos[idx].favorito;
        state.alumnos = [...state.alumnos];
      }
    }

    function obtenerAlumnos() {
      const q = state.busqueda.trim().toLowerCase();
      const filtrados = state.alumnos.filter(a => {
        if (!q) return true;
        return `${a.nombre} ${a.apellido} ${a.legajo} ${a.telefono}`.toLowerCase().includes(q);
      });

      return filtrados.sort((a, b) => {
        if (a.favorito && !b.favorito) return -1;
        if (!a.favorito && b.favorito) return 1;
        return (a.apellido || '').localeCompare(b.apellido || '', 'es', { sensitivity: 'base' });
      });
    }

    const App = html`
      <header class="agenda-header">
        <h1>Agenda</h1>
        <div class="actions">
          <input
            type="search"
            placeholder="Buscar alumnos..."
            value="${() => state.busqueda}"
            @input="${(e) => (state.busqueda = e.target.value)}"
          />
        </div>
      </header>

      <section class="grid-alumnos">
        ${() => {
          const list = obtenerAlumnos();
          if (list.length === 0) return html`<p class="empty-state">No hay alumnos para mostrar.</p>`;
          return list.map(a => html`
            <article class="card-alumno">
              <header>
                <span class="nombre-alumno">${a.nombre} <b>${a.apellido}</b></span>
                <button
                  type="button"
                  class="${() => `btn-fav ${a.favorito ? 'activo' : ''}`}"
                  @click="${() => toggleFavorito(a.id)}"
                >
                  ${() => (a.favorito ? '★' : '☆')}
                </button>
              </header>
              <address>
                <p><strong>Teléfono:</strong> ${a.telefono || '—'}</p>
                <p><strong>GitHub:</strong> <a href="https://github.com/${a.github}">@${a.github}</a></p>
              </address>
              <footer>
                <span><strong>Comisión:</strong> ${a.comision || '—'}</span>
                <span><strong>Legajo:</strong> ${a.legajo || '—'}</span>
              </footer>
            </article>
          `);
        }}
      </section>
    `;

    App(document.getElementById('app'));
  </script>
</body>
</html>
