<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda</title>
    <style>
      body {
        margin: 0;
        padding: 32px 20px;
        font: 16px sans-serif;
        background: #f5f6f4;
      }
      main {
        width: 1104px;
        max-width: 100%;
        margin: auto;
      }
      h1 {
        margin: 0 0 24px;
      }
      ul {
        display: grid;
        grid-template-columns: repeat(3, 360px);
        justify-content: center;
        gap: 12px;
        padding: 0;
        list-style: none;
      }
      li {
        min-width: 0;
        padding: 20px;
        border: 1px solid #d9ded9;
        border-radius: 16px;
        background: white;
        text-align: center;
      }
      @media (max-width: 1120px) {
        ul {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        ul {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { html, reactive, watch } from "https://esm.sh/@arrow-js/core";
      import alumnos from "./alumnos.json" with { type: "json" };
      const STORAGE_KEY = "agenda-alumnos";
      function crearFormulario() {
        return {
          id: null,
          apellido: "",
          nombre: "",
          legajo: "",
          comision: "",
          telefono: "",
          github: "",
          favorito: false,
        };
      }
      function cargarDatos() {
        const datosGuardados = localStorage.getItem(STORAGE_KEY);
        if (datosGuardados) {
          try {
            return JSON.parse(datosGuardados);
          } catch (error) {
            console.error("Error al leer localStorage:", error);
          }
        }
        const datosIniciales = alumnos.map((alumno) => ({
          ...alumno,
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(datosIniciales));
        return datosIniciales;
      }
      const estado = reactive({
        alumnos: cargarDatos(),
        busqueda: "",
        editando: false,
        formulario: crearFormulario(),
        error: "",
      });
      function guardarDatos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(estado.alumnos));
      }
      watch(
        () => estado.alumnos,
        () => guardarDatos(),
      );
      function normalizar(texto) {
        return texto
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }
      function ordenarAlumnos(lista) {
        return [...lista].sort((a, b) => {
          if (a.favorito !== b.favorito) {
            return a.favorito ? -1 : 1;
          }
          const apellidoA = normalizar(a.apellido);
          const apellidoB = normalizar(b.apellido);
          if (apellidoA !== apellidoB) {
            return apellidoA.localeCompare(apellidoB);
          }
          const nombreA = normalizar(a.nombre);
          const nombreB = normalizar(b.nombre);
          return nombreA.localeCompare(nombreB);
        });
      }
      function alumnosVisibles() {
        const texto = normalizar(estado.busqueda.trim());
        let lista = estado.alumnos;
        if (texto) {
          lista = lista.filter((alumno) => {
            return [
              alumno.apellido,
              alumno.nombre,
              alumno.legajo,
              alumno.comision,
              alumno.telefono,
              alumno.github,
            ].some((valor) => normalizar(String(valor)).includes(texto));
          });
        }
        return ordenarAlumnos(lista);
      }

      function cambiarFavorito(id) {
        const alumno = estado.alumnos.find((alumno) => alumno.id === id);
        if (!alumno) return;
        alumno.favorito = !alumno.favorito;
        guardarDatos();
      }

      function abrirAgregar() {
        estado.editando = false;
        estado.formulario = crearFormulario();
        estado.error = "";
        document.getElementById("dialog-alumno").showModal();
      }

      function abrirEditar(alumno) {
        estado.editando = true;
        estado.formulario = {
          ...alumno,
        };
        estado.error = "";
        document.getElementById("dialog-alumno").showModal();
      }

      function cerrarDialog() {
        estado.error = "";
        document.getElementById("dialog-alumno").close();
      }

      function validar() {
        const formulario = estado.formulario;
        if (!formulario.apellido.trim()) {
          return "El apellido es obligatorio.";
        }
        if (!formulario.nombre.trim()) {
          return "El nombre es obligatorio.";
        }
        if (!formulario.legajo.trim()) {
          return "El legajo es obligatorio.";
        }
        if (!formulario.comision.trim()) {
          return "La comisión es obligatoria.";
        }
        if (!formulario.telefono.trim()) {
          return "El teléfono es obligatorio.";
        }
        if (!formulario.github.trim()) {
          return "El GitHub es obligatorio.";
        }
        return "";
      }

      function guardar(event) {
        event.preventDefault();
        const error = validar();
        if (error) {
          estado.error = error;

          return;
        }
        const datos = {
          apellido: estado.formulario.apellido.trim(),
          nombre: estado.formulario.nombre.trim(),
          legajo: estado.formulario.legajo.trim(),
          comision: estado.formulario.comision.trim(),
          telefono: estado.formulario.telefono.trim(),
          github: estado.formulario.github.trim(),
        };

        if (!estado.editando) {
          const ids = estado.alumnos.map((alumno) => Number(alumno.id));
          const nuevoId = Math.max(...ids, 0) + 1;

          estado.alumnos.push({
            id: nuevoId,
            ...datos,
            favorito: false,
          });
        } else {
          const indice = estado.alumnos.findIndex(
            (alumno) => alumno.id === estado.formulario.id,
          );

          if (indice !== -1) {
            estado.alumnos[indice] = {
              ...estado.alumnos[indice],
              ...datos,
            };
          }
        }
        guardarDatos();
        cerrarDialog();
      }

      function eliminar() {
        if (!estado.editando) return;
        const id = estado.formulario.id;
        estado.alumnos = estado.alumnos.filter((alumno) => alumno.id !== id);
        guardarDatos();
        cerrarDialog();
      }

      function manejarTeclado(event, alumno) {
        if (event.key === "Enter") {
          event.preventDefault();

          abrirEditar(alumno);
        }

        if (event.key === " ") {
          event.preventDefault();
          cambiarFavorito(alumno.id);
        }
      }

      function tarjeta(alumno) {
        return html`
          <li
            class="alumno-card"
            tabindex="0"
            @keydown="${(event) => manejarTeclado(event, alumno)}"
            @click="${(event) => {
              if (event.target.closest(".favorito")) {
                return;
              }

              abrirEditar(alumno);
            }}"
          >
            <article>
              <button
                type="button"
                class="favorito"
                @click="${(event) => {
                  event.stopPropagation();

                  cambiarFavorito(alumno.id);
                }}"
                aria-label="Cambiar favorito"
              >
                ${() => (alumno.favorito ? "★" : "☆")}
              </button>

              <div class="alumno-info">
                <h3>
                  ${alumno.nombre}
                  <b>${alumno.apellido}</b>
                </h3>

                <p>
                  <strong>Legajo:</strong>
                  ${alumno.legajo}
                </p>

                <p>
                  <strong>Comisión:</strong>
                  ${alumno.comision}
                </p>

                <address>
                  <p>
                    <strong>Teléfono:</strong>
                    ${alumno.telefono}
                  </p>

                  <p>
                    <strong>GitHub:</strong>

                    <a
                      href="${alumno.github}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ${alumno.github}
                    </a>
                  </p>
                </address>
              </div>
              ${() => (alumno.favorito ? html`<small>Favorito</small>` : "")}
            </article>
          </li>
        `.key(alumno.id);
      }
      const vista = html`
        <header>
          <div>
            <h1>Alumnos</h1>
            <p>Agenda de alumnos</p>
          </div>

          <button type="button" @click="${abrirAgregar}">
            + Agregar alumno
          </button>
        </header>
        <section>
          <div class="busqueda">
            <label for="buscar"> Buscar alumno </label>
            <input
              id="buscar"
              type="search"
              placeholder="Buscar por nombre, apellido, legajo..."
              .value="${() => estado.busqueda}"
              @input="${(event) => (estado.busqueda = event.target.value)}"
            />
          </div>
          <ul>
            ${() => {
              const lista = alumnosVisibles();
              if (!lista.length) {
                return html`
                  <li class="sin-resultados">
                    <p>No se encontraron alumnos.</p>
                  </li>
                `;
              }
              return lista.map((alumno) => tarjeta(alumno));
            }}
          </ul>
        </section>
        <dialog id="dialog-alumno">
          <form @submit="${guardar}">
            <header>
              <h2>
                ${() => (estado.editando ? "Editar alumno" : "Agregar alumno")}
              </h2>
            </header>
            <div class="formulario">
              <label>
                Apellido
                <input
                  type="text"
                  .value="${() => estado.formulario.apellido}"
                  @input="${(event) =>
                    (estado.formulario.apellido = event.target.value)}"
                />
              </label>
              <label>
                Nombre
                <input
                  type="text"
                  .value="${() => estado.formulario.nombre}"
                  @input="${(event) =>
                    (estado.formulario.nombre = event.target.value)}"
                />
              </label>
              <label>
                Legajo
                <input
                  type="text"
                  .value="${() => estado.formulario.legajo}"
                  @input="${(event) =>
                    (estado.formulario.legajo = event.target.value)}"
                />
              </label>
              <label>
                Comisión
                <input
                  type="text"
                  .value="${() => estado.formulario.comision}"
                  @input="${(event) =>
                    (estado.formulario.comision = event.target.value)}"
                />
              </label>

              <label>
                Teléfono
                <input
                  type="text"
                  .value="${() => estado.formulario.telefono}"
                  @input="${(event) =>
                    (estado.formulario.telefono = event.target.value)}"
                />
              </label>
              <label>
                GitHub
                <input
                  type="url"
                  .value="${() => estado.formulario.github}"
                  @input="${(event) =>
                    (estado.formulario.github = event.target.value)}"
                />
              </label>
            </div>
            ${() =>
              estado.error
                ? html` <p class="error">${() => estado.error}</p> `
                : ""}
            <footer>
              ${() =>
                estado.editando
                  ? html`
                      <button type="button" @click="${eliminar}">
                        Eliminar
                      </button>
                    `
                  : ""}
              <button type="button" @click="${cerrarDialog}">Cancelar</button>
              <button type="submit">Guardar</button>
            </footer>
          </form>
        </dialog>
        <footer>
          <p>Agenda de alumnos</p>
        </footer>
      `;
      vista(app);
    </script>
  </body>
</html>
