<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <style>
    body { font: 16px sans-serif; }
    ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; list-style: none;}
    li { padding: 8px; border: 0.1px solid #ccc;  border-radius: 4px; }
  </style>
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { html, reactive, watch } from 'https://esm.sh/@arrow-js/core'
    import alumnos from './alumnos.json' with { type: 'json' }

    const app = document.getElementById('app')
    html`
    <h1>Alumnos</h1>
    <ul>${alumnos.map(a => html`<li>${a.nombre} <b>${a.apellido}</b></li>`)}</ul>
    `(app)
  </script>
</body>
</html>
